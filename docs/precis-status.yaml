  - id: '15'
    name: Wear (visible item degradation)
    summary: >
      Optional wear field on ItemInstance + maxUses on ItemDefinition.
      Visible alpha decay across an item's lifetime. At wear=1.0 the item is
      removed — no fanfare, empty grid cell is the eulogy. Mechanic teaches
      impermanence at the item layer as grammar for the steward's own
      Voynich drift in #4. Renewal loops replace stockpile loops.
    size: M
    depends_on: []
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v4 thinktank round 1 (2026-05-19). Visible wear per Tyler — "it's a
      game about noticing. you notice your net not working as great
      anymore." Continuous alpha decay is the default; late-threshold-only
      is a documented escape hatch if playtesting argues for it. Per session
      ~5-10% of player actions touch wearing items; the rest are ambient.
      Not Don't Starve — wear is a presence, not a pressure. Cosmology lock
      (v4): heat death is the antagonist; tending is the verb.

  - id: '16'
    name: The tenure ends (lineage handoff)
    summary: >
      The game has an ending and the ending is not a death. The steward's
      drift reaches threshold (state.player.cosmologicalDrift fully
      Voynich-registered), the tenure closes, the save file is preserved as
      a predecessor record the next steward inherits. Multiplayer is
      reframed as lineage — other players are predecessors and successors,
      never coop partners or adversaries.
    size: L
    depends_on: ['4', '10']
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v4 thinktank round 2 (2026-05-19). Cosmology lock — heat death is the
      antagonist; tending is the verb; the tenure is the unit; the lineage
      is the medium. The cloud Gron carries is the inter-tenure persistence
      layer for bees (round 5); what the player hands forward is, in part,
      the bees they kept alive. Open questions deferred to spec: what does
      a predecessor record contain (Calla: previous steward's manual as
      next steward finds it, one readable predecessor name); is the player
      ever named in someone else's manual (Astrid: yes, late, by
      recognition); ending trigger (Calla: cosmologicalDrift threshold —
      derives from existing state, free). Forecloses adversarial
      multiplayer permanently.

