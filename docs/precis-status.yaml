  - id: '22'
    name: Named regions + chronicle events (the world speaks of itself)
    summary: >
      The prairie acquires named regions (the south ridge, the village, the
      west pond, the cave mouth) detected at genesis time from terrain
      features and meteorite placements. World-state transitions emit
      "chronicle events" — past-tense sentences bound to templates and
      filled from world state. "The line passed the village in the fourth
      winter." "The clover didn't grow on the south ridge." Events surface
      in three places only — the end-of-Revery summary (#4), per-region /
      per-species threads in the naturalist's manual (#6, shipped), and as
      predecessor lines in the lineage record (#16). Never a running log.
    size: L
    depends_on: []
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v4 thinktank round 6 (2026-05-19). Three operating constraints:
      (1) events are emitted by world-state transitions, not by player
      actions — the player did nothing to trigger the sentence, the world
      did; (2) sentences are template-bound with slots filled from world
      state, every word corresponds to a fact the player can verify by
      walking to the place; (3) the sentences never accumulate in a feed —
      we just deleted the activity log, we are not reinstating it as a
      story log. **Negative events are the language of entropy.** Half the
      templates must be negative — the prairie names what failed to happen.
      A game that can only narrate what did happen is a logbook; a game
      that can narrate what did not happen is literature. Heat death is
      the antagonist; the prairie's voice should know how to name what it
      has lost. Region detection is the largest sub-task (genesis-time
      pass, stable across a tenure). Template registry is small once
      regions exist. Cascades into #4 (Revery summary becomes the
      headline surface), #6 (per-region/species chronicle threads), and
      #16 (inter-tenure predecessor record).

  - id: '23'
    name: Time-lapse camera (analog 35mm field instrument)
    summary: >
      A recovered analog field camera. Player places it on a tile, chooses
      a span (season, year, Revery), walks away. The camera sparsely
      records the tile and its 8-neighborhood whenever something changes —
      stage advances, entity arrival, terrain mutation. Returning to the
      camera and interacting opens a modal ASCII playback overlay that
      re-renders the recorded frames through the engine's existing tile
      pass. Film is a separate inventory item found in ruins (N-INFO 400
      tubes); loading film into the camera is a recipe. Film cannot be
      overwritten — exposed frames are exposed. When film is exhausted the
      camera is decoration. Wears like other tools (#15).
    size: M
    depends_on: ['15']
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v4 thinktank round 7 (2026-05-20). Tyler's breakthrough — FromSoft
      games are materialist (spells are scrolls, abilities are talismans,
      the inventory IS the character sheet). Doctrine v4 amended to five
      lines; the fifth line is "the inventory is the character sheet."
      The camera answers the ASCII-observation tension: a clover growing
      in real time over forty minutes is not pleasurable to watch in any
      rendering, especially not ASCII. The camera is the steward's
      delegate of attention across time the steward cannot personally
      attend. Visual language inherits entirely from the gel-band scan
      result (src/components/GelBandView.tsx) — edge printing
      (NORTHERN-INFORMATION · 8-char identity · N-INFO 400), reticle crop
      corners, dim-yellow palette pulled from bg-bee, monospace font.
      Playback overlay reads as a developed contact sheet from the same
      lab. Film grain in playback is a new render pass with dim
      per-frame jitter using the same cellNoise primitive the gel uses
      (worth extracting to src/engine/render/jitter.ts as a follow-up
      refactor — the same hash will drive gel jitter, Voynich offsets,
      and film grain; one function carries the game's visual signature).
      Sparse frame storage keeps memory bounded by interestingness — a
      boring patch produces light files. Open questions deferred to
      spec: how many cameras per tenure (lean: rare — one or two per
      run); span options (lean: season + Revery as the two MVP choices);
      where the camera lives in the inventory grid (lean: 2x2, weight
      matches cosmological weight). Sequencing argument: ships after #15
      (wear substrate in place) and benefits massively from being before
      or alongside #17 (camera is the primary reading instrument for
      autonomous spread). The camera also makes #19 (soil depletion)
      legible. Lineage handoff in #16 inherits cameras + footage as
      first-class predecessor evidence.

