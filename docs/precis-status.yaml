  - id: '16'
    name: The tenure ends (lineage handoff)
    summary: >
      The game has an ending and the ending is not a death. The steward's
      drift reaches threshold (state.player.cosmologicalDrift fully
      Voynich-registered), the tenure closes, the save file is preserved as
      a predecessor record the next steward inherits. Multiplayer is
      reframed as lineage — other players are predecessors and successors,
      never coop partners or adversaries.
    depends_on: ['4', '10']
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v4 thinktank round 2 (2026-05-19). Cosmology lock — heat death is the
      antagonist; tending is the verb; the tenure is the unit; the lineage
      is the medium. The cloud Gron carries is the inter-tenure persistence
      layer for bees (round 5); what the player hands forward is, in part,
      the bees they kept alive. Open questions deferred to spec: what does
      a predecessor record contain (Calla: previous steward's manual as
      next steward finds it, one readable predecessor name); is the player
      ever named in someone else's manual (Astrid: yes, late, by
      recognition); ending trigger (Calla: cosmologicalDrift threshold —
      derives from existing state, free). Forecloses adversarial
      multiplayer permanently.


      v6 thinktank rounds 3, 4, 5 (2026-05-22). The tenure now has symmetric
      bookends — the steward begins inside the little house (per `#34`) and
      ends there (this item). _The steward begins where the steward will
      end._ The girl is the witness at both bookends. The Kojima-shaped
      input hijack rejected for the annual summons in Round 4 is reserved
      here: the final tenure-end Revery is the natural home for the
      body-betrayal gesture (WASD overridden, sleepwalking-home, screen
      darkening). Spec author considers whether the route is to the little
      house (lean) or to a different terminal tile. Predecessor cameras
      (`#23`, `#24`) may carry the final Revery as documentation if any are
      placed.


      v6 thinktank round 6 (2026-05-22). The tenure handoff includes a
      bed-knot transfer mechanic: the previous steward's final Revery
      Knot (`#36`) remains on the bed at tenure close — it was never moved
      to the root cellar (`#37`), because the steward did not wake from
      that Revery. On the new tenure's open (`#34`), Emily takes the old
      Knot down and hangs it last in the cellar, in the row of the
      previous steward's years. The new steward wakes next to a Knot
      they did not earn. _The cosmology hands the bed forward._

