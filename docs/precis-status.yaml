      Player encounters predecessor cameras in the world before they
      ever find their own. Some predecessor cameras have film remaining
      (gifts); some are exhausted (memorials). Footage may show species
      no longer present, geographies that have shifted, names the player
      sees nowhere else. Reuses the camera substrate from #23 — same
      Recording[] shape, same playback overlay, same renderer — plus a
      predecessor field on TimeLapseCamera ({ stewardName, tenure } |
      null). When real-player predecessor data eventually flows in from
      multiplayer (#16), seeded predecessors remain as the prairie's
      oldest layer. The player will never know which were people and
      which were procedural; the cosmology says that is exactly right.
