      sleeping; the root cellar is where what survived the harvest
      sleeps. The cellar is the Revery's architectural cognate. _Above
      sleeps the present; below sleeps the past._


      Load-bearing fact: **very long and very empty**. A long, empty
      cellar reads as _the architecture predates every steward who has
      used it_. The cosmology built the cellar for a count of years no
      lineage has reached. _Heat death is the antagonist; the cellar is
      heat death rendered as architecture._


      Single-player lock: the cellar starts empty. No procedural
      predecessor Knots, no multiplayer lineage Knots, no pre-population.
      The first hook the new steward fills is the autumn's first Knot.
      Multiplayer / procedural predecessor pre-population defers to a
      future round when those mechanics ship. The single-player
      cosmological reading is sharper for being unambiguous: _the
      steward is the first; the cellar's emptiness is honest._


      Engine substrate: new zone (sibling to the cave); bulkhead-door
      tile placed outside the little house at genesis; new tile type for
      hooks (empty vs Knot-bearing render distinction); new state field
      `state.reveryKnotsInCellar: ReveryKnotEntry[]` capturing year and
      per-year flavor data. Emily's hang-after-Revery behavior runs at
