  - id: '17'
    name: Autonomous flora spread + bee+clover ceremony
    summary: >
      All three flora species spread on their own. Clover via stolons (slow,
      adjacent, dirt-only, season-gated). Wildflower via pollinators (gated on
      #7). Tall grass via rhizomes. Genetic traits (#3) propagate through
      spread, so a patch carries the lineage of its seed. Bee+clover combine
      is rewritten as a slow radial wave (~7-9 tile radius, ~100-250 tiles per
      cast) and the bee binds to the patch as its pollinator for the patch's
      life. One bee per patch, ever.
    size: M
    depends_on: []
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v4 thinktank round 4 (2026-05-19). Touchstone: Emily Dickinson — "To
      make a prairie it takes a clover and a bee, and revery. The revery
      alone will do, if bees are few." Stewardship-time growth is slow and
      autonomous; Revery-time growth is the massive jump (#4). The player's
