  - id: '13'
    name: Emergent Angels
    summary: >
      Rewire angel spawning so the angel's hash and aura derive from the prairie's
      current flora identities, not from a 90s timer + stewardName + spawn coords.
      The angel becomes a witness of the ecology as it exists at that moment.
      PMs need to discuss before this is sequenced.
    size: M/L
    depends_on: ['3']
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      Discussion needed. Open questions: threshold trigger (cumulative diversity,
      sudden ecological shift, specific trait configurations, or hybrid
      weather×ecology); hash composition (whole-prairie sample, spatial sample,
      or temporal-weighted); aura kind derivation (does aura also derive from
      ecology, opening new aura kinds as new species establish); fallback for
      barren prairies.

      Design intent — angel SHA outputs should be treated like wildcards or
      egregoric adaptors. Very powerful. Maybe only use once. A canto an angel
      speaks is not lore; it is a key. Single-use, irrevocable, and potent enough
      that the player thinks before using it. Mechanics TBD — this is the seed
      of the idea.

  - id: '17'
    name: Autonomous flora spread + bee+clover ceremony
    summary: >
      All three flora species spread on their own. Clover via stolons (slow,
      adjacent, dirt-only, season-gated). Wildflower via pollinators (gated on
      #7). Tall grass via rhizomes. Genetic traits (#3) propagate through
      spread, so a patch carries the lineage of its seed. Bee+clover combine
      is rewritten as a slow radial wave (~7-9 tile radius, ~100-250 tiles per
      cast) and the bee binds to the patch as its pollinator for the patch's
      life. One bee per patch, ever.
    size: M
    depends_on: []
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v4 thinktank round 4 (2026-05-19). Touchstone: Emily Dickinson — "To
      make a prairie it takes a clover and a bee, and revery. The revery
      alone will do, if bees are few." Stewardship-time growth is slow and
      autonomous; Revery-time growth is the massive jump (#4). The player's
      hand is a punctuation, not the engine. Bee+clover materials are
      recovered from ruins (precis-5, shipped), not gifted by NPCs — Moab
      has no gift field per src/engine/characters.ts. Open: patch identity
      and merging behavior when spread fronts touch; per-species spread
      rates; perf gate on flora lifecycle tick (~5000 active tiles target).
      Splittable into substrate-spec + ceremony-spec if the spec author
      prefers.

