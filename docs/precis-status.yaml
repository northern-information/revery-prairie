  - id: '37'
    name: The root cellar
    summary: >
      The little house (`#33`) gains a root cellar with an alternate
      bulkhead entrance outside the house. The cellar is its own zone,
      sibling to the cave (`zoneTransition.ts` substrate). Footprint: a
      corridor 3 tiles wide, very long, where the existing fog-of-war
      rendering fades the cellar's far end into unreadability before the
      steward can walk to it. Hooks line the ceiling at regular
      intervals along the corridor's length. Revery Knots (`#36`)
      accumulate one per year, hung by Emily after each Revery completes.
      The cellar is the prairie's archive of every year the steward has
      lived through. The cellar is also the in-prairie reading surface
      for chronicle events from `#22` — hung Knots carry that year's
      chronicle sentences as a hover or interact surface.
    depends_on: ['33', '36']
