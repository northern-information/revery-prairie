    summary: >
      Behavior change to egregore.ts spread logic (already shipped in
      RP-8b). When egregoric spread is allowed by existing throttle rules
      and the candidate tile is occupied by native flora, the native
      flora is consumed rather than displaced; the tile becomes
      egregoric at its destination stage. Replaces the implicit
      "spread into empty tiles only" model. The prairie's substance is
      metabolized by the egregore, not merely overtaken.
