    notes: >
      v4 thinktank round 8 (2026-05-20). Names the rule —
      "the egregore is the prairie's heat death rendered as appetite."
      Depends on RP-23 (camera) rather than purely on RP-8b (shipped)
      because the cosmic-horror payoff of metabolism requires found
      footage to land — the camera is how the player learns the
      consumption happened. Calla's lock: metabolic consumption should
      be visible only via camera footage, never via toast or notification
      (the camera is how horror is learned; otherwise the player learns
