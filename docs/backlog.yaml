    notes: >
      v9 thinktank round 1 (2026-05-23). The cellar transforms from
      memorial to revelation — across years the steward learns what
      they missed (a wildfire on the northwest ridge they never
      reached, an egregore that crept on the southern slope
      unobserved). The revelation always arrives later, in a future
      year's cellar visit; never in the year of the event. Witness
      provenance is internal — the cellar reads events in the
      prairie's voice, not "(coyote saw)" attribution. The cellar's
      richness is not a function of the steward's diligence: Emily
      watched, the coyote roamed, the egregore was; the cellar
