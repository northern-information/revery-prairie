      Lint guard reminder: the word "invasive" is banned player-facing
      (CI guard); "metabolic" is the room's word internally, the
      player-facing register continues to favor showing-not-naming.

  - id: 'RP-27'
    name: Strip genesis epoch commentary; reframe as reverse deep-time projection
    summary: >
