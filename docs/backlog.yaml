      coat); the `#49` id vacates the same way `#12` did in v7 R1.
      _The Knot is the camera that does not know. The cellar is a
      row of cameras, one per year, each one pointed back at the
      prairie that made it._ Delta's line for the round: _the
      cellar tells the steward what they missed across the unseen._
      Open at spec: coyote wander-trail granularity (lean: every
