  - id: 'RP-22'
    name: Named regions + chronicle events (the world speaks of itself)
    summary: >
      The prairie acquires named regions (the south ridge, the village, the
      west pond, the cave mouth) detected at genesis time from terrain
      features and meteorite placements. World-state transitions emit
      "chronicle events" — past-tense sentences bound to templates and
      filled from world state. "The line passed the village in the fourth
      winter." "The clover didn't grow on the south ridge." Events surface
      in three places only — the end-of-Revery summary (RP-4), per-region /
      per-species threads in the naturalist's manual (RP-6, shipped), and as
      predecessor lines in the lineage record (RP-16). Never a running log.
    depends_on: []
    status: shipped
    spec: harness/specs/RP-22-named-regions-chronicle.yaml
    plan: harness/plans/RP-22-named-regions-chronicle.yaml
    pr: https://github.com/northern-information/revery-prairie/pull/472
    notes: >
      v4 thinktank round 6 (2026-05-19). Three operating constraints:
      (1) events are emitted by world-state transitions, not by player
      actions — the player did nothing to trigger the sentence, the world
      did; (2) sentences are template-bound with slots filled from world
      state, every word corresponds to a fact the player can verify by
      walking to the place; (3) the sentences never accumulate in a feed —
      we just deleted the activity log, we are not reinstating it as a
      story log. **Negative events are the language of entropy.** Half the
      templates must be negative — the prairie names what failed to happen.
      A game that can only narrate what did happen is a logbook; a game
      that can narrate what did not happen is literature. Heat death is
      the antagonist; the prairie's voice should know how to name what it
      has lost. Region detection is the largest sub-task (genesis-time
      pass, stable across a tenure). Template registry is small once
      regions exist. Cascades into RP-4 (Revery summary becomes the
      headline surface), RP-6 (per-region/species chronicle threads), and
      RP-16 (inter-tenure predecessor record).


      v6 thinktank round 6 (2026-05-22). Chronicle event sentences
      additionally surface as Knot-bound text in the root cellar (`RP-37`).
      Each Revery Knot (`RP-36`) hung in the cellar carries that year's
      chronicle sentences as a hover or interact surface. The cellar
      becomes the in-prairie reading surface for `RP-22`; the existing
      Revery-summary surface (`RP-4`) and manual surfaces (`RP-6`) are
      preserved. _The manual catalogs species; the cellar catalogs
      winters._

  - id: 'RP-23'
    name: Time-lapse camera (analog 35mm field instrument)
    summary: >
      A recovered analog field camera. Player places it on a tile, chooses
      a span (season, year, Revery), walks away. The camera sparsely
      records the tile and its 8-neighborhood whenever something changes —
      stage advances, entity arrival, terrain mutation. Returning to the
      camera and interacting opens a modal ASCII playback overlay that
      re-renders the recorded frames through the engine's existing tile
      pass. Film is a separate inventory item found in ruins (N-INFO 400
      tubes); loading film into the camera is a recipe. Film cannot be
      overwritten — exposed frames are exposed. When film is exhausted the
      camera is decoration. Wears like other tools (RP-15).
    depends_on: []
    status: shipped
    spec: harness/specs/time-lapse-camera.yaml
    plan: harness/plans/time-lapse-camera.yaml
    pr: https://github.com/northern-information/revery-prairie/pull/442
    notes: >
      v4 thinktank round 7 (2026-05-20). Tyler's breakthrough — FromSoft
      games are materialist (spells are scrolls, abilities are talismans,
      the inventory IS the character sheet). Doctrine v4 amended to five
      lines; the fifth line is "the inventory is the character sheet."
      The camera answers the ASCII-observation tension: a clover growing
      in real time over forty minutes is not pleasurable to watch in any
      rendering, especially not ASCII. The camera is the steward's
      delegate of attention across time the steward cannot personally
      attend. Visual language inherits entirely from the gel-band scan
      result (src/components/GelBandView.tsx) — edge printing
      (NORTHERN-INFORMATION · 8-char identity · N-INFO 400), reticle crop
      corners, dim-yellow palette pulled from bg-bee, monospace font.
      Playback overlay reads as a developed contact sheet from the same
      lab. Film grain in playback is a new render pass with dim
      per-frame jitter using the same cellNoise primitive the gel uses
      (worth extracting to src/engine/render/jitter.ts as a follow-up
      refactor — the same hash will drive gel jitter, Voynich offsets,
      and film grain; one function carries the game's visual signature).
      Sparse frame storage keeps memory bounded by interestingness — a
      boring patch produces light files. Open questions deferred to
      spec: how many cameras per tenure (lean: rare — one or two per
      run); span options (lean: season + Revery as the two MVP choices);
      where the camera lives in the inventory grid (lean: 2x2, weight
      matches cosmological weight). Sequencing argument: ships after RP-15
      (wear substrate in place) and benefits massively from being before
      or alongside RP-17 (camera is the primary reading instrument for
      autonomous spread). The camera also makes RP-19 (soil depletion)
      legible. Lineage handoff in RP-16 inherits cameras + footage as
      first-class predecessor evidence. Round 8 cascade — the camera is
      also the genre's required object for the cosmic-horror register;
      found footage is how horror is expressed in a materialist
      universe; without RP-23, the egregore has no observational surface.

      v9 thinktank round 3 (2026-05-24). Implementation amendment.
      Substrate shipped via harness/specs/time-lapse-camera.yaml +
      harness/plans/time-lapse-camera.yaml. Dependency on RP-15
      dropped — camera body is eternal, film count is the only wear
      surface. Round 3 locks the encounter shape: camera does NOT
      spawn in the little house; the film roll stays in the house
      (at (2, 6)) as the implicit first goal. Camera spawns in the
      overworld as an already-deployed placedCamera entity adjacent
      to the oak nearest the little house entrance, with an
      exhausted body and four pre-seeded frames of that oak across
      the four seasons (rendered offline at four seasonalPhase
      anchors). Renamed to "Field Camera" in items.ts (id stays
      `camera`). Tyler-authored lore: item:camera =
      "Weatherproof, permacomputer augmented."; item:filmRoll =
      "Unused N-INFO 400 film roll." Deployed items have no hover
      (hover is inventory-only). Playback modal does NOT distinguish
      the inherited camera from a self-recorded one — no title card,
      no narrator gloss. Auto-unload on playback dismissal: frames
      migrate from placed.frames + cameraArchive[uid] into the new
      state.photographAlbum (see RP-58), source buffers clear, camera
      keeps recording if film and span remain. The camera is the
      first lineage object; the cellar (RP-37) is its sibling.
      Photograph is rendered as a gel-band scan per v4 R7 — the
      cells are hashed into an identity that drives GelBandView.

      v11 thinktank round 1 (2026-05-24). The field camera is _set
      up_ from in-hand via RP-59's placement path, not dropped. The
      camera's `PlaceableSpec.place` consumes the inventory slot
      entirely (the camera is a unique artifact, not a stack). The
      verb in player-facing copy is _set up_ — not _drop_, not
      _place_. Drop via `[x]` remains available as a general
      affordance. RP-59 becomes a coordination partner for any
      remaining placement-path polish on this spec.

      v11 thinktank round 4 (2026-05-30). Capture model and playback
      redesigned. The camera records change, not events: capture
      becomes diff-driven (one sim-loop hook at flora-lifecycle
      cadence; append iff any cell differs), retiring
      `recordCameraSubjectEvent` and its seven-or-eight site-specific
      call sites, the `CameraSubject` use in the camera pipeline, and
      the `subject` field on `TimeLapseFrame`. A baseline frame is
      captured at placement so every subsequent frame diffs against
      something real. Playback becomes a contact sheet — all frames
      at once, iso-projected in the same register the world uses, in
      a chronological grid — plus an optional click-to-expand
      single-frame view (cross-fade between adjacent frames lives
      only in the expanded view). `GelBandView` exits
      `TimeLapsePlayback.tsx` and is preserved for the scan
      instrument. The modal stays silent. Film count keys to
      captured changes one-to-one, tightening the `RP-15` wear
      coupling. Diff predicate, capture cadence specifics, and
      contact-sheet layout deferred to spec. Implementation routes
      through `/change-request` against this spec. The line the
      room locked: _the camera notices change, not events; the roll
      is the prairie's evidence of having been more than one thing._

  - id: 'RP-24'
    name: Seeded predecessor stewards
    summary: >
      Procedural predecessor cameras placed at genesis time, with
      procedural footage from procedural prior tenures already inside.
      Player encounters predecessor cameras in the world before they
      ever find their own. Some predecessor cameras have film remaining
      (gifts); some are exhausted (memorials). Footage may show species
      no longer present, geographies that have shifted, names the player
      sees nowhere else. Reuses the camera substrate from RP-23 — same
      Recording[] shape, same playback overlay, same renderer — plus a
      predecessor field on TimeLapseCamera ({ stewardName, tenure } |
      null). When real-player predecessor data eventually flows in from
      multiplayer (RP-16), seeded predecessors remain as the prairie's
      oldest layer. The player will never know which were people and
      which were procedural; the cosmology says that is exactly right.
    depends_on: ['RP-23']
    status: shipped
    spec: harness/specs/RP-24-seeded-predecessors.yaml
    plan: harness/plans/RP-24-seeded-predecessors.yaml
    pr: https://github.com/northern-information/revery-prairie/pull/478
    notes: >
      v4 thinktank rounds 7 and 8 (2026-05-20). Procedural predecessors
      are not a placeholder for multiplayer — they are the substrate
      multiplayer rides on. Without a procedural floor, multiplayer
      lineage feels thin (only as deep as the live player population).
      With it, the lineage is bottomless. Genesis-coincident placement
      locked: the first time the player ever looks at the prairie,
      there is a camera by the south pond they did not place.
      Predecessor footage degrades visibly more than current footage
      (film grain pass turns up with procedural tenure depth) — heat
      death applies to memory. Steward names come from a name generator
      using the same SHA256 substrate as flora identity. The seeded
      stewards are flora, in the cosmology's view — temporary slowings
      that left an artifact. Round 8 amendment — content-biased toward
      the seam: roughly 30% of seeded predecessor footage contains at
      least one egregoric frame, ~10% is predominantly egregoric. Some
      predecessors were eaten; their cameras kept rolling. Found-footage
      touchstones for the procedural generator: Blair Witch
      (last-frame-of-the-last-camera moments emerge procedurally with
      template hints, not explicit authoring); House of Leaves
      (footage that contradicts the player's own map — a clover patch
      where the map shows ash); backrooms (a camera recorded inside a
      cave whose connectivity has shifted, footage exists but the space
      doesn't anymore); Stalker (the act of finding a predecessor camera
      adjacent to an egregoric tile is itself the investigative loop).
      Spec sizing is sibling to RP-23, not a sub-feature — separate item
      so it can be sequenced independently and so its scope (procedural
      footage generation, name generator, predecessor render pass) does
      not overrun the camera's own MVP.


      v8 thinktank round 1 (2026-05-23). Predecessor lineage records
      gain a "fate" distinction — whether the tenure ended in the bed
      (returned to the little house) or in the field (collapsed on the
      overworld via `RP-32`'s Closing-phase commit). The field-collapse
      case carries the collapse tile coordinate so the cellar lineage
      (`RP-37`) can reference it directly. _The umbral steward is not a
      peer of the egregore. The umbral steward is the egregore._


      v11 thinktank round 4 (2026-05-30). Predecessor footage rides
      the redesigned `RP-23` pipeline. Procedural generation produces
      a sequence of 9-cell `TimeLapseFrame` payloads in the same shape
      as live-captured frames and renders into the same contact sheet.
      Degradation is a `degradation` prop (`{ grain, tint, glyphLeak }`)
      on the photograph component; current-tenure frames pass zero,
      predecessor frames pass non-zero. The 30% / 10% egregoric content
      bias from v4 R8 is unchanged; it is now expressed through
      `glyphLeak` rather than a separate render path. Contact-sheet
      density itself becomes a register the steward reads when
      encountering a predecessor's camera — sparse roll says quiet
      tenure, dense roll says loud one, before any single frame is
      read.

