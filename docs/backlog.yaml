  - id: 'RP-50'
    name: Knot per-year auto-derivation
    summary: >
      The Revery Knot's per-year material variation is auto-derived
      from the year's prairie state at the autumn tying tick. The
      derivation walks the union of four witness footprints: the
      steward (gaze + memory), Emily (radius around the little
      house), the coyote (its wander trail), and the egregore (its
      patch extent — Gron's knowing). The result is a `materials`
      bag cached on the year's `reveryKnotsInCellar` entry and
      never recomputed. Surfaces in inventory glyph perturbation,
      cellar hover (alongside `RP-22` chronicle text), and the manual
