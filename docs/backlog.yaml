      (3) Take/unequip — drag only. Drag a backpack item onto the in-hand
      cell to take it; drag it back out to release. Drag is no longer the
      world-placement path for placeables.
      (4) HUD — a single cell sized like a 3x3 block of backpack cells, left
      of the backpack; glyph scales up, name in hot pink.
      Implementation notes: `equippedItemUid` is a uid *reference* into the
      backpack (item never leaves the container) so it survives autoSort
      like `glintingCoins`. RP-59 *supersedes* RP-18's inventory-hover
      preview + the `stoneCirclePreview` field (preview now follows the
      loaded cursor) and RP-18's `dropItem`-places-meteorite behavior (`[x]`
      now drops a retrievable ground item; place is left-click only). The
      camera's `dropItem` set-up special-case is likewise removed. Existing
      RP-18 + RP-23 placement tests migrated to the new verbs.
