  - id: 'RP-13'
    name: Angels are passages
    summary: >
      Angel encounters become ambient, non-interactive events. Drop dialog,
      drop the pink highlight (pink is the steward's color), drop the
      per-encounter canto append. Aura-overlap with the steward is the
      recording event: when the steward's tile first enters an active
      angel's aura, write a deduped lineage entry to the cellar Knot
      (`RP-37`). Extend ANGEL_AURA_KINDS from three to ten — adds
      wildflower, tallgrass, fire, lightning, egregore, sundering,
      meteorite alongside the existing rain, bees, clover. Each new
      kind personifies an existing or doctrine-locked substrate. Remove
      the Cantos screen (state.angelCantos, CantosScreen.tsx, the
      'cantos' permacomputer nav entry, GameScreen conditional render,
      PermacomputerShell menu entry). Hex-grid surface remains only in
      flora sequencing (`RP-6` gel-band) where the v2 lock put it.
    depends_on: ['RP-8b', 'RP-37', 'RP-42', 'RP-44']
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v8 thinktank round 2 (2026-05-23). Scope rewrite from the original
      "Emergent Angels" framing (flora-identity hash derivation, never
      shipped). The room rejected the hash-from-ecology direction —
      angels are not phenotype readouts; the v2 lock kept genetics in
      flora and in the manual gel-band. The flora-hash idea is retired.


      Astrid: _the angel is not a thing you talk to; the angel is a
      thing that passes through_. Removing interactivity is what makes
      the cast safe to expand — once there is no grace economy (no
      canto, no dialog, no gift), every cosmological actor can have an
      angel without folding the not-prairie into the prairie's grace.
      Delta: _the prairie has many cycles, and all of them get faces._
      Each new aura kind personifies a substrate already running —
      fire/lightning on `RP-42`, sundering on `RP-44`'s winter geology,
      meteorites on existing state.meteorites and the
      `#cosmologicalDrift` register, egregore on `RP-8a`/`RP-8b`.


      The Angel of Egregores is in. Excluding it was Astrid's earlier
      worry (grace economy folding the not-prairie); with interactivity
      gone, the grace economy is gone. _Same shelf, different hand._
      The body renders Voynich; the aura primes egregoric spread under
      `RP-8b`'s existing throttle (no new metabolism); the Knot entry is
      rendered in PUA glyphs awaiting human-authored lore. Excluding
      would have been the satanic move — _what is left out is what is
      condemned_ — and the cosmology has been working toward including
      it since v6 R3 named the egregore _of-but-not-of_.


      Engineering scope (Boon): each new kind is a handler in the same
      shape as the existing bees-spawn and clover-spawn loops at
      `src/engine/angels.ts:228-310`. Per-frame cost: one proximity
      sweep per active angel of that kind, same budget as the existing
      three. Aura-overlap recording: each frame, check the steward's
      tile against active auras; on first overlap per encounter, write
      a deduped Knot lineage entry keyed by `(angelKind, encounterHash)`.


      Parking note (deferred from original `RP-13`): the cantos-as-keys /
      single-use wildcard / egregoric-adaptor idea is decoupled from
      this amendment. The current scope removes the canto surface
      entirely; whether some future artifact carries the key-like
      property is a separate question for a later round.


      Open at spec: exact aura-overlap dedupe key (lean `(angelKind,
      encounterHash)`); Angel of Sundering's effect on `RP-44`'s
      ruin-shift probability (additive / multiplicative / regional —
      defer to `RP-44`'s own spec); whether the Angel of Egregores' aura
      is rate-limited differently from autonomous `RP-8b` spread (lean
      same throttle — the angel is a face, not a multiplier); whether
      the egregore-angel's Voynich body uses the same 9x9 footprint as
      the existing angels or a different render path; the PUA glyph
      vocabulary for egregore-angel Knot entries (flagged for human
      authorship).

