  - id: 'RP-51'
    name: Time stops in domestic structures
    summary: >
      A `pausesPlayerTime` flag on zone definitions. True for the
      cellar (`RP-37`) and the little house (`RP-33`); false for the
      cave and the ruins. While the steward is inside a paused-
      structure zone, the daylight clock (`state.timeOfDay`) and
      seasonal progression clock (`state.season`) do not advance.
      The prairie's simulation tick continues at its normal rate —
      bees, ghosts, coyote, flora lifecycle, weather. Re-entry to
      the prairie does not snap-advance; the steward returns to
      the moment they entered.
