  - id: 'RP-41'
    name: Cliffs and verticality
    summary: >
      Elevation finally matters. Raise the genesis amplitude on
      `UpliftEpoch` so the existing `state.elevation` field (0-100
      scale, already lifted cosmetically by `getElevationLift` in
      `projection.ts`) produces structurally meaningful peaks. Add an
      `isClimbableStep(state, from, to, threshold)` predicate that
      returns false when adjacent elevation deltas exceed the
      threshold; gate `movement.ts` and click-to-move pathfinding on
      it. Post-genesis connectivity pass from spawn computes
      `state.reachableMass: Set<string>` — tiles outside it remain
      part of the prairie, visible and weathered, but unwalkable. No
      new tile type, no new glyph; the iso lift already does the 3D.
