  - id: 'RP-59'
    name: In-hand + place (additive placement verb, HUD affordance)
    summary: >
      New `equippedItemUid: ItemUid | null` field on `GameState`,
      single-owner via the inventory layer, registered in
      `EXPECTED_FIELDS`, uid-keyed for stack/sort/merge resilience.
      Each placeable item registers a `PlaceableSpec` —
      `{ verb, canPlace, place }`. Left-click (currently unused
      outside cursor positioning) becomes the place action when
      something is in hand. The cursor's hot-pink highlight tile is
      unchanged in form; when `canPlace` passes, the cursor's inner
      glyph swaps to the in-hand item — a "loaded" cursor. A slot on
      the permacomputer bottom-bar instrument cluster shows the
      in-hand item's glyph and name in hot pink. `[x] to drop` is
      preserved untouched for every item type, placeables included —
      drop and place are two distinct verbs.
    depends_on: ['RP-18', 'RP-23', 'RP-28']
    status: shipped
    spec: harness/specs/RP-59-in-hand-place.yaml
    plan: harness/plans/RP-59-in-hand-place.yaml
    pr: https://github.com/northern-information/revery-prairie/pull/467
    notes: >
      v11 thinktank round 1 (2026-05-24). The seed: Tyler working on
      RP-18 (meteorite hallowed ground) and RP-23 (field camera)
      noticed that "[x] to drop" + drag-and-drop is vestigial
      crafting-game language and that the verb is wrong — you don't
      drop a camera, you set it up; you don't drop a meteorite to
      make a sacred space, you place it. The room landed on _two
      verbs, not one_: drop stays for disowning a thing; place is
      added for dedicating one. v4 R7's _the inventory is the
      character sheet_ has been waiting for exactly this mechanic.
      Delta's rename lock: player-facing copy reads _in hand_, not
      _equipped_ — the prairie has no other RPG-coded nouns.
      Calla's HUD lock: the bag holds, the hand declares — a
      bottom-bar slot makes the second verb legible. Open at spec:
      exact unequip input (right-click vs. `[e]` vs. clicking the
      in-hand slot); exact location of the bottom-bar in-hand slot
      within RP-28's cluster; treatment of the loaded cursor over an
      illegal tile (lean drop the glyph entirely vs. render it
      muted); whether non-placeable items can be in hand as a future
      hook for RP-15 wear-on-use (lean placeable-only for now);
      per-item hover-hint copy from `PlaceableSpec.verb`. Out of
      scope: RP-11 (seeds, drop-on-dirt-to-plant) migrating to
      sow-from-in-hand — room's lean is follow-up spec, ship RP-59
      for meteorites and camera first.


      /plan session (2026-05-28). Spec + plan authored:
      harness/specs/RP-59-in-hand-place.yaml,
      harness/plans/RP-59-in-hand-place.yaml. Open questions resolved with
      Tyler:
      (1) Click precedence — modal-on-hand. `[f]` (interact what I face) is
      untouched; left-click places what's in hand on the cursor tile only
      while something is in hand; over an illegal tile the loaded glyph
      blanks and the click falls through to the existing adjacent-
      interaction. Three distinct verbs: `[f]` interact, `[x]` drop,
      left-click place. (Note: the thinktank's "left-click is unused"
      premise was false — `useMouse` already fired adjacent interactions on
      left-click.)
      (2) Sticky — auto-advance. On place, `equippedItemUid` advances to the
      next backpack instance of the same `definitionId` (lowest gridY then
