  - id: 'RP-60'
    name: Holographic day/night derived from seasonalPhase
    summary: >
      Each season holds one day and one night, derived from
      `seasonalPhase` via a pure function — `dayPhase(seasonalPhase)`
      returning `{ phase: 'day' | 'dawn' | 'night' | 'dusk', t }`. A
      `nightFraction(season)` table allocates the night/day split
      per season — long winter nights, short summer nights,
      intermediate spring and autumn. The night palette is a global
      tint wash composing with the existing `seasonalWash` in
      `filmGrainOverlay.ts`; multiply the night tint over the
      seasonal tint, both derived from the same scalar. Composes
      with v7 R2's two-layer fog — night dims the present layer,
      not the memory layer. The steward's gaze radius compresses
      during the seasonal night. No new clock, no new field on
      `GameState`, no save-shape change.
    depends_on: []
    status: todo
    spec: null
    plan: null
    pr: null
    notes: >
      v10 thinktank round 1 (2026-05-23). The reframe is the
      round: a wall-clock day cycle would tick faster than the
      seasons it lives inside (`SEASONAL_PHASE_PERIOD_MS` is 20
      minutes — five minutes per season), so days and nights are
      holographic at the seasonal scale. Four days, four nights,
      per year. _The prairie does not have nights. The year has
      four._ The seasonal night cannot be opted out of — Revery
      is the once-per-year solstice event, not a nightly sleep.
      v9 R2's `pausesPlayerTime` flag pauses both the season
      clock and the derived day/night phase in one stroke. The
      egregore script-bearing tiles read sharpest at the diurnal-
      by-seasonal compounding — the winter night is the year's
      crispest reading of the of-but-not-of script. Amendment to
      v2 R5: _the ecology that wakes when ours sleeps_ now reads
      at both seasonal and seasonal-night scale. Open at spec:
      `nightFraction(season)` values (lean: winter ~0.55, autumn
      ~0.45, spring ~0.40, summer ~0.30; constraint — total
      night per year should feel like events, not a quarter of
      the session); whether dawn and dusk are their own palette
      register (lean: yes — diurnal analog of v7 R4's shoulder-
      season lock); whether the steward can carry a light source
      (lean: no, never craftable — compressed gaze is part of
      the night's texture); whether egregore tiles need an
      explicit visibility boost during winter night or whether
      layered tint math suffices (lean: audit at spec). _Heat
      death is the antagonist; night is the antagonist's daily
      face, made small and ritualized into four passes._

