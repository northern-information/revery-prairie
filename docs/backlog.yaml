      v6 thinktank round 6 (2026-05-22). The tenure handoff includes a
      bed-knot transfer mechanic: the previous steward's final Revery
      Knot (`RP-36`) remains on the bed at tenure close — it was never moved
      to the root cellar (`RP-37`), because the steward did not wake from
