# Backlog — current status
# Source of truth for the backlog dashboard TUI. Run: `npm run backlog`.
# Doctrine lives in docs/backlog-thinktank-v3.md. This file is the running state.
#
# Status values: todo | in-progress | shipped
# The dashboard derives a fourth bucket — `next` — for any `todo` whose deps are all `shipped`.
# Field order is locked: id, name, summary, depends_on, status, spec, plan, pr, notes.
# (The `size` field was removed in v4 round 9 — sizing is not load-bearing in the current
# authorship environment. Historical sizes remain in git history.)
# Keep it diff-friendly.

