plan:
  id: iso-viewport-effect-clipping
  title: Fix iso-mode parallelogram clipping in renderer effect overlays via shared bounds helper
  created: '2026-05-01'
  notes: >
    Canvas rendering itself cannot be visually unit-tested per CLAUDE.md
    ("if a feature cannot be tested (e.g. canvas rendering), flag it for
    the user to review"). Verification of this fix relies on (a) unit
    tests for the new `viewportBounds` helper, which exercise the math
    end-to-end against `screenToTile`, and (b) visual confirmation by
    the user in the browser (toggle iso mode, observe that earth-scan,
    lightning range, angel auras, prairie halo, weather rain, glint
    sparkles, deep-time fire, and angel rain auras all extend into the
    iso parallelogram corners with no diagonal clipping).
    The helper lives in a new file `src/engine/viewportBounds.ts` rather
    than being bolted onto `projection.ts` so its sole purpose
    (loop-bounds for renderer effect passes) stays discoverable and the
    file remains short. `projection.ts` already owns coordinate math;
    `viewportBounds.ts` owns iteration ranges built on top of it.
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: add-viewport-bounds-helper
    title: Add `viewportBounds.ts` exporting `getVisibleTileBounds` and `isTileInVisibleViewport`
    spec_id: iso-viewport-effect-clipping
    spec_sections:
      - viewport-bounds-helper
    context_files:
      - src/engine/projection.ts
      - src/engine/renderer.ts
    output_files:
      - src/engine/viewportBounds.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: viewport-bounds-tests
    title: Add unit tests for `viewportBounds` helpers (parametric vs `screenToTile`)
    spec_id: iso-viewport-effect-clipping
    spec_sections:
      - viewport-bounds-helper
      - cartesian-mode-unchanged
      - small-viewport
      - wide-viewport
      - tall-viewport
      - corner-tiles
      - margin-extends-past-edge
    context_files:
      - src/engine/viewportBounds.ts
      - src/engine/projection.ts
    output_files:
      - src/engine/__tests__/viewportBounds.test.ts
    depends_on:
      - add-viewport-bounds-helper
    verification:
      - npx vitest run src/engine/__tests__/viewportBounds.test.ts
    repair: retry
    tags:
      - engine
