plan:
  id: RP-1-multi-species-flora
  title: Multi-species Flora — clover becomes a Flora species; add wildflower and tall grass
  created: 2026-05-18
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + dashboard status (eager, low risk) ---

  - id: doctrine-status-update
    title: Flip backlog.yaml feature 1 to in-progress with spec/plan links
    spec_id: RP-1-multi-species-flora
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - docs/backlog.yaml
    output_files:
      - docs/backlog.yaml
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Type rename (TileType.Clover → Flora; BurntClover → BurntFlora;
  # CloverStage → FloraStage; CloverLifecycleState → FloraLifecycleState; add
  # species field). Done as one task to minimize typecheck thrash. ---

  - id: rename-types-and-add-species-field
    title: Rename TileType.Clover→Flora and BurntClover→BurntFlora; rename CloverStage→FloraStage; add species field to lifecycle state
    spec_id: RP-1-multi-species-flora
    spec_sections:
      - tile-type-renamed-to-flora
      - flora-stage-renamed
      - flora-species-id-on-lifecycle-record
      - burnt-clover-tile-renamed
    context_files:
      - src/engine/types.ts
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/types.ts
      - src/engine/genesisTypes.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - types

  - id: rename-gamestate-fields
    title: Rename state.cloverLifecycle → floraLifecycle and state.cloverGrowthPreviews → floraGrowthPreviews; thread the species field through createGameState
    spec_id: RP-1-multi-species-flora
    spec_sections:
      - flora-species-id-on-lifecycle-record
    context_files:
      - src/engine/state.ts
      - src/engine/types.ts
    output_files:
      - src/engine/state.ts
    depends_on:
      - rename-types-and-add-species-field
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - state

  - id: schema-allowlist
    title: Replace cloverLifecycle and cloverGrowthPreviews entries with their renamed counterparts in the serialization schema allowlist
    spec_id: RP-1-multi-species-flora
    spec_sections:
      - schema-allowlist-updated
    context_files:
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - rename-gamestate-fields
    verification:
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - test
      - harness

