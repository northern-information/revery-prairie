      - src/engine/flora/actions/movement.ts
      - src/engine/flora/actions/pollinate.ts
      - src/engine/flora/species.ts
    output_files:
      - src/engine/flora/type/wildflower/wildflower.ts
      - src/engine/flora/type/tallGrass/tallGrass.ts
      - src/engine/flora/index.ts
    depends_on:
      - flora-species-registry
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - flora

