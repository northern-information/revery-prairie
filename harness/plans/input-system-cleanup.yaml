    verification:
      - npx vitest run src/harness/__tests__/input/input-system-cleanup.test.ts
    repair: retry
    tags: [docs]

  - id: normalize-helper-text-uppercase
    title: 'Capitalize bracketed hotkey hints in ScanProgressBar (`[F]`) and HexagramPanel (`[F]`, `[Enter]`)'
    spec_id: input-system-cleanup
    spec_sections:
