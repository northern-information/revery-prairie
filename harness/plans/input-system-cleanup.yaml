plan:
  id: input-system-cleanup
  title: 'Input system cleanup — drop Q/B/click-pickup, fix focus gate + C deep-time gate, resync docs/registry, normalize hotkey helper text, add [X] Drop hint'
  created: '2026-05-23'
  global_verification:
    - npm run typecheck
    - npm run lint
    - npm run test
    - npm run spec:validate

tasks:
  - id: drop-q-manual-toggle
    title: 'Remove the `q` keybinding that toggled the manual'
    spec_id: input-system-cleanup
    spec_sections:
      - manual-toggle-tab-only
      - keybindings-registry-is-authoritative
    context_files:
      - src/hooks/useKeyboard.ts
      - src/engine/input.ts
    output_files:
      - src/hooks/useKeyboard.ts
      - src/engine/input.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/input/input-system-cleanup.test.ts
    repair: retry
    tags: [hook, registry]

  - id: drop-b-and-burndrawmode-system
    title: 'Remove the `b` keybinding and the entire burnDrawMode + burnLineDraft authoring system'
    spec_id: input-system-cleanup
    spec_sections:
      - burn-draw-mode-removed
      - keybindings-registry-is-authoritative
    context_files:
      - src/hooks/useKeyboard.ts
      - src/hooks/useMouse.ts
      - src/engine/state.ts
      - src/engine/types.ts
      - src/engine/torchbearer.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/hooks/useKeyboard.ts
      - src/hooks/useMouse.ts
      - src/engine/state.ts
      - src/engine/types.ts
      - src/engine/torchbearer.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
      - npx vitest run src/engine/__tests__/torchbearer.test.ts
      - npx vitest run src/harness/__tests__/input/input-system-cleanup.test.ts
    repair: retry
    tags: [hook, state, schema]

  - id: drop-click-ground-item-pickup
    title: 'Remove the left-click pickup branch in useMouse — clicks on ground items become plain walk-to-tile'
    spec_id: input-system-cleanup
    spec_sections:
      - click-ground-item-walks-only
    context_files:
      - src/hooks/useMouse.ts
      - src/engine/interaction.ts
      - src/engine/entities.ts
    output_files:
      - src/hooks/useMouse.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/hooks/__tests__/useMouse.test.ts
      - npx vitest run src/engine/__tests__/entities.test.ts
    repair: retry
    tags: [hook]

  - id: gate-c-during-deep-time
    title: 'Add deep-time Burning/Simulating gate to the `c` divination toggle'
    spec_id: input-system-cleanup
    spec_sections:
      - divination-deep-time-gate
    context_files:
      - src/hooks/useKeyboard.ts
    output_files:
      - src/hooks/useKeyboard.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/hooks/__tests__/useKeyboard.test.ts
    repair: retry
    tags: [hook]

  - id: resync-keybindings-registry
    title: 'Update KEYBINDINGS in src/engine/input.ts to include `1`/`2` overlay modes and reflect the final binding set'
    spec_id: input-system-cleanup
    spec_sections:
      - keybindings-registry-is-authoritative
    context_files:
      - src/engine/input.ts
      - src/hooks/useKeyboard.ts
    output_files:
      - src/engine/input.ts
    depends_on:
      - drop-q-manual-toggle
      - drop-b-and-burndrawmode-system
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/input/input-system-cleanup.test.ts
    repair: retry
    tags: [registry]

  - id: resync-input-md
    title: 'Rewrite docs/claude/input.md to match the post-cleanup keyboard surface'
    spec_id: input-system-cleanup
    spec_sections:
      - input-md-resync
    context_files:
      - src/engine/input.ts
      - src/hooks/useKeyboard.ts
      - docs/claude/input.md
    output_files:
