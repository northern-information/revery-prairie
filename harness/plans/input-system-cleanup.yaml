  - id: finalize-regression-coverage
    title: 'Backfill any missing assertions in input-system-cleanup.test.ts; ensure all behaviors and failure conditions are covered'
    spec_id: input-system-cleanup
    spec_sections:
      - keybindings-registry-is-authoritative
      - manual-toggle-tab-only
      - burn-draw-mode-removed
      - click-ground-item-walks-only
      - divination-deep-time-gate
