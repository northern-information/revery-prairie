    repair: retry
    tags: [test]

  - id: add-glint-zone-tests
    title: Add unit tests for patch lifecycle, drift, spawning, opacity, and rebuild
    spec_id: glinting-zones
    spec_sections:
      - patch-lifecycle
      - patch-drift
      - patch-spawning
      - initial-seeding
    context_files:
