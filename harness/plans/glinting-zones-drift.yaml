      - update-test-helpers
    verification:
      - npx vitest run src/engine/__tests__/glintZones.test.ts
    repair: retry
    tags: [test]

  - id: update-serialization-schema
    title: Update serialization schema test to include glintPatches and glintOpacity fields
    spec_id: glinting-zones
    spec_sections:
