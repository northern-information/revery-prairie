    spec_id: angels
    spec_sections:
      - angel-animation
      - angel-drifting
      - angel-character-definition
      - angel-spawning
      - angel-despawn
    context_files:
      - src/engine/constants.ts
      - src/engine/angels.ts
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/serialize.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/constants.ts
      - src/engine/angels.ts
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/serialize.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization
    repair: retry
    tags: [engine]

