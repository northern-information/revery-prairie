plan:
  id: genesis-terrain-realism
  title: Replace separable noise with 2D fBm + domain warp, add TectonicUplift epoch, hydraulic erosion in FirstWater and post-glacial recession, and windward/leeward biome bias
  created: 2026-05-02
  global_verification:
    - npm run typecheck
    - npm run test -- --run src/engine/__tests__/genesis.test.ts
    - npm run build
    - npm run lint

tasks:
  - id: types-tectonic-axes
    title: Add TectonicUplift epoch id and tectonicAxes field to GenesisSimState and EpochSnapshot
    spec_id: genesis-terrain-realism
    spec_sections:
      - tectonic-uplift-epoch
      - tectonic-axis-snapshot
    context_files:
      - src/engine/genesisTypes.ts
      - src/engine/genesis.ts
    output_files:
      - src/engine/genesisTypes.ts
    depends_on: []
    verification:
      - npm run typecheck
    repair: retry
    tags:
      - engine

  - id: noise-helpers
    title: Add 2D value-noise + domain-warp helpers (fbmValueNoise2D, domainWarp2D)
    spec_id: genesis-terrain-realism
    spec_sections:
      - two-dimensional-base-elevation
    context_files:
      - src/engine/genesis.ts
      - src/engine/terrain.ts
    output_files:
      - src/engine/genesis.ts
    depends_on:
      - types-tectonic-axes
    verification:
      - npm run typecheck
    repair: retry
    tags:
      - engine

  - id: replace-separable-elevation
    title: Replace eH[x]+eV[y] separable noise in LandAccretion with 2D fBm + domain warp
    spec_id: genesis-terrain-realism
    spec_sections:
