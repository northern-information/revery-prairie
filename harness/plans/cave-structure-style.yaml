plan:
  id: cave-structure-style
  title: Style cave entrance like a structure with its own cool slate palette via a shared structure registry
  created: '2026-05-16'
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  - id: add-cave-apron-tile-type
    title: Add TileType.CaveApron, TILE_CHARS, TILE_COLORS, and tileBg color rows
    spec_id: cave-visual-style
    spec_sections:
      - cave-apron-tile-type
      - overworld-cave-entrance-platform
    context_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/tileBg.ts
    output_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/tileBg.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: add-cave-palette-constants
    title: Add CAVE_WALL_COLORS to constants.ts as the cave structure palette
    spec_id: cave-visual-style
    spec_sections:
      - cave-distinct-palette
    context_files:
      - src/engine/constants.ts
    output_files:
      - src/engine/constants.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: implement-structure-registry
    title: Implement STRUCTURE_REGISTRY in src/engine/structures.ts with ruin and cave entries
    spec_id: structure-registry
    spec_sections:
      - structure-registry-shape
      - ruin-entry-preserved
      - cave-entry
      - structure-platform-lift-accessor
      - structure-tile-layers-accessor
    context_files:
      - src/engine/structures.ts
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/tileBg.ts
    output_files:
      - src/engine/structures.ts
    depends_on:
      - add-cave-apron-tile-type
      - add-cave-palette-constants
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: migrate-platform-lift-accessor
    title: Replace getRuinPlatformLift with getStructurePlatformLift; keep RUIN_*_LIFT_PX as re-exports sourced from registry
    spec_id: structure-registry
    spec_sections:
      - structure-platform-lift-accessor
    context_files:
      - src/engine/tileBg.ts
      - src/engine/structures.ts
      - src/engine/renderer.ts
      - src/engine/tileBgCache.ts
    output_files:
      - src/engine/tileBg.ts
      - src/engine/renderer.ts
      - src/engine/tileBgCache.ts
    depends_on:
      - implement-structure-registry
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: route-cave-layers-through-registry
    title: Update getCaveTileLayers to read palette and chars from STRUCTURE_REGISTRY.cave
    spec_id: cave-visual-style
    spec_sections:
      - cave-distinct-palette
      - wall-tile-layers
      - floor-tile-layers
    context_files:
      - src/engine/cave.ts
      - src/engine/structures.ts
    output_files:
      - src/engine/cave.ts
    depends_on:
      - implement-structure-registry
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: route-ruin-layers-through-registry
    title: Update getRuinTileLayers to read palette and chars from STRUCTURE_REGISTRY.ruin (no visual change)
    spec_id: structure-registry
    spec_sections:
      - structure-tile-layers-accessor
      - ruin-entry-preserved
    context_files:
      - src/engine/ruins.ts
      - src/engine/structures.ts
    output_files:
      - src/engine/ruins.ts
    depends_on:
      - implement-structure-registry
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: place-cave-apron-at-world-gen
    title: When CaveEntrance is written in state.ts, also convert 8 neighbors to CaveApron (mirror ruins.ts:1067-1078 preserve-list)
    spec_id: cave-visual-style
    spec_sections:
      - overworld-cave-entrance-platform
    context_files:
      - src/engine/state.ts
      - src/engine/ruins.ts
      - src/engine/types.ts
    output_files:
      - src/engine/state.ts
    depends_on:
      - add-cave-apron-tile-type
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: cave-apron-walkability-and-protection
    title: Add CaveApron to walkable tiles and satellite PROTECTED_TILES
    spec_id: cave-visual-style
    spec_sections:
      - cave-apron-tile-type
    context_files:
      - src/engine/position.ts
      - src/engine/satellites.ts
    output_files:
      - src/engine/position.ts
      - src/engine/satellites.ts
    depends_on:
      - add-cave-apron-tile-type
