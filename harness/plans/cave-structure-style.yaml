  - id: structure-registry-tests
    title: Write structure-registry unit tests (shape, lift accessor, layer accessor)
    spec_id: structure-registry
    spec_sections:
      - structure-registry-shape
      - structure-platform-lift-accessor
      - structure-tile-layers-accessor
      - ruin-entry-preserved
      - cave-entry
    context_files:
