plan:
  id: rts-unit-selection
  title: 'RTS-style unit selection, command panel, and controllable Gron'
  created: 2026-04-17
  global_verification:
    - 'npm run build'
    - 'npm run test'
    - 'npm run lint'

tasks:
  - id: add-selection-state
    title: 'Add selection, unit command, and move marker types/fields to GameState'
    spec_id: rts-unit-selection
    spec_sections:
      - left-click-select-unit
      - right-click-move-command
      - drag-box-select
      - move-order-marker
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: []
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: selection-engine
    title: 'Create selection.ts with select, deselect, box-hit-test, and controllable-unit queries'
    spec_id: rts-unit-selection
    spec_sections:
      - left-click-select-unit
      - left-click-deselect
      - drag-box-select
    context_files:
      - src/engine/types.ts
      - src/engine/ecs/world.ts
      - src/engine/ecs/components.ts
      - src/engine/characters.ts
      - src/engine/coordinates.ts
      - src/engine/position.ts
    output_files:
      - src/engine/selection.ts
    depends_on:
      - add-selection-state
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: unit-command-system
    title: 'Create unitCommands.ts with command queuing, per-unit pathfinding, and tick execution'
    spec_id: rts-unit-selection
    spec_sections:
      - right-click-move-command
      - unit-command-execution
      - move-order-marker
    context_files:
      - src/engine/types.ts
      - src/engine/pathfinding.ts
      - src/engine/movement.ts
      - src/engine/position.ts
      - src/engine/ecs/world.ts
      - src/engine/ecs/components.ts
    output_files:
      - src/engine/unitCommands.ts
    depends_on:
      - add-selection-state
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: gron-mobility
    title: 'Make Gron a commandable mobile unit that pathfinds on right-click command'
    spec_id: rts-unit-selection
    spec_sections:
      - gron-mobility
      - gron-dialog-preserved
    context_files:
      - src/engine/characters.ts
      - src/engine/interaction.ts
      - src/engine/coyote.ts
      - src/engine/unitCommands.ts
      - src/engine/ecs/components.ts
      - src/engine/movement.ts
    output_files:
      - src/engine/characters.ts
      - src/engine/interaction.ts
    depends_on:
      - unit-command-system
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: coyote-command-override
    title: 'Update coyote tick to respect move commands over follow behavior'
    spec_id: rts-unit-selection
    spec_sections:
      - coyote-mode-via-command-panel
