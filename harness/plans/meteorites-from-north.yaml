    spec_id: shooting-stars
    spec_sections:
      - ambient-star-spawning
      - targeted-star-spawning
      - meteor-shower-scheduling
      - player-spawn-shower-trigger
    context_files:
      - src/engine/celestial.ts
      - src/engine/constants.ts
      - src/engine/types.ts
      - src/engine/state.ts
    output_files:
      - src/engine/celestial.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: remove-radiant-state-fields
    title: 'Remove meteorShower.radiantDx / radiantDy from types.ts and state.ts init; update EXPECTED_FIELDS in serialization/schema.test.ts'
