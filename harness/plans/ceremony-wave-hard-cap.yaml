plan:
  id: ceremony-wave-hard-cap
  title: Cap the bee+clover ceremony wave at a hard 13-tile radius
  created: 2026-05-22
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  - id: bump-ceremony-radius
    title: Set CEREMONY_WAVE_RADIUS from 8 to 13 in src/engine/constants.ts.
    spec_id: RP-17-autonomous-flora-spread
    spec_sections:
      - ceremony-wave-enqueues
      - ceremony-wave-tick
    context_files:
      - src/engine/constants.ts
    output_files:
      - src/engine/constants.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: hard-cap-wave-termination
    title: >
      Remove the "stay alive while still painting" soft grace from
      src/engine/floraWaves.ts tickFloraWaves. Once a wave's
      currentRadius exceeds maxRadius the wave is dropped from
      state.activeWaves on the same tick. advanceWave must not paint
      tiles whose Chebyshev distance from (cx, cy) exceeds maxRadius
      regardless of jitter pull-in. The wave is hard-bounded by
      maxRadius, not by paint count.
    spec_id: RP-17-autonomous-flora-spread
    spec_sections:
      - ceremony-wave-tick
    context_files:
      - src/engine/floraWaves.ts
      - src/engine/constants.ts
      - src/engine/types.ts
    output_files:
      - src/engine/floraWaves.ts
    depends_on:
      - bump-ceremony-radius
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: hard-cap-regression-test
    title: >
      Add a regression test to src/engine/__tests__/RP-17-ceremony-wave.test.ts
      (or the existing ceremony-wave test file) covering the
      ceremony-wave-hard-radius-cap edge case. The test casts a
      ceremony on a large open-dirt overworld with no obstructions,
      advances time via tickFloraWaves until state.activeWaves is
      empty, then asserts every wave-painted Flora tile (entries whose
      parentPrefix matches the seedIdentity prefix) lies within
      Chebyshev radius CEREMONY_WAVE_RADIUS of the cast origin, and
      that state.activeWaves.length === 0 after termination.
    spec_id: RP-17-autonomous-flora-spread
    spec_sections:
      - ceremony-wave-tick
    context_files:
      - src/engine/__tests__/RP-17-ceremony-wave.test.ts
      - src/engine/floraWaves.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/__tests__/RP-17-ceremony-wave.test.ts
    depends_on:
      - hard-cap-wave-termination
    verification:
      - npx vitest run src/engine/__tests__/RP-17-ceremony-wave.test.ts
    repair: retry
    tags:
      - engine
      - tests

  - id: refresh-existing-wave-tests
    title: >
      Update any existing assertions in RP-17 wave tests
      (RP-17-ceremony-wave.test.ts, RP-17-spread-perf.test.ts,
      combine.test.ts, recipes.test.ts) that depend on the old radius
      of 8 or on the soft-cap "paints past maxRadius" behavior. Tile
      count expectations from radius 8 must be revised for the larger
      radius. Tests asserting wave persistence past maxRadius must be
      updated or removed because the wave now terminates on the tick
      currentRadius exceeds maxRadius.
    spec_id: RP-17-autonomous-flora-spread
    spec_sections:
      - ceremony-wave-tick
    context_files:
      - src/engine/__tests__/RP-17-ceremony-wave.test.ts
      - src/engine/__tests__/RP-17-spread-perf.test.ts
      - src/engine/__tests__/combine.test.ts
      - src/engine/__tests__/recipes.test.ts
    output_files:
      - src/engine/__tests__/RP-17-ceremony-wave.test.ts
      - src/engine/__tests__/RP-17-spread-perf.test.ts
      - src/engine/__tests__/combine.test.ts
      - src/engine/__tests__/recipes.test.ts
    depends_on:
      - hard-cap-wave-termination
    verification:
      - npm run test:engine
    repair: retry
    tags:
      - engine
      - tests
