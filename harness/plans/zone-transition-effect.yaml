plan:
  id: zone-transition-effect
  title: Add iris + ASCII dissolve transition for cave/ruin enter and exit
  created: '2026-05-16'
  # Cross-cutting: adds a GameState field and touches engine + renderer + hooks.
  # Full test suite per CLAUDE.md harness conventions.
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  - id: add-zone-transition-type
    title: Add ZoneTransition interface and state.zoneTransition field
    spec_id: zone-transition-effect
    spec_sections:
      - schedule-on-zone-change
      - tick-and-swap-at-midpoint
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/serialize.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/serialize.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization
    repair: retry
    tags: [engine, types]

  - id: implement-zone-transition-module
    title: Implement scheduleZoneTransition and tickZoneTransition in src/engine/zoneTransition.ts
    spec_id: zone-transition-effect
    spec_sections:
      - schedule-on-zone-change
      - tick-and-swap-at-midpoint
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/cave.ts
      - src/engine/ruins.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/zoneTransition.ts
      - src/engine/constants.ts
    depends_on:
      - add-zone-transition-type
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: wire-cave-and-ruin-entry-points
    title: Replace direct enterCave/enterRuin/exitCave/exitRuin calls in checkTransition with scheduleZoneTransition; have tickZoneTransition invoke them at midpoint
    spec_id: zone-transition-effect
    spec_sections:
      - schedule-on-zone-change
      - tick-and-swap-at-midpoint
    context_files:
      - src/engine/cave.ts
      - src/engine/ruins.ts
      - src/engine/zoneTransition.ts
    output_files:
      - src/engine/cave.ts
      - src/engine/ruins.ts
      - src/engine/zoneTransition.ts
    depends_on:
      - implement-zone-transition-module
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/cave.test.ts src/engine/__tests__/ruins.test.ts
    repair: retry
    tags: [engine]

  - id: tick-from-game-loop
    title: Call tickZoneTransition each frame from the engine tick (gameLoop or useGameEngine animation loop)
    spec_id: zone-transition-effect
    spec_sections:
      - tick-and-swap-at-midpoint
    context_files:
      - src/engine/gameLoop.ts
      - src/hooks/useGameEngine.ts
      - src/engine/zoneTransition.ts
    output_files:
      - src/engine/gameLoop.ts
      - src/hooks/useGameEngine.ts
    depends_on:
      - implement-zone-transition-module
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine, hook]

  - id: gate-input-during-transition
    title: Short-circuit movement and interaction input when state.zoneTransition is non-null (keyboard, click-to-move, pendingAction, tickPath, action bar)
    spec_id: zone-transition-effect
    spec_sections:
      - gate-input-during-transition
    context_files:
      - src/engine/movement.ts
      - src/hooks/useGameEngine.ts
      - src/components/GameScreen.tsx
    output_files:
      - src/engine/movement.ts
      - src/hooks/useGameEngine.ts
      - src/components/GameScreen.tsx
    depends_on:
      - wire-cave-and-ruin-entry-points
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine, input]

  - id: implement-overlay-pass
    title: Implement the zone-transition-overlay screen-overlay pass with iris circle + ASCII dissolve noise layers
    spec_id: zone-transition-effect
    spec_sections:
      - render-iris-and-dissolve-overlay
    context_files:
      - src/engine/render/passes.ts
      - src/engine/render/passes/index.ts
      - src/engine/render/passes/lightningScreenFlash.ts
      - src/engine/render/passes/angelSpawnDespawnFlash.ts
      - src/engine/types.ts
      - src/engine/renderer.ts
    output_files:
      - src/engine/render/passes/zoneTransitionOverlay.ts
      - src/engine/render/passes/index.ts
    depends_on:
      - add-zone-transition-type
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine, render]

  - id: write-tests
    title: Replace placeholder describe in src/engine/__tests__/zoneTransition.test.ts with real coverage
    spec_id: zone-transition-effect
    spec_sections:
      - schedule-on-zone-change
      - tick-and-swap-at-midpoint
      - gate-input-during-transition
    context_files:
      - src/engine/zoneTransition.ts
      - src/engine/cave.ts
      - src/engine/ruins.ts
      - src/engine/state.ts
      - src/engine/__tests__/cave.test.ts
      - src/engine/__tests__/ruins.test.ts
    output_files:
      - src/engine/__tests__/zoneTransition.test.ts
    depends_on:
      - wire-cave-and-ruin-entry-points
      - tick-from-game-loop
      - gate-input-during-transition
    verification:
      - npx vitest run src/engine/__tests__/zoneTransition.test.ts
    repair: retry
    tags: [test]
