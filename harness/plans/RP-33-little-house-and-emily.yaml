plan:
  id: RP-33-little-house-and-emily
  title: 'The little house and Emily — house structure as zone, Emily character with seasonal dialog, [f]-confirm Revery, Revery-in-house scene, drop the falling-star spawn'
  created: 2026-05-23
  # Cross-cutting: changes GameState shape (adds houseMap*, houseEntrance*,
  # houseBedInterior, houseChairInterior, emilyInvitation, emilyReveryReturn;
  # removes playerSpawn), widens TileType / Zone / ZoneTransitionKind, extends
  # ReveryState handling. Genesis path, renderer, movement, interaction,
  # celestial spawn pipeline all touched. Full suite required.
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + docs ---

  - id: doctrine-status-update
    title: >
      Flip RP-33 from todo to in-progress in docs/backlog.yaml.
      Set spec_path and plan_path on the RP-33 entry. Add a paragraph to the
      notes summarizing the v6 round 2 + 6 lock and the design clarification
      from 2026-05-23: the Revery scene is always the house, regardless of
      where pressure trips threshold. Update docs/claude/zones.md with a
      "House interior (RP-33)" section describing the 30 × 18
      deterministic layout, the door at south wall center, the fireplace
      at north wall center, Emily west of the fireplace, the bed on the
      east wall, the chair on the west wall, and the warm-brown palette
      direction. Update docs/claude/revery.md with a paragraph under a
      "Revery scene — the little house (RP-33)" subhead describing
      the Omen → Observing scene swap (immediate, covered by the existing
      fade) and the Emily-to-chair / steward-to-bed reposition. Update
      docs/claude/state.md to document field ownership: houseMap (created
      by createHouseInterior, swapped by enterHouse/exitHouse);
      houseEntranceOverworld (placed by state.ts during createGameState);
      houseEntranceInterior / houseBedInterior / houseChairInterior
      (constants populated by createHouseInterior); emilyInvitation
      (written by interaction.ts dialog tick and Closing); emilyReveryReturn
      (written by revery.ts at Omen → Observing and cleared at Closing);
      activeDialog.awaitingConfirmation (written by dialog tick during
      Emily's autumn last line, cleared by any dialog-close path). Update
      docs/claude/entities.md with an Emily entry under Characters
      (stationary, house-interior zone-tagged, [f]-interaction routes
      through getEmilyDialog).
    spec_id: RP-33-little-house-and-emily
    spec_sections: []
    context_files:
      - docs/backlog.yaml
      - docs/claude/zones.md
      - docs/claude/revery.md
      - docs/claude/state.md
      - docs/claude/entities.md
    output_files:
      - docs/backlog.yaml
      - docs/claude/zones.md
      - docs/claude/revery.md
      - docs/claude/state.md
      - docs/claude/entities.md
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Types, constants, schema ---

  - id: add-tile-zone-types
    title: >
      Extend src/engine/types.ts: (1) append eight new TileType variants —
      HouseEntrance, HouseApron, HouseFloor, HouseWall, HouseBed,
      HouseChair, Fireplace, HouseExit. (2) Append Zone.HouseInterior to
      the Zone enum. (3) Widen ZoneTransitionKind from `'cave' | 'ruin'` to
      `'cave' | 'ruin' | 'house'`. (4) Extend the activeDialog inline shape
      with an optional `awaitingConfirmation?: boolean`. (5) DELETE the
      PlayerSpawn interface (currently at types.ts:905) and the
      `playerSpawn: PlayerSpawn` field on GameState (types.ts:378). No
      other field shapes change in this task — the new GameState fields
      land in the next task to keep diffs reviewable.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - house-tile-types
      - house-zone-and-interior
      - house-zone-transitions
      - emily-invitation-arm
      - remove-falling-star-spawn
    context_files:
      - src/engine/types.ts
    output_files:
      - src/engine/types.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: add-house-state-fields
    title: >
      Extend GameState in src/engine/types.ts with six new fields:
      `houseMap: Tile[][]`, `houseMapWidth: number`, `houseMapHeight: number`,
      `houseEntranceOverworld: Position`, `houseEntranceInterior: Position`,
      `houseBedInterior: Position`, `houseChairInterior: Position`,
      `emilyInvitation: 'unoffered' | 'offered' | 'confirmed'`,
      `emilyReveryReturn: Position | null`. (Note: nine field additions —
      the title says six but lists nine; trust the list, not the count.)
      The fields are placed alphabetically near other house/emily-related
      fields if the existing order is alphabetical, otherwise grouped at
      the bottom of the interface block. No initialization here —
      createGameState wiring happens later in the integration task.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - house-zone-and-interior
      - house-overworld-placement
      - emily-invitation-state-field
      - revery-house-scene
    context_files:
      - src/engine/types.ts
    output_files:
      - src/engine/types.ts
    depends_on:
      - add-tile-zone-types
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: update-schema-expected-fields
    title: >
      Update EXPECTED_FIELDS in src/harness/__tests__/serialization/schema.test.ts.
      REMOVE: 'playerSpawn'. ADD: 'houseMap', 'houseMapWidth', 'houseMapHeight',
      'houseEntranceOverworld', 'houseEntranceInterior', 'houseBedInterior',
      'houseChairInterior', 'emilyInvitation', 'emilyReveryReturn'. Also
      update any inline test that asserts the shape of state.activeDialog
      to permit the optional awaitingConfirmation field (do NOT require it).
      Update the Zone enum coverage test (if present) to include
      'houseInterior' as a valid currentZone value. This task DOES NOT
      attempt to run the test green — the assertions will fail until the
      genesis integration lands. The schema-test update lives in tier 1
      so the type system stays internally consistent.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - schema-test-fields
      - remove-falling-star-spawn
    context_files:
      - src/harness/__tests__/serialization/schema.test.ts
      - src/engine/types.ts
    output_files:
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - add-house-state-fields
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - test

  - id: add-house-constants-remove-spawn-constants
    title: >
      Extend src/engine/constants.ts. ADD: `FIRE_TICK_MS = 200` (fireplace
      animation cadence — fast enough to read as fire, slow enough not to
      flicker); `FIREPLACE_COLOR_A = '#FF8C42'`, `FIREPLACE_COLOR_B = '#FFD56B'`
      (two warm tones cycled at the same cadence); HOUSE color palette
      constants (`HOUSE_FLOOR_COLOR = '#6B4A2B'`, `HOUSE_WALL_COLOR = '#4A2F1B'`,
      `HOUSE_BED_COLOR = '#A88660'`, `HOUSE_CHAIR_COLOR = '#A88660'`,
      `HOUSE_ENTRANCE_COLOR = '#7A5A38'`, `HOUSE_APRON_COLOR = '#5A4128'`
      — picked to read as warm browns against the existing prairie
      palette; humans can tweak post-merge). HouseExit color reuses the
      existing pink-door idiom — `#ff69b4`, the reserved user-action
      hot pink already used by CaveExit and RuinExit per CLAUDE.md.
      Do NOT add a separate HOUSE_EXIT_COLOR constant — reference the
      existing pink value directly in the TILE_COLORS entry.
      REMOVE: `PLAYER_SPAWN_DESCENT_TARGET_MS`, `STEWARD_STAR_HEAD_COLOR`,
      `STEWARD_STAR_TRAIL_COLORS`. Document each new constant with a
      single-line comment. Do not touch any other constant in the file.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - fireplace-animation
      - house-tile-types
      - remove-falling-star-spawn
    context_files:
      - src/engine/constants.ts
    output_files:
      - src/engine/constants.ts
    depends_on:
      - add-house-state-fields
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 2: House module ---

  - id: create-house-module
    title: >
      Create src/engine/house.ts. Export `createHouseInterior()` which
      returns `{ map: Tile[][], width: number, height: number,
      exitInterior: Position, spawnInterior: Position, bedInterior: Position,
      chairInterior: Position }` with the deterministic 30 × 18 layout:
      perimeter HouseWall, HouseFloor interior, Fireplace at (15, 0),
      HouseBed at (28, 8), HouseChair at (2, 8). The south wall has a
      3-wide pink-door opening: three HouseExit tiles at (14, 17),
      (15, 17), (16, 17) — following the existing cave/ruin pink-door
      exit idiom. exitInterior is set to the MIDDLE of the three:
      {x: 15, y: 17}. spawnInterior = (15, 16) (one tile north of the
      middle exit); bedInterior = (28, 8); chairInterior = (2, 8).
      Export `enterHouse(state)` and `exitHouse(state)` mirroring
      cave.ts:189-253 — enterHouse swaps state.map/state.mapWidth/
      state.mapHeight to the house buffers, sets state.currentZone =
      Zone.HouseInterior, sets state.player = state.houseEntranceInterior,
      clears navigation state (path, pathWaypoints, pendingAction,
      pendingInteractionTarget, heldDirection, previewFn, facingEntityPos,
      activeDialog, trail), calls clearAllGrowthPreviews, clearMovementTweens,
      deselectAll, clearAllUnitCommands, calls recordDiscovery(state,
      'zone:house'). exitHouse mirrors with state.overworldMap*, sets
      currentZone = Zone.Overworld, places player via findSafeExitPosition
      from state.houseEntranceOverworld with a Chebyshev distance >= 2.
      Export `checkHouseTransition(state)` mirroring cave.ts:255-288 —
      overworld 3x3 hitbox scan for TileType.HouseEntrance triggers a
      scheduleZoneTransition('house', 'enter', irisCenter); house interior
      step onto a TileType.HouseExit triggers
      scheduleZoneTransition('house', 'exit', irisCenter). Register
      handlers via `registerZoneSwapHandler('house', 'enter', state => {
      enterHouse(state) })` and the 'exit' equivalent — module-load side
      effect, same pattern as cave.ts:294-299.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - house-zone-and-interior
      - house-zone-transitions
    context_files:
      - src/engine/cave.ts
      - src/engine/zoneTransition.ts
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/movement.ts
      - src/engine/state.ts
    output_files:
      - src/engine/house.ts
    depends_on:
      - add-house-constants-remove-spawn-constants
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: wire-house-check-into-cave-checkTransition
    title: >
      Extend src/engine/cave.ts:255 (checkTransition) to also call
      checkHouseTransition(state) from src/engine/house.ts — return true
      if it returns true. The current return value chain is: (1) cave
      overworld 3x3 scan, (2) cave interior CaveExit scan, (3) checkRuinTransition.
      Add (4) checkHouseTransition between (3) and the final return false.
      Mirror the existing import pattern (lazy import or top-of-file
      named import — match whichever style cave.ts uses for ruins).
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - house-zone-transitions
    context_files:
      - src/engine/cave.ts
      - src/engine/house.ts
      - src/engine/types.ts
    output_files:
      - src/engine/cave.ts
    depends_on:
      - create-house-module
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 3: Genesis integration (state.ts) ---

  - id: place-house-entrance-in-genesis
    title: >
      Extend src/engine/state.ts createGameState. After the cave entrance
      placement loop (state.ts:94-153), add a parallel HouseEntrance
      placement loop with the same algorithm: ring around Gron with
      Chebyshev distance in [rainRadius+1, rainRadius+4], up to 500
      attempts, footprint clearance against ponds, river paths, Space,
      and the structural-preservation set EXTENDED to also include
      CaveEntrance and CaveApron so the house cannot land on top of the
      cave. The angle picked from Math.random() is constrained to the
      west half: `const angle = Math.PI / 2 + Math.random() * Math.PI`
      (range π/2 to 3π/2, biasing the candidate west of Gron). Fall back
      to a deterministic west offset (gronX - minHouseDist, gronY) if
      500 attempts exhaust without a valid candidate (mirror cave's
      fallback). On the selected tile: set map[y][x] = { type:
      TileType.HouseEntrance }; convert the 8 neighbors to HouseApron
      using the same PRESERVE_FROM_APRON_OVERWRITE pattern (extended to
      include CaveEntrance, CaveApron, RuinEntrance, RuinApron, RuinWall,
      RuinDoorLocked, RuinDoorOpen, RuinAqueduct). Store the chosen
      position in a local variable to be assigned to state.houseEntranceOverworld
      in the GameState construction block.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - house-overworld-placement
    context_files:
      - src/engine/state.ts
      - src/engine/types.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/state.ts
    depends_on:
      - create-house-module
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: build-house-interior-and-spawn-player-inside
    title: >
      Extend src/engine/state.ts createGameState. After the cave interior
      generation (state.ts:88), call `const houseInterior =
      createHouseInterior()` from house.ts. In the GameState construction
      block (state.ts:161+), set: houseMap = houseInterior.map,
      houseMapWidth = houseInterior.width, houseMapHeight = houseInterior.height,
      houseEntranceInterior = houseInterior.spawnInterior,
      houseBedInterior = houseInterior.bedInterior, houseChairInterior =
      houseInterior.chairInterior, houseEntranceOverworld = the local
      from the previous task, emilyInvitation = 'unoffered',
      emilyReveryReturn = null. REPLACE the player initialization at
      state.ts:166: instead of `player: { x: playerX, y: playerY }` (which
      is currently gronX-1, gronY on the overworld), set `player:
      houseInterior.spawnInterior` and set `currentZone: Zone.HouseInterior`
      instead of the overworld default. Set `map: houseInterior.map`,
      `mapWidth: houseInterior.width`, `mapHeight: houseInterior.height`
      so the active buffers are the house interior. The overworld buffers
      must still be stored on state.overworldMap / state.overworldMapWidth
      / state.overworldMapHeight so that exitHouse can swap back — verify
      the existing field assignment for those (already present from cave
      work) is preserved. Set playerFacing = 'up'. Camera initialization
      uses the new player coords (no change to the camera assignment
      pattern). DELETE the playerSpawn initialization block at
      state.ts:223-228 entirely. Compute camera.x and camera.y centered
      on the new house-interior player position.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - house-zone-and-interior
      - player-starts-inside-house
      - remove-falling-star-spawn
    context_files:
      - src/engine/state.ts
      - src/engine/house.ts
      - src/engine/types.ts
    output_files:
      - src/engine/state.ts
    depends_on:
      - place-house-entrance-in-genesis
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 4: Emily character + dialog ---

  - id: add-emily-character-and-dialog
    title: >
      Extend src/engine/characters.ts. Add 'emily' to the CHARACTERS const:
      `emily: { name: 'Emily', glyph: 'E', glyphColor: '#FFDDA8', dialog:
      ['...', 'TODO: emily default line'] }` — the static dialog field is
      the fallback for non-dispatcher callers (legacy tests, snapshot
      fixtures), per the existing Moab / Gron pattern. Add four module-
      level seasonal dialog constants alongside the existing
      MOAB_DIALOG_* / GRON_DIALOG_* blocks: EMILY_DIALOG_WINTER,
      EMILY_DIALOG_SPRING, EMILY_DIALOG_SUMMER, EMILY_DIALOG_AUTUMN. Each
      is an array of three strings: `['...', 'TODO: emily {season} line
      1', 'TODO: emily {season} line 2']`. EMILY_DIALOG_AUTUMN's last
      element is `'TODO: emily autumn invitation'` — this is the
      invitation line that arms awaitingConfirmation. Add a getEmilyDialog
      dispatcher that returns the array keyed by state.weather.season
      (matching the getMoabDialog pattern at characters.ts:188-204).
      Extend getCharacterDialog (line 206) with `if (characterId ===
      'emily') return getEmilyDialog(state)` as the third branch after
      gron and moab. Per feedback_manual_lore_only.md, NO Emily dialog
      content is human-written by this task — all lines are TODO
      placeholders.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - emily-character-entity
      - emily-seasonal-dialog
    context_files:
      - src/engine/characters.ts
      - src/engine/types.ts
    output_files:
      - src/engine/characters.ts
    depends_on:
      - build-house-interior-and-spawn-player-inside
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: spawn-emily-entity-in-genesis
    title: >
      Extend src/engine/state.ts createGameState. After the GameState
      construction block, locate the character-entity creation site (Gron,
      Moab, Coyote are spawned via createCharacterEntity — find the
      analogous call). Add a createCharacterEntity call for Emily with
      characterId='emily' at the absolute coords `{ x:
      state.houseEntranceOverworld.x, y: state.houseEntranceOverworld.y }`
      tagged with EntityZone for HouseInterior — BUT note that her position
      is recorded in the entity's Position component as the INTERIOR
      coords `{x: 14, y: 1}` not the overworld coords (entities in a
      non-current zone are stored with their zone-local coordinates per
      the existing cross-zone-entity pattern). Verify the EntityZone tag
      mechanism — read the cross-zone-entity-bleed spec and any existing
      EntityZone usage in entities.ts / characters.ts to confirm the
      pattern. The entity is stationary (no AI tick component) and
      appears only when state.currentZone === Zone.HouseInterior.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - emily-character-entity
    context_files:
      - src/engine/state.ts
      - src/engine/entities.ts
      - src/engine/characters.ts
      - src/engine/ecs/types.ts
      - src/engine/types.ts
    output_files:
      - src/engine/state.ts
    depends_on:
      - add-emily-character-and-dialog
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 5: Invitation flow ---

  - id: implement-invitation-arm-in-dialog-tick
    title: >
      Find the dialog tick site in src/engine/interaction.ts (the place
      that advances typingIndex and flips typingDone) — search for
      `typingDone` and `lineIndex`. After typingDone flips to true,
      check: if state.activeDialog?.characterId === 'emily' AND
      state.weather.season === Season.Autumn AND state.revery === null
      AND state.activeDialog.lineIndex === EMILY_DIALOG_AUTUMN.length - 1
      (the last index), set state.activeDialog.awaitingConfirmation =
      true. Also at this point, transition state.emilyInvitation from
      'unoffered' to 'offered' (do not transition if already 'offered' or
      'confirmed'). Import EMILY_DIALOG_AUTUMN from characters.ts as a
      named export — this requires re-exporting it from characters.ts
      (add `export` to its declaration). Verify awaitingConfirmation is
      a single source of truth — no other path writes it true.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - emily-invitation-arm
      - emily-invitation-state-field
    context_files:
      - src/engine/interaction.ts
      - src/engine/characters.ts
      - src/engine/types.ts
    output_files:
      - src/engine/interaction.ts
      - src/engine/characters.ts
    depends_on:
      - spawn-emily-entity-in-genesis
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: implement-invitation-confirm-on-f-press
    title: >
      Find the [f]-press handler in src/engine/interaction.ts that
      advances the active dialog (search for `lineIndex += 1` or similar).
      Before the standard advance-line path runs, check: if
      state.activeDialog?.awaitingConfirmation === true, consume the press
      and run the confirm path: (1) call contributeDormancyPressure(state,
      1.0) from omen.ts; (2) set state.emilyInvitation = 'confirmed';
      (3) set state.activeDialog = null; (4) call recordDiscovery(state,
      'event:emily-invitation-confirmed'). Return early so the standard
      advance-line path does not also run. If the confirm path throws
      (contributeDormancyPressure failure or a future hook), wrap in a
      try/catch — log via console.error and still set activeDialog = null
      in a finally. The emilyInvitation field state should NOT advance to
      'confirmed' if contribute threw.
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - emily-invitation-confirm
    context_files:
      - src/engine/interaction.ts
      - src/engine/omen.ts
      - src/engine/types.ts
    output_files:
      - src/engine/interaction.ts
    depends_on:
      - implement-invitation-arm-in-dialog-tick
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: implement-invitation-cancel-on-dialog-close
    title: >
      Audit every dialog-close path in src/engine/interaction.ts and
      src/engine/zoneTransition.ts that sets state.activeDialog = null
      OR initiates a zone transition while a dialog is open. Add a guard
      at each site: if the dialog being closed was Emily's and
      state.emilyInvitation === 'offered', reset state.emilyInvitation =
      'unoffered'. The activeDialog.awaitingConfirmation field is
      implicitly cleared because activeDialog itself becomes null. The
      confirm path already sets emilyInvitation = 'confirmed' BEFORE
      closing, so the cancel guard's `=== 'offered'` check intentionally
      excludes the confirm case. Sites known to need the guard:
      Esc-keypress dialog-close handler in interaction.ts (search for
      `activeDialog = null` and `Escape`); zone-transition swap handlers
      in cave.ts, ruins.ts, and house.ts (they each clear activeDialog —
      enterHouse and exitHouse both need the guard too, even though
      Emily lives in the house, because the player could escape mid-
      invitation by walking out the door).
    spec_id: RP-33-little-house-and-emily
    spec_sections:
      - emily-invitation-state-field
      - emily-invitation-arm
    context_files:
      - src/engine/interaction.ts
      - src/engine/zoneTransition.ts
      - src/engine/cave.ts
      - src/engine/house.ts
      - src/engine/ruins.ts
      - src/engine/types.ts
    output_files:
      - src/engine/interaction.ts
      - src/engine/house.ts
      - src/engine/cave.ts
      - src/engine/ruins.ts
    depends_on:
      - implement-invitation-confirm-on-f-press
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 6: Revery-in-house scene ---

  - id: implement-revery-house-scene-at-omen-to-observing
    title: >
      Extend src/engine/revery.ts tickRevery Omen → Observing transition.
      In RP-32's existing summons branch (or wherever Omen → Observing
      flips), after the RP-32 summons-sequence logic runs, add the
      house-scene transition: (1) if state.currentZone !== Zone.HouseInterior,
      perform an immediate synchronous swap — state.map =
      state.houseMap, state.mapWidth = state.houseMapWidth,
      state.mapHeight = state.houseMapHeight, state.currentZone =
      Zone.HouseInterior; clear path / pathWaypoints / pendingAction /
      pendingInteractionTarget / heldDirection / previewFn /
      facingEntityPos / trail; call recordDiscovery(state, 'zone:house').
      (2) Regardless of trigger path: set state.player =
      state.houseBedInterior; set state.playerFacing = 'left'. (3) Find
      Emily's ECS entity via the same query pattern used elsewhere in
      this codebase for character entities (search for an existing
      character-entity-lookup helper in interaction.ts or world helpers);
      if found, capture her current Position component into a local,
      assign state.emilyReveryReturn = { ...localPosition }, and mutate
      her Position to state.houseChairInterior via world.spatial.move.
      If Emily entity not found (defensive), set emilyReveryReturn = null
      and skip the move. (4) Call updateCamera(state). The existing
      ZONE_TRANSITION_FADE timing from RP-4 covers the visual gap
      for the swap-and-reposition. The RP-32 collapse-tile field
      (state.revery.summonsCollapseTile) is captured BEFORE this scene
