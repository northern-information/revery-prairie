plan:
  id: RP-11-seed-taxonomy
  title: Genetics-bearing seeds + drop-on-dirt planting
  created: 2026-05-20
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + dashboard status (eager, low risk) ---

  - id: doctrine-status-update
    title: Flip backlog.yaml feature 11 to in-progress with spec/plan links; resize S → M; update summary
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - docs/backlog.yaml
    output_files:
      - docs/backlog.yaml
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Type + state plumbing (compile-only changes) ---

  - id: extend-item-drop-component
    title: Add optional `genome?: FloraGenome` field to the ItemDrop ECS component definition
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - item-drop-component-carries-genome
    context_files:
      - src/engine/ecs/types.ts
      - src/engine/genetics/index.ts
    output_files:
      - src/engine/ecs/types.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - types

  - id: add-seed-genomes-field
    title: Add `seedGenomes: Map<string, FloraGenome>` to GameState; initialize in createGameState; update EXPECTED_FIELDS
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - seed-genome-side-table-added
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/genetics/index.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - extend-item-drop-component
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - engine
      - types
      - state

  - id: recategorize-seed-items
    title: Change wildflowerSeeds + tallGrassSeeds category from Flora to Seed in items.ts; update items.test.ts
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - seed-categories-updated
    context_files:
      - src/engine/items.ts
      - src/engine/types.ts
      - src/engine/__tests__/items.test.ts
    output_files:
      - src/engine/items.ts
      - src/engine/__tests__/items.test.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx vitest run src/engine/__tests__/items.test.ts
    repair: retry
    tags:
      - engine
      - items

  # --- Tier 2: Vault spawn populates genomes ---

  - id: vault-spawn-derives-genome
    title: Extend spawnRuinGroundItem with optional genome arg; populate it for Wildflower/TallGrass DormantGarden vaults via generateGenesisIdentity + generateTraitBag
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - ruin-vault-seeds-get-deterministic-genomes
    context_files:
      - src/engine/ruins.ts
      - src/engine/genetics/index.ts
      - src/engine/ecs/types.ts
      - src/engine/types.ts
    output_files:
      - src/engine/ruins.ts
    depends_on:
      - extend-item-drop-component
      - add-seed-genomes-field
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts
    repair: retry
    tags:
      - engine
      - ruins

  # --- Tier 3: Pickup transfers genome to side-table ---

  - id: pickup-transfer-genome
    title: In pickUpGroundItems, after placeItem, copy ItemDrop.genome (when present) into state.seedGenomes keyed by the new item uid
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - pickup-transfers-genome-to-side-table
    context_files:
      - src/engine/entities.ts
      - src/engine/inventory.ts
      - src/engine/ecs/types.ts
    output_files:
      - src/engine/entities.ts
    depends_on:
      - add-seed-genomes-field
      - vault-spawn-derives-genome
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - entities

  # --- Tier 4: Drop-on-dirt planting ---

  - id: drop-on-dirt-plants-seed
    title: Add seed-planting branch to dropItem — seeds on Dirt convert tile to Flora at stage Healthy with the seed's genome; consume side-table entry
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - drop-on-dirt-plants-seed
      - drop-on-non-dirt-fails
      - existing-non-seed-drop-paths-unchanged
      - coyote-and-other-drop-paths
    context_files:
      - src/engine/entities.ts
      - src/engine/floraLifecycleEntry.ts
      - src/engine/floraLifecycle.ts
      - src/engine/types.ts
      - src/engine/effects.ts
    output_files:
      - src/engine/entities.ts
    depends_on:
      - pickup-transfer-genome
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - entities
      - planting

  # --- Tier 5: Tests ---

  - id: write-seed-genome-tests
    title: Author src/engine/__tests__/seed-genome.test.ts covering vault-spawn determinism, pickup transfer, plant-on-dirt, drop-on-non-dirt fail, winter planting, and zone-transition survival
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - ruin-vault-seeds-get-deterministic-genomes
      - pickup-transfers-genome-to-side-table
      - drop-on-dirt-plants-seed
      - drop-on-non-dirt-fails
    context_files:
