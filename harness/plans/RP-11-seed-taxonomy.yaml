    depends_on:
      - drop-on-dirt-plants-seed
    verification:
      - npx vitest run src/engine/__tests__/seed-genome.test.ts
    repair: retry
    tags:
      - tests

  # --- Tier 6: Docs ---

  - id: update-claude-docs
    title: Update docs/claude/inventory.md (seedGenomes + planting drop), docs/claude/entities.md (planting as acquisition-side world effect), CLAUDE.md (new "rules that fire" bullet)
    spec_id: RP-11-seed-taxonomy
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - docs/claude/inventory.md
      - docs/claude/entities.md
      - CLAUDE.md
    output_files:
      - docs/claude/inventory.md
      - docs/claude/entities.md
      - CLAUDE.md
    depends_on:
      - write-seed-genome-tests
    verification: []
    repair: skip
    tags:
