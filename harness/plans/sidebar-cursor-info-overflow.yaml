    repair: retry
    tags: [test]

  - id: round-elevation-and-water
    title: Round elevation to integer and render water as integer percent in Sidebar
    spec_id: sidebar-cursor-info-overflow
    spec_sections:
      - elevation-rounded-to-integer
      - water-rendered-as-integer-percent
