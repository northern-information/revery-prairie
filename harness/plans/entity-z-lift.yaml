    context_files:
      - src/engine/tileBg.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/tileBg.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: defer-entity-draws-in-tile-loop
    title: Convert inline `isEntity` glyph draws to a deferred draw list flushed after the tile loop
    spec_id: entity-z-lift
    spec_sections:
      - entities-not-clipped-by-elevation
      - genesis-fade-applies-to-deferred-entities
      - angel-group-highlight-preserved
    context_files:
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
    output_files:
