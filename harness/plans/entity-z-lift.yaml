    depends_on:
      - add-angel-float-lift-constant
    verification:
      - npx tsc -b --noEmit
      - npm run test -- --run renderer
    repair: retry
    tags:
      - engine

  - id: lift-angel-body-pixels
    title: Apply `ANGEL_FLOAT_LIFT_PX` to angel body pixels at enqueue time
    spec_id: entity-z-lift
    spec_sections:
      - angels-float-above-max-elevation
      - angel-group-highlight-preserved
      - angel-aura-stays-grounded
    context_files:
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
      - src/engine/render/passes/angelGoldAura.ts
    output_files:
      - src/engine/renderer.ts
    depends_on:
      - defer-entity-draws-in-tile-loop
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: tweened-entity-angel-lift
    title: Apply angel float lift to tweened-entity post-pass when the entity is an angel pixel
    spec_id: entity-z-lift
    spec_sections:
      - tweened-entities-also-lifted
    context_files:
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
    output_files:
      - src/engine/renderer.ts
    depends_on:
      - lift-angel-body-pixels
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: regression-tests
    title: Replace placeholder tests in `entityZLift.test.ts` with assertions on the constant and the deferred-draw API
    spec_id: entity-z-lift
    spec_sections:
      - angels-float-above-max-elevation
      - entities-not-clipped-by-elevation
    context_files:
      - src/engine/__tests__/entityZLift.test.ts
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
    output_files:
      - src/engine/__tests__/entityZLift.test.ts
    depends_on:
      - tweened-entity-angel-lift
    verification:
      - npx vitest run src/engine/__tests__/entityZLift.test.ts
    repair: retry
    tags:
      - engine
      - test
