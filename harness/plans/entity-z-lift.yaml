plan:
  id: entity-z-lift
  title: Defer entity drawing to a post-tile-loop flush so terrain elevation never clips entities; float angels above max tier
  created: '2026-05-02'
  notes: >
    Bug: with iso-style 3D elevation enabled, entities (angels, characters,
    bees, monarchs, ground items, meteorites, beehives, the player) get
    clipped by neighboring high-elevation tiles. The central tile loop in
    `src/engine/renderer.ts` iterates row-major top-to-bottom; for each
    tile it draws elevation cube walls and the tile glyph at that tile's
    `pyLift`. South / east neighbors that sit on a higher tier draw later
    and overpaint canvas pixels above them — including any entity glyph
    a previous (lower-elevation) tile already rendered.

    Fix: keep the central tile loop's resolve-then-draw structure intact
    (the precedence chain is documented as the end state in CLAUDE.md and
    splitting it would force a frameState abstraction). Instead, when the
    resolved tile is an *entity*, enqueue the draw into a deferred list
    and skip the inline `ctx.fillText`. After the tile loop completes
    (and after the existing `tweenedEntities` post-pass), flush the
    deferred list with `ctx.fillText` calls in order. Because the flush
    runs once all terrain has been drawn, no neighboring tile's cube
    wall or glyph can paint over an entity. This is a renderer-internal
    change — no slot reshuffle, no new pass file, no public API churn.

    Angels additionally receive a constant `ANGEL_FLOAT_LIFT_PX` Y
    offset (= `(ELEVATION_TIER_COUNT - 1) * ELEVATION_TIER_LIFT_PX`)
    when their pixels are enqueued, so the body always floats above the
    tallest possible cube. The constant is exported from
    `src/engine/tileBg.ts` (already the home of elevation tier
    constants).

    The angel gold aura (`world-overlay` slot) is left grounded at
    terrain `pyLift` — it visually reads as "this terrain is
    sanctified" and should pool around the floating body.

    Canvas rendering cannot be visually unit-tested per CLAUDE.md.
    Regression tests target the constant, the deferred-list shape, and
    the lift math used at enqueue time. Visual confirmation by the user
    in the browser is required to sign off the fix.

  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint
    - npm run build

