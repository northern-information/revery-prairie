plan:
  id: genesis-bg-fixes
  title: 'Genesis bg fixes: skip cosmic/dust, crossfade bg, cache renderTile'
  created: '2026-05-02'
  global_verification:
    - npm run typecheck
    - npm run lint
    - npm run test
    - npm run build

tasks:
