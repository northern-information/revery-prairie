  - id: regression-tests
    title: 'Author RP-62 regression tests: three-state visibility, live creatures hidden out of gaze, frozen flora snapshot, RP-39 hook gone'
    spec_id: overworld-fog-of-war
    spec_sections:
      - three-state-visibility-on-prairie
      - flora-snapshot-on-prairie
      - entity-visibility-culling-on-prairie
      - fog-updates-on-movement
    context_files:
      - src/engine/visibility.ts
      - src/engine/renderer.ts
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/__tests__/visibility.test.ts
      - src/engine/__tests__/fogMask.test.ts
      - src/engine/__tests__/helpers.ts
    output_files:
      - src/engine/__tests__/visibility.test.ts
      - src/engine/__tests__/fogMask.test.ts
      - src/engine/__tests__/RP-39-post-revery-memory-softening.test.ts
      - src/engine/__tests__/pickupZoneFilter.test.ts
      - src/engine/__tests__/zoneIsolation.test.ts
      - src/engine/__tests__/ruin-dormant-garden.test.ts
      - src/engine/__tests__/trapped-coyote-stays-put.test.ts
      - src/engine/__tests__/main-questline.test.ts
      - src/engine/__tests__/ruin-locked-door.test.ts
    notes: >
      Add/adjust cases. getTileVisibility returns 'remembered' (never
      fullyDiscovered/partiallyDiscovered) for an explored-but-not-visible tile,
      in all three zones. Walking away from a tile flips it visible→remembered in
      one frame (no proximity-promotion lingering). A flora tile written to
      floraMemory while visible renders the stored snapshot (not the live stage)
      once remembered, even after the live lifecycle advances. A creature on a
      tile that leaves the visible set is culled. RP-39: tickRevery Closing no
      longer references any fog-discovered set. MIGRATION: fogMask.test.ts uses
      the removed TileVisibility literals — migrate to 'visible' | 'remembered' |
      'unexplored'. Six test files construct RuinInterior literals with
      `fogDiscovered: new Set()` (pickupZoneFilter, zoneIsolation,
      ruin-dormant-garden, trapped-coyote-stays-put, main-questline,
      ruin-locked-door) — remove that line and add `floraMemory: new Map()` so
      they type-check against the new RuinInterior shape. Rewrite
      RP-39-post-revery-memory-softening.test.ts to assert the hook is gone (no
      overworldFogDiscovered reference). Follow docs/claude/testing.md: spy on
      Math.random with restore in finally, clearAroundPlayer() for terrain prep,
      reset entity arrays before count asserts.
    depends_on:
      - renderer-three-state-and-flora-snapshot
      - fog-mask-and-effect-passes
      - minimap-three-state
      - remove-revery-softening-hook
      - update-schema-allowlist
    verification:
      - 'npx vitest run src/engine/__tests__/visibility.test.ts'
      - 'npm run verify'
    repair: retry
    tags: [test, engine]
