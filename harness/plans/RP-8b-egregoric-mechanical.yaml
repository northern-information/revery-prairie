plan:
  id: RP-8b-egregoric-mechanical
  title: 'Egregoric flora — mechanical biome: parallel species set, invisible pollinator, winter-phased spread (stewardship + Revery), canCross predicate, manual footnote'
  created: 2026-05-20
  # Cross-cutting: mutates GameState shape (two new fields), registers two new
  # gameLoop systems, refactors revery.ts, touches manual.ts. Engine layer at
  # the core. Full suite is the right gate.
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + docs status ---

  - id: doctrine-status-update
    title: 'Flip RP-8b from todo to in-progress in docs/backlog.yaml with spec/plan paths populated. Update docs/claude/egregores.md "what''s deferred" section: remove the bullet about 8b parallel species + invisible pollinator; add a brief subsection pointing to src/engine/egregore/species.ts, src/engine/egregore/lifecycle.ts, src/engine/egregore/spread.ts, src/engine/genetics/egregore.ts, and the canCross predicate. Do not edit docs/backlog-thinktank-v3.md (locked doctrine). Do not edit CLAUDE.md.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - docs/backlog.yaml
      - docs/claude/egregores.md
    output_files:
      - docs/backlog.yaml
      - docs/claude/egregores.md
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Types + state shape ---

  - id: add-egregore-types-and-state-fields
    title: "Add EgregoreSpecies const ({ Allelopath: 'allelopath', Spreader: 'spreader' } as const) + type alias to src/engine/types.ts. Add EgregoreActivityStage const ({ Active: 'active', Dormant: 'dormant' } as const) + type alias. Add EgregoreActivityState interface { stage: EgregoreActivityStage; stageStartTime: number; species: EgregoreSpecies; genome: EgregoreGenome }. Extend GameState with `egregoreLifecycle: Map<string, EgregoreActivityState>` and `lastEgregoreSpreadYear: number`. Update createGameState in src/engine/state.ts to initialize egregoreLifecycle to a new Map() and lastEgregoreSpreadYear to -1. Add both fields to EXPECTED_FIELDS in src/harness/__tests__/serialization/schema.test.ts. EgregoreGenome is imported from src/engine/genetics/egregore.ts (forward reference resolved when that task lands; declare the import path now, fail typecheck if missing — that's expected during incremental implementation)."
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-lifecycle-state-on-gamestate
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - engine

  # --- Tier 2: Genetics — EgregoreGenome + canCross predicate ---

  - id: add-egregore-genome-and-cross-predicate
    title: "Implement src/engine/genetics/egregore.ts: export EgregoreGenome interface { __kind: 'egregore'; identity: string; allelopathy: number; spreadVelocity: number } and generateEgregoreGenome(x, y, stewardName) which produces an identity SHA256 (reuse the RP-3 identity-string helper from src/engine/genetics/index.ts), then derives allelopathy and spreadVelocity in [0, 1] by reading two pairs of bytes from the hash. The function takes a species-bias parameter ({ allelopathy, spreadVelocity }) — the final trait value is the mean of the hash-derived value and the species bias. Add canCross(a: TraitBag | EgregoreGenome, b: TraitBag | EgregoreGenome): boolean to src/engine/genetics/index.ts. The predicate returns false when either argument has __kind === 'egregore'; returns true otherwise. Treat missing __kind as native (TraitBag default). Export canCross from the genetics index."
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-genome-and-cross-predicate
    context_files:
      - src/engine/genetics/index.ts
      - src/engine/genetics/egregore.ts
      - src/engine/types.ts
    output_files:
      - src/engine/genetics/egregore.ts
      - src/engine/genetics/index.ts
    depends_on:
      - add-egregore-types-and-state-fields
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 3: Egregore species registry ---

  - id: add-egregore-species-registry
    title: 'Implement src/engine/egregore/species.ts. Export EgregoreSpeciesDef interface { id: EgregoreSpecies; glyphSubsetIndices: number[]; traitBias: { allelopathy: number; spreadVelocity: number } }. Export EGREGORE_SPECIES registry as `as const satisfies Record<EgregoreSpecies, EgregoreSpeciesDef>` with two entries: allelopath { traitBias: { allelopathy: 0.8, spreadVelocity: 0.3 } } and spreader { traitBias: { allelopathy: 0.3, spreadVelocity: 0.8 } }. glyphSubsetIndices is [0, 1] for allelopath and [2, 3, 4] for spreader (drawn from existing EGREGORE_GLYPHS in src/engine/egregore.ts which has 5 entries). Export getEgregoreSpeciesDef(species). Export getEgregoreSpeciesAtPosition(x, y): EgregoreSpecies — reuses the 8a tileHash helper exported from src/engine/egregore.ts, returns Allelopath when (tileHash(x, y) % 2 === 0) else Spreader. Stable across reloads.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-species-registry
    context_files:
      - src/engine/types.ts
      - src/engine/egregore.ts
      - src/engine/flora/species.ts
    output_files:
      - src/engine/egregore/species.ts
    depends_on:
      - add-egregore-genome-and-cross-predicate
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 4: Shared position helpers ---

  - id: extract-candidate-dirt-neighbors-helper
    title: 'Extract the candidateDirtNeighbors helper currently private to src/engine/revery.ts (lines 187–203) into src/engine/egregore/positions.ts and export it. Signature: candidateDirtNeighbors(state: GameState): Position[]. The implementation is the existing one verbatim — 8-neighbor ordinal walk over state.egregorePositions, dedupes by posKey, filters to TileType.Dirt. Update src/engine/revery.ts to import the helper from src/engine/egregore/positions.ts instead of defining it locally. The existing trailCentroid and manhattan helpers stay in revery.ts.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-shared-helpers
    context_files:
      - src/engine/revery.ts
      - src/engine/egregore/positions.ts
    output_files:
      - src/engine/egregore/positions.ts
      - src/engine/revery.ts
    depends_on:
      - add-egregore-species-registry
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/egregore-advance.test.ts
    repair: retry
    tags:
      - engine
      - refactor

  # --- Tier 5: Seed lifecycle entries for existing egregore positions ---

  - id: seed-egregore-lifecycle-in-state
    title: 'Update createGameState in src/engine/state.ts to post-process state.egregorePositions after genesis: for every position present in state.egregorePositions, add an entry to state.egregoreLifecycle with species derived via getEgregoreSpeciesAtPosition(x, y) and genome derived via generateEgregoreGenome(x, y, stewardName, EGREGORE_SPECIES[species].traitBias). Initial stage is Active when state.weather.season === Season.Winter at game start, otherwise Dormant. stageStartTime is the current time at construction. This step runs unconditionally for every fresh game — no save migration needed (no save format exists yet that includes the lifecycle).'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-lifecycle-state-on-gamestate
    context_files:
      - src/engine/state.ts
      - src/engine/types.ts
      - src/engine/genetics/egregore.ts
      - src/engine/egregore/species.ts
    output_files:
      - src/engine/state.ts
    depends_on:
      - extract-candidate-dirt-neighbors-helper
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - engine

  # --- Tier 6: Lifecycle ticker ---

  - id: implement-egregore-lifecycle-ticker
    title: "Implement src/engine/egregore/lifecycle.ts. Export tickEgregoreLifecycle(state: GameState, time: number): void. Iterate every entry in state.egregoreLifecycle. When state.weather.season === Season.Winter and entry.stage === 'dormant', set stage to 'active' and update stageStartTime. When season !== Winter and entry.stage === 'active', set stage to 'dormant' and update stageStartTime. No debounce. Mirrors src/engine/floraLifecycle.ts lines 140–162 with inverted season check. Register the ticker as a gameLoop system in src/engine/gameLoop.ts with id 'egregore-lifecycle', intervalMs identical to CLOVER_LIFECYCLE_TICK_MS, priority 52."
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-lifecycle-inverse-phased
    context_files:
      - src/engine/egregore/lifecycle.ts
      - src/engine/floraLifecycle.ts
      - src/engine/gameLoop.ts
      - src/engine/weather/index.ts
      - src/engine/types.ts
    output_files:
      - src/engine/egregore/lifecycle.ts
      - src/engine/gameLoop.ts
    depends_on:
      - seed-egregore-lifecycle-in-state
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 7: Spread (stewardship + revery refactor) ---

  - id: implement-egregore-spread
    title: "Implement src/engine/egregore/spread.ts with two exports:
      (1) tickEgregoreSpread(state: GameState, time: number): void. Early-returns at four gates in order: state.weather.season !== Season.Winter; state.currentZone !== Zone.Overworld; state.deepTime !== null; state.revery !== null. After gates, computes currentYear = Math.floor(state.seasonalPhase + (state.year ?? 0)) — if state.year does not exist, use a stable monotonic year proxy derived from total elapsed time. If currentYear === state.lastEgregoreSpreadYear, return. Otherwise: set state.lastEgregoreSpreadYear = currentYear; enumerate candidates via candidateDirtNeighbors(state); if empty, return; pick 1 or 2 positions deterministically via a hash of (stewardName, currentYear, candidate.x, candidate.y) — sort candidates by the hash, take the first 1 or 2 based on the parity of (hash mod 3). For each placed position: write state.map[y][x] = { type: TileType.Egregore }; append to state.egregorePositions; add an egregoreLifecycle entry (stage=Active since season is Winter, species + genome deterministic per position).
      (2) advanceEgregoreInRevery(state: GameState): Position[]. Replaces the existing advanceEgregoreFirstRevery in revery.ts. ALWAYS callable (no reveryCount gate inside). Count = state.reveryCount === 0 ? 3 : 6 + (state.reveryCount % 4). Reuses candidateDirtNeighbors + trailCentroid + manhattan sort from the existing first-Revery implementation. For each placed position: write the tile, append to egregorePositions, add an egregoreLifecycle entry (stage=Active).
      Register tickEgregoreSpread in src/engine/gameLoop.ts as system 'egregore-spread' with intervalMs 30000 (30s wall-clock; the year-throttle is the real gate).
      Delete the old advanceEgregoreFirstRevery export from revery.ts; update revery.ts:138 to call advanceEgregoreInRevery unconditionally (drop the `state.reveryCount === 0` gate at the call site). The function's own count logic produces the same 3-tile behavior on the first Revery, preserving the RP-4 contract."
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-stewardship-spread
      - egregore-revery-spread-refactor
      - egregore-shared-helpers
      - invisible-pollinator-zero-particles
    context_files:
      - src/engine/egregore/spread.ts
      - src/engine/egregore/positions.ts
      - src/engine/egregore/species.ts
      - src/engine/revery.ts
      - src/engine/gameLoop.ts
      - src/engine/types.ts
      - src/engine/weather/index.ts
      - src/engine/genetics/egregore.ts
    output_files:
      - src/engine/egregore/spread.ts
      - src/engine/revery.ts
      - src/engine/gameLoop.ts
    depends_on:
      - implement-egregore-lifecycle-ticker
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/egregore-advance.test.ts
    repair: retry
    tags:
      - engine

  # --- Tier 8: Manual footnote ---

  - id: add-manual-incompatibility-footnote
    title:
      'Add getEgregoreIncompatibilityFootnote(x, y): string[] to src/engine/egregore.ts. Returns 3–5 EVA tokens drawn from the existing EVA_TOKENS allowlist via tileHash-derived selection (different hash bucket than the body sampler so the footnote is distinguishable from body tokens — e.g. shift the bucket by a constant). The number of tokens is deterministic per (x, y) — (tileHash >> 4) % 3 + 3. Add an engineering-only comment in egregore.ts noting the curated translation is "no compatible regions" — the English string is NEVER returned or rendered.
      Update src/engine/manual.ts getEgregoreManualEntries: for each egregore manual entry being built, append a footnote line containing the tokens from getEgregoreIncompatibilityFootnote — but only when hasAnyNativeFloraDiscovery(state) returns true. hasAnyNativeFloraDiscovery is a new helper in manual.ts: iterate state.manualDiscoveries, return true if any entry id starts with ''flora:''.
      The footnote tokens render in the Voynich typeface, like the body. The line is appended after the body and after any existing Latin pierce — it is the last line of the entry.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-manual-footnote
    context_files:
      - src/engine/egregore.ts
      - src/engine/manual.ts
      - src/engine/types.ts
    output_files:
      - src/engine/egregore.ts
      - src/engine/manual.ts
    depends_on:
      - implement-egregore-spread
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 9: Tests ---

  - id: tests-egregore-species
    title: "Write src/engine/__tests__/egregore-species.test.ts. Cover: EGREGORE_SPECIES has exactly two entries with the documented trait biases; getEgregoreSpeciesAtPosition is deterministic per (x, y); two calls with the same coords return the same species; different positions can return different species; the species distribution across a grid is balanced (e.g. for a 64x64 grid, both species appear). Use vi.spyOn(Math, 'random') only if needed (no randomness should be involved — all selection is deterministic from coords)."
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-species-registry
    context_files:
      - src/engine/egregore/species.ts
      - src/engine/egregore.ts
      - src/engine/types.ts
    output_files:
      - src/engine/__tests__/egregore-species.test.ts
    depends_on:
      - add-manual-incompatibility-footnote
    verification:
      - npx vitest run src/engine/__tests__/egregore-species.test.ts
    repair: retry
    tags:
      - test

  - id: tests-egregore-lifecycle
    title: 'Write src/engine/__tests__/egregore-lifecycle.test.ts. Cover: starting state with season=Winter has all entries stage=Active; transition to Summer flips all to Dormant; transition back to Winter flips all to Active; no-debounce immediate transition; zero entries does not crash; mixed stages converge after a single tick. Use clearAroundPlayer() pattern to set up the map deterministically. Reset state.egregorePositions = [] when checking the zero-entry edge case.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-lifecycle-inverse-phased
    context_files:
      - src/engine/egregore/lifecycle.ts
      - src/engine/floraLifecycle.ts
      - src/engine/state.ts
      - src/engine/weather/index.ts
    output_files:
      - src/engine/__tests__/egregore-lifecycle.test.ts
    depends_on:
      - add-manual-incompatibility-footnote
    verification:
      - npx vitest run src/engine/__tests__/egregore-lifecycle.test.ts
    repair: retry
    tags:
      - test

  - id: tests-egregore-spread
    title: 'Rewrite src/engine/__tests__/egregore-spread.test.ts (current contents are it.todo stubs). Cover stewardship-winter drift: gates (season, zone, deepTime, revery) each return early without mutating state.lastEgregoreSpreadYear; once-per-year throttle (call twice in same year → only one spread); 1–2 tiles placed per spread; placed tiles appear in state.map, state.egregorePositions, and state.egregoreLifecycle; deterministic given identical state. Cover revery-winter advance: first Revery (reveryCount=0) places exactly 3; second Revery (reveryCount=1) places 7 (= 6 + 1 % 4); reveryCount=4 places 6; trail centroid bias preserved; deterministic. Cover invisible-pollinator: after tickEgregoreSpread, state.pollen.length is unchanged. Use clearAroundPlayer for terrain setup and reset state.egregorePositions explicitly before assertions.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-stewardship-spread
      - egregore-revery-spread-refactor
      - invisible-pollinator-zero-particles
    context_files:
      - src/engine/egregore/spread.ts
      - src/engine/egregore/positions.ts
      - src/engine/revery.ts
      - src/engine/state.ts
    output_files:
      - src/engine/__tests__/egregore-spread.test.ts
    depends_on:
      - add-manual-incompatibility-footnote
    verification:
      - npx vitest run src/engine/__tests__/egregore-spread.test.ts
    repair: retry
    tags:
      - test

  - id: tests-egregore-crossbreed
    title: 'Write src/engine/__tests__/egregore-crossbreed.test.ts. Cover: canCross(nativeTraitBag, nativeTraitBag) === true; canCross(egregoreGenome, egregoreGenome) === true; canCross(nativeTraitBag, egregoreGenome) === false; canCross(egregoreGenome, nativeTraitBag) === false; canCross(legacyTraitBag, ...) where __kind is undefined treats it as native. Cover manual footnote conditional: getEgregoreManualEntries(state) returns entries without footnote when state.manualDiscoveries has no flora:* entry; adding a single flora:clover entry to manualDiscoveries causes every egregore entry to gain a footnote line on the next call. Use the existing manual entry fixture pattern.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-genome-and-cross-predicate
      - egregore-manual-footnote
    context_files:
      - src/engine/genetics/egregore.ts
      - src/engine/genetics/index.ts
      - src/engine/manual.ts
      - src/engine/egregore.ts
    output_files:
      - src/engine/__tests__/egregore-crossbreed.test.ts
    depends_on:
      - add-manual-incompatibility-footnote
    verification:
      - npx vitest run src/engine/__tests__/egregore-crossbreed.test.ts
    repair: retry
    tags:
      - test

  - id: update-existing-egregore-advance-test
    title: 'Update src/engine/__tests__/egregore-advance.test.ts to reflect the refactor: the existing test for advanceEgregoreFirstRevery becomes a test for advanceEgregoreInRevery with reveryCount === 0 (must still place exactly 3 tiles, preserving the RP-4 contract). Add new test cases for advanceEgregoreInRevery with reveryCount >= 1 (places 6–9 tiles deterministically). Verify the function appends to both state.egregorePositions and state.egregoreLifecycle. Verify trail centroid bias is preserved.'
    spec_id: RP-8b-egregoric-mechanical
    spec_sections:
      - egregore-revery-spread-refactor
    context_files:
      - src/engine/__tests__/egregore-advance.test.ts
      - src/engine/egregore/spread.ts
      - src/engine/revery.ts
    output_files:
      - src/engine/__tests__/egregore-advance.test.ts
    depends_on:
