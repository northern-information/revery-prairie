plan:
  id: precis-2-phenological-seasons
  title: Phenological seasons — annual clock, derived season, dormant flora, snow, winter palette wash
  created: 2026-05-18
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + dashboard status ---

  - id: doctrine-status-update
    title: Flip precis-status.yaml feature 2 to in-progress with spec/plan links
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - docs/precis-status.yaml
    output_files:
      - docs/precis-status.yaml
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Field renames and new GameState fields ---

  - id: rename-rain-intensity
    title: Rename state.rainIntensity → precipitationIntensity and tickRainIntensity → tickPrecipitationIntensity across the codebase. 8 files affected.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - precipitation-intensity-rename
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/tileWater.ts
      - src/engine/weather/index.ts
      - src/engine/render/passes/weatherRainOverlay.ts
      - src/engine/__tests__/tileWater.test.ts
      - src/engine/__tests__/weather.test.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/tileWater.ts
      - src/engine/weather/index.ts
      - src/engine/render/passes/weatherRainOverlay.ts
      - src/engine/__tests__/tileWater.test.ts
      - src/engine/__tests__/weather.test.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/tileWater.test.ts src/engine/__tests__/weather.test.ts
    repair: retry
    tags:
      - engine
      - rename

  - id: add-seasonal-phase-state
    title: Add state.seasonalPhase (number, [0, 1)) and add SEASONAL_PHASE_PERIOD_MS constant. Update schema allowlist.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - hidden-annual-clock
      - schema-allowlist-updated
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - rename-rain-intensity
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - engine

  - id: add-snow-sky-and-dormant-stage
    title: Add Sky.Snow to the Sky enum; add FloraStage.Dormant to the FloraStage enum.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - snow-sky-during-winter
      - flora-stage-dormant-added
    context_files:
      - src/engine/types.ts
    output_files:
      - src/engine/types.ts
    depends_on:
      - add-seasonal-phase-state
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - types

  # --- Tier 2: Weather machinery (clock + derivation + seasonal bias) ---

  - id: seasonal-phase-clock
    title: Advance state.seasonalPhase in tickWeather only when state.currentZone === Zone.Overworld. Wrap at 1.0.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - hidden-annual-clock
    context_files:
      - src/engine/weather/index.ts
      - src/engine/constants.ts
      - src/engine/types.ts
    output_files:
      - src/engine/weather/index.ts
    depends_on:
      - add-snow-sky-and-dormant-stage
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/weather.test.ts
    repair: retry
    tags:
      - engine
      - weather

  - id: seasonal-temperature-bias
    title: Expand temperature range to [-5, 95]; bias drift toward seasonal mean keyed by state.seasonalPhase. Same for humidity / wind direction biases.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - weather-tempers-toward-seasonal-mean
    context_files:
      - src/engine/weather/index.ts
      - src/engine/types.ts
    output_files:
      - src/engine/weather/index.ts
    depends_on:
      - seasonal-phase-clock
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/weather.test.ts
    repair: retry
    tags:
      - engine
      - weather

  - id: derive-season-and-pickSky
    title: Add deriveSeason(temperatureF, seasonalPhase); call it at every tickWeather and store the result on weather.season. Update pickSky to return Sky.Snow during winter humid conditions.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - season-derived-from-temperature
      - snow-sky-during-winter
    context_files:
      - src/engine/weather/index.ts
      - src/engine/types.ts
    output_files:
      - src/engine/weather/index.ts
    depends_on:
      - seasonal-temperature-bias
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/weather.test.ts
    repair: retry
    tags:
      - engine
      - weather

  - id: tick-precipitation-intensity-handles-snow
    title: tickPrecipitationIntensity treats both Sky.Rain and Sky.Snow as positive targets (fade toward 1); Sky.Sun and Sky.Cloudy fade toward 0.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - precipitation-intensity-rename
      - snow-sky-during-winter
    context_files:
      - src/engine/weather/index.ts
      - src/engine/types.ts
    output_files:
      - src/engine/weather/index.ts
    depends_on:
      - derive-season-and-pickSky
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/weather.test.ts
    repair: retry
    tags:
      - engine
      - weather

  # --- Tier 3: Flora lifecycle response ---

  - id: dormant-stage-lifecycle
    title: Implement Winter → Dormant and thaw → Healthy transitions in tickFloraLifecycle. Suppress growth previews and pollen emission while season === Winter. No debounce.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - winter-puts-flora-dormant
      - thaw-revives-dormant-flora
    context_files:
      - src/engine/floraLifecycle.ts
      - src/engine/clover.ts
      - src/engine/flora/actions/pollinate.ts
      - src/engine/types.ts
    output_files:
      - src/engine/floraLifecycle.ts
      - src/engine/clover.ts
    depends_on:
      - derive-season-and-pickSky
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/cloverLifecycle.test.ts
    repair: retry
    tags:
      - engine
      - flora

  # --- Tier 4: Rendering ---

  - id: dormant-flora-render
    title: Renderer handles FloraStage.Dormant — same glyph as Healthy, color desaturated toward a winter brown-green per species.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - dormant-flora-render
    context_files:
      - src/engine/renderer.ts
      - src/engine/flora/species.ts
      - src/engine/types.ts
    output_files:
      - src/engine/renderer.ts
    depends_on:
      - dormant-stage-lifecycle
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - render

  - id: snow-render-pass
    title: Create src/engine/render/passes/weatherSnowOverlay.ts mirroring weatherRainOverlay but drawing slow-drifting snowflake glyphs in white/grey when state.weather.sky === Sky.Snow. Register in passes/index.ts in the 'effect' slot.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - snow-render-pass
    context_files:
      - src/engine/render/passes/weatherRainOverlay.ts
      - src/engine/render/passes/index.ts
      - src/engine/types.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/render/passes/weatherSnowOverlay.ts
      - src/engine/render/passes/index.ts
    depends_on:
      - tick-precipitation-intensity-handles-snow
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - render

  - id: winter-palette-wash
    title: Apply a per-tile color blend toward winter grey when season === Winter in the overworld zone. Implementation lives behind applyWinterWash(color, intensity) in tileBg.ts and is invoked from the central tile-glyph loop in renderer.ts. Egregore tiles short-circuit the wash. Cave/ruin zones are exempt.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - winter-palette-shift
    context_files:
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
      - src/engine/types.ts
    output_files:
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
    depends_on:
      - dormant-flora-render
      - snow-render-pass
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - render

  # --- Tier 5: Sidebar ---

  - id: sidebar-season-row
    title: Add a 'Season:' row to the sidebar weather panel after temperature. Hidden in cave/ruin zones.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - sidebar-season-row
    context_files:
      - src/components/Sidebar.tsx
      - src/engine/types.ts
    output_files:
      - src/components/Sidebar.tsx
    depends_on:
      - derive-season-and-pickSky
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - component

  # --- Tier 6: Tests ---

  - id: add-seasonal-tests
    title: Add tests for seasonalPhase advancement (overworld only), deriveSeason thresholds, winter → Dormant transition, thaw → Healthy transition, snow sky during winter humid conditions, no flora lifecycle progression in cave zone for seasonal clock.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - hidden-annual-clock
      - season-derived-from-temperature
      - winter-puts-flora-dormant
      - thaw-revives-dormant-flora
      - snow-sky-during-winter
      - winter-during-cave-visit
      - temperature-spike-mid-winter
    context_files:
      - src/engine/__tests__/weather.test.ts
      - src/engine/__tests__/cloverLifecycle.test.ts
      - src/engine/__tests__/helpers.ts
    output_files:
      - src/engine/__tests__/weather.test.ts
      - src/engine/__tests__/cloverLifecycle.test.ts
    depends_on:
      - dormant-stage-lifecycle
      - tick-precipitation-intensity-handles-snow
    verification:
      - npx vitest run src/engine/__tests__/weather.test.ts src/engine/__tests__/cloverLifecycle.test.ts
    repair: retry
    tags:
      - test
      - engine

  - id: update-existing-tests
    title: Update tests that assume weather.season === Spring indefinitely, or assume the spring-only temperature range, or read state.rainIntensity by its old name. Surface any failures.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - existing-spring-only-tests
      - precipitation-intensity-rename
    context_files:
      - src/engine/__tests__/tileWater.test.ts
      - src/engine/__tests__/wildfire.test.ts
      - src/engine/__tests__/clover.test.ts
      - src/engine/__tests__/lightning.test.ts
    output_files:
      - src/engine/__tests__/tileWater.test.ts
      - src/engine/__tests__/wildfire.test.ts
      - src/engine/__tests__/clover.test.ts
      - src/engine/__tests__/lightning.test.ts
    depends_on:
      - rename-rain-intensity
      - dormant-stage-lifecycle
    verification:
      - npx vitest run src/engine/__tests__/tileWater.test.ts src/engine/__tests__/wildfire.test.ts src/engine/__tests__/clover.test.ts src/engine/__tests__/lightning.test.ts
    repair: retry
    tags:
      - test
      - engine

  # --- Tier 7: Docs ---

  - id: claude-md-seasons
    title: Update CLAUDE.md `## weather` section — remove the "season hardcoded to spring" line; add a paragraph on the phenological cycle, the Dormant stage, the snow render pass, and the winter palette wash. Reference the precipitationIntensity rename.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - CLAUDE.md
    output_files:
      - CLAUDE.md
    depends_on:
      - dormant-stage-lifecycle
      - winter-palette-wash
      - sidebar-season-row
    verification: []
    repair: retry
    tags:
      - docs

  # --- Tier 8: Final sweep ---

  - id: dead-symbol-sweep
    title: Grep for stale rainIntensity references; confirm seasonalPhase / precipitationIntensity / Sky.Snow / FloraStage.Dormant are all consistently used; run the full quad.
    spec_id: precis-2-phenological-seasons
    spec_sections:
      - precipitation-intensity-rename
      - hidden-annual-clock
    context_files:
      - src/
    output_files: []
    depends_on:
      - add-seasonal-tests
      - update-existing-tests
      - claude-md-seasons
      - winter-palette-wash
    verification:
      - npm run typecheck
      - npm run lint
      - npm run test
      - npm run spec:validate
    repair: retry
    tags:
      - sweep
