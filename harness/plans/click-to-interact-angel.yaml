plan:
  id: click-to-interact-angel
  title: 'Fix walk-target search to scan full angel body perimeter instead of single clicked tile'
  created: '2026-04-14'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: fix-walk-target-multi-position
    title: 'Expand walk-target search to scan all tiles adjacent to angel MultiPosition body'
    spec_id: click-to-interact-angel
    spec_sections:
      - click-angel-body-pathfinds
      - click-angel-interior-tile-pathfinds
    context_files:
      - src/hooks/useMouse.ts
      - src/engine/ecs/types.ts
      - src/engine/position.ts
      - src/engine/movement.ts
    output_files:
      - src/hooks/useMouse.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/angels.test.ts
    repair: retry
    tags: [hook]

  - id: add-interior-tile-regression-test
    title: 'Add regression test: clicking interior angel body tile finds walk target on body perimeter'
    spec_id: click-to-interact-angel
    spec_sections:
      - click-angel-interior-tile-pathfinds
    context_files:
      - src/engine/__tests__/angels.test.ts
      - src/engine/angels.ts
      - src/engine/ecs/types.ts
      - src/engine/position.ts
      - src/engine/movement.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/__tests__/angels.test.ts
    depends_on:
      - fix-walk-target-multi-position
    verification:
      - npx vitest run src/engine/__tests__/angels.test.ts
    repair: retry
    tags: [test]
