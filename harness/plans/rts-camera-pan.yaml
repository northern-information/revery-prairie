plan:
  id: rts-camera-pan
  title: 'Add RTS-style camera pan with edge-scroll, free/follow mode, off-screen indicator'
  created: '2026-04-30'
  global_verification:
    - 'npm run build'
    - 'npm run test'
    - 'npm run lint'

tasks:
  - id: add-camera-mode-state
    title: 'Add cameraMode and edge-scroll constants to GameState + schema test'
    spec_id: rts-camera-pan
    spec_sections:
      - camera-mode-default-follow
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: []
    verification:
      - 'npx tsc -b --noEmit'
      - 'npx vitest run src/harness/__tests__/serialization/schema.test.ts'
    repair: retry
    tags: [engine]

  - id: gate-update-camera
    title: 'Make updateCamera early-return in free mode unless forceCenter is true'
    spec_id: rts-camera-pan
    spec_sections:
      - update-camera-respects-free-mode
    context_files:
      - src/engine/camera.ts
    output_files:
      - src/engine/camera.ts
    depends_on:
      - add-camera-mode-state
    verification:
      - 'npx tsc -b --noEmit'
      - 'npx vitest run src/engine/__tests__/camera.test.ts'
    repair: retry
    tags: [engine]

  - id: create-edge-scroll-module
    title: 'Create src/engine/edgeScroll.ts with tickEdgeScroll'
    spec_id: rts-camera-pan
    spec_sections:
      - edge-scroll-activates-free-mode
    context_files:
      - src/engine/types.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/edgeScroll.ts
    depends_on:
      - add-camera-mode-state
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: wire-edge-scroll-tick
    title: 'Register edge-scroll tick in gameLoop'
    spec_id: rts-camera-pan
    spec_sections:
      - edge-scroll-activates-free-mode
    context_files:
      - src/engine/gameLoop.ts
      - src/engine/edgeScroll.ts
    output_files:
      - src/engine/gameLoop.ts
    depends_on:
      - create-edge-scroll-module
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: wasd-recenter-after-move
    title: 'WASD keyboard-move tick recenters camera after successful moves'
    spec_id: rts-camera-pan
    spec_sections:
      - wasd-recenters-camera
    context_files:
      - src/engine/gameLoop.ts
      - src/engine/camera.ts
    output_files:
      - src/engine/gameLoop.ts
    depends_on:
      - gate-update-camera
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: off-screen-indicator
    title: 'Renderer draws off-screen player arrow when player is outside viewport'
    spec_id: rts-camera-pan
    spec_sections:
      - off-screen-player-indicator
    context_files:
      - src/engine/renderer.ts
      - src/engine/projection.ts
    output_files:
      - src/engine/renderer.ts
    depends_on:
      - create-edge-scroll-module
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: add-edge-scroll-tests
    title: 'Add edge-scroll unit tests (corner cases, clamping, mode transitions)'
    spec_id: rts-camera-pan
    spec_sections:
      - edge-scroll-activates-free-mode
      - update-camera-respects-free-mode
    context_files:
      - src/engine/edgeScroll.ts
      - src/engine/camera.ts
    output_files:
      - src/engine/__tests__/edgeScroll.test.ts
    depends_on:
      - create-edge-scroll-module
      - gate-update-camera
    verification:
      - 'npx vitest run src/engine/__tests__/edgeScroll.test.ts'
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [test]
