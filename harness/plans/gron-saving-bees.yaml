    title: 'Append "Here, I''ve been saving these." to GRON_DIALOG_SEALED'
    spec_id: main-questline-foundation
    spec_sections:
      - gron-dialog-phase-dispatch
    context_files:
      - src/engine/characters.ts
    output_files:
      - src/engine/characters.ts
    depends_on: []
    verification:
