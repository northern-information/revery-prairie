plan:
  id: genesis-playback-bugs
  title: Fix genesis snapshot incompleteness causing visual flashing during epoch playback
  created: '2026-04-13'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: expand-epoch-snapshot
    title: Add 11 missing fields to EpochSnapshot interface in genesisTypes.ts
    spec_id: genesis-playback-bugs
    spec_sections:
      - snapshot-completeness
    context_files:
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/genesisTypes.ts
    depends_on: []
    verification:
      - npm run build
    repair: retry
    tags: [engine]

  - id: expand-precompute-snapshots
    title: Clone all 15 fields in precomputeGenesis and swap all in renderGenesis
    spec_id: genesis-playback-bugs
    spec_sections:
      - snapshot-completeness
      - crossfade-isolation
      - no-future-state-leakage
    context_files:
      - src/engine/genesis.ts
      - src/engine/genesisRenderer.ts
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/genesis.ts
      - src/engine/genesisRenderer.ts
    depends_on:
      - expand-epoch-snapshot
    verification:
      - npm run build
      - npx vitest run src/engine/__tests__/genesis.test.ts
    repair: retry
    tags: [engine]

  - id: regression-test
    title: Add tests verifying early epoch snapshots are empty and late snapshots are populated
    spec_id: genesis-playback-bugs
    spec_sections:
      - snapshot-completeness
      - no-future-state-leakage
    context_files:
      - src/engine/__tests__/genesis.test.ts
      - src/engine/genesis.ts
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/__tests__/genesis.test.ts
    depends_on:
      - expand-precompute-snapshots
    verification:
      - npx vitest run src/engine/__tests__/genesis.test.ts
    repair: retry
    tags: [test]
