plan:
  id: dev-panel-ruin-spawner
  title: 'Add a dev panel preset that drag-and-drops ruins with selectable archetype and glyph'
  created: '2026-04-25'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: ruin-interior-glyph-field
    title: 'Add optional glyph field to RuinInterior'
    spec_id: dev-panel-ruin-spawner
    spec_sections:
      - glyph-override
    context_files:
      - src/engine/types.ts
      - src/engine/ruins.ts
    output_files:
      - src/engine/types.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: renderer-glyph-override
    title: 'Renderer prefers RuinInterior.glyph over getEntranceGlyph(index) when set'
    spec_id: dev-panel-ruin-spawner
    spec_sections:
      - glyph-override
    context_files:
      - src/engine/renderer.ts
      - src/engine/constants.ts
      - src/engine/types.ts
    output_files:
      - src/engine/renderer.ts
    depends_on:
      - ruin-interior-glyph-field
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: dev-panel-engine
    title: 'Add Ruin preset metadata, glyph options, and spawnDevRuin helper in devPanel.ts'
    spec_id: dev-panel-ruin-spawner
    spec_sections:
      - ruin-preset
      - drag-place-ruin
      - ruin-interior-construction
      - drop-validation
    context_files:
      - src/engine/devPanel.ts
      - src/engine/ruins.ts
      - src/engine/genesisTypes.ts
      - src/engine/types.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/devPanel.ts
    depends_on:
      - ruin-interior-glyph-field
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: dev-panel-ruin-ui
    title: 'Wire Ruin preset into DevPanel.tsx: dropdowns, drag-to-place, preview glyph'
    spec_id: dev-panel-ruin-spawner
    spec_sections:
      - ruin-preset
      - drag-place-ruin
    context_files:
      - src/components/DevPanel.tsx
      - src/engine/devPanel.ts
      - src/engine/types.ts
      - src/engine/constants.ts
    output_files:
      - src/components/DevPanel.tsx
    depends_on:
      - dev-panel-engine
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [component]

  - id: engine-tests
    title: 'Add engine tests for spawnDevRuin: validation, archetype dispatch, glyph resolution'
    spec_id: dev-panel-ruin-spawner
    spec_sections:
      - drag-place-ruin
      - ruin-interior-construction
      - drop-validation
      - glyph-override
    context_files:
      - src/engine/devPanel.ts
      - src/engine/ruins.ts
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/engine/__tests__/angels.test.ts
    output_files:
      - src/engine/__tests__/devPanelRuinSpawner.test.ts
    depends_on:
      - dev-panel-engine
      - renderer-glyph-override
    verification:
      - npx vitest run src/engine/__tests__/devPanelRuinSpawner.test.ts
    repair: retry
    tags: [test]
