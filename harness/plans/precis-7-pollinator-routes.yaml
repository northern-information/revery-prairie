plan:
  id: precis-7-pollinator-routes
  title: 'Pollinator routes & preference — bee routing + pollen bias driven by species baseline × per-plant genetics trait'
  created: 2026-05-19
  # Engine-layer feature touching tickBees + tickPollenEmit. Both are hot paths
  # for state behavior, so use the full suite as the cross-cutting gate. Per-task
  # verification stays narrow for fast local iteration.
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine status ---

  - id: doctrine-status-update
    title: Flip precis #7 from todo to in-progress in docs/precis-status.yaml. Set spec/plan paths. Update docs/claude/entities.md bees bullet — remove "broader pollinator routes are precis #7" caveat, document the new weighted routing rule briefly. Update docs/claude/flora.md if it mentions pollinator preference.
    spec_id: precis-7-pollinator-routes
    spec_sections: []
    context_files:
      - docs/precis-status.yaml
      - docs/claude/entities.md
      - docs/claude/flora.md
    output_files:
      - docs/precis-status.yaml
      - docs/claude/entities.md
      - docs/claude/flora.md
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Species registry — add beePreference baseline ---

  - id: add-bee-preference-to-species
    title: 'Add `beePreference: number` to FloraSpeciesDef in src/engine/flora/species.ts. Set Clover=1.0, Wildflower=0.6, TallGrass=0.3. Update the type and the three species literals. The new field is part of the `as const satisfies` registry shape — TypeScript will fail if any species is missing it.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - species-bee-preference-baseline
    context_files:
      - src/engine/flora/species.ts
      - src/engine/types.ts
    output_files:
      - src/engine/flora/species.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 2: Pure preference helper ---

  - id: create-tile-bee-preference-helper
    title: 'Add `getTileBeePreference(state: GameState, x: number, y: number): number` to src/engine/flora/species.ts (or a new src/engine/pollinator.ts if species.ts gains too much logic — prefer species.ts since the helper is a thin read over the registry). Formula: if tile is Flora and has lifecycle entry, return `clamp01(species.beePreference * (0.75 + 0.5 * traits.pollinatorPreference))`. Else return 0. Use existing isInBounds for defense-in-depth. Pure function, no mutation.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - tile-bee-preference-blend
    context_files:
      - src/engine/flora/species.ts
      - src/engine/types.ts
      - src/engine/position.ts
    output_files:
      - src/engine/flora/species.ts
    depends_on:
      - add-bee-preference-to-species
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: tile-bee-preference-tests
    title: 'Create src/engine/__tests__/tileBeePreference.test.ts. Cover: Flora tile with mid-range trait returns species.beePreference; clover with trait=1.0 clamps to 1.0; non-Flora tile returns 0; Flora tile with missing lifecycle entry returns 0; out-of-bounds coords return 0; wildflower at trait=0 returns 0.45 (0.6 × 0.75); tall grass at trait=1 returns 0.375 (0.3 × 1.25).'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - tile-bee-preference-blend
      - flora-tile-no-lifecycle-entry
      - trait-bag-extreme-values
    context_files:
      - src/engine/flora/species.ts
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/floraLifecycle.ts
    output_files:
      - src/engine/__tests__/tileBeePreference.test.ts
    depends_on:
      - create-tile-bee-preference-helper
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/tileBeePreference.test.ts
    repair: retry
    tags:
      - engine
      - test

  # --- Tier 3: Bee routing rewrite ---

  - id: rewrite-bee-routing-weighted
    title: 'Rewrite tickBees neighbor selection in src/engine/entities.ts. Replace the cloverCandidates/walkableCandidates split with a single weighted pass: for each ordinal neighbor in bounds, if isWalkableTile, weight = getTileBeePreference(state, nx, ny) || 0.05 (Flora tiles use their preference; non-Flora walkable tiles use 0.05 baseline so bees still wander). Pick proportionally via cumulative weight + Math.random() * totalWeight. If totalWeight === 0, skip move. Preserve the existing 30% move gate. Delete isCloverTileAt and the cloverCandidates path (now covered by the weighted helper). Keep BEE_TICK_MS untouched.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - bee-routing-by-preference
      - bee-on-non-walkable-island
    context_files:
      - src/engine/entities.ts
      - src/engine/flora/species.ts
      - src/engine/types.ts
      - src/engine/position.ts
      - src/engine/movement.ts
    output_files:
      - src/engine/entities.ts
    depends_on:
      - create-tile-bee-preference-helper
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/entities.test.ts
    repair: retry
    tags:
      - engine

  - id: update-bee-starvation-multi-species
    title: 'Update isBeeNearFood in src/engine/entities.ts. The check is currently isCloverTileAt — replace with: a tile is food if it is Flora AND its species.beePreference > 0 (looked up via the species registry from the floraLifecycle entry). Bee tile + 4 cardinal neighbors. Wildflower and tall grass now count as food for the bee starvation timer.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - bee-starvation-multi-species
    context_files:
      - src/engine/entities.ts
      - src/engine/flora/species.ts
      - src/engine/types.ts
      - src/engine/floraLifecycle.ts
    output_files:
      - src/engine/entities.ts
    depends_on:
      - rewrite-bee-routing-weighted
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: bee-routing-tests
    title: 'Create src/engine/__tests__/bee-routing.test.ts. Cover: deterministic seed (vi.spyOn(Math, "random")) — bee surrounded by clover and bare ground heavily favors clover over many ticks; bee surrounded by wildflower + tall grass picks proportional to their species baselines; bee with no walkable neighbors does not move and does not crash; non-clover flora now counts as food in isBeeNearFood. Use clearAroundPlayer() and explicit floraLifecycle entries (per docs/claude/testing.md). Restore Math.random in finally.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - bee-routing-by-preference
      - bee-starvation-multi-species
      - bee-on-non-walkable-island
      - bee-tick-zero-preference-flora
    context_files:
      - src/engine/entities.ts
      - src/engine/state.ts
      - src/engine/floraLifecycle.ts
      - src/engine/flora/species.ts
      - src/engine/__tests__/entities.test.ts
      - docs/claude/testing.md
    output_files:
      - src/engine/__tests__/bee-routing.test.ts
    depends_on:
      - rewrite-bee-routing-weighted
      - update-bee-starvation-multi-species
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/bee-routing.test.ts
    repair: retry
    tags:
      - engine
      - test

  # --- Tier 4: Pollen emit bias ---

  - id: bias-pollen-emit-by-trait
    title: 'Update tickPollenEmit in src/engine/flora/actions/pollinate.ts. After computing the per-tile emit candidate (when `state.map[ty]?.[tx]?.type === tileType` matches), look up the floraLifecycle entry for posKey(tx, ty). If present, multiply emitProb by `(0.5 + 0.5 * entry.traits.pollinatorPreference)`. If absent, treat multiplier as 1.0 (no Flora-specific bias). Winter early-return stays at the top of the function — no change there.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - pollen-emit-bias
      - winter-dormancy-still-suppresses-pollen
    context_files:
      - src/engine/flora/actions/pollinate.ts
      - src/engine/types.ts
      - src/engine/position.ts
    output_files:
      - src/engine/flora/actions/pollinate.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: pollen-emit-bias-tests
    title: 'Create src/engine/__tests__/pollen-emit-bias.test.ts. Cover: high-trait plant emits more pollen than low-trait plant of same species over many ticks (mock Math.random — count emissions per tile); winter early-return still produces zero emissions regardless of trait; missing lifecycle entry uses unmodified emitProb; particles do not exceed MAX_POLLEN.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - pollen-emit-bias
      - winter-dormancy-still-suppresses-pollen
    context_files:
      - src/engine/flora/actions/pollinate.ts
      - src/engine/state.ts
      - src/engine/floraLifecycle.ts
      - src/engine/types.ts
      - docs/claude/testing.md
    output_files:
      - src/engine/__tests__/pollen-emit-bias.test.ts
    depends_on:
      - bias-pollen-emit-by-trait
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/pollen-emit-bias.test.ts
    repair: retry
    tags:
      - engine
      - test

  # --- Tier 5: Wire the test stub ---

  - id: fill-in-spec-test-stub
    title: 'Replace the it.todo placeholders in src/engine/__tests__/precis-7-pollinator-routes.test.ts with thin integration assertions that exercise each behavior end-to-end: bee picks high-preference neighbor more often, isBeeNearFood is true for non-clover flora, pollen bias produces more particles from high-trait plant. The detailed unit tests live in tileBeePreference.test.ts, bee-routing.test.ts, and pollen-emit-bias.test.ts — this file is the spec''s acceptance surface.'
    spec_id: precis-7-pollinator-routes
    spec_sections:
      - species-bee-preference-baseline
      - tile-bee-preference-blend
      - bee-routing-by-preference
      - bee-starvation-multi-species
      - pollen-emit-bias
    context_files:
      - src/engine/__tests__/precis-7-pollinator-routes.test.ts
      - src/engine/entities.ts
      - src/engine/flora/actions/pollinate.ts
      - src/engine/flora/species.ts
      - src/engine/state.ts
      - docs/claude/testing.md
    output_files:
      - src/engine/__tests__/precis-7-pollinator-routes.test.ts
    depends_on:
      - bee-routing-tests
      - pollen-emit-bias-tests
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/precis-7-pollinator-routes.test.ts
    repair: retry
    tags:
      - engine
      - test

  # global_verification runs the full typecheck + test + lint suite after the
  # final task. No dedicated full-verify task — the global gate covers it and
  # keeps plan validation clean.
