plan:
  id: inventory-simplification
  title: 'Remove fabrication, omniboxes, item shapes/weight/rotation; expand backpack to 10x100; all items 1x1'
  created: '2026-04-14'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: strip-types
    title: 'Remove Rotation, shape, weight from types and ItemDefinition/ItemInstance'
    spec_id: inventory-management
    spec_sections:
      - can-place
      - place-item
      - move-item
      - find-fit-position
    context_files:
      - src/engine/types.ts
    output_files:
      - src/engine/types.ts
    depends_on: []
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: strip-items
    title: 'Remove permacomputer/omnibox definitions, strip shape/weight from all items, expand backpack to 10x100'
    spec_id: inventory-management
    spec_sections:
      - place-item
      - find-fit-position
    context_files:
      - src/engine/items.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/items.ts
      - src/engine/constants.ts
    depends_on:
      - strip-types
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: simplify-inventory
    title: 'Rewrite inventory.ts: remove rotation/shape logic, simplify to 1x1 grid, remove createOmniboxContainer'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
      - can-place
      - place-item
      - move-item
      - find-fit-position
      - auto-sort
      - transfer-item
    context_files:
      - src/engine/inventory.ts
    output_files:
      - src/engine/inventory.ts
    depends_on:
      - strip-types
      - strip-items
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: strip-recipes
    title: 'Remove fabrication recipes, FabricationRecipe interface, findFabricationRecipe, preserveIngredient from Recipe'
    spec_id: recipes
    spec_sections:
      - recipe-definitions
      - execute-combine
    context_files:
      - src/engine/recipes.ts
    output_files:
      - src/engine/recipes.ts
    depends_on:
      - simplify-inventory
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: simplify-combine
    title: 'Remove omnibox store logic from checkCombine, remove openContainer references from combineBeeAndClover'
    spec_id: item-combining
    spec_sections:
      - check-combine
      - combine-bee-and-clover
    context_files:
      - src/engine/combine.ts
    output_files:
      - src/engine/combine.ts
    depends_on:
      - strip-recipes
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: simplify-drag
    title: 'Remove rotation, omnibox store, fabrication from drag.ts; simplify DragState and computePlacementPreview'
    spec_id: recipes
    spec_sections:
      - execute-combine
    context_files:
      - src/engine/drag.ts
    output_files:
      - src/engine/drag.ts
    depends_on:
      - simplify-combine
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: delete-omnibox
    title: 'Delete src/engine/omnibox.ts and remove all omnibox state fields from GameState and state.ts'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
    context_files:
      - src/engine/omnibox.ts
      - src/engine/state.ts
      - src/engine/types.ts
    output_files:
      - src/engine/omnibox.ts
      - src/engine/state.ts
      - src/engine/types.ts
    depends_on:
      - simplify-drag
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: fix-callers
    title: 'Fix all remaining callers: interaction.ts, movement.ts, entities.ts, useKeyboard.ts, useInventoryDrag.ts, renderer, InventoryPanel, Sidebar, manual — remove rotation params, omnibox refs, fabrication UI'
    spec_id: inventory-management
    spec_sections:
      - place-item
      - can-place
    context_files:
      - src/engine/interaction.ts
      - src/engine/movement.ts
      - src/engine/entities.ts
      - src/hooks/useKeyboard.ts
      - src/hooks/useInventoryDrag.ts
      - src/components/InventoryPanel.tsx
      - src/components/InventoryGrid.tsx
      - src/components/Sidebar.tsx
      - src/components/DragCursor.tsx
      - src/engine/manual.ts
      - src/engine/effects.ts
    output_files:
      - src/engine/interaction.ts
      - src/engine/movement.ts
      - src/engine/entities.ts
      - src/hooks/useKeyboard.ts
      - src/hooks/useInventoryDrag.ts
      - src/components/InventoryPanel.tsx
      - src/components/InventoryGrid.tsx
      - src/components/Sidebar.tsx
      - src/components/DragCursor.tsx
      - src/engine/manual.ts
      - src/engine/effects.ts
    depends_on:
      - delete-omnibox
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine, component]

  - id: fix-constants
    title: 'Remove OMNIBOX_WIDTH, OMNIBOX_HEIGHT from constants.ts'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
    context_files:
      - src/engine/constants.ts
    output_files:
      - src/engine/constants.ts
    depends_on:
      - fix-callers
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: fix-ecs-types
    title: 'Remove OmniboxLink from ECS component types if present'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
    context_files:
      - src/engine/ecs/types.ts
    output_files:
      - src/engine/ecs/types.ts
    depends_on:
      - fix-callers
    verification:
      - npx tsc --noEmit 2>&1 | head -50
    repair: retry
    tags: [engine]

  - id: fix-schema-test
    title: 'Update EXPECTED_FIELDS in schema.test.ts to remove omnibox/recipe fields'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
    context_files:
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - delete-omnibox
    verification:
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags: [test]

  - id: update-tests
    title: 'Rewrite engine tests: inventory, recipes, combine, drag, omnibox, items — remove rotation/shape/weight/omnibox assertions, update for 1x1 flat grid'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
      - can-place
      - place-item
      - auto-sort
    context_files:
      - src/engine/__tests__/inventory.test.ts
      - src/engine/__tests__/recipes.test.ts
      - src/engine/__tests__/combine.test.ts
      - src/engine/__tests__/drag.test.ts
      - src/engine/__tests__/omnibox.test.ts
      - src/engine/__tests__/items.test.ts
    output_files:
      - src/engine/__tests__/inventory.test.ts
      - src/engine/__tests__/recipes.test.ts
      - src/engine/__tests__/combine.test.ts
      - src/engine/__tests__/drag.test.ts
      - src/engine/__tests__/items.test.ts
    depends_on:
      - fix-callers
      - fix-constants
      - fix-ecs-types
    verification:
      - npx vitest run src/engine/__tests__/inventory.test.ts src/engine/__tests__/recipes.test.ts src/engine/__tests__/combine.test.ts src/engine/__tests__/drag.test.ts src/engine/__tests__/items.test.ts
    repair: retry
    tags: [test]

  - id: update-remaining-tests
    title: 'Fix any remaining test files that reference rotation, omnibox, fabrication, weight, shape, permacomputer'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
    context_files:
      - src/engine/__tests__/
      - src/components/__tests__/
      - src/harness/__tests__/
    output_files:
      - src/engine/__tests__/
      - src/components/__tests__/
      - src/harness/__tests__/
    depends_on:
      - update-tests
    verification:
      - npm run test
    repair: retry
    tags: [test]

  - id: final-verification
    title: 'Run full build, lint, and test suite'
    spec_id: inventory-management
    spec_sections:
      - occupancy-grid
    context_files: []
    output_files: []
    depends_on:
      - update-remaining-tests
      - fix-schema-test
    verification:
      - npm run build
      - npm run test
      - npm run lint
    repair: retry
    tags: [verification]
