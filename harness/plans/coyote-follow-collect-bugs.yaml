    spec_id: coyote-follow-collect-bugs
    spec_sections:
      - collect-meteorite-entities
      - collect-honey-entities
    context_files:
      - src/engine/coyote.ts
      - src/engine/celestial.ts
      - src/engine/ecs/types.ts
    output_files:
      - src/engine/coyote.ts
    depends_on: []
    verification:
      - npm run build
    repair: retry
    tags: [engine]

  - id: fix-tests
    title: Update coyote tests to use production entity shapes and cover dead zone
    spec_id: coyote-follow-collect-bugs
    spec_sections:
      - follow-distance-threshold
      - collect-meteorite-entities
      - collect-honey-entities
    context_files:
      - src/engine/__tests__/coyote.test.ts
      - src/engine/__tests__/helpers.ts
      - src/engine/coyote.ts
    output_files:
      - src/engine/__tests__/coyote.test.ts
