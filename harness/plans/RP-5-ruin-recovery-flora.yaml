plan:
  id: RP-5-ruin-recovery-flora
  title: Drop the +2 Wildflower / TallGrass starter ruins (RP-5 amendment 2026-06-05)
  created: 2026-06-05
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 1: Placement layer ---

  - id: shrink-starter-roles
    title: Set STARTER_ROLES to [Clover, Bee, Coyote] and numRuins to 3 in 13-riseOfCivilizations.ts
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - starter-mode-spawns-three-ruins
      - ruin-role-enum-retains-flora-species
    context_files:
      - src/engine/genesis/epochs/13-riseOfCivilizations.ts
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/genesis/epochs/13-riseOfCivilizations.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - genesis

  # --- Tier 2: Vault payload ---

  - id: remove-seed-vault-branch
    title: Delete the Wildflower / TallGrass branch in spawnDormantGardenSeeds; update the dormant comment block
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - dormant-garden-seed-spawn-removed
      - existing-main-quest-recovery-path-preserved
    context_files:
      - src/engine/ruins.ts
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/ruins.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - ruins

  # --- Tier 3: Tests ---

  - id: update-genesis-tests
    title: Update genesis tests to expect 3 starter ruins with role order [Clover, Bee, Coyote]
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - starter-mode-spawns-three-ruins
      - same-seed-determinism
    context_files:
      - src/engine/__tests__/genesis.test.ts
    output_files:
      - src/engine/__tests__/genesis.test.ts
    depends_on:
      - shrink-starter-roles
    verification:
      - npx vitest run src/engine/__tests__/genesis.test.ts
    repair: retry
    tags:
      - test
      - engine

  - id: remove-seed-ruin-tests
    title: Delete the Wildflower / TallGrass test cases in ruin-dormant-garden.test.ts; keep Clover / Bee / Coyote cases intact
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - dormant-garden-seed-spawn-removed
      - existing-main-quest-recovery-path-preserved
    context_files:
      - src/engine/__tests__/ruin-dormant-garden.test.ts
    output_files:
      - src/engine/__tests__/ruin-dormant-garden.test.ts
    depends_on:
      - remove-seed-vault-branch
    verification:
      - npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts
    repair: retry
    tags:
      - test
      - engine

  # --- Tier 4: Backlog reconciliation + final sweep ---

  - id: backlog-pivot-notes
    title: Append v11 R12 pivot note to RP-5 backlog entry; amend RP-73 summary to track post-drop reintroduction
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - ruin-role-enum-retains-flora-species
    context_files:
      - docs/backlog.yaml
    output_files:
      - docs/backlog.yaml
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  - id: regression-sweep
    title: Run typecheck + lint + full test suite + spec validate after all edits
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - starter-mode-spawns-three-ruins
      - dormant-garden-seed-spawn-removed
    context_files: []
    output_files: []
    depends_on:
      - update-genesis-tests
      - remove-seed-ruin-tests
      - backlog-pivot-notes
    verification:
      - npm run typecheck
      - npm run lint
      - npm run test
      - npm run spec:validate
    repair: retry
    tags:
      - sweep
