plan:
  id: RP-5-ruin-recovery-flora
  title: Ruin recovery delivers first non-clover species (DormantGarden payload)
  created: 2026-05-18
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + dashboard status (eager, low risk) ---

  - id: doctrine-status-update
    title: Flip backlog.yaml feature 5 to in-progress with spec/plan links
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - docs/backlog.yaml
    output_files:
      - docs/backlog.yaml
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Enum + items ---

  - id: extend-ruin-role-enum
    title: Add Wildflower and TallGrass to the RuinRole enum in genesisTypes.ts
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - ruin-role-extended-with-flora-species
    context_files:
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/genesisTypes.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - types

  - id: reintroduce-seed-items
    title: Add wildflowerSeeds and tallGrassSeeds entries back to ITEM_DEFINITIONS with Flora category and species-matching glyph/color
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - wildflower-seed-item-reintroduced
      - tall-grass-seed-item-reintroduced
    context_files:
      - src/engine/items.ts
      - src/engine/flora/species.ts
      - src/engine/types.ts
    output_files:
      - src/engine/items.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - items

  # --- Tier 2: Genesis allocation + vault payload ---

  - id: genesis-starter-rotation-five-ruins
    title: Bump starter ruin count from 3 to 5; extend STARTER_ROLES with Wildflower and TallGrass in positions 3 and 4
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - starter-mode-spawns-five-ruins
      - ruin-distinct-from-flora-species-ruins
    context_files:
      - src/engine/genesis.ts
      - src/engine/genesisTypes.ts
    output_files:
      - src/engine/genesis.ts
    depends_on:
      - extend-ruin-role-enum
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/genesis.test.ts
    repair: retry
    tags:
      - engine
      - genesis

  - id: vault-payload-flora-seeds
    title: Extend spawnDormantGardenSeeds with branches for RuinRole.Wildflower and RuinRole.TallGrass — each spawns one matching seed item at the first vault slot
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - dormant-garden-spawns-flora-seeds
      - existing-clover-recovery-path-preserved
    context_files:
      - src/engine/ruins.ts
      - src/engine/genesisTypes.ts
      - src/engine/items.ts
    output_files:
      - src/engine/ruins.ts
    depends_on:
      - extend-ruin-role-enum
      - reintroduce-seed-items
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts
    repair: retry
    tags:
      - engine
      - ruins

  # --- Tier 3: Manual entries (auto-generated; just confirm they show up) ---

  - id: manual-entries-confirmation
    title: Confirm wildflowerSeeds and tallGrassSeeds appear in MANUAL_ENTRIES via buildItemEntries; lore stays TODO per repo policy. No code edit unless MANUAL_HIDDEN_ITEM_IDS needs adjustment.
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - seed-item-manual-entries
    context_files:
      - src/engine/manual.ts
      - src/engine/items.ts
    output_files:
      - src/engine/manual.ts
    depends_on:
      - reintroduce-seed-items
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/manual.test.ts
    repair: retry
    tags:
      - engine
      - manual

  # --- Tier 4: Tests ---

  - id: add-flora-ruin-recovery-tests
    title: Add tests for the new vault payload — wildflower-role ruin spawns wildflowerSeeds, tallGrass-role ruin spawns tallGrassSeeds; genesis determinism check for 5-ruin layout
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - dormant-garden-spawns-flora-seeds
      - starter-mode-spawns-five-ruins
      - same-seed-determinism
    context_files:
      - src/engine/__tests__/ruin-dormant-garden.test.ts
      - src/engine/__tests__/genesis.test.ts
      - src/engine/__tests__/helpers.ts
    output_files:
      - src/engine/__tests__/ruin-dormant-garden.test.ts
      - src/engine/__tests__/genesis.test.ts
    depends_on:
      - vault-payload-flora-seeds
      - genesis-starter-rotation-five-ruins
    verification:
      - npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts src/engine/__tests__/genesis.test.ts
    repair: retry
    tags:
      - test
      - engine

  - id: update-existing-tests
    title: Update tests that assume exactly 3 starter ruins or assume RuinRole has only 3 values; surface and fix any failures from the new role allocation
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - starter-mode-spawns-five-ruins
      - existing-clover-recovery-path-preserved
    context_files:
      - src/engine/__tests__/main-questline.test.ts
      - src/engine/__tests__/coyote.test.ts
      - src/engine/__tests__/ruins.test.ts
      - src/engine/__tests__/genesis.test.ts
    output_files:
      - src/engine/__tests__/main-questline.test.ts
      - src/engine/__tests__/coyote.test.ts
      - src/engine/__tests__/ruins.test.ts
    depends_on:
      - genesis-starter-rotation-five-ruins
    verification:
      - npx vitest run src/engine/__tests__/main-questline.test.ts src/engine/__tests__/coyote.test.ts src/engine/__tests__/ruins.test.ts
    repair: retry
    tags:
      - test
      - engine

  # --- Tier 5: Final sweep ---

  - id: dead-symbol-sweep
    title: Grep for stale TODO/comment references to the deleted seed items; remove the "deleted in RP-1" comments in items.ts and ruins.ts now that the items are back; run the full quad
    spec_id: RP-5-ruin-recovery-flora
    spec_sections:
      - wildflower-seed-item-reintroduced
      - tall-grass-seed-item-reintroduced
    context_files:
      - src/engine/items.ts
      - src/engine/ruins.ts
      - src/engine/satellites.ts
    output_files:
      - src/engine/items.ts
      - src/engine/ruins.ts
      - src/engine/satellites.ts
    depends_on:
      - add-flora-ruin-recovery-tests
      - update-existing-tests
      - manual-entries-confirmation
    verification:
      - npm run typecheck
      - npm run lint
      - npm run test
      - npm run spec:validate
    repair: retry
    tags:
      - sweep
