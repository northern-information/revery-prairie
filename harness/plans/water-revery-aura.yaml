plan:
  id: water-revery-aura
  title: 'Replace water revery cross-pattern fill with persistent rain aura'
  created: '2026-05-05'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: types
    title: 'Add aura cast style and waterReveryAura field to GameState'
    spec_id: action-bar
    spec_sections:
      - water-revery-effect
      - activate-action-bar-slot
    context_files:
      - src/engine/types.ts
    output_files:
      - src/engine/types.ts
    depends_on: []
    verification:
      - npm run typecheck
    repair: retry
    tags: [engine]

  - id: state-init
    title: 'Initialize waterReveryAura to null in createGameState'
    spec_id: action-bar
    spec_sections:
      - water-revery-effect
    context_files:
      - src/engine/state.ts
      - src/engine/types.ts
    output_files:
      - src/engine/state.ts
    depends_on: [types]
    verification:
      - npm run typecheck
    repair: retry
    tags: [engine]

  - id: revery-definition
    title: 'Update water revery definition to castStyle aura, castDurationMs 0, remove castPattern'
    spec_id: action-bar
    spec_sections:
      - revery-definitions
    context_files:
      - src/engine/reveries.ts
    output_files:
      - src/engine/reveries.ts
    depends_on: [types]
    verification:
      - npm run typecheck
    repair: retry
    tags: [engine]

  - id: action-bar-cast
    title: 'Handle aura castStyle in activateActionBarSlot; clear existing aura on any revery cast'
    spec_id: action-bar
    spec_sections:
      - activate-action-bar-slot
      - water-revery-effect
    context_files:
      - src/engine/actionBar.ts
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/entities.ts
      - src/engine/effects.ts
    output_files:
      - src/engine/actionBar.ts
    depends_on: [types, state-init, revery-definition]
    verification:
      - npm run typecheck
    repair: retry
    tags: [engine]

  - id: movement-aura-follow
    title: 'Update water aura entity position in movePlayer after each successful move'
    spec_id: action-bar
    spec_sections:
      - water-aura-follows-player
    context_files:
      - src/engine/movement.ts
      - src/engine/types.ts
      - src/engine/ecs/types.ts
    output_files:
      - src/engine/movement.ts
    depends_on: [types, action-bar-cast]
    verification:
      - npm run typecheck
    repair: retry
    tags: [engine]

  - id: schema-test
    title: 'Add waterReveryAura to EXPECTED_FIELDS in serialization schema test'
    spec_id: action-bar
    spec_sections:
      - water-revery-effect
    context_files:
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: [types, state-init]
    verification:
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags: [test]

  - id: tests
    title: 'Update water revery tests; add aura creation, follow, and clear-on-cast tests'
    spec_id: action-bar
    spec_sections:
      - water-revery-effect
      - water-aura-cleared-on-new-revery
      - water-aura-recast
      - water-aura-follows-player
    context_files:
      - src/engine/__tests__/actionBar.test.ts
      - src/engine/__tests__/tileWater.test.ts
      - src/engine/actionBar.ts
      - src/engine/movement.ts
      - src/engine/types.ts
      - src/engine/ecs/types.ts
    output_files:
      - src/engine/__tests__/actionBar.test.ts
      - src/engine/__tests__/tileWater.test.ts
    depends_on: [action-bar-cast, movement-aura-follow, schema-test]
    verification:
      - npx vitest run src/engine/__tests__/actionBar.test.ts
      - npx vitest run src/engine/__tests__/tileWater.test.ts
    repair: retry
    tags: [test]
