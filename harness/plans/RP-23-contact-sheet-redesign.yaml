plan:
  id: RP-23-contact-sheet-redesign
  title: 'Redesign time-lapse camera: diff-driven capture + iso-projected contact sheet'
  created: 2026-05-30
  global_verification:
    - 'npm run typecheck'
    - 'npm run test'
    - 'npm run lint'

# v11 thinktank Round 4 (2026-05-30) — "the prairie's own evidence".
# Capture flips from event-driven (`recordCameraSubjectEvent` + 5 site
# hooks) to diff-driven (one sim-loop hook at flora-lifecycle cadence;
# append iff cells change and stay changed for N=3 ticks). Playback
# rewrites from a per-frame GelBandView flipbook into an iso-projected
# contact sheet with click-to-expand single-frame view + cross-fade.
# `CameraSubject` enum and `TimeLapseFrame.subject` retire across the
# camera pipeline, album panel, and tests. `GelBandView` exits
# `TimeLapsePlayback.tsx` but stays in the codebase for the scan
# instrument. Film count keys 1:1 with captured changes (rule
# unchanged; only the trigger changes).

