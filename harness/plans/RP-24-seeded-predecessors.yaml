    title: 'Add PredecessorRecord / PredecessorFate types, extend PlacedCamera with optional predecessor field, add PREDECESSOR_* constants'
    spec_id: RP-24-seeded-predecessors
    spec_sections:
      - predecessor-record-shape
      - predecessor-count-derivation
      - predecessor-fate-derivation
      - predecessor-gift-vs-memorial
      - predecessor-footage-generation
      - predecessor-degradation-derivation
      - predecessor-egregoric-content-rate
    context_files:
      - harness/specs/RP-24-seeded-predecessors.yaml
      - src/engine/types.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/types.ts
      - src/engine/constants.ts
    depends_on: []
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine, types, constants]

  - id: predecessor-names-module
    title: 'Create src/engine/predecessors/names.ts with prefix/suffix morpheme tables and generatePredecessorName(genesisSeed, index)'
