plan:
  id: RP-24-seeded-predecessors
  title: 'Seed N predecessor stewards into genesis with pre-developed contact-sheet footage and per-predecessor degradation (grain, tint, glyphLeak)'
  created: 2026-05-30
  global_verification:
    - 'npm run typecheck'
    - 'npm run test'
    - 'npm run lint'

