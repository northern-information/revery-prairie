plan:
  id: deep-time-endgame
  title: Implement Deep Time endgame sequence with bee starvation, ecosystem balance, Gron dialog, and 1000-year simulation
  created: 2026-04-12
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

