    spec_sections:
      - deep-time-state-shape
      - deep-time-revery-definition
    context_files:
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

