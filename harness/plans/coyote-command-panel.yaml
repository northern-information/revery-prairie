plan:
  id: coyote-command-panel
  title: 'Restore coyote contextual controls — re-mount CommandPanel in GameScreen and select coyote on interact'
  created: '2026-05-19'
  global_verification:
    - npm run typecheck
    - npm run lint
    - npx vitest run src/components/__tests__/CommandPanel.test.tsx src/engine/__tests__/coyote.test.ts

tasks:
  - id: write-regression-tests
    title: 'Write regression tests in src/components/__tests__/CommandPanel.test.tsx and extend src/engine/__tests__/coyote.test.ts. Tests must fail on main and pass after the implementation tasks.'
    spec_id: coyote-command-panel
    spec_sections:
      - render-command-panel-when-controllable-selected
      - interact-with-coyote-selects-coyote
      - coyote-follow-collect-buttons
    context_files:
      - src/components/CommandPanel.tsx
      - src/components/GameScreen.tsx
      - src/engine/selection.ts
      - src/engine/interaction.ts
      - src/engine/coyote.ts
      - src/engine/types.ts
      - src/engine/__tests__/coyote.test.ts
      - src/engine/__tests__/fixtures/characters.test.ts
    output_files:
      - src/components/__tests__/CommandPanel.test.tsx
      - src/engine/__tests__/coyote.test.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [test]
    notes: >
      Coverage to add:
      - CommandPanel renders Follow/Collect buttons when selectedUnits contains a coyote entity
      - CommandPanel returns null when selectedUnits is empty
      - GameScreen mounts CommandPanel (smoke test via testing-library — assert the panel renders given a selected coyote)
      - interactWithCharacter sets selectedUnits to { coyoteEid } when called adjacent to a coyote
      - interactWithCharacter does not modify selectedUnits when called adjacent to gron (still opens dialog)
      - Clicking the follow button sets state.coyoteMode = CoyoteMode.Follow and clears state.coyotePath
      - Clicking the collect button sets state.coyoteMode = CoyoteMode.Collect and clears state.coyotePath
      Use `vi.spyOn(Math, 'random')` with `vi.restoreAllMocks()` in a `finally` block if any randomness is exercised.
      Use `clearAroundPlayer()` if terrain must be walkable for the coyote/player setup.

  - id: wire-command-panel-in-gamescreen
    title: 'In src/components/GameScreen.tsx: import CommandPanel and render `<CommandPanel state={state} refreshUI={refreshUI} />`. Place it as a top-level child of the GameScreen overlay layer (the existing pointer-events-none container that wraps fixed overlays), positioned so it co-exists with the Minimap. CommandPanel already handles its own visibility via `units.length === 0 -> return null`, so no `hasSelection` guard is needed at the GameScreen level.'
    spec_id: coyote-command-panel
    spec_sections:
      - render-command-panel-when-controllable-selected
    context_files:
      - src/components/GameScreen.tsx
      - src/components/CommandPanel.tsx
      - src/components/Minimap.tsx
    output_files:
      - src/components/GameScreen.tsx
    depends_on: [write-regression-tests]
    verification:
      - npx tsc -b --noEmit
      - npm run lint
    repair: retry
    tags: [component]

  - id: select-coyote-on-interact
    title: 'In src/engine/interaction.ts: locate the adjacent coyote entity inside the existing coyote branch of `interactWithCharacter` (line ~146), call `selectUnit(state, coyoteEid)` from src/engine/selection.ts, and return the existing `{ opened: false, gift: null, coyoteToggled: false }`. Use `state.world.query(ComponentType.CharacterIdentity, ComponentType.Position)` plus zone filtering to locate the coyote entity by its position match against `character.pos`. Do not change behavior for any other definitionId.'
    spec_id: coyote-command-panel
    spec_sections:
      - interact-with-coyote-selects-coyote
    context_files:
      - src/engine/interaction.ts
      - src/engine/selection.ts
      - src/engine/ecs/types.ts
      - src/engine/zone.ts
      - src/engine/types.ts
    output_files:
      - src/engine/interaction.ts
    depends_on: [write-regression-tests]
    verification:
      - npx tsc -b --noEmit
      - npm run lint
    repair: retry
    tags: [engine]

  - id: full-verify
    title: 'Run the full verification suite — typecheck, lint, and the targeted test files — and confirm everything passes.'
    spec_id: coyote-command-panel
    spec_sections:
      - render-command-panel-when-controllable-selected
      - interact-with-coyote-selects-coyote
      - coyote-follow-collect-buttons
    context_files: []
    output_files: []
    depends_on: [wire-command-panel-in-gamescreen, select-coyote-on-interact]
    verification:
      - npm run typecheck
      - npm run lint
      - npx vitest run src/components/__tests__/CommandPanel.test.tsx src/engine/__tests__/coyote.test.ts
    repair: retry
    tags: [verify]
