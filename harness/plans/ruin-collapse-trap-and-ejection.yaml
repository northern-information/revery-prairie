    title: 'Add RuinEjection type, LostItemSummary, and phase timing constants'
    spec_id: ruin-collapse-trap-and-ejection
    spec_sections:
      - ejection-sequence-state
      - ruin-entry-toast
      - ejection-phase-timings
    context_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/ruins.ts
    output_files:
      - src/engine/types.ts
      - src/engine/constants.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: game-state-field-and-schema-allowlist
    title: 'Add ruinEjection field to GameState and schema EXPECTED_FIELDS'
