plan:
  id: starting-reveries
  title: 'Player starts with all four reveries'
  created: '2026-05-08'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: add-starting-reveries-to-state
    title: 'Add water and deep-time to createGameState starting reveries'
    spec_id: starting-lightning-revery
    spec_sections:
      - lightning-in-starting-reveries
      - lightning-in-action-bar-slot-2
    context_files:
      - src/engine/state.ts
    output_files:
      - src/engine/state.ts
    depends_on: []
    verification:
      - npx vitest run src/engine/__tests__/state.test.ts
    repair: retry
    tags: [engine]

  - id: remove-gron-gifts
    title: 'Remove gift and postGift fields from Gron in characters.ts'
    spec_id: starting-lightning-revery
    spec_sections:
      - lightning-in-starting-reveries
    context_files:
      - src/engine/characters.ts
    output_files:
      - src/engine/characters.ts
    depends_on: []
    verification:
      - npx vitest run src/engine/__tests__/gron-gift.test.ts
    repair: retry
    tags: [engine]

  - id: update-state-tests
    title: 'Update state.test.ts to assert all four starting reveries'
    spec_id: starting-lightning-revery
    spec_sections:
      - lightning-in-starting-reveries
      - lightning-in-action-bar-slot-2
      - test-state-includes-all-four
    context_files:
      - src/engine/__tests__/state.test.ts
      - src/engine/state.ts
    output_files:
      - src/engine/__tests__/state.test.ts
    depends_on:
      - add-starting-reveries-to-state
    verification:
      - npx vitest run src/engine/__tests__/state.test.ts
    repair: retry
    tags: [test]

  - id: rewrite-gron-gift-tests
    title: 'Rewrite gron-gift.test.ts to reflect no-gift behavior'
    spec_id: starting-lightning-revery
    spec_sections:
      - lightning-in-starting-reveries
    context_files:
      - src/engine/__tests__/gron-gift.test.ts
      - src/engine/characters.ts
    output_files:
      - src/engine/__tests__/gron-gift.test.ts
    depends_on:
      - remove-gron-gifts
    verification:
      - npx vitest run src/engine/__tests__/gron-gift.test.ts
    repair: retry
    tags: [test]

  - id: update-action-bar-tests
    title: 'Update actionBar.test.ts for full starting action bar'
    spec_id: starting-lightning-revery
    spec_sections:
      - lightning-in-action-bar-slot-2
      - moab-fire-no-empty-slot
    context_files:
      - src/engine/__tests__/actionBar.test.ts
      - src/engine/state.ts
    output_files:
      - src/engine/__tests__/actionBar.test.ts
    depends_on:
      - add-starting-reveries-to-state
    verification:
      - npx vitest run src/engine/__tests__/actionBar.test.ts
    repair: retry
    tags: [test]
