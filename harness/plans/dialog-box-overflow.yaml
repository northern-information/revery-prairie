      - vertical-containment
      - font-scale-resilience
      - angel-hash-grid-preserved
    context_files:
      - src/components/DialogBox.tsx
      - src/components/Sidebar.tsx
    output_files:
      - src/components/DialogBox.tsx
    depends_on: []
    verification:
      - npx vitest run src/components/__tests__/DialogBox.test.tsx
    repair: retry
    tags: [component]

  - id: update-dialog-tests
    title: Add regression tests for viewport containment and sidebar-aware centering
    spec_id: dialog-box-overflow
    spec_sections:
      - horizontal-containment
      - vertical-containment
      - font-scale-resilience
    context_files:
      - src/components/DialogBox.tsx
      - src/components/__tests__/DialogBox.test.tsx
    output_files:
      - src/components/__tests__/DialogBox.test.tsx
    depends_on:
      - fix-dialog-centering
    verification:
      - npx vitest run src/components/__tests__/DialogBox.test.tsx
    repair: retry
    tags: [test]
