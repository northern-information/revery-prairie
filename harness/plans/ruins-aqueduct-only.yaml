  - id: write-corridor-and-key-tests
    title: 'Add ruin-dormant-garden tests: corridor dimensions, spine has alternate loop, dead-end alcoves exist, key in 60-85% band, tablet in 25-55% band, no items in vault'
    spec_id: ruin-dormant-garden
    spec_sections:
