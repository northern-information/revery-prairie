      - lay-aqueduct-channels-and-debris
    verification:
      - 'npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts'
    repair: retry
    tags: [test]

  - id: write-locked-door-tests
    title: 'Create ruin-locked-door.test.ts: door blocks movement, [e] without key no-op, [e] with key consumes one and opens, repress on open is no-op'
    spec_id: ruin-locked-door
    spec_sections:
      - unlock-interaction
      - locked-door-blocks-movement
