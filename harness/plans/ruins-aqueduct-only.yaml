      - aqueduct-key-placement
      - stone-tablet-placement
    context_files:
      - src/engine/__tests__/ruin-dormant-garden.test.ts
      - src/engine/ruins.ts
    output_files:
      - src/engine/__tests__/ruin-dormant-garden.test.ts
    depends_on:
