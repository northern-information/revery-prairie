plan:
  id: dialog-box-presentation
  title: 'Restyle dialog box to FromSoft-style bottom-center minimal chrome'
  created: '2026-04-14'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: strip-dialog-box-chrome
    title: 'Remove buttons, close icon, border, and position props from DialogBox'
    spec_id: dialog-box-presentation
    spec_sections:
      - minimal-chrome
      - props-simplified
    context_files:
      - src/components/DialogBox.tsx
      - src/components/PanelPrimitives.tsx
    output_files:
      - src/components/DialogBox.tsx
    depends_on: []
    verification:
      - npx vitest run src/harness/__tests__/boot/components.test.tsx
    repair: retry
    tags: [component]

  - id: restyle-dialog-layout
    title: 'Apply FromSoft layout — wide short box, bottom center, inline portrait'
    spec_id: dialog-box-presentation
    spec_sections:
      - bottom-center-positioning
      - minimal-chrome
      - angel-dialog-preserved
    context_files:
      - src/components/DialogBox.tsx
    output_files:
      - src/components/DialogBox.tsx
    depends_on:
      - strip-dialog-box-chrome
    verification:
      - npx vitest run src/harness/__tests__/boot/components.test.tsx
    repair: retry
    tags: [component]

  - id: simplify-gamescreen-dialog
    title: 'Remove character-relative positioning logic from GameScreen'
    spec_id: dialog-box-presentation
    spec_sections:
      - gamescreen-positioning-cleanup
    context_files:
      - src/components/GameScreen.tsx
      - src/components/DialogBox.tsx
    output_files:
      - src/components/GameScreen.tsx
    depends_on:
      - restyle-dialog-layout
    verification:
      - npm run build
    repair: retry
    tags: [component]

  - id: update-dialog-smoke-test
    title: 'Update DialogBox smoke test to match simplified props'
    spec_id: dialog-box-presentation
    spec_sections:
      - props-simplified
    context_files:
      - src/harness/__tests__/boot/components.test.tsx
      - src/components/DialogBox.tsx
    output_files:
      - src/harness/__tests__/boot/components.test.tsx
    depends_on:
      - strip-dialog-box-chrome
    verification:
      - npx vitest run src/harness/__tests__/boot/components.test.tsx
    repair: retry
    tags: [test]
