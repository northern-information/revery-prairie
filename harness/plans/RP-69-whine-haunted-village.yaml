plan:
  id: RP-69-whine-haunted-village
  title: 'Precis RP-69: Whine, Haunted Village — hand-authored hub region near the little house, with twelve named drifting ghosts; folds in the v11 R8 threshold-zone substrate generalization'
  created: 2026-05-31
  global_verification:
    - 'npm run typecheck'
    - 'npm run test'
    - 'npm run lint'

tasks:
  - id: whine-foundations
    title: 'Add Zone.WhineVillage and Zone.WhineHomeYard, two new TileTypes (WhineEntrance, WhineApron), the two new ZoneTransitionKind members, Whine layout constants (dims, home centers, gate positions, home-yard template), walkability + render + tileBg tables, and the DriftBehavior.bounds extension'
    spec_id: RP-69-whine-haunted-village
    spec_sections:
      - whine-zone-variants-and-tile-types
      - drift-behavior-bounds
    context_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/movement.ts
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
      - src/engine/entities.ts
    output_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/movement.ts
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
      - src/engine/entities.ts
      - src/engine/__tests__/whine.test.ts
    depends_on: []
    verification:
      - command: 'npx tsc -b --noEmit'
      - command: 'npx vitest run src/engine/__tests__/whine.test.ts'
    repair:
      max_retries: 1
      strategy: retry
    tags:
      - engine
    skip: false

  - id: threshold-zones-registry-migration
    title: 'Replace the seven singleton little-house-yard fields with state.thresholdZones: Map<ZoneId, ThresholdZoneState>; migrate RP-67 yard.ts call sites to read through the registry; update EXPECTED_FIELDS; preserve all RP-67 yard behavior'
    spec_id: RP-69-whine-haunted-village
    spec_sections:
      - threshold-zones-registry
      - little-house-yard-migration
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/yard.ts
      - src/engine/zoneTransition.ts
      - src/engine/house.ts
      - src/engine/celestial.ts
      - src/engine/camera.ts
      - src/engine/visibility.ts
      - src/engine/render/passes/weatherRainOverlay.ts
      - src/harness/__tests__/serialization/schema.test.ts
      - src/engine/__tests__/yard.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/yard.ts
      - src/engine/zoneTransition.ts
      - src/engine/house.ts
      - src/engine/celestial.ts
      - src/engine/camera.ts
      - src/engine/visibility.ts
