    verification:
      - command: 'npx tsc -b --noEmit'
      - command: 'npx vitest run src/engine/__tests__/yard.test.ts'
      - command: 'npx vitest run src/harness/__tests__/serialization/schema.test.ts'
    repair:
      max_retries: 1
      strategy: retry
    tags:
      - engine
      - refactor
    skip: false

  - id: whine-map-and-overworld-placement
    title: 'Implement createWhineVillage() with the 30x20 deterministic layout and createWhineHomeYard() with the 9x7 shared template; register Whine + twelve home yards in state.thresholdZones at genesis; place WhineEntrance + WhineApron on the overworld at +25 east of houseEntranceOverworld with deterministic ring search; add state.whineEntranceOverworld; update EXPECTED_FIELDS'
    spec_id: RP-69-whine-haunted-village
    spec_sections:
      - whine-map-and-registration
      - whine-overworld-placement
      - whine-home-yard-template
    context_files:
