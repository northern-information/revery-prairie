plan:
  id: ruin-astral-void
  title: 'Add astral void ponds to ruin interiors with reachability validation'
  created: '2026-04-17'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: void-pond-generation
    title: 'Add placeVoidPonds function that generates contiguous Space blobs in ruin interiors'
    spec_id: ruin-astral-void
    spec_sections:
      - void-pond-generation
      - reachability-validation
    context_files:
      - src/engine/ruins.ts
      - src/engine/types.ts
      - src/engine/position.ts
    output_files:
      - src/engine/ruins.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: wire-void-ponds-into-generation
    title: 'Call placeVoidPonds after each archetype generator in generateRuinInterior'
    spec_id: ruin-astral-void
    spec_sections:
      - void-pond-generation
      - reachability-validation
    context_files:
      - src/engine/ruins.ts
      - src/engine/types.ts
    output_files:
      - src/engine/ruins.ts
    depends_on:
      - void-pond-generation
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: render-ruin-space-stars
    title: 'Remove ruin zone skip for Space tiles so twinkling stars render inside ruins'
    spec_id: ruin-astral-void
    spec_sections:
      - ruin-space-tile-rendering
    context_files:
      - src/engine/renderer.ts
    output_files:
      - src/engine/renderer.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: subsidence-collapse-to-space
    title: 'Change subsidence collapse to produce Space tiles and eject player with toast'
    spec_id: ruin-astral-void
    spec_sections:
      - subsidence-collapse-to-space
    context_files:
      - src/engine/ruins.ts
      - src/engine/gameLoop.ts
      - src/hooks/useEventLog.ts
    output_files:
      - src/engine/ruins.ts
      - src/engine/gameLoop.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: add-tests
    title: 'Add tests for void ponds, reachability, collapse-to-space, and rendering'
    spec_id: ruin-astral-void
    spec_sections:
      - void-pond-generation
      - reachability-validation
      - subsidence-collapse-to-space
    context_files:
      - src/engine/__tests__/ruins.test.ts
      - src/engine/ruins.ts
      - src/engine/types.ts
    output_files:
      - src/engine/__tests__/ruins.test.ts
    depends_on:
      - void-pond-generation
      - wire-void-ponds-into-generation
      - subsidence-collapse-to-space
    verification:
      - npx vitest run src/engine/__tests__/ruins.test.ts
    repair: retry
    tags: [test]
