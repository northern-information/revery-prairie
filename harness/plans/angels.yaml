    title: 'Add angel ECS components, GameState fields, and constants'
    spec_id: angels
    spec_sections:
      - angel-spawning
      - angel-aura-types
      - angel-cantos-storage
      - angel-despawn
    context_files:
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
      - src/engine/effects.ts
      - src/engine/state.ts
      - src/harness/serialize.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
      - src/engine/effects.ts
      - src/engine/state.ts
      - src/harness/serialize.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization
    repair: retry
    tags: [engine]

  - id: angel-core-module
