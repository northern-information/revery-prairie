    title: 'Add lightning revery push and autoAssign in createGameState'
    spec_id: starting-lightning-revery
    spec_sections:
      - lightning-in-starting-reveries
      - lightning-in-action-bar-slot-2
    context_files:
      - src/engine/state.ts
      - src/engine/reveries.ts
      - src/engine/actionBar.ts
    output_files:
      - src/engine/state.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: update-state-test
    title: 'Update state.test.ts assertions for lightning in reveries and action bar'
    spec_id: starting-lightning-revery
