      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: sidebar-fog-awareness
    title: 'Update sidebar cursor info to respect fog visibility state'
    spec_id: cave-fog-of-war
    spec_sections:
      - cursor-info-fog-awareness
    context_files:
      - src/components/Sidebar.tsx
      - src/engine/visibility.ts
      - src/engine/types.ts
      - src/engine/effects.ts
    output_files:
      - src/components/Sidebar.tsx
    depends_on:
