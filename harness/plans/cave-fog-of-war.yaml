    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [component]

  - id: manual-entry
    title: 'Add fog of war manual-only entry with discovery tracking'
    spec_id: cave-fog-of-war
    spec_sections:
      - three-state-visibility
    context_files:
      - src/engine/manual.ts
      - src/engine/cave.ts
      - src/engine/types.ts
    output_files:
      - src/engine/manual.ts
      - src/engine/cave.ts
    depends_on:
