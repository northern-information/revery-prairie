    title: Add regression test verifying log container has pointer-events-auto
    spec_id: log-scroll-bug
    spec_sections:
      - log-scrolls-on-wheel
      - log-empty
    context_files:
      - src/components/__tests__/Sidebar.test.tsx
      - src/components/Sidebar.tsx
    output_files:
      - src/components/__tests__/Sidebar.test.tsx
    depends_on:
      - add-pointer-events-to-log
    verification:
      - npx vitest run src/components/__tests__/Sidebar.test.tsx
    repair: retry
    tags:
      - test
