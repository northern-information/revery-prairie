    title: "Add regression tests for panel viewport clamping"
    spec_id: inventory-panel-clamping
    spec_sections:
      - panel-quadrant-selection
      - panel-edge-clamping
      - omnibox-panel-included
    context_files:
      - src/components/InventoryPanel.tsx
      - src/engine/constants.ts
      - src/engine/items.ts
    output_files:
      - src/components/__tests__/inventoryPanelClamping.test.ts
