    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [component]

  - id: keybind-and-integration
    title: 'Add c keybind, hexagram panel type, wire into GameScreen'
    spec_id: hexagram-casting
    spec_sections:
      - cast-keybind
    context_files:
      - src/hooks/useKeyboard.ts
      - src/components/GameScreen.tsx
      - src/components/HexagramPanel.tsx
      - src/engine/types.ts
      - src/engine/hexagram.ts
      - src/engine/inventory.ts
    output_files:
