      - src/components/GameScreen.tsx
    depends_on:
      - hexagram-panel
      - coin-ground-spawn
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [hook, component, integration]

  - id: coin-glint-rendering
    title: 'Render coins with dim color when not glinting in inventory and on ground'
    spec_id: hexagram-casting
    spec_sections:
      - coin-glinting-state
      - coins-dimmed-after-cast
    context_files:
      - src/engine/renderer.ts
      - src/engine/types.ts
      - src/engine/items.ts
      - src/components/InventoryGrid.tsx
    output_files:
      - src/engine/renderer.ts
      - src/components/InventoryGrid.tsx
    depends_on:
      - coin-item-and-glinting-state
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine, component]

  - id: hexagram-manual-entry
    title: 'Add hexagram casting manual entry and discovery tracking'
    spec_id: hexagram-casting
    spec_sections:
