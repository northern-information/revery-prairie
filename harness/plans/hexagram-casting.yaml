      - coin-ground-spawn
      - coin-glinting-state
      - cast-keybind
      - hexagram-toss-sequence
      - hexagram-result-display
      - coins-dimmed-after-cast
    context_files:
      - src/engine/hexagram.ts
      - src/engine/state.ts
      - src/engine/types.ts
      - src/engine/items.ts
      - src/engine/inventory.ts
