    title: Add sim.lowlandWaterMask field to GenesisSimState and EpochSnapshot
    spec_id: genesis-terrain-realism
    spec_sections:
      - coherent-lowland-water-mask
    context_files:
      - src/engine/genesisTypes.ts
      - src/engine/genesis.ts
      - src/engine/genesisRenderer.ts
    output_files:
      - src/engine/genesisTypes.ts
      - src/engine/genesis.ts
      - src/engine/genesisRenderer.ts
    depends_on: []
    verification:
      - npm run typecheck
    repair: retry
    tags:
      - engine

  - id: build-mask-in-first-water
    title: Build seeded 2D smooth-noise mask in FirstWater.mutate after seabed pass, before hydraulic erosion
    spec_id: genesis-terrain-realism
    spec_sections:
      - coherent-lowland-water-mask
    context_files:
      - src/engine/genesis.ts
      - src/engine/terrain.ts
    output_files:
      - src/engine/genesis.ts
    depends_on:
      - add-lowland-water-mask-field
    verification:
      - npm run typecheck
    repair: retry
    tags:
      - engine

  - id: predicates-read-mask
