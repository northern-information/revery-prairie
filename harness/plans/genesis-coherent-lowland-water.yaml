plan:
  id: genesis-coherent-lowland-water
  title: Replace blotchy lowland-water predicate with coherent 2D mask, and stop ruin entrance halos bleeding into water
  created: '2026-05-08'
  global_verification:
    - npm run typecheck
    - npm run lint
    - npm run test
    - npm run build

tasks:
