    title: Add regression test asserting fair archetype distribution across 10000 seeded ruins
    spec_id: ruin-archetype-distribution
    spec_sections:
      - archetype-distribution-fairness
    context_files:
      - src/engine/__tests__/ruins.test.ts
      - src/engine/ruins.ts
    output_files:
      - src/engine/__tests__/ruins.test.ts
