plan:
  id: render-architecture
  title: 'Pass registry + unified cache contract + cached halo'
  created: '2026-05-02'
  status: |
    Closed 2026-05-02. Foundation, halo cache, bg-cache slot,
    world-overlay slot, screen-overlay slot, and the post-tile half of
    the effect slot all landed across PRs #211, #213, #214, #215, and
    #216.

    The remaining slot extractions (tile-glyph, entity, and the
    in-tile-loop half of effect — path/preview/pickup-bloom/etc.)
    were intentionally deferred. The central tile loop is a single
    precedence-chain dispatch; splitting it across pass files would
    duplicate the precedence chain or force a frameState abstraction
    whose only purpose is to enable the file split. The inline
    central loop is the documented end state — see the pass-registry
    behavior in harness/specs/renderer.yaml. Tasks 4-13 below are
    superseded by this decision and the structural-fix tasks 4, 5,
    9 that did land.
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: pass-interface
    title: 'Define RenderPass interface and registry walker in src/engine/render/passes.ts. Pass = { id, slot, isActive(state), draw(ctx, state, metrics, time) }. Slots: bg-cache, world-overlay, tile-glyph, entity, effect, screen-overlay. Export runPasses(ctx, state, metrics, time) that iterates the registry in slot order and skips inactive passes.'
    spec_id: renderer
    spec_sections:
      - pass-registry
    context_files:
      - src/engine/renderer.ts
      - src/engine/types.ts
    output_files:
      - src/engine/render/passes.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: cache-contract-module
    title: 'Define cache invalidation contract in src/engine/render/cacheContract.ts. Export per-cache dirty flags + setDirty/consumeDirty helpers. Document declared triggers for tileBgCache, haloCache, tier grid in module-level JSDoc. Wire existing tileBgCache and tier grid to consult the contract (no behavior change yet).'
    spec_id: renderer
    spec_sections:
      - cache-contract
    context_files:
      - src/engine/tileBgCache.ts
      - src/engine/tileBg.ts
      - src/engine/renderer.ts
    output_files:
      - src/engine/render/cacheContract.ts
      - src/engine/tileBgCache.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: halo-cache-module
    title: 'Build src/engine/render/haloCache.ts mirroring tileBgCache pattern. Offscreen canvas sized to viewport, blur filter applied at build time. Export getOrBuildHalo(state, metrics) and markHaloDirty(state). Wire mutations: player movement, prairie boundary changes, active revery range changes, viewport resize all call markHaloDirty via cacheContract.'
    spec_id: renderer
    spec_sections:
      - halo-cache
      - cache-contract
    context_files:
      - src/engine/renderer.ts
      - src/engine/movement.ts
      - src/engine/reveries.ts
      - src/engine/render/cacheContract.ts
      - src/engine/tileBgCache.ts
    output_files:
      - src/engine/render/haloCache.ts
      - src/engine/render/cacheContract.ts
      - src/engine/movement.ts
      - src/engine/reveries.ts
    depends_on:
      - pass-interface
      - cache-contract-module
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: extract-bg-cache-slot
