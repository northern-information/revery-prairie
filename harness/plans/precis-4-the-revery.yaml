    depends_on:
      - add-revery-constants
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: phenotype-resolver-tests
    title: 'Create src/engine/__tests__/phenotype.test.ts. Cover: most-discovered species selection with explicit ties, axis cycling over reveryCount, verdict bucket selection for each axis, no-discovered-flora returns null, no-living-tiles defaults to mid bucket, deterministic given identical state. Use placeFloraAt helper pattern from tileBeePreference.test.ts.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-resolves-phenotype-label
      - revery-with-no-discovered-flora
      - phenotype-label-axes-cycle
    context_files:
