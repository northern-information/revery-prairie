    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/phenotype.test.ts
    repair: retry
    tags:
      - engine
      - test

  - id: wire-phenotype-into-revery
    title: 'In src/engine/revery.ts, during Observing → Summary transition, call resolvePhenotypeLabel(state, state.reveryCount). If it returns non-null, append the RevealedPhenotype to state.revealedPhenotypes for that species. Re-resolving the same (species, axis) pair OVERWRITES the prior verdict (per spec edge case). Add the change to revery.scheduledChanges as { kind: "phenotype-revealed", payload: { species, axis, verdict } }.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-resolves-phenotype-label
      - phenotype-label-axes-cycle
    context_files:
      - src/engine/revery.ts
      - src/engine/phenotype.ts
      - src/engine/types.ts
    output_files:
      - src/engine/revery.ts
    depends_on:
