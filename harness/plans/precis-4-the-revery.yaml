plan:
  id: precis-4-the-revery
  title: 'The Revery — long-form phase: omen entry, observation UX, bilingual summary, phenotype labels, first-Revery egregoric advance'
  created: 2026-05-19
  # Large engine + UI feature touching GameState shape, gameLoop, input,
  # genesis (for egregore placement reuse), and the React layer. Cross-cutting
  # gate is the full suite — GameState shape changes ripple broadly.
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + docs status ---

  - id: doctrine-status-update
    title: 'Flip precis #4 from todo to in-progress in docs/precis-status.yaml. Set spec/plan paths. Update notes with the locked decisions from spec drafting (hard input lock, "pass through the winter" duration, first-Revery egregore bump, most-discovered species for phenotype label, three omen variants). Add a docs/claude/revery.md doc that mirrors the style of docs/claude/manual.md, with sections: state fields, phase machine, omen detection, summary computation, phenotype label resolution. Update docs/claude/state.md if it needs a pointer.'
    spec_id: precis-4-the-revery
    spec_sections: []
    context_files:
      - docs/precis-status.yaml
      - docs/claude/state.md
      - docs/claude/manual.md
    output_files:
      - docs/precis-status.yaml
      - docs/claude/state.md
      - docs/claude/revery.md
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: State shape + constants ---

  - id: add-revery-types-and-state-fields
    title: 'Add ReveryPhase const + type, ReveryState interface, RevealedPhenotype interface, PhenotypeAxis type to src/engine/types.ts. Add `revery: ReveryState | null`, `reveryCount: number`, `cosmologicalDrift: number`, `revealedPhenotypes: Map<FloraSpecies, RevealedPhenotype[]>`, `lastReveryEndTime: number` to GameState. Update createGameState in src/engine/state.ts to initialize all five fields. Add to EXPECTED_FIELDS in src/harness/__tests__/serialization/schema.test.ts.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-state-on-gamestate
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - engine

  - id: add-revery-constants
    title: 'Add REVERY_YEARS_PER_FRAME (mirror DEEP_TIME_YEARS_PER_FRAME), REVERY_COOLDOWN_MS (= SEASONAL_PHASE_PERIOD_MS), REVERY_CAMERA_DRIFT_INTERVAL_MS, REVERY_OMEN_STATIONARY_MS (= 2000 for cloud-passing omen), FIRST_REVERY_EGREGORE_COUNT (= 3), PHENOTYPE_AXES tuple to src/engine/constants.ts. Document each with one comment line referencing the spec behavior.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-enter-and-observe
      - omen-detection
      - revery-first-egregore-advance
    context_files:
      - src/engine/constants.ts
    output_files:
      - src/engine/constants.ts
    depends_on:
      - add-revery-types-and-state-fields
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 2: Pure helpers ---

  - id: create-revery-module-skeleton
    title: 'Replace src/engine/revery.ts stub with real implementation. Export: isReveryLocked(state), initiateRevery(state, time, omenKind), tickRevery(state, dt, time). isReveryLocked returns true when state.revery?.active is true AND phase is Observing or Summary (NOT Closing — closing is a one-frame transition). initiateRevery captures the pre-Revery snapshot, sets phase to Omen, records the omen kind. tickRevery is the per-frame state machine — phase transitions Omen → Observing → Summary → Closing → null. The Observing branch advances elapsedYears by REVERY_YEARS_PER_FRAME and ticks seasonalPhase at the accelerated rate.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-state-on-gamestate
      - revery-enter-and-observe
      - revery-input-lock
      - revery-closing-and-reset
    context_files:
      - src/engine/revery.ts
      - src/engine/deepTime.ts
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/revery.ts
    depends_on:
      - add-revery-constants
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: create-revery-snapshot-and-diff
    title: 'Add takeReverySnapshot(state) → ReverySnapshot and computeReveryDiff(state, snapshot) → ReveryChange[] to src/engine/revery.ts. Snapshot captures: per-species flora counts (clover, wildflower, tallGrass), egregore tile count, current season, current reveryCount. Diff computes deltas at Observing → Summary transition.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-summary-phase
    context_files:
      - src/engine/revery.ts
      - src/engine/types.ts
      - src/engine/floraLifecycle.ts
    output_files:
      - src/engine/revery.ts
    depends_on:
      - create-revery-module-skeleton
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 3: Omen detection ---

  - id: create-omen-detection
    title: 'Add detectOmen(state, time) → OmenKind | null to src/engine/revery.ts. Returns null when not in Overworld, not in Fall season, deepTime active, revery active, or cooldown not expired. Checks three omen variants: (a) bee-on-shoulder — any bee entity Position equals player position; (b) distant-meteorite — any shooting star projected landing within Chebyshev distance 3 of player; (c) cloud-passing — state.weather.sky just transitioned from Rain/Cloudy to Sun AND player has been stationary (no movement) for REVERY_OMEN_STATIONARY_MS. Track stationary time via state.playerStationarySince (NEW field — also add to state shape in tier 1, then implement check here).'
    spec_id: precis-4-the-revery
    spec_sections:
      - omen-detection
    context_files:
      - src/engine/revery.ts
      - src/engine/types.ts
      - src/engine/entities.ts
      - src/engine/celestial.ts
      - src/engine/ecs/types.ts
    output_files:
      - src/engine/revery.ts
    depends_on:
      - create-revery-snapshot-and-diff
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: wire-stationary-tracking-and-skyTransition
    title: 'Add state.playerStationarySince: number and state.lastSky: Sky (for transition detection) to types.ts and state.ts. Update movement.ts to reset playerStationarySince = time on every successful movePlayer. Update tickWeather or gameLoop to update lastSky each frame. Add fields to EXPECTED_FIELDS.'
    spec_id: precis-4-the-revery
    spec_sections:
      - omen-detection
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/movement.ts
      - src/engine/gameLoop.ts
      - src/engine/weather/index.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/movement.ts
      - src/engine/gameLoop.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - create-omen-detection
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - engine

  - id: wire-omen-to-gameloop
    title: 'In src/engine/gameLoop.ts, after the standard tick block, call detectOmen(state, time) and if it returns non-null, call initiateRevery(state, time, omenKind). This sets state.revery to phase Omen. Then call tickRevery(state, dt, time) to handle the phase machine. tickRevery must run BEFORE input handlers so the Omen → Observing transition is reflected by the time movePlayer is called.'
    spec_id: precis-4-the-revery
    spec_sections:
      - omen-detection
      - revery-enter-and-observe
    context_files:
      - src/engine/gameLoop.ts
      - src/engine/revery.ts
    output_files:
      - src/engine/gameLoop.ts
    depends_on:
      - wire-stationary-tracking-and-skyTransition
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 4: Input lock ---

  - id: wire-input-lock-to-movement-and-keyboard
    title: 'Update src/engine/movement.ts movePlayer to early-return false when isReveryLocked(state). Update src/engine/input.ts (or src/hooks/useKeyboard.ts wherever the path/keyboard ticks live) to early-return when isReveryLocked. Clear state.path, state.pathWaypoints, state.pendingAction when entering Observing phase (do this inside tickRevery in revery.ts when transitioning Omen → Observing).'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-input-lock
    context_files:
