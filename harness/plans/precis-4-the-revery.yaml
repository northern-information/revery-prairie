  # --- Tier 5: Phenotype label resolution ---

  - id: create-phenotype-label-resolver
    title: 'Add resolvePhenotypeLabel(state, reveryCount) → { species: FloraSpecies; axis: PhenotypeAxis; verdict: string } | null to a new src/engine/phenotype.ts. Selection: highest count of flora:<species> entries in state.manualDiscoveries (ties broken by FloraSpecies enum order). Axis: PHENOTYPE_AXES[reveryCount % PHENOTYPE_AXES.length]. Verdict draws from per-axis verdict bank based on mean trait value across living flora of that species. Verdict templates: "suspected: late-blooming" / "suspected: early-blooming" / "suspected: mid-season" for bloomTiming; analogous tri-buckets for the other three axes. If no flora is discovered, returns null. If species has no living tiles, defaults trait mean to 0.5 (mid bucket).'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-resolves-phenotype-label
    context_files:
      - src/engine/types.ts
      - src/engine/flora/species.ts
      - src/engine/floraLifecycle.ts
      - src/engine/genetics/index.ts
      - src/engine/manual.ts
      - src/engine/constants.ts
    output_files:
