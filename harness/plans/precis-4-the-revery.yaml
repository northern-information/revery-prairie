      - wire-omen-to-gameloop
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 6: Egregoric advance (first Revery only) ---

  - id: create-egregore-advance
    title: 'Add advanceEgregoreFirstRevery(state) → Position[] to src/engine/revery.ts (or a new src/engine/egregore.ts module). Gated by state.reveryCount === 0 (caller responsibility — function asserts the gate). Finds all existing TileType.Egregore positions; for each, considers ordinal neighbors that are TileType.Dirt; deterministically picks FIRST_REVERY_EGREGORE_COUNT positions biased toward player trail centroid (Manhattan distance) using a stable sort. Returns the new positions and mutates state.map[y][x] to { type: TileType.Egregore } for each. Logs to manualDiscoveries as event:egregore-advance.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-first-egregore-advance
      - revery-with-no-existing-egregore-tiles
    context_files:
      - src/engine/revery.ts
      - src/engine/types.ts
      - src/engine/position.ts
      - src/engine/genesis.ts
      - src/engine/manual.ts
    output_files:
      - src/engine/revery.ts
    depends_on:
      - wire-phenotype-into-revery
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: wire-egregore-advance-into-revery
    title: 'In tickRevery''s Observing → Summary transition, call advanceEgregoreFirstRevery(state) only when state.reveryCount === 0. Append the returned positions to revery.scheduledChanges as { kind: "egregore-grew", payload: { positions } }. If positions is empty (no existing egregore tiles or no dirt neighbors), skip the entry — the summary will omit the line.'
    spec_id: precis-4-the-revery
    spec_sections:
      - revery-first-egregore-advance
      - revery-with-no-existing-egregore-tiles
    context_files:
      - src/engine/revery.ts
      - src/engine/types.ts
    output_files:
