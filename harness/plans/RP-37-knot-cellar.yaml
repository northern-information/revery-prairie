plan:
  id: RP-37-knot-cellar
  title: 'Precis RP-37: The Knot Cellar — long corridor archive, alternating staggered alcoves, post-Revery awaken next to the year''s knot'
  created: 2026-05-31
  global_verification:
    - 'npm run typecheck'
    - 'npm run test'
    - 'npm run lint'

tasks:
  - id: cellar-foundations
    title: 'Add Zone.KnotCellar, ZoneTransitionKind ''knot-cellar'', five new TileTypes (CellarFloor, CellarWall, CellarAlcoveFloor, CellarBulkhead, CellarBulkheadInterior), cellar dimension/spacing constants (CELLAR_WIDTH=7, CELLAR_HEIGHT=770, CELLAR_ROOM_CAP=256, CELLAR_ALCOVE_SPACING=3, CELLAR_READ_DISTANCE=8, CELLAR_FADE_DISTANCE=12), walkability + renderer color/glyph tables, and the six new GameState fields registered in EXPECTED_FIELDS (cellarMap, cellarMapWidth, cellarMapHeight, cellarDoorSpawn, cellarBulkheadInterior, cellarBulkheadYard)'
    spec_id: RP-37-knot-cellar
    spec_sections:
      - cellar-tile-types
      - cellar-zone-and-map
      - schema-test-fields
    context_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/state.ts
      - src/engine/movement.ts
      - src/engine/renderer.ts
      - src/engine/yard.ts
      - src/engine/house.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/state.ts
      - src/engine/movement.ts
      - src/engine/renderer.ts
      - src/harness/__tests__/serialization/schema.test.ts
      - src/engine/__tests__/RP-37-knot-cellar.test.ts
    depends_on: []
    verification:
      - command: 'npx tsc -b --noEmit'
      - command: 'npx vitest run src/engine/__tests__/RP-37-knot-cellar.test.ts'
      - command: 'npx vitest run src/harness/__tests__/serialization/schema.test.ts'
    repair:
      max_retries: 1
      strategy: retry
    tags:
      - engine
    skip: false

  - id: cellar-map-creation
    title: 'Implement createKnotCellar in src/engine/cellar.ts; build state.cellarMap at genesis with the locked 7x770 layout (CellarBulkheadInterior at top-center, 3-wide central corridor, alternating left/right alcoves at y = 2 + i*3); export getAlcovePosition(index) and getAlcoveFacing(index) pure helpers; mutate state.yardMap to place the CellarBulkhead tile at (11, 3) in the back yard after createLittleHouseYard runs in createGameState'
    spec_id: RP-37-knot-cellar
    spec_sections:
      - cellar-zone-and-map
      - yard-bulkhead-placement
      - alcove-position-derivation
    context_files:
      - src/engine/cellar.ts
      - src/engine/yard.ts
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/state.ts
    output_files:
      - src/engine/cellar.ts
      - src/engine/state.ts
      - src/engine/__tests__/RP-37-knot-cellar.test.ts
    depends_on:
      - cellar-foundations
    verification:
      - command: 'npx tsc -b --noEmit'
      - command: 'npx vitest run src/engine/__tests__/RP-37-knot-cellar.test.ts'
    repair:
      max_retries: 1
      strategy: retry
    tags:
      - engine
    skip: false

  - id: cellar-transitions
    title: 'Wire enterKnotCellar and exitKnotCellar through zoneTransition.ts; register both via registerZoneSwapHandler(''knot-cellar'', ...); extend the transition-detection sweep so stepping on a CellarBulkhead tile in the yard triggers enter and stepping on a CellarBulkheadInterior tile triggers exit; arm the cellar re-entry lock on exit (mirroring the RP-67 yard re-entry lock pattern); clear the standard nav/UI state on both enter and exit'
    spec_id: RP-37-knot-cellar
    spec_sections:
      - yard-to-cellar-enter
      - cellar-to-yard-exit
    context_files:
      - src/engine/cellar.ts
