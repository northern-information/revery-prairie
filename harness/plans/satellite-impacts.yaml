    title: 'Add satellite tracking fields to GameState and createGameState'
    spec_id: satellite-impacts
    spec_sections:
      - satellite-spawning
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/harness/__tests__/serialization/schema.test.ts
