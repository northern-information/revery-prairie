plan:
  id: satellite-impacts
  title: 'Add satellite impact events with craters, ghost interactions, and seed payloads'
  created: '2026-04-18'
  global_verification:
    - npm run build
    - npm run test
    - npm run lint

tasks:
  - id: types-and-constants
    title: 'Add TileType.Crater, SatelliteData component type, and satellite constants'
    spec_id: satellite-impacts
    spec_sections:
      - satellite-spawning
      - satellite-impact-crater
      - crater-tile-rendering
    context_files:
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
      - src/engine/position.ts
    output_files:
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
      - src/engine/position.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

