plan:
  id: elevate-ruin-entrances
  title: 'Elevate ruin entrances above surrounding dirt with a RuinApron platform tile'
  created: '2026-05-15'
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  - id: add-ruin-apron-tile-type
    title: 'Add RuinApron tile type with char, color, walkability, and cursor info label'
    spec_id: ruin-infrastructure
    spec_sections:
      - ruin-tile-types
    context_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/position.ts
      - src/components/Sidebar.tsx
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/constants.ts
      - src/engine/position.ts
      - src/components/Sidebar.tsx
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine, component]

  - id: place-apron-around-entrances
    title: 'Replace dirt-conversion with RuinApron-conversion in placeRuinEntrances'
    spec_id: ruin-accessibility-bugs
    spec_sections:
      - ruin-entrance-walkable-perimeter
    context_files:
      - src/engine/ruins.ts
      - src/engine/types.ts
      - src/engine/position.ts
    output_files:
      - src/engine/ruins.ts
    depends_on:
      - add-ruin-apron-tile-type
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: define-lift-constants
    title: 'Export RUIN_APRON_LIFT_PX and RUIN_ENTRANCE_LIFT_PX from tileBg.ts'
    spec_id: ruin-visual-style
    spec_sections:
      - overworld-ruin-entrance-elevation-lift
    context_files:
      - src/engine/tileBg.ts
    output_files:
      - src/engine/tileBg.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: lift-glyph-render
    title: 'Apply per-tile lift in renderer.ts central tile loop for RuinApron and RuinEntrance on overworld'
    spec_id: ruin-visual-style
    spec_sections:
      - overworld-ruin-entrance-elevation-lift
    context_files:
      - src/engine/renderer.ts
      - src/engine/tileBg.ts
      - src/engine/types.ts
    output_files:
      - src/engine/renderer.ts
    depends_on:
      - add-ruin-apron-tile-type
      - define-lift-constants
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: lift-bg-cache
    title: 'Bake the same lift into tileBgCache (bg fill + cube-edge stroke) for overworld apron and entrance tiles'
    spec_id: ruin-visual-style
    spec_sections:
      - overworld-ruin-entrance-elevation-lift
    context_files:
      - src/engine/tileBgCache.ts
      - src/engine/tileBg.ts
      - src/engine/types.ts
    output_files:
      - src/engine/tileBgCache.ts
    depends_on:
      - add-ruin-apron-tile-type
      - define-lift-constants
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: regression-tests-apron-placement
    title: 'Add tests covering RuinApron placement around entrances and the CaveEntrance preservation edge case'
    spec_id: ruin-accessibility-bugs
    spec_sections:
      - ruin-entrance-walkable-perimeter
    context_files:
      - src/engine/__tests__/ruins.test.ts
      - src/engine/ruins.ts
    output_files:
      - src/engine/__tests__/ruins.test.ts
    depends_on:
      - place-apron-around-entrances
    verification:
      - npx vitest run src/engine/__tests__/ruins.test.ts
    repair: retry
    tags: [test]

  - id: regression-tests-lift-constants
    title: 'Add tests asserting lift constants are exported and ordered correctly (entrance > apron > 0)'
    spec_id: ruin-visual-style
    spec_sections:
      - overworld-ruin-entrance-elevation-lift
    context_files:
      - src/engine/__tests__/ruin-visual-style.test.ts
      - src/engine/tileBg.ts
    output_files:
      - src/engine/__tests__/ruin-visual-style.test.ts
    depends_on:
      - define-lift-constants
    verification:
      - npx vitest run src/engine/__tests__/ruin-visual-style.test.ts
    repair: retry
    tags: [test]
