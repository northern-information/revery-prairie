    title: 'Remove angelCantos, angelEncounterCount, cantoStored fields from GameState, AngelData, types, state init, and schema allowlist'
    spec_id: angels
    spec_sections:
      - angel-spawning
      - angel-no-interaction
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/ecs/types.ts
      - src/engine/angels.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/ecs/types.ts
      - src/engine/angels.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on: []
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags: [engine]

  - id: remove-canto-engine-functions
    title: 'Delete storeAngelCanto and generateAngelHash from angels.ts; remove their call sites and the angel branch in interactWithCharacter/getAdjacentCharacter; remove sha256 wiring from crypto.ts comments'
    spec_id: angels
    spec_sections:
      - angel-no-interaction
    context_files:
      - src/engine/angels.ts
      - src/engine/interaction.ts
      - src/engine/crypto.ts
    output_files:
      - src/engine/angels.ts
      - src/engine/interaction.ts
      - src/engine/crypto.ts
