  - id: remove-cantos-screen-and-tab
    title: 'Delete CantosScreen.tsx and its test; remove the cantos entry from PermacomputerShell tabs; remove the cantos branch in GameScreen; remove cantos from the PermacomputerScreen union in useKeyboard.ts'
    spec_id: permacomputer-tab-visibility
