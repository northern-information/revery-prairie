plan:
  id: pink-cooldown-cast-flash
  title: 'Pink revery cooldown sweep and white→pink→original cast flash'
  created: '2026-05-01'
  global_verification:
    - 'npm run typecheck'
    - 'npm run lint'
    - 'npm run test'

tasks:
  - id: recolor-cooldown-overlay
    title: 'Recolor cooldown conic-gradient sweep from gold to hot pink'
    spec_id: action-bar
    spec_sections:
      - cooldown-overlay-color
    context_files:
      - src/components/ActionBar.tsx
      - src/styles/index.css
    output_files:
      - src/components/ActionBar.tsx
    depends_on: []
    verification:
      - 'npm run typecheck'
    repair: retry
    tags: [component]

  - id: add-cast-flash-overlay
    title: 'Add white→pink→original cast flash on revery cast'
    spec_id: action-bar
    spec_sections:
      - revery-cast-flash
    context_files:
      - src/components/ActionBar.tsx
      - src/engine/actionBar.ts
    output_files:
      - src/components/ActionBar.tsx
    depends_on:
      - recolor-cooldown-overlay
    verification:
      - 'npm run typecheck'
    repair: retry
    tags: [component]

  - id: add-actionbar-component-test
    title: 'Add component test asserting pink cooldown overlay and cast flash on revery slots only'
    spec_id: action-bar
    spec_sections:
      - cooldown-overlay-color
      - revery-cast-flash
    context_files:
      - src/components/ActionBar.tsx
      - src/components/__tests__/Sidebar.test.tsx
      - src/engine/state.ts
      - src/engine/actionBar.ts
    output_files:
      - src/components/__tests__/ActionBar.test.tsx
    depends_on:
      - add-cast-flash-overlay
    verification:
      - 'npx vitest run src/components/__tests__/ActionBar.test.tsx'
    repair: retry
    tags: [component, test]
