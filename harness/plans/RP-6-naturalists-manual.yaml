plan:
  id: RP-6-naturalists-manual
  title: "Naturalist's manual — hold-to-scan, per-species discovery, hex grid render"
  created: 2026-05-19
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + dashboard status ---

  - id: doctrine-status-update
    title: Mark RP-3 shipped (PR #328), flip RP-6 to in-progress with spec/plan paths, add scan-to-discover section to docs/claude/manual.md, note RP-6 shipped grid in docs/claude/genetics.md
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - doctrine-and-status-aligned
    context_files:
      - docs/backlog.yaml
      - docs/claude/manual.md
      - docs/claude/genetics.md
    output_files:
      - docs/backlog.yaml
      - docs/claude/manual.md
      - docs/claude/genetics.md
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: State shape + constants ---

  - id: add-scan-state-fields
    title: Add state.scannedSpecimens (Map<FloraSpecies, string>) and state.scanInProgress (ScanProgress | null) to GameState. Add SCAN_DURATION_MS = 1500 constant. Update createGameState to initialize both fields. Add both to EXPECTED_FIELDS in schema.test.ts.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - scan-state-on-gamestate
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/harness/__tests__/serialization/schema.test.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/constants.ts
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - engine

  # --- Tier 2: Pure scan logic + tests ---

  - id: create-scan-module
    title: Create src/engine/scan.ts with selectScanTarget(state) and commitScan(state) pure functions. selectScanTarget returns { position, species, identity } | null using the priority rules (on-tile → facing → N/E/S/W). commitScan re-evaluates target, records discovery, writes specimen on first scan only, spawns pickup bloom.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - scan-target-selection
      - commit-scan-records-discovery
    context_files:
      - src/engine/types.ts
      - src/engine/position.ts
      - src/engine/manual.ts
      - src/engine/effects.ts
      - src/engine/flora/species.ts
    output_files:
      - src/engine/scan.ts
    depends_on:
      - add-scan-state-fields
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: scan-engine-tests
    title: Create src/engine/__tests__/scan.test.ts with full coverage of selectScanTarget (all priority rules + null cases) and commitScan (first scan writes specimen, rescan is no-op for the map, pickup bloom spawns, target-died abort, idempotent discovery).
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - scan-target-selection
      - commit-scan-records-discovery
    context_files:
      - src/engine/scan.ts
      - src/engine/types.ts
      - src/engine/__tests__/helpers/createTestFloraEntry.ts
    output_files:
      - src/engine/__tests__/scan.test.ts
    depends_on:
      - create-scan-module
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/engine/__tests__/scan.test.ts
    repair: retry
    tags:
      - engine
      - test

  # --- Tier 3: Keyboard wiring ---

  - id: wire-hold-to-scan-keybinding
    title: Add hold-to-scan v key handling to useKeyboard. Keydown starts scan if scanInProgress is null and selectScanTarget returns non-null. Keyup either commits (elapsed >= SCAN_DURATION_MS) or aborts. Movement keys (wasd) clear scanInProgress before processing the move. Block when text input focused, dialog open, menu open, or genesis running. Key repeat on v while a scan is active is ignored.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - hold-to-scan-keybinding
    context_files:
      - src/hooks/useKeyboard.ts
      - src/engine/scan.ts
      - src/engine/constants.ts
      - src/engine/types.ts
    output_files:
      - src/hooks/useKeyboard.ts
    depends_on:
      - create-scan-module
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - hook

  - id: keyboard-scan-tests
    title: Add scan-related tests to src/hooks/__tests__/useKeyboard.test.ts — keydown starts scan, full hold commits, early release aborts, movement aborts, modal blocks suppress.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - hold-to-scan-keybinding
    context_files:
      - src/hooks/useKeyboard.ts
      - src/hooks/__tests__/useKeyboard.test.ts
      - src/engine/scan.ts
    output_files:
      - src/hooks/__tests__/useKeyboard.test.ts
    depends_on:
      - wire-hold-to-scan-keybinding
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/hooks/__tests__/useKeyboard.test.ts
    repair: retry
    tags:
      - hook
      - test

  # --- Tier 4: Render pass for the progress arc ---

  - id: add-scan-progress-render-pass
    title: Create src/engine/render/passes/scanProgress.ts. The pass is active when state.scanInProgress is non-null; it draws a thin colored arc at the target tile position, filling 0% → 100% over SCAN_DURATION_MS. Color comes from FLORA_SPECIES[species].color at ~60% alpha. Register the pass in passes/index.ts in the 'effect' slot.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - scan-progress-visible-on-canvas
    context_files:
      - src/engine/render/passes/index.ts
      - src/engine/render/passes/pollenOverlay.ts
      - src/engine/render/passes.ts
      - src/engine/flora/species.ts
      - src/engine/constants.ts
    output_files:
      - src/engine/render/passes/scanProgress.ts
      - src/engine/render/passes/index.ts
    depends_on:
      - add-scan-state-fields
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine
      - render

  # --- Tier 5: Hex grid component + manual entry rendering ---

  - id: create-hex-grid-view
    title: Create src/components/HexGridView.tsx — pure presentational component. Props - identity - string. Renders an 8x8 grid of nibble characters via hashToHexGrid(identity). Tailwind styling - monospace, faint color, light borders or background. Small footprint suitable for a manual entry header.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - manual-renders-hex-grid-for-scanned-species
    context_files:
      - src/engine/genetics/index.ts
      - src/components/ManualPanel.tsx
    output_files:
      - src/components/HexGridView.tsx
    depends_on:
      - doctrine-status-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - component

  - id: hex-grid-view-tests
    title: Create src/components/__tests__/HexGridView.test.tsx — renders 64 cells for a 64-char identity, cell values match the hashToHexGrid mapping, component is purely presentational (no state).
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - manual-renders-hex-grid-for-scanned-species
    context_files:
      - src/components/HexGridView.tsx
      - src/engine/genetics/index.ts
    output_files:
      - src/components/__tests__/HexGridView.test.tsx
    depends_on:
      - create-hex-grid-view
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/components/__tests__/HexGridView.test.tsx
    repair: retry
    tags:
      - component
      - test

  - id: render-hex-grid-in-manual-entry
    title: Update ManualPanel.tsx EntryCard to render a HexGridView above the lore body when the entry id starts with 'flora:' AND state.scannedSpecimens.get(species) is non-null. The species is derived from the entry id ('flora:clover' → 'clover'). Undiscovered entries are already filtered by the existing isDiscovered check; this change only affects rendering of discovered flora entries.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - manual-renders-hex-grid-for-scanned-species
    context_files:
      - src/components/ManualPanel.tsx
      - src/components/HexGridView.tsx
      - src/engine/manual.ts
      - src/engine/types.ts
    output_files:
      - src/components/ManualPanel.tsx
    depends_on:
      - create-hex-grid-view
      - add-scan-state-fields
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - component

  - id: manual-panel-tests
    title: Update src/components/__tests__/ManualPanel.test.tsx — undiscovered flora entries are absent from the rendered manual (regardless of search), discovered flora entries render with HexGridView above the lore, scanning a species via direct state mutation in the test surfaces the entry.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - manual-renders-hex-grid-for-scanned-species
    context_files:
      - src/components/ManualPanel.tsx
      - src/components/HexGridView.tsx
      - src/engine/state.ts
      - src/components/__tests__/ManualPanel.test.tsx
    output_files:
      - src/components/__tests__/ManualPanel.test.tsx
    depends_on:
      - render-hex-grid-in-manual-entry
    verification:
      - npx tsc -b --noEmit
      - npx vitest run src/components/__tests__/ManualPanel.test.tsx
    repair: retry
    tags:
      - component
      - test

  # --- Tier 6: Full verify ---

  - id: full-verify
    title: Run the full verification suite — typecheck, all tests, lint. Cross-cutting gate before PR.
    spec_id: RP-6-naturalists-manual
    spec_sections:
      - scan-state-on-gamestate
      - hold-to-scan-keybinding
      - commit-scan-records-discovery
      - manual-renders-hex-grid-for-scanned-species
    context_files: []
    output_files: []
    depends_on:
      - scan-engine-tests
      - keyboard-scan-tests
      - add-scan-progress-render-pass
      - manual-panel-tests
    verification:
      - npm run typecheck
      - npm run test
      - npm run lint
    repair: retry
    tags:
      - verification
