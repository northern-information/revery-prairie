      - monarch-wandering
      - monarch-activation-on-touch
      - monarch-prairie-spawn
      - monarch-idle-persistence
    context_files:
      - src/engine/types.ts
      - src/engine/ecs/types.ts
      - src/engine/entities.ts
      - src/engine/constants.ts
      - src/engine/position.ts
      - src/engine/pathfinding.ts
      - src/engine/cloverLifecycle.ts
      - src/engine/effects.ts
      - src/engine/manual.ts
      - src/engine/hunger.ts
    output_files:
      - src/engine/monarch.ts
    depends_on:
      - monarch-types
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine]

  - id: monarch-spawn-integration
    title: 'Hook monarch spawn chance into bee creation sites (recipes, angels, drops)'
    spec_id: monarch-butterfly
    spec_sections:
