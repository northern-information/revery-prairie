plan:
  id: monarch-butterfly
  title: 'Add monarch butterfly that spawns during rain and plants prairies'
  created: 2026-04-18
  global_verification:
    - 'npm run build'
    - 'npm run test'
    - 'npm run lint'

tasks:
  - id: monarch-types
    title: 'Add MonarchState component type and constants for monarch butterfly'
    spec_id: monarch-butterfly
    spec_sections:
      - monarch-spawn-during-rain
      - monarch-wandering
      - monarch-activation-on-touch
      - monarch-prairie-spawn
    context_files:
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
      - src/engine/types.ts
    output_files:
      - src/engine/ecs/types.ts
      - src/engine/constants.ts
    depends_on: []
    verification:
      - 'npx tsc -b --noEmit'
    repair: retry
    tags: [engine, types]

  - id: monarch-engine-module
    title: 'Create src/engine/monarch.ts with spawn logic, wandering, activation, prairie planting, and soil healing'
    spec_id: monarch-butterfly
    spec_sections:
