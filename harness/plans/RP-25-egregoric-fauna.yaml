  - id: add-chronicle-fauna-emitter
    title: "Add `emitEgregoricFaunaFirstSighting(state: GameState, faunaKind: 'wrongBee' | 'pierceWalker', position: Position)` to src/engine/chronicle/emitters.ts. Mirror the emitSeasonRollover pattern: gate on isOverworld(state); resolve the named region containing `position` via state.namedRegions.find(); call pickTemplate('egregoric-fauna-sighting', tone, state) to choose a template; fill slots { region, faunaKind }; call addChronicleEvent. Then add a new CHRONICLE_TEMPLATES entry with category 'egregoric-fauna-sighting' — find the templates registry (likely src/engine/chronicle/templates.ts) and add 1–2 short copies per tone, using { region } and { faunaKind } slots. Keep copy spare and observational — per RP-22 doctrine, the world speaks of itself, never the player. NEVER use the word 'invasive' anywhere in the copy (CI guard)."
    spec_id: RP-25-egregoric-fauna
