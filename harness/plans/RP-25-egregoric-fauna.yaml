    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 3: Spawn paths ---

  - id: implement-fauna-spawn
    title: "Extend egregoreFauna.ts with two internal helpers and an exported tick driver. `attemptWrongBeeSpawn(state, rng = Math.random)`: gates on state.zone === Zone.Overworld, enumerateSeamClusters(state).length > 0, live wrongBee count < WRONG_BEE_CAP, and rng() < WRONG_BEE_SPAWN_CHANCE. On success: pick a random cluster, pick a random walkable tile within Chebyshev distance 1 of it (skip the player's tile and any other entity-occupied tile), create the entity with components EntityTag='wrongBee', Position, DriftBehavior { moveChance: 0.4, bounds: null }, WrongBeeLifecycle { ticksRemaining: WRONG_BEE_LIFESPAN_TICKS }. Call recordDiscovery(state, 'fauna:wrongBee') and, if it returns true, call emitEgregoricFaunaFirstSighting(state, 'wrongBee', positionOfSpawn). `attemptPierceWalkerSpawn(state, rng = Math.random)`: gates on overworld, cluster present, live pierceWalker count < PIERCE_WALKER_CAP, rng() < PIERCE_WALKER_SPAWN_CHANCE. On success: pick a random cluster tile not occupied by the player; pick a PUA codepoint via the existing egregore glyph picker (pickEgregoreCodepoint or equivalent — find the exact export name in src/engine/egregore.ts and reuse it; if it returns null/undefined, suppress this spawn — see failure_conditions); create the entity with EntityTag='pierceWalker', Position (on the cluster tile), PierceWalkerGlyph { codepoint }. Append the position to state.egregoreSpecimens. Call recordDiscovery(state, 'fauna:pierceWalker') and emitEgregoricFaunaFirstSighting on first sighting. Export `tickEgregoreFauna(state, time, rng = Math.random)`: early-returns when state.zone !== Zone.Overworld; otherwise calls both attempt* helpers, then ticks live entities (see next task)."
    spec_id: RP-25-egregoric-fauna
    spec_sections:
      - wrong-bee-spawn
      - pierce-walker-spawn
    context_files:
      - src/engine/egregoreFauna.ts
      - src/engine/types.ts
      - src/engine/manual.ts
      - src/engine/egregore.ts
      - src/engine/ecs/world.ts
    output_files:
      - src/engine/egregoreFauna.ts
    depends_on:
      - implement-seam-cluster-detection-and-constants
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  # --- Tier 4: Per-tick motion + lifespan ---

  - id: implement-fauna-motion-and-lifespan
    title: "Add three internal tick helpers to egregoreFauna.ts and call them from tickEgregoreFauna. `tickWrongBeeMotion(state, rng)`: for each entity with EntityTag === 'wrongBee', find the nearest seam tile within Chebyshev distance WRONG_BEE_ATTRACTION_RADIUS. If none, perform a DriftBehavior step (random walkable adjacent tile with probability moveChance, otherwise no-op). If a target exists, enumerate the 8 adjacent walkable tiles, filter to those that strictly decrease Chebyshev distance to the target, and step to a uniformly-random tile from that set. If the filtered set is empty, fall back to any walkable adjacent tile (no preference). Do NOT run any pollen pickup, hive return, or pollinator-preference logic for wrongBees. `tickWrongBeeLifespan(state)`: decrement WrongBeeLifecycle.ticksRemaining by 1 for every wrongBee; destroy the entity when ticksRemaining transitions 1 → 0. `tickPierceWalkerMotion(state, rng)`: for each entity with EntityTag === 'pierceWalker', enumerate the 8 neighbors of its position, filter to those in state.egregorePositions; if empty, no move. Otherwise with probability PIERCE_WALKER_MOVE_CHANCE, step to a uniformly-random filtered neighbor. PierceWalkers have no lifespan in v1. Wire all three into tickEgregoreFauna in order: spawn attempts first, then wrongBee motion, then wrongBee lifespan, then pierceWalker motion."
    spec_id: RP-25-egregoric-fauna
    spec_sections:
      - wrong-bee-routing-violation
      - wrong-bee-lifespan-expiry
      - pierce-walker-seam-bound-motion
    context_files:
      - src/engine/egregoreFauna.ts
      - src/engine/types.ts
      - src/engine/ecs/world.ts
      - src/engine/movement.ts
    output_files:
      - src/engine/egregoreFauna.ts
    depends_on:
      - implement-fauna-spawn
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

