  # --- Tier 8: Aura render pass ---

  - id: implement-egregore-fauna-aura-pass
    title: "Replace the egregoreFaunaAura.ts stub with the alpha-pulse render pass per the egregoric-fauna-aura behavior. Pattern after an existing simple pass that draws per-entity fillRects (e.g. prairieHalo.ts or angelGoldAura.ts — pick whichever is structurally closer). The pass: queries state.world for entities tagged 'wrongBee' or 'pierceWalker'; for each, looks up Position; computes screen position via the existing camera/iso helpers used by other passes; draws a single-tile fillRect at that screen position using the egregoric color token at alpha = 0.15 + 0.10 * Math.sin(state.tickCount * 0.05 + entityId * 0.7); early-returns when state.zone !== Zone.Overworld. Cache reads/writes route through cacheContract per docs/claude/rendering.md (consult an existing pass that uses the cache for the canonical shape). Register the new pass in src/engine/render/passes/index.ts AFTER tile bg composite and BEFORE the entity glyph loop in renderer.ts — find the appropriate insertion point in the registration order and place egregoreFaunaAura there."
    spec_id: RP-25-egregoric-fauna
    spec_sections:
      - egregoric-fauna-aura
    context_files:
      - src/engine/render/passes/egregoreFaunaAura.ts
      - src/engine/render/passes/index.ts
      - src/engine/render/passes/prairieHalo.ts
      - src/engine/render/passes/angelGoldAura.ts
      - src/engine/render/cacheContract.ts
