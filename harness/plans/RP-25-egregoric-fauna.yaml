  - id: register-egregore-fauna-system
    title: "Register tickEgregoreFauna as a gameLoop system in src/engine/gameLoop.ts. System id: 'egregore-fauna'. intervalMs: match the existing pollinator/bee tick cadence (look up the constant used by bee routing — likely BEE_ROUTING_TICK_MS or similar; reuse the same value so wrongBees feel temporally adjacent to native bees). priority: pick a value AFTER bee routing and BEFORE rendering — inspect the existing priority numbers in gameLoop.ts and slot in just after the bee-routing system. The system runs unconditionally; tickEgregoreFauna handles the zone gate internally."
    spec_id: RP-25-egregoric-fauna
    spec_sections:
