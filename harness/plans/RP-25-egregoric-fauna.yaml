  # --- Tier 2: Module skeleton + seam detection ---

  - id: implement-seam-cluster-detection-and-constants
    title: "Replace the egregoreFauna.ts stub with: export const WRONG_BEE_CAP = 3; PIERCE_WALKER_CAP = 1; WRONG_BEE_SPAWN_CHANCE = 0.005; PIERCE_WALKER_SPAWN_CHANCE = 0.001; WRONG_BEE_LIFESPAN_TICKS = 600; WRONG_BEE_ATTRACTION_RADIUS = 6; PIERCE_WALKER_MOVE_CHANCE = 0.1. Export `isSeamCluster(state: GameState, x: number, y: number): boolean` per the seam-cluster-detection behavior: returns true iff (x, y) is in state.egregorePositions AND at least 2 OTHER egregoric tiles are within Chebyshev distance 2. Use a set lookup over state.egregorePositions for O(N) detection (or a precomputed Set if measurement proves the linear scan slow — start with the simpler version). Also export a helper `enumerateSeamClusters(state): Position[]` that returns all positions in state.egregorePositions that satisfy isSeamCluster — used by spawn paths."
    spec_id: RP-25-egregoric-fauna
    spec_sections:
      - seam-cluster-detection
    context_files:
      - src/engine/egregoreFauna.ts
      - src/engine/types.ts
      - src/engine/egregore.ts
    output_files:
      - src/engine/egregoreFauna.ts
    depends_on:
