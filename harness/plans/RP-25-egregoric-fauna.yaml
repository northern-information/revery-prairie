plan:
  id: RP-25-egregoric-fauna
  title: 'RP-25 Egregoric fauna — wrongBee + pierceWalker, seam-gated spawn, chronicle, manual entries, aura render pass'
  created: 2026-05-31
  # Cross-cutting: adds two ECS component types, registers a new gameLoop
  # system, adds a render pass, edits renderer.ts, manual.ts, and the
  # chronicle emitter index. Engine layer at the core. Full suite is the
  # right gate.
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

