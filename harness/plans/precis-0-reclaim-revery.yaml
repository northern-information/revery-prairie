plan:
  id: precis-0-reclaim-revery
  title: Reclaim Revery — delete the four player-cast spells and the action bar entirely
  created: 2026-05-17
  global_verification:
    - npm run typecheck
    - npm run test
    - npm run lint

tasks:
  # --- Tier 0: Doctrine + dashboard status ---

  - id: doctrine-update
    title: Already applied in worktree — update precis-thinktank-v3 to match the deletion scope, flip precis-status.yaml feature 0 to in-progress
    spec_id: precis-0-reclaim-revery
    spec_sections:
      - v3-doctrine-aligned
    context_files:
      - docs/precis-thinktank-v3.md
      - docs/precis-status.yaml
    output_files:
      - docs/precis-thinktank-v3.md
      - docs/precis-status.yaml
    depends_on: []
    verification: []
    repair: skip
    tags:
      - docs

  # --- Tier 1: Engine type + state shape ---
  # Deleting GameState.reveries and GameState.actionBar first lets typecheck
  # surface every dependent site at once.

  - id: gamestate-shape
    title: Remove reveries and actionBar fields from GameState and createGameState; remove ActionBarSlot interface
    spec_id: precis-0-reclaim-revery
    spec_sections:
      - starting-reveries-removed
      - action-bar-deleted
    context_files:
      - src/engine/types.ts
      - src/engine/state.ts
      - src/engine/actionBar.ts
    output_files:
      - src/engine/types.ts
      - src/engine/state.ts
    depends_on:
      - doctrine-update
    verification:
      - npx tsc -b --noEmit
    repair: retry
    tags:
      - engine

  - id: schema-allowlist
    title: Remove reveries and actionBar from EXPECTED_FIELDS in the serialization schema test
    spec_id: precis-0-reclaim-revery
    spec_sections:
      - schema-allowlist-updated
    context_files:
      - src/harness/__tests__/serialization/schema.test.ts
      - src/engine/types.ts
    output_files:
      - src/harness/__tests__/serialization/schema.test.ts
    depends_on:
      - gamestate-shape
    verification:
      - npx vitest run src/harness/__tests__/serialization/schema.test.ts
    repair: retry
    tags:
      - test
      - harness

