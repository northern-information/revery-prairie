id: RP-39-post-revery-memory-softening
name: 'Post-Revery memory softening (RETIRED — subsumed by RP-62)'
priority: low
layer: engine
source_files:
  - src/engine/revery.ts
dependencies:
  - overworld-fog-of-war

# RETIRED by RP-62 ("fog returns to memory").
#
# RP-39 made Revery exit drain the prairie's bright-memory tier
# (overworldFogDiscovered) so the steward walked out of the little house
# into a dimmed prairie rather than a fully-remembered one. That whole
# mechanism depended on there being TWO memory tiers: a permanently-bright
# fullyDiscovered tier and a dim partiallyDiscovered tier, with the bright
# tier draining on Revery exit.
#
# RP-62 collapses those two tiers into a single `remembered` (dim) state
# that the fog returns to the instant the player looks away — everywhere,
# always, in all three zones. There is no longer a bright tier to drain,
# so the Revery-exit softening hook has nothing to do. The "memory persists
# but dims" property RP-39 delivered on Revery exit is now the permanent
# default at every frame.
#
# Implementation consequence: the softening hook in tickRevery's Closing
# phase (the drain of overworldFogDiscovered) is removed along with the
# overworldFogDiscovered field itself. This spec is kept as a tombstone so
# the dependency graph and historical record stay intact; it asserts no
# behaviors.

behaviors:
  - id: softening-retired
    description: >
      The post-Revery memory softening behavior is retired. Revery exit
      no longer performs any fog-set mutation: there is no
      overworldFogDiscovered to drain (RP-62 removed it), and the
      prairie is already dim memory by default the moment the steward
      leaves a tile's gaze. tickRevery's Closing phase still nulls
      state.revery and reverts the house scene as before; it simply
      does not touch the fog system.
    inputs:
      - 'state.revery.phase === ReveryPhase.Closing'
    outputs:
      - 'tickRevery completes the Closing phase with no fog-set mutation'
      - 'state.revery === null after tickRevery returns (unchanged Closing-phase contract)'
    state_changes:
      - field: revery
        effect: 'set to null (existing Closing-phase behavior; unchanged by RP-62)'
    determinism: deterministic

edge_cases:
  - id: revery-exit-leaves-fog-untouched
    description: >
      A steward who walked the overworld, then enters and completes a
      Revery. On the Closing tick, tickRevery nulls state.revery and
      reverts the house scene but performs no fog mutation. The prairie
      the steward walked is already dim memory by the RP-62 default.
    expected: 'state.revery === null after the Closing tick; no fog set is read or written by tickRevery; the prairie renders as remembered (dim) wherever it is out of gaze.'

failure_conditions:
  - trigger: 'tickRevery references overworldFogDiscovered (the field RP-62 removed)'
    expected: 'compile/type error; the softening hook and its target field must both be gone'

verification:
  test_file: src/engine/__tests__/visibility.test.ts
  test_pattern: 'fog of war'
  command: 'npx vitest run src/engine/__tests__/visibility.test.ts'
