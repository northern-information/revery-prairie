id: player-spawn
name: 'Player spawn meteor ceremony'
priority: high
layer: engine
source_files:
  - src/engine/state.ts
  - src/engine/celestial.ts
  - src/engine/gameLoop.ts
  - src/engine/renderer.ts
  - src/engine/camera.ts
  - src/engine/types.ts
  - src/engine/constants.ts
dependencies:
  - shooting-stars
  - genesis-transition

behaviors:
  - id: spawn-position
    description: >
      The player's deterministic spawn tile sits one tile west of the
      exact map center: (floor(MAP_WIDTH/2) - 1, floor(MAP_HEIGHT/2)).
      With MAP_WIDTH = MAP_HEIGHT = 147, this is (72, 73). Gron occupies
      the exact center tile (73, 73), so the player and Gron always
      spawn adjacent. The cave entrance is placed just outside Gron's
      rain aura via the existing minCaveDist/maxCaveDist ring
      (eastward bias preserved). state.playerSpawn.spawnPos is
      initialized to this position; state.player.x/y match.
    inputs:
      - 'createGameState invoked'
    outputs: []
    state_changes:
      - field: player
        effect: 'set to (floor(MAP_WIDTH/2) - 1, floor(MAP_HEIGHT/2))'
      - field: playerSpawn.spawnPos
        effect: 'matches state.player'
    determinism: deterministic

  - id: spawn-state-record
    description: >
      every player carries a spawn record describing whether the player
      is currently visible and which incoming meteor is bound for them.
      shape: { visible: boolean, spawnPos: Position, meteorEntityId: number | null,
      triggeredAt: number }. the local (single-player) spawn record lives
      at state.playerSpawn so the design generalizes to a per-player map
      when multiplayer lands. visible defaults to false at game start.
    inputs:
      - 'createGameState called'
    outputs: []
    state_changes:
      - field: playerSpawn
        effect: 'initialized with visible=false, spawnPos=player position, meteorEntityId=null, triggeredAt=0'
    determinism: deterministic

  - id: trigger-on-game-start
    description: >
      on the first gameLoop tick after createGameState (or after the
      genesis crossfade in the genesis path), triggerPlayerSpawnShower
      is called with the player's position and the current time. this
      kicks off the first meteor shower of the run with one star
      pre-targeted at the player. the call is idempotent (guarded by
      playerSpawn.triggeredAt !== 0). the shower targets the player
      with a path length chosen so the star lands within ~2000ms.
    inputs:
      - 'first gameLoop tick where playerSpawn.triggeredAt is 0'
    outputs: []
    state_changes:
      - field: playerSpawn.triggeredAt
        effect: 'set to current time'
      - field: playerSpawn.meteorEntityId
        effect: 'set to the entity id of the spawn-targeted shooting star'
      - field: meteorShower
        effect: 'shower transitions to active immediately (see player-spawn-shower-trigger in shooting-stars spec)'
    determinism: time-based

  - id: hidden-during-descent
    description: >
      while playerSpawn.visible is false, the renderer must not draw
      the player glyph. the player tile reads as empty terrain (no
      player-selected highlight, no facing-entity highlight, no
      pending-target highlight). other entities
      (ghosts, bees, coyote) treat the player tile as occupied via
      getBlockedPositions so nothing else lands on the spawn tile.
      keyboard input is accepted but movement is short-circuited
      while invisible — the player cannot walk away from their
      meteor's landing target.
    inputs:
      - 'playerSpawn.visible === false'
      - 'render frame, input tick'
    outputs:
      - 'player glyph not drawn'
      - 'player tile not cursorable'
      - 'WASD/click-to-move ignored'
    state_changes: []
    determinism: deterministic

  - id: emerge-on-impact
    description: >
      when the spawn-targeted shooting star lands (matched via
      playerSpawn.meteorEntityId), the star's tickShootingStars
      handler suppresses the meteorite ground-item drop, still spawns
      the explosion TimedEffect entity (tagged so the renderer uses
      the steward pink palette — see steward-impact-color), flips
      playerSpawn.visible to true, sets state.screenShakeUntil =
      time + SATELLITE_SHAKE_DURATION_MS so the impact shakes the
      camera identically to a satellite impact, and enqueues a log
      entry reading "steward {stewardName} falls to the prairie" at
      the impact tile. a pickupBloom is NOT spawned — the explosion
      alone marks the arrival. immediately afterward the player
      becomes interactable: the renderer draws the glyph, the cursor
      recognizes the tile, and movement is accepted.
    inputs:
      - 'tickShootingStars resolves a star whose entity id matches playerSpawn.meteorEntityId'
    outputs:
      - 'explosion entity created at the spawn tile, flagged for the steward pink palette'
      - 'no meteorite ground-item entity created'
      - 'screen shake triggered for SATELLITE_SHAKE_DURATION_MS'
      - '"steward {stewardName} falls to the prairie" log entry queued'
    state_changes:
      - field: playerSpawn.visible
        effect: 'flipped to true'
      - field: playerSpawn.meteorEntityId
        effect: 'cleared to null'
      - field: screenShakeUntil
        effect: 'set to time + SATELLITE_SHAKE_DURATION_MS so the renderer shakes the canvas'
      - field: world
        effect: 'shooting star entity destroyed; steward-flagged explosion entity created'
      - field: queuedEvents
        effect: 'arrival log entry appended with stewardName interpolated'
    determinism: time-based

  - id: steward-star-fixed-direction
    description: >
      the steward's spawn-targeted star always descends along the
      iso "straight down the screen" axis — world velocity
      { dx: +1, dy: +1 }. this is independent of the shower radiant
      that governs the rest of the spawn shower (see shooting-stars
      spec, player-spawn-shower-trigger). triggerPlayerSpawnShower
      passes this fixed direction to spawnShootingStarAtTarget for
      the forPlayerSpawn star only; non-steward stars in the same
      shower continue to use the shower's random radiant. rationale —
      with iso projection screenPx = (worldX - worldY) * cw and
      screenPy = (worldX + worldY) * halfH, dx === dy keeps screen X
      constant while screen Y advances, so the star reads as falling
      straight down regardless of where on the map the player spawns.
      the steward's star starts off-map at
      (spawnPos.x - backtrackTiles, spawnPos.y - backtrackTiles) —
      the iso "north" corner — and descends to the spawn tile.
    inputs:
      - 'triggerPlayerSpawnShower called with spawnPos and time'
    outputs:
      - 'steward star spawned with velocity { dx: 1, dy: 1 }'
    state_changes:
      - field: world
        effect: 'shooting star ECS entity created with Velocity { dx: 1, dy: 1 } and Position offset (-backtrackTiles, -backtrackTiles) from spawnPos'
    determinism: deterministic

  - id: steward-star-color
    description: >
      the steward's spawn-targeted star renders in the UI-pink
      palette to mark it as a user-arrival event, not a world entity.
      head uses STEWARD_STAR_HEAD_COLOR ('#ff69b4'); trail uses
      STEWARD_STAR_TRAIL_COLORS — a 5-step pink-to-dark-pink gradient
      analogous to SHOOTING_STAR_TRAIL_COLORS' white-to-gray ramp.
      detection in renderer.ts uses the ShootingStarData.forPlayerSpawn
      flag — only the steward star is recolored; ambient and shower
      stars retain SHOOTING_STAR_HEAD_COLOR / SHOOTING_STAR_TRAIL_COLORS
      unchanged. this is a documented one-off carve-out from the
      CLAUDE.md rule reserving UI pink for user actions; only the
      steward star qualifies because it delivers the player.
    inputs:
      - 'render frame with a forPlayerSpawn-flagged shooting star entity present'
    outputs:
      - 'steward star head and trail drawn with UI-pink palette'
      - 'all other shooting stars unchanged (white head, gray trail)'
    state_changes: []
    determinism: deterministic

  - id: steward-impact-color
    description: >
      the steward star's impact explosion renders in the UI-pink
      palette instead of the gold EXPLOSION_COLORS used for satellites
      and ordinary meteor strikes. the explosion TimedEffect created
      by the forPlayerSpawn star carries kind 'stewardImpact'; the
      explosion render pass branches on that kind to read
      STEWARD_EXPLOSION_COLORS (a 5-step pink-to-dark-pink ramp
      mirroring EXPLOSION_COLORS' gold ramp). EXPLOSION_CHARS and
      EXPLOSION_RADIUS/EXPLOSION_DURATION_MS are reused — only the
      colors differ. chain explosions and satellite explosions
      continue to use EXPLOSION_COLORS unchanged.
    inputs:
      - 'render frame with an explosion entity of kind stewardImpact present'
    outputs:
      - 'steward impact explosion drawn with UI-pink palette'
      - 'satellite and chain explosions unchanged (gold palette)'
    state_changes: []
    determinism: deterministic

  - id: camera-follow-steward-star
    description: >
      while playerSpawn.visible is false and playerSpawn.meteorEntityId
      is non-null and references a live shooting-star entity,
      updateCamera centers on the steward star's current Position
      rather than state.player. on the impact tick the star entity is
      destroyed and playerSpawn.visible flips to true in the same
      frame; from the next updateCamera call onward the camera
      resumes its normal state.player-tracking behavior, with the
      player tile already centered (because spawnPos === state.player
      and the star landed there). the camera does not lerp during the
      descent — it snaps to the star's integer tile each frame, the
      same as how it follows the player. the right-inset and small-map
      branches in updateCamera apply unchanged.
    inputs:
      - 'updateCamera called while playerSpawn.visible === false and meteorEntityId references a live shooting star'
    outputs: []
    state_changes:
      - field: camera
        effect: 'centered on the steward star Position component (with viewport half-extent offset) instead of state.player'
    determinism: deterministic

  - id: multiplayer-generic-trigger
    description: >
      triggerPlayerSpawnShower(state, spawnPos, time) is the only entry
      point for spawn ceremonies. it does not assume the local player.
      when multiplayer lands, the per-player spawn record (or its
      ECS-component equivalent) feeds spawnPos into the same call —
      every joining player gets their own meteor shower with one star
      aimed at their tile. concurrent showers triggered by overlapping
      joins are not required to interleave gracefully in this iteration;
      the trigger may no-op if a shower is already active and record a
      followup-needed flag for the joining player (out of scope for
      single-player but documented so the implementation does not
      foreclose it).
    inputs:
      - 'GameState, spawn Position for any player, time'
    outputs: []
    state_changes:
      - field: meteorShower
        effect: 'active when triggered with no prior shower running'
      - field: playerSpawn (or per-player equivalent)
        effect: 'triggeredAt and meteorEntityId set for the spawning player'
    determinism: time-based

edge_cases:
  - id: skip-genesis-still-spawns-via-meteor
    description: >
      ?skipGenesis=true bypasses the crossfade. the spawn meteor still
      runs — the trigger fires on the first gameplay tick regardless
      of whether genesisTransition was active.
    expected: 'spawn shower starts on first tick; player appears ~2s later'

  - id: spawn-tile-on-water-or-edge
    description: >
      the player spawns on the deterministic center tile, which is
      expected to be Dirt. if a future change places the spawn on an
      unwalkable tile, the trigger still fires but the targeted star
      lands per the targeted-star-spawning rules (water tiles produce
      no meteorite; explosion only).
    expected: 'spawn ceremony tolerates non-Dirt spawn tiles by skipping the meteorite drop and still emerging the player'

  - id: shower-already-active-when-triggered
    description: >
      another player joins (multiplayer) while a shower is already
      active. triggerPlayerSpawnShower should still spawn a single
      forPlayerSpawn star aimed at the new player without resetting
      remainingStars on the active shower.
    expected: 'one targeted spawn star created immediately; active shower state untouched'

  - id: deep-time-suppression
    description: >
      deep-time activation should never coincide with player spawn in
      single-player, but deep-time suppresses tickMeteorShower. if a
      spawn ceremony is in progress when deep-time activates, the
      shower aborts; playerSpawn.visible flips to true regardless so
      the player is not stranded invisible.
    expected: 'invisible-state cleared on deep-time activation as a safety; spawn ceremony may end without explosion'

  - id: idempotent-trigger
    description: >
      multiple gameLoop ticks fire before triggeredAt is observed by
      the next tick.
    expected: 'guard on playerSpawn.triggeredAt !== 0 prevents a second shower trigger'

  - id: steward-star-direction-independent-of-shower
    description: >
      pickRadiantDirection picks any of the 8 RADIANT_DIRECTIONS for
      the surrounding shower's other stars, including directions that
      do not match the steward star's fixed { 1, 1 } heading.
    expected: 'steward star always uses { dx: 1, dy: 1 } regardless of the radiant the shower selected; other shower stars continue to use the random shower radiant'

  - id: steward-star-near-map-edge
    description: >
      hypothetical future spawn tile near the NW corner of the map
      (small spawnPos.x and spawnPos.y) where backtrackTiles would
      place the star deep into negative coordinates.
    expected: 'star still spawns at (spawnPos.x - backtrackTiles, spawnPos.y - backtrackTiles); negative starting positions are valid because tickShootingStars only enforces walkability at the landing tile, not in transit'

  - id: camera-follow-fallback-on-missing-star
    description: >
      playerSpawn.visible === false but the steward star entity has
      been destroyed (off-map fallback path) and meteorEntityId was
      cleared in the same tick.
    expected: 'updateCamera falls back to state.player tracking on the same tick the entity is destroyed, because the camera-follow branch requires both visible === false AND a live entity'

  - id: impact-shake-during-deep-time
    description: >
      hypothetical race where deep time activates between the steward
      star spawn and its impact. deep time already drives its own
      shake via deepTime.shakeUntil.
    expected: 'steward impact still writes state.screenShakeUntil; renderer composes both shakes via the same shakeActive branch and amplitude (SATELLITE_SHAKE_AMPLITUDE) — no special-case stacking'

failure_conditions:
  - trigger: 'spawn-targeted star is destroyed off-map before reaching its target'
    expected: 'tickShootingStars detects entity destruction without impact on the player tile and flips playerSpawn.visible to true as a fallback so the player is never stranded invisible'

  - trigger: 'playerSpawn.meteorEntityId references an entity id that no longer exists'
    expected: 'next tick clears meteorEntityId to null and flips visible to true'

  - trigger: 'triggerPlayerSpawnShower called with no valid landing tile (entire map blocked)'
    expected: 'spawn-targeted star still spawns at spawnPos directly via spawnShootingStarAtTarget; the function never throws'

verification:
  test_file: src/engine/__tests__/playerSpawn.test.ts
  test_pattern: 'player spawn'
  command: 'npx vitest run src/engine/__tests__/playerSpawn.test.ts'
