id: ruin-fog-of-war
name: 'Ruin fog of war'
status: partial
priority: high
layer: engine
source_files:
  - src/engine/visibility.ts
  - src/engine/renderer.ts
  - src/engine/types.ts
  - src/engine/constants.ts
  - src/engine/ruins.ts
dependencies:
  - cave-fog-of-war

behaviors:
  - id: fov-computed-in-ruins
    description: >
      when the player is in a ruin zone, fog of war is active. the
      visibility system computes field of view from the player position
      using the same shadowcasting algorithm as the cave. tiles outside
      the vision radius or behind walls are not visible. this reuses
      the generalized zone visibility system rather than being
      cave-specific. the four-state visibility model
      (unexplored / partiallyDiscovered / fullyDiscovered / visible)
      applies identically in ruins.
    inputs:
      - 'state.currentZone is Ruin'
      - 'player position in ruin interior map'
      - 'ruin interior map tile data'
    outputs:
      - 'Set<string> of currently visible tile keys computed via FOV'
      - 'unexplored tiles render as black (no char, no color)'
      - 'partiallyDiscovered tiles render terrain at reduced brightness, entities hidden'
      - 'fullyDiscovered tiles render terrain and live entities at full brightness even when out of LOS'
      - 'visible tiles render normally with all entities and effects'
    state_changes:
      - field: 'RuinInterior.fogExplored'
        effect: 'union of previous explored set and current visible set — tiles never revert to unexplored'
      - field: 'RuinInterior.fogDiscovered'
        effect: 'union of previous discovered set and tiles within DISCOVERY_RADIUS of the player that are also in the current visible set — tiles never revert'
    determinism: deterministic

  - id: ruin-wall-blocks-los
    description: >
      RuinWall tiles block line-of-sight in the fog of war system,
      just as CaveWall and CaveBreakableWall do. the blocking wall
      tile itself is visible (you can see the wall face) but nothing
      behind it is revealed. the blocksLOS function must include
      RuinWall in its check.
    inputs:
      - 'FOV computation encounters a RuinWall tile'
    outputs:
      - 'RuinWall tile is included in visible set'
      - 'tiles behind the RuinWall are excluded from visible set'
    state_changes: []
    determinism: deterministic

  - id: per-ruin-fog-state
    description: >
      each RuinInterior has its own fogExplored (Set<string>),
      fogDiscovered (Set<string>), and fogIllumination
      (Map<string, number>) fields, independent of the cave fog
      state and independent of other ruins. when the player enters
      a ruin, the visibility system reads fog state from the
      current ruin interior, not from the cave-level GameState
      fields.
    inputs:
      - 'player enters a specific ruin'
      - 'RuinInterior.fogExplored, fogDiscovered, and fogIllumination on that interior'
    outputs:
      - 'visibility computed using the ruin-specific fog state'
      - 'each ruin maintains separate exploration AND discovery progress'
    state_changes:
      - field: 'RuinInterior.fogExplored'
        effect: 'newly visible tiles added to the specific ruin fog set'
      - field: 'RuinInterior.fogDiscovered'
        effect: 'tiles within DISCOVERY_RADIUS and in LOS added to the specific ruin discovery set'
      - field: 'RuinInterior.fogIllumination'
        effect: 'revery illumination stored per-ruin'
    determinism: deterministic

  - id: ruin-entrance-always-visible
    description: >
      the ruin entrance tile and its immediate neighbors (1 tile
      radius) are always included in the visible set regardless of
      player position, mirroring the cave entrance behavior. this
      ensures the player can always find the exit.
    inputs:
      - 'player is inside a ruin'
      - 'ruin entrance interior position'
    outputs:
      - 'ruin entrance tile and 8 surrounding tiles are force-added to the visible set'
    state_changes: []
    determinism: deterministic

  - id: revery-illumination-in-ruins
    description: >
      revery effects (fire, lightning, earth scan) that add temporary
      illumination work in ruins the same as in caves. the
      addReveryIllumination function writes to the current ruin
      interior fogIllumination map instead of returning early for
      non-cave zones. illuminated tiles are added to the ruin
      fogExplored set, but they are NOT added to fogDiscovered —
      revery illumination cannot fully discover tiles, only player
      proximity can.
    inputs:
      - 'revery cast while in a ruin zone'
      - 'illumination origin, radius, and expiration time'
    outputs:
      - 'tiles within illumination radius with LOS render as visible during effect'
      - 'tiles added to RuinInterior.fogExplored only (not fogDiscovered)'
    state_changes:
      - field: 'RuinInterior.fogIllumination'
        effect: 'illuminated tile keys mapped to expiration timestamps'
      - field: 'RuinInterior.fogExplored'
        effect: 'illuminated tiles permanently added to explored set'
    determinism: deterministic

  - id: renderer-fog-gating-generalized
    description: >
      the renderer uses a generalized fog-of-war check instead of
      the cave-specific inCave boolean. a hasFogOfWar helper returns
      true for both Cave and Ruin zones. the renderer computes
      visibility, ticks illumination expiry, and applies fog dimming
      and unexplored-tile hiding for any zone with fog of war.
    inputs:
      - 'render frame in a zone with fog of war (Cave or Ruin)'
    outputs:
      - 'fog of war rendering applied identically in caves and ruins'
      - 'overworld rendering unaffected'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: multiple-ruin-visits-preserve-state
    description: 'visiting ruin A, leaving, visiting ruin B, then returning to ruin A preserves both partiallyDiscovered and fullyDiscovered tiles from the first visit to ruin A'
    expected: 'each RuinInterior.fogExplored and RuinInterior.fogDiscovered is independent and persists across entry/exit cycles'
  - id: ruin-entrance-always-visible-at-distance
    description: 'even when the player is at the far end of the ruin, the entrance tile and neighbors remain visible so the player can navigate back'
    expected: 'entrance tile and 1-tile-radius neighbors are force-added to visible set every frame'
  - id: revery-illumination-persists-explored
    description: 'tiles revealed by a revery effect in a ruin remain in the explored set (partiallyDiscovered) after the illumination expires, but are NOT promoted to fullyDiscovered'
    expected: 'after illumination timeout, previously illuminated tiles show as partiallyDiscovered (dim) rather than unexplored or fullyDiscovered'
  - id: ruin-wall-corner-narrow-corridor
    description: 'player in a 1-tile-wide corridor between ruin walls sees only the corridor tiles and wall faces, not tiles around corners'
    expected: 'shadowcasting correctly handles narrow ruin corridors without light leaking'
  - id: ruin-fully-discovered-shows-live-entities
    description: 'if a ghost or other entity wanders into a fullyDiscovered ruin tile that is currently out of player LOS, the entity still renders at its current position'
    expected: 'fullyDiscovered tiles render entities live; partiallyDiscovered tiles do not'

failure_conditions:
  - trigger: 'player is in overworld zone'
    expected: 'fog of war system is completely inactive, all tiles render normally'
  - trigger: 'RuinInterior is generated without fogExplored/fogDiscovered/fogIllumination fields'
    expected: 'all three fields initialized to empty Set/Map during ruin interior generation'

verification:
  test_file: src/engine/__tests__/visibility.test.ts
  test_pattern: 'ruin fog'
  command: 'npx vitest run src/engine/__tests__/visibility.test.ts'
