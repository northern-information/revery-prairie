id: iso-viewport-effect-clipping
name: Effect overlays iterate the full visible parallelogram
priority: high
layer: engine
source_files:
  - src/engine/renderer.ts
  - src/engine/projection.ts
  - src/engine/viewportBounds.ts
  - src/engine/__tests__/viewportBounds.test.ts

behaviors:
  - id: viewport-bounds-helper
    description: >
      A shared helper module exposes `getVisibleTileBounds(viewportWidth,
      viewportHeight, margin?)` returning the inclusive-start /
      exclusive-end viewport tile coordinate bounds (`vxStart`, `vxEnd`,
      `vyStart`, `vyEnd`) that effect-overlay passes must iterate to cover
      the entire on-screen tile footprint. The bounds expand to
      `[-viewportHeight, viewportWidth + viewportHeight)` on both axes
      (matching the established main tile loop expansion) plus margin, so
      every tile inside the rotated parallelogram of the visible footprint
      is covered. A companion predicate `isTileInVisibleViewport(vx, vy,
      viewportWidth, viewportHeight, margin?)` returns whether a single
      viewport-coord tile lies inside the same region, for radial passes
      that iterate around an entity center.
    inputs:
      - viewport width and height in tiles
      - optional margin (extra tiles past the visible edge)
    outputs:
      - bounds object covering every on-screen tile
      - predicate result agreeing with the bounds object for the same args
    state_changes: []
    determinism: deterministic

  - id: earth-scan-populate-uses-bounds
    description: >
      The earth-scan background populate pass iterates
      `getVisibleTileBounds(viewportWidth, viewportHeight)` so
      soil-health entries are written for every on-screen tile under the
      scan radius, including corner tiles. Existing `isInBounds`,
      tile-type, and distance checks remain in place.
    inputs:
      - active earth-scan revery effect with origin, expanding/holding/fading phase
      - current camera offset and viewport dimensions
    outputs:
      - earthScanBgMap entries written for every visible tile in scan radius
      - no entries written for off-map, space, or cave-wall tiles
    state_changes:
      - field: earthScanBgMap (renderer-local)
        effect: populated for every visible in-radius tile
    determinism: deterministic

  - id: earth-scan-draw-uses-bounds
    description: >
      The earth-scan background draw pre-pass iterates
      `getVisibleTileBounds(viewportWidth, viewportHeight)` so populated
      entries from the earth-scan map render at every on-screen tile.
    inputs:
      - earthScanBgMap populated by the prior pass
      - viewport dimensions
    outputs:
      - cell background drawn for every populated entry
    state_changes: []
    determinism: deterministic

  - id: lightning-range-highlight-uses-bounds
    description: >
      The lightning targeting range highlight pre-pass iterates
      `getVisibleTileBounds(viewportWidth, viewportHeight)` so the range
      highlight covers every on-screen tile within
      `LIGHTNING_REVERY_RANGE` of the player, including parallelogram
      corners.
    inputs:
      - state.targetingSlot is non-null (lightning targeting active)
      - player position, viewport
    outputs:
      - range-highlight cell background drawn for every visible in-range, non-space tile
    state_changes: []
    determinism: deterministic

  - id: angel-gold-aura-uses-bounds
    description: >
      The angel gold aura pre-pass iterates
      `getVisibleTileBounds(viewportWidth, viewportHeight)` so the gold
      aura covers every on-screen tile within `ANGEL_AURA_RADIUS` of any
      visible angel center, including parallelogram corners. The
      screen-space circular distance computation is preserved.
    inputs:
      - one or more angelAuraCenters present
      - viewport, charWidth/charHeight
    outputs:
      - gold aura cell background drawn for every visible in-radius non-space tile
    state_changes: []
    determinism: time-based

  - id: prairie-halo-uses-bounds
    description: >
      The prairie halo pre-pass iterates `getVisibleTileBounds(viewportWidth,
      viewportHeight, PRAIRIE_HALO_RADIUS)` so the halo footprint covers
      all on-screen space tiles plus a `PRAIRIE_HALO_RADIUS` margin past
      the visible edge. The existing offscreen halo composite pipeline
      is preserved.
    inputs:
      - overworld zone, deep-time not in Burning/Simulating phase
      - viewport
    outputs:
      - halo offscreen canvas populated covering visible space tiles plus margin
    state_changes:
      - field: halo offscreen canvas (renderer-local)
        effect: filled for every visible in-range space tile
    determinism: time-based

  - id: weather-rain-overlay-uses-bounds
    description: >
      The weather rain overlay pass iterates
      `getVisibleTileBounds(viewportWidth, viewportHeight)` so rain
      glyphs render at every on-screen tile inside the rain front,
      including parallelogram corners. Existing `isInRainFront`,
      density, and player tile checks remain in place.
    inputs:
      - state.precipitationIntensity > 0, overworld zone
      - viewport, time
    outputs:
      - rain glyphs drawn at every visible in-front non-player tile passing the density gate
    state_changes: []
    determinism: time-based

  - id: glint-zone-overlay-uses-bounds
    description: >
      The glinting zone sparkle overlay iterates
      `getVisibleTileBounds(viewportWidth, viewportHeight)` so glint
      glyphs render at every on-screen tile in `state.glintZones`,
      including parallelogram corners. Density and opacity gates
      remain in place.
    inputs:
      - overworld zone, populated state.glintZones
      - viewport, time
    outputs:
      - glint glyphs drawn at every visible glint-zone tile passing density and opacity gates
    state_changes: []
    determinism: time-based

  - id: deep-time-burning-overlay-uses-bounds
    description: >
      The deep-time burning overlay iterates
      `getVisibleTileBounds(viewportWidth, viewportHeight)` so fire
      glyphs render at every on-screen burnt-clover tile during the
      deep time Burning phase, including parallelogram corners.
    inputs:
      - state.deepTime active, phase Burning
      - viewport, time
    outputs:
      - fire glyphs drawn at every visible burnt-clover tile passing the density gate
    state_changes: []
    determinism: time-based

  - id: angel-rain-aura-uses-bounds
    description: >
      The angel rain aura overlay (radial pass around the aura center)
      uses `isTileInVisibleViewport(vx, vy, viewportWidth,
      viewportHeight)` so rain glyphs render at every on-screen tile
      inside the aura radius, including parallelogram corners.
      Self-tile and player tile skips remain.
    inputs:
      - one or more rain-Aura ECS entities in the active zone
      - viewport, time
    outputs:
      - rain glyphs drawn at every visible in-radius tile passing density and self/player gates
    state_changes: []
    determinism: time-based

edge_cases:
  - id: small-viewport
    description: Very small viewports (e.g. a 5x5 tile window) still
      cover the entire rotated parallelogram via the helper
    expected: every screen pixel inverted by `screenToTile` resolves to a
      viewport tile inside the helper bounds
  - id: wide-viewport
    description: Very wide viewports (e.g. width >> height) still cover
      the visible footprint, which extends to `viewportWidth +
      viewportHeight` on both axes
    expected: helper bounds match the main tile loop bounds and cover
      all on-screen tiles
  - id: tall-viewport
    description: Very tall viewports (height >> width) still cover the
      visible footprint, including negative `vy` corners introduced by
      the `(vx - vy)` term in `viewportToScreen`
    expected: >-
      `isTileInVisibleViewport` accepts every on-screen tile produced by
      `screenToTile`
  - id: corner-tiles
    description: Tile positions at the four parallelogram corners
      (e.g. viewport top corner at vx ≈ vy ≈ viewportWidth/2 + small
      offsets) must be considered visible by the helper
    expected: >-
      `isTileInVisibleViewport` returns true and `getVisibleTileBounds`
      covers them
  - id: margin-extends-past-edge
    description: Calling the helper with `margin = PRAIRIE_HALO_RADIUS`
      extends both axes outward by that many tiles
    expected: bounds expand symmetrically by `margin`, predicate accepts
      tiles up to `margin` outside the no-margin bounds

failure_conditions:
  - trigger: An effect overlay tile that should render in the visible
      region but is outside a naive `[0, viewportWidth) ×
      [0, viewportHeight)` rectangle is skipped by an iteration-style pass
    expected: tile is included in the helper bounds and rendered (no
      diagonal clipping along the parallelogram edge)
  - trigger: A radial overlay (angel rain aura) tile that lands on a
      corner is rejected by a naive rectangular clip
    expected: >-
      `isTileInVisibleViewport` accepts the tile and the overlay glyph is
      drawn
  - trigger: An effect-overlay pass added in the future iterates a naive
      rectangle directly instead of using the helper
    expected: the helper is documented as the required entry point for
      new effect-overlay passes; reviewers reject direct rectangular
      iteration

verification:
  test_file: src/engine/__tests__/viewportBounds.test.ts
  test_pattern: getVisibleTileBounds|isTileInVisibleViewport
  command: npx vitest run src/engine/__tests__/viewportBounds.test.ts
