id: terrain-generation
name: 'Terrain and soil health generation'
priority: medium
layer: engine
source_files:
  - src/engine/terrain.ts
  - src/engine/constants.ts
  - src/engine/types.ts
dependencies: []

behaviors:
  - id: world-dimensions
    description: >
      MAP_WIDTH and MAP_HEIGHT are both 147. The land area
      (Dirt interior, after subtracting SPACE_BORDER on every edge)
      is 127x127, centered on the grid. Both dimensions are odd so
      a single tile sits at the exact geometric center
      (floor(147/2) = 73), which player-spawn and Gron placement
      depend on. The cave map (CAVE_WIDTH x CAVE_HEIGHT) is unrelated
      and unchanged.
    inputs:
      - 'createGameState invoked'
    outputs:
      - 'Tile[][] sized 147x147'
    state_changes:
      - field: mapWidth
        effect: 'set to 147'
      - field: mapHeight
        effect: 'set to 147'
    determinism: deterministic

  - id: generate-terrain
    description: >
      generateTerrain(width, height) creates a Tile[][] grid.
      Uses one smoothed 1D noise band per edge for coastline
      variation (the space-to-dirt boundary). SPACE_BORDER controls
      base distance from each edge. Tiles inside the border are
      Dirt; tiles outside are Space. Sand is never produced by the
      no-genesis fallback — sand only forms around water during the
      genesis pipeline (see the sand-water-only spec), so the
      offline / test fallback contains only Space and Dirt.
    inputs:
      - 'width, height'
    outputs:
      - 'Tile[][] with Space and Dirt tiles only'
    state_changes: []
    determinism: probabilistic

  - id: smooth-noise
    description: >
      smoothNoiseSeeded(length, amplitude, wavelength, rng) generates
      a 1D array of smoothly interpolated values. values change at
      each wavelength boundary; between boundaries, linearly
      interpolates between previous and next values. amplitude
      controls peak deviation from 0. accepts an rng function for
      deterministic testing.
    inputs:
      - 'length, amplitude, wavelength, rng function'
    outputs:
      - 'number[] of smoothly varying values'
    state_changes: []
    determinism: deterministic

  - id: soil-health-generation
    description: >
      generateSoilHealth(map, width, height) creates a Map<string,
      number> of soil health values for dirt tiles only. combines
      4 smooth noise layers (2 horizontal, 2 vertical) at different
      wavelengths for natural topography. base value is 50, clamped
      to [10, SOIL_HEALTH_MAX]. non-dirt tiles are excluded from
      the map.
    inputs:
      - 'Tile[][] map, dimensions'
    outputs:
      - 'Map<string, number> keyed by posKey'
    state_changes: []
    determinism: probabilistic

edge_cases:
  - id: square-grid-exact-center
    description: 'odd 147x147 dimensions guarantee a single center tile at (73, 73)'
    expected: 'floor(MAP_WIDTH/2) === 73 and floor(MAP_HEIGHT/2) === 73 — required for Gron exact-center placement'
  - id: seeded-noise-determinism
    description: 'smoothNoiseSeeded called with the same rng produces identical output'
    expected: 'output is fully determined by the rng sequence'
  - id: narrow-map
    description: 'map dimensions smaller than SPACE_BORDER * 2'
    expected: 'entire map is Space; no Dirt tiles generated'
  - id: soil-health-only-dirt
    description: 'generateSoilHealth skips non-Dirt tiles'
    expected: 'returned Map has no entries for Space tile positions'

failure_conditions:
  - trigger: 'zero-size map (width or height is 0)'
    expected: 'returns empty array; no crash'
  - trigger: 'generateTerrain produces a Sand tile'
    expected: 'failure — sand only forms around water in genesis, never in the fallback'

verification:
  test_file: src/engine/__tests__/terrain.test.ts
  test_pattern: 'terrain'
  command: npx vitest run src/engine/__tests__/terrain.test.ts
