id: RP-33-little-house-and-emily
name: 'The little house and the girl who waits — Emily (RP-33)'
priority: high
layer: integration
source_files:
  - src/engine/types.ts
  - src/engine/constants.ts
  - src/engine/state.ts
  - src/engine/characters.ts
  - src/engine/house.ts
  - src/engine/zoneTransition.ts
  - src/engine/cave.ts
  - src/engine/celestial.ts
  - src/engine/movement.ts
  - src/engine/camera.ts
  - src/engine/renderer.ts
  - src/engine/render/passes/fireplaceGlow.ts
  - src/engine/interaction.ts
  - src/engine/manual.ts
  - src/engine/revery.ts
  - src/hooks/useGameEngine.ts
  - src/harness/__tests__/serialization/schema.test.ts
dependencies:
  - RP-32-revery-dormancy-pressure
  - RP-4-the-revery
  - RP-9a-torchbearer-voice

# Doctrine reference: docs/backlog.yaml id '33' (lines 1038-1112) and
# docs/backlog-thinktank-v6.md rounds 2 + 6.
#
# v6 round 2 lock: the Revery's opt-in surface is a tile-bound location — a
# little house, open all year, with a girl who invites the steward to Revery
# with her. Confirming her invitation commits dormancyPressure (RP-32)
# to threshold (1.0); the Revery enters on the next frame via the existing
# threshold-trigger path from RP-32. The girl's dialog register matches
# Gron's v4 round 5 locks (statements, no contractions, no editorial affect,
# no opinion of the steward, dispatched by season).
#
# v6 round 6 lock: the girl is named **Emily**. Three touchstones in one
# figure — Dickinson (the game's namesake line), Wyeth Christina's-World,
# Ingalls Little-House frontier.
#
# Out-of-spec for this PR (RP-36 and RP-37 scope, even though they
# are mentioned in the backlog item): Revery Knots from prairie grass; the
# persistent pool of pre-tied Knots in the house; the coyote courier;
# the root cellar bulkhead zone. None of those ship here.
#
# v6 round 2 + 6 doctrinal lock (clarified by user 2026-05-23): the Revery
# scene is the house interior, regardless of where in the world the
# pressure trip occurs. Two paths into the same destination:
#
#   * Confirm-in-house path — player walks to the house, talks to Emily,
#     confirms her autumn invitation. dormancyPressure jumps to 1.0;
#     ReveryPhase.Omen begins on the next frame; the steward is already
#     in the house. At Omen → Observing, the fade covers a within-zone
#     reposition: the steward sprite is moved to the bed, Emily is moved
#     to her chair across the room. The Revery proceeds.
#
#   * Field-summons path — player has not visited Emily this autumn; the
#     pressure ramp from RP-32 reaches 1.0 at the winter solstice
#     frame. The steward collapses in place (overworld); the egregore
#     collapse-tile capture and Gron-teleport from RP-32 fire as
#     normal in the field. At Omen → Observing, the fade-to-black covers
#     a zone swap from Overworld → HouseInterior; the steward sprite is
#     repositioned to the bed, Emily to the chair. The Revery proceeds.
#     At Closing, the RP-32 collapse-tile commit fires on the
#     OVERWORLD tile captured at Omen — the prairie metabolizes the spot
#     the steward fell, even though the Revery itself plays out in the
#     house. The steward remains in the house after Closing.
#
# Out of scope (still): Revery Knots, root cellar, Emily lore, multiplayer.
# In scope now (added per user clarification): the Revery render scene is
# the house interior for the full Observing → Summary → Closing duration,
# regardless of trigger path.
#
# Note on terminology: ReveryPhase.Omen is retained as the first phase of
# the Revery state machine (RP-4 substrate). The Omen *concept* is
# being retired in favor of the Revery Knot (RP-36), but the phase
# name in code remains.
#
# Design decisions locked by the user 2026-05-23 during spec gathering:
#
#   1. House interior is a real zone (sibling to cave). Walking onto the
#      south-wall door tile triggers a zoneTransition.ts swap into the
#      house interior; stepping onto the south-wall HouseExit interior
#      tile triggers the swap back to the overworld. The interior persists
#      simultaneously with the overworld via a state.houseMap pointer pair,
#      mirroring state.caveMap.
#
#   2. Player spawns inside the house at tenure start. The falling-star
#      spawn ceremony (celestial.ts:322-335 forPlayerSpawn block,
#      state.playerSpawn field, PlayerSpawn interface, PLAYER_SPAWN_*
#      constants, STEWARD_STAR_* constants) is removed entirely. All
#      playerSpawn.visible gates in movement.ts, renderer.ts, camera.ts,
#      useGameEngine.ts become unconditional (player always visible from
#      frame 1).
#
#   3. House interior layout is a deterministic 15 × 9 rectangle (HOUSE_WIDTH
#      × HOUSE_HEIGHT in constants.ts). The perimeter is HouseWall; the
#      inner 13 × 7 is HouseFloor. A 3-tile Fireplace stands at row 1
#      (centered on x=7) directly in front of the north wall, with a
#      3-tile HouseHearth row directly south (row 2). HouseBed sits on
#      the east wall at (13, 4); HouseChair sits on the west wall at
#      (1, 4). South wall center is the exit — a 3-wide pink-door
#      opening (TileType.HouseExit at x=6,7,8; y=8) per the existing
#      cave/ruin exit idiom (`#ff69b4` reserved user-action pink —
#      CaveExit and RuinExit already use this color). Warm browns
#      throughout the interior palette; pink exclusively reserved for
#      the door (and any other user-action surfaces).
#
#      Overworld entrance: a single HouseEntrance tile rendered with the
#      Greek lowercase alpha `α` (U+03B1) — complements the cave's
#      omega-shaped entrance glyph. Warm-brown palette for the entrance
#      and apron (distinct from the cave's gray slate and the ruin's
#      verdigris green). Apron is the standard 8-neighbor pattern.
#
#   4. Fireplace tile reuses an existing fire animation. The existing
#      reusable surface is the cycle `['^', '~', '*']` already used by the
#      genesis fire epoch (`src/engine/genesis.ts` fire animation pass).
#      The fireplace tile renderer applies this same cycle, position-
#      deterministic and time-cycling. No new asset.
#
#   5. House overworld entrance is placed west of Gron, symmetric to the
#      cave entrance which sits east of Gron. Placement uses the same
#      ring-around-Gron algorithm as the cave (rainRadius+1 .. rainRadius+4)
#      with an angle constraint biasing west (π/2 .. 3π/2). 8-neighbor
#      HouseApron mirrors the cave apron treatment.
#
#   6. Invitation confirm UX: pressing [f] near Emily opens her dialog
#      through the existing character-dialog flow. The autumn dialog's
#      LAST line is the invitation; while that line is the current line
#      and typing is done, state.activeDialog.awaitingConfirmation = true.
#      Pressing [f] again with awaitingConfirmation set commits — calls
#      contributeDormancyPressure(state, 1.0) and closes the dialog;
#      RP-32's threshold-trigger fires the Revery on the next frame.
#      Pressing [Esc] (or walking out of the house, or any other dialog
#      close path) cancels the prompt without committing — a quiet visit
#      is allowed. The Revery summons sequence from RP-32 runs as
#      normal (Gron teleports, collapse tile commits, etc.); no new
#      summons path is added by this spec.
#
#   7. Emily's dialog is dispatched seasonally (one register per season).
#      Only the autumn register includes the invitation line. The other
#      three registers exist but do not arm awaitingConfirmation. Per
#      CLAUDE.md and feedback_manual_lore_only.md, every Emily dialog line
#      is the placeholder string `TODO: emily {season} line N` — lore is
#      human-authored.
#
#   8. Manual entries are added for Little House (zone-like) and Emily
#      (character) with `{ lore: 'TODO' }` placeholders.
#
#   9. Sidebar tile labels are NOT touched in this PR — the sidebar is
#      being changed in a parallel worktree and any cursor-info entries
#      for the new tile types and Emily will be added in that worktree's
#      successor PR. Keeping the surface narrow here.
#
#  10. Schema test (EXPECTED_FIELDS) is updated: REMOVE playerSpawn; ADD
#      houseMap, houseMapWidth, houseMapHeight, houseEntranceOverworld,
#      houseEntranceInterior, houseBedInterior, houseChairInterior,
#      emilyInvitation, emilyReveryReturn. The activeDialog shape gains
#      optional `awaitingConfirmation?: boolean`.
#
# What this feature does NOT do:
#   - **Does not ship Revery Knots.** That is RP-36's scope. Emily does
#     not give Knots in this PR. The "small persistent pool" mentioned in
#     v6 round 6 is RP-36's substrate.
#   - **Does not ship the root cellar.** That is RP-37's scope. The
#     house interior has no bulkhead in this PR.
#   - **Does not author Emily's lore.** All Emily dialog lines and her
#     manual entry lore field are TODO placeholders.
#   - **Does not change the dormancy-pressure ramp from RP-32.** The
#     ramp continues to carry autumns alone if Emily is never visited.
#     Emily's confirm is an additive, edge-triggered contribution; the
#     pressure-ceiling path remains the safety net at the winter solstice.
#   - **Does not change the existing Revery summons sequence from
#     RP-32.** Gron teleport, collapse tile commit, summonsAudioCue,
#     etc. all fire identically — confirm is just another route to
#     dormancyPressure = 1.0.
#   - **Does not add multiplayer-protocol changes.** House interior is
#     single-player state; multiplayer is unaffected.
#   - **Does not change Gron's spawn position.** Gron still sits at map
#     center. Only the player's start position changes (now inside the
#     house, not adjacent to Gron).
#   - **Does not author the fireplace as a new render pass.** It is a new
#     TileType rendered by the existing tile-rendering pipeline using the
#     same time-cycled glyph approach as cave-wall layered tiles. Reuses
#     the `['^', '~', '*']` cycle.
#
# Engine substrate notes (verified during research):
#   - Zone transitions: src/engine/zoneTransition.ts — registered swap
#     handlers via registerZoneSwapHandler(kind, direction, fn). The kind
#     type is currently `'cave' | 'ruin'` (types.ts:149) and is widened to
#     `'cave' | 'ruin' | 'house'` by this spec.
#   - Cave handlers: src/engine/cave.ts:189 (enterCave), :224 (exitCave),
#     :294 + :297 (handler registrations), :255 (checkTransition) — the
#     pattern this spec mirrors for the house.
#   - Player initial position: src/engine/state.ts:84-85, set to
#     `gronX - 1, gronY`. This spec overrides to the house interior
#     spawn position and sets state.currentZone = Zone.HouseInterior at
#     createGameState time.
#   - Dormancy pressure entry point: src/engine/omen.ts
#     contributeDormancyPressure(state, amount). Confirm calls this with
#     amount = 1.0.
#   - Character dialog dispatch: src/engine/characters.ts:206
#     getCharacterDialog. Extended to dispatch 'emily' to getEmilyDialog.
#   - activeDialog shape: src/engine/types.ts:291-298. Extended with
#     optional `awaitingConfirmation?: boolean`.
#
# Manual cross-references (RP-6 — Naturalist's Manual):
#   - New manual entry "Little House" under a Structures category (or
#     reuse Zones if Structures does not exist).
#   - New manual entry "Emily" under Characters.
#   - Both entries flagged `{ lore: 'TODO' }`.

behaviors:
  - id: house-tile-types
    description: >
      TileType gains EIGHT new variants: HouseEntrance (overworld marker
      on the door tile), HouseApron (overworld 8-neighbor apron of the
      entrance), HouseFloor (interior walkable warm-brown floor),
      HouseWall (interior perimeter wall), HouseBed (interior furniture
      tile, walkable=true during Revery-Observing for the steward only,
      otherwise walkable=false), HouseChair (interior furniture tile,
      walkable=true at all times so Emily's `E` entity glyph can stand on
      top; chair glyph renders beneath Emily via the standard tile-then-
      entity stack), Fireplace (interior furniture tile, walkable=false,
      animated `['^', '~', '*']` cycle), HouseExit (interior door tile
      that triggers exit zone transition). Walkability tables and
      tile-color tables in renderer.ts are updated for each. None of
      these tiles are dirt-eligible (they cannot be egregore candidates).
    inputs:
      - 'TileType enum is read by renderer.ts, movement.ts, sidebar.ts'
    outputs:
      - 'Seven new TileType variants exported from types.ts'
      - 'Renderer color / glyph tables include each new variant'
      - 'Movement.ts walkability table includes each new variant'
    state_changes:
      - field: 'TileType enum'
        effect: 'eight entries appended: HouseEntrance, HouseApron, HouseFloor, HouseWall, HouseBed, HouseChair, Fireplace, HouseExit'
    determinism: deterministic

  - id: house-zone-and-interior
    description: >
      Zone gains a new variant HouseInterior. A new src/engine/house.ts
      module owns the interior. createHouseInterior() generates a 15 × 9
      deterministic map (no RNG): perimeter HouseWall tiles, HouseFloor
      interior, a 3-tile Fireplace at row 1 centered on x=7 (i.e. at
      x=6,7,8; y=1), a 3-tile HouseHearth row directly south at
      x=6,7,8; y=2, one HouseBed at (13, 4) on the east wall, one
      HouseChair at (1, 4) on the west wall, and THREE HouseExit
      tiles along the south wall at (6, 8), (7, 8), (8, 8) — a 3-wide
      pink-door opening following the existing cave/ruin exit idiom
      (color `#ff69b4`, the reserved user-action hot pink). The function
      returns `{ map, width, height, exitInterior, spawnInterior,
      bedInterior, chairInterior }` where `exitInterior = {x: 7, y: 8}`
      (the middle of the 3-wide door — used as the canonical exit-center
      anchor for transition iris animations and the spawn-anchor calc),
      `spawnInterior = {x: 9, y: 2}` (on the hearth row east of the
      fireplace; see player-starts-inside-house for why this opens the
      first-frame tableau toward Emily), `bedInterior = {x: 13, y: 4}`,
      `chairInterior = {x: 1, y: 4}`. GameState gains six new fields:
      `houseMap: Tile[][]`, `houseMapWidth: number`,
      `houseMapHeight: number`, `houseEntranceInterior: Position`
      (= spawnInterior), `houseBedInterior: Position`,
      `houseChairInterior: Position`.
    inputs:
      - 'createGameState invocation'
    outputs:
      - 'state.houseMap is a 15 × 9 grid populated per the layout above'
      - 'state.houseMapWidth = 15, state.houseMapHeight = 9'
      - 'state.houseEntranceInterior = {x: 9, y: 2}'
      - 'state.houseBedInterior = {x: 13, y: 4}'
      - 'state.houseChairInterior = {x: 1, y: 4}'
    state_changes:
      - field: houseMap
        effect: 'initialized to the deterministic interior layout'
      - field: houseMapWidth
        effect: 'set to 15'
      - field: houseMapHeight
        effect: 'set to 9'
      - field: houseEntranceInterior
        effect: 'set to {x: 9, y: 2}'
    determinism: deterministic

  - id: house-overworld-placement
    description: >
      During createGameState, after Gron is placed at map center, a
      HouseEntrance tile is placed west of Gron using the same ring-around
      -Gron algorithm as the cave (Chebyshev distance in
      [rainRadius+1, rainRadius+4]) but with an angle constraint
      π/2 .. 3π/2 to bias placement west of Gron. The 3x3 footprint
      (entrance + 8 apron) must clear ponds, river paths, Space borders,
      and any pre-existing structural tile (CaveEntrance, RuinEntrance,
      RuinApron, RuinWall, RuinDoorLocked, RuinDoorOpen, RuinAqueduct).
      The 8 neighbors are converted to HouseApron, skipping tiles already
      in the structural-preservation set. The chosen position is stored
      in state.houseEntranceOverworld: Position.
    inputs:
      - 'createGameState invocation, after Gron and cave placement'
    outputs:
      - 'overworld map[y][x] = TileType.HouseEntrance at one position west of Gron'
      - 'overworld map[y±1][x±1] = TileType.HouseApron for the 8 neighbors (except preserved tiles)'
      - 'state.houseEntranceOverworld = the chosen Position'
    state_changes:
      - field: map
        effect: 'one HouseEntrance tile + up to 8 HouseApron tiles mutated'
      - field: houseEntranceOverworld
        effect: 'set to the chosen Position'
    determinism: probabilistic
    # Random angle / dist selection within the west-biased ring. Tests
    # use vi.spyOn(Math, 'random') to force deterministic placement.

  - id: player-starts-inside-house
    description: >
      enterHouseAtTenureStart is called unconditionally from
      useGameEngine after createGameState (production and tests alike).
      The player position is set to state.houseEntranceInterior
      (interior coords {x: 9, y: 2}), state.currentZone is set to
      Zone.HouseInterior, and state.map / state.mapWidth /
      state.mapHeight point at the house interior buffers. The
      overworld buffers are retained on state.overworldMap /
      state.overworldMapWidth / state.overworldMapHeight so that
      future zone exits can swap back. Player facing is set to 'left'
      so the steward mirrors Emily across the hearth row at frame 1 —
      the steward stands at (9, 2) on the hearth, Emily stands at her
      chair on the opposite west side of the room, and the player's
      first frame frames the two of them by the fire. Camera centers
      on the player using updateCamera.
    inputs:
      - 'createGameState invocation, after house interior + overworld house entrance placement'
    outputs:
      - 'state.player = {x: 9, y: 2}'
      - 'state.currentZone = Zone.HouseInterior'
      - 'state.map points at state.houseMap'
      - 'state.playerFacing = "left"'
    state_changes:
      - field: player
        effect: 'set to interior spawn position {x: 9, y: 2}'
      - field: currentZone
        effect: 'set to Zone.HouseInterior'
      - field: map / mapWidth / mapHeight
        effect: 'point at the house interior buffers'
      - field: playerFacing
        effect: 'set to "left"'
    determinism: deterministic

  - id: remove-falling-star-spawn
    description: >
      The spring-equinox player-spawn ceremony is removed entirely.
      Deletions:
        - celestial.ts:322-335 — the
          `if (shower.lastFiredAnchorIndex === 0 && state.playerSpawn.triggeredAt === 0)` block.
        - celestial.ts: all references to data.forPlayerSpawn, state.playerSpawn,
          and the stewardImpact branch in the impact-kind dispatch (the
          'stewardImpact' kind is removed from the impact-kind enum).
        - movement.ts:84 — the `if (!state.playerSpawn.visible) return false`
          early return becomes unreachable and is deleted.
        - renderer.ts:1299, 1613, 1720 — `state.playerSpawn.visible`
          guards are removed; the player is always rendered when the
          tile is the player's tile.
        - renderer.ts:655-656 — STEWARD_STAR_HEAD_COLOR /
          STEWARD_STAR_TRAIL_COLORS conditional branches are deleted; the
          regular shooting-star colors are used for all stars.
        - camera.ts:11 — the spawn-related camera lerp block is removed.
        - useGameEngine.ts:79 — the comment referencing
          `playerSpawn.visible === false` is removed.
        - constants.ts — PLAYER_SPAWN_DESCENT_TARGET_MS, STEWARD_STAR_HEAD_COLOR,
          STEWARD_STAR_TRAIL_COLORS are removed.
        - types.ts:905 PlayerSpawn interface — removed entirely.
        - types.ts:378 GameState.playerSpawn field — removed.
        - state.ts:223-228 playerSpawn initialization block — removed.
      Schema test EXPECTED_FIELDS loses 'playerSpawn'.
    inputs:
      - 'createGameState invocation'
      - 'celestial tick at spring equinox'
    outputs:
      - 'no shooting star is spawned at spring equinox with forPlayerSpawn semantics'
      - 'no playerSpawn field exists on GameState'
      - 'player is always visible from frame 1'
    state_changes:
      - field: 'GameState.playerSpawn'
        effect: 'field removed'
      - field: 'TileType-adjacent code paths'
        effect: 'all playerSpawn.visible guards removed; player always rendered'
    determinism: deterministic

  - id: house-zone-transitions
    description: >
      ZoneTransitionKind is widened to `'cave' | 'ruin' | 'house'`.
      house.ts exports enterHouse(state) and exitHouse(state) following
      cave.ts pattern exactly. enterHouse swaps state.map ←
      state.houseMap (and width/height), sets state.currentZone =
      Zone.HouseInterior, sets state.player = state.houseEntranceInterior,
      clears nav state (path, pathWaypoints, pendingAction,
      pendingInteractionTarget, heldDirection, previewFn, facingEntityPos,
      activeDialog, trail), clears movement tweens, deselects all, clears
      unit commands, records discovery 'zone:house'. exitHouse mirrors
      this in reverse — swaps to state.overworldMap, sets
      state.currentZone = Zone.Overworld, places player via
      findSafeExitPosition from the houseEntranceOverworld. Both handlers
      are registered via registerZoneSwapHandler('house', 'enter'|'exit', ...).
      checkTransition in cave.ts is extended (or a sibling checkHouseTransition
      is added and called from checkTransition) to detect:
        - overworld 3x3 hitbox scan for TileType.HouseEntrance →
          scheduleZoneTransition('house', 'enter', irisCenter)
        - house interior: step onto any TileType.HouseExit tile →
          scheduleZoneTransition('house', 'exit', irisCenter)
    inputs:
      - 'player walks onto / off of the HouseEntrance overworld tile or HouseExit interior tile'
      - 'tickZoneTransition reaches midpoint with kind == "house"'
    outputs:
      - 'state.zoneTransition is scheduled with kind="house" and the correct direction'
      - 'at midpoint, the registered handler swaps maps and repositions player'
    state_changes:
      - field: zoneTransition
        effect: 'set by scheduleZoneTransition, cleared by tickZoneTransition'
      - field: map / mapWidth / mapHeight / currentZone / player
        effect: 'swapped by enterHouse / exitHouse at midpoint'
    determinism: deterministic

  - id: emily-character-entity
    description: >
      A new character entry 'emily' is added to CHARACTERS in characters.ts:
        - name: 'Emily'
        - glyph: 'E'
        - glyphColor: '#FFDDA8'   # warm cream against the interior browns
        - dialog: ['...', 'TODO: emily default line']  # static fallback for non-dispatcher callers
      A character entity is spawned at house-interior coordinates
      {x: 14, y: 1} (one tile west of the fireplace at {x: 15, y: 0}) at
      createGameState time, tagged with EntityZone for HouseInterior so it
      only appears when state.currentZone === Zone.HouseInterior. Emily is
      a stationary entity (no AI tick); pressing [f] while adjacent and
      facing her opens her dialog through the standard interaction flow.
    inputs:
      - 'createGameState invocation'
    outputs:
      - 'a character entity with characterId="emily" exists in the world at house-interior {x: 14, y: 1}'
      - 'state.activeDialog can be opened with characterId="emily" via the standard [f] interaction'
    state_changes:
      - field: 'world.entities'
        effect: 'one Emily character entity created at house-interior {x: 14, y: 1}'
    determinism: deterministic

  - id: emily-seasonal-dialog
    description: >
      Four module-level constants EMILY_DIALOG_WINTER, EMILY_DIALOG_SPRING,
      EMILY_DIALOG_SUMMER, EMILY_DIALOG_AUTUMN are added to characters.ts.
      Each is an array of placeholder strings of the form
      `['...', 'TODO: emily {season} line 1', 'TODO: emily {season} line 2']`
      — exact count of lines TBD by the human author but the spec mandates
      at least 2 non-`...` lines per season for the dialog UI to feel
      complete. The AUTUMN array's last element is `'TODO: emily autumn
      invitation'` — this is the invitation line, the only line in any
      register that arms awaitingConfirmation (see emily-invitation-arm
      behavior below). A new dispatcher getEmilyDialog(state) returns the
      array keyed by state.weather.season. getCharacterDialog is extended:
      `if (characterId === 'emily') return getEmilyDialog(state)`. Per
      feedback_manual_lore_only.md, no Emily dialog content is authored
      in this PR.
    inputs:
      - 'getCharacterDialog(state, "emily") is called by the dialog system'
    outputs:
      - 'returns the season-appropriate EMILY_DIALOG_* array'
    state_changes: []
    determinism: deterministic

  - id: emily-invitation-arm
    description: >
      activeDialog gains an optional field `awaitingConfirmation?: boolean`
      (default undefined / false). During the dialog tick (typing + line
      advancement, in the existing dialog flow), when the active dialog is
      Emily's, the season is Autumn, the current line is the LAST line of
      EMILY_DIALOG_AUTUMN, and `typingDone === true`, the field is set to
      true. While awaitingConfirmation is true, ordinary [f] line-advance
      semantics are SUSPENDED — the next [f] press is interpreted as
      "Confirm Revery" (see emily-invitation-confirm) and any
      dialog-close path (Esc, walking out, opening inventory, etc.)
      cancels without committing. awaitingConfirmation is cleared whenever
      activeDialog is set to null.
    inputs:
      - 'dialog tick reaches the last line of EMILY_DIALOG_AUTUMN with typingDone'
      - 'dialog is closed by any path'
    outputs:
      - 'state.activeDialog.awaitingConfirmation is true exactly while the invitation prompt is showing'
    state_changes:
      - field: 'activeDialog.awaitingConfirmation'
        effect: 'set to true when on Emily autumn last line + typingDone; cleared whenever activeDialog is closed'
    determinism: deterministic

  - id: emily-invitation-confirm
    description: >
      When state.activeDialog.awaitingConfirmation === true and the
      interaction system receives an [f] press, the press is consumed by
      the confirm path (NOT by the standard advance-line path). The
      confirm path:
        (1) calls contributeDormancyPressure(state, 1.0) from omen.ts —
            crosses threshold deterministically;
        (2) sets state.emilyInvitation = 'confirmed';
        (3) closes the dialog (state.activeDialog = null).
      On the next frame, the RP-32 threshold-trigger fires
      initiateRevery; the RP-32 summons sequence runs as normal but
      its overworld-tied side effects (Gron-teleport-adjacent-to-steward
      and collapse-tile commit) are no-ops because the steward is in the
      HouseInterior zone — Gron is on the overworld and
      pickAdjacentWalkableTile returns null relative to interior coords
      (RP-32's existing failure_conditions cover this gracefully); the
      collapse-tile capture records an interior HouseFloor tile that fails
      the dirt-eligibility check at Closing and is silently skipped
      (RP-32's existing edge case `collapse-tile-becomes-ineligible`).
      The Revery scene transition behavior (revery-house-scene) then
      moves the steward to the bed at Omen → Observing without a zone
      swap. This is the confirm path: no field collapse, no field
      egregore, just the steward Reverying in the bed Emily offered.
    inputs:
      - '[f] press received while state.activeDialog.awaitingConfirmation === true'
    outputs:
      - 'state.dormancyPressure increased toward 1.0 via contributeDormancyPressure(state, 1.0)'
      - 'state.emilyInvitation = "confirmed"'
      - 'state.activeDialog = null'
      - 'on next frame: state.revery is non-null with summons=true (per RP-32)'
    state_changes:
      - field: dormancyPressure
        effect: 'set to 1.0 via contributeDormancyPressure'
      - field: emilyInvitation
        effect: 'set to "confirmed"'
      - field: activeDialog
        effect: 'set to null'
    determinism: deterministic

  - id: revery-house-scene
    description: >
      Extends src/engine/revery.ts (RP-4 substrate). At the Omen →
      Observing phase transition, the engine ensures the Revery scene is
      the house interior:
        (a) If state.currentZone !== Zone.HouseInterior at the moment of
            the transition (field-summons path), the engine performs an
            *immediate* zone swap to HouseInterior (synchronous, no
            ZONE_TRANSITION_* timing because the existing
            ZONE_TRANSITION_FADE_IN already covers the Omen → Observing
            visual gap per RP-4). The swap: state.map ← state.houseMap
            and the width/height pair; state.currentZone = HouseInterior;
            navigation state cleared (path, pathWaypoints, pendingAction,
            heldDirection, previewFn, facingEntityPos, trail). The
            steward's collapse-tile field captured at Omen
            (state.revery.summonsCollapseTile, per RP-32) is NOT
            mutated by this swap — Closing will still attempt to commit
            it on the overworld map.
        (b) Regardless of trigger path, state.player is repositioned to
            state.houseBedInterior (={x: 28, y: 8}); state.playerFacing
            set to 'left' (so the steward visually rests with their head
            toward the wall).
        (c) The Emily character entity's Position component is mutated
            to state.houseChairInterior (={x: 2, y: 8}); a new state field
            state.emilyReveryReturn: Position | null is set to her prior
            idle position {x: 14, y: 1} so Closing can revert.
        (d) Camera updateCamera runs to recenter on the bed.
      All of (a)-(d) happen within the same frame as the phase transition.
      The renderer reads activated state on the very next frame.
    inputs:
      - 'state.revery.phase transitions from Omen to Observing'
    outputs:
      - 'state.currentZone === Zone.HouseInterior after the transition'
      - 'state.player === state.houseBedInterior'
      - 'Emily entity Position === state.houseChairInterior'
      - 'state.emilyReveryReturn captures her prior idle position'
    state_changes:
      - field: map / mapWidth / mapHeight / currentZone
        effect: 'swapped to house interior if not already there'
      - field: player
        effect: 'set to houseBedInterior'
      - field: playerFacing
        effect: 'set to "left"'
      - field: 'Emily entity Position'
        effect: 'set to houseChairInterior'
      - field: emilyReveryReturn
        effect: 'set to {x: 14, y: 1} (her prior idle position)'
    determinism: deterministic

  - id: revery-house-scene-revert
    description: >
      At Revery Closing (in tickRevery's Closing phase, after the
      RP-32 collapse-tile commit attempt and pressure reset), Emily's
      entity Position is restored to state.emilyReveryReturn (which is
      {x: 14, y: 1} unless mutated by a future backlog item). The steward is
      NOT teleported off the bed — the player stays at houseBedInterior
      and walks where they choose from there. The activeDialog and
      navigation state are already cleared by RP-4's Closing logic.
      state.emilyReveryReturn is set to null after the revert.
    inputs:
      - 'tickRevery processes the Closing phase'
    outputs:
      - 'Emily entity Position === {x: 14, y: 1}'
      - 'state.emilyReveryReturn === null'
      - 'state.player remains at state.houseBedInterior (unchanged)'
    state_changes:
      - field: 'Emily entity Position'
        effect: 'restored to her idle position'
      - field: emilyReveryReturn
        effect: 'set to null'
    determinism: deterministic

  - id: emily-invitation-state-field
    description: >
      GameState gains a new field `emilyInvitation: 'unoffered' | 'offered' |
      'confirmed'`. Initialized to 'unoffered' by createGameState.
      Transitions:
        - 'unoffered' → 'offered' when awaitingConfirmation flips to true
          for the first time in the current autumn (state.weather.season
          === Autumn).
        - 'offered' → 'confirmed' on the confirm path.
        - 'confirmed' → 'unoffered' at the Revery Closing phase (when
          state.revery transitions to null), so Emily can offer again the
          following autumn.
        - 'offered' → 'unoffered' when activeDialog closes without
          confirmation (Esc, zone exit, etc.).
      Persisted through serialization; added to EXPECTED_FIELDS.
    inputs:
      - 'awaitingConfirmation flips to true'
      - 'confirm path runs'
      - 'dialog closes without confirm'
      - 'Revery enters Closing'
    outputs:
      - 'emilyInvitation tracks the current invitation state'
    state_changes:
      - field: emilyInvitation
        effect: 'transitions per the rules above'
    determinism: deterministic

  - id: fireplace-animation
    description: >
      The Fireplace tile is rendered using the existing
      `['^', '~', '*']` glyph cycle. The renderer's tile-glyph resolver
      picks the glyph deterministically from `(time / FIRE_TICK_MS) %
      glyphs.length` where FIRE_TICK_MS is a new constant in constants.ts
      (default value 200ms — fast enough to read as fire, slow enough not
      to flicker). Glyph color cycles between two warm tones (e.g.,
      '#FF8C42' and '#FFD56B') at the same cadence. Fireplace tiles
      occupy the 3-tile row at house-interior y=1, x=6,7,8 and are not
      walkable; the player cannot step onto them.
    inputs:
      - 'renderer asks for the fireplace tile glyph and color at frame time t'
    outputs:
      - 'glyph is one of `^`, `~`, `*` selected by `(t / FIRE_TICK_MS) % 3`'
      - 'color is one of two warm tones selected by the same cadence'
    state_changes: []
    determinism: deterministic

  - id: fireplace-glow-attenuated
    description: >
      The fireplaceGlow render pass draws a radial gradient over each
      Fireplace tile that pulses with the same warm-tone cadence as
      the glyph cycle. Alpha is tuned to read as ambient hearth light,
      not a flashbang — the gradient stops at center=0.2 and
      mid=0.08 (radial position 0.4), tapering to 0 at the edge. This
      is an ~80% reduction from the initial implementation's center=1.0
      / mid=0.4 stops, which appeared visually blinding against the
      interior browns. Tune by adjusting the alpha stops at the two
      gradient.addColorStop calls in src/engine/render/passes/fireplaceGlow.ts.
    inputs:
      - 'render pass runs each frame while at least one Fireplace tile is on screen'
    outputs:
      - 'radial gradient drawn over each Fireplace tile with center alpha 0.2, mid alpha 0.08, edge alpha 0'
    state_changes: []
    determinism: time-based

  - id: manual-entries
    description: >
      Two new manual entries are added to MANUAL_ENTRIES in manual.ts:
        - id: 'little-house', category: 'Zones' (or 'Structures' if that
          category already exists; reuse whichever is canonical), label:
          'Little House', lore: 'TODO'. Discovery: unlocked on
          discoveryKey 'zone:house' (set by enterHouse).
        - id: 'emily', category: 'Characters', label: 'Emily', lore:
          'TODO'. Discovery: unlocked when activeDialog opens with
          characterId='emily' for the first time (recordDiscovery
          'character:emily' fired from the dialog-open path).
      Per CLAUDE.md and feedback_manual_lore_only.md, lore is 'TODO' — not
      authored by the LLM in this PR.
    inputs:
      - 'player enters house for the first time'
      - 'player opens Emily dialog for the first time'
    outputs:
      - 'manual entries become discovered'
    state_changes:
      - field: 'state.discoveries'
        effect: 'gains "zone:house" and "character:emily" entries on first encounter'
    determinism: deterministic

  - id: schema-test-fields
    description: >
      src/harness/__tests__/serialization/schema.test.ts EXPECTED_FIELDS
      is updated:
        - REMOVE: 'playerSpawn'
        - ADD: 'houseMap', 'houseMapWidth', 'houseMapHeight',
               'houseEntranceOverworld', 'houseEntranceInterior',
               'houseBedInterior', 'houseChairInterior',
               'emilyInvitation', 'emilyReveryReturn'
      The activeDialog field shape test is updated to allow optional
      `awaitingConfirmation`. The Zone enum coverage test is updated to
      include 'houseInterior' as a valid currentZone value.
    inputs:
      - 'npm run test:harness'
    outputs:
      - 'EXPECTED_FIELDS matches the new shape; schema test passes'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: emily-out-of-autumn
    description: >
      Player visits Emily and exhausts her dialog during winter, spring,
      or summer.
    expected: >
      The last dialog line is NOT the invitation; awaitingConfirmation is
      never set; emilyInvitation remains 'unoffered'. The dialog closes
      normally on the final [f] press. No dormancy pressure contribution.

  - id: walk-out-during-invitation
    description: >
      Player reaches the awaitingConfirmation prompt during autumn, then
      walks toward the HouseExit instead of pressing [f] to confirm.
    expected: >
      The dialog closes (existing zone-transition close-dialog behavior);
      awaitingConfirmation clears; emilyInvitation reverts to 'unoffered';
      no dormancy contribution. Player exits to the overworld. Re-entering
      the house and re-opening Emily's autumn dialog re-arms the prompt.

  - id: confirm-mid-revery
    description: >
      Pressure has already reached 1.0 via the RP-32 ramp and a Revery
      is already active when the player visits Emily.
    expected: >
      No new Revery is initiated (RP-32 threshold-trigger gates on
      state.revery === null). awaitingConfirmation should not arm during
      an active Revery — the dialog-tick logic gates on
      `state.revery === null && state.weather.season === Autumn` before
      setting awaitingConfirmation. Emily's dialog still plays through
      her autumn register but ends without a confirm prompt.

  - id: revery-closes-mid-conversation
    description: >
      Player is in dialog with Emily when an externally-initiated Revery
      closes (clearing emilyInvitation to 'unoffered' via the close-phase
      rule).
    expected: >
      activeDialog and emilyInvitation both reset cleanly. If the dialog
      was at the autumn last line, awaitingConfirmation is cleared by the
      Revery-Closing path's activeDialog-clear (RP-4 / RP-32
      close-phase normally clears activeDialog).

  - id: re-entry-after-quiet-visit
    description: >
      Player enters house, opens Emily's autumn dialog, reads to the
      invitation line, presses Esc to cancel. Re-enters house later same
      autumn.
    expected: >
      emilyInvitation is back to 'unoffered'; awaitingConfirmation
      re-arms on reaching the last line again. Player can confirm or
      cancel repeatedly; the system has no per-visit lockout.

  - id: field-summons-scene-swap
    description: >
      Player has not visited Emily this autumn. The RP-32 ramp pushes
      dormancyPressure to 1.0 at the winter solstice frame while the
      steward is on the overworld.
    expected: >
      Omen phase fires normally on the overworld (collapse tile captured,
      Gron teleports adjacent, Gron solstice-summons dialog opens). At
      Omen → Observing, revery-house-scene swaps state.currentZone to
      HouseInterior, moves the player to houseBedInterior, moves Emily
      to houseChairInterior. The Observing/Summary/Closing phases play
      out with the house interior as the scene. At Closing, the RP-32
      egregore commit fires on the OVERWORLD tile captured at Omen — a
      dirt-eligible overworld tile near where the steward fell, even
      though the steward is now in the bed. After Closing, the player
      remains in the house at the bed and walks out the door at their
      pace.

  - id: confirm-path-scene-no-swap
    description: >
      Player visits Emily, confirms the invitation. Omen phase fires
      with the steward already in the house.
    expected: >
      The Omen-phase RP-32 side effects degrade gracefully — Gron
      teleport returns null (RP-32 failure_conditions covers this),
      no Gron-summons dialog opens. At Omen → Observing,
      revery-house-scene sees state.currentZone === HouseInterior and
      skips the zone swap; the player is repositioned to houseBedInterior
      from wherever they confirmed (which is within walking distance of
      Emily). Emily moves to her chair. At Closing, the RP-32
      collapse-tile commit attempts the interior HouseFloor tile,
      fails the dirt-eligibility check, and silently skips
      (RP-32's `collapse-tile-becomes-ineligible` edge case). No
      field egregore is committed for this Revery.

  - id: bed-walkability-restored-after-revery
    description: >
      The player Reveried on the bed. The Revery closes. The player
      tries to walk off the bed onto an adjacent HouseFloor tile.
    expected: >
      The bed tile is walkable=false in the default movement table for
      non-Revery contexts. The movement-from-bed case is allowed by an
      exception that permits leaving the bed when state.revery === null
      AND state.player === state.houseBedInterior. The player can step
      off in any cardinal direction onto a walkable neighbor. Once they
      have left, they cannot step back ONTO the bed except via another
      Revery's revery-house-scene transition.

  - id: house-entrance-placement-fails
    description: >
      The west-biased ring around Gron has no valid HouseEntrance candidate
      after 500 attempts (unlikely but possible on degenerate seeds where
      the west half is mostly pond or river).
    expected: >
      Fall back to the same default position the cave uses
      (state.ts:94-style fallback): a deterministic default offset from
      Gron in the west direction. The fallback position is then
      committed regardless of whether the footprint is clean — this is
      the same risk-acceptance pattern the existing cave placement uses
      (state.ts:94 default). Log nothing; the genesis is still valid.

  - id: house-overlaps-cave-aprons
    description: >
      The west-biased house ring algorithm proposes a candidate position
      whose 3x3 footprint overlaps the existing cave apron set placed
      earlier in the same createGameState call.
    expected: >
      The preserve-from-apron-overwrite set (state.ts:133-141) is
      extended to also include CaveApron and CaveEntrance. The candidate
      is rejected by the footprint-clear check and the algorithm retries
      with a new angle/dist.

  - id: serialization-roundtrip
    description: >
      A saved game from before this PR (containing state.playerSpawn) is
      loaded after this PR ships.
    expected: >
      EXPECTED_FIELDS validates the post-PR shape only; a pre-PR save
      load is out of scope. The save format is not stable across
      backlog-item-level changes (consistent with how RP-32 handled new
      fields). No migration logic.

  - id: fireplace-time-zero
    description: >
      The fireplace renderer is called at time = 0 (first frame).
    expected: >
      Glyph resolves to `^` (index 0); color resolves to the first warm
      tone. No NaN or undefined. The cycle ticks normally from frame 2.

failure_conditions:
  - trigger: >
      enterHouse is called when state.houseMap is null/undefined (e.g., a
      test constructs a partial state).
    expected: >
      Defensive guard: enterHouse logs a console.warn and returns early
      without mutating state. Tests can construct partial states without
      crashing.

  - trigger: >
      The Emily character entity is missing from the world (entity was
      not created at genesis, e.g., a snapshot fixture that pre-dates
      this spec).
    expected: >
      Pressing [f] at Emily's expected tile does nothing — the standard
      interaction system's "no entity at facing tile" path. No crash.
      The autumn confirm path cannot fire because the dialog never opens.

  - trigger: >
      contributeDormancyPressure throws (e.g., omen.ts is mocked in a
      test).
    expected: >
      The confirm path catches and the engine surfaces the error via
      the usual error-handling path (per CLAUDE.md "always surface
      errors"). emilyInvitation does NOT advance to 'confirmed' on
      throw. activeDialog is still closed (UX-side cleanup runs in a
      finally).

  - trigger: >
      A second [f] press arrives in the same frame as the confirm — the
      input handler must not double-fire.
    expected: >
      Once awaitingConfirmation is consumed and activeDialog is set to
      null, the next press is interpreted by the standard interaction
      flow (e.g., no entity facing, no-op). No double Revery initiation.

verification:
  test_file: src/engine/__tests__/RP-33-little-house-and-emily.test.ts
  test_pattern: '^RP-33 — the little house and Emily$'
  command: 'npx vitest run src/engine/__tests__/RP-33-little-house-and-emily.test.ts'
