id: item-combining
name: 'Item combining and drag-and-drop recipes'
priority: medium
layer: engine
source_files:
  - src/engine/combine.ts
  - src/engine/recipes.ts
  - src/engine/inventory.ts
  - src/engine/types.ts
dependencies:
  - recipes

behaviors:
  - id: check-combine
    description: >
      checkCombine determines what happens when a dragged item
      overlaps another item in a container grid. builds an
      occupancy grid excluding the dragged item (if same container),
      collects overlapped UIDs. if exactly 1 item overlapped:
      checks findRecipe for the two definition IDs. returns recipe
      result with discovery status, no-recipe, or none (0 or 2+
      overlaps). all items are 1x1 so at most one overlap per cell.
    inputs:
      - 'container, dragged ItemInstance, grid position, source/target container IDs, discoveredRecipes'
    outputs:
      - 'CheckCombineResult: recipe | no-recipe | none'
    state_changes: []
    determinism: deterministic

  - id: combine-from-backpack
    description: >
      combineFromBackpack(state, defIdA, defIdB) is a generic helper
      that runs whatever recipe matches the two given definition IDs.
      looks up the recipe via findRecipe (order-independent). checks
      that both items exist in backpack. validates the standing tile
      is walkable and not sand before consuming items. removes one
      instance of each ingredient from backpack, then executes the
      matched recipe. returns false if any precondition fails (no
      matching recipe, missing ingredients, invalid standing tile).
      contains no recipe-specific logic — used primarily by tests as
      a programmatic combine entry point. production combines flow
      through drag.ts via checkCombine + recipe.execute.
    inputs:
      - 'state, two ingredient definitionIds, player on walkable non-sand tile'
    outputs:
      - 'boolean: true if recipe executed'
    state_changes:
      - field: backpack
        effect: 'one instance of each ingredient removed'
      - field: '*'
        effect: 'whatever the matched recipe.execute mutates'
    determinism: deterministic

edge_cases:
  - id: no-overlap
    description: 'dragged item placed in empty grid cells'
    expected: 'returns { kind: none }'
  - id: standing-on-sand
    description: 'combineFromBackpack called while player stands on sand'
    expected: 'returns false — sand is not a valid standing tile for recipe execution'
  - id: unknown-recipe
    description: 'combineFromBackpack called with two ingredient IDs that do not match any recipe'
    expected: 'returns false; no items consumed'

failure_conditions:
  - trigger: 'combineFromBackpack called without both items present'
    expected: 'returns false; no items consumed'
  - trigger: 'recipe execute fails after items removed'
    expected: 'items already consumed — this is guarded by validating standing tile before removal'

verification:
  test_file: src/engine/__tests__/combine.test.ts
  test_pattern: 'combine'
  command: npx vitest run src/engine/__tests__/combine.test.ts
