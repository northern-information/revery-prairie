id: dev-panel-ruin-spawner
name: 'Dev panel ruin spawner'
status: planned
priority: medium
layer: integration
source_files:
  - src/engine/devPanel.ts
  - src/engine/ruins.ts
  - src/engine/types.ts
  - src/engine/renderer.ts
  - src/components/DevPanel.tsx
dependencies:
  - dev-panel
  - ruin-archetype-distribution
  - ruin-subsidence
  - ruin-dormant-garden
  - ruin-haunted-threshold
  - ruin-resonance

behaviors:
  - id: ruin-preset
    description: >
      a new "Ruin" entry is added to DEV_PRESETS in src/engine/devPanel.ts.
      selecting it from the preset dropdown pre-checks a single virtual
      RuinSpawn entry exposing two editable fields: archetype (select
      with the four RuinArchetype values: subsidence, dormantGarden,
      hauntedThreshold, resonance) and glyph (select with the values
      "random" plus the ten ENTRANCE_GLYPHS — Ω, Δ, Φ, Ψ, Σ, Λ, Θ, Π, Ξ, Γ).
      archetype defaults to subsidence. glyph defaults to "random".
      no other components are auto-checked when the Ruin preset is selected.
    inputs:
      - 'user selects "Ruin" preset from DevPanel preset dropdown'
    outputs:
      - 'RuinSpawn virtual component appears as the only checked entry'
      - 'archetype and glyph dropdowns render with their default values'
    state_changes: []
    determinism: deterministic

  - id: drag-place-ruin
    description: >
      with the Ruin preset active, mousedown on the existing "drag to place"
      button initiates a drag using the same handler as entity presets
      (DevPanel.tsx handleDragStart). during drag, state.devEntityPreview
      shows the entrance glyph at the hovered tile (the user-picked glyph,
      or a stable preview character such as Ω while "random" is selected).
      on mouseup over a valid tile, spawnDevEntity branches on the
      RuinSpawn pseudo-component and calls a new spawnDevRuin helper in
      devPanel.ts that places a RuinEntrance tile at the drop position,
      generates a RuinInterior with the chosen archetype, assigns the
      chosen glyph (or picks one at random from ENTRANCE_GLYPHS when
      "random"), and pushes the interior onto state.ruinInteriors.
    inputs:
      - 'mousedown on drag handle with Ruin preset active'
      - 'mousemove over canvas'
      - 'mouseup over a valid map tile'
    outputs:
      - 'state.map[y][x].type set to TileType.RuinEntrance'
      - 'new RuinInterior appended to state.ruinInteriors'
      - 'overworld renderer shows the chosen glyph at the placed tile'
    state_changes:
      - field: map[drop.y][drop.x].type
        effect: 'set to TileType.RuinEntrance'
      - field: ruinInteriors
        effect: 'new RuinInterior pushed with archetype, glyph, and entranceOverworld matching drop position'
      - field: devEntityPreview
        effect: 'set during drag, cleared on drop or cancel'
    determinism: probabilistic

  - id: glyph-override
    description: >
      RuinInterior gains an optional glyph field of type string. when set,
      the overworld entrance glyph map (renderer.ts _entranceGlyphMap)
      uses interior.glyph instead of getEntranceGlyph(interior.ruinIndex + 1).
      genesis-generated ruins leave glyph undefined and continue to derive
      their glyph from index. only ruins placed via the dev panel (or any
      future caller that opts in) set glyph explicitly.
    inputs:
      - 'renderer rebuilds _entranceGlyphMap each frame'
      - 'interior.glyph is a non-empty string'
    outputs:
      - '_entranceGlyphMap entry for the entrance position uses interior.glyph'
    state_changes:
      - field: ruinInteriors[i].glyph
        effect: 'set at placement time, never mutated afterward'
    determinism: deterministic

  - id: ruin-interior-construction
    description: >
      spawnDevRuin fabricates a minimal CivilizationRuin (position from
      drop, generated name, default radius, age, empty aqueductPaths and
      buildingFootprints) and passes it to generateRuinInterior together
      with the user-picked archetype. ruinIndex is set to the current
      length of state.ruinInteriors at the time of the call. entranceOverworld
      is set to the drop position. the resulting interior is not entered
      automatically — the player must walk onto the entrance tile like any
      other ruin.
    inputs:
      - 'drop position (x, y)'
      - 'chosen archetype'
      - 'chosen glyph (after random resolution)'
    outputs:
      - 'fully constructed RuinInterior with archetype-specific data
        (subsidence | dormantGarden | hauntedThreshold | resonance) populated'
    state_changes:
      - field: ruinInteriors
        effect: 'new entry appended at index = previous length'
    determinism: probabilistic

  - id: drop-validation
    description: >
      before placement, spawnDevRuin validates the drop tile. invalid drops
      are silently rejected — no tile is changed, no interior is generated,
      no preview lingers. invalid conditions are: out-of-bounds, current
      tile type is TileType.Space, current tile type is already
      TileType.RuinEntrance or TileType.CaveEntrance, or the tile has
      water in state.tileWater (ponds and rivers).
    inputs:
      - 'drop position (x, y)'
      - 'state.map, state.tileWater, state.mapWidth, state.mapHeight'
    outputs:
      - 'no state mutation when validation fails'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: random-glyph-collision
    description: 'a randomly chosen glyph happens to match the glyph of an existing ruin or the cave entrance'
    expected: 'placement still succeeds — duplicate glyphs are allowed and acceptable; the renderer simply shows the same character at multiple entrances'
  - id: ruin-zone-spawn
    description: 'user is currently in a ruin or cave zone (state.currentZone !== Overworld) when dragging a Ruin preset'
    expected: 'drag is disabled or the drop is silently rejected — ruins can only be placed on the overworld map'
  - id: drop-on-clover
    description: 'dropping the ruin onto a Clover, BurntClover, Sand, or Dirt tile'
    expected: 'tile is overwritten with RuinEntrance; clover state in state.clover is cleared for that tile if present'
  - id: drop-on-cave-floor
    description: 'while on overworld, drop targets a tile that happens to render as the cave map (impossible in practice, but enforced via the overworld-zone guard)'
    expected: 'drag is rejected at the zone level before tile validation runs'
  - id: rapid-multiple-drops
    description: 'user places several ruins in quick succession'
    expected: 'each drop generates an independent RuinInterior with its own ruinIndex and glyph; no state corruption between drops'
  - id: random-glyph-resolution-timing
    description: 'glyph is "random" — when is the actual glyph chosen?'
    expected: 'random glyph is resolved once at drop time, not during drag preview; the resolved glyph is stored on RuinInterior.glyph'

failure_conditions:
  - trigger: 'drop position is out of map bounds'
    expected: 'no tile change, no interior added, drag cancelled silently'
  - trigger: 'drop tile is TileType.Space'
    expected: 'no tile change, no interior added, drag cancelled silently'
  - trigger: 'drop tile is already TileType.RuinEntrance or TileType.CaveEntrance'
    expected: 'no tile change, no interior added, drag cancelled silently'
  - trigger: 'drop tile has water in state.tileWater'
    expected: 'no tile change, no interior added, drag cancelled silently'
  - trigger: 'current zone is not Overworld at drop time'
    expected: 'no tile change, no interior added, drag cancelled silently'
  - trigger: 'generateRuinInterior throws for the chosen archetype'
    expected: 'error surfaced to console; tile is not modified and ruinInteriors is not mutated'

verification:
  test_file: src/engine/__tests__/devPanelRuinSpawner.test.ts
  test_pattern: 'dev panel ruin spawner'
  command: 'npx vitest run src/engine/__tests__/devPanelRuinSpawner.test.ts'
