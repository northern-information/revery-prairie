id: dialog-box-presentation
name: 'FromSoft-style dialog box presentation'
priority: high
layer: component
source_files:
  - src/components/DialogBox.tsx
  - src/components/GameScreen.tsx
dependencies:
  - dialog-system

behaviors:
  - id: vertically-centered-positioning
    description: >
      dialog box is fixed to the center of the viewport — both
      horizontally and vertically. width is 65% of viewport width
      clamped between 400px and 800px. fixed height (240px) prevents
      size jumping between dialog lines. uses z-30 to render above
      the action bar (z-10) but below the drag cursor (z-50).
    inputs:
      - 'activeDialog is non-null'
    outputs:
      - 'dialog box rendered at center of viewport'
      - 'dialog box renders above the action bar'
    state_changes: []
    determinism: deterministic

  - id: minimal-chrome
    description: >
      dialog box has no visible border and no close button. background
      is semi-transparent black (bg-black/85). the portrait (if present)
      renders centered above the text in a stacked layout (flex-col).
      character name renders above the dialog text in the existing
      lowercase style. advance button uses TextButton component from
      PanelPrimitives, centered at bottom of dialog box. shows
      'n[e]xt' or 'clos[e]' text.
    inputs:
      - 'activeDialog is non-null'
    outputs:
      - 'dialog box with stacked portrait layout and TextButton advance control'
    state_changes: []
    determinism: deterministic

  - id: angel-dialog-preserved
    description: >
      angel dialog retains the HashGrid rendering within the new
      box layout. the 8x8 hash grid displays inside the same
      wide-short bottom-center box. no behavioral changes to
      angel dialog — only the container shape and position change.
    inputs:
      - 'activeDialog with angel character'
    outputs:
      - 'HashGrid rendered inside the fromsoft-style box'
    state_changes: []
    determinism: deterministic

  - id: props-simplified
    description: >
      DialogBox props: characterName, portrait, line, typingIndex,
      typingDone, isAngel, isLastLine (optional), onAdvance (optional).
      position props (top, left) were removed — the component is
      fixed-positioned via CSS. onAdvance callback drives the
      TextButton advance control. isLastLine toggles button text
      between 'n[e]xt' and 'clos[e]'.
    inputs:
      - 'DialogBox rendered by GameScreen'
    outputs:
      - 'component renders with current prop interface'
    state_changes: []
    determinism: deterministic

  - id: gamescreen-positioning-cleanup
    description: >
      GameScreen no longer computes character-relative dialog
      position. the character entity position lookup, GAP/EDGE
      constants, and top/left clamping logic are removed. the
      DIALOG_WIDTH and DIALOG_HEIGHT exports from DialogBox are
      removed. GameScreen passes only the retained props to
      DialogBox.
    inputs:
      - 'activeDialog is non-null in GameScreen render'
    outputs:
      - 'DialogBox rendered without position props'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: narrow-viewport
    description: 'viewport narrower than 400px minimum width'
    expected: 'dialog box clamps to 400px min-width, may overflow slightly but remains centered'
  - id: very-long-line
    description: 'dialog line exceeds the visible area of the short box'
    expected: 'text overflows hidden — lines should be authored to fit, but overflow is clipped not scrolled'
  - id: portrait-and-angel
    description: 'angel character with a portrait defined'
    expected: 'portrait renders centered above the HashGrid in a stacked layout'
  - id: no-portrait
    description: 'character without a portrait (e.g. ghosts)'
    expected: 'text area takes full width, no empty space on the left'

failure_conditions:
  - trigger: 'DialogBox rendered with no activeDialog (should never happen)'
    expected: 'component is not rendered — conditional in GameScreen prevents it'
  - trigger: 'player clicks on the dialog box area'
    expected: 'no interactive response — dialog has no click handlers for progression'
  - trigger: 'dialog box and action bar both visible'
    expected: 'dialog box renders above the action bar — z-30 vs z-10'

verification:
  test_file: src/harness/__tests__/boot/components.test.tsx
  test_pattern: 'DialogBox'
  command: npx vitest run src/harness/__tests__/boot/components.test.tsx
