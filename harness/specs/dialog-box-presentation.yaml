id: dialog-box-presentation
name: 'FromSoft-style dialog box presentation'
priority: high
layer: component
source_files:
  - src/components/DialogBox.tsx
  - src/components/GameScreen.tsx
dependencies:
  - dialog-system

behaviors:
  - id: vertically-centered-positioning
    description: >
      dialog box is fixed at vertical center of the viewport and
      horizontally centered in the full viewport — implemented via
      `left-0 right-0 mx-auto` plus a width of 65vw clamped by
      `max-w-[min(800px,calc(100vw-1rem))]`. no min-width is applied;
      on viewports narrower than the max-width the dialog shrinks to
      fit without overflowing. fixed height (240px) prevents size
      jumping between dialog lines. uses z-30 to render above the
      action bar (z-10) but below the drag cursor (z-50).
    inputs:
      - 'activeDialog is non-null'
    outputs:
      - 'dialog box rendered vertically centered, horizontally centered in the full viewport'
      - 'dialog box renders above the action bar'
    state_changes: []
    determinism: deterministic

  - id: minimal-chrome
    description: >
      dialog box has no visible border and no close button. background
      is semi-transparent black (bg-black/85). character name renders
      above the dialog text in the existing lowercase style. advance
      button uses TextButton component from PanelPrimitives, centered
      at bottom of dialog box. shows '[F] Next' or '[F] Close' text.
      no character has an animated portrait — the dialog box renders a
      single visual register for every speaker.
    inputs:
      - 'activeDialog is non-null'
    outputs:
      - 'dialog box with stacked flex-col layout (header, body, advance) and TextButton advance control'
    state_changes: []
    determinism: deterministic

  - id: permacomputer-serif-body
    description: >
      The character dialog body text renders in the project serif
      stack (--font-serif, Libre Baskerville) at the permacomputer
      color token (--color-permacomputer / text-permacomputer,
      #8b7355) — the same color as the "Permacomputer online" status
      footer. The spoken line is rendered at text-lg (larger than the
      surrounding xs chrome) and centered horizontally. The
      character-name header and advance button keep their existing
      styles — only the spoken line itself uses the
      permacomputer-serif treatment. The body sits on the same
      semi-transparent black background as before and remains within
      the existing fixed-size dialog container; no layout or sizing
      changes to the outer box. Locked-gate dialog ("The gate is
      locked.") uses the same treatment since it routes through the
      same DialogBox component.
    inputs:
      - 'activeDialog is non-null with a character or gate speaker'
    outputs:
      - 'dialog body text rendered in Libre Baskerville serif at text-permacomputer, text-lg, text-center'
    state_changes: []
    determinism: deterministic

  - id: props-simplified
    description: >
      DialogBox props: characterName, line, typingIndex,
      typingDone, isLastLine (optional), onAdvance (optional).
      position props (top, left) were removed — the component is
      fixed-positioned via CSS. The isAngel prop was removed when
      cantos were dropped (see angels:angel-no-interaction); angels
      no longer open dialog so the HashGrid branch is gone. onAdvance
      callback drives the TextButton advance control. isLastLine
      toggles button text between '[F] Next' and '[F] Close'.
    inputs:
      - 'DialogBox rendered by GameScreen'
    outputs:
      - 'component renders with current prop interface'
    state_changes: []
    determinism: deterministic

  - id: gamescreen-positioning-cleanup
    description: >
      GameScreen no longer computes character-relative dialog
      position. the character entity position lookup, GAP/EDGE
      constants, and top/left clamping logic are removed. the
      DIALOG_WIDTH and DIALOG_HEIGHT exports from DialogBox are
      removed. GameScreen passes only the retained props to
      DialogBox.
    inputs:
      - 'activeDialog is non-null in GameScreen render'
    outputs:
      - 'DialogBox rendered without position props'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: narrow-viewport
    description: 'viewport narrower than the dialog max-width'
    expected: 'dialog box shrinks to fit the viewport (max-width clamp), no min-width is applied; remains horizontally centered'
  - id: very-long-line
    description: 'dialog line exceeds the visible area of the short box'
    expected: 'text overflows hidden — lines should be authored to fit, but overflow is clipped not scrolled'

failure_conditions:
  - trigger: 'DialogBox rendered with no activeDialog (should never happen)'
    expected: 'component is not rendered — conditional in GameScreen prevents it'
  - trigger: 'player clicks on the dialog box area'
    expected: 'no interactive response — dialog has no click handlers for progression'
  - trigger: 'dialog box and action bar both visible'
    expected: 'dialog box renders above the action bar — z-30 vs z-10'

verification:
  test_file: src/harness/__tests__/boot/components.test.tsx
  test_pattern: 'DialogBox'
  command: npx vitest run src/harness/__tests__/boot/components.test.tsx
