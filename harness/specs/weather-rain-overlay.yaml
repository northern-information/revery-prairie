id: weather-rain-overlay
name: 'Weather rain overlay'
priority: medium
layer: engine
source_files:
  - src/engine/renderer.ts
  - src/engine/effects.ts
  - src/engine/types.ts
  - src/engine/tileWater.ts
  - src/engine/constants.ts
dependencies:
  - weather
  - renderer

behaviors:
  - id: viewport-rain-overlay
    description: >
      when state.rainIntensity > 0 and currentZone is overworld, the
      renderer draws animated rain characters within the rain front
      band. uses the same RAIN_CHARS, RAIN_COLORS, RAIN_SPEED, and
      tileHash-based animation as Gron's rain aura overlay. density is
      sparser than the aura rain — WEATHER_RAIN_DENSITY (5, meaning ~1
      in 5 tiles) to avoid overwhelming the screen. rain drops are
      drawn after all tile and entity rendering but before the cursor
      highlight pass. skips the player tile and any tile already
      covered by a rain aura or revery rain effect. rain alpha is
      modulated by state.rainIntensity (0.0-1.0) so rain fades in and
      out gradually rather than appearing/disappearing instantly.
    inputs:
      - 'state.rainIntensity > 0'
      - 'state.currentZone is overworld'
    outputs:
      - 'animated rain characters rendered with alpha = rainIntensity'
    state_changes: []
    determinism: deterministic

  - id: rain-front-blotchy-edges
    description: >
      the rain front band has irregular, organic edges instead of
      straight lines. a fringe zone of RAIN_FRONT_FRINGE tiles (8) on
      each edge of the front uses tileHash noise to probabilistically
      include or exclude tiles. tiles at the outer fringe boundary have
      low inclusion probability, tiles near the core have high
      probability. the noise function is deterministic per tile
      position so the blotchy pattern is stable frame-to-frame. the
      same isInRainFront function is used by both the renderer and
      tileWater so visual rain and hydration stay in sync.
    inputs:
      - 'tile position within RAIN_FRONT_FRINGE tiles of front edge'
    outputs:
      - 'tile probabilistically included or excluded based on tileHash noise'
    state_changes: []
    determinism: deterministic

  - id: rain-front-edge-alpha-falloff
    description: >
      tiles within the fringe zone are rendered with reduced alpha
      proportional to their distance from the front core. tiles at the
      outer edge of the fringe have lower alpha, tiles near the core
      have full alpha. this alpha is multiplied with state.rainIntensity
      so both effects compose. creates a visual thinning of rain at the
      front's edges.
    inputs:
      - 'tile in fringe zone of rain front'
    outputs:
      - 'rain character rendered with reduced globalAlpha'
    state_changes: []
    determinism: deterministic

  - id: rain-overlay-suppressed-in-cave
    description: >
      when currentZone is cave, no weather rain overlay is drawn
      regardless of weather state. the cave is underground.
    inputs:
      - 'state.currentZone is cave'
    outputs:
      - 'no rain overlay rendered'
    state_changes: []
    determinism: deterministic

  - id: rain-overlay-during-deep-time
    description: >
      during the deep time simulation, weather continues to tick. when
      simulated weather produces rain, the rain overlay renders
      normally across the viewport, creating visible rain cycles
      across centuries.
    inputs:
      - 'deepTime.active is true and deepTime.phase is simulating'
      - 'weather.sky is rain'
    outputs:
      - 'rain overlay visible during rainy periods of the simulation'
    state_changes: []
    determinism: deterministic

  - id: rain-front-cursor-effect
    description: >
      getTileEffects in effects.ts checks if the queried tile position
      is within the active rain front band when weather.sky is Rain and
      currentZone is overworld. replicates the renderer's rain front
      axis/sign/position calculation using state.weather.windDirection,
      state.rainFrontOffset, and state.overworldMapWidth/Height. if the
      tile falls within RAIN_FRONT_WIDTH of the front position, "rain"
      is included in the returned effects array.
    inputs:
      - 'getTileEffects called with a tile in the rain front band'
      - 'state.weather.sky is Rain'
      - 'state.currentZone is overworld'
    outputs:
      - 'effects array includes "rain"'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: rain-does-not-overlap-aura
    description: 'tiles already receiving rain from a character aura or revery cast do not get double rain rendering'
    expected: 'weather rain skips tiles covered by aura or revery rain'
  - id: rain-fades-when-weather-clears
    description: 'when weather transitions from rain to cloudy or sun, rain intensity ramps down gradually over RAIN_FADE_DURATION_MS'
    expected: 'rain characters fade out over several seconds, not instantly'
  - id: rain-at-all-zoom-levels
    description: 'rain overlay renders correctly at different zoom levels'
    expected: 'rain characters scale with tile size like all other overlay effects'
  - id: fringe-noise-is-stable
    description: 'the blotchy edge pattern does not flicker between frames because tileHash is deterministic per position'
    expected: 'same tiles are included/excluded on consecutive frames for the same front position'
  - id: rain-intensity-clamps
    description: 'rainIntensity never exceeds 1.0 or drops below 0.0'
    expected: 'clamped to [0.0, 1.0] after every tick'

failure_conditions:
  - trigger: 'weather.sky is undefined or invalid'
    expected: 'no rain overlay rendered, no crash'

verification:
  test_file: src/engine/__tests__/weatherRainOverlay.test.ts
  test_pattern: 'weather rain overlay'
  command: 'npx vitest run src/engine/__tests__/weatherRainOverlay.test.ts'
