id: dev-panel-z-index
name: Dev Panel Stacking Order
priority: low
layer: component
source_files:
  - src/components/DevPanel.tsx
behaviors:
  - id: dev-panel-renders-above-all-ui
    description: When the dev panel is visible, it renders above every other UI layer including the event log, action bar, command panel, dialog box, credits modal, and drag cursor preview. Nothing in the on-screen UI occludes the dev panel while it is open.
    inputs:
      - dev panel is mounted (devMode enabled and devPanelOpen true)
    outputs:
      - dev panel root element has a z-index higher than every other fixed-position UI layer in the application
    state_changes: []
    determinism: deterministic
edge_cases:
  - id: event-log-overlap
    description: Event log toasts appear at the bottom-left while the dev panel is open
    expected: Dev panel renders above the event log, so any overlap area shows the dev panel content rather than the event log
  - id: dialog-open
    description: A character dialog box is open while the dev panel is toggled
    expected: Dev panel renders above the dialog box
  - id: drag-in-progress
    description: An item is being dragged (DragCursor visible) while the dev panel is open
    expected: Dev panel renders above the drag cursor preview
failure_conditions:
  - trigger: Dev panel z-index is less than or equal to any other UI layer's z-index
    expected: Test fails because the dev panel could be occluded by another layer
verification:
  test_file: src/components/__tests__/DevPanel.test.tsx
  test_pattern: 'DevPanel'
  command: 'npx vitest run src/components/__tests__/DevPanel.test.tsx'
