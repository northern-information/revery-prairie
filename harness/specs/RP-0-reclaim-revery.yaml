id: RP-0-reclaim-revery
name: 'RP-0 — Reclaim Revery'
priority: high
layer: integration
source_files:
  - docs/backlog-thinktank-v3.md
  - docs/backlog.yaml
  - CLAUDE.md
  - src/engine/state.ts
  - src/engine/types.ts
  - src/engine/characters.ts
  - src/engine/interaction.ts
  - src/engine/manual.ts
  - src/engine/effects.ts
  - src/engine/renderer.ts
  - src/engine/gameLoop.ts
  - src/engine/deepTime.ts
  - src/engine/drag.ts
  - src/engine/devPanel.ts
  - src/engine/movement.ts
  - src/engine/ecs/types.ts
  - src/engine/render/passes/index.ts
  - src/components/GameScreen.tsx
  - src/components/PermacomputerShell.tsx
  - src/hooks/useKeyboard.ts
  - src/hooks/useInventoryDrag.ts
  - src/hooks/useMouse.ts
  - src/harness/__tests__/serialization/schema.test.ts
dependencies: []

behaviors:
  - id: revery-registry-removed
    description: >
      The src/engine/reveries.ts module is deleted. There is no
      REVERIES const, no ReveryDefinition type, no
      getReveryDefinition function, and no reveries-related
      exports anywhere in the engine. All imports of
      './reveries' / '@/engine/reveries' are removed.
    inputs:
      - 'codebase after RP-0 lands'
    outputs:
      - 'src/engine/reveries.ts does not exist'
      - 'grep for "from .*reveries" in src/ returns zero results'
    state_changes: []
    determinism: deterministic

  - id: action-bar-deleted
    description: >
      The action bar is deleted entirely — engine module, UI
      component, React panel, type, GameState field, keybinds,
      and drag-target. src/engine/actionBar.ts and
      src/components/ActionBar.tsx and src/components/ReveriesPanel.tsx
      are removed. ActionBarSlot interface in src/engine/types.ts
      is removed. The state.actionBar field on GameState is
      removed. GameScreen.tsx no longer renders ActionBar or
      ReveriesPanel. The 1/2/3/4 number-row keybinds in
      useKeyboard.ts are removed (no action bar slot activation).
      useInventoryDrag.ts no longer treats action-bar slots as
      drop targets; dragState.actionBarTarget is removed from the
      drag state shape.
    inputs:
      - 'codebase after RP-0 lands'
    outputs:
      - 'src/engine/actionBar.ts does not exist'
      - 'src/components/ActionBar.tsx does not exist'
      - 'src/components/ReveriesPanel.tsx does not exist'
      - 'grep for "ActionBarSlot\\|actionBar" in src/ returns zero hits outside deleted-file removal noise'
      - "pressing '1', '2', '3', or '4' on the keyboard has no game effect"
    state_changes:
      - field: GameState.actionBar
        effect: 'removed from the GameState shape and from createGameState'
      - field: GameState.reveries
        effect: 'removed from the GameState shape and from createGameState'
    determinism: deterministic

  - id: starting-reveries-removed
    description: >
      createGameState no longer pushes any starting reveries
      ('earth', 'lightning', 'water', 'deep-time') and no
      longer calls autoAssignRevery. New games start with no
      action bar, no revery list, and no cast capabilities.
    inputs:
      - 'createGameState invocation'
    outputs:
      - 'state has no reveries field'
      - 'state has no actionBar field'
    state_changes: []
    determinism: deterministic

  - id: moab-gift-removed
    description: >
      Moab Coldë's character definition no longer carries a
      gift field. The fire revery gift is removed. Moab's
      postGiftDialog is also removed, since there is no
      gift event to switch on. Moab's normal dialog plays in
      all interactions. Moab is re-anchored in RP-9
      (Controlled Burn).
    inputs:
      - 'player talks to Moab'
    outputs:
      - 'no item, revery, or pickup bloom is granted'
      - "Moab's dialog array plays end-to-end"
    state_changes:
      - field: giftsReceived
        effect: 'unchanged — no entry added for moab'
      - field: reveries
        effect: 'field no longer exists'
    determinism: deterministic

  - id: gron-postgift-removed
    description: >
      Gron's character definition no longer carries a postGift
      field. The deep-time revery postGift is removed. Gron's
      dialog still advances through the main quest phases via
      mainQuestPhase, but no revery is granted at any point.
      Deep time is reintroduced as a player-facing trigger in
      RP-4 (the long-form Revery). The deepTime.ts
      simulation kernel is preserved — only the player-facing
      cast wiring is removed.
    inputs:
      - 'player completes the Gron quest line'
    outputs:
      - 'no revery is granted'
      - 'state.deepTime is not initiated by talking to Gron'
    state_changes:
      - field: giftsReceived
        effect: 'unchanged at Gron postGift step'
    determinism: deterministic

  - id: gift-mechanism-simplified
    description: >
      The giveCharacterGift and givePostGift functions in
      interaction.ts no longer reference reveries. Since
      no character currently has a non-revery gift after RP-0,
      both functions return null for all known characters and
      do not mutate state.reveries (which no longer exists).
      The gift mechanism itself is retained on
      CharacterDefinition (gift/postGift fields remain on the
      type) so later features (e.g. RP-5 Ruin recovery seed
      gifts) can use them. The 'revery' branch is replaced
      with a placeholder no-op or removed entirely — implementation
      detail of the plan.
    inputs:
      - 'giveCharacterGift or givePostGift called for any known character'
    outputs:
      - 'returns null (no gift granted)'
      - 'no state mutation related to reveries (the field is gone)'
    state_changes: []
    determinism: deterministic

  - id: simulation-kernels-preserved
    description: >
      The simulation kernels for lightning strikes, deep time,
      and wildfire spread remain intact, because RP-4
      (Revery) and #9 (Controlled Burn) will reuse them.
      Specifically — state.lightning (ambient strike scheduling),
      state.deepTime (deep time runtime state), state.deepTimeTransition,
      lightning.ts (ambient strikes + wildfire spread), and
      deepTime.ts (deep time phase simulation) are not deleted
      in RP-0. Only the player-cast entry points
      (applyReveryCastEffects, castLightningAtTarget,
      activateActionBarSlot, isValidLightningTarget,
      getTargetingPreview, autoAssignRevery, assignActionBarSlot,
      clearActionBarSlot, getActionBarPreview,
      getSlotCooldownFraction, getFacingTile) are removed
      along with actionBar.ts.
    inputs:
      - 'codebase after RP-0 lands'
    outputs:
      - 'src/engine/lightning.ts exists; ambient lightning strikes still occur'
      - 'src/engine/deepTime.ts exists; updateDeepTime and DeepTimePhase exports are preserved'
      - 'state.lightning, state.deepTime, state.deepTimeTransition still appear in GameState'
    state_changes: []
    determinism: deterministic

  - id: schema-allowlist-updated
    description: >
      src/harness/__tests__/serialization/schema.test.ts has
      reveries and actionBar removed from its EXPECTED_FIELDS
      allowlist. The serialization schema test continues to
      pass.
    inputs:
      - 'serialization schema test run'
    outputs:
      - 'test passes'
    state_changes: []
    determinism: deterministic

  - id: v3-doctrine-aligned
    description: >
      docs/backlog-thinktank-v3.md is updated to reflect that
      RP-0 deletes the action bar entirely (not just its
      contents). The "slot scaffold retained" line is
      removed. The Vocabulary bullet about the action bar
      holding tools/seeds/practices is rewritten to say that
      a practices surface will be reintroduced when there is
      actually something to hold. The sequence row for RP-0 is
      updated to reflect M-size scope. docs/backlog.yaml
      flips feature 0 to in-progress with spec/plan links.
    inputs:
      - 'codebase after RP-0 lands'
    outputs:
      - 'docs/backlog-thinktank-v3.md contains no claim that the action bar is retained in RP-0'
      - 'docs/backlog.yaml has feature 0 marked in-progress (during PR) or shipped (after merge), with spec/plan/pr fields populated'
    state_changes: []
    determinism: deterministic

  - id: cast-effect-side-systems-removed
    description: >
      Player-cast visual side effects that exist solely to
      service the four cast reveries are removed. This
      includes the fire-revery cast flash, the water-revery
      rain aura tied to a cast, the earth-revery scan halo,
      and the lightning targeting reticle and cast cooldown
      flash on the action bar. Renderer code paths gated on
      these systems are removed. The wildfire spread
      simulation (a side effect that survives the cast) is
      preserved as a sim kernel for #9.
    inputs:
      - 'codebase after RP-0 lands'
    outputs:
      - 'no targeting reticle is drawn'
      - 'no cast cooldown flash is drawn'
      - 'no earth scan halo is drawn'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: existing-saves-not-supported
    description: >
      No save migration is required. There are no production
      saves at RP-0. Any old localStorage data with
      reveries/actionBar fields is allowed to break or be
      ignored — no migration code is added.
    expected: >
      No migration logic; createGameState produces clean
      state from a fresh genesis.
  - id: harness-specs-touching-removed-systems
    description: >
      Harness specs whose entire subject is the deleted
      systems must be removed: starting-lightning-revery.yaml,
      lightning-revery.yaml, action-bar.yaml,
      starting-reveries.yaml, water-revery-aura.yaml,
      lightning-targeting-visuals.yaml,
      pink-cooldown-cast-flash.yaml,
      earth-scan-zorder.yaml. Their matching plans under
      harness/plans/ are also removed.
    expected: >
      None of these spec or plan files exist after RP-0.
      npm run spec:validate passes.
  - id: harness-specs-with-incidental-references
    description: >
      Harness specs that reference action-bar or reveries
      incidentally (e.g. moab-colde.yaml, wildfire-spread.yaml,
      deep-time-endgame.yaml, lightning-strikes.yaml,
      minimap.yaml, cross-zone-entity-bleed.yaml,
      tile-water.yaml, ruin-locked-door.yaml, dialog-system.yaml,
      manual-id-namespace.yaml, permacomputer-tab-visibility.yaml,
      auto-hide-panels.yaml, universal-pickup-bloom.yaml,
      genesis-playback-bugs.yaml, isometric-projection.yaml,
      cave-fog-of-war.yaml, rts-unit-selection.yaml,
      event-log-overlay.yaml, genesis-transition.yaml) are
      edited to remove those references. The spec's other
      behaviors remain intact.
    expected: >
      npm run spec:validate passes; no spec references a
      deleted symbol.
  - id: tests-touching-removed-systems
    description: >
      Tests whose entire subject is the deleted systems are
      removed: actionBar.test.ts, reveries.test.ts,
      lightningRevery.test.ts, lightningTargeting.test.ts.
      The ActionBar.test.tsx component test is removed.
      Tests that reference the deleted systems incidentally
      (state.test.ts, moab-colde.test.ts, gronDeepTime.test.ts,
      gron-gift.test.ts, wildfire.test.ts, DragCursor.test.tsx,
      useKeyboard.test.ts, useInventoryDrag.test.ts,
      PermacomputerShell.test.tsx, pickupBloom.test.ts,
      ruin-locked-door.test.ts, zoneIsolation.test.ts) have
      those specific assertions removed or rewritten to
      target what remains.
    expected: >
      npm run test passes with all referenced tests either
      deleted or trimmed.
  - id: typecheck-clean
    description: >
      With state.reveries and state.actionBar removed from
      the GameState type, every site that read those fields
      is also removed. The build does not error on dangling
      references.
    expected: >
      npm run typecheck passes.

failure_conditions:
  - trigger: 'A grep for "REVERIES\\b\\|state\\.reveries\\|state\\.actionBar\\|ActionBarSlot\\|ReveriesPanel\\|applyReveryCastEffects" in src/ returns any non-test, non-deleted-file results'
    expected: 'CI fails — RP-0 is incomplete'
  - trigger: 'Pressing 1, 2, 3, or 4 during gameplay activates an action bar slot'
    expected: 'CI fails — the keybind handler still routes to the deleted system'
  - trigger: 'A new game grants the player any revery (earth, lightning, water, fire, deep-time) at start or via Moab/Gron dialog'
    expected: 'CI fails — gift wiring still references reveries'
  - trigger: 'src/engine/lightning.ts or src/engine/deepTime.ts is deleted, or state.lightning / state.deepTime is removed from GameState'
    expected: 'CI fails — simulation kernels must survive for RP-4/#9'
  - trigger: 'npm run spec:validate exits non-zero'
    expected: 'CI fails — spec or plan files reference deleted symbols'

verification:
  test_file: src/engine/__tests__/state.test.ts
  test_pattern: 'createGameState'
  command: 'npx vitest run src/engine/__tests__/state.test.ts -t createGameState'
