id: RP-6-naturalists-manual
name: "RP-6 — Naturalist's manual: scan-to-discover flora + gel-band sequence"
priority: medium
layer: integration
source_files:
  - docs/backlog-thinktank-v3.md
  - docs/backlog.yaml
  - docs/claude/manual.md
  - docs/claude/genetics.md
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/manual.ts
  - src/engine/position.ts
  - src/engine/scan.ts
  - src/engine/flora/species.ts
  - src/components/GameScreen.tsx
  - src/components/ManualPanel.tsx
  - src/components/SpecimenStack.tsx
  - src/components/GelBandView.tsx
  - src/components/ScanResultModal.tsx
  - src/hooks/useKeyboard.ts
  - src/harness/__tests__/serialization/schema.test.ts
dependencies:
  - RP-3-genetics-v1

behaviors:
  - id: scan-state-on-gamestate
    description: >
      GameState carries scan-related fields. state.scannedSpecimens is a
      Map<FloraSpecies, ScannedSpecimen[]> — each species maps to an ordered
      list of every uniquely-identified specimen the player has scanned
      (deduped by identity, so re-scanning the same plant is a no-op).
      A ScannedSpecimen is { identity: string; scannedAt: number;
      position: Position }. state.scanInProgress is a nullable
      { target: Position; species: FloraSpecies; startTime: number }
      record describing the currently-active scan, or null when no scan is
      running. state.manualHighlightEntryId is a nullable string holding
      the entry id to flash/scroll-to on the next manual open (used to
      surface the just-scanned species when the player later opens the
      manual). All three fields appear in EXPECTED_FIELDS in the schema
      serialization test.
    inputs:
      - 'codebase after RP-6 lands'
    outputs:
      - 'state.scannedSpecimens: Map<FloraSpecies, ScannedSpecimen[]> exists on GameState'
      - 'state.scanInProgress: ScanProgress | null exists on GameState'
      - 'state.manualHighlightEntryId: string | null exists on GameState'
      - 'all three fields are listed in EXPECTED_FIELDS in schema.test.ts'
    state_changes:
      - field: scannedSpecimens
        effect: 'Map<FloraSpecies, ScannedSpecimen[]>; appended to by successful scans, deduped by identity'
      - field: scanInProgress
        effect: 'null when idle; { target, species, startTime } when a scan is held'
      - field: manualHighlightEntryId
        effect: 'set on successful scan to flora:${species}; cleared after the manual consumes it'
    determinism: deterministic

  - id: scan-target-selection
    description: >
      A pure helper selectScanTarget(state) in src/engine/manual.ts (or a
      new src/engine/scan.ts) returns the flora tile the player would scan
      if they began holding the scan key now. The rule is:
      (1) if the tile the player stands on is TileType.Flora, that is the
          target.
      (2) otherwise, of the four cardinal neighbors, prefer the one in
          state.playerFacing direction if it is TileType.Flora.
      (3) otherwise, scan the cardinal neighbors in fixed order (N, E, S, W)
          and return the first that is TileType.Flora.
      (4) if no flora tile is found in the player's tile or any cardinal
          neighbor, return null.
      The target includes the position, the species (read from
      state.floraLifecycle.get(posKey)?.species), and the plant identity.
      The function never reads state.scanInProgress — it only computes what
      WOULD be scanned now.
    inputs:
      - 'state with a known player position and playerFacing'
      - 'state.map populated; state.floraLifecycle populated'
    outputs:
      - '{ position: Position; species: FloraSpecies; identity: string } or null'
    state_changes: []
    determinism: deterministic

  - id: hold-to-scan-keybinding
    description: >
      The keyboard handler in src/hooks/useKeyboard.ts has a hold-down
      binding for the f key. f is shared with Interact: on keydown, the
      Interact handler runs first; if it performs an action (advance
      dialog, talk to character, break wall, clear debris, unlock door)
      it returns. Only when no interaction fires does the keydown fall
      through to the scan handler. On keydown of f (with no interaction
      in range), if state.scanInProgress is null and selectScanTarget(state)
      returns a non-null target, set state.scanInProgress to
      { target.position, target.species, startTime: performance.now() }.
      On keyup of f while a scan is in progress, evaluate
      elapsed = now - startTime. If elapsed >= SCAN_DURATION_MS (1500),
      commit the scan via commitScan(state) and clear state.scanInProgress.
      Otherwise just clear state.scanInProgress (early release aborts).
      Any movement key press (wasd) or click-to-move while a scan is in
      progress also aborts — the scan is cancelled and state.scanInProgress
      is set to null. The scan key is blocked when a text input is focused,
      during dialog, when the menu is open, or when genesis is running.
    inputs:
      - 'player presses or releases f while gameplay is active'
      - 'state.scanInProgress and selectScanTarget(state) state'
    outputs:
      - 'state.scanInProgress transitions between null and { … }'
      - 'on full-duration release, commitScan(state) fires'
    state_changes:
      - field: scanInProgress
        effect: 'set on keydown if target exists; cleared on release, movement, or abort'
    determinism: deterministic

  - id: commit-scan-records-discovery
    description: >
      commitScan(state, time) in src/engine/scan.ts is called when a hold
      completes. It reads state.scanInProgress (must be non-null). It
      looks up the current target via selectScanTarget(state) — NOT the
      cached target from scanInProgress — to handle the case where the
      plant or player moved during the hold. If the current target is
      null or the species differs from scanInProgress.species, the commit
      silently aborts and returns false. Otherwise it: (1) calls
      recordDiscovery(state, `flora:${species}`); (2) appends a
      ScannedSpecimen { identity, scannedAt: time, position } to
      state.scannedSpecimens.get(species) ?? [] unless an entry with the
      same identity is already present (re-scanning the same plant is a
      no-op for the specimen list); (3) calls spawnPickupBloom(state, x,
      y, time) at the target position — same visual feedback as any
      other player-initiated acquisition; (4) sets
      state.manualHighlightEntryId to `flora:${species}` so a later
      manual open scrolls to and flashes that entry. Returns true on
      successful commit. commitScan does NOT open the manual or the scan
      result modal; the caller (game loop) decides what surface to open.
    inputs:
      - 'commitScan(state, time) called after a successful hold-to-scan release'
    outputs:
      - 'manualDiscoveries gains "flora:${species}"'
      - 'scannedSpecimens[species] gains a new ScannedSpecimen unless identity already present'
      - 'pickup bloom spawns at the scanned tile'
      - 'manualHighlightEntryId set to "flora:${species}"'
      - 'returns true on successful commit, false on abort'
    state_changes:
      - field: manualDiscoveries
        effect: 'flora:${species} added once (idempotent)'
      - field: scannedSpecimens
        effect: 'ScannedSpecimen appended per unique identity'
      - field: manualHighlightEntryId
        effect: 'set to flora:${species}'
    determinism: deterministic

  - id: manual-renders-gel-band-view-for-scanned-species
    description: >
      The ManualPanel.tsx EntryCard for any flora entry (id starting
      with "flora:") renders a gel-electrophoresis-style band view above
      the lore text when the species has been scanned. The view is an
      8x8 grid (HEX_GRID_SIZE) derived from hashToHexGrid(identity) for
      the currently-selected specimen in the SpecimenStack. Each cell
      renders as a horizontal band: a rectangular fill in the existing
      text-color token (off-white on dark background) whose opacity is
      nibble / 15 (0 → fully transparent, 15 → fully opaque). Vertical
      blur is applied via CSS filter: blur on each row (or row group)
      so bands bleed into each other vertically and read as a gel
      printout. The component lives in src/components/GelBandView.tsx
      and replaces the previous HexGridView component. SpecimenStack
      paging (prev/next, "Specimen N of M", relative scan time) is
      preserved unchanged — the gel view replaces only the visual
      inside each card. The data-testid is "gel-band-view". Undiscovered
      species do not appear in the manual at all (handled by the
      existing isDiscovered() filter using the unlockKey). The component
      file src/components/HexGridView.tsx is removed, along with its
      test file src/components/__tests__/HexGridView.test.tsx.
    inputs:
      - 'player has scanned at least one plant of species X'
      - 'player opens the manual and views the entry for species X'
    outputs:
      - 'the entry shows an 8x8 gel-band view above the lore'
      - 'each cell opacity = nibble / 15; bands are vertically blurred'
      - 'SpecimenStack paging behavior unchanged'
      - 'HexGridView component and its test are deleted'
      - 'undiscovered species are filtered from the manual entirely'
    state_changes: []
    determinism: deterministic

  - id: scan-completion-opens-gel-modal
    description: >
      On successful scan commit (commitScan returns true), the game opens
      a center-screen modal — the ScanResultModal — instead of the
      manual. The modal is driven via a new callback
      callbacks.onScanComplete?.(species, identity) emitted from the
      game loop in src/engine/gameLoop.ts at the same site that
      previously called callbacks.onOpenManual. The previous
      onOpenManual callback is removed from the scan completion path
      (it is not used anywhere else for scans). React wires this
      callback in src/components/GameScreen.tsx by setting
      activeScreen to a new PermacomputerScreen value 'scan-result' and
      passing the species + identity down to the modal. The modal
      reuses the existing screen overlay backdrop (same as 'manual',
      'system', etc.) so input is blocked during the modal: movement,
      hold-to-scan, click-to-move, and other gameplay keys are
      suppressed exactly as they are for the manual screen. The modal
      renders the Latin binomial (FLORA_SPECIES[species].latinBinomial)
      in a serif-styled heading element, then the GelBandView for the
      provided identity beneath it. Dismissal: any key or click that
      would close another screen (Escape, the dedicated manual/system
      toggle key, or clicking outside the modal content area) closes
      the modal by clearing activeScreen back to null. The modal does
      NOT clear state.manualHighlightEntryId — if the player later
      opens the manual, the just-scanned entry still flashes/scrolls
      into view as before. Modal animation state (reveal progress) is
      held in React local state inside ScanResultModal, NOT on
      GameState.
    inputs:
      - 'commitScan(state, time) returns true'
    outputs:
      - 'callbacks.onScanComplete fires with (species, identity)'
      - "GameScreen sets activeScreen to 'scan-result'"
      - 'ScanResultModal renders with latin binomial + GelBandView'
      - 'input is blocked behind the modal (same as other screens)'
      - 'previous callbacks.onOpenManual call at the scan site is removed'
    state_changes: []
    determinism: deterministic

  - id: scan-modal-beat-reveal
    description: >
      The ScanResultModal sequences its reveal animation to create a
      ceremonial beat. (1) On mount, the modal renders with both
      elements hidden. (2) The Latin binomial fades in over BINOMIAL_FADE_MS
      (~400ms). (3) After the binomial finishes fading, the gel bands
      fade in row by row, top to bottom, at ROW_REVEAL_MS (~80ms) per
      row — total ~640ms across all 8 rows. (4) The modal is only
      dismissable AFTER the bands finish revealing (a "fully-revealed"
      flag flips). Dismissal attempts before that flag flips are
      ignored. Reveal state is local React state (useState +
      setTimeout / requestAnimationFrame); it does NOT live on
      GameState and does NOT serialize. The animation respects
      prefers-reduced-motion: when the media query matches, both fades
      collapse to a single instant render and the modal is
      immediately dismissable.
    inputs:
      - 'ScanResultModal mounts with species + identity props'
    outputs:
      - 'binomial fades in (~400ms)'
      - 'gel bands fade in row by row (~80ms per row)'
      - 'modal dismissable only after full reveal'
      - 'prefers-reduced-motion collapses to instant render + immediate dismissable'
    state_changes: []
    determinism: deterministic

  - id: scan-progress-visible-on-canvas
    description: >
      While state.scanInProgress is non-null, the renderer draws a small
      progress indicator at the target tile position. The indicator is a
      thin colored arc or ring that fills from 0% to 100% over
      SCAN_DURATION_MS. The color is the species color from FLORA_SPECIES,
      drawn at ~60% alpha. When the scan completes or aborts, the
      indicator is removed. The indicator is rendered via a new pass in
      src/engine/render/passes/scanProgress.ts and registered into the
      "effect" slot (already documented as the post-tile overlay slot).
    inputs:
      - 'state.scanInProgress is non-null on a given frame'
    outputs:
      - 'a progress arc renders at the target tile, filling per elapsed time'
    state_changes: []
    determinism: deterministic

  - id: persistent-manual-ui-state
    description: >
      GameState carries a state.manualState record holding the manual
      panel's filter and reveal UI state across panel open/close. The
      record has three fields: activeCategory (a ManualCategory | null
      tab filter; null = ALL), searchQuery (a string typed into the
      search box; '' = unfiltered), and revealedHints (a Set<string>
      of hint keys the player has clicked to reveal — typically recipe
      result keys whose full content is gated behind a click-to-reveal
      affordance). ManualPanel reads manualState on mount, mirrors its
      activeCategory and searchQuery into local React state for
      controlled inputs, and writes back to manualState on user edits
      so the values persist when the panel is closed and re-opened. The
      revealedHints set is mutated directly via toggleHint, which adds
      or removes a key on each click. When the panel opens with a
      manualHighlightEntryId set (just-scanned species), the handler
      resets manualState.activeCategory to null and manualState.searchQuery
      to '' before scrolling — this guarantees the highlighted entry is
      visible regardless of any prior filter the player had applied.
      The manualState record appears in EXPECTED_FIELDS in the schema
      serialization test.
    inputs:
      - 'player opens, filters, searches, or reveals hints inside the manual'
      - 'codebase after this behavior lands'
    outputs:
      - 'state.manualState: { activeCategory, searchQuery, revealedHints } exists on GameState'
      - 'activeCategory and searchQuery values survive panel close/reopen'
      - 'revealedHints keys persist for the lifetime of the GameState'
      - 'opening with manualHighlightEntryId clears activeCategory and searchQuery to ensure visibility'
      - 'manualState is listed in EXPECTED_FIELDS in schema.test.ts'
    state_changes:
      - field: manualState
        effect: 'activeCategory: ManualCategory | null, mutated by setCategory'
      - field: manualState
        effect: 'searchQuery: string, mutated by setSearch'
      - field: manualState
        effect: 'revealedHints: Set<string>, mutated by toggleHint (add on first click, remove on second)'
    determinism: deterministic

  - id: doctrine-and-status-aligned
    description: >
      docs/claude/manual.md is updated so the "scan-to-discover" section
      describes the modal-first flow: a successful scan opens the
      ScanResultModal (latin binomial + gel-band view, row-by-row
      reveal), and the manual archive surface is now the gel-band view
      (not the hex grid) inside SpecimenStack cards. docs/claude/genetics.md
      is updated so the hex-grid section reflects that the manual
      surface is rendered as a gel-band visual idiom — the underlying
      hashToHexGrid mapping remains locked and unchanged; only the
      visual presentation has changed. Any references to HexGridView
      in claude docs are replaced with GelBandView.
    inputs:
      - 'codebase after this change-request lands'
    outputs:
      - 'docs/claude/manual.md describes the modal + gel-band flow'
      - 'docs/claude/genetics.md notes the gel-band visual presentation; underlying mapping unchanged'
      - 'all claude doc references to HexGridView are replaced with GelBandView'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: no-flora-in-range
    description: >
      Player presses f while standing on dirt with no flora on cardinal
      neighbors. selectScanTarget returns null. scanInProgress remains null
      — no progress indicator appears.
    expected: >
      The keydown is a no-op. No state changes. No visual feedback. No error.

  - id: interact-and-scan-share-f
    description: >
      Player presses f while adjacent to both an interactable (NPC, locked
      door, breakable wall, ruin debris) AND a scannable flora tile. The
      Interact handler fires first and returns; no scan begins.
    expected: >
      Interact action completes (dialog opens, door unlocks, wall breaks, etc.).
      state.scanInProgress remains null. The same press cannot do both.

  - id: scan-fallthrough-when-nothing-interactable
    description: >
      Player presses f next to a wildflower with no NPC, door, debris, or
      breakable wall in range. The Interact handler runs all its checks,
      finds nothing to act on, and falls through to the scan handler.
    expected: >
      A scan begins as usual. state.scanInProgress is set with the flora
      tile as the target.

  - id: scan-while-running-second-keydown
    description: >
      Player is holding f with a scan in progress. A second keydown of f
      fires (key repeat). The handler ignores the repeat — scanInProgress
      is not overwritten and startTime is not reset.
    expected: >
      The active scan continues with its original startTime. No reset.

  - id: scan-target-moves-mid-hold
    description: >
      Player holds f on a flora tile. Before release, the plant dies
      through the lifecycle (Decomposing → Dirt) so the tile is no
      longer Flora. On keyup, commitScan re-evaluates via
      selectScanTarget. The target is null (or a different species).
      The commit aborts.
    expected: >
      No discovery, no specimen cached, no bloom. scanInProgress cleared.

  - id: scan-while-already-scanned
    description: >
      Player successfully scans a wildflower (entry unlocked, grid cached).
      Later, the player scans a different wildflower with a different
      identity. commitScan calls recordDiscovery (idempotent — already
      discovered, no-op) and sees that scannedSpecimens already has the
      species → checks "if not already in the map" and skips the write.
      A pickup bloom still spawns as the player-feedback acknowledgment.
    expected: >
      No grid change in the manual. Discovery set unchanged. Bloom spawns.

  - id: undiscovered-entries-hidden-from-search
    description: >
      ManualPanel's search bar filters entries. An undiscovered species
      name "Echinacea purpurea" should not match any search query because
      the entry is filtered out by isDiscovered before filterManualEntries
      runs. Player typing the latin name in the search box sees no results
      for that species until they have scanned one.
    expected: >
      Undiscovered flora entries are absent from the rendered manual
      regardless of search input.

  - id: movement-aborts-scan
    description: >
      Player begins a scan (v down). Mid-hold, presses w (movement). The
      movement handler clears state.scanInProgress to null before processing
      the move. The scan does not complete even if f is still held.
    expected: >
      scanInProgress is null. The player moves one step. The progress
      indicator disappears. Releasing f afterward is a no-op (no active scan).

  - id: dismiss-before-full-reveal-ignored
    description: >
      Player triggers a successful scan, the ScanResultModal opens, and
      they press Escape before the row-by-row reveal completes. The
      modal does not close — the dismiss is ignored until the
      fully-revealed flag flips.
    expected: >
      Modal stays open. activeScreen remains 'scan-result'. Reveal
      continues. Once fully revealed, the same dismissal would close it.

  - id: reduced-motion-collapses-reveal
    description: >
      A user with prefers-reduced-motion enabled triggers a scan. The
      modal renders the binomial + full gel-band view immediately with
      no fade transitions, and is dismissable from the first frame.
    expected: >
      No staged animation. Modal contents fully visible on mount.
      Dismiss succeeds immediately.

  - id: scan-while-modal-open-blocked
    description: >
      The ScanResultModal is open. Player attempts to hold f to start
      another scan. activeScreen is 'scan-result', so the scan keybinding
      is blocked exactly as it is for 'manual' or 'system' screens.
    expected: >
      No new scan begins. state.scanInProgress remains null. The modal
      is unaffected.

  - id: filter-and-search-persist-across-panel-reopen
    description: >
      Player opens the manual, selects the "Flora" category, and types
      "clover" into the search box. They close the panel. They later
      reopen the panel (no scan in between, so manualHighlightEntryId
      stays null).
    expected: >
      The Flora tab is still active and the search box still contains
      "clover" on reopen — the panel reads state.manualState into the
      controlled inputs on mount.

  - id: scan-highlight-clears-active-filter
    description: >
      Player has the manual filtered to "Recipes" with searchQuery set
      to "honey". They close the manual, scan a wildflower outside the
      currently filtered category, and the manual reopens (or the
      player reopens it) with manualHighlightEntryId set to that
      species. The reset effect inside the highlight useEffect clears
      both activeCategory and searchQuery so the entry is visible.
    expected: >
      activeCategory becomes null (ALL), searchQuery becomes '', the
      scanned entry scrolls into view and flashes. After dismiss, the
      filter remains cleared (the player must reapply it).

  - id: revealed-hints-toggle-symmetric
    description: >
      Player clicks a hint chip on a recipe entry. The hint reveals
      (revealedHints adds the key). They click it again to hide it.
      They reopen the manual later.
    expected: >
      After the second click the key is removed from revealedHints and
      the hint hides. State persists across reopen — if the player had
      stopped after the first click, the hint would still be revealed
      on reopen.

  - id: manual-highlight-survives-modal-dismiss
    description: >
      Player scans a flora tile, the modal opens, they dismiss it, and
      later open the manual. The manual scrolls to and flashes the
      flora:${species} entry that was just scanned, because the modal
      flow never cleared state.manualHighlightEntryId.
    expected: >
      Manual opens with the scanned species' entry highlighted.
      ManualHighlight behavior matches the pre-change pattern.

failure_conditions:
  - trigger: 'state.scannedSpecimens is mutated outside commitScan'
    expected: >
      No public API exposes the map for writing. Direct mutation in
      tests is acceptable; production code must route through commitScan.
      A code review check enforces this convention (no eslint rule —
      the convention is documented in docs/claude/genetics.md).

  - trigger: 'commitScan is called with state.scanInProgress === null'
    expected: >
      The function returns early without mutating state. The function is
      defensive; the caller (the keyup handler) should have set it before
      calling.

  - trigger: 'hashToHexGrid is called with a non-64-char-hex string'
    expected: >
      Behavior is undefined per the function's existing contract from RP-3.
      RP-6 must never pass a malformed identity. The
      state.scannedSpecimens map values are SHA256 outputs from the
      genetics module, guaranteed 64-char hex. Defensive assertion not
      required.

  - trigger: 'a flora entry is shown in the manual but the species has no scannedSpecimens entry'
    expected: >
      Impossible by construction — the entry is filtered out by
      isDiscovered (unlockKey not in manualDiscoveries) before render.
      If it somehow renders, the GelBandView component should gracefully
      render nothing (no error, no placeholder bands).

  - trigger: 'onScanComplete fires but GameScreen has no handler wired'
    expected: >
      No-op. activeScreen stays null and the player sees no modal. This
      indicates a wiring bug in GameScreen — caught by component tests
      that assert the modal opens on a simulated scan completion.

verification:
  test_file: src/components/__tests__/ScanResultModal.test.tsx
  test_pattern: 'scan-result'
  command: npx vitest run src/components/__tests__/ScanResultModal.test.tsx src/components/__tests__/GelBandView.test.tsx src/components/__tests__/ManualPanel.test.tsx
