id: genesis-transition-jump
name: Genesis-to-game crossfade has no visual jump
status: partial
priority: high
layer: component
source_files:
  - src/App.tsx
  - src/components/GenesisScreen.tsx
  - src/components/GameScreen.tsx
  - src/components/GameCanvas.tsx
  - src/components/Sidebar.tsx
  - src/components/ActionBar.tsx
  - src/styles/index.css
dependencies:
  - genesis-enhancements

behaviors:
  - id: canvas-positioning-match
    description: Genesis canvas and game canvas use the same positioning strategy so glyphs render at identical pixel positions during the crossfade transition
    inputs:
      - Genesis completes and crossfade begins
      - Both canvases are briefly mounted simultaneously during the dissolve
    outputs:
      - Glyph positions on the genesis canvas match glyph positions on the game canvas for the same tile coordinates
      - No visible horizontal or vertical shift of the tile grid between the two canvases
    state_changes:
      - field: GenesisScreen canvas element
        effect: Uses normal document flow positioning instead of fixed inset-0, matching GameCanvas layout
    determinism: deterministic

  - id: viewport-inset-alignment
    description: Both genesis and game canvases account for the sidebar inset (SIDEBAR_WIDTH_PX) so the visible tile grid occupies the same screen region
    inputs:
      - Genesis canvas computes its viewport dimensions
      - Game canvas computes its viewport dimensions
    outputs:
      - Both canvases subtract SIDEBAR_WIDTH_PX from the available width when computing rightInsetTiles
      - Tile (0,0) renders at the same screen pixel on both canvases
      - The visible tile grid is the same width and height on both canvases
    state_changes:
      - field: GenesisScreen viewport calculation
        effect: Subtracts SIDEBAR_WIDTH_PX from window.innerWidth when computing tile columns, matching GameCanvas
    determinism: deterministic

  - id: instant-ui-overlay-mount
    description: Sidebar and ActionBar appear instantly when GameScreen mounts, with no fade-in animation, so the UI is fully visible before the genesis dissolve completes
    inputs:
      - GameScreen mounts during the crossfade transition
    outputs:
      - Sidebar is fully opaque (opacity 1) on the first rendered frame
      - ActionBar is fully opaque (opacity 1) on the first rendered frame
      - No animate-fade-in CSS class is applied to either component
    state_changes:
      - field: Sidebar className
        effect: animate-fade-in class removed
      - field: ActionBar className
        effect: animate-fade-in class removed
    determinism: deterministic

  - id: pixel-perfect-crossfade
    description: The full crossfade from genesis to game produces no layout shift, no glyph jump, and no gap in UI overlay visibility
    inputs:
      - Genesis simulation completes (naturally or via skip)
      - App triggers 200ms dissolve transition
    outputs:
      - Tile grid remains visually stable throughout the dissolve
      - Sidebar stats bar is continuously visible (no flicker or gap)
      - ActionBar is continuously visible (no flicker or gap)
      - No horizontal or vertical shift of any on-screen element exceeding 0 pixels
    state_changes: []
    determinism: time-based

edge_cases:
  - id: browser-resize-during-transition
    description: User resizes the browser window while the 200ms genesis-to-game dissolve is in progress
    expected: Both canvases recalculate viewport on resize; no additional jump beyond the resize itself
  - id: different-zoom-levels
    description: Browser zoom is not 100% (e.g. 125% or 150%) during the transition
    expected: Both canvases compute tile size from the same base values; glyph positions still align
  - id: skip-genesis-via-keypress
    description: Player presses a key to skip genesis, which fast-forwards all mutations then triggers the crossfade
    expected: Crossfade behavior is identical to natural completion; no extra jump from skip path
  - id: narrow-viewport-sidebar-overlap
    description: Window is narrow enough that sidebar inset leaves very few visible tile columns
    expected: Both canvases compute the same reduced column count; tile grid still aligns

failure_conditions:
  - trigger: Genesis canvas uses fixed inset-0 positioning while game canvas uses normal document flow
    expected: Glyphs jump horizontally and vertically because the two canvases have different origins
  - trigger: Genesis canvas computes viewport from full window.innerWidth without subtracting SIDEBAR_WIDTH_PX
    expected: Genesis tile grid is wider than game tile grid, causing a horizontal shift on crossfade
  - trigger: Sidebar and ActionBar use animate-fade-in with 1s duration while genesis dissolve is only 200ms
    expected: UI overlays are invisible/transparent for 800ms after genesis disappears, creating a flash of missing UI

verification:
  test_file: src/components/__tests__/genesisTransition.test.tsx
  test_pattern: genesis transition
  command: npx vitest run src/components/__tests__/genesisTransition.test.tsx
