id: trapped-coyote-stays-put
name: 'Trapped coyote stays put on ruin entry'
priority: high
layer: engine
source_files:
  - src/engine/ruins.ts
  - src/engine/coyote.ts
  - src/engine/interaction.ts
  - src/engine/characters.ts
dependencies:
  - main-questline-foundation
  - coyote-companion
  - ruin-dormant-garden

behaviors:
  - id: trapped-coyote-not-teleported-on-ruin-entry
    description: >
      When the player enters a ruin and the coyote has not yet been
      rescued (mainQuestPhase === 'awaiting-coyote'), the coyote
      entity must remain at the position where spawnDormantGardenItems
      placed it — past the collapseBarrier on the vault side. The
      zone-following helper (transitionCoyoteToZone) early-returns
      before any mutation when the trapped-coyote condition holds, so
      neither the coyote Position component nor its EntityZone
      component is modified — the coyote stays in the ruin zone with
      its original ruinIndex.
    inputs:
      - 'enterRuin runs for a coyote-role ruin while state.mainQuestPhase === "awaiting-coyote"'
      - 'spawnDormantGardenItems has just placed the coyote past the collapseBarrier'
    outputs:
      - 'coyote Position component is unchanged after enterRuin returns'
      - 'coyote EntityZone component is unchanged (stays Zone.Ruin with the original ruinIndex)'
      - 'coyote is not cardinally adjacent to state.player'
      - 'state.mainQuestPhase remains "awaiting-coyote"'
      - 'no "Rescued Coyote!" toast is queued'
    state_changes:
      - field: 'world (coyote entity Position component)'
        effect: 'unchanged — coyote remains at its spawn tile past the collapseBarrier'
      - field: 'world (coyote entity EntityZone component)'
        effect: 'unchanged — early return skips zone bookkeeping while trapped'
      - field: mainQuestPhase
        effect: 'unchanged — remains "awaiting-coyote"'
    determinism: deterministic

  - id: trapped-coyote-not-dragged-on-ruin-exit
    description: >
      When the player exits a coyote-role ruin without rescuing the
      coyote (mainQuestPhase === 'awaiting-coyote'), the coyote
      entity must remain inside the ruin at its trapped position.
      The zone-following helper must not move the trapped coyote to
      the overworld adjacent to the player.
    inputs:
      - 'exitRuin runs while state.mainQuestPhase === "awaiting-coyote" and a coyote entity exists with EntityZone Ruin'
    outputs:
      - 'coyote Position component is unchanged after exitRuin returns'
      - 'coyote EntityZone remains Zone.Ruin with the original ruinIndex'
      - 'coyote is not present on the overworld adjacent to state.player'
    state_changes:
      - field: 'world (coyote entity Position component)'
        effect: 'unchanged — coyote stays at its trapped tile'
      - field: 'world (coyote entity EntityZone component)'
        effect: 'unchanged — remains Zone.Ruin with original ruinIndex'
    determinism: deterministic

  - id: collapse-barrier-clears-atomically
    description: >
      RuinDebris only exists as the coyote-role ruin's collapseBarrier
      (no scattered/decorative RuinDebris is generated anywhere). When
      the player faces a RuinDebris tile and triggers the debris-clear
      interaction, every RuinDebris tile in collapseBarrier converts to
      RuinFloor in the same call — not just the facing tile. This
      mirrors the cave breakable-wall pattern in breakWall, where
      caveBreakableWallPositions all flip to CaveFloor together. The
      clear also spawns a crumble TimedEffect entity whose
      MultiPosition covers
      the collapseBarrier tiles (matching the cave wall-break crumble
      entity), and spawns a pickupBloom effect at the player position
      (per the pickup bloom convention — every acquisition or
      progression event must bloom). The collapseBarrier field on
      dormantGarden remains populated for save/spec lookup; it is not
      cleared.
    inputs:
      - 'clearRuinDebris runs with the facing tile inside dormantGarden.collapseBarrier'
    outputs:
      - 'every tile in dormantGarden.collapseBarrier is RuinFloor'
      - 'a crumble TimedEffect entity exists with MultiPosition covering the collapseBarrier tiles'
      - 'a pickupBloom effect is spawned at the player position'
    state_changes:
      - field: map (tiles at collapseBarrier positions)
        effect: 'all converted from RuinDebris to RuinFloor in one call'
      - field: world (new entities)
        effect: 'one crumble TimedEffect entity with MultiPosition over the collapseBarrier tiles; one pickupBloom effect at player position'
    determinism: deterministic

  - id: coyote-runs-to-player-and-opens-dialog-on-rescue
    description: >
      When tryCoyoteRescueOnApproach fires rescueCoyote, in addition to
      the existing behavior (teleport coyote adjacent to player, switch
      Behavior to follow, queue 'Rescued Coyote!' toast, spawn pickup
      bloom, advance mainQuestPhase from AwaitingCoyote to Gathering),
      rescueCoyote also auto-opens an activeDialog targeting the coyote
      character (mirrors the precedent set by triggerStewardSeal, which
      auto-opens Gron's dialog after the bee+clover combine). The
      dialog is opened with characterId 'coyote', lineIndex 0,
      typingIndex 0, typingDone false, transitioning false,
      transitionStartTime 0. The coyote character definition's dialog
      array provides the lines, which are: ['Awoo!', 'Awoo!']. The
      coyote character definition also has portrait set to '/gron.gif'
      as a deliberate placeholder until a coyote portrait asset is
      authored — this is an intentional placeholder, not a typo.
    inputs:
      - 'player becomes cardinally adjacent to the trapped coyote with mainQuestPhase === AwaitingCoyote and currentZone === Ruin in a Coyote-role ruin'
    outputs:
      - 'coyote Position is moved to a walkable tile cardinally adjacent to state.player'
      - 'state.activeDialog has characterId "coyote", lineIndex 0, typingDone false'
      - 'state.mainQuestPhase === Gathering after the call returns'
      - 'pickupBloom spawned at player position'
      - "'Rescued Coyote!' toast queued"
    state_changes:
      - field: 'world (coyote entity Position, Behavior, EntityZone)'
        effect: 'Position moved adjacent to player; Behavior set to follow; EntityZone set to current zone'
      - field: activeDialog
        effect: 'set to { characterId: "coyote", lineIndex: 0, typingIndex: 0, typingDone: false, transitioning: false, transitionStartTime: 0 }'
      - field: mainQuestPhase
        effect: 'AwaitingCoyote → Gathering'
    determinism: deterministic

  - id: coyote-character-definition-awoo
    description: >
      The CHARACTERS.coyote entry in src/engine/characters.ts has its
      dialog field set to ['Awoo!', 'Awoo!'] (was previously empty).
      A portrait field is added, set to '/gron.gif' as a deliberate
      placeholder until a coyote portrait asset is created. The
      glyph 'C' and glyphColor '#D4A054' remain unchanged.
    inputs:
      - 'getCharacterDefinition("coyote") is called'
    outputs:
      - 'returned definition has dialog equal to ["Awoo!", "Awoo!"]'
      - "returned definition has portrait equal to '/gron.gif'"
      - "returned definition has glyph 'C' and glyphColor '#D4A054'"
    state_changes: []
    determinism: deterministic

  - id: rescued-coyote-still-follows-across-zones
    description: >
      Once the coyote has been rescued (mainQuestPhase advanced past
      'awaiting-coyote'), the zone-following helper resumes its
      original behavior: on every enterRuin / exitRuin / enterCave /
      exitCave call, the coyote entity is teleported to a walkable
      tile cardinally adjacent to the player in the destination
      zone. This is the existing companion-follow behavior and must
      not regress.
    inputs:
      - 'enterRuin or exitRuin runs while state.mainQuestPhase !== "awaiting-coyote" and a coyote entity exists'
    outputs:
      - 'coyote is at a walkable tile cardinally adjacent to state.player'
      - 'coyote EntityZone matches the new zone'
    state_changes:
      - field: 'world (coyote entity Position component)'
        effect: 'moved to a walkable tile adjacent to the player in the destination zone'
      - field: 'world (coyote entity EntityZone component)'
        effect: 'updated to match the destination zone (and ruinIndex when applicable)'
    determinism: deterministic

edge_cases:
  - id: no-coyote-entity-present
    description: >
      enterRuin or exitRuin runs and there is no coyote entity in
      the world (the player has never entered the coyote-role ruin
      and the trapped coyote has not been spawned).
    expected: 'transitionCoyoteToZone is a no-op; no errors thrown; no state changes related to the coyote.'

  - id: trapped-coyote-spawn-and-entry-in-same-call
    description: >
      First entry to the coyote-role ruin: spawnDormantGardenItems
      creates the trapped coyote immediately before
      transitionCoyoteToZone runs in the same enterRuin call.
    expected: 'The trapped coyote remains at its spawn tile past the collapseBarrier — its Position is not modified by transitionCoyoteToZone.'

  - id: collapse-barrier-already-partially-cleared
    description: >
      A prior code path (e.g. fire revery hitting one collapseBarrier
      tile) has already converted some collapseBarrier tiles to
      RuinFloor before the player triggers clearRuinDebris on a
      remaining RuinDebris collapseBarrier tile.
    expected: 'Every collapseBarrier position that is still RuinDebris converts to RuinFloor in this call. Positions already RuinFloor are left as-is (no error, no re-conversion). The crumble TimedEffect MultiPosition covers all collapseBarrier positions regardless of prior state.'

  - id: rescue-fires-while-dialog-system-busy
    description: >
      tryCoyoteRescueOnApproach is invoked while state.activeDialog is
      already non-null (e.g. a stray dialog left open). rescueCoyote
      overwrites activeDialog with the coyote dialog descriptor.
    expected: 'activeDialog is replaced with { characterId: "coyote", lineIndex: 0, ... }. No assertion failure. The dialog that was previously open is discarded — same precedent as triggerStewardSeal.'

  - id: player-takes-a-step-after-entry
    description: >
      Player enters the coyote-role ruin for the first time and
      then takes one cardinal step in any direction without first
      clearing the collapseBarrier.
    expected: 'tryCoyoteRescueOnApproach runs after the step, finds the trapped coyote is more than 1 tile away, and does not fire the rescue. mainQuestPhase remains AwaitingCoyote.'

failure_conditions:
  - trigger: 'Player enters the coyote-role ruin for the first time and takes a single step without breaking any collapseBarrier tile.'
    expected: 'No rescue fires. mainQuestPhase remains "awaiting-coyote". No "Rescued Coyote!" toast is queued. The coyote is still on the vault side of the rubble, more than 1 tile away from the player.'
  - trigger: 'Player enters the coyote-role ruin and exits without rescuing the coyote.'
    expected: 'Coyote remains inside the ruin at its spawn position; coyote is not visible on the overworld adjacent to the player after exitRuin.'
  - trigger: 'Player faces and clears a single collapseBarrier tile.'
    expected: 'All three collapseBarrier tiles convert to RuinFloor atomically; a crumble TimedEffect entity is created with MultiPosition over the collapseBarrier tiles; a pickupBloom is spawned at the player position.'
  - trigger: 'Rescue fires (player becomes adjacent to coyote after clearing the barrier).'
    expected: "state.activeDialog is set to the coyote dialog descriptor; the coyote definition's dialog returns ['Awoo!', 'Awoo!']; the coyote definition's portrait is '/gron.gif'; mainQuestPhase advances to Gathering; pickupBloom and 'Rescued Coyote!' toast fire as before."

verification:
  test_file: src/engine/__tests__/trapped-coyote-stays-put.test.ts
  test_pattern: 'trapped coyote stays put on ruin entry'
  command: 'npx vitest run src/engine/__tests__/trapped-coyote-stays-put.test.ts'
