id: ruin-locked-door
name: 'Ruin locked door (key-gated wall)'
priority: high
layer: engine
source_files:
  - src/engine/ruins.ts
  - src/engine/types.ts
  - src/engine/items.ts
  - src/engine/constants.ts
  - src/engine/position.ts
  - src/engine/renderer.ts
  - src/engine/interaction.ts
  - src/engine/characters.ts
  - src/hooks/useKeyboard.ts
  - src/hooks/useMouse.ts
  - src/engine/manual.ts
dependencies:
  - ruin-infrastructure

behaviors:
  - id: locked-door-tile-types
    description: >
      TileType gains RuinDoorLocked (ruinDoorLocked) and RuinDoorOpen
      (ruinDoorOpen). RuinDoorLocked is not walkable. RuinDoorOpen is
      walkable. TILE_CHARS maps RuinDoorLocked to '#' (matching the
      breakable cave wall and the standard ruin wall glyph). TILE_COLORS
      maps RuinDoorLocked to verdigris #5FD3BC (the same verdigris used
      by RuinEntrance), so the door reads as a wall section but visually
      flagged by color against the gray RuinWall palette. the renderer
      also draws RuinDoorLocked with the same multilayer pattern as
      RuinWall (so it composites identically), only the color tint
      differs. RuinDoorOpen renders identically to RuinFloor — same
      glyph, same color, same multilayer floor decoration — so the
      doorway visually disappears once unlocked. TILE_CHARS for
      RuinDoorOpen mirrors RuinFloor ('.') and TILE_COLORS mirrors
      RuinFloor (#7A7A6E).
    inputs:
      - 'tile rendering and walkability checks'
    outputs:
      - 'two new tile types: locked door reads as verdigris wall section,
        open door reads as ruin floor'
    state_changes: []
    determinism: deterministic

  - id: door-placement
    description: >
      during dormant-garden generation, the entire south wall row of
      the seed vault is converted to RuinDoorLocked tiles — mirroring
      the cave breakable wall pattern. all door tile positions are
      recorded on DormantGardenData.doorPositions (Position[]). a
      1-tile-tall landing strip directly south of the door row is
      carved as RuinFloor so the player can stand under any door
      tile and face up to interact. a 1-wide tunnel from the landing
      center connects down to the spine. the wider hitbox makes the
      door easy to find with [f] OR click. door placement is skipped
      entirely for ruins with role 'coyote' — the spine connects
      directly to the vault chamber with no gating wall, since the
      coyote ruin is gated by the collapseBarrier instead (see
      ruin-dormant-garden:coyote-collapse-barrier-placement).
      doorPositions is an empty array for coyote-role ruins.
    inputs:
      - 'maze + vault layout from generateDormantGarden'
      - 'ruin role'
    outputs:
      - 'a row of RuinDoorLocked tiles spanning the vault south wall (non-coyote roles)'
      - 'walkable landing strip immediately south of the door row (non-coyote roles)'
      - 'no door row, no landing strip for coyote-role ruins; doorPositions is empty'
    state_changes:
      - field: map
        effect: 'non-coyote roles: south wall row of the vault becomes RuinDoorLocked; landing strip below becomes RuinFloor. coyote role: no door tiles placed.'
      - field: dormantGarden.doorPositions
        effect: 'array populated with every door tile position for non-coyote roles; empty array for coyote-role'
    determinism: deterministic

  - id: unlock-interaction
    description: >
      pressing [f] while facing any RuinDoorLocked tile and holding
      at least one aqueductKey item in the backpack consumes one
      aqueductKey and converts ALL door tiles in the current ruin's
      doorPositions to RuinDoorOpen atomically. the door row remains
      open for the rest of the session — re-locking is not a feature.
      fires a unique unlock log entry: 'the lock turns'. records
      discovery for event:ruin-door-unlocked. clicking any door tile
      pathfinds to the closest walkable adjacent tile and triggers
      the same unlock on arrival (see click-interaction edge case).
      pressing [f] facing a locked door with NO aqueductKey instead
      opens the gate dialog (see locked-gate-dialog behavior).
    inputs:
      - '[f] pressed while facing any RuinDoorLocked tile, aqueductKey in backpack'
    outputs:
      - 'every door tile in the row becomes RuinDoorOpen, one aqueductKey consumed'
    state_changes:
      - field: map
        effect: 'every RuinDoorLocked tile in the row becomes RuinDoorOpen'
      - field: backpack
        effect: 'one aqueductKey item removed'
      - field: manualDiscoveries
        effect: 'event:ruin-door-unlocked recorded'
    determinism: deterministic

  - id: locked-gate-dialog
    description: >
      a synthetic 'gate' speaker is registered in CHARACTER_DEFINITIONS
      (id: 'gate', name: 'Gate', glyph: '#', glyphColor matches the
      RuinDoorLocked verdigris #5FD3BC, dialog: ['The gate is locked.'],
      no portrait, no gift, no postGiftDialog). this speaker is not an
      entity in the world — it has no Position component, getAdjacentCharacter
      never returns it, and it never appears in entity ticks or rendering.
      it exists only as a target for state.activeDialog. when the player
      presses [f] facing any RuinDoorLocked tile while holding NO
      aqueductKey, openLockedGateDialog(state) is called: it sets
      state.activeDialog = { characterId: 'gate', lineIndex: 0,
      typingIndex: 0, typingDone: false, transitioning: false,
      transitionStartTime: 0 }. the existing DialogBox component renders
      the typing animation and modal exactly as it does for character
      dialog. pressing [f] again (or clicking advance) calls advanceDialog
      which closes the modal, since 'The gate is locked.' is the single
      and last line. no gift fires (the gate has no gift). no
      manualDiscoveries entry is recorded — the gate is not a manual entry.
      the gate speaker is excluded from manual auto-derivation (no
      character:gate entry). clicking a locked door with no key triggers
      the same dialog on arrival (see click-without-key edge case).
    inputs:
      - '[f] pressed while facing any RuinDoorLocked tile, aqueductKey NOT in backpack'
      - 'click on any RuinDoorLocked tile with no aqueductKey (after pathfind arrival)'
    outputs:
      - "DialogBox renders 'Gate' speaker with line 'The gate is locked.'"
      - 'no map mutation, no key consumed, no discovery log'
    state_changes:
      - field: activeDialog
        effect: "set to { characterId: 'gate', lineIndex: 0, typingIndex: 0, typingDone: false, transitioning: false, transitionStartTime: 0 }"
    determinism: deterministic

  - id: click-to-unlock
    description: >
      RuinDoorLocked tiles are interactable via mouse click.
      isInteractableAt returns true for any RuinDoorLocked tile in
      a Ruin zone. clicking pathfinds to the closest walkable
      adjacent tile (typically on the carved landing strip), walks
      there, faces the door, and runs unlockRuinDoor — same
      semantics as pressing [f]. clicking with no aqueductKey in
      the backpack walks the player to the adjacent tile and opens
      the locked gate dialog on arrival (see locked-gate-dialog
      behavior).
    inputs:
      - 'mouse click on a RuinDoorLocked tile while in a Ruin zone'
    outputs:
      - 'player walks to an adjacent walkable tile and the door row opens (if key held)'
    state_changes:
      - field: state.path
        effect: 'pathfind to adjacent walkable tile'
      - field: state.pendingAction
        effect: 'unlockRuinDoor invocation queued for arrival'
    determinism: deterministic

  - id: locked-door-blocks-movement
    description: >
      every RuinDoorLocked tile blocks player movement, click-to-move
      pathfinding, coyote follow/collect pathing, and any other
      movement system that uses isWalkableTile. an open door
      (RuinDoorOpen) is walkable for all systems. clicks on door
      tiles route through isInteractableAt + the click-to-interact
      path (see click-to-unlock behavior) instead of click-to-move.
    inputs:
      - 'movement, pathfinding, hover preview against RuinDoorLocked tile'
    outputs:
      - 'tile treated as impassable for movement; treated as interactable for clicks'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: face-door-without-key
    description: 'player presses [f] facing RuinDoorLocked with no aqueductKey in backpack'
    expected: "no unlock, no key consumed; the locked gate dialog opens with single line 'The gate is locked.' (see locked-gate-dialog behavior). pressing [f] again dismisses the modal."

  - id: multiple-keys-in-backpack
    description: 'player has more than one aqueductKey when unlocking'
    expected: 'exactly one aqueductKey is consumed; the rest remain'

  - id: re-press-on-open-door
    description: 'player presses [f] facing a RuinDoorOpen tile'
    expected: 'no-op — open doors are not interactive, no key consumed'

  - id: key-on-action-bar-slot
    description: 'aqueductKey is bound to an action bar slot when unlock fires'
    expected: 'key is removed from backpack; action bar slot is cleared if it referenced the consumed instance'

  - id: click-interaction
    description: 'player clicks a RuinDoorLocked tile (any tile in the wall row) while holding an aqueductKey'
    expected: 'player pathfinds to closest adjacent walkable tile (carved landing strip), faces the door, and unlockRuinDoor fires — every door tile in the row converts to RuinDoorOpen'

  - id: click-without-key
    description: 'player clicks a RuinDoorLocked tile with no aqueductKey in backpack'
    expected: "player walks to adjacent tile, faces the door, and the locked gate dialog opens with single line 'The gate is locked.' on arrival (see locked-gate-dialog behavior); door row stays locked, no key consumed"

  - id: gate-dialog-not-in-manual
    description: 'player opens the prairie manual after triggering the locked gate dialog'
    expected: "no 'character:gate' or similar manual entry exists; the synthetic gate speaker is excluded from auto-derived character entries"

  - id: gate-dialog-blocks-movement
    description: 'player attempts to move (WASD) while the locked gate dialog is open'
    expected: 'movement is blocked by the existing activeDialog gate in keyboard handling — same behavior as character dialog'

  - id: gate-dialog-dismiss-on-esc
    description: 'player presses [esc] while the locked gate dialog is open'
    expected: 'modal closes via the existing activeDialog dismiss path; identical to character dialog dismissal'

  - id: coyote-ruin-has-no-door
    description: 'player explores the coyote-role ruin'
    expected: 'no RuinDoorLocked tiles exist anywhere in the ruin; the vault chamber connects to the spine corridor without a gating wall; doorPositions is an empty array'

failure_conditions:
  - trigger: 'door row placement collides with the entrance landing area'
    expected: 'generator regression — the door row must never block the entrance corridor; tests must fail if any doorPositions entry equals or is adjacent to entranceInterior'

  - trigger: 'unlock attempted while not facing any door tile (e.g. facing a regular wall adjacent to the door row)'
    expected: 'no-op — unlock is gated on facingTile == RuinDoorLocked'

  - trigger: 'unlocking opens only the facing tile, leaving sibling door tiles in the row locked'
    expected: 'spec is violated — unlockRuinDoor must convert every doorPositions entry atomically, mirroring breakWall on cave breakable walls'

  - trigger: 'pressing [f] facing a locked door with no key produces no visible feedback'
    expected: 'spec is violated — locked-gate-dialog behavior must open the gate modal so the player understands the door is gated, not broken'

  - trigger: 'the gate speaker leaks into manual auto-derivation, gameplay tick systems, or getAdjacentCharacter results'
    expected: 'spec is violated — the gate is dialog-only; it must not appear as a world entity, manual entry, or interactable character'

verification:
  test_file: src/engine/__tests__/ruin-locked-door.test.ts
  test_pattern: 'ruin locked door'
  command: 'npx vitest run src/engine/__tests__/ruin-locked-door.test.ts'
