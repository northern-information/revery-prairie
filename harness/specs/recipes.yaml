id: recipes
name: 'Recipes and combining'
status: implemented
priority: high
layer: engine
source_files:
  - src/engine/recipes.ts
  - src/engine/combine.ts
  - src/engine/drag.ts
  - src/engine/types.ts
dependencies:
  - player-movement

behaviors:
  - id: recipe-definitions
    description: >
      RECIPES array defines item combinations. each recipe has
      ingredients (two definitionIds), kind (macro or craft),
      resultName, optional resultIcon, description, optional
      preserveIngredient (definitionId kept after combine), optional
      preview function, and execute function. current recipes:
      bee+clover=prairie (macro, plants 3x3 clover, spawns bee) and
      meteorite+permacomputer=omnibox (craft, creates omnibox item,
      preserves permacomputer).
    inputs:
      - 'RECIPES array'
    outputs:
      - 'Recipe objects with ingredients, kind, execute'
    state_changes: []
    determinism: deterministic

  - id: recipe-key-generation
    description: >
      recipe keys are generated by sorting ingredient definitionIds
      alphabetically and joining with +. this makes lookup order-
      independent: bee+clover == clover+bee. keys are used in
      discoveredRecipes Set and manual discovery tracking.
    inputs:
      - 'two definitionIds'
    outputs:
      - "sorted key string (e.g. 'bee+clover')"
    state_changes: []
    determinism: deterministic

  - id: find-recipe
    description: >
      findRecipe(a, b) searches the RECIPES array for a recipe
      matching both ingredient definitionIds in either order. returns
      the Recipe or null if no match.
    inputs:
      - 'two item definitionIds'
    outputs:
      - 'Recipe | null'
    state_changes: []
    determinism: deterministic

  - id: check-combine
    description: >
      checkCombine detects what happens when a dragged item overlaps
      exactly one item in a container. builds occupancy grid, finds
      overlapped items. if exactly one overlap: checks if target is
      an omnibox (returns store result, takes priority), then checks
      findRecipe. returns one of: recipe (with isDiscovered flag),
      store (omnibox uid), no-recipe, or none.
    inputs:
      - 'container, draggedItem, rotation, gridX, gridY, sourceContainerId, containerId, discoveredRecipes'
    outputs:
      - "CheckCombineResult: { kind: 'recipe' | 'store' | 'no-recipe' | 'none' }"
    state_changes: []
    determinism: deterministic

  - id: execute-combine
    description: >
      executeCombine in drag.ts runs the recipe's execute function.
      on success: adds recipe key to discoveredRecipes, records
      manual discovery (recipe:<key>), removes consumed ingredients
      from their containers. preserveIngredient items are kept.
      returns success or failed.
    inputs:
      - 'GameState, sourceContainer, targetContainer, draggedItem, combineTarget'
    outputs:
      - "CombineResult: { outcome: 'success' | 'failed' }"
    state_changes:
      - field: discoveredRecipes
        effect: 'recipe key added to set'
      - field: manualDiscoveries
        effect: 'recipe:<key> recorded'
      - field: backpack
        effect: 'consumed ingredients removed (preserveIngredient kept)'
    determinism: deterministic

  - id: prairie-recipe-execute
    description: >
      bee+clover prairie recipe plants TileType.Clover in a 3x3
      area around the player (on Dirt, Clover, or CaveFloor tiles).
      clears cloverLifecycle entries for overwritten tiles. spawns a
      bee ECS entity at player position. excludes CaveEntrance tiles.
      fails if player is standing on Sand or non-walkable tile.
    inputs:
      - 'GameState with player on walkable non-Sand tile'
    outputs:
      - 'boolean: true if planting succeeded'
    state_changes:
      - field: map
        effect: '3x3 area around player set to TileType.Clover (walkable tiles only)'
      - field: cloverLifecycle
        effect: 'entries deleted for overwritten positions'
      - field: world
        effect: 'bee ECS entity created with Position, EntityTag, EntityZone'
    determinism: deterministic

  - id: omnibox-recipe-execute
    description: >
      meteorite+permacomputer omnibox recipe creates a new omnibox
      item in the backpack. creates container via
      createOmniboxContainer, finds fit position, places item.
      permacomputer is preserved via preserveIngredient. fails if
      backpack has no room for the 2x2 omnibox shape.
    inputs:
      - 'GameState with room in backpack'
    outputs:
      - 'boolean: true if omnibox was created'
    state_changes:
      - field: backpack
        effect: 'omnibox item placed'
      - field: omniboxContainers
        effect: 'new 5x5 container registered'
      - field: nextOmniboxNumber
        effect: 'incremented by 1'
    determinism: deterministic

  - id: combine-icon-display
    description: >
      combineIcon returns the glyph shown on grid cells during drag
      overlap. undiscovered recipes show '?'. discovered macro recipes
      show '!'. discovered craft recipes show resultIcon (or '!' if
      no icon defined).
    inputs:
      - 'recipe, isDiscovered'
    outputs:
      - "string: '?' | '!' | resultIcon"
    state_changes: []
    determinism: deterministic

  - id: combine-bee-and-clover
    description: >
      combineBeeAndClover is a convenience function for auto-combining.
      searches backpack and open container for bee and clover items.
      validates standing tile (rejects Sand, non-walkable). removes
      both items from their containers and executes the prairie recipe.
    inputs:
      - 'GameState with bee and clover items in inventory'
    outputs:
      - 'boolean: true if combine succeeded'
    state_changes:
      - field: backpack
        effect: 'bee and clover items removed'
      - field: map
        effect: '3x3 clover planted around player'
      - field: world
        effect: 'bee entity spawned'
    determinism: deterministic

edge_cases:
  - id: preserve-ingredient
    description: 'combining meteorite+permacomputer consumes meteorite but keeps permacomputer'
    expected: 'permacomputer remains in backpack, meteorite removed'
  - id: combine-on-sand
    description: 'player combines bee+clover while standing on sand tile'
    expected: 'recipe.execute returns false, no items consumed'
  - id: bidirectional-lookup
    description: 'findRecipe(bee, clover) and findRecipe(clover, bee) return same recipe'
    expected: 'same Recipe object returned regardless of argument order'
  - id: omnibox-store-priority
    description: 'dragging an item onto an omnibox item when a recipe also exists'
    expected: 'store action takes priority over recipe combine'
  - id: backpack-full-craft
    description: 'omnibox recipe executes but backpack has no room for 2x2 item'
    expected: 'recipe returns false, no items consumed'
  - id: cave-entrance-excluded
    description: 'prairie recipe planted near a cave entrance tile'
    expected: 'CaveEntrance tile is never overwritten by clover planting'

failure_conditions:
  - trigger: 'No recipe exists for the two dragged items'
    expected: "checkCombine returns { kind: 'no-recipe' }"
  - trigger: 'Recipe execute fails (bad standing tile, full backpack)'
    expected: 'executeCombine returns failed, discoveredRecipes not updated, items not consumed'

verification:
  test_file: src/engine/__tests__/recipes.test.ts
  test_pattern: 'recipe'
  command: 'npx vitest run src/engine/__tests__/recipes.test.ts'
