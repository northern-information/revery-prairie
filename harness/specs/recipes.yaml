id: recipes
name: 'Recipes and combining'
priority: high
layer: engine
source_files:
  - src/engine/recipes.ts
  - src/engine/combine.ts
  - src/engine/drag.ts
  - src/engine/types.ts
dependencies:
  - player-movement

behaviors:
  - id: recipe-definitions
    description: >
      RECIPES array defines drag-and-drop item combinations. each recipe
      has ingredients (two definitionIds), kind (macro or craft),
      resultName, optional resultIcon, description, optional preview
      function, and execute function. current recipes: bee+clover=prairie
      (macro, plants 3x3 clover, spawns bee).
    inputs:
      - 'RECIPES array'
    outputs:
      - 'Recipe objects with ingredients, kind, execute'
    state_changes: []
    determinism: deterministic

  - id: recipe-key-generation
    description: >
      recipe keys are generated by sorting ingredient definitionIds
      alphabetically and joining with +. this makes lookup order-
      independent: bee+clover == clover+bee. keys are used in
      discoveredRecipes Set and manual discovery tracking.
    inputs:
      - 'two definitionIds'
    outputs:
      - "sorted key string (e.g. 'bee+clover')"
    state_changes: []
    determinism: deterministic

  - id: find-recipe
    description: >
      findRecipe(a, b) searches the RECIPES array for a recipe
      matching both ingredient definitionIds in either order. returns
      the Recipe or null if no match.
    inputs:
      - 'two item definitionIds'
    outputs:
      - 'Recipe | null'
    state_changes: []
    determinism: deterministic

  - id: check-combine
    description: >
      checkCombine detects what happens when a dragged item overlaps
      exactly one item in a container. builds occupancy grid, finds
      overlapped items. if exactly one overlap: checks findRecipe.
      returns one of: recipe (with isDiscovered flag), no-recipe,
      or none.
    inputs:
      - 'container, draggedItem, gridX, gridY, sourceContainerId, containerId, discoveredRecipes'
    outputs:
      - "CheckCombineResult: { kind: 'recipe' | 'no-recipe' | 'none' }"
    state_changes: []
    determinism: deterministic

  - id: execute-combine
    description: >
      executeCombine in drag.ts runs the recipe's execute function.
      accepts an optional time parameter. on success: adds recipe
      key to discoveredRecipes, records manual discovery (recipe:<key>),
      removes both consumed ingredients from their containers, spawns
      a pickupBloom at the player position when time is provided
      (per universal-pickup-bloom convention), and triggers the
      steward seal sequence when the recipe is the bee+clover prairie
      and the overworld combine seal conditions hold (see
      main-questline-foundation:combine-seal-overworld). returns
      success or failed.
    inputs:
      - 'GameState, sourceContainer, targetContainer, draggedItem, combineTarget, optional time'
    outputs:
      - "CombineResult: { outcome: 'success' | 'failed' }"
    state_changes:
      - field: discoveredRecipes
        effect: 'recipe key added to set'
      - field: manualDiscoveries
        effect: 'recipe:<key> recorded'
      - field: backpack
        effect: 'consumed ingredients removed'
      - field: world
        effect: 'pickupBloom entity spawned at player position when time is provided'
      - field: '(steward seal side effects)'
        effect: 'when isStewardSealRecipe returns true and overworld conditions hold, triggerStewardSeal fires per main-questline-foundation:combine-seal-overworld'
    determinism: deterministic

  - id: prairie-recipe-execute
    description: >
      bee+clover prairie recipe plants TileType.Clover in a 3x3
      area around the player (on Dirt, Clover, or CaveFloor tiles).
      clears cloverLifecycle entries for overwritten tiles. spawns a
      bee or monarch ECS entity at the player position via
      spawnBeeOrMonarch (per monarch-butterfly spec, a monarch may
      spawn instead of a bee while it is raining). fails if the
      player is standing on a non-walkable tile, on Sand, or on a
      pond/river tile, or if any tile in the 3x3 area is a pond/river
      (water rejection prevents planting clover into water bodies).
      CaveEntrance tiles are not allowed as planting targets — the
      tile-type allowlist (Dirt | Clover | CaveFloor) excludes them
      by construction.
    inputs:
      - 'GameState with player on walkable non-Sand non-water tile'
    outputs:
      - 'boolean: true if planting succeeded'
    state_changes:
      - field: map
        effect: '3x3 area around player set to TileType.Clover (Dirt/Clover/CaveFloor tiles only; CaveEntrance and pond/river tiles skipped)'
      - field: cloverLifecycle
        effect: 'entries deleted for overwritten positions'
      - field: world
        effect: 'bee or monarch ECS entity created via spawnBeeOrMonarch with Position, EntityTag, EntityZone, HungerTimer'
    determinism: deterministic

  - id: combine-icon-display
    description: >
      combineIcon returns the glyph shown on grid cells during drag
      overlap. undiscovered recipes show '?'. discovered macro recipes
      show '!'. discovered craft recipes show resultIcon (or '!' if
      no icon defined).
    inputs:
      - 'recipe, isDiscovered'
    outputs:
      - "string: '?' | '!' | resultIcon"
    state_changes: []
    determinism: deterministic

  - id: combine-from-backpack
    description: >
      combineFromBackpack(state, defIdA, defIdB, time?) is a generic
      auto-combine helper. resolves the recipe via findRecipe.
      validates standing tile (rejects Sand, non-walkable). removes
      one instance of each ingredient from backpack and executes the
      matched recipe. when time is provided, fires triggerStewardSeal
      after a successful steward-seal recipe (bee+clover) so the
      overworld combine seal sequence runs uniformly whether the
      combine originated from drag-and-drop or auto-combine. contains
      no recipe-specific logic beyond the steward-seal hook routed
      through isStewardSealRecipe.
    inputs:
      - 'GameState, two ingredient definitionIds matching a registered recipe, optional time'
    outputs:
      - 'boolean: true if combine succeeded'
    state_changes:
      - field: backpack
        effect: 'one instance of each ingredient removed'
      - field: '*'
        effect: 'whatever the matched recipe.execute mutates'
      - field: '(steward seal side effects)'
        effect: 'triggerStewardSeal fires when isStewardSealRecipe is true and time is provided, per main-questline-foundation:combine-seal-overworld'
    determinism: deterministic

  - id: steward-seal-detection
    description: >
      isStewardSealRecipe(definitionIdA, definitionIdB) returns true
      iff the unordered pair matches the bee+clover prairie recipe.
      executeCombine and combineFromBackpack both consult this
      helper after a successful combine, and only trigger the
      steward-seal sequence when it returns true and the
      overworld/quest preconditions in
      main-questline-foundation:combine-seal-overworld hold. the
      function is exported so the recipe layer can keep its
      no-recipe-specific-logic invariant while still routing the
      single quest hook centrally.
    inputs:
      - 'two ingredient definitionIds (any order)'
    outputs:
      - 'boolean: true iff the pair is bee+clover'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: combine-on-sand
    description: 'player combines bee+clover while standing on sand tile'
    expected: 'recipe.execute returns false, no items consumed'
  - id: combine-on-water
    description: 'player combines bee+clover while standing on a pond or river tile'
    expected: 'recipe.execute returns false, no items consumed, no clover planted'
  - id: combine-with-water-in-radius
    description: 'player stands on dirt but a pond/river tile sits inside the 3x3 planting area'
    expected: 'recipe.execute returns false, no items consumed — the water-tile check rejects the whole area'
  - id: unknown-pair
    description: 'combineFromBackpack called with two ingredient IDs that have no registered recipe'
    expected: 'returns false; no items consumed'
  - id: bidirectional-lookup
    description: 'findRecipe(bee, clover) and findRecipe(clover, bee) return same recipe'
    expected: 'same Recipe object returned regardless of argument order'
  - id: cave-entrance-excluded
    description: 'prairie recipe planted near a cave entrance tile'
    expected: 'CaveEntrance tile is never overwritten by clover planting'

failure_conditions:
  - trigger: 'No recipe exists for the two dragged items'
    expected: "checkCombine returns { kind: 'no-recipe' }"
  - trigger: 'Recipe execute fails (bad standing tile)'
    expected: 'executeCombine returns failed, discoveredRecipes not updated, items not consumed'

verification:
  test_file: src/engine/__tests__/recipes.test.ts
  test_pattern: 'recipe'
  command: 'npx vitest run src/engine/__tests__/recipes.test.ts'
