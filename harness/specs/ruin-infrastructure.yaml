id: ruin-infrastructure
name: 'Ruin zone infrastructure'
status: planned
priority: high
layer: engine
source_files:
  - src/engine/types.ts
  - src/engine/ruins.ts
  - src/engine/items.ts
  - src/engine/state.ts
  - src/engine/constants.ts
  - src/engine/position.ts
  - src/engine/renderer.ts
  - src/engine/gameLoop.ts
  - src/engine/ecs/types.ts
  - src/engine/cave.ts
  - src/engine/manual.ts
  - src/components/Sidebar.tsx
dependencies:
  - persistent-dual-zone
  - cave-breakable-wall

behaviors:
  - id: zone-type-extension
    description: >
      Zone const object in types.ts gains a third value: Ruin: 'ruin'.
      GameState gains currentRuinIndex: number | null (null when not
      inside a ruin). EntityZone ECS component data gains optional
      ruinIndex?: number field. A helper isInCurrentZone(state, eid)
      compares zone and ruinIndex for entity filtering.
    inputs:
      - 'zone system initialization'
    outputs:
      - 'Zone.Ruin available as zone value'
      - 'currentRuinIndex tracks which ruin the player is in'
    state_changes:
      - field: currentRuinIndex
        effect: 'set to ruin index on enter, null on exit'
    determinism: deterministic

  - id: ruin-tile-types
    description: >
      TileType gains three base ruin types: RuinFloor ('ruinFloor'),
      RuinWall ('ruinWall'), RuinEntrance ('ruinEntrance'). RuinFloor
      and RuinEntrance are walkable. RuinWall is not walkable.
      TILE_CHARS and TILE_COLORS in constants.ts map each type to a
      char and color. RuinFloor: '.', #7A7A6E. RuinWall: '#', #555555.
      RuinEntrance: 'O', #C9A040.
    inputs:
      - 'tile rendering and walkability checks'
    outputs:
      - 'three new tile types recognized by renderer and position utils'
    state_changes: []
    determinism: deterministic

  - id: ruin-interior-type
    description: >
      RuinInterior interface stores per-ruin data: ruinIndex (index
      into civilizationRuins[]), archetype (RuinArchetype), name
      (from CivilizationRuin.name), map (Tile[][]), mapWidth, mapHeight,
      entranceOverworld (Position), entranceInterior (Position),
      explored (boolean), cleared (boolean), archetypeData (union of
      per-archetype data types). RuinArchetype const object defines
      four values: Subsidence, DormantGarden, HauntedThreshold,
      Resonance. GameState gains ruinInteriors: RuinInterior[].
    inputs:
      - 'ruin generation during createGameState'
    outputs:
      - 'array of RuinInterior stored on GameState'
    state_changes:
      - field: ruinInteriors
        effect: 'populated during createGameState from civilizationRuins data'
    determinism: deterministic

  - id: archetype-assignment
    description: >
      assignArchetype(ruin, ruinIndex, rng) deterministically picks an
      archetype based on ruin genesis properties. larger radius + higher
      age favors Subsidence. many aqueductPaths favors DormantGarden.
      smaller radius + moderate age favors HauntedThreshold. large
      radius + few buildingFootprints relative to area favors Resonance.
      position hash via tileHash(ruin.position.x, ruin.position.y)
      adds noise to break ties. same seed always produces same assignment.
    inputs:
      - 'CivilizationRuin data, ruinIndex, seeded rng'
    outputs:
      - 'RuinArchetype value'
    state_changes: []
    determinism: deterministic

  - id: ruin-interior-generation
    description: >
      generateRuinInterior(ruin, ruinIndex, archetype, rng) creates a
      RuinInterior. map dimensions scale with radius: width = radius * 8
      + 10, height = radius * 6 + 8. shared generation steps: fill grid
      with RuinWall, place RuinEntrance at bottom center, carve landing
      area (3 wide, 2 tall of RuinFloor), carve main passage upward
      via random waypoints (reusing corridor carving pattern from
      cave.ts). rng seeded from tileHash(ruin.position.x,
      ruin.position.y) via mulberry32 for determinism. dispatches to
      per-archetype generator for layout specifics.
    inputs:
      - 'CivilizationRuin, ruinIndex, archetype, seeded rng'
    outputs:
      - 'RuinInterior with fully generated map'
    state_changes: []
    determinism: deterministic

  - id: overworld-entrance-placement
    description: >
      during createGameState, after generating ruin interiors, place
      RuinEntrance tiles on the overworld map at each ruin's position.
      skip placement if tile is already CaveEntrance. the entrance
      tile replaces whatever terrain tile was there (dirt, clover, etc).
    inputs:
      - 'createGameState with genesisResult containing ruins'
    outputs:
      - 'RuinEntrance tiles on overworld at ruin positions'
    state_changes:
      - field: map
        effect: 'tiles at ruin positions set to RuinEntrance'
    determinism: deterministic

  - id: enter-ruin-transition
    description: >
      enterRuin(state, ruinIndex) follows the cave transition pattern.
      swaps state.map to ruinInteriors[ruinIndex].map. sets mapWidth
      and mapHeight from the interior. sets currentZone to Zone.Ruin.
      sets currentRuinIndex to ruinIndex. places player at
      entranceInterior position offset by -1 in y. clears: path,
      pathWaypoints, pendingAction, pendingInteractionTarget,
      heldDirection, previewFn, facingEntityPos, activeDialog, trail,
      cloverGrowthPreviews. calls transitionCoyoteToZone. sets
      explored to true on the RuinInterior. records discovery for
      zone:ruin-{ruinIndex}. emits an archetype-specific entry toast
      (see ruin-collapse-trap-and-ejection ruin-entry-toast).
    inputs:
      - 'player steps on RuinEntrance tile while in overworld'
    outputs:
      - 'map swapped to ruin interior, player repositioned'
    state_changes:
      - field: map
        effect: 'swapped to ruin interior map'
      - field: mapWidth
        effect: 'set to ruin interior width'
      - field: mapHeight
        effect: 'set to ruin interior height'
      - field: currentZone
        effect: 'set to Zone.Ruin'
      - field: currentRuinIndex
        effect: 'set to ruin index'
      - field: player
        effect: 'repositioned to ruin entrance interior'
      - field: path
        effect: 'set to null'
      - field: pathWaypoints
        effect: 'set to empty array'
      - field: pendingAction
        effect: 'set to null'
      - field: trail
        effect: 'set to empty array'
      - field: manualDiscoveries
        effect: 'zone:ruin-{index} recorded'
    determinism: deterministic

  - id: exit-ruin-transition
    description: >
      exitRuin(state) restores overworld map. sets currentZone to
      Zone.Overworld. sets currentRuinIndex to null. places player
      one tile south of entranceOverworld. clears same navigation
      state as enterRuin. calls transitionCoyoteToZone with Overworld.
    inputs:
      - 'player steps on RuinEntrance tile while inside a ruin'
    outputs:
      - 'map swapped back to overworld, player repositioned'
    state_changes:
      - field: map
        effect: 'swapped to overworld map'
      - field: currentZone
        effect: 'set to Zone.Overworld'
      - field: currentRuinIndex
        effect: 'set to null'
      - field: player
        effect: 'repositioned south of overworld entrance'
    determinism: deterministic

  - id: ruin-transition-detection
    description: >
      checkRuinTransition(state) detects when the player stands on a
      RuinEntrance tile. if currentZone is Overworld, finds the
      matching ruinInterior by entranceOverworld position and calls
      enterRuin. if currentZone is Ruin, calls exitRuin. returns
      boolean indicating if a transition occurred. wired into the
      existing checkTransition call chain in cave.ts.
    inputs:
      - 'player position on RuinEntrance tile'
    outputs:
      - 'boolean: true if transition occurred'
    state_changes: []
    determinism: deterministic

  - id: multilayer-ruin-rendering
    description: >
      when currentZone is Zone.Ruin, the renderer uses a multilayer
      drawing path matching the genesis civilization visual style.
      getRuinTileLayers(tileType, x, y) returns an array of
      { char, color, dx, dy } layers. uses BUILDING_CHARS and
      CIV_COLORS palettes from genesis. tileHash(x, y) selects
      chars and colors per tile for deterministic variety. RuinWall
      tiles render 2-3 layers of building chars in grays with pixel
      offsets. RuinFloor tiles render 1-2 layers with debris dots.
      RuinEntrance renders amber O with subtle offset glyph.
      overworld overlays (rain, glinting, weather) are suppressed
      in ruin zones. out-of-bounds rendering uses dark void (no stars),
      same as cave zone.
    inputs:
      - 'renderer drawing ruin zone tiles'
    outputs:
      - 'multilayer ASCII composited per tile cell'
    state_changes: []
    determinism: deterministic

  - id: game-loop-ruin-zone
    description: >
      TickSystem.zone type extended to include 'ruin'. tick systems
      registered with zone 'ruin' are only executed when
      currentRuinIndex is not null. when player is not in a ruin,
      ruin zone systems are skipped entirely.
    inputs:
      - 'game loop tick cycle'
    outputs:
      - 'ruin tick systems execute only when inside a ruin'
    state_changes: []
    determinism: deterministic

  - id: seed-item-definitions
    description: >
      three seed items added to ITEM_DEFINITIONS in items.ts.
      wildflowerSeeds (Seed, glyph centered dot, orchid),
      tallGrassSeeds (Seed, glyph centered dot, dark sea green),
      milkweedSeeds (Seed, glyph centered dot, wheat). each has
      MANUAL_LORE entry with lore 'TODO'. ItemCategory gains
      Seed: 'seed'. itemCategoryToManualCategory maps Seed to
      ManualCategory.Flora. items have no description field —
      all player-facing text lives in MANUAL_LORE.
    inputs:
      - 'item system initialization'
    outputs:
      - 'three new item definitions available'
    state_changes: []
    determinism: deterministic

  - id: artifact-item-definitions
    description: >
      two artifact items added to ITEM_DEFINITIONS. stoneTablet
      (Artifact category, glyph small square, sandstone tan),
      aqueductKey (Tool category, glyph dagger, copper). each has
      MANUAL_LORE entry with lore 'TODO'. ItemCategory gains
      Artifact: 'artifact'. itemCategoryToManualCategory maps
      Artifact to ManualCategory.Object. items have no description
      field — all player-facing text lives in MANUAL_LORE.
    inputs:
      - 'item system initialization'
    outputs:
      - 'two new item definitions available'
    state_changes: []
    determinism: deterministic

  - id: sidebar-ruin-info
    description: >
      when currentZone is Zone.Ruin, the sidebar shows the ruin name.
      new tile types mapped to human-readable labels: RuinFloor shows
      'ruin floor', RuinWall shows 'ruin wall', RuinEntrance shows
      'ruin entrance'. follows existing tile label pattern in
      Sidebar.tsx.
    inputs:
      - 'cursor hovering over ruin zone tiles'
    outputs:
      - 'human-readable labels in sidebar contents'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: ruin-entrance-on-cave-entrance
    description: 'ruin entrance placement skips tiles already occupied by CaveEntrance'
    expected: 'RuinEntrance not placed, ruin has no overworld entrance'

  - id: no-genesis-data
    description: 'createGameState called without genesisResult (test fallback path)'
    expected: 'ruinInteriors is empty array, no RuinEntrance tiles placed'

  - id: ruin-entrance-on-space-or-sand
    description: 'civilization ruin position lands on space or sand border tile'
    expected: 'RuinEntrance still placed — ruin positions come from genesis land mask so this should not happen, but if it does the entrance is still walkable'

  - id: coyote-transition-to-ruin
    description: 'coyote follows player into ruin via transitionCoyoteToZone'
    expected: 'coyote repositioned to ruin entrance interior, EntityZone updated to Zone.Ruin with ruinIndex'

  - id: multiple-ruin-entries-same-session
    description: 'player enters ruin A, exits, enters ruin B'
    expected: 'currentRuinIndex correctly tracks each ruin, maps swap correctly, no state leakage between ruins'

failure_conditions:
  - trigger: 'player enters ruin with currentRuinIndex already set (should not happen)'
    expected: 'enterRuin overwrites with new index, previous ruin state preserved in ruinInteriors array'

  - trigger: 'exitRuin called when not in a ruin (currentRuinIndex is null)'
    expected: 'no-op, returns false'

  - trigger: 'ruinInteriors array is empty but RuinEntrance tile exists on map'
    expected: 'checkRuinTransition finds no matching ruin, returns false, player walks over tile normally'

verification:
  test_file: src/engine/__tests__/ruins.test.ts
  test_pattern: 'ruin infrastructure'
  command: 'npx vitest run src/engine/__tests__/ruins.test.ts'
