id: ruin-infrastructure
name: 'Ruin zone infrastructure'
priority: high
layer: engine
source_files:
  - src/engine/types.ts
  - src/engine/ruins.ts
  - src/engine/items.ts
  - src/engine/state.ts
  - src/engine/constants.ts
  - src/engine/position.ts
  - src/engine/renderer.ts
  - src/engine/gameLoop.ts
  - src/engine/ecs/types.ts
  - src/engine/cave.ts
  - src/engine/manual.ts
dependencies:
  - persistent-dual-zone
  - cave-breakable-wall
  - wide-exits

behaviors:
  - id: zone-type-extension
    description: >
      Zone const object in types.ts gains a third value: Ruin: 'ruin'.
      GameState gains currentRuinIndex: number | null (null when not
      inside a ruin). EntityZone ECS component data gains optional
      ruinIndex?: number field. A helper isInCurrentZone(state, eid)
      compares zone and ruinIndex for entity filtering.
    inputs:
      - 'zone system initialization'
    outputs:
      - 'Zone.Ruin available as zone value'
      - 'currentRuinIndex tracks which ruin the player is in'
    state_changes:
      - field: currentRuinIndex
        effect: 'set to ruin index on enter, null on exit'
    determinism: deterministic

  - id: ruin-tile-types
    description: >
      TileType gains four base ruin types: RuinFloor ('ruinFloor'),
      RuinWall ('ruinWall'), RuinEntrance ('ruinEntrance'), and
      RuinApron ('ruinApron'). RuinFloor, RuinEntrance, and RuinApron
      are walkable. RuinWall is not walkable. TILE_CHARS and
      TILE_COLORS in constants.ts map each type to a char and color.
      RuinFloor: '.', #7A7A6E. RuinWall: '#', #555555. RuinEntrance:
      'O', #5FD3BC (verdigris — chosen so the entrance reads against
      the warm prairie palette of dirt, sand, and clover). RuinApron:
      '·', #6B5E47 (a dusty stone-tint of dirt — reads as eroded
      platform fill that frames the entrance without competing with
      the verdigris O). RuinApron behaves like dirt for the cursor info
      label ("ruin apron"), clover growth (not allowed — apron is
      ruin), and pathfinding.
    inputs:
      - 'tile rendering and walkability checks'
    outputs:
      - 'four new tile types recognized by renderer and position utils'
    state_changes: []
    determinism: deterministic

  - id: ruin-interior-type
    description: >
      RuinInterior interface stores per-ruin data: ruinIndex (index
      into civilizationRuins[]), archetype (RuinArchetype, always
      DormantGarden — kept as a typed field for save-format stability
      and possible future archetypes), name (from CivilizationRuin.name),
      map (Tile[][]), mapWidth, mapHeight, entranceOverworld (Position),
      entranceInterior (Position), explored (boolean), cleared (boolean),
      dormantGarden (DormantGardenData). RuinArchetype const object
      defines a single value: DormantGarden ('dormantGarden'). GameState
      gains ruinInteriors: RuinInterior[]. previously-defined per-archetype
      data fields (subsidence, hauntedThreshold, resonance) are removed
      from the interface.
    inputs:
      - 'ruin generation during createGameState'
    outputs:
      - 'array of RuinInterior stored on GameState'
    state_changes:
      - field: ruinInteriors
        effect: 'populated during createGameState from civilizationRuins data'
    determinism: deterministic

  - id: archetype-assignment
    description: >
      assignArchetype(ruin, ruinIndex, rng) returns DormantGarden
      unconditionally. the function is retained as the single entry
      point so callers do not need to be rewritten and so future
      archetypes can be reintroduced without churn. takes the same
      arguments as before; ignores them.
    inputs:
      - 'CivilizationRuin data, ruinIndex, seeded rng'
    outputs:
      - 'RuinArchetype value (always DormantGarden)'
    state_changes: []
    determinism: deterministic

  - id: ruin-interior-generation
    description: >
      generateRuinInterior(ruin, ruinIndex, archetype, rng) creates a
      RuinInterior. map dimensions scale with radius at 3x the previous
      defaults: width = radius * 24 + 30, height = radius * 18 + 24.
      shared generation steps: fill grid with RuinWall, place a
      5-tile-wide row of RuinExit tiles at the bottom center
      (replacing the single RuinEntrance — see wide-exits spec), carve
      landing area (3 wide, 2 tall of RuinFloor) above the exit row.
      entranceInterior remains one tile north of the center exit tile.
      rng seeded from tileHash(ruin.position.x, ruin.position.y) via
      mulberry32 for determinism. delegates the bulk of layout to
      generateDormantGarden (the sole per-archetype generator).
    inputs:
      - 'CivilizationRuin, ruinIndex, archetype, seeded rng'
    outputs:
      - 'RuinInterior with fully generated map'
    state_changes: []
    determinism: deterministic

  - id: overworld-entrance-placement
    description: >
      during createGameState, after generating ruin interiors, place
      RuinEntrance tiles on the overworld map at each ruin's position.
      skip placement if tile is already CaveEntrance. the entrance
      tile replaces whatever terrain tile was there (dirt, clover, etc).
    inputs:
      - 'createGameState with genesisResult containing ruins'
    outputs:
      - 'RuinEntrance tiles on overworld at ruin positions'
    state_changes:
      - field: map
        effect: 'tiles at ruin positions set to RuinEntrance'
    determinism: deterministic

  - id: overworld-entrance-halo
    description: >
      when currentZone is Zone.Overworld, the renderer paints a 3x3
      backdrop fillRect (#2E1F12 deep umber) centered on every
      RuinEntrance tile before glyphs are drawn. the halo extends one
      tile in each direction (dx -1..+1, dy -1..+1) so the entrance
      reads as a doorway-in-shadow against the warm prairie palette.
      the halo is painted in a pre-pass after the earth-scan
      backgrounds and before the lightning targeting highlight, so
      glyphs (terrain, player, entities, cursor) draw cleanly on top
      and existing pre-pass overlays still composite correctly.
      the halo is suppressed inside ruin and cave zones — it is an
      overworld-only readability aid. cave entrances do not get a halo.
      tiles in the 3x3 footprint that fall outside map bounds, or on
      Space tiles, are skipped (no fillRect drawn there) so the halo
      never bleeds into the void.
    inputs:
      - 'renderer pre-pass while currentZone is Zone.Overworld'
      - 'one or more RuinEntrance tiles within the camera viewport'
    outputs:
      - '3x3 dark backdrop drawn around each visible RuinEntrance'
    state_changes: []
    determinism: deterministic

  - id: enter-ruin-transition
    description: >
      enterRuin(state, ruinIndex) follows the cave transition pattern.
      swaps state.map to ruinInteriors[ruinIndex].map. sets mapWidth
      and mapHeight from the interior. sets currentZone to Zone.Ruin.
      sets currentRuinIndex to ruinIndex. places player at
      entranceInterior position offset by -1 in y. clears: path,
      pathWaypoints, pendingAction, pendingInteractionTarget,
      heldDirection, previewFn, facingEntityPos, activeDialog, trail,
      cloverGrowthPreviews. calls transitionCoyoteToZone. sets
      explored to true on the RuinInterior. records discovery for
      zone:ruin-{ruinIndex}. emits a log entry naming the ruin and
      its dormant-garden character.
    inputs:
      - 'player is within Chebyshev distance 1 of a RuinEntrance tile while in overworld'
    outputs:
      - 'map swapped to ruin interior, player repositioned'
    state_changes:
      - field: map
        effect: 'swapped to ruin interior map'
      - field: mapWidth
        effect: 'set to ruin interior width'
      - field: mapHeight
        effect: 'set to ruin interior height'
      - field: currentZone
        effect: 'set to Zone.Ruin'
      - field: currentRuinIndex
        effect: 'set to ruin index'
      - field: player
        effect: 'repositioned to ruin entrance interior'
      - field: path
        effect: 'set to null'
      - field: pathWaypoints
        effect: 'set to empty array'
      - field: pendingAction
        effect: 'set to null'
      - field: trail
        effect: 'set to empty array'
      - field: manualDiscoveries
        effect: 'zone:ruin-{index} recorded'
    determinism: deterministic

  - id: exit-ruin-transition
    description: >
      exitRuin(state) restores overworld map. sets currentZone to
      Zone.Overworld. sets currentRuinIndex to null. places player
      2 tiles south of entranceOverworld (must be outside the 3x3
      overworld hitbox to prevent immediate re-entry — see wide-exits
      spec exit-placement-outside-hitbox). clears same navigation
      state as enterRuin. calls transitionCoyoteToZone with Overworld.
    inputs:
      - 'player steps on a RuinExit tile while inside a ruin'
    outputs:
      - 'map swapped back to overworld, player repositioned'
    state_changes:
      - field: map
        effect: 'swapped to overworld map'
      - field: currentZone
        effect: 'set to Zone.Overworld'
      - field: currentRuinIndex
        effect: 'set to null'
      - field: player
        effect: 'repositioned 2 tiles south of overworld entrance (outside 3x3 hitbox)'
    determinism: deterministic

  - id: ruin-transition-detection
    description: >
      checkRuinTransition(state) detects when the player should
      transition into or out of a ruin. if currentZone is Overworld,
      it iterates ruinInteriors and matches the player position
      against each entranceOverworld using Chebyshev distance ≤ 1
      (the 3x3 hitbox — see wide-exits spec) and calls enterRuin on
      the first match. if currentZone is Ruin, it returns true and
      calls exitRuin when the player stands on any RuinExit tile.
      wired into the existing checkTransition call chain in cave.ts.
    inputs:
      - 'player position on or adjacent to a RuinEntrance tile, or on a RuinExit tile'
    outputs:
      - 'boolean: true if transition occurred'
    state_changes: []
    determinism: deterministic

  - id: multilayer-ruin-rendering
    description: >
      when currentZone is Zone.Ruin, the renderer uses a multilayer
      drawing path matching the genesis civilization visual style.
      getRuinTileLayers(tileType, x, y) returns an array of
      { char, color, dx, dy } layers. uses BUILDING_CHARS and
      CIV_COLORS palettes from genesis. tileHash(x, y) selects
      chars and colors per tile for deterministic variety. RuinWall
      tiles render 2-3 layers of building chars in grays with pixel
      offsets. RuinFloor tiles render 1-2 layers with debris dots.
      RuinEntrance renders verdigris O with subtle offset glyph.
      overworld overlays (rain, glinting, weather) are suppressed
      in ruin zones. out-of-bounds rendering uses dark void (no stars),
      same as cave zone.
    inputs:
      - 'renderer drawing ruin zone tiles'
    outputs:
      - 'multilayer ASCII composited per tile cell'
    state_changes: []
    determinism: deterministic

  - id: game-loop-ruin-zone
    description: >
      TickSystem.zone type extended to include 'ruin'. tick systems
      registered with zone 'ruin' are only executed when
      currentRuinIndex is not null. when player is not in a ruin,
      ruin zone systems are skipped entirely.
    inputs:
      - 'game loop tick cycle'
    outputs:
      - 'ruin tick systems execute only when inside a ruin'
    state_changes: []
    determinism: deterministic

  - id: seed-item-definitions
    description: >
      three seed items added to ITEM_DEFINITIONS in items.ts.
      wildflowerSeeds (Seed, glyph centered dot, orchid),
      tallGrassSeeds (Seed, glyph centered dot, dark sea green),
      milkweedSeeds (Seed, glyph centered dot, wheat). each has
      MANUAL_LORE entry with lore 'TODO'. ItemCategory gains
      Seed: 'seed'. itemCategoryToManualCategory maps Seed to
      ManualCategory.Flora. items have no description field —
      all player-facing text lives in MANUAL_LORE.
    inputs:
      - 'item system initialization'
    outputs:
      - 'three new item definitions available'
    state_changes: []
    determinism: deterministic

  - id: artifact-item-definitions
    description: >
      two artifact items added to ITEM_DEFINITIONS. stoneTablet
      (Artifact category, glyph small square, sandstone tan),
      aqueductKey (Tool category, glyph dagger, copper). each has
      MANUAL_LORE entry with lore 'TODO'. ItemCategory gains
      Artifact: 'artifact'. itemCategoryToManualCategory maps
      Artifact to ManualCategory.Object. items have no description
      field — all player-facing text lives in MANUAL_LORE.
    inputs:
      - 'item system initialization'
    outputs:
      - 'two new item definitions available'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: ruin-entrance-on-cave-entrance
    description: 'ruin entrance placement skips tiles already occupied by CaveEntrance'
    expected: 'RuinEntrance not placed, ruin has no overworld entrance'

  - id: no-genesis-data
    description: 'createGameState called without genesisResult (test fallback path)'
    expected: 'ruinInteriors is empty array, no RuinEntrance tiles placed'

  - id: ruin-entrance-on-space-or-sand
    description: 'civilization ruin position lands on space or sand border tile'
    expected: 'RuinEntrance still placed — ruin positions come from genesis land mask so this should not happen, but if it does the entrance is still walkable'

  - id: coyote-transition-to-ruin
    description: 'coyote follows player into ruin via transitionCoyoteToZone'
    expected: 'coyote repositioned to ruin entrance interior, EntityZone updated to Zone.Ruin with ruinIndex'

  - id: multiple-ruin-entries-same-session
    description: 'player enters ruin A, exits, enters ruin B'
    expected: 'currentRuinIndex correctly tracks each ruin, maps swap correctly, no state leakage between ruins'

  - id: halo-near-map-edge
    description: 'RuinEntrance sits on or near the SPACE_BORDER edge so part of its 3x3 halo footprint falls on Space tiles or out of bounds'
    expected: 'halo cells outside bounds or on Space tiles are skipped — the visible portion of the halo still renders, no fillRect leaks into the starfield'

  - id: halo-overlapping-entrances
    description: 'two ruin entrances are placed within 2 tiles of each other so their 3x3 halos overlap'
    expected: 'overlapping cells get the same fillRect color drawn twice (idempotent) — visually identical to a single halo, no flicker or compositing artifact'

  - id: halo-with-cursor-on-entrance
    description: 'cursor hovers directly over a RuinEntrance tile'
    expected: 'no inversion is applied — the hover cursor highlight has been removed; halo paints as a pre-pass and the entrance cell renders normally with the surrounding 8 halo cells visible'

failure_conditions:
  - trigger: 'player enters ruin with currentRuinIndex already set (should not happen)'
    expected: 'enterRuin overwrites with new index, previous ruin state preserved in ruinInteriors array'

  - trigger: 'exitRuin called when not in a ruin (currentRuinIndex is null)'
    expected: 'no-op, returns false'

  - trigger: 'ruinInteriors array is empty but RuinEntrance tile exists on map'
    expected: 'checkRuinTransition finds no matching ruin, returns false, player walks over tile normally'

  - trigger: 'halo pre-pass runs in Zone.Ruin or Zone.Cave by mistake'
    expected: 'visual regression — dark backdrops appear inside interiors. the pre-pass must early-return when currentZone is not Zone.Overworld'

verification:
  test_file: src/engine/__tests__/ruins.test.ts
  test_pattern: 'ruin infrastructure'
  command: 'npx vitest run src/engine/__tests__/ruins.test.ts'
