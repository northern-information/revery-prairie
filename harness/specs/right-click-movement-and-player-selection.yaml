id: right-click-movement-and-player-selection
name: 'Right-click movement and NPC RTS commands'
priority: high
layer: integration
source_files:
  - src/engine/types.ts
  - src/engine/selection.ts
  - src/engine/unitCommands.ts
  - src/engine/renderer.ts
  - src/hooks/useMouse.ts
  - src/components/CommandPanel.tsx
  - src/harness/__tests__/serialization/schema.test.ts
dependencies:
  - rts-unit-selection
  - player-movement
  - pathfinding

behaviors:
  - id: player-not-mouse-selectable
    description: >
      the player is not a selectable unit. clicking the player's tile (left
      or right, with or without shift) never selects the player, never sets
      any selection flag, and never sets state.path. drag-selection
      rectangles that cover the player tile ignore the player and only
      select NPC controllable units within the rectangle. there is no
      playerSelected field on GameState.
    inputs:
      - "left or right click on the player's tile"
      - 'drag-select rectangle that covers the player tile'
    outputs:
      - 'no selection change attributable to the player'
      - 'state.path unchanged'
      - 'no command panel entry for the player'
    state_changes: []
    determinism: deterministic

  - id: player-not-mouse-movable
    description: >
      mouse input cannot initiate player movement on bare ground. plain
      right-click on an empty walkable tile (with no selection) does
      nothing. shift+right-click chaining is no longer available for the
      player. the player moves only via keyboard (WASD) or via the
      preserved click-to-interact pathfind (see left-click-interactable-
      pathfinds-player) which always targets an interactable, never empty
      ground.
    inputs:
      - 'right click on an empty walkable tile with no selection'
      - 'shift+right-click on any tile with no selection'
    outputs:
      - 'state.path is NOT set by the click'
      - 'no pendingAction queued'
    state_changes:
      - field: path
        effect: 'unchanged by bare right-click on empty ground'
      - field: pathIsChained
        effect: 'unchanged'
    determinism: deterministic

  - id: right-click-moves-selected-npc-units
    description: >
      right-clicking a walkable tile while one or more NPC units are
      selected issues a move command to each selected unit via
      unitCommands. the player is never affected. non-selected NPC units
      are unaffected. a move-order marker is rendered at the target tile.
    inputs:
      - 'right click on a walkable tile'
      - 'selectedUnits is non-empty'
    outputs:
      - 'NPC selected units begin pathfinding via unitCommands'
      - 'move-order marker rendered at target tile'
      - 'player is unaffected'
    state_changes:
      - field: unitCommands
        effect: 'move command queued for each selected NPC unit'
      - field: moveOrderMarkers
        effect: 'marker added with position and timestamp'
    determinism: deterministic

  - id: left-click-selects-npc-unit
    description: >
      left-clicking a tile occupied by an NPC controllable unit (coyote,
      gron) selects that unit. clicking the same single-selected unit
      deselects it. clicking a unit replaces the current selection. the
      player is never a selection target.
    inputs:
      - 'left click on a tile with an NPC controllable unit'
    outputs:
      - 'NPC unit selected (selectedUnits updated)'
    state_changes:
      - field: selectedUnits
        effect: 'set to the clicked NPC unit entity id; toggled off if was sole selection'
    determinism: deterministic

  - id: left-click-deselects-on-empty-tile
    description: >
      left-clicking on a non-unit, non-interactable tile with no drag
      deselects all NPC units. no player movement is initiated.
    inputs:
      - 'left click on an empty walkable tile with no drag'
    outputs:
      - 'all NPC selections cleared'
      - 'no player movement'
    state_changes:
      - field: selectedUnits
        effect: 'cleared to empty set'
    determinism: deterministic

  - id: left-click-interactable-pathfinds-player
    description: >
      left-clicking an interactable (character, clover, cave breakable
      wall, ruin door, ruin debris, angel body) pathfinds the player to
      the nearest adjacent walkable tile and queues pendingAction to
      execute the interaction on arrival. this is the only mouse path
      that moves the player, and it always targets an interactable —
      never empty ground.
    inputs:
      - 'left click on an interactable tile or entity'
      - 'no active drag'
    outputs:
      - 'player walks to adjacent tile and executes interaction on arrival'
    state_changes:
      - field: pendingAction
        effect: 'set to interaction callback'
      - field: path
        effect: 'set to A* path toward adjacent walkable tile'
      - field: pendingInteractionTarget
        effect: 'set to the interactable tile for highlight rendering'
    determinism: deterministic

  - id: drag-select-npc-units-only
    description: >
      left-click-drag draws a selection rectangle. on release, all NPC
      controllable units (coyote, gron) within the rectangle are added
      to selectedUnits. the player tile is ignored even if it falls
      within the rectangle. if no NPC units are within the box,
      selectedUnits is cleared.
    inputs:
      - 'left mouse down + drag (>= 3px) + release on canvas'
    outputs:
      - 'NPC units within rectangle selected'
      - 'selectedUnits cleared if no NPC units in rectangle'
      - 'player unaffected regardless of rectangle coverage'
    state_changes:
      - field: selectionBox
        effect: 'set during drag, cleared on release'
      - field: selectedUnits
        effect: 'set to NPC units within rectangle'
    determinism: deterministic

  - id: drag-release-does-not-move-player
    description: >
      releasing a drag-select never sets state.path or moves the player.
      left-click on bare ground does not move the player either, so drag
      release can only adjust NPC selection.
    inputs:
      - 'left mouse down + drag + release anywhere on canvas'
    outputs:
      - 'state.path is not set by drag release'
      - 'player does not begin walking'
    state_changes:
      - field: path
        effect: 'unchanged by drag-select completion'
    determinism: deterministic

  - id: command-panel-shows-npc-units-only
    description: >
      the command panel reflects only the NPC selectedUnits set. it never
      displays a player portrait or per-player command. an empty
      selectedUnits set hides the panel.
    inputs:
      - 'selectedUnits is non-empty'
    outputs:
      - 'command panel displayed with NPC portrait(s)'
    state_changes: []
    determinism: deterministic

  - id: lightning-targeting-remains-left-click
    description: >
      when state.targetingSlot is non-null (lightning revery active),
      left-click on a valid target tile casts lightning. right-click
      cancels targeting mode. unchanged from prior behavior.
    inputs:
      - 'state.targetingSlot is non-null'
      - 'left click on a valid lightning target tile'
    outputs:
      - 'lightning cast at tile; targetingSlot cleared'
    state_changes:
      - field: targetingSlot
        effect: 'cleared after cast'
    determinism: deterministic

  - id: context-menu-suppressed
    description: >
      the browser context menu is always suppressed on the canvas, since
      right-click is reserved for NPC unit commands and targeting cancel.
    inputs:
      - 'right click on canvas'
    outputs:
      - 'browser context menu does not appear'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: left-click-on-player-tile
    description: "Left click directly on the player's tile with no drag and no selection"
    expected: 'No-op — no selection, no movement, no path. Any prior NPC selection is preserved (player tile is not "empty ground" — it is occupied but unselectable).'
  - id: right-click-on-player-tile
    description: "Right click on the player's own tile with no selection"
    expected: 'No-op — no movement, no error.'
  - id: shift-right-click-on-empty-tile
    description: 'Shift + right click on empty walkable tile with no NPC selection'
    expected: 'No-op — waypoint chaining for the player no longer exists.'
  - id: drag-select-covers-player-only
    description: 'Drag-select rectangle covers the player tile but no NPC units'
    expected: 'selectedUnits cleared, player unaffected, no movement.'
  - id: drag-select-covers-player-and-npc
    description: 'Drag-select rectangle covers the player tile and an NPC unit'
    expected: 'selectedUnits set to the NPC unit only. Player unaffected.'
  - id: drag-under-threshold-acts-as-click
    description: 'Mouse movement under SELECTION_DRAG_THRESHOLD (3px) between mousedown and mouseup'
    expected: 'Treated as click — select/deselect NPC, or pathfind+interact, per left-click rules.'
  - id: right-click-on-non-walkable-non-interactable
    description: 'Right click on space, cave wall, or other non-walkable, non-interactable tile'
    expected: 'No movement, no command, no error.'
  - id: right-click-during-dialog
    description: 'Right click while a dialog is active'
    expected: 'No command issued; dialog remains active.'
  - id: right-click-with-npc-selected
    description: 'Right click on a walkable tile with one or more NPC units selected'
    expected: 'NPC units receive move commands; player is unaffected.'
  - id: left-click-interactable-during-npc-selection
    description: 'Left-click on an interactable while NPC units are selected'
    expected: 'NPC selection cleared; player pathfinds and interacts as before.'
  - id: cursor-info-still-shows-player
    description: 'Hover the cursor over the player tile'
    expected: 'Sidebar cursor-info displays the player as the tile occupant (hoverability is preserved; only mouse-click behavior is suppressed).'
  - id: lightning-cancel-via-right-click
    description: 'Right click while state.targetingSlot is non-null'
    expected: 'targetingSlot cleared, no movement issued.'

failure_conditions:
  - trigger: 'Drag-select release anywhere on canvas'
    expected: 'state.path is NOT set; player does NOT begin walking'
  - trigger: "Left or right click on the player's tile"
    expected: 'No selection change attributable to the player; state.path unchanged'
  - trigger: 'Bare right-click on empty walkable tile with no selection'
    expected: 'state.path is NOT set; no pendingAction'
  - trigger: 'Right click on non-walkable, non-interactable tile'
    expected: 'No pathfinding, no unitCommands, no error'
  - trigger: 'Right click during active dialog'
    expected: 'No movement; dialog remains active'

verification:
  test_file: src/engine/__tests__/selection.test.ts
  test_pattern: 'player-not-mouse|right-click|left-click deselect|drag-select'
  command: 'npx vitest run src/engine/__tests__/selection.test.ts'
