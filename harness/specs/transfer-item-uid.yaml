id: transfer-item-uid
name: 'transferItem preserves item uid'
priority: high
layer: engine
source_files:
  - src/engine/inventory.ts
dependencies:
  - inventory-management

behaviors:
  - id: transfer-preserves-uid
    description: >
      transferItem moves an item between containers while preserving
      the original ItemInstance uid. uses canPlace for validation,
      then removes the item from source, mutates its gridX/gridY
      in place, and pushes it into target.items. the same object
      reference with the same uid is transferred. this is critical
      for items whose identity is tracked by uid (e.g. glintingCoins).
    inputs:
      - 'source container, target container, uid, target position'
    outputs:
      - 'boolean: true if transfer succeeded'
    state_changes:
      - field: source.items
        effect: 'item removed via removeItem'
      - field: target.items
        effect: 'same ItemInstance (same uid) pushed with updated gridX/gridY'
    determinism: deterministic

  - id: transfer-rollback-preserves-uid
    description: >
      when target placement fails (canPlace returns false),
      transferItem returns false without removing from source.
      the original item stays in source with its uid intact.
    inputs:
      - 'transferItem where target has no room'
    outputs:
      - 'boolean: false, source unchanged'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: glinting-coin-transfer
    description: 'a glinting coin (uid in glintingCoins set) is transferred between containers.'
    expected: 'coin retains its uid. glintingCoins.has(uid) still returns true.'

failure_conditions:
  - trigger: 'transferItem generates a new uid for the placed item'
    expected: 'uid must be preserved from the original item. glintingCoins keyed by original uid would be orphaned otherwise.'

verification:
  test_file: src/engine/__tests__/inventory.test.ts
  test_pattern: 'transferItem'
  command: 'npx vitest run src/engine/__tests__/inventory.test.ts -t transferItem'
