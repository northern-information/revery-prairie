id: log-scroll-bug
name: Sidebar log scroll captured by canvas zoom
priority: high
layer: component
source_files:
  - src/components/Sidebar.tsx
  - src/components/GameCanvas.tsx
dependencies: []

behaviors:
  - id: log-scrolls-on-wheel
    description: Mouse wheel over the sidebar log section scrolls the log content vertically instead of zooming the game canvas
    inputs:
      - Mouse cursor is hovering over the sidebar log section
      - User scrolls the mouse wheel
    outputs:
      - The log div scrolls vertically through event history
      - The game canvas zoom level does not change
    state_changes: []
    determinism: deterministic

  - id: canvas-zooms-outside-log
    description: Mouse wheel over the game canvas (not over the log) continues to zoom the canvas as before
    inputs:
      - Mouse cursor is hovering over the game canvas area
      - User scrolls the mouse wheel
    outputs:
      - The game canvas zoom level changes
      - The log scroll position does not change
    state_changes:
      - field: state.zoom
        effect: Incremented or decremented by ZOOM_STEP
    determinism: deterministic

edge_cases:
  - id: log-empty
    description: When the event log is empty the log section is not rendered, so wheel events over that area zoom the canvas normally
    expected: Canvas zoom behavior unchanged
  - id: log-short-no-overflow
    description: When the log has few entries and no scrollbar, wheel events over the log area are captured but do not propagate to canvas zoom
    expected: Canvas zoom does not change even if log has nothing to scroll

failure_conditions:
  - trigger: Mouse wheel over the log section zooms the canvas instead of scrolling
    expected: Log scrolls vertically, canvas zoom unchanged

verification:
  test_file: src/components/__tests__/Sidebar.test.tsx
  test_pattern: log scroll
  command: npx vitest run src/components/__tests__/Sidebar.test.tsx
