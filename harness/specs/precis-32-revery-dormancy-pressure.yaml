id: precis-32-revery-dormancy-pressure
name: 'Revery dormancy pressure — forcing function (precis #32)'
priority: high
layer: engine
source_files:
  - src/engine/omen.ts
  - src/engine/revery.ts
  - src/engine/state.ts
  - src/engine/types.ts
  - src/engine/constants.ts
  - src/engine/characters.ts
  - src/engine/gameLoop.ts
  - src/engine/egregore/spread.ts
  - src/harness/__tests__/serialization/schema.test.ts
dependencies:
  - precis-4-the-revery
  - precis-8a-egregoric-thematic

# Doctrine reference: docs/precis-thinktank-v6.md rounds 1, 4, 5, 6.
# Backlog entry: docs/precis-status.yaml id '32'.
#
# v4 doctrine framed omens as direct triggers; v6 round 1 named the fragility —
# omen.ts is 5 gates and 3 OR'd predicates, all rare, evaluated only during
# Season.Autumn (≈0.5..0.75 of the seasonal phase). A single autumn can
# trivially roll zero hits, costing the player a year of Revery cadence with no
# diegetic explanation. The room's fix: a pressure accumulator with a linear
# ramp across autumn, ceilinged at the winter solstice. The Revery enters the
# steward when the pressure crosses threshold; the steward does not enter the
# Revery.
#
# Round 6 amendment (2026-05-22): the three existing omen variants (bee on
# shoulder, distant meteorite, cloud passing the sun) in `omen.ts:36-58` are
# RETIRED. They do not survive into this spec. The omen surface — the
# bounded-scalar contribution to dormancyPressure — is owned by precis-36 (The
# Revery Knot), which is not yet specced. Until precis-36 ships, the pressure-
# only ramp from autumn equinox to winter solstice carries autumns alone; the
# cosmology is internally consistent at each step (a stewardship that has not
# yet earned recognition). When precis-36 ships, pressure contributions arrive
# from the Revery Knot pickup event — a single, edge-triggered, item-shaped
# omen that meets the round 6 criteria (the prairie acts, the steward is the
# object; perceivable in session; earned by stewardship; per-edge; carries the
# steward's history).
#
# Design decisions locked 2026-05-22:
#   - Linear ramp baseline from autumn equinox (seasonalPhase 0.5) to winter
#     solstice (seasonalPhase 0.75). At solstice the floor reaches ceiling, so
#     the Revery is guaranteed within a year regardless of omen inputs.
#   - precis-36 (Revery Knot) owns the omen variant. This spec exposes a single
#     internal entry point — `contributeDormancyPressure(state, amount)` — that
#     precis-36 will call on Knot pickup. The function is exported but unused
#     by this spec's own behaviors; behavioral coverage of its use lives in
#     precis-36.
#   - Collapse-in-place summons: Revery enters from the steward's current tile;
#     a summons cue flag is set on ReveryState (consumed by future audio/render
#     work, no asset wiring here); Gron teleports to an adjacent walkable tile
#     (existing pickAdjacentWalkableTile from interaction.ts:542); Gron speaks
#     one new dialog constant GRON_DIALOG_SOLSTICE_SUMMONS (lore TODO per
#     feedback_no_write_lore); initiateRevery fires next frame from the
#     steward's tile. Gron remains adjacent for the Revery duration.
#   - The collapsed-steward tile renders in the dormant-flora visual register
#     during Observing (per v6 round 5). Closing-phase mutation: the steward's
#     tile commits to TileType.Egregore via the existing commitEgregoreTiles
#     pathway (one tile, deterministic, no new placement RNG). The prairie
#     metabolizes the spot the steward fell.
#   - REVERY_COOLDOWN_MS is retained as a belt-and-suspenders redundant guard;
#     pressure resets to 0 on Revery close.
#
# What this feature does NOT do:
#   - **Does not retain the three existing omen variants** (bee on shoulder,
#     distant meteorite, cloud passing the sun). They are deleted from
#     `omen.ts` by this spec. `omen.ts` is retained as a module but its body
#     becomes the pressure-tick function and the contribution entry point.
#   - **Does not author the Revery Knot omen variant.** That is precis-36's
#     scope. This spec exposes the contribution entry point; precis-36 wires
#     it.
#   - No persistent collapse-mark state beyond the egregoric tile committed at
#     Closing. The tile IS the mark.
#   - No new render passes. The dormant-flora register applied to the
#     collapsed-steward tile reuses existing dormancy treatment; egregoric
#     rendering uses existing TileType.Egregore pass.
#   - No new audio assets. "Full intensity" of the summons frame is a flag on
#     ReveryState consumed by future visual/audio work; this spec only sets it.
#   - No multiplayer-protocol changes.
#   - No tenure-end Kojima-shaped input hijack (reserved for #16).
#   - No little house, no Emily, no Revery Knot, no root cellar — those are
#     precis-33, precis-36, and precis-37.
#
# Schema note: precis-32's backlog summary referred to
# `state.player.dormancyPressure`, but `state.player` is a `Position` shape
# (types.ts:283). The field lands at the top level of GameState alongside
# reveryCount and cosmologicalDrift to match precedent.

behaviors:
  - id: dormancy-pressure-field
    description: >
      GameState gains a `dormancyPressure: number` field. Initialized to 0 by
      createGameState. Persisted through serialization; added to EXPECTED_FIELDS
      in schema.test.ts. Domain: [0, 1]; 1 represents the threshold ceiling.
      Resets to 0 at Revery close (Closing phase) and at the season transition
      Autumn → Winter without a Revery (safety reset). No per-omen-kind tracking
      is required by this spec — the omen surface is precis-36's scope; this
      spec only exposes a single contribution entry point.
    inputs:
      - 'createGameState invocation'
      - 'Revery transitions Summary → Closing'
      - 'season transitions from Autumn to Winter without a Revery firing (safety)'
    outputs:
      - 'GameState shape includes dormancyPressure (number)'
    state_changes:
      - field: dormancyPressure
        effect: 'initialized to 0; reset to 0 on Revery close and on Autumn → Winter without a Revery'
    determinism: deterministic

  - id: pressure-linear-ramp
    description: >
      Per-frame floor for dormancyPressure is computed from seasonalPhase. When
      seasonalPhase ∈ [0.5, 0.75] (autumn equinox to winter solstice), the
      floor is `(seasonalPhase - 0.5) / 0.25`, clamped to [0, 1]. Outside this
      window the floor is 0 (autumn has not begun) or 1 (past solstice).
      dormancyPressure is set to max(currentPressure, floor) every frame the
      ramp applies. Without any external contributions, the ramp alone carries
      dormancyPressure from 0 at the autumn equinox to 1 exactly at the winter
      solstice frame — guaranteeing the Revery within a year.
    inputs:
      - 'state.seasonalPhase value each frame'
      - 'state.dormancyPressure prior value'
    outputs:
      - 'state.dormancyPressure updated to max(prior, floor)'
    state_changes:
      - field: dormancyPressure
        effect: 'monotonically non-decreasing within an autumn; equals 1 at the winter solstice frame'
    determinism: deterministic

  - id: pressure-contribution-entry-point
    description: >
      The module exposes a single function `contributeDormancyPressure(state,
      amount)` that adds `amount` (a bounded non-negative scalar) to
      dormancyPressure, clamped to [0, 1]. The function is exported from
      `src/engine/omen.ts` and is intended to be called by precis-36 on the
      Revery Knot pickup event. This spec does not call the function itself;
      behavioral coverage of the call lives in precis-36. The function is
      verified here only by its existence and clamping semantics.
    inputs:
      - 'contributeDormancyPressure(state, amount) is called with a non-negative scalar'
    outputs:
      - 'state.dormancyPressure increased by amount, clamped to 1'
    state_changes:
      - field: dormancyPressure
        effect: 'increased by amount, clamped to 1'
    determinism: deterministic

  - id: threshold-trigger
    description: >
      When dormancyPressure crosses 1.0 (i.e. transitions from <1 to ==1) and
      no Revery is currently active, gameLoop schedules the Revery on the next
      frame by calling initiateRevery. Until precis-36 ships, the only path to
      threshold is the linear ramp reaching ceiling at the winter solstice
      frame; once precis-36 ships, contributions from the Revery Knot pickup
      can cross threshold earlier in autumn. The OmenKind passed to
      initiateRevery is a placeholder constant `OmenKind.CloudPassingSun` until
      precis-36 specifies the Revery Knot's own kind — the value is retained
      in the enum for back-compat with precis-4's ReveryState shape but is no
      longer surfaced to the player via the retired predicates.
    inputs:
      - 'state.dormancyPressure reaches 1.0 in the current frame'
      - 'state.revery is null'
    outputs:
      - 'initiateRevery called with a placeholder OmenKind'
      - 'state.revery transitions from null to ReveryState{ phase: Omen, ... }'
    state_changes:
      - field: revery
        effect: 'set from null to a fresh ReveryState; phase=Omen, summons=true'
      - field: revery.summons
        effect: 'new boolean field — true when the Revery was triggered by the pressure-ceiling path; documents intent'
    determinism: deterministic

  - id: summons-sequence
    description: >
      When a Revery enters via pressure-ceiling (summons=true), the Omen-phase
      transition runs the summons sequence in addition to the existing
      Omen → Observing flip. The sequence: (1) state.revery.summonsAudioCue =
      true (a flag readable by future audio/render layers — no asset wiring in
      this spec); (2) Gron is teleported to an adjacent walkable tile relative
      to the steward via pickAdjacentWalkableTile + the existing world.spatial
      move pattern from triggerStewardSeal (interaction.ts:541-552); (3) a
      one-frame dialog is opened on Gron with characterId='gron' and a new
      dialog branch keyed by the summons condition, which returns
      GRON_DIALOG_SOLSTICE_SUMMONS; (4) tickRevery proceeds from Omen to
      Observing on the next frame as before. Gron's position is NOT reverted
      when the Revery closes — he remains adjacent. The
      `state.revery.summonsCollapseTile = {x, y}` field captures the steward's
      tile at Omen for the Closing-phase egregoric commit.
    inputs:
      - 'tickRevery sees state.revery.phase === Omen and state.revery.summons === true'
      - 'state.player.{x,y} at the moment of summons'
    outputs:
      - 'Gron entity Position component moved to an adjacent walkable tile'
      - 'state.activeDialog opened with characterId=gron, lineIndex=0'
      - 'state.revery.summonsAudioCue = true'
      - 'state.revery.summonsCollapseTile = {x: player.x, y: player.y}'
    state_changes:
      - field: world.components[gronEid].Position
        effect: 'mutated to adjacent walkable tile via world.spatial.move'
      - field: activeDialog
        effect: 'set to {characterId: gron, lineIndex: 0, typingIndex: 0, typingDone: false, transitioning: false, transitionStartTime: 0}'
      - field: revery.summonsAudioCue
        effect: 'set to true'
      - field: revery.summonsCollapseTile
        effect: 'set to a Position snapshot of the steward at summons time'
    determinism: deterministic

  - id: gron-solstice-dialog
    description: >
      A new module-level constant GRON_DIALOG_SOLSTICE_SUMMONS is added to
      characters.ts alongside the existing GRON_DIALOG_* constants. Its
      content is a single placeholder line `'TODO: solstice summons dialog'`
      pending human authorship per feedback_no_write_lore. The dialog
      dispatcher getGronDialog is extended to return
      GRON_DIALOG_SOLSTICE_SUMMONS when a new condition is met: the active
      Revery is a summons (state.revery?.summons === true) and the Revery is
      in the Omen phase. The existing MainQuestPhase branch is preserved as
      the default. Register matches the v4 round 5 Gron locks (statements
      not questions, no contractions, no editorial affect, no opinion of the
      player, music precedes arrival), enforced at human-author time.
    inputs:
      - 'getGronDialog(state) is called during the summons Omen phase'
    outputs:
      - 'GRON_DIALOG_SOLSTICE_SUMMONS array returned (one-line TODO placeholder)'
    state_changes: []
    determinism: deterministic

  - id: collapsed-tile-render-flag
    description: >
      During Observing, the steward's collapsed tile (revery.summonsCollapseTile)
      is flagged for the dormant-flora visual register. No new render pass is
      added in this spec — instead, the steward's tile is recorded in a new
      state field state.collapsedStewardTile: Position | null, set at the
      Omen → Observing transition when revery.summons === true and cleared at
      Closing. Downstream render code may read this field to apply the
      dormant-flora palette wash to the tile; this spec only guarantees the
      field is set and cleared correctly. The steward sprite continues to
      render on top during Observing per the existing Revery render flow.
    inputs:
      - 'tickRevery transitions phase from Omen to Observing with revery.summons === true'
      - 'tickRevery completes Closing'
    outputs:
      - 'state.collapsedStewardTile set / cleared'
    state_changes:
      - field: collapsedStewardTile
        effect: 'set to summonsCollapseTile at Omen → Observing; set to null at Closing'
    determinism: deterministic

  - id: closing-egregoric-commit
    description: >
      During the Revery Closing phase (in tickRevery, after reveryCount
      increment and before state.revery = null), when revery.summons === true
      and revery.summonsCollapseTile is a valid dirt-eligible tile, the tile
      is committed to TileType.Egregore using the existing commitEgregoreTiles
      helper from egregore/spread.ts. This requires exporting that helper from
      its module (currently file-local). The commit places exactly one tile —
      the steward's collapse tile — and runs through the existing lifecycle
      pathway so species, genome, and stage are populated identically to other
      egregoric commits. If the steward's collapse tile is no longer eligible
      (e.g. tile type changed during the Revery via other systems), the commit
      is skipped silently (failure_conditions covers this).
    inputs:
      - 'tickRevery enters Closing phase with revery.summons === true'
      - 'revery.summonsCollapseTile is a tile of type that is dirt-eligible by candidateDirtNeighbors rules'
    outputs:
      - 'state.map[y][x] = { type: TileType.Egregore }'
      - 'state.egregorePositions appended with the collapse tile'
      - 'state.egregoreLifecycle gains an entry for the collapse tile'
    state_changes:
      - field: map
        effect: 'one tile mutated to TileType.Egregore'
      - field: egregorePositions
        effect: 'one Position appended'
      - field: egregoreLifecycle
        effect: 'one entry added keyed by posKey(x, y)'
    determinism: deterministic

  - id: pressure-reset-on-close
    description: >
      In the Closing phase of tickRevery, after the existing reveryCount and
      lastReveryEndTime updates, dormancyPressure resets to 0. This is the
      primary guard against back-to-back Reveries; REVERY_COOLDOWN_MS is
      retained as a redundant belt-and-suspenders guard in any future
      contribution gate (existing detectOmen call sites are deleted by this
      spec, but the constant remains for precis-36 and any future omen-surface
      gating).
    inputs:
      - 'tickRevery processes the Closing phase'
    outputs:
      - 'state.dormancyPressure = 0'
    state_changes:
      - field: dormancyPressure
        effect: 'set to 0'
    determinism: deterministic

  - id: retire-existing-omen-predicates
    description: >
      The three existing omen-detection predicates in `src/engine/omen.ts:36-58`
      — bee-on-shoulder, distant-meteorite, cloud-passing-sun — are deleted.
      The `detectOmen` function is removed entirely; its call site in
      `src/engine/gameLoop.ts:805` is replaced with the per-frame pressure ramp
      tick (`pressure-linear-ramp` behavior) and the threshold check
      (`threshold-trigger` behavior). The `REVERY_OMEN_STATIONARY_MS` constant
      is removed from `constants.ts`. `playerStationarySince` remains on
      GameState (it is used elsewhere) but is no longer read by omen logic.
      The `OmenKind` enum is preserved in `types.ts` for back-compat with
      precis-4's ReveryState shape and for precis-36's use; its values
      `BeeOnShoulder`, `DistantMeteorite`, and `CloudPassingSun` remain
      enumerated but none are surfaced by this spec.
    inputs:
      - 'detectOmen is removed from src/engine/omen.ts'
      - 'gameLoop.ts:805 call site is replaced'
    outputs:
      - 'No bee-on-shoulder, distant-meteorite, or cloud-passing-sun detection occurs at any frame'
    state_changes:
      - field: 'omen.ts module exports'
        effect: 'detectOmen removed; tickDormancyPressure and contributeDormancyPressure added'
      - field: 'gameLoop.ts tick'
        effect: 'detectOmen call replaced by tickDormancyPressure call'
    determinism: deterministic

edge_cases:
  - id: solstice-with-no-contributions
    description: >
      No external pressure contributions occur across the entire autumn (the
      single-player case before precis-36 ships, and the failure mode the
      pressure model corrects). The linear ramp alone carries dormancyPressure
      from 0 at the autumn equinox to 1 at the winter solstice frame.
    expected: >
      Revery initiates on the exact solstice frame; revery.summons === true;
      the placeholder OmenKind is set; the summons sequence (Gron teleport,
      dialog, collapse tile capture) fires normally.

  - id: pressure-already-at-ceiling-before-solstice
    description: >
      A future precis-36 contribution pushes dormancyPressure to 1.0 before
      the seasonal floor reaches it (e.g. an early-autumn Revery Knot pickup).
    expected: >
      Revery initiates at the threshold-crossing frame; the ramp floor is
      irrelevant after that point because the Revery is active and the
      pressure tick is gated on state.revery being null.

  - id: revery-ends-mid-autumn
    description: >
      A Revery completes (Closing → state.revery = null) before the season
      transitions out of Autumn. dormancyPressure resets to 0.
    expected: >
      dormancyPressure resumes climbing only when the next autumn begins (or
      stays at 0 through winter/spring/summer). The cooldown constant
      REVERY_COOLDOWN_MS remains available for precis-36 to gate its
      contributions; this spec does not call it.

  - id: collapse-tile-becomes-ineligible
    description: >
      During the Revery, an external system mutates the steward's collapse
      tile to a type incompatible with egregoric commit (e.g. water, wall).
    expected: >
      The Closing-phase egregoric commit is skipped silently; the Revery
      otherwise completes normally; no error, no toast, no event.

  - id: season-leaves-autumn-without-revery
    description: >
      seasonalPhase transitions past 0.75 (winter solstice) but somehow
      dormancyPressure has not reached 1 (only possible if the threshold-
      trigger code path is bypassed by a deep-time or zone gate held during
      the solstice frame).
    expected: >
      A safety reset: on the season transition Autumn → Winter without an
      active Revery, dormancyPressure resets to 0. Documents the invariant
      rather than hiding it.

  - id: contribute-when-already-at-ceiling
    description: >
      precis-36 (or any future caller) invokes contributeDormancyPressure with
      a positive amount while dormancyPressure is already at 1.0.
    expected: >
      The contribution is clamped — dormancyPressure remains at 1.0. No
      additional state change. The threshold-trigger code path is responsible
      for firing the Revery if it has not yet done so this frame.

failure_conditions:
  - trigger: >
      contributeDormancyPressure is called with a negative amount.
    expected: >
      The function clamps the result to [0, 1]; a negative contribution
      effectively does nothing once clamped. No exception is thrown. Callers
      are responsible for passing non-negative contributions.

  - trigger: >
      Pressure crosses 1.0 while state.revery is non-null (e.g. via the ramp
      reaching solstice during an in-progress Revery, or a precis-36
      contribution mid-Revery).
    expected: >
      No new Revery is initiated; the active one runs to completion. The
      threshold-trigger gate checks state.revery === null. Once the active
      Revery enters Closing, the pressure reset zeros the field; no
      double-Revery is possible.

  - trigger: >
      Gron entity does not exist in the world at summons time (defensive
      check — should never happen under normal genesis, but tests may
      construct edge worlds).
    expected: >
      The summons sequence still fires (collapse tile, dialog skipped), the
      Revery initiates normally, no crash. activeDialog is not opened if no
      Gron entity is found.

  - trigger: >
      pickAdjacentWalkableTile returns null at summons time (the steward is
      surrounded by unwalkable tiles).
    expected: >
      Gron is not teleported; the existing dialog still opens at the
      character's pre-summons position. The Revery proceeds. No crash.

verification:
  test_file: src/engine/__tests__/precis-32-revery-dormancy-pressure.test.ts
  test_pattern: '^precis #32 — revery dormancy pressure$'
  command: 'npx vitest run src/engine/__tests__/precis-32-revery-dormancy-pressure.test.ts'
