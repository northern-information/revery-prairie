id: satellite-crater-as-effect
name: 'Satellite craters are a dirt-tile effect, not a tile type'
priority: high
layer: engine
source_files:
  - src/engine/satellites.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/renderer.ts
  - src/engine/tileBg.ts
  - src/engine/tileBgCache.ts
  - src/engine/effects.ts
  - src/engine/entities.ts
  - src/engine/recipes.ts
  - src/harness/__tests__/serialization/schema.test.ts
  - src/engine/__tests__/satelliteImpacts.test.ts
  - src/engine/__tests__/combine.test.ts
dependencies:
  - satellite-impacts

behaviors:
  - id: crater-is-effect-on-dirt
    description: >
      When a satellite impacts, affected tiles remain TileType.Dirt (or
      TileType.Clover if clover was present). Each affected tile's posKey
      is added to a new state.craters Set<string>. The tile type itself
      is never changed to a dedicated crater type. Space, sand, cave
      entrances, ruin entrances, and walls are excluded from the crater
      set (same protections as before).
    inputs:
      - 'Satellite entity reaches its landingTarget position'
      - 'Tile within 5x5 impact zone is not protected (not space/sand/walls/entrances)'
    outputs:
      - 'Tile type remains Dirt or Clover'
      - 'posKey for the tile added to state.craters'
      - 'Soil health reduced by SATELLITE_SOIL_DAMAGE (unchanged)'
    state_changes:
      - field: craters
        effect: 'posKey for each affected tile added to Set'
      - field: map
        effect: 'no tile type conversion (tiles remain Dirt or Clover)'
      - field: soilHealth
        effect: 'reduced by SATELLITE_SOIL_DAMAGE for each tile in zone, clamped to 0'
    determinism: deterministic

  - id: crater-persists-through-planting
    description: >
      When the player plants clover on a cratered dirt tile (e.g. via
      bee+clover combine), the tile becomes Clover but the crater entry
      in state.craters is NOT removed. The pollution persists beneath the
      clover, and the soil health value remains the damaged value. If
      the clover later dies and returns to dirt, the tile is still
      cratered.
    inputs:
      - 'Cratered tile (posKey in state.craters) is converted to Clover'
    outputs:
      - 'Tile becomes Clover'
      - 'state.craters still contains the posKey'
    state_changes:
      - field: map
        effect: 'tile set to TileType.Clover'
      - field: craters
        effect: 'unchanged (posKey remains)'
    determinism: deterministic

  - id: crater-tracked-in-tile-effects
    description: >
      getTileEffects in src/engine/effects.ts returns "crater" in its
      effects array when state.craters.has(posKey) for the queried
      tile, regardless of whether the tile is Dirt or Clover. This
      is the engine-level mechanism that surfaces craters to any
      consumer (tests, future UI surfaces). state.soilHealth still
      tracks the damaged value for the tile independently.
    inputs:
      - 'getTileEffects called with a tile position whose posKey is in state.craters'
    outputs:
      - 'effects array includes "crater"'
    state_changes: []
    determinism: deterministic

  - id: crater-renders-visually
    description: >
      Cratered dirt tiles render using civilization ruin glyphs
      (BUILDING_CHARS) with a reddish-brown foreground color palette and
      a CRATER_BG_PALETTE background palette that is approximately 20%
      darker than the corresponding standard DIRT bg palette. The
      foreground gate is state.craters.has(tileKey) AND state.currentZone
      === Zone.Overworld; the background gate is added in tileBg.ts via a
      new getCraterBgColor(x, y) and consumed by
      tileBgCache.getEffectiveBgColor for Dirt tiles whose posKey is in
      state.craters. Like DIRT bg, the crater bg is per-tile varied
      (hashed across the palette) rather than a single flat shade.
      Cratered clover tiles continue to render as clover for both glyph
      and background — the crater effect is still tracked but the bg
      darkening only applies under Dirt. state.craters is an overworld-
      coordinate set; the renderer must not consult it while drawing
      other zones (cave, ruin, house interior, little-house yard, and any
      future zones) because those maps use independent coordinate spaces
      that can collide with overworld crater posKeys.
    inputs:
      - 'Tile at position is Dirt and posKey is in state.craters'
      - 'state.currentZone === Zone.Overworld'
    outputs:
      - 'Tile rendered with BUILDING_CHARS glyph and reddish-brown foreground color'
      - 'Tile background filled from CRATER_BG_PALETTE (≈20% darker than DIRT_BG_PALETTE), hashed per-tile'
    state_changes: []
    determinism: deterministic

  - id: crater-rendering-overworld-only
    description: >
      The crater visual treatment is overworld-only. When state.currentZone
      is any non-overworld zone (Cave, Ruin, HouseInterior, LittleHouseYard,
      and any future zones), the renderer ignores state.craters entirely
      for the purposes of glyph and color resolution. Dirt tiles in those
      zones render with the standard DIRT_COLORS palette and TILE_CHARS
      glyph. The same zone gate applies to state.burnScars (Dirt color
      override), which is also an overworld-coordinate set populated by
      clover burn recovery — burnScars must not color-shift Dirt tiles in
      other zones whose coordinates happen to collide with overworld
      burn-scar posKeys.
    inputs:
      - 'state.currentZone !== Zone.Overworld'
      - 'Dirt tile at position whose posKey may or may not appear in state.craters / state.burnScars'
    outputs:
      - 'Tile renders with standard DIRT_COLORS color and TILE_CHARS[Dirt] glyph'
      - 'BUILDING_CHARS, CRATER_BG_PALETTE, and BURN_SCAR_COLORS are not consulted'
    state_changes: []
    determinism: deterministic

  - id: ghost-crater-avoidance-via-set
    description: >
      Ghost drift behavior avoids cratered tiles. When collecting valid
      neighbor tiles for drift movement, tiles whose posKey is in
      state.craters are excluded from the candidate set. This replaces
      the previous check against TileType.Crater with a check against
      state.craters.has(posKey(nx, ny)).
    inputs:
      - 'Ghost entity drift tick'
      - 'One or more neighbor posKeys are in state.craters'
    outputs:
      - 'Cratered neighbors excluded from movement candidates'
    state_changes: []
    determinism: probabilistic

  - id: clover-growth-on-craters
    description: >
      Clover growth/lifecycle treats cratered dirt tiles as regular dirt.
      Clover may be planted on them (via bee+clover combine) and may
      grow on them (via normal growth front logic) because the tile type
      is Dirt. The crater set entry does not block regrowth — this
      matches the desired behavior where the crater is a soil condition,
      not a barrier, and low soil health naturally discourages growth.
    inputs:
      - 'Cratered Dirt tile with growing clover conditions'
    outputs:
      - 'Clover may grow or be planted on cratered dirt'
      - 'state.craters entry persists beneath the clover'
    state_changes:
      - field: map
        effect: 'tile transitions Dirt -> Clover when clover grows'
      - field: craters
        effect: 'unchanged'
    determinism: deterministic

  - id: crater-serialization
    description: >
      state.craters is a Set<string> persisted alongside other per-tile
      sets like burnScars. It is initialized to an empty Set in
      createGameState and listed in the serialization schema allowlist.
    inputs:
      - 'GameState created via createGameState'
    outputs:
      - 'state.craters exists and is an empty Set<string>'
    state_changes:
      - field: craters
        effect: 'initialized as new Set<string>()'
    determinism: deterministic

edge_cases:
  - id: impact-on-clover-tile
    description: 'Satellite impact zone contains a Clover tile'
    expected: 'Tile stays Clover (not converted to dirt); posKey added to state.craters; soil health reduced'
  - id: plant-clover-on-crater
    description: 'Player stands on a cratered dirt tile and triggers bee+clover combine'
    expected: '3x3 area becomes Clover, bee spawns, crater entries beneath planted tiles persist in state.craters'
  - id: clover-dies-on-crater
    description: 'Clover planted on a crater dies and decomposes back to Dirt'
    expected: 'Tile becomes Dirt, state.craters still contains the posKey, the crater visual re-appears'
  - id: protected-tiles-in-zone
    description: '5x5 impact zone contains sand, cave entrance, or walls'
    expected: 'Protected tiles are not added to state.craters and are not visually changed'
  - id: runtime-impact-bg-refresh
    description: 'Satellite impacts a previously-uncratered Dirt tile during gameplay'
    expected: 'The tileBgCache repaints the affected tiles via the existing onElevationMutated path, so the darker crater bg becomes visible without a manual cache invalidation'
  - id: genesis-crater-bg-on-first-build
    description: 'Genesis-era craters are present in state.craters when createGameState completes'
    expected: 'The first tileBgCache build for the overworld map picks up the darker crater bg for those tiles (no separate invalidation needed)'
  - id: crater-poskey-collides-with-yard-dirt
    description: 'An overworld crater posKey (e.g. "11,2") collides with a Dirt tile coordinate on a non-overworld map (the little-house yard, a future village map, etc.)'
    expected: 'The yard/village Dirt tile renders with standard DIRT_COLORS and TILE_CHARS[Dirt]. The crater glyph + reddish-brown does NOT appear in the yard. state.craters is unread during non-overworld renders.'
  - id: burnscar-poskey-collides-with-yard-dirt
    description: 'An overworld burnScar posKey collides with a Dirt tile coordinate on a non-overworld map'
    expected: 'The yard/village Dirt tile renders with standard DIRT_COLORS. The BURN_SCAR_COLORS override does NOT apply.'

failure_conditions:
  - trigger: 'Player plants clover on a cratered tile'
    expected: 'Tile becomes Clover, crater entry persists, soil health remains damaged (regression: previously tile-type change masked the soil data)'
  - trigger: 'Code references TileType.Crater after migration'
    expected: 'TypeScript build fails (TileType.Crater removed from types.ts)'
  - trigger: 'getEffectiveBgColor is called for a Dirt tile whose posKey is in state.craters'
    expected: 'Returns a CRATER_BG_PALETTE color (≈20% darker than DIRT_BG_PALETTE), not the standard dirt bg'
  - trigger: 'A Clover tile is in state.craters'
    expected: 'getEffectiveBgColor returns the standard CLOVER bg (crater bg only applies under Dirt — the plant visually covers the scar)'
  - trigger: 'Player enters the little-house yard (state.currentZone === Zone.LittleHouseYard) and a yard Dirt tile sits at a coordinate that exists in state.craters'
    expected: 'The yard tile renders as standard Dirt (DIRT_COLORS, TILE_CHARS[Dirt]). The grey BUILDING_CHARS glyph from the overworld crater set does NOT bleed into the yard view. Same expectation for burnScars (no color shift on the yard Dirt).'

verification:
  test_file: src/engine/__tests__/satelliteImpacts.test.ts
  test_pattern: 'crater'
  command: 'npx vitest run src/engine/__tests__/satelliteImpacts.test.ts'
