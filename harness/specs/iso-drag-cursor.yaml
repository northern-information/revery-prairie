id: iso-drag-cursor
name: 'Drag cursor uses the iso projection'
priority: high
layer: component
source_files:
  - src/components/DragCursor.tsx
  - src/engine/projection.ts
dependencies:
  - isometric-projection
behaviors:
  - id: drag-cursor-iso-snap
    description: >
      The floating drag cursor preview, when hovering the canvas, snaps to
      the iso-projected anchor of the viewport tile under the mouse.
      Snapping uses screenToTile to find the viewport tile from the cursor
      pixel position (relative to canvasRect), then viewportToScreen to
      obtain the iso anchor. The snapped left/top in viewport-pixel space
      are added to canvasRect.left / canvasRect.top to produce the fixed
      page-pixel position. The visual drag glyph therefore tracks the
      same diamond cell that the canvas highlight and click-to-move land
      on, instead of an orthogonal grid.
    inputs:
      - 'cursorTarget is "canvas", canvasRect is non-null, metricsRef.current is non-null, and state.viewportWidth / state.viewportHeight are non-zero'
    outputs:
      - 'preview left = canvasRect.left + viewportToScreen(vx, vy, ...).px - charWidth/2'
      - 'preview top = canvasRect.top + viewportToScreen(vx, vy, ...).py'
      - 'where (vx, vy) = screenToTile(cursorPos.x - canvasRect.left, cursorPos.y - canvasRect.top, {x:0,y:0}, ...)'
    state_changes: []
    determinism: deterministic
  - id: drag-cursor-shares-projection-with-canvas
    description: >
      The viewport tile selected by DragCursor for snapping is the same
      viewport tile that the canvas highlight selects for the same cursor
      pixel position, because both call screenToTile with identical
      arguments. Drag-and-drop targeting therefore agrees with the visual
      drag preview.
    inputs:
      - 'cursor is over the canvas at screen pixel (cx, cy)'
    outputs:
      - 'DragCursor previewed tile == canvas-highlighted tile'
    state_changes: []
    determinism: deterministic
edge_cases:
  - id: viewport-dims-zero-before-first-frame
    description: >
      state.viewportWidth and state.viewportHeight start at 0 before the
      canvas measures itself. DragCursor must tolerate this transient
      state without throwing or producing NaN positions — it may render
      off-screen but must not crash.
    expected: 'no exception; drag cursor renders at finite (possibly off-screen) coordinates'
  - id: drag-cursor-on-non-axis-aligned-tile
    description: >
      Hovering a tile whose iso center is not at an orthogonal grid
      multiple of (charWidth, charHeight) — e.g. tile (3, 5) — under the
      old code snapped the preview to the wrong rect cell. Under iso
      snapping, the preview anchors to that diamond's center.
    expected: 'preview glyph centers on the diamond of the hovered tile'
failure_conditions:
  - trigger: 'DragCursor floors cursor pixels by charWidth / charHeight to derive tileX, tileY'
    expected: 'DragCursor calls screenToTile to derive viewport tile, then viewportToScreen for the snapped anchor'
verification:
  test_file: src/components/__tests__/DragCursor.test.tsx
  test_pattern: 'DragCursor iso'
  command: 'npx vitest run src/components/__tests__/DragCursor.test.tsx'
