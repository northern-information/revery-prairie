id: ruin-archetype-distribution
name: 'Ruin archetype assignment produces a balanced spread of all four archetypes per world'
status: partial
priority: high
layer: engine
source_files:
  - src/engine/ruins.ts
dependencies:
  - ruin-subsidence
  - ruin-dormant-garden
  - ruin-haunted-threshold
  - ruin-resonance

behaviors:
  - id: balanced-archetype-scoring
    description: 'assignArchetype scores each of the four archetypes (Subsidence, DormantGarden, HauntedThreshold, Resonance) on comparable numeric ranges so that no archetype is structurally favored by typical genesis-generated ruin parameters (radius 3-5, age 1000-5999, aqueductPaths 0-9, footprintDensity ~1.0). Each archetype must be a competitive winner for some realistic ruin configuration.'
    inputs:
      - 'A CivilizationRuin generated by genesis with typical parameters'
      - 'A seeded RNG'
    outputs:
      - 'A RuinArchetype value chosen from {Subsidence, DormantGarden, HauntedThreshold, Resonance}'
      - 'No archetype dominates the distribution to the exclusion of others across many seeds'
    state_changes: []
    determinism: deterministic

  - id: per-world-archetype-coverage
    description: 'Across the 8-12 ruins in a single generated world, the resulting archetype set typically includes at least three of the four archetypes. The distribution may vary by seed, but no archetype is permanently absent from typical worlds.'
    inputs:
      - 'A full genesis run producing 8-12 ruins via generateAllRuinInteriors'
    outputs:
      - 'state.ruinInteriors contains a mix of archetypes covering at least three of the four types in the majority of seeds'
    state_changes:
      - field: 'state.ruinInteriors[].archetype'
        effect: 'Set across ruins so that subsidence, dormantGarden, hauntedThreshold, and resonance each appear in many seeds'
    determinism: probabilistic

  - id: archetype-distribution-fairness
    description: 'Aggregated across many seeded worlds, each of the four archetypes is assigned to at least 10% of all ruins. No archetype receives less than 10% or more than 50% of total assignments in a 10000-world simulation.'
    inputs:
      - 'A large number of independently seeded ruins (e.g. 10000+ via mulberry32 seeds)'
    outputs:
      - 'Each archetype claims between 10% and 50% of assignments'
    state_changes: []
    determinism: probabilistic

edge_cases:
  - id: minimum-radius-ruin
    description: 'Ruin with the smallest radius (3) and minimum aqueductPaths (0)'
    expected: 'HauntedThreshold and Subsidence are both viable winners; assignment is not locked to a single archetype'
  - id: maximum-radius-ruin
    description: 'Ruin with the largest radius (5) and high aqueductPaths (8+)'
    expected: 'Subsidence, DormantGarden, and Resonance are all viable winners; HauntedThreshold may score lower but the system still produces a varied result across seeds'
  - id: zero-aqueduct-paths
    description: 'Isolated ruin with no aqueduct connections'
    expected: 'DormantGarden may score lower, but the other three archetypes compete fairly for the slot'
  - id: low-footprint-density
    description: 'Ruin where most tiles in the radius are not in landMask (coastline ruin)'
    expected: 'Resonance gets its density bonus and is competitive with the others'
  - id: distribution-floor-bound
    description: 'Statistical lower bound: across 10000 seeded ruins, the rarest archetype still receives at least 10% of assignments'
    expected: 'min(count_per_archetype) / total >= 0.10'
  - id: distribution-ceiling-bound
    description: 'Statistical upper bound: across 10000 seeded ruins, the most frequent archetype receives at most 50% of assignments'
    expected: 'max(count_per_archetype) / total <= 0.50'

failure_conditions:
  - trigger: 'Across 10000 seeded ruins, any archetype receives fewer than 10% of assignments'
    expected: 'Test fails. The scoring formula must be rebalanced so each archetype wins at least 10% of the time.'
  - trigger: 'Across 10000 seeded ruins, any archetype receives more than 50% of assignments'
    expected: 'Test fails. The scoring formula must be rebalanced so no archetype dominates.'
  - trigger: 'Player explores a typical generated world and finds only Subsidence and DormantGarden ruins'
    expected: 'Worlds should typically contain a mix of three or four archetypes. HauntedThreshold and Resonance must not be effectively absent.'

verification:
  test_file: src/engine/__tests__/ruins.test.ts
  test_pattern: 'archetype distribution'
  command: npx vitest run src/engine/__tests__/ruins.test.ts
