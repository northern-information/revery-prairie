id: player-glyph-flash-before-spawn
name: 'No player glyph flash before meteorite spawn'
priority: medium
layer: engine
source_files:
  - src/engine/genesis.ts
  - src/engine/state.ts
  - src/engine/celestial.ts
dependencies:
  - player-spawn
  - genesis-transition

behaviors:
  - id: trigger-runs-in-complete-genesis
    description: >
      completeGenesis must call triggerPlayerSpawnShower(state, state.player, handoffTime)
      synchronously before returning. this guarantees that on the first frame the
      gameplay renderer takes over from the genesis renderer, playerSpawn.visible is
      already false and the player glyph is not drawn. without this, the gameloop's
      player-spawn-trigger system (which is gameplay-phase) fires one tick later than
      the first gameplay render, producing a one-frame @ flash at the spawn tile
      before the meteorite descends.
    inputs:
      - 'completeGenesis(state) invoked'
    outputs: []
    state_changes:
      - field: playerSpawn.visible
        effect: 'flipped to false'
      - field: playerSpawn.triggeredAt
        effect: 'set to the handoff time'
      - field: playerSpawn.meteorEntityId
        effect: 'set to the spawn-targeted shooting star entity id'
      - field: meteorShower
        effect: 'becomes active with one spawn-targeted star (per player-spawn spec)'
    determinism: time-based

  - id: gameloop-trigger-noop-after-complete-genesis
    description: >
      the existing player-spawn-trigger gameloop system continues to exist as a
      fallback for paths that bypass completeGenesis (headless tests, future
      no-genesis flows). its idempotency guard (playerSpawn.triggeredAt !== 0)
      ensures it no-ops on the first gameplay tick after completeGenesis has
      already triggered the spawn.
    inputs:
      - 'gameloop tick after completeGenesis has run'
    outputs: []
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: skip-genesis-url-param
    description: >
      ?skipGenesis=true causes useGameEngine's useLayoutEffect to call
      completeGenesis synchronously after createGameState. the spawn trigger
      fires inside that call, so the first render (any render, in fact) sees
      visible=false. no flash.
    expected: 'no @ glyph drawn at the spawn tile on any frame before the meteorite explosion'

  - id: headless-test-bypasses-complete-genesis
    description: >
      tests that build a GameState directly without running genesis keep
      playerSpawn.visible=true by default. this is intentional — headless
      tests have no rendering loop and rely on the default to assert
      pre-trigger state. the gameloop fallback trigger handles the rare
      case where a headless test then runs the gameloop.
    expected: 'playerSpawn.visible is true after createGameState; flipped to false on first gameplay tick when gameloop runs'

failure_conditions:
  - trigger: 'gameplay renderer runs after genesis ends with playerSpawn.visible still true'
    expected: 'cannot happen — completeGenesis flips visible to false before returning, and the genesis tick that calls completeGenesis runs before onFrame in the same RAF callback'

  - trigger: 'completeGenesis called twice'
    expected: 'second call returns early at the existing guard (if (!state.genesis) return); the duplicate triggerPlayerSpawnShower call never runs'

verification:
  test_file: src/engine/__tests__/playerSpawn.test.ts
  test_pattern: 'completeGenesis triggers spawn ceremony'
  command: 'npx vitest run src/engine/__tests__/playerSpawn.test.ts'
