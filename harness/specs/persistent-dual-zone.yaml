id: persistent-dual-zone
name: 'Persistent dual-zone simulation'
priority: high
layer: engine
source_files:
  - src/engine/ecs/types.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/gameLoop.ts
  - src/engine/cave.ts
  - src/engine/renderer.ts
  - src/engine/movement.ts
  - src/engine/entities.ts
  - src/engine/interaction.ts
  - src/engine/effects.ts
  - src/engine/celestial.ts
  - src/engine/recipes.ts
  - src/hooks/useKeyboard.ts
  - src/hooks/useCanvasDrop.ts
dependencies: []

behaviors:
  - id: zone-component
    description: >
      A new EntityZone ECS component tags every entity with its zone
      (overworld or cave). The component stores the Zone value from
      types.ts. Every entity creation point adds this component.
    inputs:
      - 'Entity creation call'
    outputs:
      - 'Entity has EntityZone component set to the appropriate zone'
    state_changes:
      - field: 'ComponentType'
        effect: 'new EntityZone entry added'
      - field: 'ComponentDataMap'
        effect: 'EntityZone maps to { zone: Zone }'
    determinism: deterministic

  - id: persistent-maps
    description: >
      GameState stores both maps permanently. state.overworldMap,
      state.overworldMapWidth, state.overworldMapHeight persist
      alongside the existing state.caveMap fields. state.map is a
      reference to the current zone's map. OverworldSnapshot type
      and state.overworldSnapshot field are removed entirely.
    inputs:
      - 'createGameState call'
    outputs:
      - 'state.overworldMap is the overworld terrain'
      - 'state.caveMap is the cave terrain'
      - 'state.map points to state.overworldMap initially'
    state_changes:
      - field: 'GameState'
        effect: 'overworldMap/Width/Height added, overworldSnapshot removed'
    determinism: deterministic

  - id: concurrent-zone-ticks
    description: >
      The game loop always runs every tick system regardless of
      the player's current zone. Before calling a zone-specific
      system (zone !== 'always'), the loop temporarily sets
      state.map, state.mapWidth, state.mapHeight to that system's
      zone map so tick functions read the correct terrain without
      any changes to their internals. After the call it restores
      the current zone's map. 'always' systems use the current
      zone's map as before.
    inputs:
      - 'Game loop tick with any currentZone'
    outputs:
      - 'All tick systems run every frame'
      - "Each system sees state.map pointing to its own zone's map"
    state_changes:
      - field: 'state.map/mapWidth/mapHeight'
        effect: 'temporarily swapped per-system, restored after each call'
    determinism: deterministic

  - id: zone-filtered-queries
    description: >
      All ECS queries that affect gameplay logic or rendering
      filter entities by the EntityZone component. Critical
      queries: getBlockedPositions (movement.ts), renderer entity
      loops (renderer.ts), tickBees/tickCharacterBehaviors
      (entities.ts), updateFacingEntity/isInteractableAt
      (interaction.ts), getTileEffects (effects.ts). Each query
      includes ComponentType.EntityZone and checks zone matches
      the system's active zone.
    inputs:
      - 'ECS query in any zone-sensitive function'
    outputs:
      - 'Only entities matching the active zone are returned'
    state_changes: []
    determinism: deterministic

  - id: simplified-zone-transition
    description: >
      enterCave swaps state.map to state.caveMap, sets
      state.currentZone to Cave, positions the player at the
      cave interior entrance, and clears navigation state. No
      entity snapshot or destroy. exitCave swaps state.map to
      state.overworldMap, sets state.currentZone to Overworld,
      positions the player south of the overworld entrance, and
      clears navigation state. No entity restore. Moab is created
      once during createGameState (tagged with Zone.Cave) and
      persists permanently.
    inputs:
      - 'Player steps on CaveEntrance tile'
    outputs:
      - "state.map points to the destination zone's map"
      - 'state.currentZone updated'
      - 'Player positioned at destination entrance'
      - 'All entities from both zones still exist in state.world'
    state_changes:
      - field: 'state.map'
        effect: "swapped to destination zone's map"
      - field: 'state.currentZone'
        effect: 'set to destination zone'
      - field: 'state.player'
        effect: 'moved to destination entrance position'
    determinism: deterministic

edge_cases:
  - id: meteorite-lands-while-in-cave
    description: >
      A shooting star is in flight when the player enters the
      cave. The overworld tick system continues running, the star
      lands, creates a meteorite entity (tagged overworld). The
      meteorite does not render in the cave. When the player
      exits, the meteorite is visible on the overworld.
    expected: 'Meteorite exists on overworld map, invisible in cave, visible on exit'

  - id: overworld-entities-with-cave-coordinates
    description: >
      An overworld meteorite at position (15, 10) exists while
      the player is in the cave (40x25 grid). The coordinates
      overlap with valid cave tiles but the renderer filters by
      zone so the meteorite does not appear.
    expected: 'Meteorite is not rendered in cave despite overlapping coordinates'

  - id: ghost-drifts-while-in-cave
    description: >
      Ghosts continue drifting in the overworld while the player
      explores the cave. On exit, ghosts have moved from their
      positions at the time of cave entry.
    expected: 'Ghost positions differ between cave entry and exit'

  - id: cave-crumble-not-in-overworld
    description: >
      Player breaks cave wall creating crumble effects (tagged
      cave zone). Immediately exits cave. Crumble effects do not
      render on the overworld.
    expected: 'Crumble effects invisible on overworld'

  - id: blocked-positions-zone-isolation
    description: >
      A blocking entity exists on the overworld. In the cave, the
      player can walk on the same coordinates because
      getBlockedPositions only returns blockers for the current
      zone.
    expected: 'Overworld blockers do not affect cave movement'

failure_conditions:
  - trigger: >
      Overworld meteorite entity has coordinates within the cave
      grid range and the renderer does not filter by zone
    expected: 'Renderer checks EntityZone and skips entities from other zones'

  - trigger: >
      Player enters cave while shooting stars are active, exits
      after 30 seconds, and shooting stars are in same position
    expected: 'Overworld tick systems ran while player was in cave, stars have moved or landed'

  - trigger: >
      getBlockedPositions returns overworld blocker positions
      while player is in cave, blocking cave movement
    expected: 'getBlockedPositions filters by current zone'

verification:
  test_file: src/engine/__tests__/cave.test.ts
  test_pattern: 'persistent dual-zone'
  command: 'npx vitest run src/engine/__tests__/cave.test.ts'
