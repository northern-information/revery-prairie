id: angels
name: 'Biblically accurate ASCII angels'
priority: high
layer: integration
source_files:
  - src/engine/angels.ts
  - src/engine/angelAnimation.ts
  - src/engine/types.ts
  - src/engine/ecs/types.ts
  - src/engine/constants.ts
  - src/engine/renderer.ts
  - src/engine/movementTween.ts
  - src/engine/gameLoop.ts
  - src/engine/entities.ts
  - src/engine/effects.ts
  - src/engine/manual.ts
  - src/engine/interaction.ts
  - src/engine/state.ts
  - src/engine/movement.ts
  - src/components/PermacomputerShell.tsx
  - src/components/CantosScreen.tsx
  - src/components/DialogBox.tsx
  - src/hooks/useKeyboard.ts
  - src/engine/__tests__/angels.test.ts
  - src/components/__tests__/CantosScreen.test.tsx
dependencies:
  - player-movement

behaviors:
  - id: angel-spawning
    description: >
      Angels spawn periodically on the overworld. Only one angel may exist at
      a time. Spawn location is a random walkable dirt or clover tile at least
      30 tiles from the player. Spawning is gated by a configurable interval
      (ANGEL_SPAWN_INTERVAL_MS) with random jitter. Angels do not spawn during
      deep time or in the cave. On spawn, a full-screen white flash fires
      (same effect as lightning screen flash: 150ms fade at 30% opacity).
    inputs:
      - 'GameState with no active angel entity'
      - 'Current time past nextAngelSpawnTime'
      - 'Player in overworld zone'
    outputs:
      - 'New ECS entity with angel components created'
      - 'Full-screen white flash rendered on spawn frame'
    state_changes:
      - field: world
        effect: 'new entity with AngelData, Position, MultiPosition, Aura, EntityTag("angel"), EntityZone(overworld) components'
      - field: nextAngelSpawnTime
        effect: 'set to time + ANGEL_SPAWN_INTERVAL_MS + random jitter'
      - field: manualDiscoveries
        effect: 'event:angel recorded on first spawn'
      - field: angelFlashTime
        effect: 'set to current time to trigger screen flash'
    determinism: probabilistic

  - id: angel-drifting
    description: >
      Angels drift across the overworld every tick
      (ANGEL_DRIFT_CHANCE = 1.0). Movement updates all tiles in the angel's
      9x9 body. Angels avoid space, sand, cave entrance, water, and
      other blocked positions. Drift is frozen during active dialog.
      Logical position updates discretely (one tile per drift step); the
      visual tween between source and destination is handled by
      angel-drift-tween and is purely cosmetic.
    inputs:
      - 'Angel entity exists'
      - 'Drift tick fires'
    outputs:
      - 'Angel position shifts by 1 tile in a random cardinal direction'
    state_changes:
      - field: world.Position
        effect: 'angel center position moves by 1 tile'
      - field: world.MultiPosition
        effect: 'all 9x9 body positions recalculated from new anchor'
      - field: world.MovementTween
        effect: 'tween component set on angel entity by world.moveEntity with durationMs=ANGEL_DRIFT_TICK_MS'
    determinism: probabilistic

  - id: angel-drift-tween
    description: >
      The 9x9 angel body interpolates smoothly between drift source and
      destination over the duration of the drift step. The renderer reads
      the MovementTween component on the angel entity and applies a shared
      fractional pixel offset of (lerpX - destX, lerpY - destY) * tileSize
      to every body pixel for the duration of the tween. All 81 body
      pixels move together — no per-tile stagger. Animation frames (eye
      cluster, wings) continue to advance on their own ~200ms cadence
      independent of the tween, so the body appears to glide while still
      flickering. The tween duration matches the moveEntity durationMs
      passed in tickAngelDrift (ANGEL_DRIFT_TICK_MS = 2000ms, configurable).
      Once the tween completes (t >= 1), the renderer removes the
      MovementTween component and the body renders at integer destination
      tile positions for subsequent frames until the next drift. The gold
      aura, rain overlay, bee/clover aura ticks, dialog trigger, movement
      blocking, and click-to-interact all key off the integer
      Position/MultiPosition and do NOT tween — the body slides into its
      tile-snapped aura.
    inputs:
      - 'Angel entity has MovementTween component'
      - 'Current render time'
    outputs:
      - 'Angel 9x9 body drawn at fractional pixel positions interpolated between fromX/fromY and Position.x/Position.y'
    state_changes:
      - field: world.MovementTween
        effect: 'component removed when tween elapsed time >= durationMs'
    determinism: time-based

  - id: angel-animation
    description: >
      Each angel is rendered as an animated multi-character ASCII figure on a
      9x9 tile footprint with strong bilateral symmetry along the Y axis
      (left-right mirror) and decent bilateral symmetry along the X axis
      (top-bottom approximate mirror). The face (central eye cluster) is
      centered on the true center tile. The odd body size ensures a single
      center column and center row. Animation cycles through multiple frames
      using characters inspired by Ezekiel's descriptions (wheels within
      wheels, many eyes, wings). Each angel instance is procedurally varied
      via spawn-position seed. Animation cycles at ~200ms per frame.
    inputs:
      - 'Angel entity exists in viewport'
      - 'Current render time'
    outputs:
      - 'Animated 9x9 ASCII figure drawn on canvas at angel position'
    state_changes: []
    determinism: probabilistic

  - id: angel-aura-types
    description: >
      Each angel has one of three aura types chosen at random on spawn:
      rain, bees, or clover. The aura radiates from the angel's center
      position with a radius of 25 tiles. The aura effect is continuous
      while the angel exists, regardless of player interaction.
    inputs:
      - 'Angel entity with Aura component'
    outputs:
      - 'Aura effect applied within radius'
    state_changes: []
    determinism: probabilistic

  - id: angel-aura-gold-rendering
    description: >
      All angels display a gently oscillating gold aura on the ground within
      their 25-tile effect radius. The renderer draws a gold fillRect behind
      each tile character within the aura. The alpha oscillates using a sine
      wave based on time plus distance from center, creating a gentle
      breathing/pulsing effect. The aura is purely visual — it does not
      affect gameplay. It renders beneath tile characters but above the
      background, similar to how rain overlays work but as a pre-pass.
    inputs:
      - 'Angel entity exists in viewport'
      - 'Current render time'
    outputs:
      - 'Gold-tinted fillRect drawn behind tiles within aura radius'
    state_changes: []
    determinism: time-based

  - id: angel-aura-rain
    description: >
      Rain aura angels cause rain to fall within their aura radius. This
      uses the existing rain aura system — the angel's Aura component with
      kind "rain" integrates with the renderer rain overlay and tileWater
      rain detection. Tiles within the aura receive water as if it were
      raining.
    inputs:
      - 'Angel entity with Aura kind "rain"'
    outputs:
      - 'Rain rendered within aura radius'
      - 'Tiles within radius receive water via tileWater system'
    state_changes:
      - field: tileWater
        effect: 'tiles within rain aura radius gain water each tick'
    determinism: deterministic

  - id: angel-aura-bees
    description: >
      Bee aura angels periodically spawn bees at random walkable positions
      within their aura radius. Spawn rate is low — one bee per
      ANGEL_BEE_SPAWN_INTERVAL_MS (configurable, ~5 seconds). Maximum
      concurrent bees from angel capped at ANGEL_BEE_MAX (configurable, ~8).
      Spawned bees behave identically to normal bees (wander, capture on
      walk-over, starvation timer).
    inputs:
      - 'Angel entity with AngelData auraKind "bees"'
      - 'Bee aura tick fires'
    outputs:
      - 'New bee ECS entity at random position within aura radius'
    state_changes:
      - field: world
        effect: 'new bee entity created with Position, EntityTag("bee"), EntityZone(overworld)'
    determinism: probabilistic

  - id: angel-aura-clover
    description: >
      Clover aura angels periodically convert random dirt tiles within their
      aura radius to clover. Growth rate is one tile per
      ANGEL_CLOVER_GROW_INTERVAL_MS (configurable, ~3 seconds). Only dirt
      tiles are eligible. Does not grow on sand, space, or burnt clover.
      Grown clover enters the normal clover lifecycle system.
    inputs:
      - 'Angel entity with AngelData auraKind "clover"'
      - 'Clover aura tick fires'
    outputs:
      - 'One dirt tile within aura radius converted to clover'
    state_changes:
      - field: map
        effect: 'one dirt tile type changed to TileType.Clover'
      - field: cloverLifecycle
        effect: 'new entry added for converted tile with Healthy stage'
    determinism: probabilistic

  - id: angel-dialog-trigger
    description: >
      When the player walks under (occupies any tile within) the angel's
      9x9 body, dialog is triggered automatically. The angel speaks a single
      line: a sha256 hash string unique to this angel. Dialog can be
      triggered repeatedly — every walk-under opens the same dialog with
      the same hash. The canto is only stored on the first encounter.
      Dialog uses the standard dialog panel system. Angel body tiles
      highlight pink on cursor hover, consistent with other interactable
      characters.
    inputs:
      - 'Player position overlaps any of the angel MultiPosition tiles'
      - 'No active dialog already open'
    outputs:
      - 'activeDialog set with angel character identity'
      - 'Dialog panel shows sha256 hash as 8x8 grid in Times New Roman'
    state_changes:
      - field: activeDialog
        effect: 'set with angel characterId, single line of sha256 text'
      - field: angelCantos
        effect: 'hash string appended on first encounter only'
      - field: angelEncounterCount
        effect: 'incremented on first encounter only'
      - field: manualDiscoveries
        effect: 'event:angel-canto recorded on first canto received'
    determinism: deterministic

  - id: angel-hash-grid-display
    description: >
      The 64-character sha256 hash is displayed as an 8x8 grid of single
      hex characters in both the dialog box and the permacomputer cantos
      screen. The grid uses Times New Roman font at a size slightly larger
      than the surrounding monospace text, giving it a strange, tablet-like
      quality — like receiving the ten commandments. In the dialog box, the
      hash grid replaces the single-line text display. In the cantos screen,
      each cell shows a single hex character (not 4-char truncation). The
      full hash is shown on hover as before.
    inputs:
      - 'Angel dialog opens or cantos tab is viewed'
    outputs:
      - '8x8 grid of hex characters rendered in Times New Roman'
    state_changes: []
    determinism: deterministic

  - id: angel-cantos-storage
    description: >
      Sha256 hashes from angel encounters are stored in state.angelCantos
      as an ordered array of strings. Maximum capacity is 64 entries (8x8
      grid). When the grid is full, new cantos overwrite the oldest entry
      (FIFO). Each canto is a full 64-character hex string. A canto is only
      stored on the first encounter with each angel — repeated interactions
      with the same angel do not add duplicate cantos.
    inputs:
      - 'First angel dialog with a given angel completes'
    outputs:
      - 'Hash added to angelCantos array'
    state_changes:
      - field: angelCantos
        effect: 'new hash string pushed; if length > 64, first entry shifted off'
    determinism: deterministic

  - id: cantos-tab
    description: >
      The "CANTOS" tab in the PermacomputerShell displays angel cantos as
      an 8x8 grid where each cell shows a single hex character from the
      hash in Times New Roman font, slightly larger than surrounding text.
      Empty cells are rendered as dim placeholders. The full hash is shown
      on hover or focus. The grid evokes a stone tablet aesthetic.
    inputs:
      - 'User navigates to CANTOS tab in permacomputer'
    outputs:
      - '8x8 grid of canto hashes rendered in panel with Times New Roman'
    state_changes: []
    determinism: deterministic

  - id: angel-despawn
    description: >
      Angels despawn after ANGEL_LIFESPAN_MS (configurable, ~120 seconds).
      On despawn, a full-screen white flash fires (same as spawn flash).
      The entity and all components are destroyed. A new spawn is scheduled
      at nextAngelSpawnTime.
    inputs:
      - 'Angel entity age exceeds ANGEL_LIFESPAN_MS'
    outputs:
      - 'Angel entity destroyed'
      - 'Full-screen white flash rendered on despawn frame'
    state_changes:
      - field: world
        effect: 'angel entity and all components removed'
      - field: nextAngelSpawnTime
        effect: 'set to time + ANGEL_SPAWN_INTERVAL_MS + jitter'
      - field: angelFlashTime
        effect: 'set to current time to trigger screen flash'
    determinism: deterministic

  - id: angel-movement-blocking
    description: >
      Angels block player movement. All 9x9 body tiles are impassable.
      Angel body tiles are added to getBlockedPositions. The player must
      approach an angel and press [f] to interact. Click-to-move pathfinding
      routes around angel body tiles.
    inputs:
      - 'Player attempts to move onto angel-occupied tile'
    outputs:
      - 'Movement is blocked'
    state_changes: []
    determinism: deterministic

  - id: angel-character-definition
    description: >
      Each angel type (rain, bees, clover) has a CharacterDefinition
      registered dynamically on spawn. The name uses "Angel of X" format
      (e.g. "Angel of Rain", "Angel of Bees", "Angel of Clover"). The
      definition includes a glyph for the dialog header and the
      sha256 dialog line. Definition is removed on despawn.
    inputs:
      - 'Angel spawns'
    outputs:
      - 'CharacterDefinition registered in CHARACTER_DEFINITIONS'
    state_changes: []
    determinism: deterministic

  - id: angel-click-to-interact
    description: >
      Right-clicking any angel body tile pathfinds the player to the
      nearest adjacent walkable tile and triggers dialog on arrival.
      Angel tiles remain cursorable but no visual highlight is applied
      on hover.
    inputs:
      - 'Player right-clicks an angel body tile'
    outputs:
      - 'Click-to-interact pathfinds and opens dialog on arrival'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: angel-spawn-no-valid-tile
    description: 'All candidate spawn tiles are blocked or too close to player'
    expected: 'Spawn is skipped, nextAngelSpawnTime reset with jitter'

  - id: angel-full-cantos-grid
    description: 'Player has 64 cantos and encounters another angel'
    expected: 'Oldest canto is removed (FIFO), new canto takes last position'

  - id: angel-drift-into-water
    description: 'Angel drifts toward a pond or river tile'
    expected: 'Drift validation rejects the move; angel stays in place'

  - id: angel-tween-during-zone-transition
    description: 'Player enters cave while angel body is mid-tween'
    expected: 'clearMovementTweens removes the angel tween component along with the player tween; on overworld return, body renders at integer Position with no carry-over interpolation'

  - id: angel-dialog-during-tween
    description: 'Player walks under tweening angel and opens dialog mid-tween'
    expected: 'Tween completes normally over its remaining duration; subsequent drift ticks are frozen by the active-dialog check until dialog closes'

  - id: angel-despawn-during-tween
    description: 'ANGEL_LIFESPAN_MS elapses while body is mid-tween'
    expected: 'Entity is destroyed; MovementTween component is removed with the entity; despawn flash fires as normal'

  - id: angel-drift-tick-before-tween-complete
    description: 'Drift tick fires again while previous tween is still in flight'
    expected: 'moveEntity overwrites the MovementTween component with a new fromX/fromY snapshot of the previous destination; body resumes tweening from current logical position toward new destination'

  - id: angel-zone-transition
    description: 'Player enters cave while angel exists on overworld'
    expected: 'Angel continues to exist and produce aura effects on overworld; not rendered in cave'

  - id: angel-deep-time
    description: 'Deep time begins while angel is active'
    expected: 'Angel is destroyed at deep time start; no new angels spawn during deep time'

  - id: angel-dialog-while-ghost-dialog
    description: 'Player walks under angel while already in dialog with a ghost'
    expected: 'Angel dialog does not trigger; existing dialog takes priority'

  - id: angel-repeated-walk-through
    description: 'Player walks through angel body multiple times during same spawn'
    expected: 'Dialog triggers every time; canto stored only on first encounter'

  - id: angel-flash-during-cave
    description: 'Angel spawns or despawns while player is in cave'
    expected: 'Flash does not render; angel exists on overworld only'

  - id: angel-gold-aura-overlap
    description: 'Gold aura overlaps with rain aura, clover, or other terrain'
    expected: 'Gold fillRect renders behind tile chars; does not interfere with rain overlay or other effects'

  - id: angel-hash-grid-odd-length
    description: 'Hash string is not exactly 64 characters for some reason'
    expected: 'Grid renders available characters; remaining cells show dim placeholder'

  - id: angel-spawn-probability-bounds
    description: 'Angel spawn has 0% chance when no valid tile exists at least 30 tiles from player'
    expected: 'Spawn attempt exits early after max attempts; nextAngelSpawnTime reset with jitter'

failure_conditions:
  - trigger: 'Angel spawn position calculation selects space or sand tile'
    expected: 'Tile validation rejects non-dirt/clover tiles; spawn retries or defers'

  - trigger: 'sha256 hash generation produces duplicate for same steward'
    expected: 'Extremely unlikely (2^256 space) but cantos array accepts duplicates'

  - trigger: 'Angel Aura component missing on tick'
    expected: 'Aura tick silently skips; no crash'

  - trigger: 'Angel flash time set but player not in overworld'
    expected: 'Flash rendering skipped when in cave zone'

verification:
  test_file: src/engine/__tests__/angels.test.ts
  test_pattern: 'angel'
  command: npx vitest run src/engine/__tests__/angels.test.ts
