id: RP-70
name: 'The Map (permacomputer tab) and Geodetic Markers'
priority: medium
layer: integration
source_files:
  - src/engine/items.ts
  - src/engine/placeable.ts
  - src/engine/interaction.ts
  - src/engine/characters.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/constants.ts
  - src/engine/systems/types.ts
  - src/components/PermacomputerShell.tsx
  - src/components/MapPanel.tsx
  - src/components/MapPanel.helpers.ts
  - src/components/GameScreen.tsx
  - src/hooks/useKeyboard.ts
dependencies: ['RP-22-named-regions-chronicle', 'RP-59-in-hand-place']

# RP-70 reframes the backlog's "held item consulted via RP-59" into a
# permacomputer tab. The map is a key item (not an inventory item), the
# consult surface is read-only, the prairie clock is NOT paused (the
# backlog's pausesPlayerTime is overridden), and the map is NOT
# fog-gated — it is a fixed inherited chart. Marking is item-shaped via
# Geodetic Markers. No fog/sketch/marked tier vocabulary appears here.
#
# RP-70 cleanup (change-request) reframed acquisition and presentation:
# the map is gifted by Gron at the end of his first dialog (no longer a
# cellar pickup); the 7 cellar markers and the cellar map item are gone,
# leaving 3 ruin markers; the map is a monochromatic diegetic chart in
# the title-card italic serif; it renders whichever zone the steward
# stands in so marks work inside ruins; it zooms; hover is dropped.

behaviors:
  - id: map-tab-gated-by-discovery
    description: >
      The permacomputer MAP tab is hidden until the steward has
      acquired the map. PermacomputerShell SCREEN_TABS includes an
      entry { screen: 'map', label: 'MAP' } whose isVisible(state)
      returns state.manualDiscoveries.has('item:map'). Before
      acquisition the tab is absent from the rendered tab bar; after
      acquisition it is present and selectable. Mirrors the COYOTE tab
      gate on 'event:rescue-coyote'. Canonical tab order becomes
      MANUAL, MAP, DIVINATION, COYOTE, ALBUM, SYS — MAP sits
      immediately after MANUAL. The permacomputer-tab-visibility spec
      is amended in the same change to reflect this order and gate.
    inputs:
      - 'GameState with manualDiscoveries not containing item:map'
      - 'GameState with manualDiscoveries containing item:map'
    outputs:
      - 'boolean from isVisible: false before acquisition, true after'
    state_changes: []
    determinism: deterministic

  - id: gron-gift-acquisition
    description: >
      The map is gifted by Gron, not found in the cellar. Gron's
      CHARACTER_DEFINITIONS entry carries gift {kind: 'item', id: 'map'},
      and the last line of his first dialog (the AwaitingCoyote block) is
      the human-authored handoff "Here. From your predecessor.".
      Completing that final line fires giveCharacterGift(state, 'gron')
      in advanceDialog. giveCharacterGift special-cases the map key item:
      it adds 'gron' to state.giftsReceived, records
      recordDiscovery(state, 'item:map') (unlocking the MAP tab), invokes
      state.onMapAcquired (the React layer wires it to
      setActiveScreen('map')), and returns a GiftAnnouncement for the
      map. The map does NOT enter state.backpack — it occupies no
      inventory slot. The gift fires once; a second giveCharacterGift
      call after giftsReceived contains 'gron' returns null. No map
      ground item is seeded anywhere.
    inputs:
      - "GameState where the steward completes Gron's first dialog"
    outputs:
      - 'GiftAnnouncement for the map on first completion; null thereafter'
    state_changes:
      - field: giftsReceived
        effect: "'gron' added"
      - field: manualDiscoveries
        effect: "'item:map' added"
      - field: backpack
        effect: 'unchanged — the map is not added as an inventory item'
      - field: onMapAcquired
        effect: 'callback invoked once, wired by the React layer to setActiveScreen(map)'
    determinism: deterministic

  - id: geodetic-marker-genesis-seeding
    description: >
      Genesis seeds exactly 3 geodeticMarker items as groundItem ECS
      entities — one each just inside the bee, clover, and coyote ruins,
      the three role-ruins among the 5 Starter ruins — on a walkable
      interior tile nearest the entrance (never on the entrance tile
      itself, which the steward spawns on), with EntityZone {zone:
      Zone.Ruin, ruinIndex}. The wildflower and tallGrass ruins get no
      marker. No markers are seeded in the Knot cellar (the cellar
      seeding was removed in the RP-70 cleanup), and no map ground item
      is seeded. Markers are seeded once at genesis and persist through
      serialization; picking one up removes it permanently and
      re-entering a ruin does not re-seed.
    inputs:
      - 'GameState immediately after createGameState (genesis complete)'
    outputs:
      - 'total geodeticMarker count equals 3, all ruin-zoned'
      - 'exactly 3 ruin-zoned markers, in the bee, clover, and coyote ruins'
      - 'zero markers tagged Zone.KnotCellar; zero map ground items'
    state_changes:
      - field: world
        effect: 'one groundItem ItemDrop geodeticMarker entity inside each of the bee/clover/coyote ruins (3), each EntityZone-tagged {zone: Zone.Ruin, ruinIndex}'
    determinism: deterministic

  - id: geodetic-marker-placement
    description: >
      A geodeticMarker held in hand (RP-59) is placed on left-click via
      a geodeticMarker PlaceableSpec (verb 'lay') mirroring the camera.
      Placement pushes a PlacedMarker {uid, x, y, zone, ruinIndex?,
      label} to state.placedMarkers, creates an ECS entity tagged
      'placedMarker' with Position + EntityZone + ItemDrop {definitionId:
      'geodeticMarker'} as the render hook, removes the placed instance
      from the backpack, and calls advanceInHand to keep the next marker
      in hand. When laid inside a ruin (state.currentZone === Zone.Ruin
      with a non-null state.currentRuinIndex) the PlacedMarker records
      that ruinIndex (mirroring PlacedCamera) so the map can resolve the
      mark to the correct ruin interior; on the overworld ruinIndex is
      omitted. The label is GM-N where N is the lowest free index in
      1..10 across current state.placedMarkers — picking a marker up
      frees its number for reuse. The placed instance's uid is preserved
      on the PlacedMarker.
    inputs:
      - 'GameState with a geodeticMarker in hand and the cursor over a walkable, unoccupied, in-bounds tile that is not the player tile'
    outputs:
      - 'void; state.placedMarkers gains one entry'
    state_changes:
      - field: placedMarkers
        effect: 'one PlacedMarker appended with the held uid, cursor x/y, current zone, the current ruinIndex when in a ruin, and the lowest free GM-N label'
      - field: world
        effect: "one ECS entity tagged 'placedMarker' created at the cursor tile with the geodeticMarker ItemDrop render hook"
      - field: backpack
        effect: 'the placed geodeticMarker instance removed'
      - field: equippedItemUid
        effect: 'advanced to the next backpack geodeticMarker, or cleared when the stack is exhausted'
    determinism: deterministic

  - id: geodetic-marker-retrieval
    description: >
      A placed Geodetic Marker is recoverable like a placed camera —
      facing it and interacting picks it back up. Retrieval removes the
      matching state.placedMarkers entry and its 'placedMarker' ECS
      entity, returns a geodeticMarker instance to the backpack with
      the original uid preserved, and frees the GM-N label for reuse by
      the next placement.
    inputs:
      - 'GameState with the player facing a placed Geodetic Marker and interacting'
    outputs:
      - 'the marker returned to the backpack; its map mark removed'
    state_changes:
      - field: placedMarkers
        effect: 'the matching PlacedMarker entry removed, freeing its GM-N label'
      - field: world
        effect: "the corresponding 'placedMarker' ECS entity destroyed"
      - field: backpack
        effect: 'a geodeticMarker instance returned with the original uid'
    determinism: deterministic

  - id: map-tab-composition
    description: >
      MapPanel mounts full-screen (via ModalShell — a z-30 portal over the
      whole viewport, not inside the 500px permacomputer shell) following
      the ScanResultModal / TimeLapsePlayback precedent; Escape, Tab, or a
      backdrop click closes it back to the game, and a low-emphasis
      "Press Esc to close" hint is shown. It renders a monochromatic ASCII
      chart — a single amber-ink ramp on dark parchment, deliberately NOT
      the prairie's tile palette, so it reads as a diegetic document — on a
      canvas sized to the full viewport (maximized over everything,
      including the bottom bar), fitting the iso diamond to the viewport via
      a local layout helper plus projectIso/drawIsoTile. Icon glyphs are
      drawn in the title-card italic serif (Libre Baskerville stack,
      matching zoneTransitionOverlay), except Geodetic Markers which stay
      hot pink (the reserved user-action color, via the shared HOT_PINK
      constant) so they pop against the monochrome.

      The map renders whichever zone the steward is standing in (selected
      by selectMapView in MapPanel.helpers): the overworld landmass, a ruin
      interior (state.ruinInteriors[currentRuinIndex].map), or the Knot
      cellar (state.cellarMap); zones without a marker-bearing interior
      (cave, house, yards) fall back to the overworld. Every non-Space tile
      fills as land with a lighter coastline rim at tiles 4-adjacent to the
      Space void or map edge. Water (state.ponds, state.rivers) and the
      fixed landmark glyphs — the little house, the cave, Whine, every ruin
      entrance, and named-region rings — are drawn only on the overworld
      view. Geodetic Markers are filtered to the current view by
      markersForView: overworld shows zone===Overworld marks, a ruin shows
      zone===Ruin marks whose ruinIndex matches currentRuinIndex, the
      cellar shows zone===KnotCellar marks — so a mark laid inside a ruin
      surfaces on that ruin's interior chart and never mis-projects onto
      another zone. Placed cameras and meteorites draw on the overworld in
      the monochrome ramp.

      The chart zooms via the mouse wheel (zooming toward the cursor, the
      world point under the cursor held fixed) and on-screen +/- buttons
      (zooming toward the viewport center); zoom is clamped to
      [MIN_ZOOM, MAX_ZOOM] and snapping back to MIN_ZOOM recenters. There
      is no hover tooltip — place names are not surfaced on the chart. The
      panel is read-only — no click-to-annotate. The prairie clock is NOT
      paused while the map is open.
    inputs:
      - 'GameState with the MAP tab open (activeScreen === map)'
      - 'GameState with currentZone set to overworld, a ruin, or the Knot cellar'
    outputs:
      - "a full-screen monochrome canvas chart of the steward's current zone, with markers filtered to that zone, zoomable via wheel and +/- buttons, and an exit hint"
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: all-markers-placed-no-op
    description: 'All available Geodetic Markers are already placed in the world, so none remain in the backpack and none can be held in hand'
    expected: 'placement cannot be initiated (nothing in hand to place); the cap is enforced purely by physical scarcity with no error and no message'
  - id: marker-label-reuse-after-pickup
    description: 'GM-3 is placed (leaving 1,2 used and 4..N free), then picked back up, then a new marker is placed'
    expected: 'the freed index 3 is the lowest free index and is reused — the new placement is labeled GM-3'
  - id: ruin-marker-shows-on-ruin-chart
    description: 'A Geodetic Marker is laid inside a ruin, then the steward opens the map while still standing in that ruin'
    expected: 'the PlacedMarker records zone Zone.Ruin and the current ruinIndex; the map renders that ruin interior and draws the mark on it (filtered by markersForView). The same mark does not appear on the overworld chart or on a different ruin'
  - id: ruin-marker-not-duplicated-on-reentry
    description: 'The player enters a ruin, leaves without taking its seeded marker, then re-enters'
    expected: 'the ruin marker is the same single genesis-seeded entity — re-entry does not create a second marker'
  - id: map-zoom-anchors-focus
    description: 'The steward scrolls the wheel over a point on the chart, then clicks the +/- buttons'
    expected: 'wheel zoom keeps the world point under the cursor fixed; button zoom scales about the viewport center; zoom is clamped to [MIN_ZOOM, MAX_ZOOM]; returning to MIN_ZOOM recenters the chart with zero pan'
  - id: map-tab-clock-not-paused
    description: 'The MAP tab is open for a span of real time covering a weather tick'
    expected: 'state.seasonalPhase advances normally while the tab is open — the map does not freeze the prairie clock'
  - id: minimap-untouched
    description: 'The MAP tab and Minimap coexist'
    expected: 'src/components/Minimap.tsx is unchanged — the passive HUD minimap remains the separate god-eye glance'

failure_conditions:
  - trigger: 'A geodeticMarker placement is attempted on a non-walkable, out-of-bounds, occupied, or player-occupied tile'
    expected: 'canPlace returns false, no PlacedMarker is appended, no ECS entity is created, the marker stays in hand'
  - trigger: 'manualDiscoveries does not contain item:map'
    expected: 'the MAP tab isVisible returns false and the tab is absent from the permacomputer tab bar'
  - trigger: 'Gron gifts the map'
    expected: 'the map is not added to state.backpack and consumes no inventory slot; only item:map discovery and the onMapAcquired open fire'
  - trigger: "giveCharacterGift(state, 'gron') is called a second time after giftsReceived contains gron"
    expected: 'it returns null — the map is gifted exactly once'
  - trigger: 'All available markers are placed and the steward attempts another placement'
    expected: 'no geodeticMarker is in hand, so placement is a no-op — state.placedMarkers length is unchanged'

verification:
  test_file: src/engine/__tests__/RP-70-the-map.test.ts
  test_pattern: 'RP-70'
  command: 'npx vitest run src/engine/__tests__/RP-70-the-map.test.ts -t RP-70'
