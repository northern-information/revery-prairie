id: sidebar-cursor-info-overflow
name: 'Sidebar cursor info renders without overflowing the panel'
priority: medium
layer: component
source_files:
  - src/components/Sidebar.tsx
dependencies:
  - cursor-tile-info-all-types
behaviors:
  - id: elevation-rounded-to-integer
    description: >
      The Cursor section's Elevation row renders the underlying float value
      rounded to the nearest integer (Math.round). Raw floats like
      50.962029139403 must never reach the DOM. The engine's elevation map
      keeps its float values untouched — only the display is rounded.
    inputs:
      - 'state.cursorTile resolves to a tile with state.elevation.get(key) returning a non-integer float'
    outputs:
      - 'sidebar Elevation cell text is the integer Math.round(elev), e.g. "51" for 50.962029139403'
    state_changes: []
    determinism: deterministic
  - id: water-rendered-as-integer-percent
    description: >
      The Cursor section's Water row renders the tile water level as an
      integer percent suffixed with "%". Because WATER_MAX is 100, this is
      Math.round(water) followed by "%". The previous "{water}/{WATER_MAX}"
      format is replaced. Both render sites (clover row and dirt/burnt clover
      row) use the same formatting.
    inputs:
      - 'state.cursorTile resolves to a Clover, Dirt, or BurntClover tile with state.tileWater.get(key) defined'
    outputs:
      - 'sidebar Water cell text is "{Math.round(water)}%", e.g. "98%" for 98.25'
    state_changes: []
    determinism: deterministic
  - id: value-cells-truncate-rather-than-overflow
    description: >
      Every value cell in the Cursor info table must clip to the panel width
      rather than expand the table column past the sidebar's visible bounds.
      Implementation uses whitespace-nowrap + overflow-hidden + text-ellipsis
      on the value <td> (or an inner span), and table-fixed on the table so
      column widths are bounded by the container, not by content. This
      prevents any single long value (long character names, long effect
      labels, future entity names) from pushing right-aligned values in
      sibling rows past the panel's right edge.
    inputs:
      - 'cursor info value cell contains a string longer than the available column width'
    outputs:
      - 'value cell text is clipped (with ellipsis) within the panel'
      - 'sibling rows in the same table render their full content within the panel bounds'
    state_changes: []
    determinism: deterministic
edge_cases:
  - id: float-elevation-zero
    description: >
      An elevation of 0 (water tile, deep crater) renders as "0", not "—" or
      blank. Only undefined elevation falls back to the muted "—" placeholder.
    expected: 'Elevation cell shows "0" when state.elevation.get(key) === 0'
  - id: water-zero
    description: >
      A water level of 0 renders as "0%", not blank or "—". The dirt-row
      conditional (which currently hides the row when water is undefined)
      is preserved — only undefined hides the row, not zero.
    expected: 'Water cell shows "0%" when tileWater.get(key) === 0'
  - id: undefined-elevation-shows-dash
    description: >
      Tiles outside the elevation map (or before genesis seeds them) render
      as "—" with the muted text class.
    expected: 'Elevation cell shows "—" when state.elevation.get(key) returns undefined'
  - id: long-effect-label-clipped
    description: >
      A simulated long effect string (e.g. concatenated effects exceeding the
      column width) clips with ellipsis and does not push the Position row's
      coordinate text past the panel edge.
    expected: 'Position row remains fully visible inside the panel when the Effects cell content is longer than the column'
failure_conditions:
  - trigger: 'cursor hovers a tile whose elevation float has many decimal digits (e.g. 50.962029139403)'
    expected: 'Elevation cell renders the rounded integer; Position/Contents/Effects/Water rows remain visible inside the sidebar instead of being clipped past the right edge'
  - trigger: 'cursor hovers a Clover, Dirt, or BurntClover tile with a fractional water value (e.g. 98.25)'
    expected: 'Water cell renders as integer percent ("98%"), not "98.25/100"'
  - trigger: 'a value cell contains a string longer than the available column width'
    expected: 'value cell clips with ellipsis; the table does not expand past the sidebar panel and other rows are not pushed off-screen'
verification:
  test_file: src/components/__tests__/Sidebar.cursorInfoOverflow.test.tsx
  test_pattern: 'cursor info overflow'
  command: 'npx vitest run src/components/__tests__/Sidebar.cursorInfoOverflow.test.tsx'
