id: precis-9a-torchbearer-voice
name: 'Precis #9a — Torchbearer voice pass'
priority: medium
layer: engine
source_files:
  - src/engine/types.ts
  - src/engine/characters.ts
  - src/engine/manual.ts
  - public/music/MANIFEST.md
  - src/engine/__tests__/moab-colde.test.ts
dependencies:
  - moab-colde
  - precis-2-phenological-seasons

# Doctrine context (docs/precis-thinktank-v3.md, docs/precis-status.yaml #9):
#   "Torchbearer NPC, player walks the line, voice pass before behavior pass."
#
# This spec lands the voice pass only. The walking-the-line interaction,
# burn ignition, refusal (player-side and Moab-side), and ash-prairie
# outcome defer to precis-9b. Design intent recorded for 9b: walking is
# "click to draw a line, then walk it together" (path drawn before Moab
# arrives, both traverse on confirm).
#
# Voice = how Moab reads in dialog. The seasonal arrival (Moab walks out
# of his cave at thaw) is mechanically a behavior change; it lives in 9b.
# This spec changes only:
#   1. CharacterEntry gains an optional `title` field (used by Moab now;
#      available to other characters in future voice passes).
#   2. Moab's dialog becomes a season-dispatched function (matches the
#      getGronDialog pattern at characters.ts:112). Three registers —
#      Winter, Spring, default (Summer/Autumn).
#   3. Existing egregore refusal line ("The other clover. We do not
#      grow that.") is preserved verbatim across all registers — that
#      line is locked by precis-8a doctrine and is not a voice-pass
#      concern.
#   4. Moab gets a `music` field set to '/music/moab.mp3'. The asset is
#      gitignored (per CLAUDE.md music section); MANIFEST.md is updated
#      to list the expected file. No track ships in this PR.
#   5. MANUAL_LORE['character:moab'] is reset to { lore: 'TODO' } per
#      the lore-is-human-authored rule. Tyler authors the replacement
#      in a separate commit.
#
# Out of scope:
#   - Authoring the actual Moab manual lore string. (Placeholder only.)
#   - Authoring or committing the Moab music asset. (Stub only.)
#   - Seasonal cave-exit movement. That is behavior (9b).
#   - postGiftDialog. Moab has no gift in current code (fire revery
#     deleted in precis-0). The field stays absent.

behaviors:
  - id: title-field-on-character-entry
    description: >
      CharacterEntry gains an optional `title` field of type string.
      Backwards compatible — existing entries without a title continue
      to work. The Moab entry sets title to 'drip torchbearer' (folk
      register, lowercase, no leading article). No renderer or UI
      consumes the title in this PR; it is content metadata that
      future surfaces (dialog header, manual entry header) can read.
    inputs:
      - "getCharacterDefinition('moab')"
    outputs:
      - "CharacterDefinition with title 'drip torchbearer'"
      - 'CharacterDefinition for characters without a title returns title === undefined'
    state_changes: []
    determinism: deterministic

  - id: moab-dialog-multi-register
    description: >
      getCharacterDialog dispatches to getMoabDialog(state) when
      characterId === 'moab'. getMoabDialog switches on
      state.weather.season and returns one of three line arrays.
      Each register is at least one line. The last line of every
      register is the egregore refusal "The other clover. We do not
      grow that." — preserved verbatim from the current dialog and
      locked by precis-8a doctrine.

      Concrete content is human-authored prose; the spec fixes the
      structure (three registers + locked final line) and leaves the
      exact opener lines to the implementation, which copies them
      from the lines committed in this PR.
    inputs:
      - "getCharacterDialog(state, 'moab') with state.weather.season === Season.Winter"
      - "getCharacterDialog(state, 'moab') with state.weather.season === Season.Spring"
      - "getCharacterDialog(state, 'moab') with state.weather.season === Season.Summer"
      - "getCharacterDialog(state, 'moab') with state.weather.season === Season.Autumn"
    outputs:
      - 'Winter register returned for Winter season'
      - 'Spring register returned for Spring season'
      - 'Default register returned for Summer and Autumn seasons (same array reference for both)'
      - 'Every register has its last line equal to "The other clover. We do not grow that."'
    state_changes: []
    determinism: deterministic

  - id: moab-dialog-folk-register-rules
    description: >
      Every line in every Moab register obeys the folk-Coldë voice
      rules already established by the existing dialog and locked
      by precis-8a (and inherited from precis-21 doctrine for Gron):
      no contractions, statement-not-question form, no direct
      address by title, no editorial affect. Lines are short. The
      voice is reserved and seasonal. The test for this behavior
      asserts the no-contraction rule programmatically by scanning
      every line of every register for apostrophe-t, apostrophe-s,
      apostrophe-re, apostrophe-ll, apostrophe-ve, apostrophe-d,
      and apostrophe-m sequences.
    inputs:
      - 'every line of every register returned by getMoabDialog'
    outputs:
      - 'no line contains a contraction'
    state_changes: []
    determinism: deterministic

  - id: moab-music-field-stub
    description: >
      Moab's CharacterEntry gains a `music` field set to
      '/music/moab.mp3' (matches the Gron pattern at characters.ts:29).
      The MP3 file itself is gitignored — public/music/MANIFEST.md is
      updated to list moab.mp3 as a required asset, so a fresh
      checkout knows to place one. The dialog-music crossfade system
      reads this field automatically; no separate wiring needed.
      Until the asset is placed, the audio system handles the missing
      file gracefully (no track plays, no crash) — same behavior as
      Gron when his asset is absent.
    inputs:
      - "getCharacterDefinition('moab').music"
    outputs:
      - "'/music/moab.mp3'"
      - 'public/music/MANIFEST.md contains an entry for moab.mp3'
    state_changes: []
    determinism: deterministic

  - id: moab-manual-lore-todo
    description: >
      MANUAL_LORE['character:moab'] is set to { lore: 'TODO' },
      replacing the existing "Not much to see but an emaciated
      skeleton..." string. Lore is human-authored — the placeholder
      signals that the new Torchbearer-voiced lore is pending. The
      manual rendering layer already handles 'TODO' entries (see
      zone:ruin-dormant-garden which currently uses the same
      placeholder).
    inputs:
      - "MANUAL_LORE['character:moab']"
    outputs:
      - "{ lore: 'TODO' }"
    state_changes: []
    determinism: deterministic

  - id: moab-static-dialog-fallback-preserved
    description: >
      The static CharacterEntry.dialog field on the Moab entry is
      retained (not deleted) and contains the same two-line content
      it has today — the placeholder ellipsis plus the egregore
      refusal. Legacy callers that bypass getCharacterDialog (snapshot
      fixtures, direct CHARACTERS reads) continue to see a non-empty,
      doctrine-compliant dialog. This mirrors the existing Gron
      pattern at characters.ts:24-28.
    inputs:
      - "CHARACTERS['moab'].dialog"
    outputs:
      - 'array length === 2'
      - 'last element === "The other clover. We do not grow that."'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: weather-state-missing
    description: >
      state.weather is initialized synchronously by createGameState in
      every code path that reaches dialog (overworld, cave, tests that
      go through createGameState). A test that constructs a partial
      GameState manually without state.weather would crash on
      state.weather.season access.
    expected: >
      getMoabDialog reads state.weather.season directly with no
      defensive nullish coalescing. If a test fabricates state without
      weather, the access throws TypeError — surfaced loudly, not
      silently coerced to a default register. Tests must use
      createGameState (existing convention).

  - id: cave-zone-dialog
    description: >
      Player talks to Moab inside the cave (where he currently lives).
      The cave has no weather — state.weather is the overworld weather
      and persists across zone swaps (verified at state.ts initialization).
    expected: >
      getMoabDialog reads the same state.weather.season regardless of
      state.currentZone. Moab's register is determined by the prairie's
      season, not the cave's local conditions. This is intentional —
      his voice tracks the outside cycle even from inside the cave.

  - id: egregore-discovery-does-not-override
    description: >
      Player has discovered any flora:egregore-* manual entry. The
      egregore refusal final line is already in every register, so
      no additional dispatch is needed.
    expected: >
      All three registers end with the egregore refusal regardless of
      manualDiscoveries content. No new conditional logic.

  - id: moab-music-asset-absent
    description: >
      A fresh checkout has no public/music/moab.mp3 yet (the file is
      gitignored and must be placed manually per CLAUDE.md). The
      player opens dialog with Moab.
    expected: >
      The audio layer attempts to load /music/moab.mp3, fails
      silently, and no track plays during dialog. Dialog itself
      proceeds normally. Same graceful-degradation behavior as
      Gron's existing music wiring.

  - id: moab-manual-lore-renders-todo
    description: >
      Player opens the Prairie Manual and navigates to the Moab
      entry after MANUAL_LORE['character:moab'].lore is reset to
      'TODO'.
    expected: >
      The manual renders the entry header (name, title once it is
      surfaced) and the literal string 'TODO' in the lore slot.
      No crash, no special placeholder treatment beyond what the
      existing zone:ruin-dormant-garden TODO entry already renders.

  - id: title-undefined-for-existing-characters
    description: >
      Gron, Coyote, and Gate do not have a title field. Tests that
      currently assert on CharacterDefinition structure must continue
      to pass.
    expected: >
      CharacterDefinition.title is optional (`title?: string`).
      Existing entries that omit it serialize and consume as before.

failure_conditions:
  - trigger: 'getMoabDialog called with an unrecognized Season value'
    expected: >
      Unreachable in production — Season is a string-literal union
      exhaustively covered by the switch. A defensive default branch
      returns the default (Summer/Autumn) register so a future
      Season extension does not crash the dialog system.
  - trigger: "getCharacterDialog called with characterId === 'moab' before state.weather is populated"
    expected: >
      TypeError on state.weather.season access. Test infrastructure
      uses createGameState which always populates weather; production
      paths cannot reach dialog before createGameState completes.
  - trigger: 'Moab CharacterEntry has a title field but the type definition does not declare it'
    expected: >
      TypeScript compile error at characters.ts. CharacterEntry must
      declare `title?: string` for the assignment to type-check.

verification:
  test_file: src/engine/__tests__/moab-colde.test.ts
  test_pattern: 'torchbearer|voice|register|title'
  command: 'npx vitest run src/engine/__tests__/moab-colde.test.ts'
