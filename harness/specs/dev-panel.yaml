id: dev-panel
name: 'Dev panel'
priority: medium
layer: integration
source_files:
  - src/engine/devPanel.ts
  - src/components/DevPanel.tsx
  - src/components/GameScreen.tsx
  - src/hooks/useKeyboard.ts
dependencies:
  - player-movement

behaviors:
  - id: toggle-visibility
    description: >
      pressing backtick toggles the dev panel visibility. the panel only
      renders when import.meta.env.DEV is true. the toggle sets
      state.devPanelOpen boolean. movement and other keybinds remain
      active while the panel is open.
    inputs:
      - 'keydown event with key === "`"'
      - 'import.meta.env.DEV is true'
    outputs:
      - 'DevPanel component renders or unmounts'
    state_changes:
      - field: devPanelOpen
        effect: 'toggled between true and false'
    determinism: deterministic

  - id: component-introspection
    description: >
      the entity tab enumerates all ComponentType values from the ECS
      type system. each component type is rendered as a collapsible
      section with editable fields matching ComponentDataMap[K]. fields
      are toggled on/off with checkboxes. checked components will be
      attached to the spawned entity.
    inputs:
      - 'Object.values(ComponentType) from ecs/types.ts'
    outputs:
      - 'collapsible section per ComponentType with typed input fields'
    state_changes: []
    determinism: deterministic

  - id: component-field-editing
    description: >
      each checked component exposes editable fields. number fields use
      number inputs. string fields use text inputs. boolean fields use
      checkboxes. union/enum fields (e.g. TimedEffect.kind, Zone,
      AngelData.auraKind) use dropdowns. Position fields default to
      0,0 and are overridden by drag-drop placement. startTime fields
      default to Date.now() at spawn time.
    inputs:
      - 'user edits field values in the panel'
    outputs:
      - 'component data object updated in panel state'
    state_changes: []
    determinism: deterministic

  - id: entity-presets
    description: >
      a presets dropdown offers named configurations that pre-check
      components and fill default values matching existing spawn
      functions. selecting a preset populates the form. presets are
      defined as a static DEV_PRESETS object in devPanel.ts. presets
      include: bee, angel, shooting-star, meteorite, ghost, ground-item,
      beehive, lightning, explosion, wildfire.
    inputs:
      - 'user selects a preset from dropdown'
    outputs:
      - 'component checkboxes and field values populated'
    state_changes: []
    determinism: deterministic

  - id: drag-to-place
    description: >
      a drag handle in the panel initiates a drag operation. during drag,
      a ghost preview renders at the hovered map tile showing the entity
      char and color (from Renderable component if checked, or a fallback
      glyph derived from EntityTag). on drop over a valid map tile,
      createEntity() is called and all checked components are added with
      their configured values. Position is set to the drop tile
      coordinates. EntityZone defaults to state.currentZone.
    inputs:
      - 'mousedown on drag handle, mousemove over canvas, mouseup on tile'
    outputs:
      - 'new ECS entity created with configured components'
      - 'ghost preview shown during drag'
    state_changes:
      - field: world
        effect: 'new entity added with all checked components'
    determinism: deterministic

  - id: spawn-at-cursor
    description: >
      clicking the spawn button creates the entity at the current cursor
      tile position (state.cursorTile). if no cursor tile is active, the
      button is disabled. behaves identically to drag-drop placement but
      uses cursor position instead of drop position.
    inputs:
      - 'click spawn button while cursor is over a map tile'
    outputs:
      - 'new ECS entity created at cursor tile'
    state_changes:
      - field: world
        effect: 'new entity added with all checked components at cursor position'
    determinism: deterministic

  - id: tile-painting-tab
    description: >
      a separate tab in the dev panel enumerates all TileType values.
      selecting a tile type activates paint mode. clicking or
      click-dragging on the map sets tiles to the selected type. painting
      updates state.map[y][x].type directly. a clear button exits paint
      mode.
    inputs:
      - 'user selects tile type and clicks/drags on map'
    outputs:
      - 'map tiles changed to selected type'
    state_changes:
      - field: map[y][x].type
        effect: 'set to selected TileType'
    determinism: deterministic

  - id: casing-convention
    description: >
      visible text in the dev panel follows the project casing rules. the
      panel title is "Dev Panel". section labels (preset, archetype, glyph,
      value, filter placeholder) use sentence case. clickable
      buttons and drag handles (tab buttons,
      drag-to-place, clear-brush, tile-paint list) render in ALL CAPS to
      match the manual. component checkbox labels and dropdown options are
      unchanged — they remain code-style identifiers and existing label
      strings.
    inputs:
      - 'panel rendered to DOM'
    outputs:
      - 'title text "Dev Panel"'
      - 'tab buttons "ENTITY" and "TILE"'
      - 'spawn button "DRAG TO PLACE", clear button "CLEAR BRUSH"'
      - 'tile-paint list buttons rendered uppercase'
      - 'labels "Preset", "Archetype", "Glyph", "Value", placeholder "Filter..."'
    state_changes: []
    determinism: deterministic

  - id: dev-gated
    description: >
      the entire dev panel system is gated behind import.meta.env.DEV.
      the component is conditionally rendered in GameScreen. the keyboard
      hook only registers the backtick handler in dev mode. production
      builds tree-shake the panel and its dependencies entirely.
    inputs:
      - 'import.meta.env.DEV check'
    outputs:
      - 'panel code excluded from production bundle'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: spawn-on-non-walkable
    description: 'drag-dropping an entity onto a non-walkable tile (space, cave wall) still spawns — dev panel does not enforce walkability'
    expected: 'entity created at the exact tile position regardless of walkability'
  - id: spawn-with-no-components
    description: 'attempting to spawn with zero components checked'
    expected: 'spawn button and drag handle are disabled when no components are checked'
  - id: position-override-on-drop
    description: 'if Position component is checked with manual values, drag-drop overrides x,y to the drop tile'
    expected: 'drop position always wins over manually entered Position values'
  - id: cave-zone-spawn
    description: 'spawning while in cave zone sets EntityZone to cave by default'
    expected: 'EntityZone.zone matches state.currentZone at spawn time'
  - id: tile-paint-space-border
    description: 'painting tiles in the space border region works without restriction'
    expected: 'any tile in bounds can be painted to any type'
  - id: panel-does-not-block-canvas
    description: 'the panel uses pointer-events-none except on interactive elements so the canvas remains interactive around it'
    expected: 'canvas clicks outside the panel area still register for movement and interaction'

failure_conditions:
  - trigger: 'import.meta.env.DEV is false (production build)'
    expected: 'dev panel never renders, backtick key has no effect, panel code is tree-shaken'
  - trigger: 'drag-drop outside map bounds'
    expected: 'no entity created, drag cancelled'
  - trigger: 'tile paint outside map bounds'
    expected: 'no tile modified'

verification:
  test_file: src/engine/__tests__/devPanel.test.ts
  test_pattern: 'dev panel'
  command: 'npx vitest run src/engine/__tests__/devPanel.test.ts'
