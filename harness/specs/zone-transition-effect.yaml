id: zone-transition-effect
name: Zone Transition Effect
priority: medium
layer: engine
source_files:
  - src/engine/zoneTransition.ts
  - src/engine/cave.ts
  - src/engine/ruins.ts
  - src/engine/house.ts
  - src/engine/position.ts
  - src/engine/constants.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/movement.ts
  - src/engine/renderer.ts
  - src/engine/render/passes/zoneTransitionOverlay.ts
  - src/engine/render/passes/index.ts
  - src/hooks/useGameEngine.ts
dependencies: []

behaviors:
  - id: schedule-on-zone-change
    description: >
      When the player steps onto a cave or ruin entrance tile from the
      overworld, or onto a cave-exit or ruin-exit tile from the interior,
      checkTransition schedules a ZoneTransition instead of performing
      the map swap synchronously. The transition captures direction
      (enter or exit), kind (cave or ruin), the screen-space tile that
      the iris should radiate from, and the ruinIndex when kind is ruin.
      The map swap is deferred to tickZoneTransition.
    inputs:
      - player crosses a CaveEntrance, CaveExit, RuinEntrance, or RuinExit tile
      - state.zoneTransition is currently null
    outputs:
      - state.zoneTransition is set
      - state.currentZone is unchanged at this instant (swap happens later at midpoint)
      - checkTransition returns true so the caller treats this as a transition step
    state_changes:
      - field: state.zoneTransition
        effect: set to ZoneTransition with startTime, duration, direction, kind, irisCenter, and ruinIndex when applicable
      - field: state.currentZone
        effect: unchanged until tickZoneTransition crosses midpoint
    determinism: time-based

  - id: tick-and-swap-at-midpoint
    description: >
      Each frame, tickZoneTransition reads state.zoneTransition and time.
      Before progress reaches 0.5, the active map is the source map. When
      progress crosses 0.5, the deferred swap fires exactly once and the
      transition's `swapApplied` flag flips false → true. The swap calls
      the existing enterCave, enterRuin, exitCave, exitRuin, or
      enterHouse / exitHouse function which mutates state.map,
      state.player, state.currentZone, state.currentRuinIndex, and
      clears navigation state. After progress reaches 1,
      state.zoneTransition is cleared. The gameLoop transition system
      observes `swapApplied` and fires `onRefreshUI` once at the
      midpoint-swap moment (in addition to the existing refresh at
      progress >= 1) so React-side consumers (useMusic ambient
      selection, sidebar / cursor info) see the new zone the instant
      the swap takes effect, rather than waiting another half-duration
      for the transition to clear.
    inputs:
      - state.zoneTransition is not null
      - current time
    outputs:
      - progress in [0, 1] derived from elapsed time and duration
      - one map swap performed exactly once per transition at progress >= 0.5
      - swapApplied flips false → true exactly once at progress >= 0.5
      - onRefreshUI fires once at the midpoint-swap moment and again when state.zoneTransition clears
      - state.zoneTransition cleared when progress >= 1
    state_changes:
      - field: state.zoneTransition
        effect: cleared to null when progress >= 1
      - field: state.zoneTransition.swapApplied
        effect: flips false → true exactly once at progress >= 0.5
      - field: state.map
        effect: swapped to destination map exactly once when progress crosses 0.5
      - field: state.player
        effect: repositioned to destination spawn at the same moment the map swaps
      - field: state.currentZone
        effect: updated to destination zone at midpoint
      - field: state.currentRuinIndex
        effect: set when entering a ruin and cleared when exiting, at midpoint
    determinism: time-based

  - id: render-iris-and-dissolve-overlay
    description: >
      A screen-overlay render pass draws two stacked layers while
      state.zoneTransition is non-null. The dissolve layer scrambles
      visible tiles to ASCII noise with density curve 0->1 from progress
      0 to 0.5 and 1->0 from 0.5 to 1. The iris layer draws a dark
      circle centered on irisCenter, expanding from radius 0 to fill the
      viewport across progress 0 to 0.5 then contracting 0.5 to 1. The
      two layers are independent and composited together.
    inputs:
      - state.zoneTransition is not null
      - current time
      - viewport size
    outputs:
      - dissolve noise drawn over the rendered scene with density tied to progress
      - dark iris circle drawn over the dissolve, expanding then contracting
      - underlying tile renderer runs normally; the overlay sits on top
    state_changes: []
    determinism: time-based

  - id: gate-input-during-transition
    description: >
      While state.zoneTransition is non-null, movement and interaction
      input is rejected. Keyboard movement, click-to-move, shift+click
      waypoints, pendingAction firing, action bar slot activation, and
      tickPath are all short-circuited. Inventory toggle, prairie manual
      toggle, and menu open remain allowed (UI overlays do not affect
      the transition).
    inputs:
      - any movement or interaction input event while state.zoneTransition is non-null
    outputs:
      - input is dropped silently
      - no state mutation other than what the input handler always does
      - tickPath does not advance the path
      - pendingAction does not fire
    state_changes:
      - field: state.path
        effect: not modified by rejected input
      - field: state.player
        effect: not moved by rejected input
      - field: state.pendingAction
        effect: not invoked while transitioning
    determinism: deterministic

  - id: reentry-lock-after-exit
    description: >
      When the player exits any structure (cave, ruin, or house), the
      exit handler arms a re-entry lock keyed to the overworld entrance
      position the player just emerged from. While the lock is armed,
      checkTransition's overworld branch does not schedule an enter
      transition for that one locked entrance: the player can stand on
      or walk across the entrance tile freely (it stays walkable), but
      no transition fires. The lock clears as soon as the player reaches
      STRUCTURE_REENTRY_REARM_DISTANCE Chebyshev tiles from the locked
      entrance — the same metric findSafeExitPosition uses (Chebyshev,
      max of abs(dx) and abs(dy)). The clear check runs in
      checkTransition before the overworld hitbox scan, so the lock
      releases the instant the player walks far enough. The lock is
      keyed to a single entrance position, so a different structure's
      entrance remains immediately enterable. This prevents accidental
      re-entry when a disoriented player, just dropped outside a
      structure, drifts a step back onto the entrance they came from.
    inputs:
      - exit handler runs (exitCave, exitRuin, or exitHouse)
      - subsequent player moves while state.reentryLock is non-null
    outputs:
      - on exit, state.reentryLock is set to the locked entrance position
      - while locked, stepping onto that entrance's 3x3 hitbox schedules no transition
      - the locked entrance tile remains walkable (no movement block, no pathfinding avoidance)
      - state.reentryLock clears to null once the player is Chebyshev >= STRUCTURE_REENTRY_REARM_DISTANCE from the locked entrance
      - after the lock clears, stepping onto the entrance hitbox schedules an enter transition normally
    state_changes:
      - field: state.reentryLock
        effect: >
          set by the exit handler to an object holding the locked
          entrance Position; cleared to null in checkTransition once the
          player reaches the re-arm distance
      - field: state.zoneTransition
        effect: not scheduled for the locked entrance while the lock is armed
    determinism: deterministic

edge_cases:
  - id: entrance-tile-still-walkable-after-schedule
    description: >
      Player steps onto the entrance tile, schedule fires, but the
      old map still renders for the first half of the transition. The
      player remains visually on the entrance tile during that window
      and is not moved by any further movement input.
    expected: >
      Player position stays put until midpoint, map swap moves the
      player to the spawn position in the destination zone, no
      double-stepping into the destination.

  - id: rapid-reentry
    description: >
      Player exits a cave, ruin, or house and immediately re-steps onto
      the same entrance hitbox shortly after the transition clears,
      before walking the re-arm distance away.
    expected: >
      No transition is scheduled — the re-entry lock from
      reentry-lock-after-exit suppresses the just-exited entrance until
      the player reaches the re-arm distance. The entrance tile is still
      walkable; the player simply does not re-enter. Once the lock
      clears, a fresh transition schedules normally and the two
      transitions never overlap (the second cannot begin while
      state.zoneTransition is non-null).

  - id: exit-drop-already-past-rearm-distance
    description: >
      findSafeExitPosition occasionally places the player at a Chebyshev
      distance already >= STRUCTURE_REENTRY_REARM_DISTANCE from the
      entrance (e.g. the nearest walkable tile was several tiles out).
      The lock is still armed by the exit handler.
    expected: >
      The lock clears on the player's first move (or the first
      checkTransition tick), because the clear check finds the player
      already at or beyond the re-arm distance. This is correct: the
      player is already oriented away from the entrance, so the lock has
      nothing to protect against. No special-casing needed.

  - id: entrance-boxed-in-within-rearm-radius
    description: >
      Theoretical edge: the entrance is surrounded by unwalkable tiles
      within STRUCTURE_REENTRY_REARM_DISTANCE, so the player could never
      reach the re-arm distance and the lock would never clear.
    expected: >
      Effectively impossible in the open prairie — the player reached a
      walkable findSafeExitPosition drop at Chebyshev 2, which proves an
      outward walkable path exists, and the prairie is open enough to
      reach the re-arm distance. Documented as an assumption; not
      guarded in code. A regression test asserts the lock clears on a
      normal walk-away.

  - id: dialog-or-menu-open-at-transition-start
    description: >
      Although input handlers should prevent walking onto an entrance
      tile while a dialog or menu is open, if state.activeDialog or
      state.isMenuOpen ends up set when a transition starts, the
      transition still runs to completion. enterCave and enterRuin
      already clear state.activeDialog.
    expected: >
      Transition completes normally. Dialog and menu state remain
      cleared after the swap.

  - id: coyote-and-other-entities
    description: >
      The existing enterCave, enterRuin, exitCave, exitRuin functions
      teleport the coyote to the destination zone via
      transitionCoyoteToZone. This happens at midpoint when the swap
      fires, not at schedule time.
    expected: >
      Coyote zone matches the player zone after the swap. No coyote
      movement during the transition window.

  - id: shorter-than-one-frame-duration
    description: >
      Theoretical edge: duration is zero or negative.
    expected: >
      tickZoneTransition treats this as already complete on its first
      tick. The swap fires immediately and state.zoneTransition is
      cleared. No divide-by-zero.

failure_conditions:
  - trigger: schedule called while state.zoneTransition is already non-null
    expected: the new call is ignored; the in-flight transition continues unchanged

  - trigger: tickZoneTransition called with state.zoneTransition null
    expected: no-op; function returns without side effects

  - trigger: player saved and reloaded mid-transition (serialization)
    expected: state.zoneTransition serializes to null on save or is excluded from the persisted shape so reload does not resume a mid-air transition

  - trigger: enterCave or enterRuin invoked directly by future code (bypassing schedule)
    expected: the function still performs the map swap; the transition overlay simply does not play because state.zoneTransition was never set. Used by tests and dev tooling

  - trigger: state.reentryLock is armed and the player is saved and reloaded
    expected: >
      reentryLock round-trips through serialization (a plain object
      holding the entrance Position, or null); on reload the lock state
      is preserved and clears normally once the player walks the re-arm
      distance

  - trigger: a fresh game starts with no exit having occurred
    expected: state.reentryLock defaults to null; every structure entrance is immediately enterable

verification:
  test_file: src/engine/__tests__/zoneTransition.test.ts
  test_pattern: zone transition
  command: npx vitest run src/engine/__tests__/zoneTransition.test.ts
