id: ghosts
name: 'Ghosts'
status: implemented
priority: medium
layer: engine
source_files:
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/entities.ts
  - src/engine/movement.ts
  - src/engine/interaction.ts
  - src/engine/characters.ts
  - src/engine/renderer.ts
  - src/engine/constants.ts
  - src/engine/pathfinding.ts
dependencies:
  - player-movement

behaviors:
  - id: ghost-spawning
    description: >
      createGameState places 3 ghosts as ECS entities in state.world
      via createCharacterEntity at random walkable (non-Space, non-Sand)
      positions on the map. each ghost has definitionId 'ghost-N',
      a unique spawn-order number (1, 2, 3), and ECS components:
      CharacterIdentity, Position, Blocking, Behavior (drift),
      EntityTag ('character'), and EntityZone (overworld). ghost
      positions must not overlap each other, the player, or existing
      characters. registerGhostDefinitions is called to register
      CharacterDefinitions for each ghost.
    inputs:
      - 'createGameState call'
    outputs:
      - 'GameState with 3 ghost ECS entities in state.world'
    state_changes:
      - field: world
        effect: "3 ghost ECS entities created with CharacterIdentity({ definitionId: 'ghost-N' }), Position, Blocking, Behavior({ type: 'drift', moveChance: 0.15, freezeOnDialog: true }), EntityTag('character'), EntityZone({ zone: 'overworld' }) components"
      - field: CHARACTER_DEFINITIONS
        effect: 'registerGhostDefinitions called with ghost numbers, registering CharacterDefinition entries for each ghost so dialog and rendering can resolve them'
    determinism: probabilistic

  - id: ghost-drift
    description: >
      tickCharacterBehaviors queries state.world for entities with
      Behavior, CharacterIdentity, and Position components, filtered
      by EntityZone matching the active zone. For entities with
      behavior.type === 'drift', it delegates to tickDrift. tickDrift
      moves the character with a low probability per tick (speed 0.15,
      slower than bees). each ghost picks a random 8-directional
      neighbor (cardinal + diagonal, via ORDINAL) and moves there
      only if the tile is walkable and not blocked. uses the same
      blocked-position set as player movement (getBlockedPositions
      + player position) so any future blocking entities are
      automatically respected. the ghost removes itself from the
      blocked set before checking candidates and re-adds its new
      position after moving.
    inputs:
      - 'GameState with ghost ECS entities in state.world'
    outputs: []
    state_changes:
      - field: 'world (ghost entity Position component)'
        effect: 'moved to adjacent walkable tile via state.world.moveEntity, or unchanged if no valid neighbor or random check fails'
    determinism: probabilistic

  - id: ghost-blocks-player
    description: >
      movePlayer returns false when the target tile is occupied by a
      ghost. Ghost entities have a Blocking component, so they are
      included in getBlockedPositions via ECS query. A* also treats
      ghost tiles as blocked and routes around them.
    inputs:
      - 'GameState with a ghost adjacent to player'
      - 'Direction toward the ghost tile'
    outputs:
      - 'boolean: false'
    state_changes: []
    determinism: deterministic

  - id: ghost-character-definition
    description: >
      Each ghost is a character for dialog purposes. Ghost definitions
      have id 'ghost-N', name 'Ghost #N', glyph 'ö', white glyph
      color, and a 3-line dialog: '...', 'Oh... a steward...',
      '... I sure would love some clover tea.'
    inputs:
      - 'Ghost spawn order number N'
    outputs:
      - 'CharacterDefinition with id, name, glyph, color, dialog'
    state_changes: []
    determinism: deterministic

  - id: ghost-interaction
    description: >
      Pressing [e] while facing a ghost initiates dialog using the
      existing character dialog system. The ghost's character entry
      in state.world references its definition. Dialog advances
      and closes identically to other characters.
    inputs:
      - 'Player facing a ghost tile, [e] pressed'
    outputs: []
    state_changes:
      - field: activeDialog
        effect: "set to { characterId: 'ghost-N', lineIndex: 0, typingIndex: 0, typingDone: false, transitioning: false, transitionStartTime: 0 }"
    determinism: deterministic

  - id: ghost-rendering
    description: >
      Ghosts render as 'ö' in white at their world position. They
      are rendered at the same z-level as characters in the renderer.
    inputs:
      - 'GameState with ghosts in viewport'
    outputs:
      - 'ö character drawn in white at each ghost position'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: ghost-spawns-avoid-overlap
    description: "Ghost spawn positions must not overlap each other, the player start position, or Gron's position. The exclusion set is explicit (player + Gron), not a generic character query."
    expected: 'All 3 ghosts at unique positions, none colliding with player or Gron'
  - id: ghost-drift-at-coastline
    description: 'Ghost adjacent to sand/space border has fewer valid neighbors but never enters Space. Ghosts spawn on non-Sand tiles but can drift onto Sand since isWalkableTile includes Sand.'
    expected: 'Ghost stays on dirt/sand/clover tiles, never moves to Space or cave walls'
  - id: ghost-drift-blocked-by-entities
    description: 'Ghost surrounded by other blocking entities has no valid move'
    expected: 'Ghost stays in place, no error'
  - id: ghost-dialog-complete-cycle
    description: 'Player advances through all 3 dialog lines and dialog closes'
    expected: 'activeDialog set to null after advancing past final line'
  - id: ghost-drift-probability-bounds
    description: 'Ghost drift speed is 0.15 — over many ticks, each ghost moves roughly 15% of the time. In a 1000-tick window a ghost should move between 100 and 200 times (within ~3σ of the expected 150).'
    expected: 'Move count per ghost falls within statistical bounds; no ghost is permanently frozen or moving every tick'
  - id: ghost-spawn-position-distribution
    description: 'Ghost spawn positions are uniformly drawn from all walkable non-Sand tiles. Over many game inits, spawn positions should cover a wide range of the map rather than clustering in one area.'
    expected: 'Spawns are spread across the walkable region; the retry loop (max 500 attempts) terminates well before the cap on normal maps'

failure_conditions:
  - trigger: 'Ghost moves onto a Space tile'
    expected: 'Ghost position unchanged, Space tile never entered'
  - trigger: 'Player walks onto a ghost tile'
    expected: 'movePlayer returns false, player position unchanged'
  - trigger: 'Pathfinding routes through a ghost tile'
    expected: 'A* treats ghost tiles as blocked, routes around them'
  - trigger: 'Fewer than 3 valid spawn positions exist'
    expected: 'Graceful handling — spawn as many as possible without crashing'

verification:
  test_file: src/engine/__tests__/ghosts.test.ts
  test_pattern: 'ghost'
  command: 'npx vitest run src/engine/__tests__/ghosts.test.ts'
