id: ruin-dormant-garden
name: 'Ruin archetype: dormant garden (sole archetype)'
priority: high
layer: engine
source_files:
  - src/engine/ruins.ts
  - src/engine/types.ts
  - src/engine/items.ts
  - src/engine/constants.ts
  - src/engine/position.ts
  - src/engine/renderer.ts
  - src/engine/gameLoop.ts
  - src/engine/interaction.ts
  - src/engine/manual.ts
dependencies:
  - ruin-infrastructure
  - ruin-locked-door

behaviors:
  - id: dormant-garden-data
    description: >
      DormantGardenData is the only archetype data interface. it stores
      aqueductTiles (Set of posKeys for all channel positions),
      breakPoints (Position[] of broken channel locations), repairedBreaks
      (Set of posKeys for fixed breaks), debrisPositions (Position[] of
      clearable rubble), seedVault (Position of vault chamber center),
      seedDecayTimers (Map of posKey to ms remaining before seed dies),
      seedDecayAcceleration (number multiplier on decay rate, default 1.0),
      waterFlowing (boolean, true when all breaks repaired),
      keyPosition (Position where aqueductKey ground item spawns inside
      the maze; null for coyote-role ruins which have no key/door),
      tabletPosition (Position where stoneTablet ground item spawns
      inside the maze), doorPositions (Position[] of every
      RuinDoorLocked tile in the row that gates the seed vault — see
      ruin-locked-door spec; empty array for coyote-role ruins),
      collapseBarrier (Position[] of RuinDebris tiles placed across
      the spine corridor as a gating cave-in; null for ruins that
      don't have one — only coyote-role ruins populate this field
      today).
    inputs:
      - 'ruin generation creates the sole archetype'
    outputs:
      - 'DormantGardenData populated on RuinInterior.dormantGarden'
    state_changes: []
    determinism: deterministic

  - id: maze-generation
    description: >
      generateDormantGarden carves an aqueduct-themed layout: long
      straight corridors with a few alternate routes and dead ends.
      map dimensions are 3x the previous infrastructure defaults:
      width = radius * 24 + 30, height = radius * 18 + 24.
      seeded rng from tileHash(ruin.position.x, ruin.position.y) via
      mulberry32. fills grid with RuinWall. carves a primary spine
      corridor (3 tiles wide) running from the entrance landing toward
      the deepest carve target. carves 2-3 perpendicular branch
      corridors (3 tiles wide) off the spine. carves 2-4 short
      side passages (1-2 tiles wide, 3-6 tiles long) that dead-end
      (small alcoves). carves 1-2 alternate loop passages where a
      branch rejoins the spine further along its run. the entrance
      landing area (3 wide, 2 tall) is at bottom center. a 5x4 seed
      vault chamber is carved at the spine terminus, the deepest
      reachable cell from the entrance (measured by BFS distance).
      the door is placed on the single tile that connects the vault
      chamber to the spine.
    inputs:
      - 'CivilizationRuin (radius, age, aqueductPaths), seeded rng'
    outputs:
      - 'RuinInterior with loopy maze layout, vault chamber, gated door'
    state_changes: []
    determinism: deterministic

  - id: coyote-collapse-barrier-placement
    description: >
      for ruins with role 'coyote' only, generateDormantGarden carves a
      gating cave-in across the spine corridor between the entrance
      landing and the seed vault door. the barrier is a contiguous span
      of RuinDebris tiles spanning the full width of the spine corridor
      (3 tiles, perpendicular to the spine direction) at a chosen point
      whose BFS distance from the entrance is between 35% and 60% of
      the deepest reachable distance. the cell column must not collide
      with branch corridor intersections, the seed vault chamber, the
      door row, the entrance landing, or any aqueduct break point.
      barrier positions are recorded on
      DormantGardenData.collapseBarrier. for non-coyote-role ruins,
      collapseBarrier is null and no barrier is carved (decorative
      RuinDebris from the existing scatter step is unaffected). the
      barrier blocks player movement and pathfinding by virtue of
      RuinDebris's existing non-walkable behavior, so the trapped
      coyote spawned past it (see vault-contents-by-role in
      main-questline-foundation) is unreachable until the player
      clears at least one tile in the barrier row to a width that
      A* can route through.
    inputs:
      - 'dormant-garden generation runs for a ruin with role "coyote"'
    outputs:
      - '3-tile RuinDebris row across the spine corridor at 35-60% depth'
      - 'collapseBarrier populated with barrier tile positions'
    state_changes:
      - field: map
        effect: '3 RuinFloor tiles in the spine row converted to RuinDebris'
      - field: dormantGarden.collapseBarrier
        effect: 'array populated with the 3 barrier tile positions'
    determinism: deterministic

  - id: aqueduct-channels-in-corridors
    description: >
      after corridors are carved, aqueduct channels (RuinAqueduct tiles)
      are laid down the center line of the spine corridor and through
      the seed vault. 2-4 break points along the channel are converted
      to RuinAqueductBroken. 3-5 RuinDebris tiles are scattered at
      branch intersections and along the spine where it widens.
    inputs:
      - 'corridor layout, seeded rng, aqueductPaths from genesis ruin data'
    outputs:
      - 'aqueduct channel + break points + debris overlaid on corridors'
    state_changes: []
    determinism: deterministic

  - id: aqueduct-key-placement
    description: >
      after corridors + channels, the aqueductKey ground item is placed
      at a corridor cell whose BFS distance from the entrance is between
      60% and 85% of the deepest reachable distance, chosen via seeded
      rng. the cell must not be inside the seed vault and must not be
      any tile in doorPositions. dead-end alcoves are preferred when available.
      the key is the only way to unlock the door without future
      mechanics. recorded on DormantGardenData.keyPosition. spawned as
      an ItemDrop entity with definitionId 'aqueductKey'. key placement
      is skipped entirely for ruins with role 'coyote' — those ruins
      have no door, so no key is needed. keyPosition is null for
      coyote-role ruins and no aqueductKey ItemDrop is spawned.
    inputs:
      - 'corridor layout, BFS distances, seeded rng'
      - 'ruin role'
    outputs:
      - 'aqueductKey ground item spawned in deep corridor cell (non-coyote roles)'
      - 'no aqueductKey spawned for coyote-role ruins; keyPosition is null'
    state_changes:
      - field: world
        effect: 'ItemDrop entity created at keyPosition with aqueductKey for non-coyote roles; no entity created for coyote-role'
      - field: dormantGarden.keyPosition
        effect: 'set to chosen corridor cell for non-coyote roles; null for coyote-role'
    determinism: deterministic

  - id: stone-tablet-placement
    description: >
      after corridors + channels, the stoneTablet ground item is placed
      at a corridor cell whose BFS distance from the entrance is
      between 25% and 55% of the deepest reachable distance, chosen via
      seeded rng. the cell must not be inside the seed vault, must not
      be in doorPositions, must not be the keyPosition, and must not be
      on a RuinAqueduct or RuinAqueductBroken tile. recorded on
      DormantGardenData.tabletPosition. spawned as an ItemDrop entity
      with definitionId 'stoneTablet'. the tablet is purely a
      collectable artifact — no gating effect.
    inputs:
      - 'corridor layout, BFS distances, seeded rng'
    outputs:
      - 'stoneTablet ground item spawned in mid-depth corridor cell'
    state_changes:
      - field: world
        effect: 'ItemDrop entity created at tabletPosition with stoneTablet'
    determinism: deterministic

  - id: aqueduct-tile-types
    description: >
      TileType gains RuinAqueduct (ruinAqueduct), RuinAqueductBroken
      (ruinAqueductBroken), RuinDebris (ruinDebris). RuinAqueduct and
      RuinAqueductBroken are walkable. RuinDebris is not walkable.
      RuinAqueduct renders as ~ in blue-gray #6688AA. RuinAqueductBroken
      renders as ~ in dark brown. RuinDebris renders as crumble-stage
      char in brown #8B7355. these tile types only appear inside dormant
      garden ruins.
    inputs:
      - 'tile rendering and walkability checks'
    outputs:
      - 'three tile types for dormant garden archetype'
    state_changes: []
    determinism: deterministic

  - id: seed-decay-tick
    description: >
      ruin-dormant-garden tick system (zone: ruin, interval 1000ms).
      runs only when player is inside a ruin (only one archetype now,
      so this is equivalent to inside any ruin). ticks each seed decay
      timer down by 1000 * seedDecayAcceleration. seeds progress through
      stages: healthy (full timer), brown (below 66%), blinkingRed
      (below 33%), decomposed (0, removed). when waterFlowing is true,
      decay stops and seeds in brown stage reverse to healthy.
      blinkingRed seeds are terminal. decomposed seeds enrich soil
      health at their position when removed.
    inputs:
      - 'tick fires every 1000ms while player is in dormant garden ruin'
    outputs:
      - 'seeds visually decay, can be saved or lost'
    state_changes:
      - field: world
        effect: 'seed entities destroyed when decomposed'
      - field: soilHealth
        effect: 'enriched at decomposed seed positions'
    determinism: time-based

  - id: water-revery-repair
    description: >
      casting water revery while targeting or facing a RuinAqueductBroken
      tile repairs it. tile changes from RuinAqueductBroken to RuinAqueduct.
      position added to repairedBreaks. when all breakPoints are in
      repairedBreaks, waterFlowing is set to true and active seed decay
      stops. standard 12s water revery cooldown applies.
    inputs:
      - 'water revery cast on or adjacent to RuinAqueductBroken tile'
    outputs:
      - 'broken channel repaired, waterFlowing set when all fixed'
    state_changes:
      - field: map
        effect: 'RuinAqueductBroken tile becomes RuinAqueduct'
      - field: dormantGarden.repairedBreaks
        effect: 'posKey added'
      - field: dormantGarden.waterFlowing
        effect: 'set to true when all breaks repaired'
    determinism: deterministic

  - id: fire-revery-debris-clear
    description: >
      casting fire revery on a RuinDebris tile clears it. tile changes
      from RuinDebris to RuinFloor. fire revery on a RuinAqueduct tile
      sets seedDecayAcceleration to 1.5 for the rest of the visit
      (dry root system ignited). standard 12s fire revery cooldown
      applies.
    inputs:
      - 'fire revery cast on RuinDebris or RuinAqueduct tile'
    outputs:
      - 'debris cleared or decay accelerated'
    state_changes:
      - field: map
        effect: 'RuinDebris becomes RuinFloor (if debris hit)'
      - field: dormantGarden.seedDecayAcceleration
        effect: 'set to 1.5 (if aqueduct hit)'
    determinism: deterministic

  - id: debris-clear-via-e
    description: >
      pressing [e] while facing any RuinDebris tile clears it. single-hit,
      no item or revery requirement — mirrors the cave breakable wall
      mechanic. clicking a RuinDebris tile pathfinds to the closest
      walkable adjacent tile and triggers the same clear on arrival
      via state.pendingAction (same pattern as click-to-unlock for
      doors). RuinDebris is added to isInteractableAt for Ruin zones.
      the fire-revery-debris-clear path is preserved as a parallel
      mechanic — both produce the same state transition.

      Atomic collapseBarrier handling: when the facing/clicked tile
      belongs to dormantGarden.collapseBarrier, every barrier tile
      converts to RuinFloor in the same call (mirroring breakWall on
      cave breakable walls), a crumble TimedEffect entity is spawned
      with MultiPosition covering all barrier tiles, and a pickupBloom
      spawns at the player position (per universal-pickup-bloom
      convention). Scattered debrisPositions outside collapseBarrier
      still clear one tile at a time with no crumble entity. See
      trapped-coyote-stays-put:collapse-barrier-clears-atomically for
      the full collapseBarrier contract. records discovery
      'event:rubble-cleared' on the first clear of the session
      (atomic or single-tile).
    inputs:
      - '[e] pressed while facing a RuinDebris tile in a Ruin zone'
      - 'mouse click on a RuinDebris tile in a Ruin zone'
      - 'optional time parameter for bloom/crumble timestamps'
    outputs:
      - 'facing tile (or every collapseBarrier tile) becomes RuinFloor'
      - 'crumble TimedEffect + pickupBloom spawned when the cleared tile is in collapseBarrier'
      - 'event:rubble-cleared recorded the first time'
    state_changes:
      - field: map
        effect: 'facing/clicked RuinDebris tile becomes RuinFloor; for collapseBarrier hits, every barrier tile flips together'
      - field: world
        effect: 'crumble TimedEffect with MultiPosition over the barrier tiles + pickupBloom at player position spawned on atomic collapseBarrier clears'
      - field: manualDiscoveries
        effect: '"event:rubble-cleared" added on first clear'
    determinism: deterministic

  - id: dormant-garden-multilayer-visuals
    description: >
      aqueduct channels rendered with box-drawing chars and overlay dots
      at offsets matching the genesis aqueduct style. broken channels
      use fragmenting chars in fading brown. seed vault chamber has
      denser floor layers suggesting preserved architecture. debris tiles
      use crumble chars in browns with 2 layers. corridor walls use the
      shared RuinWall multilayer style from ruin-infrastructure.
    inputs:
      - 'renderer drawing dormant garden ruin tiles'
    outputs:
      - 'multilayer ASCII matching genesis aqueduct aesthetic'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: corridor-too-small-for-deep-key
    description: 'tiny ruin (radius 3) produces a layout where the 60-85% depth band has no eligible corridor cells'
    expected: 'fall back to the deepest non-vault corridor cell — key still spawns, never inside the vault'

  - id: tablet-band-collides-with-key-band
    description: 'tablet 25-55% band has only one candidate cell and it equals keyPosition'
    expected: 'tablet placement falls back to nearest non-conflicting corridor cell outside the vault'

  - id: all-seeds-decomposed
    description: 'all seeds decompose before water reaches vault'
    expected: 'soil enriched at each decomposed position, ruin marked cleared with partial result'

  - id: fire-on-aqueduct-with-water-flowing
    description: 'fire revery hits aqueduct after waterFlowing is already true'
    expected: 'no effect on decay timers — water is flowing, seeds stable'

  - id: repair-last-break-with-terminal-seeds
    description: 'player repairs final break but some seeds are already at blinkingRed'
    expected: 'water flows, healthy and brown seeds saved, blinkingRed seeds continue to die'

  - id: reenter-dormant-garden
    description: 'player exits and re-enters a dormant garden ruin'
    expected: 'decay timers pause while player is outside (timers are ms remaining, not wallclock timestamps)'

  - id: key-already-collected-on-reenter
    description: 'player picks up aqueductKey, exits, re-enters'
    expected: 'aqueductKey is not respawned — keyPosition still set on data, but no ItemDrop entity exists'

  - id: collapse-barrier-cleared-on-reenter
    description: 'player clears one or more collapseBarrier tiles, exits the ruin, re-enters'
    expected: 'cleared tiles remain RuinFloor (map state persists on RuinInterior); barrier is not regenerated'

  - id: collapse-barrier-deep-band-empty
    description: 'tiny coyote-role ruin where the 35-60% depth band has no eligible spine column'
    expected: 'fall back to the deepest spine column that does not collide with door/landing/aqueduct breaks; barrier still placed'

  - id: e-on-decorative-debris
    description: 'player presses [e] facing one of the 3-5 scattered RuinDebris tiles (not the barrier)'
    expected: 'tile clears to RuinFloor — the [e] mechanic is uniform across all RuinDebris, not gated to barrier tiles'

failure_conditions:
  - trigger: 'water revery cast with no broken aqueduct tiles in range'
    expected: 'standard water revery effect on ruin floor (cross-pattern water), no repair'

  - trigger: 'fire revery cast on RuinWall (not debris)'
    expected: 'no effect — fire revery only interacts with debris and aqueduct tiles in ruins'

  - trigger: 'corridor generation produces no cell at >= 6 BFS distance from entrance'
    expected: 'this should not happen at the new 3x dimensions — failing this means the spine carve algorithm regressed and tests should fail'

  - trigger: 'collapseBarrier placement collides with the entrance landing, door row, vault chamber, or any aqueduct break point'
    expected: 'generator regression — the barrier must never overlap these protected regions; tests must fail if any collapseBarrier entry hits them'

  - trigger: 'collapseBarrier is null or empty for a coyote-role ruin'
    expected: 'generator regression — coyote-role ruins must always have a barrier; the trapped coyote depends on it'

verification:
  test_file: src/engine/__tests__/ruin-dormant-garden.test.ts
  test_pattern: 'ruin dormant garden'
  command: 'npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts'
