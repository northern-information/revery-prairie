id: ruin-dormant-garden
name: 'Ruin archetype: dormant garden'
status: planned
priority: medium
layer: engine
source_files:
  - src/engine/ruins.ts
  - src/engine/types.ts
  - src/engine/constants.ts
  - src/engine/position.ts
  - src/engine/renderer.ts
  - src/engine/gameLoop.ts
  - src/engine/actionBar.ts
  - src/engine/interaction.ts
dependencies:
  - ruin-infrastructure

behaviors:
  - id: dormant-garden-data
    description: >
      DormantGardenData interface stores: aqueductTiles (Set of posKeys
      for all channel positions), breakPoints (Position[] of broken
      channel locations), repairedBreaks (Set of posKeys for fixed
      breaks), debrisPositions (Position[] of clearable rubble),
      seedVault (Position of vault chamber center), seedDecayTimers
      (Map of posKey to ms remaining before seed dies), waterFlowing
      (boolean, true when all breaks repaired).
    inputs:
      - 'ruin generation with DormantGarden archetype'
    outputs:
      - 'DormantGardenData populated on RuinInterior.archetypeData'
    state_changes: []
    determinism: deterministic

  - id: dormant-garden-generation
    description: >
      generateDormantGarden carves an L-shaped or Z-shaped main
      corridor (width 3 tiles). number of turns derived from
      aqueductPaths.length on the genesis ruin data. RuinAqueduct
      tiles form a 1-tile-wide channel down the corridor center.
      2-4 break points placed along the channel as RuinAqueductBroken
      tiles. 3-5 RuinDebris tiles at corridor intersections and wider
      areas. a 5x4 seed vault chamber carved at the corridor terminus.
      3-5 seed ground items placed in the vault with decay timers
      ranging 45-90 seconds (scaled by ruin age — older = faster decay).
    inputs:
      - 'CivilizationRuin with DormantGarden archetype, seeded rng'
    outputs:
      - 'RuinInterior with corridor layout, aqueduct channels, break points, vault'
    state_changes: []
    determinism: deterministic

  - id: aqueduct-tile-types
    description: >
      TileType gains RuinAqueduct ('ruinAqueduct'), RuinAqueductBroken
      ('ruinAqueductBroken'), and RuinDebris ('ruinDebris'). RuinAqueduct
      and RuinAqueductBroken are walkable. RuinDebris is not walkable.
      RuinAqueduct renders as '~' in blue-gray #6688AA. RuinAqueductBroken
      renders as '~' in dark brown. RuinDebris renders as crumble-stage
      char in brown #8B7355.
    inputs:
      - 'tile rendering and walkability checks'
    outputs:
      - 'three new tile types for dormant garden archetype'
    state_changes: []
    determinism: deterministic

  - id: seed-decay-tick
    description: >
      ruin-dormant-garden tick system (zone: 'ruin', interval 1000ms).
      only runs when current ruin archetype is DormantGarden. ticks
      each seed's decay timer down. seeds progress through stages:
      healthy (full timer), brown (below 66%), blinkingRed (below 33%),
      decomposed (0, removed). visual state derived from timer percentage.
      when waterFlowing is true: all decay stops, seeds in brown stage
      reverse to healthy. seeds at blinkingRed or beyond are terminal —
      water cannot save them. decomposed seeds are removed and enrich
      soil health at their position.
    inputs:
      - 'tick fires every 1000ms while player is in dormant garden ruin'
    outputs:
      - 'seeds visually decay, can be saved or lost'
    state_changes:
      - field: world
        effect: 'seed entities destroyed when fully decomposed'
      - field: soilHealth
        effect: 'enriched at decomposed seed positions'
    determinism: time-based

  - id: water-revery-repair
    description: >
      casting water revery while targeting or facing a RuinAqueductBroken
      tile repairs it. the tile type changes from RuinAqueductBroken to
      RuinAqueduct. the position is added to repairedBreaks set. when
      all breakPoints positions are in repairedBreaks, waterFlowing is
      set to true and all active seed decay stops. standard 12s water
      revery cooldown applies.
    inputs:
      - 'water revery cast on or adjacent to RuinAqueductBroken tile'
    outputs:
      - 'broken channel repaired, waterFlowing set when all fixed'
    state_changes:
      - field: map
        effect: 'RuinAqueductBroken tile becomes RuinAqueduct'
    determinism: deterministic

  - id: fire-revery-debris-clear
    description: >
      casting fire revery on a RuinDebris tile clears it. the tile
      type changes from RuinDebris to RuinFloor. however, if fire
      revery hits a RuinAqueduct tile, all seed decay timers are
      accelerated by 50% (dry root system ignited). a warning toast
      displays: 'the dry roots catch fire...'. standard 12s fire
      revery cooldown applies.
    inputs:
      - 'fire revery cast on RuinDebris or RuinAqueduct tile'
    outputs:
      - 'debris cleared or decay accelerated'
    state_changes:
      - field: map
        effect: 'RuinDebris becomes RuinFloor (if debris hit)'
    determinism: deterministic

  - id: manual-repair-interaction
    description: >
      pressing [e] while facing a RuinAqueductBroken tile initiates
      a manual repair. slower than water revery (takes 3 seconds of
      standing still) but has no cooldown dependency. provides an
      alternative path for players without water revery available.
    inputs:
      - '[e] pressed while facing RuinAqueductBroken'
    outputs:
      - 'delayed repair of broken channel'
    state_changes:
      - field: map
        effect: 'RuinAqueductBroken becomes RuinAqueduct after delay'
    determinism: time-based

  - id: dormant-garden-multilayer-visuals
    description: >
      aqueduct channels rendered with box-drawing chars and overlay
      dots at offsets matching genesis aqueduct style. broken channels
      use fragmenting chars in fading brown. seed vault chamber has
      denser floor layers suggesting preserved architecture. debris
      tiles use crumble chars in browns with 2 layers.
    inputs:
      - 'renderer drawing dormant garden ruin tiles'
    outputs:
      - 'multilayer ASCII matching genesis aqueduct aesthetic'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: all-seeds-decomposed
    description: 'all seeds decompose before water reaches vault'
    expected: 'soil enriched at each decomposed position, ruin marked as cleared with partial result'

  - id: fire-on-aqueduct-with-water-flowing
    description: 'fire revery hits aqueduct after waterFlowing is already true'
    expected: 'no effect on decay timers — water is already flowing, seeds are stabilized'

  - id: repair-last-break-with-terminal-seeds
    description: 'player repairs final break but some seeds are already at blinkingRed'
    expected: 'water flows, healthy and brown seeds saved, blinkingRed seeds continue to die'

  - id: reenter-dormant-garden
    description: 'player exits and re-enters a dormant garden ruin'
    expected: 'decay timers pause while player is outside (timers are ms remaining, not wallclock timestamps)'

failure_conditions:
  - trigger: 'water revery cast with no broken aqueduct tiles in range'
    expected: 'standard water revery effect on ruin floor (cross-pattern water), no repair'

  - trigger: 'fire revery cast on RuinWall (not debris)'
    expected: 'no effect — fire revery only interacts with debris and aqueduct tiles in ruins'

verification:
  test_file: src/engine/__tests__/ruin-dormant-garden.test.ts
  test_pattern: 'ruin dormant garden'
  command: 'npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts'
