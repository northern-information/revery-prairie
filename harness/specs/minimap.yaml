id: minimap
name: 'Minimap and bottom UI rearrangement'
priority: medium
layer: component
source_files:
  - src/components/Minimap.tsx
  - src/components/GameScreen.tsx
  - src/components/Sidebar.tsx
  - src/components/CommandPanel.tsx
  - src/engine/projection.ts

behaviors:
  - id: minimap-render-tiles
    description: >
      The Minimap renders the entire current zone using the same iso
      projection as the main canvas: each world tile `(x, y)` is
      placed at iso position `(x - y, (x + y) / 2)` so the rendered
      map is a 2:1 diamond rotated 45° with world north (low y) at
      the top. The diamond is scaled and centered to fit inside a
      fixed-size 176x176 CSS pixel canvas (longest projected axis
      sized to fit the canvas). Tiles are drawn as small filled
      blocks at their projected position with a per-tile pixel size
      chosen so the whole diamond fits. Tile colors group by
      walkability and kind: walkable land tiles (dirt, clover,
      burntClover, caveFloor) render in a light tan; non-walkable
      solids (caveWall, caveBreakableWall) render dark; space tiles
      are skipped so the parent background shows through; water
      tiles (pond, river) render in blue; sand renders in a sand
      tone. The minimap reads from `state.map`, `state.mapWidth`,
      `state.mapHeight`, `state.currentZone` so it automatically
      reflects the current zone after `enterCave` / `exitCave`
      swaps. The minimap is positioned at the bottom-left of the
      viewport.
    inputs:
      - 'GameState with map data for the current zone'
    outputs:
      - 'Canvas rendering of the full zone as colored tile blocks projected into a 2:1 iso diamond'
    state_changes: []
    determinism: deterministic

  - id: minimap-iso-projection
    description: >
      Every map-space coordinate drawn by the minimap (tiles,
      structures, characters, ruin footprints, player marker)
      passes through a shared iso projection helper that mirrors
      the main canvas projection in `src/engine/projection.ts`. A
      tile at world `(x, y)` projects to minimap pixel
      `(originX + (x - y) * tilePx, originY + (x + y) * tilePx / 2)`
      where `tilePx` is the per-tile size chosen so the longest
      projected axis fits inside `MINIMAP_CSS_SIZE` (176), and
      `originX` / `originY` are chosen so the diamond is centered
      inside the canvas. World north (low y) projects to the top
      of the diamond; world east (high x) projects to the right.
      The viewport-rect overlay does NOT use this projection — see
      `minimap-viewport-rect`.
    inputs:
      - 'World tile coordinate (x, y) and current map dimensions'
    outputs:
      - 'Minimap canvas pixel position (px, py) inside the centered diamond'
    state_changes: []
    determinism: deterministic

  - id: minimap-render-structures
    description: >
      Structures render on top of the tile layer in distinct accent
      colors using the same iso projection as tiles. Cave entrance
      tiles render in light gray. Civilization ruin building
      footprints (from `state.civilizationRuins`) render in a warm
      tan when the player is in the overworld zone. Character ECS
      entities with Position + CharacterIdentity render as small
      filled blocks in the character's portrait/glyph color when
      their EntityZone matches the current zone. Structures render
      at the same scale as tiles (no enlargement). The order is
      tiles → ruin footprints → cave entrances → characters →
      viewport rect → player marker, so dynamic elements always sit
      on top.
    inputs:
      - 'GameState with civilizationRuins and character ECS entities in the current zone'
    outputs:
      - 'Structure overlays drawn on the minimap canvas at iso-projected positions'
    state_changes: []
    determinism: deterministic

  - id: minimap-player-marker
    description: >
      A single hot-pink (#ff69b4) filled marker renders at the
      player's iso-projected position on top of all other layers.
      The marker is sized to be visible at small scale (minimum 3x3
      CSS pixels even when the per-tile block is smaller). The
      marker uses the project's reserved user-action pink consistent
      with cursor highlight and path dots. Because the marker uses
      the same iso projection as the tile layer, the player sits
      directly on top of the tile they occupy in the diamond.
    inputs:
      - 'GameState.player.x, GameState.player.y'
    outputs:
      - 'Hot-pink dot at the player position in iso projection'
    state_changes: []
    determinism: deterministic

  - id: minimap-viewport-rect
    description: >
      A 1px hot-pink outlined axis-aligned rectangle indicates the
      portion of the world currently visible on the main canvas
      (StarCraft style). The rectangle represents the player's
      *screen* — which is always rectangular — not the diamond slice
      of world tiles those screen pixels happen to cover. The
      rectangle is centered on the player marker on the minimap and
      sized in minimap pixels proportional to
      `state.viewportWidth * tilePx` by
      `state.viewportHeight * tilePx`. The rectangle is clamped to
      the minimap canvas bounds so it never overflows. The
      rectangle has no fill — only a 1px stroke — so it does not
      obscure the underlying tiles. Unlike every other map-space
      element, the viewport rect does NOT pass through the iso
      projection — it stays axis-aligned because it depicts a
      screen-space artifact.
    inputs:
      - 'GameState.player.x, GameState.player.y, GameState.viewportWidth, GameState.viewportHeight, derived minimap tilePx'
    outputs:
      - 'Axis-aligned hot-pink stroked rectangle centered on the player marker'
    state_changes: []
    determinism: deterministic

  - id: minimap-refresh
    description: >
      The minimap canvas redraws every frame using
      requestAnimationFrame while mounted. This matches the main
      canvas's RAF loop and ensures the viewport rectangle, player
      marker, and character positions stay in sync with movement
      without depending on React state. The static iso-projected
      tile layer is cached to an offscreen canvas keyed by
      `state.map` reference and the chosen `tilePx`, and
      invalidated when either changes (e.g. on zone swap). The
      per-frame cost is only the dynamic overlay (rect, player
      marker, characters, ruin footprints visibility recheck).
    inputs:
      - 'Minimap component mounted, GameState reference'
    outputs:
      - 'Canvas redrawn each animation frame; static iso tile layer reused from cache when state.map and tilePx are unchanged'
    state_changes: []
    determinism: time-based

  - id: bottom-ui-three-columns
    description: >
      `GameScreen` arranges the bottom row in three columns. The
      minimap sits in the lower-left (where the event log used to
      be). The event log moves to bottom-center, replacing the
      previous ActionBar position — its container becomes a fixed
      bottom-center element. The lower-right column is empty (no
      content). The minimap, event log, and right column do not
      overlap. The stats Sidebar (top-right) and ReveriesPanel /
      ActionBar / CommandPanel are not rendered while this layout is
      active.
    inputs:
      - 'GameScreen rendered with state'
    outputs:
      - 'Minimap in lower-left, event log in lower-center, no stats sidebar, no action bar'
    state_changes: []
    determinism: deterministic

  - id: hide-stats-sidebar
    description: >
      The Sidebar component (stats, cursor tile info, weather,
      genesis countdown) is no longer rendered from GameScreen. The
      component file itself is preserved; only its render call in
      GameScreen is removed. Hiding the sidebar removes the
      fixed-positioned top-right element from the DOM entirely so
      the canvas occupies the full viewport width.
    inputs:
      - 'GameScreen rendered'
    outputs:
      - 'No Sidebar component in the rendered tree'
    state_changes: []
    determinism: deterministic

  - id: hide-action-bar
    description: >
      ActionBar and CommandPanel are no longer rendered from
      GameScreen. The wrapper div that previously contained the
      `hasSelection ? CommandPanel : ActionBar` switch is removed.
      Both component files are preserved. Keyboard activation of
      reveries via 1-4 still works at the engine layer because that
      logic lives in useKeyboard, not in the ActionBar component —
      but no visual feedback is shown.
    inputs:
      - 'GameScreen rendered'
    outputs:
      - 'No ActionBar or CommandPanel in the rendered tree'
    state_changes: []
    determinism: deterministic

  - id: event-log-recenter
    description: >
      The EventLog wrapper changes from `fixed bottom-2 left-2` to
      `fixed bottom-2 left-1/2 -translate-x-1/2` so it is
      horizontally centered. Internal layout (entry rendering, fade
      gradient, unread indicator, max-height, scroll behavior) is
      unchanged. The width stays at `w-96`. Its `data-panel` and
      `data-testid` attributes are preserved.
    inputs:
      - 'EventLog mounted with eventLog data'
    outputs:
      - 'Event log centered horizontally at the bottom of the viewport'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: cave-zone-minimap
    description: 'Player enters the cave; the minimap should swap to the cave map dimensions'
    expected: 'Minimap re-renders using state.map / mapWidth / mapHeight, projecting the cave layout into iso with caveFloor as walkable and caveWall as solid'
  - id: ruins-hidden-in-cave
    description: 'Player is in the cave zone'
    expected: 'Civilization ruin footprints are not drawn (ruins exist only in the overworld)'
  - id: viewport-rect-clamped-at-edge
    description: 'Player is near a map boundary so the player-centered viewport rect would extend past the minimap canvas'
    expected: 'Axis-aligned viewport rectangle stroke is clamped to the minimap canvas bounds — no portion drawn outside the minimap area'
  - id: player-marker-visible-on-water
    description: 'Player path is not normally on water, but the marker should remain visible if a future zone allows it'
    expected: 'Hot-pink player marker is drawn on top of any underlying tile color and is at least 3x3 CSS pixels at its iso-projected position'
  - id: empty-civilization-ruins
    description: 'state.civilizationRuins is an empty array (genesis ran without ruins or in a zone without them)'
    expected: 'Minimap renders without errors; no ruin footprints drawn'
  - id: zone-transition-cache-invalidation
    description: 'Player walks over a cave entrance and the zone changes overworld → cave'
    expected: 'Static iso tile cache is regenerated for the new map; next frame shows cave tiles iso-projected, not stale overworld tiles'
  - id: iso-diamond-fits-canvas
    description: 'Map is square (e.g. 147x147 overworld); the iso-projected diamond is roughly 2N wide × N tall in tilePx units'
    expected: 'tilePx is derived from the longer projected axis so the entire diamond fits inside the 176x176 minimap canvas with no clipping. North points up, east points right, west points left, south points down.'
  - id: iso-non-square-map
    description: 'Map is non-square (e.g. cave 40x25); the projected diamond is asymmetric'
    expected: 'Diamond is sized and centered so its widest projected extent fits inside the minimap canvas; no clipping along any edge'
  - id: viewport-rect-not-iso-projected
    description: 'Camera moves; the viewport rect must not become a diamond outline'
    expected: 'Viewport rectangle remains a single axis-aligned rectangle centered on the player marker, never a 4-vertex diamond polygon. Its size is viewportWidth × viewportHeight scaled by tilePx (or proportionally if a different scaling is used to keep the rect inside the diamond).'

failure_conditions:
  - trigger: 'state.map is undefined or empty'
    expected: 'Minimap renders nothing for the tile layer (early return); does not throw'
  - trigger: 'canvas ref is null when draw is called'
    expected: 'Draw function early-returns; does not throw'

verification:
  test_file: src/components/__tests__/Minimap.test.tsx
  test_pattern: 'minimap'
  command: 'npx vitest run src/components/__tests__/Minimap.test.tsx'
