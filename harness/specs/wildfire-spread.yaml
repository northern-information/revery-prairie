id: wildfire-spread
name: 'Wildfire spread from lightning strikes'
priority: high
layer: engine
source_files:
  - src/engine/lightning.ts
  - src/engine/constants.ts
  - src/engine/__tests__/wildfire.test.ts
dependencies:
  - lightning-strikes

behaviors:
  - id: forced-origin-ignition
    description: >
      spreadWildfire does not bail when the origin tile has water >=
      WILDFIRE_DRY_THRESHOLD. instead it forces the origin tile's
      cloverLifecycle water to 0 before checking spread eligibility.
      this guarantees the struck tile always ignites if it is Clover,
      regardless of hydration. neighbor spread still uses existing
      dryness physics unchanged.
    inputs:
      - 'GameState with clover tiles and lifecycle data'
      - 'strike position (x, y)'
    outputs:
      - 'origin tile always burns if it is Clover'
    state_changes:
      - field: cloverLifecycle
        effect: 'origin tile water set to 0 before spread check'
      - field: map[y][x]
        effect: 'origin Clover tile converted to BurntClover'
    determinism: deterministic

  - id: lightning-always-ignites
    description: >
      lightning strikes that land on a Clover tile always ignite the
      origin regardless of hydration, via the forced-origin-ignition
      change to spreadWildfire. WILDFIRE_MAX_SPREAD (15) applies to
      lightning-triggered wildfires. lightning is the only production
      trigger for spreadWildfire — the previous player-cast trigger
      surface was removed in RP-0-reclaim-revery.
    inputs:
      - 'lightning strike landing on a Clover tile'
    outputs:
      - 'origin tile always ignites, wildfire spreads per existing BFS, capped at WILDFIRE_MAX_SPREAD'
      - 'wildfire ECS entity created if burned count > 1'
      - 'event:wildfire discovery recorded if spread > 1 tile'
    state_changes:
      - field: map tiles
        effect: 'Clover tiles in spread area converted to BurntClover'
      - field: cloverLifecycle
        effect: 'entries deleted for all burned positions'
      - field: cloverGrowthPreviews
        effect: 'entries deleted for all burned positions'
      - field: world (ECS)
        effect: 'wildfire TimedEffect entity (MultiPosition, EntityTag=wildfire, EntityZone) created if burned count > 1'
      - field: manualDiscoveries
        effect: 'event:wildfire added if fire spreads beyond the origin tile'
    determinism: probabilistic

  - id: spread-max-override
    description: >
      spreadWildfire accepts an optional maxSpread parameter that
      defaults to WILDFIRE_MAX_SPREAD (15). lightning callers pass no
      argument and get the default. the override exists for future
      callers that want a tighter spread; no production caller passes
      it today.
    inputs:
      - 'optional maxSpread parameter'
    outputs:
      - 'BFS capped at the provided or default max'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: lightning-on-wet-clover
    description: 'lightning strikes fully hydrated clover'
    expected: 'origin tile ignites (water forced to 0), neighbors resist spread due to high water'
  - id: lightning-on-dirt
    description: 'lightning strikes a non-clover tile (dirt, sand, water, etc.)'
    expected: 'no wildfire spread, no wildfire entity'
  - id: wildfire-spread-blocked-by-water-tiles
    description: 'lightning strikes clover near a pond or river'
    expected: 'wildfire BFS skips pond/river tiles, spread stops at water boundary'
  - id: wildfire-max-spread-cap
    description: 'lightning strikes a large dry clover field'
    expected: 'spread capped at WILDFIRE_MAX_SPREAD (15)'
  - id: single-tile-no-entity
    description: 'only the origin tile burns (all neighbors wet or non-clover)'
    expected: 'no wildfire ECS entity created (threshold is > 1 tile), tile still converts to BurntClover'

failure_conditions:
  - trigger: 'lightning lands on a tile that is not Clover'
    expected: 'no wildfire spread; no entity created; spreadWildfire returns early'
  - trigger: 'all neighboring clover is fully hydrated'
    expected: 'origin ignites but BFS spread chance is near zero for neighbors; burned set is typically 1 tile'

verification:
  test_file: src/engine/__tests__/wildfire.test.ts
  test_pattern: 'wildfire'
  command: 'npx vitest run src/engine/__tests__/wildfire.test.ts'
