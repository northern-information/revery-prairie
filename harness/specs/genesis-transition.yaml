id: genesis-transition
name: 'Seamless genesis-to-gameplay transition'
priority: high
layer: integration
source_files:
  - src/engine/genesis.ts
  - src/engine/renderer.ts
  - src/engine/gameLoop.ts
  - src/engine/types.ts
  - src/components/GameScreen.tsx
  - src/components/Sidebar.tsx
  - src/components/ActionBar.tsx
dependencies:
  - player-movement

behaviors:
  - id: canvas-crossfade
    description: >
      when completeGenesis fires, the renderer enters a crossfade window
      (~1500ms). during this window it blends the final genesis frame
      (terrain only, no entities) with the live gameplay frame (terrain +
      entities) using a global alpha ramp from 0 to 1. the genesis frame
      is a static snapshot captured at the moment of completion. terrain
      tiles that are identical between genesis and gameplay remain fully
      opaque throughout — only new elements (entities, player, overlays)
      fade in.
    inputs:
      - 'completeGenesis sets state.genesis = null'
      - 'performance.now() timestamp at genesis completion'
    outputs:
      - 'canvas renders a smooth blend from genesis final frame to gameplay frame over ~1500ms'
    state_changes:
      - field: genesisTransition
        effect: 'set to { startTime, duration } when genesis completes, cleared to null after duration elapses'
    determinism: time-based

  - id: entity-fade-in
    description: >
      during the crossfade window, entities that were not visible in
      genesis (ghosts, bees, beehives, coyote, ground items, meteorites,
      angels) render with opacity ramping from 0 to 1 over the crossfade
      duration. gron is excluded from the entity fade because he is
      rendered in the presentDay genesis epoch and must remain
      continuously visible. the player is NOT rendered in genesis
      presentDay and is NOT rendered at the start of the crossfade —
      the player emerges via the spawn-meteor sequence (see player-spawn
      spec). the isEntity flag is not set for character tiles whose
      characterId matches a character rendered in genesis (currently
      only gron).
    inputs:
      - 'genesisTransition active with startTime and duration'
      - 'entities present in game state (ghosts, bees, coyote, etc.)'
    outputs:
      - 'non-genesis entities render at fractional opacity during crossfade'
      - 'gron remains at full opacity throughout the transition'
      - 'player is not rendered until the spawn meteor lands'
    state_changes: []
    determinism: time-based

  - id: star-rendering-continuity
    description: >
      the genesis presentDay epoch renders stars using the same tileHash
      function (from position.ts) as the game renderer. this ensures
      star positions, chars, and colors are identical before and after
      the transition. earlier genesis epochs use a different star style
      intentionally — only presentDay must match.
    inputs:
      - 'genesis presentDay renderTile called on Space tiles'
      - 'game renderer star rendering pass for Space tiles'
    outputs:
      - 'stars appear at identical positions with identical chars across the transition'
    state_changes: []
    determinism: deterministic

  - id: rain-aura-continuity
    description: >
      the rain aura overlay uses the same tile hash seed in both the
      genesis presentDay renderer and the game renderer so rain drop
      positions do not shift when the renderer switches. genesis
      presentDay uses tileHash(x + rainSeed, y) matching the game
      renderer's tileHash(wx + state.rainSeed, wy). this prevents a
      visual pop where green rain chars jump to different tile positions
      on transition.
    inputs:
      - 'genesis presentDay renderTile called with sim and tile coords'
      - 'game renderer rain aura overlay pass runs after genesis ends'
    outputs:
      - 'rain aura drops appear at identical tile positions before and after transition'
    state_changes: []
    determinism: deterministic

  - id: crater-continuity
    description: >
      the genesis presentDay epoch renders satellite-impact craters with
      the same glyphs and palette the game renderer uses for state.craters.
      both use BUILDING_CHARS keyed by tileHash, with the brown crater
      palette ['#8B4513','#7A3B10','#6B320D','#5C290A','#4D2007']. the
      cross-fade window in genesisRenderer (last 10% of fallOfCivilizations
      blending into presentDay) handles the color shift from the red
      SATELLITE_TRAIL_COLORS used during the crash animation to the brown
      crater palette used at rest. this prevents craters from disappearing
      during presentDay and reappearing in a different color after the
      handoff.
    inputs:
      - 'genesis presentDay renderTile called on a tile in sim.craters'
      - 'game renderer renders the same tile with state.craters set after handoff'
    outputs:
      - 'crater glyph and color are identical at the last frame of presentDay and the first frame of gameplay'
      - 'crater glyphs remain visible continuously through the crossfade with no blank-dirt gap'
    state_changes: []
    determinism: deterministic

  - id: ruin-entrance-continuity
    description: >
      the genesis presentDay epoch renders RuinEntrance tiles with the
      same glyph, color, and 3x3 dark halo backdrop the game renderer
      uses. both render the 'O' glyph in TILE_COLORS[RuinEntrance]
      (#5FD3BC verdigris) and paint RUIN_ENTRANCE_HALO_COLOR (#2E1F12)
      across the 3x3 footprint behind the entrance. RuinEntrance tiles
      are placed on sim.grid by placeRuinEntrances during createGameState
      before genesis renders, so they exist in sim.grid throughout
      genesis. only the presentDay epoch must reproduce the gameplay
      visual, since earlier epochs intentionally paint epoch-specific
      visuals (lava, ice, etc.) over the underlying grid.
    inputs:
      - 'genesis presentDay renderTile called on a tile of type RuinEntrance'
      - 'game renderer renders the same RuinEntrance tile after handoff'
    outputs:
      - 'RuinEntrance glyph, color, and halo are identical at the last frame of presentDay and the first frame of gameplay'
    state_changes: []
    determinism: deterministic

  - id: cave-entrance-continuity
    description: >
      the genesis presentDay epoch renders CaveEntrance tiles with the
      same glyph and color the game renderer uses — 'O' in
      TILE_COLORS[CaveEntrance] (#AAAAAA). the cave entrance is placed
      on sim.grid by createGameState before genesis renders, so it exists
      in sim.grid throughout genesis. only the presentDay epoch must
      reproduce the gameplay visual.
    inputs:
      - 'genesis presentDay renderTile called on a tile of type CaveEntrance'
      - 'game renderer renders the same CaveEntrance tile after handoff'
    outputs:
      - 'CaveEntrance glyph and color are identical at the last frame of presentDay and the first frame of gameplay'
    state_changes: []
    determinism: deterministic

  - id: sidebar-crossfade
    description: >
      when genesis completes, the sidebar morphs from the genesis HUD
      (year counter, epoch progress, commentary) to the gameplay sidebar
      (weather, coordinates, tile counts). the gameplay sidebar div starts
      with opacity 0 and uses a CSS fade-in animation over ~1000ms
      synchronized with the canvas crossfade start. the initial opacity 0
      prevents a flash where the gameplay sidebar renders at full opacity
      for one frame before the animation begins.
    inputs:
      - 'state.genesis becomes null'
      - 'state.genesisTransition is active'
    outputs:
      - 'gameplay sidebar fades in smoothly from opacity 0 to 1 over ~1000ms with no flash'
    state_changes: []
    determinism: time-based

  - id: action-bar-fade-in
    description: >
      the action bar fades in from opacity 0 to 1 over ~800ms, starting
      after a short delay (~500ms into the crossfade) so it does not
      compete with the terrain transition. uses CSS animation with an
      explicit opacity 0 initial style to prevent FOUC.
    inputs:
      - 'state.genesis is null'
      - 'state.genesisTransition is active or recently completed'
    outputs:
      - 'action bar appears with a smooth fade-in animation, no pop or flash'
    state_changes: []
    determinism: time-based

  - id: skip-genesis-bypasses-transition
    description: >
      when genesis is skipped (dev mode ?skipGenesis=true or
      completeGenesis called before any epochs run), the crossfade
      is skipped entirely. genesisTransition is never set. all
      entities and UI render at full opacity immediately.
    inputs:
      - 'skipGenesis flag is true'
    outputs:
      - 'no crossfade, no fade-in — immediate full render'
    state_changes:
      - field: genesisTransition
        effect: 'remains null'
    determinism: deterministic

edge_cases:
  - id: key-skip-during-crossfade
    description: >
      player presses a key during the crossfade window (not to skip
      genesis, since genesis already completed — just normal input).
      movement and interaction process identically to post-crossfade
      gameplay. the crossfade continues visually without blocking input.
    expected: 'crossfade is purely visual — all gameplay systems active during the fade'

  - id: resize-during-crossfade
    description: >
      browser window resizes during the crossfade. the renderer
      recalculates viewport dimensions as normal. the crossfade
      continues with the new dimensions.
    expected: 'crossfade adapts to new viewport size without visual glitch'

  - id: fast-forward-skip
    description: >
      player presses a key to fast-forward genesis (runs remaining
      mutations synchronously). completeGenesis fires, crossfade
      begins normally from whatever the last rendered genesis frame was.
    expected: 'crossfade starts from the fast-forwarded final frame, same duration'

  - id: gron-continuously-visible
    description: >
      gron is rendered in the genesis presentDay epoch at his spawn
      position. when the game renderer takes over, gron must not
      disappear or flash — he remains at full opacity throughout.
    expected: 'gron is visible before, during, and after the transition with no opacity change'

  - id: player-absent-until-spawn-meteor
    description: >
      the player must NOT be rendered during genesis presentDay, the
      crossfade window, or the brief window before the spawn meteor lands.
      the player tile remains empty terrain until the player-spawn star
      impacts.
    expected: 'no player glyph visible at the start of the gameplay screen; player appears only when the spawn meteor lands (~2s in)'

  - id: stars-no-shift
    description: >
      stars in the space border must not shift position, change
      character, or change color when the renderer switches from
      genesis presentDay to the game renderer.
    expected: 'star positions and glyphs are identical across the transition boundary'

  - id: rain-aura-no-shift
    description: >
      the rain aura overlay pattern around gron must not visually
      shift when the renderer switches from genesis to game. the
      same tile hash seed ensures drop positions are identical.
    expected: 'rain drops stay in the same tile positions across the transition boundary'

  - id: crater-no-blink
    description: >
      satellite craters created during the fallOfCivilizations epoch
      must remain visible without disappearing during presentDay or
      reappearing after the genesis-to-game handoff. they may shift
      color smoothly during the fallOfCivilizations -> presentDay
      crossfade (red trail palette -> brown crater palette) but must
      hold the brown palette continuously from the start of presentDay
      onward.
    expected: 'no frame in the genesis-to-game handoff renders a known crater tile as plain dirt'

  - id: ruin-entrance-no-blink
    description: >
      RuinEntrance tiles placed on the overworld map must be visible
      with their 'O' glyph, verdigris color, and dark halo throughout
      the genesis presentDay epoch and the genesis-to-game handoff.
    expected: 'RuinEntrance glyph and halo are visible during presentDay and remain visible through the crossfade with no pop'

  - id: cave-entrance-no-blink
    description: >
      the CaveEntrance tile placed on the overworld map must be visible
      with its 'O' glyph and gray color throughout the genesis presentDay
      epoch and the genesis-to-game handoff.
    expected: 'CaveEntrance glyph is visible during presentDay and remains visible through the crossfade with no pop'

failure_conditions:
  - trigger: 'genesisTransition.startTime is in the future (clock skew)'
    expected: 'clamp progress to 0, crossfade starts immediately on next frame'

  - trigger: 'genesisTransition is somehow still active after 2x duration'
    expected: 'force-clear genesisTransition to null, render at full opacity'

  - trigger: 'a tile in sim.craters is rendered by genesis presentDay'
    expected: 'renders crater glyph and brown crater color matching the game renderer (BUILDING_CHARS keyed by tileHash, brown palette), not plain dirt'

  - trigger: 'a RuinEntrance tile is rendered by genesis presentDay'
    expected: 'renders the O glyph in verdigris with the 3x3 dark halo backdrop matching the game renderer, not plain dirt'

  - trigger: 'a CaveEntrance tile is rendered by genesis presentDay'
    expected: 'renders the O glyph in light gray matching the game renderer, not plain dirt'

verification:
  test_file: src/engine/__tests__/genesisTransition.test.ts
  test_pattern: 'genesis transition'
  command: npx vitest run src/engine/__tests__/genesisTransition.test.ts
