id: genesis-transition
name: 'Genesis-to-gameplay boot title card'
priority: high
layer: integration
source_files:
  - src/engine/genesis.ts
  - src/engine/genesisRenderer.ts
  - src/engine/renderer.ts
  - src/engine/gameLoop.ts
  - src/engine/constants.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/components/BootTitleCardOverlay.tsx
  - src/components/GenesisBottomBar.tsx
  - src/engine/render/passes/index.ts
  - src/components/GameScreen.tsx
  - src/components/Sidebar.tsx
  - src/hooks/useMouse.ts
  - src/hooks/useGameEngine.ts
dependencies:
  - player-movement
  - zone-transition-effect

behaviors:
  - id: complete-genesis-schedules-title-card
    description: >
      When completeGenesis fires, state.genesis is cleared and a new
      BootTitleCard object is written to state.bootTitleCard with
      { startTime, label: 'Revery Prairie' }. The previous seamless
      crossfade is removed. There is no genesisTransition field on
      GameState anymore — the boot title card replaces it.
    inputs:
      - 'completeGenesis runs (sim end or fast-forward)'
    outputs:
      - 'state.genesis = null'
      - 'state.bootTitleCard set to { startTime, label }'
    state_changes:
      - field: bootTitleCard
        effect: 'set to { startTime: performance.now(), label: "Revery Prairie" } when genesis completes'
      - field: genesis
        effect: 'cleared to null'
    determinism: time-based

  - id: title-card-render-and-clear
    description: >
      A screen-overlay render pass (bootTitleCard) reuses the
      ZONE_TRANSITION_FADE_IN_MS / ZONE_TRANSITION_HOLD_MS /
      ZONE_TRANSITION_FADE_OUT_MS timings (700/2000/700 ms). The
      overlay fills the viewport with BG_COLOR at alpha matching the
      same triangle curve as zoneTransitionOverlay, and draws the
      label 'Revery Prairie' centered in italic Times New Roman gold
      (#d8a860), identical to the zone transition label style. After
      total elapsed time exceeds the sum of fade-in + hold + fade-out,
      a cleanup step in gameLoop nulls state.bootTitleCard.
    inputs:
      - 'state.bootTitleCard is non-null'
      - 'current time'
    outputs:
      - 'viewport painted with black overlay at the curve alpha for the elapsed window'
      - 'centered gold italic label drawn at full overlay alpha throughout the hold'
      - 'state.bootTitleCard cleared when elapsed >= total duration'
    state_changes:
      - field: bootTitleCard
        effect: 'cleared to null in gameLoop once elapsed exceeds the total duration'
    determinism: time-based

  - id: midpoint-swap-from-genesis-to-gameplay
    description: >
      The gameplay renderer takes over the moment state.genesis is
      cleared. Because the black overlay is at full alpha during the
      hold phase, the underlying renderer swap is invisible to the
      player. Genesis renderer paints during fade-in (genesis still
      visible underneath the rising black), gameplay renderer paints
      during hold and fade-out (gameplay revealed as black falls).
      The hold midpoint is the cleanest moment to assert the swap
      visually but there is no per-frame conditional — once
      state.genesis is null, gameLoop and renderer follow their normal
      gameplay paths.
    inputs:
      - 'state.bootTitleCard active'
      - 'state.genesis transitions from non-null to null at the same instant'
    outputs:
      - 'no visible pop because the overlay covers the renderer swap during the hold'
    state_changes: []
    determinism: time-based

  - id: input-gated-during-boot-title-card
    description: >
      While state.bootTitleCard is non-null, keyboard and mouse input
      that drives movement, click-to-move, interaction, action-bar
      slot activation, and pendingAction firing are short-circuited
      the same way zone transitions gate input. UI panel toggles
      (inventory, manual, menu) remain allowed.
    inputs:
      - 'any input event while state.bootTitleCard is non-null'
    outputs:
      - 'input dropped silently — no movement, no path, no action bar fire'
    state_changes: []
    determinism: deterministic

  - id: skip-genesis-bypasses-title-card
    description: >
      The dev-only ?skipGenesis=true path calls completeGenesis before
      any epochs render. In this code path completeGenesis does NOT set
      state.bootTitleCard — it lands directly in gameplay with full
      sidebar, action bar, and player visibility. The title card is
      part of the canonical production boot only.
    inputs:
      - 'skipGenesis flag is true on createGameState'
    outputs:
      - 'state.bootTitleCard remains null'
      - 'gameplay UI immediately visible at full opacity'
    state_changes:
      - field: bootTitleCard
        effect: 'remains null'
    determinism: deterministic

  - id: sidebar-and-action-bar-reveal
    description: >
      The sidebar (gameplay content) and action bar render with their
      mounted content already visible the first frame after the title
      card finishes — there are no fade-in animations driven by the
      previous genesisTransition field. The previous opacity-0 CSS
      animations and GENESIS_TRANSITION_SIDEBAR_DURATION_MS /
      GENESIS_TRANSITION_ACTION_BAR_DELAY_MS /
      GENESIS_TRANSITION_ACTION_BAR_DURATION_MS constants are removed.
      The black title-card overlay covered the moment of reveal, so a
      separate fade-in is no longer needed.
    inputs:
      - 'state.bootTitleCard is non-null or recently cleared'
    outputs:
      - 'sidebar gameplay content renders at full opacity from its first paint after the title card'
      - 'action bar renders at full opacity from its first paint after the title card'
    state_changes: []
    determinism: deterministic

  - id: genesis-renders-at-zoomed-out-font
    description: >
      The genesis renderer uses its own font size (GENESIS_FONT_SIZE)
      that is smaller than BASE_FONT_SIZE so the entire 147x147 prairie
      fits on screen as a "zoomed out" view. genesisRenderer.ts owns
      its own CharMetrics computation — it does not share metricsRef
      with the gameplay renderer. Concretely, GameCanvas computes
      gameplay metrics once via measureChar(ctx), and the genesis
      render path computes its own metrics via measureChar(ctx) at a
      genesis-specific font size on each frame (cheap; an
      ctx.measureText call). The genesis viewport is sized to the
      full prairie footprint at the genesis font size, not the
      browser window. When state.genesis transitions to null, control
      returns to the gameplay renderer at its native font size — the
      apparent zoom-in happens entirely under the black title-card
      overlay.
    inputs:
      - 'state.genesis is non-null on a render frame'
    outputs:
      - 'genesis renders the full 147x147 prairie at a smaller font size'
      - 'gameplay renders at BASE_FONT_SIZE after the title card finishes'
    state_changes: []
    determinism: deterministic

  - id: genesis-camera-centered-on-canvas
    description: >
      The genesis camera centers the prairie on the full canvas — it
      does not subtract rightInsetTiles from the visible width the way
      updateCamera does for gameplay. During genesis there is no right
      sidebar; the only DOM overlays are the bottom-center GenesisBottomBar
      year readout (pointer-events-none, fixed bottom-52, w-64) and the
      eventual boot title card. Both float over the canvas without
      reserving a side gutter, so anchoring the camera as if a sidebar
      existed would shift the prairie left and leave a starfield band
      on the right. The genesis cameraX uses (viewportWidth) as the
      effective visible width, anchored on the player spawn (one tile
      west of map center, matching createGameState). cameraY math is
      unchanged. At the genesis-to-game handoff the gameplay camera
      reintroduces the rightInsetTiles inset; the resulting one-time
      shift is hidden by the boot title card overlay (per the
      sidebar-and-action-bar-reveal behavior).
    inputs:
      - 'state.genesis is non-null on a render frame'
      - 'viewportWidth and viewportHeight from the genesis-font tile counts'
      - 'sim.width and sim.height (147 each)'
    outputs:
      - 'cameraX = clamp(playerX - floor(viewportWidth / 2), 0, sim.width - viewportWidth), negative-centered if sim.width < viewportWidth'
      - 'cameraY = clamp(playerY - floor(viewportHeight / 2), 0, sim.height - viewportHeight), negative-centered if sim.height < viewportHeight'
      - 'no rightInsetTiles term applied to genesis camera math'
    state_changes: []
    determinism: deterministic

  - id: fast-forward-skip-still-shows-title-card
    description: >
      A left-click on the canvas, or Escape/Space/Enter, during genesis
      fast-forwards remaining epochs by calling completeGenesis
      synchronously. The title card then runs normally — same
      bootTitleCard timing and label as a natural genesis completion.
      No animation runs during the fast-forward itself; the click
      handler is consumed and the rest of the mousedown pipeline does
      not run while state.genesis is active.
    inputs:
      - 'left mousedown or skip key while state.genesis is non-null'
    outputs:
      - 'completeGenesis runs synchronously'
      - 'state.bootTitleCard populated immediately afterward'
      - 'no selection, no pathfinding, no interaction from the click'
    state_changes:
      - field: genesis
        effect: 'cleared via completeGenesis'
      - field: bootTitleCard
        effect: 'populated by completeGenesis with startTime and label'
    determinism: deterministic

edge_cases:
  - id: resize-during-title-card
    description: >
      Browser window resizes during the title card window. The renderer
      recalculates viewport dimensions as normal. The overlay refills
      the new viewport on its next frame.
    expected: 'overlay adapts to new viewport size without visual glitch; label stays centered'

  - id: rapid-skip-then-resize
    description: >
      Player fast-forwards genesis and resizes the window before the
      title card finishes. The cleanup timer is wall-clock based, so
      the title card still clears on schedule regardless of resize.
    expected: 'title card clears at startTime + total duration regardless of resize events'

  - id: resize-during-genesis-recenters
    description: >
      Browser window resizes while genesis is playing. On the next
      frame, the genesis renderer recomputes viewportWidth /
      viewportHeight from the new canvas dimensions and recenters the
      prairie on the new viewport. No rightInsetTiles term participates.
    expected: 'prairie stays centered on the canvas after resize'

  - id: title-card-during-multiplayer-join
    description: >
      In multiplayer the boot title card is purely client-side. It
      does not gate network message processing for the local session;
      remote-player position updates can still apply to state behind
      the overlay so when the card lifts, peers are already in their
      current positions.
    expected: 'remote player state updates during the title card window; positions are correct on first visible frame after the card lifts'

failure_conditions:
  - trigger: 'state.bootTitleCard.startTime is in the future (clock skew)'
    expected: 'render pass treats alpha as 0; cleanup leaves the field until the wall clock catches up'

  - trigger: 'state.bootTitleCard is somehow still set after 2x total duration'
    expected: 'gameLoop cleanup force-clears it to null'

  - trigger: 'completeGenesis is called twice'
    expected: 'second call is a no-op because state.genesis is already null'

  - trigger: 'GENESIS_TRANSITION_DURATION_MS or related constants are referenced after the rewrite'
    expected: 'compile error — the constants must be removed from constants.ts'

verification:
  test_file: src/engine/__tests__/genesisTransition.test.ts
  test_pattern: 'boot title card'
  command: npx vitest run src/engine/__tests__/genesisTransition.test.ts
