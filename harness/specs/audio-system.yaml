id: audio-system
name: 'Audio system'
priority: medium
layer: engine
source_files:
  - src/engine/audio.ts
  - src/engine/types.ts
dependencies: [proximity-music-crossfade]

behaviors:
  - id: zone-music-mapping
    description: >
      ZONE_MUSIC maps each Zone to a music URL. when the player
      changes zones, setAmbient is called with the new zone's URL.
      the audio module manages an internal AudioContext, buffer cache,
      and two independent track channels: ambient (zone) and dialog
      (character). state is module-scoped (not on GameState):
      ambientUrl, ambientTrack, dialogTrack, enabled, fadeRafId,
      pendingResume.
    inputs:
      - 'Zone value from state.currentZone'
    outputs:
      - 'ambient music track playing for the active zone'
    state_changes:
      - field: '(module) ambientUrl'
        effect: 'set to zone music URL'
      - field: '(module) ambientTrack'
        effect: 'created or replaced via setAmbient'
    determinism: deterministic

  - id: ambient-crossfade
    description: >
      setAmbient(url, fadeMs?) crossfades from the current ambient
      track to a new one. default fade is 300ms (FADE_MS). if the
      module is disabled (muted), the URL is stored but no track is
      created. if the URL matches the current ambient and a track
      exists, the call is a no-op. an async race guard checks that
      ambientUrl has not changed during buffer fetch before assigning
      the new track.
    inputs:
      - 'url string, optional fadeMs'
    outputs:
      - 'old ambient track faded out, new one faded in'
    state_changes:
      - field: '(module) ambientUrl'
        effect: 'set to requested URL (even when disabled)'
      - field: '(module) ambientTrack'
        effect: 'old track destroyed, new track assigned after buffer fetch'
      - field: '(module) fadeRafId'
        effect: 'rAF id stored during crossfade animation'
    determinism: deterministic

  - id: dialog-music-layer
    description: >
      startDialogMusic(url, fadeMs?) creates a dialog track and
      fades ambient down while dialog plays. stopDialogMusic(fadeMs?)
      fades dialog out and ambient back in. both accept an optional
      fadeMs parameter (default FADE_MS = 300ms). only one dialog
      track exists at a time — calling startDialogMusic again
      destroys the previous dialog track first. callers (useMusic)
      must skip startDialogMusic when the opened character also has
      a MusicEmitter component on its entity — proximity music
      replaces dialog music entirely in that case (see
      proximity-music-crossfade spec). dialogTrack is reserved for
      characters without proximity emitters.
    inputs:
      - 'character dialog opened or closed'
    outputs:
      - 'dialog track playing over ducked ambient, or ambient restored'
    state_changes:
      - field: '(module) dialogTrack'
        effect: 'created on start, destroyed on stop'
      - field: '(module) fadeRafId'
        effect: 'rAF id stored during fade animation'
    determinism: deterministic

  - id: ambient-ducking-by-proximity
    description: >
      while one or more proximity emitter tracks exist (see
      proximity-music-crossfade), the ambient track gain is set to
      1 - max(emitterGain) across all active proximity tracks each
      proximity update tick. when no proximity tracks exist, the
      ambient gain returns to 1 (or 0 if dialog ducking is active).
      ambient ducking by proximity and ambient ducking by dialog
      are mutually exclusive — dialog ducking takes precedence when
      a dialog track is present, since dialog and proximity are
      never simultaneously active for the same character.
    inputs:
      - 'array of active proximity tracks with current gain values'
    outputs:
      - 'ambient track gain set to 1 - max(emitterGain) when no dialog track is present'
    state_changes:
      - field: '(module) ambientTrack.gain'
        effect: 'value driven by proximity update tick'
    determinism: deterministic

  - id: music-toggle
    description: >
      setMusicEnabled(value) toggles the enabled flag. when
      disabling, gain is set to 0 on all active tracks (preserving
      playback position). when re-enabling, gain is restored. if
      re-enabling and ambientUrl exists but ambientTrack is null,
      the ambient track is recreated via setAmbient.
    inputs:
      - 'boolean toggle from ESC menu'
    outputs:
      - 'tracks muted or unmuted'
    state_changes:
      - field: '(module) enabled'
        effect: 'set to value'
      - field: '(module) ambientTrack'
        effect: 'gain set to 0 (disable) or recreated (re-enable when null)'
      - field: '(module) dialogTrack'
        effect: 'gain set to 0 (disable)'
    determinism: deterministic

  - id: stop-all
    description: >
      stopAll() tears down all tracks, clears ambientUrl, cancels
      pending resume listeners, and resets fade state. used on
      unmount or scene teardown.
    inputs:
      - 'component unmount or scene change'
    outputs:
      - 'all audio stopped, state cleared'
    state_changes:
      - field: '(module) ambientTrack'
        effect: 'destroyed and set to null'
      - field: '(module) ambientUrl'
        effect: 'cleared to empty string'
      - field: '(module) dialogTrack'
        effect: 'destroyed and set to null'
      - field: '(module) fadeRafId'
        effect: 'cancelled'
      - field: '(module) pendingResume'
        effect: 'listener removed from document'
    determinism: deterministic

  - id: autoplay-resume
    description: >
      safeStart() handles browser autoplay policy. if AudioContext
      is suspended, attempts resume. on failure, registers a
      pendingResume listener on click and keydown events (with
      { once: true }) that retries resume on first user interaction.
    inputs:
      - 'AudioContext in suspended state'
    outputs:
      - 'AudioContext resumed after user interaction'
    state_changes:
      - field: '(module) pendingResume'
        effect: 'listener function stored for cleanup'
    determinism: deterministic

  - id: splash-audio-layer
    description: >
      `playSplashAudio(url)` and `stopSplashAudio(fadeMs?)` manage a
      third, independent track channel reserved for the
      Northern Information splash colophon cue. The splash track is a
      one-shot, non-looping source with its gain driven by an
      explicit triangle-wave envelope: ramp 0 → 1 over
      `SPLASH_FADE_IN_MS` (800ms), hold at 1 for `SPLASH_HOLD_MS`
      (1800ms), ramp 1 → 0 over `SPLASH_FADE_OUT_MS` (800ms), then
      destroy. The envelope is driven by a dedicated rAF loop
      (separate from the existing crossfade `fadeRafId`) so it does
      not contend with ambient zone crossfades. Only one
      `splashTrack` exists at a time; a second `playSplashAudio`
      call destroys the previous track before creating a new one
      (mirroring `startDialogMusic`). The splash layer does NOT duck
      ambient and is NOT ducked by dialog — it runs in parallel.
      When `audioEnabled` is false at call time, `playSplashAudio`
      is a no-op. `stopSplashAudio(fadeMs)` ramps the current gain
      to 0 over `fadeMs` (default 300ms) and then destroys the
      track; calling it when no splash track exists is a no-op.
      `stopAll()` also destroys any active splash track.
    inputs:
      - 'url string passed to playSplashAudio (one-shot, no fadeMs param)'
      - 'optional fadeMs passed to stopSplashAudio (default 300ms)'
    outputs:
      - 'splashTrack source playing with triangle-wave gain envelope'
      - 'splashTrack auto-destroyed after envelope completes OR at stopSplashAudio fade end'
    state_changes:
      - field: '(module) splashTrack'
        effect: 'created on playSplashAudio, destroyed on envelope completion or stopSplashAudio fade end'
      - field: '(module) splashRafId'
        effect: 'rAF id stored during the envelope animation; cancelled by stopSplashAudio or stopAll'
    determinism: deterministic

  - id: first-gesture-primer
    description: >
      At module load, before any safeStart call, the audio module
      registers a document-level pointerdown + keydown listener (both
      `{ once: true, capture: true }`) that primes the AudioContext
      on the player's first interaction. The handler creates the
      context if it has not yet been created, calls
      audioCtx.resume() when the context is suspended, and fires any
      queued pendingResume callback so an in-flight track can start
      without waiting for the next safeStart attempt. The primer
      self-disarms after firing (via `once: true` plus an internal
      `audioPrimed` guard) so subsequent gestures pass through
      unimpeded. Genesis playback requires no input from the player,
      so without the primer the AudioContext would stay suspended
      until the player happens to click something in-game — the
      primer makes the genesis ambient audible from the first
      gesture (typically dismissing the NorthernInformationSplash).
      safeStart's per-track resume path remains the fallback for any
      sequencing that races the primer (e.g. a setAmbient call that
      fires before any gesture occurs).
    inputs:
      - 'audio module loads (imported)'
      - 'document receives any pointerdown or keydown event'
    outputs:
      - 'on first gesture: AudioContext exists and is running; pendingResume callback (if any) has fired'
    state_changes:
      - field: '(module) audioPrimed'
        effect: 'flips false → true on first gesture; the listeners self-remove via { once: true }'
      - field: '(module) pendingResume'
        effect: 'cleared by firing the queued callback, if any'
    determinism: deterministic

edge_cases:
  - id: race-condition-fast-zone-switch
    description: 'player switches zones twice before the first buffer finishes loading'
    expected: 'the stale buffer is destroyed on arrival because ambientUrl no longer matches the fetched URL'
  - id: autoplay-policy-blocked
    description: 'browser blocks AudioContext resume before user interaction'
    expected: 'pendingResume listener is added to document; first user interaction resumes the context'
  - id: toggle-while-dialog-active
    description: 'player toggles music off while dialog music is playing'
    expected: 'both ambient and dialog gains set to 0; toggling back on restores both'
  - id: toggle-while-proximity-active
    description: 'player toggles music off while inside one or more proximity emitters'
    expected: 'all proximity track gains set to 0; ambient gain restored to 1 - max(emitterGain) state when re-enabled'
  - id: dialog-opens-on-proximity-character
    description: 'player opens dialog with a character that has a MusicEmitter component on its entity'
    expected: 'useMusic skips startDialogMusic; proximity track continues uninterrupted at its current gain'

failure_conditions:
  - trigger: 'audio file not found (404 on fetch)'
    expected: 'buffer creation fails silently; no track assigned; ambient remains null'
  - trigger: 'setAmbient called with same URL as current'
    expected: 'no-op; existing track continues playing'

verification:
  test_file: src/engine/__tests__/audio.test.ts
  test_pattern: 'audio'
  command: npx vitest run src/engine/__tests__/audio.test.ts
