id: RP-28-permacomputer-instruments
name: 'RP-28 — Permacomputer ambient instruments (bottom-bar center)'
priority: high
layer: component
source_files:
  - src/components/GameScreen.tsx
  - src/components/AmbientInstruments.tsx
  - src/components/ambientInstruments.helpers.ts
  - src/components/__tests__/AmbientInstruments.test.tsx
dependencies:
  - RP-30-the-diamond-is-the-world

behaviors:
  - id: ambient-instruments-mounted-between-minimap-and-iteminfo
    description: >
      AmbientInstruments mounts inside the bottom-bar overlay
      (data-panel="bottom-bar" in src/components/GameScreen.tsx lines
      225–251) as a sibling between the Minimap (left) and the
      ItemInfo column (right). It replaces the empty `flex-1` spacer
      div on line 234 ("pointer-events-auto flex-1"). The widget owns
      a pointer-events-auto container; its content does not steal
      drag/drop or click from the canvas because it sits inside an
      overlay slot, not over the world. The widget renders only when
      state.genesis is null (during genesis the gameplay bottom-bar
      does not mount, so there is no host for AmbientInstruments).
    inputs:
      - 'GameScreen renders outside genesis (state.genesis is null)'
    outputs:
      - 'AmbientInstruments component mounts inside data-panel="bottom-bar"'
      - 'AmbientInstruments sits between Minimap and the ItemInfo column'
      - 'the prior `flex-1` empty spacer div at GameScreen.tsx:234 is removed'
    state_changes: []
    determinism: deterministic

  - id: weathervane-renders-svg-arrow-and-cardinal-letter
    description: >
      The weathervane renders an inline SVG arrow (pointing N by
      default, rotated via CSS transform per state.weather.windDirection)
      together with the uppercase rotated-cardinal letter. The eight
      WindDirection enum keys map one-to-one to rotation degrees via
      VANE_ROTATION_DEG — N → 0°, NE → 45°, E → 90°, SE → 135°,
      S → 180°, SW → 225°, W → 270°, NW → 315°. The letter is the
      enum key itself (uppercase, no translation layer). This mapping
      reads under the rotated frame locked by RP-30 — the steward
      looks at the diamond on screen, the arrow points the way wind
      blows from a diamond tip toward its opposite, and the letter
      labels the same tip. No coordinate translation between storage
      and screen. The arrow is a single SVG element shared across all
      eight directions; rotation is purely visual.
    inputs:
      - 'state.weather.windDirection is one of the eight WindDirection enum keys'
    outputs:
      - 'an <svg> element renders the arrow with style="transform: rotate(<deg>deg)"'
      - 'rotation degrees match VANE_ROTATION_DEG[direction]'
      - 'the uppercase cardinal letter (one of "N", "NE", "E", "SE", "S", "SW", "W", "NW") is rendered as text in the same row'
      - 'the arrow uses currentColor stroke for color inheritance from the row'
    state_changes: []
    determinism: deterministic

  - id: wind-speed-label-five-fifths-of-max
    description: >
      The qualitative wind-speed label is derived from
      state.wind.smoothSpeed using even-fifth thresholds along
      [0, MAX_WIND_SPEED]. MAX_WIND_SPEED is 25 today in
      src/engine/weather/wind.ts. The labels are "still" for
      [0, 5), "breeze" for [5, 10), "brisk" for [10, 15),
      "gusty" for [15, 20), and "gale" for [20, 25] (inclusive at
      the upper bound). The function uses MAX_WIND_SPEED / 5 to
      compute band width — it does not hard-code 5 — so a future
      MAX_WIND_SPEED retune does not silently desync the labels.
      The function is exported as windSpeedLabel(smoothSpeed: number)
      from ambientInstruments.helpers.ts so the test can target the
      pure derivation directly.
    inputs:
      - 'state.wind.smoothSpeed (number, expected non-negative)'
    outputs:
      - 'windSpeedLabel(0) === "still"'
      - 'windSpeedLabel(4.999) === "still"'
      - 'windSpeedLabel(5) === "breeze"'
      - 'windSpeedLabel(9.999) === "breeze"'
      - 'windSpeedLabel(10) === "brisk"'
      - 'windSpeedLabel(15) === "gusty"'
      - 'windSpeedLabel(20) === "gale"'
      - 'windSpeedLabel(25) === "gale"'
    state_changes: []
    determinism: deterministic

  - id: sky-glyph-renders-inline-svg
    description: >
      The sky readout renders a small inline SVG matching
      state.weather.sky. Four distinct glyph components live in
      AmbientInstruments.tsx — SunGlyph (radial rays around a
      central circle), CloudGlyph (single outlined cloud silhouette),
      RainGlyph (cloud with three rain streaks below), and SnowGlyph
      (six-pointed snowflake star). A SkyGlyph dispatcher component
      switches on the Sky enum and returns the matching glyph.
      All four glyphs use stroke="currentColor" with the same stroke
      weight as the rest of the widget, rendering as monochrome
      outlines in the row's text color. No fills (or fills only
      where the design calls for them, also in currentColor).
    inputs:
      - 'state.weather.sky is one of the four Sky enum values'
    outputs:
      - 'an <svg> element renders the sky glyph for the current state.weather.sky'
      - 'all stroke attributes resolve to currentColor'
      - 'the glyph matches the GLYPH_SIZE constant (uniform with the other three glyphs)'
    state_changes: []
    determinism: deterministic

  - id: season-label-title-case
    description: >
      The season readout renders state.weather.season in Title Case
      ("Spring" / "Summer" / "Autumn" / "Winter"). Per CLAUDE.md
      writing rules, season labels are display labels (Title Case),
      not prose. The label is derived directly from the enum value —
      the enum values are lowercase ("spring", etc.) and the
      component capitalizes the first letter via the SEASON_LABEL
      lookup in ambientInstruments.helpers.ts.
    inputs:
      - 'state.weather.season is one of "spring", "summer", "autumn", "winter"'
    outputs:
      - 'one of the literal strings "Spring", "Summer", "Autumn", "Winter" is rendered'
    state_changes: []
    determinism: deterministic

  - id: moon-phase-derived-from-seasonal-phase
    description: >
      Moon phase is a pure derivation from state.seasonalPhase —
      no new state field. A real-world year contains ~12.3683
      lunations (365.25 days / 29.530588 days per lunation). The
      helpers module exports a constant LUNATIONS_PER_YEAR = 12.3683
      and a pure function moonPhase(seasonalPhase: number) →
      number in [0, 1) computed as (seasonalPhase *
      LUNATIONS_PER_YEAR) % 1.
    inputs:
      - 'state.seasonalPhase ∈ [0, 1)'
    outputs:
      - 'moonPhase(0) === 0'
      - 'moonPhase(0.5) is approximately (0.5 * 12.3683) % 1 ≈ 0.18415'
      - 'moonPhase(p) is always in [0, 1) for any p ∈ [0, 1)'
    state_changes: []
    determinism: deterministic

  - id: moon-phase-label
    description: >
      The moon readout displays a Title Case phase name. The
      continuous moonPhase value collapses to eight named phases
      via 28-bucket integer division. moonPhaseLabel(phase) maps
      bucket = floor(phase * 28) into MOON_PHASE_NAME_BY_BUCKET,
      a 28-entry array where the eight name groups repeat by
      index range: New Moon (0), Waxing Crescent (1-6), First
      Quarter (7), Waxing Gibbous (8-13), Full Moon (14), Waning
      Gibbous (15-20), Third Quarter (21), Waning Crescent (22-27).
      The eight canonical phase names are listed in MOON_PHASE_NAMES.
      No percentage, no illumination, no prose. The reading is the
      phase name on its own — calm, instrument-shaped.
    inputs:
      - 'moonPhase ∈ [0, 1)'
    outputs:
      - 'moonPhaseLabel(0) === "New Moon"'
      - 'moonPhaseLabel(0.25) === "First Quarter"'
      - 'moonPhaseLabel(0.5) === "Full Moon"'
      - 'moonPhaseLabel(0.75) === "Third Quarter"'
      - 'moonPhaseLabel(i/28) === "Waxing Crescent" for i in [1, 6]'
      - 'moonPhaseLabel(i/28) === "Waxing Gibbous" for i in [8, 13]'
      - 'moonPhaseLabel(i/28) === "Waning Gibbous" for i in [15, 20]'
      - 'moonPhaseLabel(i/28) === "Waning Crescent" for i in [22, 27]'
    state_changes: []
    determinism: deterministic

  - id: moon-glyph-renders-inline-svg
    description: >
      The moon readout renders an inline SVG whose shape encodes the
      current named phase. A MoonGlyph component takes the phase name
      and looks up a recipe in MOON_VISUAL_RECIPE — a record keyed by
      phase name with two fields: fill (0, 0.25, 0.5, 0.75, or 1) and
      side ('right', 'left', or null). New Moon renders as an outline
      circle. Full Moon renders as a filled circle. Partial phases
      use an SVG clipPath that masks a filled disc to show only the
      lit portion (a vertical band on the right for waxing phases,
      on the left for waning phases). The crescent/gibbous fill
      proportion comes from the recipe. All strokes and fills use
      currentColor so the glyph inherits the row's text color.
    inputs:
      - 'phase name is one of the eight MOON_PHASE_NAMES values'
    outputs:
      - 'New Moon renders an outline circle (no fill)'
      - 'Full Moon renders a filled circle'
      - 'crescents render a thin sliver of fill on the appropriate side'
      - 'gibbous phases render most of the disc filled with a thin sliver of darkness on the appropriate side'
      - 'quarter phases render exactly half filled'
      - 'all fill and stroke attributes resolve to currentColor'
    state_changes: []
    determinism: deterministic

  - id: almanac-radial-timer
    description: >
      The almanac surface is a small SVG dial (an outer ring plus a
      filled sector that fills clockwise from 12 o'clock as
      seasonalPhase advances toward the next quarter-bookmark) and
      a Title Case bookmark label adjacent to it. No percentage
      anywhere on the widget. The pure function
      almanacState(seasonalPhase: number) → { progress: number;
      nextBookmark: string } returns the fractional progress in
      [0, 1) toward the upcoming bookmark and the bookmark name.
      Bookmarks sit at 0 (Spring Equinox), 0.25 (Summer Solstice),
      0.5 (Autumn Equinox), 0.75 (Winter Solstice). The current
      quarter is floor(seasonalPhase / 0.25); progress within it
      is (seasonalPhase - quarterStart) / 0.25. The next bookmark
      wraps: at seasonalPhase=0.95 the next bookmark is Spring
      Equinox (phase 0 of the next year), not Spring Equinox of
      this year. The dial uses an SVG path with one Bezier arc;
      the sector renders nothing at progress=0 and a full disc at
      progress→1. Stroke and fill use currentColor so the dial
      adopts the widget's text color.
    inputs:
      - 'state.seasonalPhase ∈ [0, 1)'
    outputs:
      - 'almanacState(0.0) === { progress: 0, nextBookmark: "Summer Solstice" }'
      - 'almanacState(0.125) approximately equals { progress: 0.5, nextBookmark: "Summer Solstice" }'
      - 'almanacState(0.25) === { progress: 0, nextBookmark: "Autumn Equinox" }'
      - 'almanacState(0.5) === { progress: 0, nextBookmark: "Winter Solstice" }'
      - 'almanacState(0.75) === { progress: 0, nextBookmark: "Spring Equinox" }'
      - 'almanacState(0.875) approximately equals { progress: 0.5, nextBookmark: "Spring Equinox" }'
      - 'the rendered widget contains an <svg> with a <path> sibling to the bookmark label'
      - 'the rendered widget contains no "%" character anywhere'
    state_changes: []
    determinism: deterministic

  - id: uniform-typography-across-rows
    description: >
      All four rows of the widget share the same typographic
      treatment. Each row uses the same Tailwind class string —
      "flex items-center gap-2 font-mono text-xs text-zinc-400
      font-normal" — so font family, size, color, and weight are
      identical row-to-row. No row is emphasized, no row is dimmed,
      no row uses a different color or weight. Glyphs all render
      at the same GLYPH_SIZE pixel dimensions inside a flex-shrink-0
      glyph column. The widget reads as a calm-tech instrument
      panel where every readout sits at the same visual rank.
    inputs:
      - 'four rows: vane, sky, moon, almanac'
    outputs:
      - 'all four rows have className matching /font-mono.*text-zinc-400.*font-normal/'
      - 'all four glyphs render at the same GLYPH_SIZE pixel dimensions'
      - 'no row has a different text color, font weight, or font family from the others'
    state_changes: []
    determinism: deterministic

  - id: pure-render-no-state-writes
    description: >
      AmbientInstruments is a pure render. It does not declare
      useState, useEffect, useRef, or any other React hook that
      mutates state. It does not call refreshUI. It does not write
      to state. It does not subscribe to events. It does not
      register listeners. It reads state.weather.windDirection,
      state.wind.smoothSpeed, state.weather.sky, state.weather.season,
      and state.seasonalPhase only. Moon phase is a pure derivation
      from state.seasonalPhase (see moon-phase-derived-from-seasonal-phase)
      — no separate state field, no separate read. All glyphs are
      inline SVGs in the component source; no font files, no CSS
      classes from external icon libraries.
    inputs:
      - 'a GameState object passed via props'
    outputs:
      - 'a React element tree'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: wind-speed-at-band-boundaries
    description: 'state.wind.smoothSpeed at exactly 5, 10, 15, 20, 25'
    expected: 'labels return "breeze", "brisk", "gusty", "gale", "gale" respectively (intervals are [a, b) except the last which is [20, 25])'
  - id: wind-speed-zero
    description: 'state.wind.smoothSpeed is exactly 0 (initial state)'
    expected: 'windSpeedLabel returns "still"'
  - id: wind-speed-overflow
    description: 'state.wind.smoothSpeed somehow exceeds MAX_WIND_SPEED'
    expected: 'windSpeedLabel returns "gale" — the function clamps high values to the top band rather than returning undefined or a fifth-from-top default'
  - id: seasonal-phase-wraps-past-final-bookmark
    description: 'seasonalPhase is in [0.75, 1.0) — between Winter Solstice and the next year''s Spring Equinox'
    expected: 'almanacState returns nextBookmark "Spring Equinox" and progress = (phase - 0.75) / 0.25, a continuous fill across the final quarter of the year'
  - id: seasonal-phase-exactly-on-bookmark
    description: 'seasonalPhase is exactly 0.0, 0.25, 0.5, or 0.75'
    expected: 'progress is 0 and the next bookmark is the one after — at 0.0 the next bookmark is Summer Solstice, at 0.25 it is Autumn Equinox, etc.'
  - id: genesis-active
    description: 'state.genesis is non-null (genesis sim still running)'
    expected: 'gameplay bottom-bar does not mount; AmbientInstruments is not mounted; genesis renders no HUD'
  - id: rotated-cardinal-frame-locked
    description: 'the rotated-cardinal frame from RP-30 is the only frame the vane reads'
    expected: 'AmbientInstruments does not translate state.weather.windDirection through any rotation matrix or remap table — it reads the enum directly and uses VANE_ROTATION_DEG for visual rotation only. If RP-30''s frame is reverted, this component automatically reverts with it.'
  - id: moon-phase-completes-multiple-cycles-per-year
    description: 'seasonalPhase advances from 0 to 1 over one in-game year'
    expected: 'moonPhase(seasonalPhase) completes ~12.37 cycles in the same span — for seasonalPhase = 1/LUNATIONS_PER_YEAR the moon is back at new (within bucket-rounding tolerance)'
  - id: moon-phase-full-coincides-with-half-lunation
    description: 'moonPhase = 0.5 (midpoint of a single lunation)'
    expected: 'moonPhaseLabel returns "Full Moon"'

failure_conditions:
  - trigger: 'AmbientInstruments declares useState, useEffect, useRef, or any non-render React hook'
    expected: 'spec violated — the widget must be a pure render'
  - trigger: 'a new field is added to GameState by this feature'
    expected: 'spec violated — pure render only, no new state fields'
  - trigger: 'a new event tag, event log entry, transition narration, or toast is added by this feature'
    expected: 'spec violated — continuous readouts only, no event language'
  - trigger: 'the bottom-bar layout breaks because the flex-1 spacer was removed and AmbientInstruments does not occupy its slot'
    expected: 'spec violated — AmbientInstruments must take the flex-1 slot or the layout must continue to space Minimap and ItemInfo apart'
  - trigger: 'windSpeedLabel hard-codes band width as a numeric literal (5) instead of MAX_WIND_SPEED / 5'
    expected: 'spec violated — the band width must derive from MAX_WIND_SPEED so a future retune does not desync the labels'
  - trigger: 'the weathervane applies any rotation matrix or remap table between state.weather.windDirection and the visual rotation'
    expected: 'spec violated — under RP-30 the enum reads directly; rotation degrees come from VANE_ROTATION_DEG (a pure lookup)'
  - trigger: 'the widget depends on any external icon font, icon library, or web font for its glyphs'
    expected: 'spec violated — all glyphs are inline SVGs in the component source; no font files, no CSS classes from external icon libraries'
  - trigger: 'the widget references the removed Weather Icons font (wi-* classes, weathericons-regular-webfont, @font-face for weathericons)'
    expected: 'spec violated — the Weather Icons approach was abandoned; SVG glyphs replace the font entirely'
  - trigger: 'AmbientInstruments imports from src/network/, src/engine/movement.ts, or any handler module'
    expected: 'spec violated — the component reads state fields only, no interaction or networking dependencies'
  - trigger: 'moonPhase introduces a new state.moonPhase field or any other state mutation'
    expected: 'spec violated — moon phase is a pure derivation from state.seasonalPhase, no new state allowed'
  - trigger: 'LUNATIONS_PER_YEAR is hard-coded to an integer (12 or 13) instead of the fractional astronomical value (365.25 / 29.530588 ≈ 12.3683)'
    expected: 'spec violated — the lunar period is fractional; integer approximation desynchronizes moon and seasons within a year'
  - trigger: 'the widget renders any "%" character anywhere (e.g. illumination percentage, almanac percentage)'
    expected: 'spec violated — the widget is percentage-free; phase labels and a radial dial replace numeric progress readouts'
  - trigger: 'moonPhaseLabel returns a label outside the eight-name set (New Moon / Waxing Crescent / First Quarter / Waxing Gibbous / Full Moon / Waning Gibbous / Third Quarter / Waning Crescent)'
    expected: 'spec violated — the 28 buckets collapse to exactly eight Title Case names'
  - trigger: 'the almanac surface is text-only (no SVG dial) or the dial has tick marks, numerals, or labels other than the bookmark name'
    expected: 'spec violated — the dial is a ring + filled sector with no embellishment; the only adjacent text is the upcoming bookmark name'
  - trigger: 'rows have different colors, font weights, or font families'
    expected: 'spec violated — uniform typography is required; every row uses the same Tailwind class string for font properties'

verification:
  test_file: src/components/__tests__/AmbientInstruments.test.tsx
  test_pattern: 'AmbientInstruments'
  command: 'npx vitest run src/components/__tests__/AmbientInstruments.test.tsx'
