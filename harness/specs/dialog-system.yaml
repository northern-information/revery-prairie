id: dialog-system
name: 'Character dialog system'
priority: high
layer: engine
source_files:
  - src/engine/interaction.ts
  - src/engine/characters.ts
  - src/engine/interactables.ts
  - src/engine/types.ts
dependencies:
  - player-movement
  - ghosts
  - moab-colde
  - RP-63-interactable-speakers

behaviors:
  - id: interact-with-character
    description: >
      interactWithCharacter(state) finds the adjacent character
      (preferring playerFacing direction, falling back to cardinal
      neighbors), records a manual discovery for the character,
      and initializes activeDialog with speakerKind 'character',
      characterId, lineIndex 0, typingIndex 0, typingDone false,
      transitioning false, transitionStartTime 0. does not give gifts —
      gift delivery happens on dialog completion via advanceDialog.
      always returns { opened: boolean, gift: null, coyoteToggled: false }.
      the coyoteToggled field is reserved for a legacy interaction
      that toggled coyote mode via [f]; it is no longer used (coyote
      mode is controlled via the permacomputer panel), but the
      field remains in the return type for backward compatibility.
      coyote adjacency records the character discovery and returns
      without opening dialog. Angels are not returned by
      getAdjacentCharacter at all — they are environmental presences
      with no dialog (see angels:angel-no-interaction).
    inputs:
      - 'player adjacent to a character entity, [f] pressed'
    outputs:
      - '{ opened: boolean, gift: null, coyoteToggled: false }'
    state_changes:
      - field: activeDialog
        effect: 'initialized with character dialog state'
      - field: manualDiscoveries
        effect: 'character discovery recorded'
    determinism: deterministic

  - id: dialog-typing
    description: >
      tickDialogTyping(state, now) advances the typing animation
      one character at a time. each character reveals after
      DIALOG_TYPING_MS (40ms) has elapsed since lastDialogTypingTick.
      the current line is sourced from getActiveDialogLines(state)[lineIndex],
      which routes character and interactable variants to their respective
      registries (see dialog-advance). when typingIndex reaches the line
      length, typingDone is set to true. skipped when transitioning or
      no active dialog.
    inputs:
      - 'active dialog with typingDone false, current timestamp'
    outputs:
      - 'one more character revealed'
    state_changes:
      - field: activeDialog.typingIndex
        effect: 'incremented by 1'
      - field: activeDialog.typingDone
        effect: 'set to true when line fully revealed'
      - field: lastDialogTypingTick
        effect: 'updated to current time'
    determinism: time-based

  - id: dialog-advance
    description: >
      advanceDialog(state, time?) handles [f] press during dialog.
      returns { continuing: boolean; gift: GiftAnnouncement | null }.
      the active line array is resolved via getActiveDialogLines(state),
      which branches on activeDialog.speakerKind: 'character' delegates
      to getCharacterDialog(state, characterId); 'interactable' delegates
      to getInteractableLines(interactableId). if typing is not done,
      reveals the full line immediately and returns { continuing: true,
      gift: null }. if transitioning, ignores the press and returns
      { continuing: true, gift: null }. if more lines remain, sets
      transitioning to true with transitionStartTime and returns
      { continuing: true, gift: null }. if no more lines, nulls
      activeDialog and triggers the gift delivery flow via
      dialog-completion-gift (time is forwarded to
      giveCharacterGift/givePostGift for pickup-bloom spawning). gift
      delivery only runs on the 'character' variant — interactables
      have no gift, so the gift flow is skipped on speakerKind
      'interactable'. additionally, when the closing dialog belongs
      to Gron and state.pendingSavedBees is true, the saved-bees
      release fires per main-questline-foundation:gron-saving-bees-release
      before the gift flow runs.
    inputs:
      - '[f] pressed during active dialog, optional time'
    outputs:
      - '{ continuing: boolean, gift: GiftAnnouncement | null }'
    state_changes:
      - field: activeDialog
        effect: 'typing completed, or transition started, or set to null'
      - field: '(gron saved-bees release)'
        effect: 'when Gron dialog closes with pendingSavedBees true, releaseSavedBees fires per main-questline-foundation:gron-saving-bees-release'
    determinism: deterministic

  - id: dialog-completion-gift
    description: >
      when advanceDialog reaches the last line and closes the dialog,
      it checks the gift state for the character. if giftsReceived
      does not contain the characterId, calls giveCharacterGift to
      deliver the initial item gift and returns { continuing: false,
      gift: GiftAnnouncement | null }. if the initial gift was
      already received and the character has a postGift defined and
      postGiftActionsCompleted does not contain the characterId,
      calls givePostGift and adds characterId to
      postGiftActionsCompleted, returning { continuing: false,
      gift: GiftAnnouncement | null }. if neither condition applies,
      returns { continuing: false, gift: null }.
    inputs:
      - 'dialog reaches last line and closes'
    outputs:
      - '{ continuing: false, gift: GiftAnnouncement | null }'
    state_changes:
      - field: activeDialog
        effect: 'set to null'
      - field: giftsReceived
        effect: 'characterId added if initial gift given'
      - field: postGiftActionsCompleted
        effect: 'characterId added if postGift given'
      - field: manualDiscoveries
        effect: 'item gift discoveries recorded'
    determinism: deterministic

  - id: dialog-transition
    description: >
      tickDialogTransition(state, now) waits DIALOG_TRANSITION_MS
      (300ms) then advances to the next line by incrementing
      lineIndex, resetting typingIndex to 0, typingDone to false,
      and transitioning to false.
    inputs:
      - 'active dialog with transitioning true, current timestamp'
    outputs:
      - 'next dialog line ready for typing'
    state_changes:
      - field: activeDialog
        effect: 'lineIndex incremented, typing state reset'
    determinism: time-based

  - id: character-gift-delivery
    description: >
      giveCharacterGift(state, characterId, time?) checks if the
      character definition has a `gift` of kind 'item' and the gift
      has not already been received. when both hold, the item is
      added to the backpack via the standard pickup path, the
      characterId is added to giftsReceived, the corresponding
      `item:<id>` discovery is recorded, and a pickupBloom is spawned
      at the player position when time is provided (per
      universal-pickup-bloom convention). returns a
      GiftAnnouncement describing the item, or null when no gift
      applies. called by advanceDialog on dialog completion, not
      during interactWithCharacter. tracked in state.giftsReceived
      so each character delivers their gift once.
    inputs:
      - 'characterId with an item gift defined, gift not yet received, optional time'
    outputs:
      - 'GiftAnnouncement when an item gift was delivered, null otherwise'
    state_changes:
      - field: backpack
        effect: 'gift item added'
      - field: giftsReceived
        effect: 'characterId added'
      - field: manualDiscoveries
        effect: 'item:<id> recorded for the delivered item'
      - field: world
        effect: 'pickupBloom entity spawned at player position when time is provided'
    determinism: deterministic

  - id: post-gift-delivery
    description: >
      givePostGift(state, characterId, time?) checks if the character
      definition has a `postGift` of kind 'item' and the post-gift
      has not already been delivered (characterId not in
      postGiftActionsCompleted). when both hold, the item is added to
      the backpack, characterId is added to postGiftActionsCompleted,
      the corresponding `item:<id>` discovery is recorded, and a
      pickupBloom is spawned at the player position when time is
      provided. called by advanceDialog on dialog completion when
      the initial gift has already been received. one-time per
      character via postGiftActionsCompleted.
    inputs:
      - 'characterId with an item postGift defined, postGift not yet delivered, optional time'
    outputs:
      - 'GiftAnnouncement when a post-gift item was delivered, null otherwise'
    state_changes:
      - field: backpack
        effect: 'post-gift item added'
      - field: postGiftActionsCompleted
        effect: 'characterId added'
      - field: manualDiscoveries
        effect: 'item:<id> recorded for the delivered item'
      - field: world
        effect: 'pickupBloom entity spawned at player position when time is provided'
    determinism: deterministic

  - id: locked-gate-dialog-entry
    description: >
      openLockedGateDialog(state) is a separate dialog-opening pathway
      that opens a dialog against the 'gate' Interactable (no Position
      component, never returned by getAdjacentCharacter, excluded from
      manual auto-derivation) and sets activeDialog to its single line
      "The gate is locked." used by the ruin-locked-door flow when the
      player presses [f] on a locked door without an aqueductKey.
      activeDialog is set with speakerKind 'interactable' and
      interactableId 'gate' — see RP-63-interactable-speakers for the
      Interactable contract and ruin-locked-door:locked-gate-dialog for
      the trigger surface.
    inputs:
      - 'player presses [f] facing a RuinDoorLocked tile with no aqueductKey'
    outputs:
      - 'activeDialog set to the gate interactable descriptor'
    state_changes:
      - field: activeDialog
        effect: "set to { speakerKind: 'interactable', interactableId: 'gate', lineIndex: 0, typingIndex: 0, typingDone: false, transitioning: false, transitionStartTime: 0 }"
    determinism: deterministic

  - id: adjacent-character-detection
    description: >
      getAdjacentCharacter(state) queries ECS for character entities
      adjacent to the player. prefers the tile in playerFacing
      direction, falls back to cardinal neighbors. returns
      { definitionId, pos } or null.
    inputs:
      - 'player position and facing direction'
    outputs:
      - '{ definitionId: string, pos: Position } or null'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: no-adjacent-character
    description: 'player presses [f] with no character in range'
    expected: 'interactWithCharacter returns { opened: false, gift: null, coyoteToggled: false }'
  - id: gift-already-received
    description: 'player talks to a character whose gift was already given'
    expected: 'postGiftDialog is shown instead of original dialog; gift given on dialog completion not on interaction open'
  - id: advance-during-transition
    description: 'player presses [f] while dialog line is transitioning'
    expected: 'press is ignored, returns { continuing: true, gift: null }'
  - id: coyote-adjacency-no-dialog
    description: 'player presses [f] adjacent to the coyote'
    expected: "interactWithCharacter returns { opened: false, gift: null, coyoteToggled: false } and records 'character:coyote' discovery, but does not open dialog (coyote dialog is auto-opened by the rescue sequence, not [f])"
  - id: rapid-advance
    description: 'player presses [f] rapidly before typing finishes'
    expected: 'first press reveals full line; second press starts transition or closes dialog'
  - id: post-gift-already-completed
    description: 'player completes postGiftDialog after postGift already given'
    expected: 'advanceDialog returns { continuing: false, gift: null }; postGiftActionsCompleted guard prevents double delivery'

failure_conditions:
  - trigger: 'interactWithCharacter called with no active dialog and no adjacent character'
    expected: 'returns { opened: false, gift: null, coyoteToggled: false }; no state changes'
  - trigger: 'advanceDialog called with no activeDialog'
    expected: 'returns { continuing: false, gift: null }; no state changes'

verification:
  test_file: src/engine/__tests__/interaction.test.ts
  test_pattern: 'dialog'
  command: npx vitest run src/engine/__tests__/interaction.test.ts
