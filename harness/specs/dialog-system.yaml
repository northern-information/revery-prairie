id: dialog-system
name: 'Character dialog system'
priority: high
layer: engine
source_files:
  - src/engine/interaction.ts
  - src/engine/characters.ts
  - src/engine/types.ts
dependencies:
  - player-movement
  - ghosts
  - moab-colde

behaviors:
  - id: interact-with-character
    description: >
      interactWithCharacter(state) finds the adjacent character
      (preferring playerFacing direction, falling back to cardinal
      neighbors), records a manual discovery for the character,
      and initializes activeDialog with characterId, lineIndex 0,
      typingIndex 0, typingDone false, transitioning false,
      transitionStartTime 0. does not give gifts — gift delivery
      happens on dialog completion via advanceDialog. always
      returns { opened: boolean, gift: null, coyoteToggled: false }.
      the coyoteToggled field is reserved for a legacy interaction
      that toggled coyote mode via [e]; it is no longer used (coyote
      mode is controlled via the permacomputer panel), but the
      field remains in the return type for backward compatibility.
      coyote and angel characters take alternate paths: coyote
      adjacency records the character discovery and returns without
      opening dialog; angels store their canto on first interaction
      before the dialog opens.
    inputs:
      - 'player adjacent to a character entity, [e] pressed'
    outputs:
      - '{ opened: boolean, gift: null, coyoteToggled: false }'
    state_changes:
      - field: activeDialog
        effect: 'initialized with character dialog state'
      - field: manualDiscoveries
        effect: 'character discovery recorded; angel canto stored on first interaction'
    determinism: deterministic

  - id: dialog-typing
    description: >
      tickDialogTyping(state, now) advances the typing animation
      one character at a time. each character reveals after
      DIALOG_TYPING_MS (40ms) has elapsed since lastDialogTypingTick.
      when typingIndex reaches the line length, typingDone is set
      to true. skipped when transitioning or no active dialog.
    inputs:
      - 'active dialog with typingDone false, current timestamp'
    outputs:
      - 'one more character revealed'
    state_changes:
      - field: activeDialog.typingIndex
        effect: 'incremented by 1'
      - field: activeDialog.typingDone
        effect: 'set to true when line fully revealed'
      - field: lastDialogTypingTick
        effect: 'updated to current time'
    determinism: time-based

  - id: dialog-advance
    description: >
      advanceDialog(state, time?) handles [e] press during dialog.
      returns { continuing: boolean; gift: ReveryDefinition | null }.
      if typing is not done, reveals the full line immediately and
      returns { continuing: true, gift: null }. if transitioning,
      ignores the press and returns { continuing: true, gift: null }.
      if more lines remain, sets transitioning to true with
      transitionStartTime and returns { continuing: true, gift: null }.
      if no more lines, nulls activeDialog and triggers the gift
      delivery flow via dialog-completion-gift (time is forwarded to
      giveCharacterGift/givePostGift for pickup-bloom spawning).
      additionally, when the closing dialog belongs to Gron and
      state.pendingSavedBees is true, the saved-bees release fires
      per main-questline-foundation:gron-saving-bees-release before
      the gift flow runs.
    inputs:
      - '[e] pressed during active dialog, optional time'
    outputs:
      - '{ continuing: boolean, gift: ReveryDefinition | null }'
    state_changes:
      - field: activeDialog
        effect: 'typing completed, or transition started, or set to null'
      - field: '(gron saved-bees release)'
        effect: 'when Gron dialog closes with pendingSavedBees true, releaseSavedBees fires per main-questline-foundation:gron-saving-bees-release'
    determinism: deterministic

  - id: dialog-completion-gift
    description: >
      when advanceDialog reaches the last line and closes the dialog,
      it checks the gift state for the character. if giftsReceived
      does not contain the characterId, calls giveCharacterGift to
      deliver the initial gift and returns { continuing: false,
      gift: ReveryDefinition | null }. if the initial gift was
      already received and the character has a postGift defined and
      postGiftActionsCompleted does not contain the characterId,
      calls givePostGift and adds characterId to
      postGiftActionsCompleted, returning { continuing: false,
      gift: ReveryDefinition | null }. if neither condition applies,
      returns { continuing: false, gift: null }.
    inputs:
      - 'dialog reaches last line and closes'
    outputs:
      - '{ continuing: false, gift: ReveryDefinition | null }'
    state_changes:
      - field: activeDialog
        effect: 'set to null'
      - field: giftsReceived
        effect: 'characterId added if initial gift given'
      - field: reveries
        effect: 'revery id pushed if gift is a revery'
      - field: postGiftActionsCompleted
        effect: 'characterId added if postGift given'
      - field: manualDiscoveries
        effect: 'revery and gift event discoveries recorded'
    determinism: deterministic

  - id: dialog-transition
    description: >
      tickDialogTransition(state, now) waits DIALOG_TRANSITION_MS
      (300ms) then advances to the next line by incrementing
      lineIndex, resetting typingIndex to 0, typingDone to false,
      and transitioning to false.
    inputs:
      - 'active dialog with transitioning true, current timestamp'
    outputs:
      - 'next dialog line ready for typing'
    state_changes:
      - field: activeDialog
        effect: 'lineIndex incremented, typing state reset'
    determinism: time-based

  - id: character-gift-delivery
    description: >
      giveCharacterGift(state, characterId, time?) checks if the
      character definition has a gift and if it has not already been
      received. for revery gifts, pushes the revery id to state.reveries,
      auto-assigns to the action bar, adds characterId to
      giftsReceived, records manual discoveries, and spawns a
      pickupBloom at the player position when time is provided
      (per universal-pickup-bloom convention). returns the
      ReveryDefinition or null. called by advanceDialog on dialog
      completion, not during interactWithCharacter. tracked in
      state.giftsReceived so each character gives their gift once.
    inputs:
      - 'characterId with a gift defined, gift not yet received, optional time'
    outputs:
      - 'ReveryDefinition if gift is a revery, null otherwise'
    state_changes:
      - field: reveries
        effect: 'revery id pushed'
      - field: giftsReceived
        effect: 'characterId added'
      - field: manualDiscoveries
        effect: 'revery and gift event discoveries recorded'
      - field: world
        effect: 'pickupBloom entity spawned at player position when time is provided'
    determinism: deterministic

  - id: post-gift-delivery
    description: >
      givePostGift(state, characterId, time?) checks if the character
      definition has a postGift field. for revery postGifts, pushes
      the revery id to state.reveries, auto-assigns to the action
      bar, records manual discoveries, and spawns a pickupBloom at
      the player position when time is provided. called by
      advanceDialog on dialog completion when the initial gift has
      already been received and postGiftActionsCompleted does not
      contain the characterId. one-time per character via
      postGiftActionsCompleted.
    inputs:
      - 'characterId with a postGift defined, postGift not yet completed, optional time'
    outputs:
      - 'ReveryDefinition if postGift is a revery, null otherwise'
    state_changes:
      - field: reveries
        effect: 'revery id pushed'
      - field: manualDiscoveries
        effect: 'revery and deep-time event discoveries recorded'
      - field: world
        effect: 'pickupBloom entity spawned at player position when time is provided'
    determinism: deterministic

  - id: locked-gate-dialog-entry
    description: >
      openLockedGateDialog(state) is a separate dialog-opening pathway
      that synthesizes a 'gate' speaker (no Position component, never
      returned by getAdjacentCharacter, excluded from manual
      auto-derivation) and sets activeDialog to its single line
      "The gate is locked." used by the ruin-locked-door flow when the
      player presses [e] on a locked door without an aqueductKey.
      see ruin-locked-door:locked-gate-dialog for the full contract.
    inputs:
      - 'player presses [e] facing a RuinDoorLocked tile with no aqueductKey'
    outputs:
      - 'activeDialog set to the gate descriptor'
    state_changes:
      - field: activeDialog
        effect: "set to { characterId: 'gate', lineIndex: 0, typingIndex: 0, typingDone: false, transitioning: false, transitionStartTime: 0 }"
    determinism: deterministic

  - id: adjacent-character-detection
    description: >
      getAdjacentCharacter(state) queries ECS for character entities
      adjacent to the player. prefers the tile in playerFacing
      direction, falls back to cardinal neighbors. returns
      { definitionId, pos } or null.
    inputs:
      - 'player position and facing direction'
    outputs:
      - '{ definitionId: string, pos: Position } or null'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: no-adjacent-character
    description: 'player presses [e] with no character in range'
    expected: 'interactWithCharacter returns { opened: false, gift: null, coyoteToggled: false }'
  - id: gift-already-received
    description: 'player talks to a character whose gift was already given'
    expected: 'postGiftDialog is shown instead of original dialog; gift given on dialog completion not on interaction open'
  - id: advance-during-transition
    description: 'player presses [e] while dialog line is transitioning'
    expected: 'press is ignored, returns { continuing: true, gift: null }'
  - id: coyote-adjacency-no-dialog
    description: 'player presses [e] adjacent to the coyote'
    expected: "interactWithCharacter returns { opened: false, gift: null, coyoteToggled: false } and records 'character:coyote' discovery, but does not open dialog (coyote dialog is auto-opened by the rescue sequence, not [e])"
  - id: rapid-advance
    description: 'player presses [e] rapidly before typing finishes'
    expected: 'first press reveals full line; second press starts transition or closes dialog'
  - id: post-gift-already-completed
    description: 'player completes postGiftDialog after postGift already given'
    expected: 'advanceDialog returns { continuing: false, gift: null }; postGiftActionsCompleted guard prevents double delivery'

failure_conditions:
  - trigger: 'interactWithCharacter called with no active dialog and no adjacent character'
    expected: 'returns { opened: false, gift: null, coyoteToggled: false }; no state changes'
  - trigger: 'advanceDialog called with no activeDialog'
    expected: 'returns { continuing: false, gift: null }; no state changes'

verification:
  test_file: src/engine/__tests__/interaction.test.ts
  test_pattern: 'dialog'
  command: npx vitest run src/engine/__tests__/interaction.test.ts
