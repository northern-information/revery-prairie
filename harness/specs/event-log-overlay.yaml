id: event-log-overlay
name: 'Event log overlay (lower-left, terminal-style fade)'
priority: medium
layer: component
source_files:
  - src/components/EventLog.tsx
  - src/components/GameScreen.tsx
  - src/components/Sidebar.tsx
  - src/components/ActionBar.tsx
  - src/components/CommandPanel.tsx
  - src/hooks/useEventLog.ts
  - src/hooks/useGameEngine.ts
  - src/engine/genesis.ts
  - src/engine/genesisTypes.ts
  - src/engine/state.ts
  - src/engine/types.ts
  - src/engine/gameLoop.ts
  - src/engine/celestial.ts
  - src/engine/ruins.ts
  - src/components/__tests__/EventLog.test.tsx
  - src/components/__tests__/Sidebar.test.tsx
  - src/engine/__tests__/genesis.test.ts
dependencies:
  - action-bar

behaviors:
  - id: no-floating-toast-surface
    description: >
      The game has no floating-toast notification surface. There is no
      PickupToasts component, no `toasts` state in `useEventLog`, no
      `TOAST_DURATION` / `TOAST_FADE_START` constants, and no rAF tick
      loop maintaining toast lifetime. Every `addEvent` call appends a
      single entry to the log buffer; the EventLog overlay is the sole
      visual surface for game events. GameScreen does not import or
      mount any toast component. `useEventLog` returns only `{ log,
      addEvent }` — `toasts` is removed from its public API.
    inputs:
      - 'any code path that previously rendered a toast (pickup, drop, combine, discovery, dialog, narration, lightning, meteor shower, satellite impact, ruin entry, ruin door unlock, bee death, multiplayer error, player spawn arrival)'
    outputs:
      - 'log entry appended via addEvent; no floating popup rendered'
      - 'GameScreen does not mount a PickupToasts component'
      - 'useEventLog return shape is { log, addEvent }'
    state_changes: []
    determinism: deterministic

  - id: queued-events-engine-buffer
    description: >
      The engine maintains a `queuedEvents: QueuedEvent[]` buffer on
      GameState (formerly `queuedToasts: QueuedToast[]`). Engine code
      that needs to surface a log entry from inside a tick (player spawn
      arrival, satellite impact, etc.) pushes onto this buffer; the
      `drainQueuedEvents` system in gameLoop drains it once per frame
      by invoking `callbacks.onDiscovery` for each entry. The shape of
      QueuedEvent is identical to the prior QueuedToast (text, worldX,
      worldY, icon, iconColor) — only the names change. The
      EXPECTED_FIELDS allowlist in the serialization schema test is
      updated to use `queuedEvents`.
    inputs:
      - 'engine code calls state.queuedEvents.push({...})'
      - 'gameLoop drainQueuedEvents tick fires'
    outputs:
      - 'each queued entry is delivered to onDiscovery in order; buffer is cleared'
    state_changes:
      - field: queuedEvents
        effect: 'cleared after drain'
    determinism: deterministic

  - id: log-rendered-as-corner-overlay
    description: >
      The event log renders as a fixed-position overlay anchored to the
      lower-left of the viewport (bottom-2 / left-2 with a small inset)
      with a fixed width (w-96 / 384px). It is no longer a section
      inside the right-hand Sidebar. The overlay matches the existing
      Sidebar visual language (font-mono text-xs, bg-black/70 backdrop)
      for consistency. The Sidebar no longer renders a log section;
      the eventLog prop is removed from Sidebar. The overlay is rendered
      throughout the GameScreen lifetime — including during genesis and
      the genesis-to-gameplay crossfade — so genesis narration entries
      (see genesis-narration-entries) are visible from the first epoch.
      The overlay only mounts visibly once the log has at least one
      entry; while the log is empty it occupies no visual footprint.
    inputs:
      - 'GameScreen rendered with at least one event in the log'
      - 'GameScreen rendered during genesis (state.genesis is non-null)'
    outputs:
      - 'EventLog overlay component rendered as a fixed element at the lower-left'
      - 'Overlay is mounted during genesis so narration entries appear there in real time'
      - 'Sidebar no longer contains a Log section'
    state_changes: []
    determinism: deterministic

  - id: genesis-narration-entries
    description: >
      Each genesis epoch contributes one entry to the event log, using
      the epoch's `commentary` string verbatim as the entry text. The
      entry is appended at the start of the epoch (the first tick where
      `sim.epochStartTime` transitions from 0 → time). Entries are added
      in epoch order, so when `useEventLog` reverses the buffer for
      display, the oldest narration sits at the top of the visible log
      and the newest at the bottom — matching the terminal-style
      ordering used by all other log entries (see log-newest-at-bottom).
      No entry is added more than once for a given epoch index. Live
      gameplay events that arrive after genesis completes are appended
      below the narration entries, preserving chronological order.
      Narration entries use the `'narration'` GameEvent kind and share
      the same visual styling as other log entries (font-mono text-xs,
      same fade curve). The icon glyph and color are uniform across all
      narration entries so the 14 entries form a visually consistent
      narration column. There is no separate floating-toast surface;
      the EventLog overlay is the only consumer of `addEvent`.
    inputs:
      - 'tickGenesis enters a new epoch (sim.epochStartTime transitions from 0)'
      - 'completeGenesis runs (skip path) with one or more unfired epochs'
    outputs:
      - 'one log entry per epoch, in chronological order'
      - 'narration entry appears in the EventLog overlay using the same styling as other entries'
    state_changes:
      - field: GenesisSimState.narratedEpochCount
        effect: 'incremented by 1 each time an epoch fires its narration callback; tracks how many epochs have been narrated'
      - field: GameState.onGenesisEpochStart
        effect: 'engine-side callback, set by useGameEngine to the GameScreen addEvent handler; invoked once per epoch transition with (commentary, epochIndex)'
    determinism: deterministic

  - id: genesis-narration-skip-flush
    description: >
      When `completeGenesis` is invoked before all epochs have fired
      their narration (skip-key during play, `?skipGenesis=true` URL
      param, test path that omits ticking), it flushes narration for
      every remaining unfired epoch in epoch order before the
      crossfade begins. After the flush, `narratedEpochCount` equals
      `GENESIS_EPOCHS.length` and no further narration entries are
      added. The flush calls `state.onGenesisEpochStart` synchronously,
      so when the GameScreen renders post-skip, all 14 entries are
      already in the log buffer in chronological order.
    inputs:
      - 'completeGenesis called with sim.narratedEpochCount < GENESIS_EPOCHS.length'
    outputs:
      - 'one onGenesisEpochStart invocation per unfired epoch, in order'
      - 'log buffer contains exactly 14 narration entries after the flush'
    state_changes:
      - field: GenesisSimState.narratedEpochCount
        effect: 'set to GENESIS_EPOCHS.length after the flush completes'
    determinism: deterministic

  - id: action-bar-anchored-bottom-center-gap
    description: >
      ActionBar and CommandPanel are anchored at the bottom of the
      viewport, horizontally centered within the gap between the
      EventLog overlay (lower-left, `left-2 w-96` → right edge at
      ~392px from the viewport's left) and the right Sidebar
      (`right-0 w-48` → left edge at viewport-192px). Achieved with
      `fixed bottom-2 left-1/2 ml-[100px] -translate-x-1/2` — the
      100px ml-offset shifts the centered element rightward by half
      the difference between EventLog's left-side occupancy (392px)
      and Sidebar's right-side occupancy (192px), placing the slots
      at the visual center of the available horizontal gap. Both
      ActionBar and CommandPanel use identical anchors so swapping
      between them (selection-conditional in GameScreen) does not
      shift position. The 4 slots render in a single horizontal row
      at 36px each (total width ~156px). Both components null
      `state.cursorScreenPos` and `state.cursorTile` on hover so
      mousing over them does not leave stale cursor tile info in the
      sidebar.
    inputs:
      - 'GameScreen renders ActionBar (no selection) or CommandPanel (selection active)'
      - 'mouse enters or moves over the ActionBar / CommandPanel'
    outputs:
      - 'ActionBar / CommandPanel rendered at bottom-center, offset to sit between EventLog and Sidebar'
      - '4 slots rendered horizontally at 36px each, total width ~156px'
      - 'state.cursorScreenPos / cursorTile nulled while hovered'
      - 'ActionBar and CommandPanel use identical position'
    state_changes:
      - field: cursorScreenPos
        effect: 'nulled by ActionBar / CommandPanel mouse handler while hovered'
      - field: cursorTile
        effect: 'nulled by ActionBar / CommandPanel mouse handler while hovered'
    determinism: deterministic

  - id: log-newest-at-bottom
    description: >
      Entries render in chronological order with the newest entry at the
      bottom (terminal-style). New events appear at the bottom of the
      visible area; older entries sit above. This reverses the previous
      sidebar ordering. The 50-entry cap in useEventLog is preserved;
      the oldest entry is dropped when the cap is exceeded.
    inputs:
      - 'addEvent called with new GameEvent'
    outputs:
      - 'new entry appears at the bottom of the EventLog overlay'
      - 'older entries appear above; dropped from the top once cap is exceeded'
    state_changes: []
    determinism: deterministic

  - id: log-position-based-fade
    description: >
      Each entry's opacity is a function of its visual position within
      the log buffer. The bottom-most entry renders at 100% opacity.
      Opacity decreases monotonically toward the top of the visible
      area. Entries near the top of the buffer fade toward 0%. Fade is
      purely position-based — it does not depend on the entry's age, so
      idle messages persist at full opacity at the bottom until pushed
      up by newer events. The exact fade curve is implementation-defined
      but must be visually smooth (e.g., linear or eased gradient over
      the visible buffer).
    inputs:
      - 'EventLog rendered with N entries'
    outputs:
      - 'bottom entry renders at full opacity'
      - 'opacity decreases with index from bottom'
    state_changes: []
    determinism: deterministic

  - id: log-scrollable-with-wheel
    description: >
      The overlay container is scrollable. The wheel event over the
      overlay scrolls through the log buffer (up to the 50-entry cap)
      rather than falling through to underlying canvas handlers.
      Pointer-events on the container are auto so wheel and click
      events are captured. Default scroll position pins to the bottom
      so newest entries are always visible after a new event arrives,
      unless the user has actively scrolled away from the bottom — in
      which case the scroll position is preserved while a stuck-to-
      bottom flag is held false. The flag flips back to true (resuming
      auto-pin) when EITHER the user scrolls all the way back to the
      bottom (within 4px of the bottom) OR the cursor leaves the
      EventLog overlay (mouseleave). On mouseleave-resume, the scroll
      position is also snapped to the bottom so the newest entry is
      visible the next time the user looks at the log.
    inputs:
      - 'wheel event over EventLog overlay'
      - 'new event added via addEvent'
      - 'cursor leaves the EventLog overlay (mouseleave)'
    outputs:
      - 'overlay scroll position changes; underlying canvas does not receive the wheel event'
      - 'scroll auto-pins to bottom when stuck-to-bottom flag is true; preserved otherwise'
      - 'mouseleave or scroll-to-bottom resumes auto-pin and snaps to the newest entry'
    state_changes: []
    determinism: deterministic

  - id: log-unread-indicator-while-paused
    description: >
      While the stuck-to-bottom flag is false (user has scrolled away
      from the bottom and cursor is still over the log), every new
      event added to the log increments an unread counter local to
      the EventLog component. The component renders a small "N new
      events" indicator overlaid at the bottom-right corner of the
      scroll area when the counter is greater than zero. Clicking
      the indicator scrolls the container to the bottom, sets the
      stuck-to-bottom flag to true, and resets the counter to zero.
      The counter also resets to zero when auto-pin resumes through
      either path (scroll-to-bottom or mouseleave). The indicator
      uses the same font-mono / text-xs visual language as the log
      entries and lives inside the same hover-suppression region as
      the log so cursor info does not light up world tiles under it.
    inputs:
      - 'new event added via addEvent while stuck-to-bottom flag is false'
      - 'click on the unread indicator'
      - 'auto-pin resumes via scroll-to-bottom or mouseleave'
    outputs:
      - 'indicator rendered at bottom of log when counter > 0, hidden when counter === 0'
      - 'click on indicator scrolls to bottom, resumes auto-pin, resets counter'
      - 'auto-pin resume resets counter to zero'
    state_changes: []
    determinism: deterministic

  - id: log-new-entry-flash
    description: >
      When a new entry is appended to the log, its row briefly flashes
      with a subtle white background and fades back to transparent over
      ~600ms. The flash is per-entry: each new row gets its own
      independent fade timer, so bursts of events produce parallel
      fades (entries do not share a single panel-wide flash). The fade
      is implemented in CSS via a one-shot animation keyed to the
      entry's id so re-renders during the fade window do not re-trigger
      it. Once the animation completes the row settles at the normal
      transparent (event log) background. The flash is purely visual —
      it does not affect opacity (which remains governed by
      log-position-based-fade), scroll position, the unread counter, or
      any game state. Pre-existing entries already in the log when the
      component first mounts do NOT flash; only entries appended after
      mount flash.
    inputs:
      - 'addEvent appends a new GameEvent to the log'
    outputs:
      - 'the new entry row renders with a brief background flash that fades to transparent over ~600ms'
      - 'each new entry has its own independent fade timer'
      - 'entries present at component mount do not flash'
    state_changes: []
    determinism: time-based

  - id: log-hover-clears-cursor-info
    description: >
      While the cursor is over the EventLog overlay, the overlay's
      mouse handler nulls state.cursorScreenPos and state.cursorTile
      so the sidebar cursor info panel does not light up world tiles
      under the log. When the cursor leaves the overlay, the next
      canvas mousemove restores cursorScreenPos and the cursor info
      panel resumes normally.
    inputs:
      - 'mouse enters EventLog overlay bounds'
      - 'mouse leaves EventLog overlay bounds'
    outputs:
      - 'state.cursorScreenPos / cursorTile set to null while hovered'
      - 'cursor info resumes on next canvas mousemove after leaving'
    state_changes:
      - field: cursorScreenPos
        effect: 'nulled by overlay mouse handler so cursor info does not show tiles under the log'
      - field: cursorTile
        effect: 'nulled by overlay mouse handler'
    determinism: deterministic

edge_cases:
  - id: pickup-event-no-floating-popup
    description: 'player walks over a ground item; a pickup event is recorded'
    expected: 'log entry appears in the EventLog overlay; no floating popup is rendered above the player'
  - id: dialog-event-no-floating-popup
    description: 'player advances dialog with a character'
    expected: 'log entry recorded if applicable; no floating popup'
  - id: log-empty
    description: 'event log has zero entries'
    expected: 'overlay container is not rendered (or renders empty); no visual artifact in lower-left'
  - id: genesis-played-fully
    description: 'player watches all 14 genesis epochs play out without skipping'
    expected: 'log accumulates 14 narration entries one at a time, oldest at top of visible buffer; live gameplay events appended below afterward'
  - id: genesis-skipped-via-key
    description: 'player presses any key during genesis to fast-forward; one or more epochs were already narrated live'
    expected: 'completeGenesis flushes only the unfired narration entries in order; no epoch is duplicated; final log contains exactly 14 narration entries'
  - id: genesis-skipped-via-url
    description: 'player loads `?skipGenesis=true`; completeGenesis runs before any epoch ticks'
    expected: 'all 14 narration entries are present in the log when GameScreen first paints; ordered oldest at top, newest at bottom'
  - id: live-event-after-narration
    description: 'a pickup, drop, combine, dialog, or discovery event fires after genesis ends'
    expected: 'event is appended at the bottom of the log, below all narration entries; auto-pin behavior unchanged'
  - id: log-single-entry
    description: 'event log has exactly one entry'
    expected: 'single entry renders at full opacity at the bottom; no fade visible'
  - id: log-overflow
    description: 'event log has more entries than the visible area'
    expected: 'top entries clip behind the fade; user can wheel-scroll to view earlier entries'
  - id: log-at-cap
    description: 'event log is at the 50-entry cap and a new event arrives'
    expected: 'oldest entry dropped from top; new entry appears at bottom; auto-scroll keeps bottom in view'
  - id: cursor-leaves-overlay
    description: 'cursor moves off the log overlay into the canvas'
    expected: 'next canvas mousemove restores state.cursorScreenPos; sidebar cursor info resumes'
  - id: log-and-action-bar-no-collision
    description: 'ActionBar sits at bottom-center between EventLog (lower-left) and Sidebar (right); 100px ml-offset places it at the visual center of the gap'
    expected: 'no visual collision; the action bar slots occupy the empty horizontal strip between the EventLog and the Sidebar at the bottom of the viewport'
  - id: command-panel-replaces-action-bar
    description: 'Selection becomes active; GameScreen swaps ActionBar for CommandPanel at the same bottom-center anchor'
    expected: 'CommandPanel uses the same `fixed bottom-2 left-1/2 ml-[100px] -translate-x-1/2` anchor as ActionBar; the panel does not jump when selection toggles'
  - id: action-bar-hover-clears-cursor-info
    description: 'Cursor on the canvas moves onto the action bar at the bottom'
    expected: 'ActionBar / CommandPanel mouse handler nulls state.cursorScreenPos / cursorTile so the sidebar cursor info does not show tiles under the panel'
  - id: log-mouseleave-resumes-autoscroll
    description: 'user has scrolled up in the log; cursor leaves the log overlay'
    expected: 'on mouseleave, stuck-to-bottom flag is set true, the scroll container is snapped to the bottom, and the unread counter is reset to zero; the next new event auto-pins as normal'
  - id: log-scroll-to-bottom-resumes-autoscroll
    description: 'user has scrolled up in the log; user scrolls back down within 4px of the bottom while cursor is still over the log'
    expected: 'stuck-to-bottom flag flips to true on the scroll handler; unread counter is reset to zero; subsequent new events auto-pin as normal'
  - id: new-entry-flashes-on-arrival
    description: 'a new event is appended to a log that already contains entries'
    expected: 'the newly-appended row renders with a brief flash background and fades to transparent over ~600ms; previously-present rows do not flash'
  - id: burst-events-flash-independently
    description: 'multiple events arrive in quick succession (e.g. chain meteorite explosions)'
    expected: 'each new row flashes on its own timer; overlapping fades render in parallel without re-triggering already-fading rows'
  - id: mounted-entries-do-not-flash
    description: 'EventLog mounts with one or more entries already present in the log (e.g. genesis narration after skip)'
    expected: 'pre-existing rows render at their settled (transparent) background; no flash is triggered for them'

  - id: log-unread-counter-displays-while-paused
    description: 'user has scrolled up in the log; new events arrive while the cursor is still over the log'
    expected: 'unread counter increments per new event; "N new events" indicator renders at the bottom of the scroll area; clicking the indicator scrolls to bottom, resumes auto-pin, and resets the counter'

failure_conditions:
  - trigger: 'rapid events flood the log (e.g. chain meteorite explosions)'
    expected: 'all events rendered; auto-scroll keeps the newest visible; no layout thrashing'
  - trigger: 'wheel over the log overlay falls through to underlying canvas handlers'
    expected: 'overlay must capture the wheel event; canvas must not respond'
  - trigger: 'sidebar still renders a Log section after this change'
    expected: 'Sidebar must not contain a SectionHeader Log block; spec violated otherwise'
  - trigger: 'genesis runs to completion without producing 14 narration entries in the log'
    expected: 'every epoch must fire exactly one narration entry between tick start and completeGenesis; spec violated otherwise'
  - trigger: 'a single epoch fires more than one narration entry (e.g. tick + skip both flush it)'
    expected: 'narratedEpochCount must guard against double-firing; spec violated otherwise'
  - trigger: 'sidebar still renders the genesis commentary <p> during genesis'
    expected: 'genesis commentary must move to the event log; sidebar HUD shows year and epoch progress only'
  - trigger: 'PickupToasts component or any floating-toast surface still mounts in GameScreen'
    expected: 'no toast component exists; only the EventLog overlay surfaces game events'
  - trigger: 'useEventLog still exposes a `toasts` field or runs an rAF tick to expire toasts'
    expected: 'useEventLog returns { log, addEvent } only; no toast lifecycle code remains'
  - trigger: 'GameState still defines `queuedToasts` / `QueuedToast`'
    expected: 'field is renamed to `queuedEvents` / `QueuedEvent`; serialization schema allowlist matches'
  - trigger: 'new entries do not flash on append, or pre-existing entries flash on mount'
    expected: 'every newly-appended row must run the flash animation exactly once; mounted entries must not animate; spec violated otherwise'
  - trigger: 'flash animation re-triggers on unrelated re-renders (e.g. scroll, hover state changes)'
    expected: 'animation is keyed to the entry id so the same DOM node does not restart its keyframes mid-fade; spec violated otherwise'

verification:
  test_file: src/components/__tests__/EventLog.test.tsx
  test_pattern: 'EventLog'
  command: 'npx vitest run src/components/__tests__/EventLog.test.tsx src/components/__tests__/Sidebar.test.tsx'
