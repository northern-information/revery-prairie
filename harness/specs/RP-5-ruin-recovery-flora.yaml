id: RP-5-ruin-recovery-flora
name: 'RP-5 — Ruin recovery delivers first non-clover species'
priority: medium
layer: integration
source_files:
  - docs/backlog-thinktank-v3.md
  - docs/backlog.yaml
  - CLAUDE.md
  - src/engine/genesis.ts
  - src/engine/genesis/epochs/13-riseOfCivilizations.ts
  - src/engine/genesisTypes.ts
  - src/engine/items.ts
  - src/engine/manual.ts
  - src/engine/ruins.ts
  - src/engine/state.ts
dependencies:
  - RP-1-multi-species-flora

# Amended 2026-06-05: the +2 Wildflower / TallGrass starter ruins this
# spec originally introduced are dropped from the starter pool. The
# RuinRole enum values, the seed item definitions, the manual entries,
# and the RP-11 planting machinery all remain in place as dormant
# infrastructure — only the placement-layer wiring is removed. Seeds
# are unobtainable through normal play until reintroduced (RP-73).

behaviors:
  - id: ruin-role-enum-retains-flora-species
    description: >
      The RuinRole enum in genesisTypes.ts continues to define five
      values: Clover, Bee, Coyote, Wildflower, TallGrass. The
      Wildflower and TallGrass values are retained as dormant — no
      starter-mode ruin is assigned either role — so the seed item
      machinery, RP-11 planting code, and manual entries can keep
      compiling without conditional removal. Complex-mode ruin
      generation (future spec) is the eventual reintroduction
      surface.
    inputs:
      - 'codebase after RP-5 is amended'
    outputs:
      - 'RuinRole has five values: Clover, Bee, Coyote, Wildflower, TallGrass'
      - 'no starter ruin carries Wildflower or TallGrass'
    state_changes: []
    determinism: deterministic

  - id: starter-mode-spawns-three-ruins
    description: >
      Genesis starter ruin generation produces 3 ruins, not 5. The
      STARTER_ROLES array in src/engine/genesis/epochs/13-riseOfCivilizations.ts
      is [Clover, Bee, Coyote] — the original main-quest cast.
      numRuins for starter and complex modes is 3 (complex mode
      currently delegates to starter per the existing comment).
    inputs:
      - 'genesis pipeline runs in Starter ruin generation mode'
    outputs:
      - 'sim.ruins.length === 3 (or fewer if candidate placement fails repeatedly)'
      - 'ruin roles assigned in order [Clover, Bee, Coyote]'
    state_changes:
      - field: civilizationRuins
        effect: 'array has up to 3 entries with the main-quest role ordering'
    determinism: deterministic

  - id: wildflower-seed-item-retained
    description: >
      ITEM_DEFINITIONS keeps the 'wildflowerSeeds' entry — a 1x1
      Flora-category collectible with glyph '*' and color #D85FB7
      matching the wildflower species. Drop-on-dirt planting (RP-11)
      continues to apply if a player obtains the item through
      future mechanics. The item is not vault-delivered in starter
      mode; it stays as latent machinery.
    inputs:
      - 'ITEM_DEFINITIONS registry'
    outputs:
      - "ITEM_DEFINITIONS['wildflowerSeeds'] is defined"
    state_changes: []
    determinism: deterministic

  - id: tall-grass-seed-item-retained
    description: >
      Mirror of wildflower-seed-item-retained for 'tallGrassSeeds':
      1x1 Flora collectible with glyph '"' and color #A89968. Latent
      machinery — not vault-delivered in starter mode.
    inputs:
      - 'ITEM_DEFINITIONS registry'
    outputs:
      - "ITEM_DEFINITIONS['tallGrassSeeds'] is defined"
    state_changes: []
    determinism: deterministic

  - id: dormant-garden-seed-spawn-removed
    description: >
      spawnDormantGardenSeeds in ruins.ts no longer contains the
      Wildflower / TallGrass branch. The function handles only the
      main-quest roles: Clover (spawns clover at vault slot 0), Bee
      (spawns bee), and Coyote (spawns the coyote past the
      collapseBarrier). All RuinRole-to-payload mappings for
      Wildflower and TallGrass are deleted. The decay-timer slots
      stay registered so a future complex-mode generator can
      repopulate them.
    inputs:
      - 'player enters a ruin and triggers vault seed spawn'
    outputs:
      - 'only Clover / Bee / Coyote roles produce a vault payload'
      - 'no wildflowerSeeds or tallGrassSeeds ground items are spawned by starter ruins'
    state_changes:
      - field: world
        effect: 'ground-item entities only for the three main-quest roles'
    determinism: deterministic

  - id: seed-item-manual-entries-retained
    description: >
      The wildflowerSeeds and tallGrassSeeds items keep their
      auto-generated manual entries from buildItemEntries (they
      remain absent from MANUAL_HIDDEN_ITEM_IDS). Discovery is
      gated by acquisition as today — players cannot acquire them
      in starter mode, so the entries remain in undiscovered state
      for normal play.
    inputs:
      - 'manual UI opens'
    outputs:
      - "manual entry 'item:wildflowerSeeds' exists with category Life"
      - "manual entry 'item:tallGrassSeeds' exists with category Life"
    state_changes: []
    determinism: deterministic

  - id: existing-main-quest-recovery-path-preserved
    description: >
      The Clover, Bee, and Coyote role payloads in
      spawnDormantGardenSeeds are unchanged from RP-5's original
      shape. The bee + clover recipe and the Gron main quest
      continue to operate identically.
    inputs:
      - 'player enters a Clover / Bee / Coyote-role ruin'
    outputs:
      - 'existing payload behavior unchanged'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: ruin-placement-failure
    description: >
      Genesis ruin placement aborts before reaching 3 ruins due to
      the candidate-cluster minimum-distance check failing more
      than 50 times in a row.
    expected: >
      The placement loop bails as it does today. Fewer than 3
      ruins exist; STARTER_ROLES indexes safely. Main-quest gating
      degrades gracefully — no crash.

  - id: same-seed-determinism
    description: >
      Two calls to createGameState with the same steward name
      produce identical ruin layouts.
    expected: >
      Same number of ruins per role, same positions, same vault
      payloads byte-for-byte.

failure_conditions:
  - trigger: 'STARTER_ROLES in src/engine/genesis/epochs/13-riseOfCivilizations.ts contains RuinRole.Wildflower or RuinRole.TallGrass'
    expected: 'CI fails — the seed-delivery roles bled back into the starter rotation'
  - trigger: 'A new game produces any wildflowerSeeds or tallGrassSeeds ground item from a starter-mode ruin vault'
    expected: 'CI fails — vault payload still emits seed-delivery items'
  - trigger: "ITEM_DEFINITIONS['wildflowerSeeds'] or ITEM_DEFINITIONS['tallGrassSeeds'] is undefined"
    expected: 'CI fails — dormant seed items must remain defined for the RP-11 planting machinery'
  - trigger: 'spawnDormantGardenSeeds contains a branch checking RuinRole.Wildflower or RuinRole.TallGrass'
    expected: 'CI fails — vault-spawn code still references the dropped roles'

verification:
  test_file: src/engine/__tests__/ruin-dormant-garden.test.ts
  test_pattern: 'spawns'
  command: 'npx vitest run src/engine/__tests__/ruin-dormant-garden.test.ts -t spawns'
