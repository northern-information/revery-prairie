id: renderer
name: 'Canvas renderer'
priority: high
layer: engine
source_files:
  - src/engine/renderer.ts
  - src/engine/render/passes.ts
  - src/engine/render/passes/index.ts
  - src/engine/render/cacheContract.ts
  - src/engine/render/haloCache.ts
  - src/engine/render/tierGrid.ts
  - src/engine/constants.ts
  - src/engine/types.ts
  - src/engine/deepTime.ts
  - src/engine/tileBg.ts
  - src/engine/tileBgCache.ts
  - src/engine/map.ts
dependencies:
  - camera-viewport
  - player-movement

behaviors:
  - id: pass-registry
    description: >
      the render frame is composed of named passes registered into an
      ordered slot enum: bg-cache, world-overlay, tile-glyph, entity,
      effect, screen-overlay. each pass is a small module exporting a
      draw function with the signature (ctx, state, metrics, time) =>
      void plus metadata (id, slot, isActive(state) predicate) and
      registers itself at module load. renderer.ts calls
      runPassesInSlot(slot, ...) at the slot's documented position in
      the main-render-loop ordering — passes layer in slot order,
      inactive passes short-circuit in O(1).

      adding a new bg-cache, world-overlay, effect, or screen-overlay
      concern means adding one pass file under
      src/engine/render/passes/ and exporting it from
      src/engine/render/passes/index.ts (the side-effect import in
      renderer.ts triggers registration). renderer.ts is not edited.

      the tile-glyph slot and the entity slot are intentionally
      reserved but unpopulated. the central tile loop in renderer.ts
      (terrain glyphs, clover lifecycle, fog of war, glints, cursor
      inversion, ponds/rivers, plus the populate-then-consume pattern
      that feeds it from ECS for items, bees, characters, etc.) is the
      tile-glyph slot — splitting it into separate pass files would
      either duplicate the precedence chain across passes or force a
      shared frameState abstraction whose only purpose is to enable
      the file split. the inline central loop is the documented end
      state. passes can still be added to tile-glyph or entity later
      if a clear z-ordered layer warrants it.
    inputs:
      - 'CanvasRenderingContext2D, GameState, CharMetrics, timestamp'
    outputs:
      - 'each active pass draws in registry order; inactive passes are skipped'
    state_changes: []
    determinism: deterministic

  - id: cache-contract
    description: >
      every cached layer (tile-bg cache, halo cache, tier grid, and any
      future layer cache) declares its invalidation triggers in a
      single place: src/engine/render/cacheContract.ts. each cache
      entry exports the set of state fields or events that mark it
      dirty (e.g. tile-bg cache invalidates on setMapTile and
      invalidateMapCache; halo cache invalidates on player position
      change, prairie boundary mutation, and active revery change;
      tier grid invalidates only on elevation Map reference change).
      the contract module is the single source of truth — passes
      consult it to decide whether to rebuild before drawing, and
      mutation sites consult it to know which caches to mark dirty.
      this replaces the current ad-hoc mix of WeakMap reference
      identity, dirty Sets, and per-frame full rebuilds scattered
      across modules.
    inputs:
      - 'mutation events from setMapTile, player movement, revery activation, etc.'
    outputs:
      - 'caches marked dirty according to declared triggers; passes rebuild only when their cache is dirty'
    state_changes:
      - field: 'cache dirty flags (per-cache, module-internal)'
        effect: 'set by mutation sites per the contract; cleared by the owning pass on rebuild'
    determinism: deterministic

  - id: halo-cache
    description: >
      the prairie halo offscreen canvas is treated as a cached layer
      under the cache-contract. it is rebuilt only when its declared
      triggers fire (player position change, prairie boundary mutation,
      active revery range change, viewport resize) — not every frame.
      between rebuilds, the renderer drawImage's the cached halo
      canvas at the current camera offset. the single per-frame blur
      filter is applied to the cached canvas at build time, so the
      composite step is just a drawImage. lives in
      src/engine/render/haloCache.ts.
    inputs:
      - 'player position, prairie boundary, active revery, viewport size'
    outputs:
      - 'halo canvas rebuilt only on trigger; composited via drawImage every frame'
    state_changes:
      - field: 'haloCache (module-internal, mirrors tileBgCache pattern)'
        effect: 'rebuilt when contract-declared triggers fire'
    determinism: deterministic

  - id: measure-char
    description: >
      measureChar(ctx, zoom?) measures the monospace character cell
      dimensions (charWidth, charHeight) at the current font size
      and zoom level. returns a CharMetrics object used by all
      rendering and coordinate transforms. font size is
      BASE_FONT_SIZE * zoom.
    inputs:
      - 'CanvasRenderingContext2D, optional zoom multiplier'
    outputs:
      - 'CharMetrics { charWidth, charHeight }'
    state_changes: []
    determinism: deterministic

  - id: main-render-loop
    description: >
      render(ctx, state, metrics, time) is the main draw call,
      invoked each requestAnimationFrame. it interleaves
      runPassesInSlot(slot, ...) calls with the inline tile-glyph
      central loop, in this order:

        1. clear canvas, set up font and world transform
        2. runPassesInSlot('bg-cache', ...)  — tile-bg + cube edges
        3. fog of war computation (cached on visibility.ts so the
           fog mask pass and the central tile loop share one set)
        4. runPassesInSlot('world-overlay', ...) — earth scan, ruin
           entrance halo, lightning targeting range, angel gold aura,
           prairie halo cache composite, prairie outline, fog mask
           (last; covers cached bg + every overlay above for fog zones)
        5. populate per-frame ECS-derived collections (bees,
           characters, items, shooting stars, meteorites, lightning
           bolts, explosions, wildfire, pickup bloom, revery cast,
           crumble, etc.) into module-level Maps
        6. central tile loop: iterates the visible viewport and
           resolves each tile's char/color via a precedence chain
           (cursor > preview > effect > entity > ground item >
           terrain glyph). uses a two-phase resolve-then-draw pattern
           so cursor inversion (pink fillRect + dark glyph) applies
           correctly. handles clover lifecycle staging, glints, fog
           dimming, ponds, rivers, twinkling space stars, drop-target
           previews, and deep time crossfade for the player glyph.
        7. smooth-movement post-pass — draws tweening ECS entities
           at fractional pixel positions
        8. runPassesInSlot('effect', ...) — rain aura, revery rain,
           weather rain, glint sparkle, glint beam, deep time burning
        9. restore world transform
       10. runPassesInSlot('screen-overlay', ...) — lightning flash,
           angel flash, RTS selection box, move-order markers, edge
           scroll indicator, off-screen player arrow

      the tile-glyph slot and entity slot are intentionally
      unpopulated in the registry — their work happens in steps 4–7
      inline. see pass-registry behavior for the rationale.

      during genesisTransition, entities not visible in genesis
      render at transitionAlpha (0→1 over duration) via globalAlpha,
      handled in the central tile loop. the player glyph uses the
      deep time ghost glyph when active and crossfades from ö to @
      via complementary globalAlpha during deepTimeTransition. entity
      glyphs (player, bees, ghosts, characters, ground items, etc.)
      overlay the tile bg without recoloring it — items on the
      ground inherit the tile bg of whatever surface they sit on.
    inputs:
      - 'CanvasRenderingContext2D, GameState, CharMetrics, timestamp'
    outputs:
      - 'full frame drawn to canvas'
    state_changes: []
    determinism: deterministic

  - id: tile-background-pre-pass
    description: >
      before any glyphs render, every visible non-space tile gets its
      surface bg color and its iso south/east cube-edge stroke painted.
      the bg color is picked from TILE_BG_PALETTES[tile.type] via
      tileHash(mx, my) % palette.length so each tile has stable
      pseudorandom variation across frames (no flicker). each palette
      is a small set of colors darker than the corresponding TILE_COLORS
      glyph color for that surface, giving dirt a brown/grey gradation,
      clover a green gradation, sand a brown gradation, burnt clover a
      charcoal gradation, cave floor / wall / breakable wall / entrance
      varied dark stone tones, and ruin tiles their own muted palettes.
      the south/east cube edges are drawn with a darkened variant of
      the same color (darkenColor(getTileBgColor(type, x, y),
      WALL_RIGHT_SHADE)) to give every tile its iso elevation skirt.
      space tiles are excluded — they keep the canvas BG_COLOR plus
      the existing twinkling-stars rendering. items and entity glyphs
      render on top without painting their own background, so a
      dropped item on a clover tile still shows the clover bg behind
      the item glyph. the bg fill is the diamond footprint via
      drawCellBackground. the per-frame work is delivered via the
      tile-background-cache behavior — both the bg fillRect and the
      cube-edge stroke are baked into a per-map offscreen canvas, then
      drawImage'd in viewport-aligned slices each frame.
    inputs:
      - 'visible viewport tiles, tile.type for each, tileHash(x, y)'
      - 'cached offscreen canvas keyed by state.map ref'
    outputs:
      - 'every non-space tile painted with its surface bg color and cube-edge stroke before any other draws'
    state_changes: []
    determinism: deterministic

  - id: tile-background-cache
    description: >
      the static tile-bg fill plus south/east cube-edge stroke for the
      current map are baked into an offscreen canvas keyed by the map
      array reference (WeakMap<TileGrid, CacheEntry>). the cache canvas
      is sized to the full map's iso bounding box (world-space, not
      viewport-space) so that camera movement does not invalidate the
      cache. on first paint of a map, getOrBuildCache(state, map)
      lazily allocates the offscreen canvas (OffscreenCanvas when
      available, falling back to HTMLCanvasElement) and paints every
      non-space tile's bg fill and cube-edge stroke into it. on each
      subsequent frame, flushDirtyTiles(state, map) repaints any tiles
      in the per-map dirty Set<string> (keys 'x,y') by re-running the
      same bg fill + edge stroke at world-space coordinates, then the
      renderer drawImage's the camera-aligned slice into the main
      canvas. this single drawImage call replaces both the per-frame
      tile-bg fillRect loop and the cube-edge stroke loop. mutation
      contract: setMapTile(state, x, y, tile) is the only sanctioned
      way to write state.map[y][x]; it performs the assignment and
      calls markTileDirty(map, x, y) so the tile is repainted on the
      next flush. invalidateMapCache(map) drops the cache entry and
      forces a full rebuild on next paint; called whenever every tile
      in a map needs to be reconsidered (e.g. caveRevealed flipping
      true masks/unmasks the entire hidden chamber). overworld, cave,
      and each ruin interior get their own cache entries automatically
      because they each have their own map array reference — no zone
      branching is required. elevation tiers are frozen at genesis,
      so the cube-edge stroke does not need elevation-change
      invalidation.
    inputs:
      - 'state.map (TileGrid reference)'
      - 'mutations via setMapTile(state, x, y, tile)'
      - 'invalidateMapCache(map) on whole-map invalidation events'
    outputs:
      - 'offscreen canvas per map, drawImage''d once per frame for the camera-aligned slice'
      - 'dirty tiles repainted before drawImage so cache stays consistent with state.map'
    state_changes:
      - field: 'tileBgCache (module-internal WeakMap)'
        effect: 'lazily populated on first getOrBuildCache call per map; entry holds offscreen canvas + dirty Set<string>'
      - field: 'tileBgCache entry dirty set'
        effect: 'markTileDirty adds key, flushDirtyTiles drains the set, invalidateMapCache deletes the whole entry'
    determinism: deterministic

  - id: cursor-inversion
    description: >
      tiles under the cursor that are cursorable get inverted
      rendering: pink fillRect background with dark BG_COLOR text.
      this is applied as a final pass after resolving each tile's
      char and color, not during the resolve phase.
    inputs:
      - 'state.cursorTile matching a cursorable tile'
    outputs:
      - 'inverted pink/dark rendering at cursor position'
    state_changes: []
    determinism: deterministic

  - id: earth-scan-pre-pass
    description: >
      when an earth scan revery is active, a pre-pass draws
      earthScanBgMap fillRect calls before the main glyph loop and
      AFTER the tile-background pre-pass — so scan colors paint
      opaque on top of the surface bg, not under it. this prevents
      south-row scan backgrounds from clipping north-row glyphs. the
      scan radiates from the player with expand, hold, and fade
      phases controlled by time constants. fade-out blends toward
      the underlying tile bg color (not BG_COLOR) so the surface
      shows through naturally as the scan dissipates.
    inputs:
      - 'active earth scan revery with earthScanBgMap'
    outputs:
      - 'colored background tiles showing soil health gradient, opaque over surface bg'
    state_changes: []
    determinism: time-based

  - id: cave-masking
    description: >
      when caveRevealed is false, tiles in caveHiddenPositions
      render as CaveWall regardless of their actual type. this
      hides the secret chamber and Moab behind the breakable wall.
    inputs:
      - 'caveRevealed false, tile position in caveHiddenPositions'
    outputs:
      - 'CaveWall char and color rendered instead of actual tile'
    state_changes: []
    determinism: deterministic

  - id: glinting-zone-rendering
    description: >
      tiles in state.glintZones render with an animated sparkle
      overlay. a subset of zone tiles (controlled by GLINT_ZONE_DENSITY)
      show sparkle characters from GLINT_ZONE_CHARS in gold tones,
      animated with GLINT_ZONE_SPEED. only renders on walkable
      overworld tiles.
    inputs:
      - 'state.glintZones set, current time for animation'
    outputs:
      - 'sparkle chars overlaid on zone tiles'
    state_changes: []
    determinism: time-based

  - id: deep-time-ghost-glyph
    description: >
      when state.deepTime is active, the player glyph is rendered
      using state.deepTime.playerGlyph (the ghost glyph, currently
      set to the character o-diaeresis) and state.deepTime.playerGlyphColor
      instead of the normal PLAYER_CHAR and PLAYER_COLOR constants.
      during deepTimeTransition, crossfades from o-diaeresis (white)
      to @ (white) via complementary globalAlpha over
      DEEP_TIME_TRANSITION_GLYPH_DURATION_MS (800ms): the old glyph
      renders at (1 - t) alpha and the new glyph renders at t alpha,
      where t is elapsed / 800ms clamped to [0, 1].
    inputs:
      - 'state.deepTime.active is true'
      - 'state.deepTimeTransition with startTime (for crossfade phase)'
    outputs:
      - 'player rendered with ghost glyph and color'
      - 'during deepTimeTransition, old glyph fades out and new glyph fades in over 800ms'
    state_changes: []
    determinism: time-based

  - id: deep-time-burning-overlay
    description: >
      during DeepTimePhase.Burning, animated fire characters render
      on BurntClover tiles across the viewport. sparse rendering
      (every 3rd tile via hash) with fire characters (^, ~, *) in
      orange tones (#FF4500 to #FFAA00), animated by time. drawn as
      a post-pass overlay after the main tile/entity rendering.
    inputs:
      - 'state.deepTime.active is true, phase is Burning'
    outputs:
      - 'animated fire overlay on BurntClover tiles'
    state_changes: []
    determinism: time-based

  - id: deep-time-year-counter
    description: >
      during DeepTimePhase.Simulating, the deep time year counter
      is rendered in the Sidebar React component (Sidebar.tsx), not
      in the canvas renderer. the renderer previously owned this
      but it was moved to the UI layer.
    inputs:
      - 'state.deepTime.active is true, phase is Simulating'
    outputs:
      - 'year counter displayed in the sidebar UI'
    state_changes: []
    determinism: deterministic

  - id: rain-aura-overlay
    description: >
      animated rain characters render near entities with rain aura
      ECS components (e.g. water revery effect tiles). drawn as a
      post-pass overlay after the main tile rendering.
    inputs:
      - 'entities with rain aura components, current time'
    outputs:
      - 'animated rain overlay near aura entities'
    state_changes: []
    determinism: time-based

  - id: angel-aura-background
    description: >
      oscillating gold background renders within ANGEL_AURA_RADIUS
      of angel entities. drawn as a pre-pass before the main glyph
      loop and AFTER the tile-background pre-pass, so the gold aura
      paints opaque on top of the surface bg. entire angel body
      group gets pink highlight when cursor or facing is on any tile
      of the group.
    inputs:
      - 'angel entities with Position/MultiPosition, current time'
    outputs:
      - 'gold aura background painted over surface bg around angel tiles'
    state_changes: []
    determinism: time-based

  - id: twinkling-space-stars
    description: >
      space tiles render with twinkling star animation. random star
      characters appear and fade based on a hash of tile position
      and time, creating a starfield effect in the void border.
    inputs:
      - 'space tiles in viewport, current time'
    outputs:
      - 'animated twinkling stars on space tiles'
    state_changes: []
    determinism: time-based

  - id: player-trail-rendering
    description: >
      trail points from state.trail render with decreasing opacity
      based on age. older trail points are more transparent.
    inputs:
      - 'state.trail array with timestamped positions'
    outputs:
      - 'fading trail dots behind the player'
    state_changes: []
    determinism: time-based

  - id: angel-spawn-despawn-flash
    description: >
      a brief screen flash overlay renders when angelFlashTime is
      recent. used to punctuate angel spawn and despawn events.
    inputs:
      - 'state.angelFlashTime within flash duration'
    outputs:
      - 'white screen flash overlay fading out'
    state_changes: []
    determinism: time-based

  - id: weather-rain-overlay
    description: >
      when weather.sky is Rain and the current zone is overworld,
      animated rain characters render across the viewport following
      the rain front. the rain front axis and direction are computed
      from the wind direction. only tiles within the RAIN_FRONT_WIDTH
      band from the current rainFrontOffset are rendered. uses
      WEATHER_RAIN_DENSITY to control sparsity and tileHash with
      rainSeed for per-tile variation. rain characters (|, :, ., ,)
      animate in blue tones.
    inputs:
      - 'state.weather.sky is Rain, zone is overworld, current time for animation'
    outputs:
      - 'animated rain overlay following the sweeping rain front'
    state_changes: []
    determinism: time-based

edge_cases:
  - id: empty-viewport
    description: 'viewport dimensions are 0 (before canvas sizing)'
    expected: 'render draws nothing; no crash from zero-size loops'
  - id: entity-on-hidden-tile
    description: 'entity positioned on a cave hidden tile before reveal'
    expected: 'entity not rendered; hidden tiles mask everything'
  - id: multiple-entities-same-tile
    description: 'bee and ground item on the same tile'
    expected: 'rendering priority determines which glyph shows; later draw phases overwrite earlier ones'
  - id: tile-bg-on-space
    description: 'space tile inside the viewport during the bg pre-pass'
    expected: 'no tile bg painted on space tiles; canvas BG_COLOR shows through and twinkling stars render normally'
  - id: tile-bg-on-cave-hidden
    description: 'cave tile in caveHiddenPositions before caveRevealed'
    expected: 'bg uses the masked CaveWall palette (not the actual hidden-tile palette) so the chamber stays hidden'
  - id: cursor-over-tile-bg
    description: 'cursor on a cursorable tile that has a surface bg'
    expected: 'cursor pink fillRect replaces the tile bg in that tile, glyph renders in dark BG_COLOR; cursor inversion is unchanged'
  - id: tile-bg-during-fog
    description: 'unexplored or partiallyDiscovered fog tile with surface bg'
    expected: 'the fog-bg-mask spec (harness/specs/fog-bg-mask.yaml) governs how the cached tile-bg interacts with fog. unexplored tiles are masked to BG_COLOR (fully hidden); partiallyDiscovered tiles are dimmed to FOG_EXPLORED_BRIGHTNESS so bg and glyph dim together. the mask is a dedicated pass that runs last in the world-overlay slot.'
  - id: dropped-item-on-tile
    description: 'ground item glyph on a clover tile'
    expected: 'clover bg shows under the item glyph; item does not paint its own background'
  - id: tile-bg-cache-multi-ruin
    description: 'overworld + cave + N>1 ruin interiors all visited in a single session'
    expected: 'each map array gets its own WeakMap entry; caches do not collide and survive zone swaps because lookup is keyed by map ref, not by zone id'
  - id: tile-bg-cache-cave-reveal
    description: 'caveRevealed flips from false to true mid-session'
    expected: 'the site that flips the flag also calls invalidateMapCache(state.map) so every previously-masked hidden tile is repainted with its real type on the next frame'
  - id: tile-bg-cache-dpr-resize
    description: 'browser DPR change or viewport resize between frames'
    expected: 'cache survives — it is sized in world iso coordinates, not viewport pixels — and the renderer just changes its drawImage source/destination rect for the new viewport. assumption: per-tile world-space pixel dimensions do not change at runtime.'
  - id: tile-bg-cache-offscreen-fallback
    description: 'OffscreenCanvas constructor unavailable (older Safari, JSDOM, etc.)'
    expected: 'cache module detects and falls back to a detached HTMLCanvasElement with the same 2D context API; rendering path is otherwise identical'
  - id: tile-bg-cache-zone-swap-lazy
    description: 'enterCave / exitCave / enterRuin / exitRuin during play'
    expected: 'zone swap functions do nothing cache-related; the new state.map ref triggers a lazy build on the first drawImage of that frame'
  - id: pass-registry-add-new-pass
    description: 'a new entity type or effect is added to the game'
    expected: 'one new pass file is added to src/engine/render/passes/ and registered in passes.ts; render() is not modified; existing passes are not edited'
  - id: pass-registry-inactive-pass
    description: 'a pass whose isActive(state) returns false (e.g. earth-scan with no active scan)'
    expected: 'pass is skipped in O(1) without reading any tile data or canvas state; no side effects on ctx'
  - id: cache-contract-mutation-without-trigger
    description: 'a mutation site updates state in a way that should invalidate a cached layer but is not declared in cacheContract'
    expected: 'cache goes stale; the contract module is the discoverable single source of truth so the missing trigger is added there, not patched into the mutation site ad-hoc'
  - id: halo-cache-revery-range-change
    description: 'player activates a revery whose range affects the halo'
    expected: 'halo cache is marked dirty per the contract; rebuilt with the blur filter applied once on next frame; subsequent frames composite the cached canvas via drawImage with no blur cost'
  - id: halo-cache-viewport-resize
    description: 'browser viewport resizes mid-session'
    expected: 'halo cache canvas is resized to match new viewport; rebuild fires once; no per-frame regression'

failure_conditions:
  - trigger: 'canvas context lost'
    expected: 'render call fails silently; next frame attempts again'
  - trigger: 'state.map is empty (no tiles)'
    expected: 'tile loops iterate zero times; no crash'
  - trigger: 'raw state.map[y][x] = ... assignment outside setMapTile'
    expected: 'cache goes stale and the affected tile renders as a ghost of its previous type until the cache is invalidated. enforced by code review and convention, not by a runtime check; setMapTile is the single sanctioned mutation API and all 12 known mutation sites must use it.'
  - trigger: 'OffscreenCanvas API unavailable'
    expected: 'tileBgCache falls back to a detached HTMLCanvasElement transparently; no functional regression, slight perf cost from main-thread allocation only'
  - trigger: 'inline draw logic added directly inside render() in renderer.ts instead of as a registered pass'
    expected: 'spec is violated; the registry walk is the only sanctioned drawing path. all draws must live in a pass module under src/engine/render/passes/ and be registered in passes.ts'
  - trigger: 'a cached layer is rebuilt every frame regardless of dirty state'
    expected: 'spec is violated; cacheContract.ts must declare the layer''s invalidation triggers and the owning pass must consult the dirty flag before rebuilding'
  - trigger: 'halo offscreen canvas rebuilt every frame as it does in the pre-refactor renderer'
    expected: 'spec is violated; halo-cache pass must rebuild only when contract triggers fire'

verification:
  test_file: src/engine/__tests__/gameLoop.test.ts
  test_pattern: 'render'
  command: npx vitest run src/engine/__tests__/gameLoop.test.ts
