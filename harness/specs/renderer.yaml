id: renderer
name: 'Canvas renderer'
status: implemented
priority: high
layer: engine
source_files:
  - src/engine/renderer.ts
  - src/engine/constants.ts
  - src/engine/types.ts
  - src/engine/deepTime.ts
dependencies:
  - camera-viewport
  - player-movement

behaviors:
  - id: measure-char
    description: >
      measureChar(ctx, zoom?) measures the monospace character cell
      dimensions (charWidth, charHeight) at the current font size
      and zoom level. returns a CharMetrics object used by all
      rendering and coordinate transforms. font size is
      BASE_FONT_SIZE * zoom.
    inputs:
      - 'CanvasRenderingContext2D, optional zoom multiplier'
    outputs:
      - 'CharMetrics { charWidth, charHeight }'
    state_changes: []
    determinism: deterministic

  - id: main-render-loop
    description: >
      render(ctx, state, metrics, time) is the main draw call,
      invoked each requestAnimationFrame. clears the canvas with
      BG_COLOR, then draws in ordered phases: tile layer (terrain,
      clover lifecycle, burn scars, glinting zones, ponds, rivers),
      entity layer (ground items, bees, beehives,
      characters, shooting stars, meteorites, lightning bolts,
      wildfire effects, pickup bloom effects, crumble effects,
      player trail, rain aura), path/hover preview layer, player
      glyph (uses deep time ghost glyph when active; crossfades
      from ö to @ via complementary globalAlpha during
      deepTimeTransition), cursor highlight, revery rain overlay,
      weather rain overlay (follows rain front), deep time burning
      overlay, and lightning screen flash overlay. during
      genesisTransition, entities not visible in genesis (characters,
      bees, beehives, ground items, meteorites, angels) render at
      transitionAlpha (0→1 over duration) via globalAlpha. uses a
      two-phase resolve-then-draw pattern for each tile: first
      determines char/color/cursorable, then applies cursor inversion
      if applicable.
    inputs:
      - 'CanvasRenderingContext2D, GameState, CharMetrics, timestamp'
    outputs:
      - 'full frame drawn to canvas'
    state_changes: []
    determinism: deterministic

  - id: cursor-inversion
    description: >
      tiles under the cursor that are cursorable get inverted
      rendering: pink fillRect background with dark BG_COLOR text.
      this is applied as a final pass after resolving each tile's
      char and color, not during the resolve phase.
    inputs:
      - 'state.cursorTile matching a cursorable tile'
    outputs:
      - 'inverted pink/dark rendering at cursor position'
    state_changes: []
    determinism: deterministic

  - id: earth-scan-pre-pass
    description: >
      when an earth scan revery is active, a pre-pass draws
      earthScanBgMap fillRect calls before the main glyph loop.
      this prevents south-row scan backgrounds from clipping
      north-row glyphs. the scan radiates from the player with
      expand, hold, and fade phases controlled by time constants.
    inputs:
      - 'active earth scan revery with earthScanBgMap'
    outputs:
      - 'colored background tiles showing soil health gradient'
    state_changes: []
    determinism: time-based

  - id: cave-masking
    description: >
      when caveRevealed is false, tiles in caveHiddenPositions
      render as CaveWall regardless of their actual type. this
      hides the secret chamber and Moab behind the breakable wall.
    inputs:
      - 'caveRevealed false, tile position in caveHiddenPositions'
    outputs:
      - 'CaveWall char and color rendered instead of actual tile'
    state_changes: []
    determinism: deterministic

  - id: glinting-zone-rendering
    description: >
      tiles in state.glintZones render with an animated sparkle
      overlay. a subset of zone tiles (controlled by GLINT_ZONE_DENSITY)
      show sparkle characters from GLINT_ZONE_CHARS in gold tones,
      animated with GLINT_ZONE_SPEED. only renders on walkable
      overworld tiles.
    inputs:
      - 'state.glintZones set, current time for animation'
    outputs:
      - 'sparkle chars overlaid on zone tiles'
    state_changes: []
    determinism: time-based

  - id: deep-time-ghost-glyph
    description: >
      when state.deepTime is active, the player glyph is rendered
      using state.deepTime.playerGlyph (the ghost glyph, currently
      set to the character o-diaeresis) and state.deepTime.playerGlyphColor
      instead of the normal PLAYER_CHAR and PLAYER_COLOR constants.
      during deepTimeTransition, crossfades from o-diaeresis (white)
      to @ (white) via complementary globalAlpha over
      DEEP_TIME_TRANSITION_GLYPH_DURATION_MS (800ms): the old glyph
      renders at (1 - t) alpha and the new glyph renders at t alpha,
      where t is elapsed / 800ms clamped to [0, 1].
    inputs:
      - 'state.deepTime.active is true'
      - 'state.deepTimeTransition with startTime (for crossfade phase)'
    outputs:
      - 'player rendered with ghost glyph and color'
      - 'during deepTimeTransition, old glyph fades out and new glyph fades in over 800ms'
    state_changes: []
    determinism: time-based

  - id: deep-time-burning-overlay
    description: >
      during DeepTimePhase.Burning, animated fire characters render
      on BurntClover tiles across the viewport. sparse rendering
      (every 3rd tile via hash) with fire characters (^, ~, *) in
      orange tones (#FF4500 to #FFAA00), animated by time. drawn as
      a post-pass overlay after the main tile/entity rendering.
    inputs:
      - 'state.deepTime.active is true, phase is Burning'
    outputs:
      - 'animated fire overlay on BurntClover tiles'
    state_changes: []
    determinism: time-based

  - id: deep-time-year-counter
    description: >
      during DeepTimePhase.Simulating, the deep time year counter
      is rendered in the Sidebar React component (Sidebar.tsx), not
      in the canvas renderer. the renderer previously owned this
      but it was moved to the UI layer.
    inputs:
      - 'state.deepTime.active is true, phase is Simulating'
    outputs:
      - 'year counter displayed in the sidebar UI'
    state_changes: []
    determinism: deterministic

  - id: rain-aura-overlay
    description: >
      animated rain characters render near entities with rain aura
      ECS components (e.g. water revery effect tiles). drawn as a
      post-pass overlay after the main tile rendering.
    inputs:
      - 'entities with rain aura components, current time'
    outputs:
      - 'animated rain overlay near aura entities'
    state_changes: []
    determinism: time-based

  - id: angel-aura-background
    description: >
      oscillating gold background renders within ANGEL_AURA_RADIUS
      of angel entities. drawn as a pre-pass before the main glyph
      loop. entire angel body group gets pink highlight when cursor
      or facing is on any tile of the group.
    inputs:
      - 'angel entities with Position/MultiPosition, current time'
    outputs:
      - 'gold aura background around angel tiles'
    state_changes: []
    determinism: time-based

  - id: twinkling-space-stars
    description: >
      space tiles render with twinkling star animation. random star
      characters appear and fade based on a hash of tile position
      and time, creating a starfield effect in the void border.
    inputs:
      - 'space tiles in viewport, current time'
    outputs:
      - 'animated twinkling stars on space tiles'
    state_changes: []
    determinism: time-based

  - id: player-trail-rendering
    description: >
      trail points from state.trail render with decreasing opacity
      based on age. older trail points are more transparent.
    inputs:
      - 'state.trail array with timestamped positions'
    outputs:
      - 'fading trail dots behind the player'
    state_changes: []
    determinism: time-based

  - id: angel-spawn-despawn-flash
    description: >
      a brief screen flash overlay renders when angelFlashTime is
      recent. used to punctuate angel spawn and despawn events.
    inputs:
      - 'state.angelFlashTime within flash duration'
    outputs:
      - 'white screen flash overlay fading out'
    state_changes: []
    determinism: time-based

  - id: weather-rain-overlay
    description: >
      when weather.sky is Rain and the current zone is overworld,
      animated rain characters render across the viewport following
      the rain front. the rain front axis and direction are computed
      from the wind direction. only tiles within the RAIN_FRONT_WIDTH
      band from the current rainFrontOffset are rendered. uses
      WEATHER_RAIN_DENSITY to control sparsity and tileHash with
      rainSeed for per-tile variation. rain characters (|, :, ., ,)
      animate in blue tones.
    inputs:
      - 'state.weather.sky is Rain, zone is overworld, current time for animation'
    outputs:
      - 'animated rain overlay following the sweeping rain front'
    state_changes: []
    determinism: time-based

edge_cases:
  - id: empty-viewport
    description: 'viewport dimensions are 0 (before canvas sizing)'
    expected: 'render draws nothing; no crash from zero-size loops'
  - id: entity-on-hidden-tile
    description: 'entity positioned on a cave hidden tile before reveal'
    expected: 'entity not rendered; hidden tiles mask everything'
  - id: multiple-entities-same-tile
    description: 'bee and ground item on the same tile'
    expected: 'rendering priority determines which glyph shows; later draw phases overwrite earlier ones'

failure_conditions:
  - trigger: 'canvas context lost'
    expected: 'render call fails silently; next frame attempts again'
  - trigger: 'state.map is empty (no tiles)'
    expected: 'tile loops iterate zero times; no crash'

verification:
  test_file: src/engine/__tests__/gameLoop.test.ts
  test_pattern: 'render'
  command: npx vitest run src/engine/__tests__/gameLoop.test.ts
