id: sidebar-iso-cursor-effects
name: 'Sidebar cursor info uses the projection-aware screen-to-tile transform'
priority: high
layer: component
source_files:
  - src/components/Sidebar.tsx
  - src/engine/projection.ts
  - src/engine/coordinates.ts
dependencies:
  - cursor-state
  - cursor-tile-info-all-types
  - isometric-projection
behaviors:
  - id: projection-aware-cursor-tile
    description: >
      The Sidebar derives its cursor tile from state.cursorScreenPos using
      the engine's screenToTile transform, passing the current viewport
      dimensions. The same screen-to-tile path used by the canvas
      highlight, click-to-move, and updateCursorState applies to the
      sidebar so the displayed Position, Contents, and Effects rows
      always describe the tile under the visual cursor highlight.
      When state.heldDirection is set (WASD active) or state.path is
      non-null (click-to-move active), the sidebar computes cursorTile
      as null and does not render the Cursor section.
    inputs:
      - 'state.cursorScreenPos is non-null and metricsRef.current is non-null'
      - 'state.heldDirection is null and state.path is null'
    outputs:
      - 'sidebar Cursor section renders Position, Contents, and Effects for the tile under the visual cursor highlight'
    state_changes: []
    determinism: deterministic
  - id: effects-row-reflects-cursor
    description: >
      Hovering a tile that is within an Aura component's radius (e.g.
      Gron's rain aura), inside an active rain front, on a glint zone,
      or otherwise covered by a persistent map-visible effect causes the
      sidebar Effects row to list that effect.
    inputs:
      - 'cursor screen position is within the screen footprint of a tile inside Gron rain aura'
    outputs:
      - 'sidebar Effects row displays "rain"'
    state_changes: []
    determinism: deterministic
  - id: cursor-leaves-canvas-clears-section
    description: >
      When the mouse leaves the canvas (state.cursorScreenPos becomes null),
      when WASD is active (state.heldDirection is set), or when click-to-move
      is active (state.path is non-null), the sidebar Cursor section is not
      rendered. The section reappears on the next mouse move event once
      movement is no longer active.
    inputs:
      - 'state.cursorScreenPos is null, OR state.heldDirection is set, OR state.path is non-null'
    outputs:
      - 'sidebar Cursor section (Position, Contents, Effects) is absent'
    state_changes: []
    determinism: deterministic
edge_cases:
  - id: viewport-dims-zero-before-first-frame
    description: >
      state.viewportWidth and state.viewportHeight start at 0 before the
      canvas has measured itself. screenToTile divides by the
      viewport-derived origin offsets; the sidebar must tolerate this
      transient state without throwing or producing NaN positions.
    expected: 'sidebar renders without error before the first canvas frame; cursor section may render an out-of-bounds tile but does not crash'
  - id: gron-aura-radius-six-tiles
    description: >
      Gron is created with aura kind "rain" and radius 6 (AURA_RADIUS.rain).
      Hovering any tile within Chebyshev distance 6 of Gron must surface
      "rain" in the Effects row.
    expected: 'sidebar Effects row contains "rain" when cursor tile is within 6 tiles of Gron'
  - id: wasd-or-path-active-clears-cursor-section
    description: >
      Player holds a WASD key or is actively following a click-to-move path
      while the mouse remains stationary over the canvas.
    expected: 'sidebar Cursor section is absent; it reappears on the next mouse move after movement ends'
failure_conditions:
  - trigger: 'cursor hovers a tile inside Gron rain aura'
    expected: 'sidebar Effects row shows "rain", not "None"'
  - trigger: 'cursor hovers an angel aura tile'
    expected: 'sidebar Effects row shows the angel aura kind, not "None"'
  - trigger: 'cursor hovers a glint zone tile'
    expected: 'sidebar Effects row shows "glinting", not "None"'
  - trigger: 'WASD key held while mouse is over canvas'
    expected: 'sidebar Cursor section is absent'
verification:
  test_file: src/components/__tests__/Sidebar.test.tsx
  test_pattern: 'Sidebar effects row'
  command: 'npx vitest run src/components/__tests__/Sidebar.test.tsx'
