id: RP-34-tenure-opens-in-little-house
name: 'The tenure opens in the little house — Emily speaks first (RP-34)'
priority: high
layer: integration
source_files:
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/characters.ts
  - src/engine/interaction.ts
  - src/engine/gameLoop.ts
  - src/harness/__tests__/serialization/schema.test.ts
dependencies:
  - RP-33-little-house-and-emily
  - RP-32-revery-dormancy-pressure

# Doctrine reference: docs/backlog.yaml id '34' (lines 1313-1368) and
# docs/backlog-thinktank-v6.md round 3.
#
# v6 round 3 lock: the steward begins inside the little house; the girl is
# the first character met; the first dialog beat sets the game's voice
# register before the prairie ever speaks. Symmetric bookend with #16
# (tenure-end handoff also occurs in the little house).
#
# Substrate already shipped by #33 (verified during research):
#   * House interior zone exists (Zone.HouseInterior). state.houseMap,
#     state.houseMapWidth, state.houseMapHeight populated by
#     createGameState.
#   * enterHouseAtTenureStart (state.ts:556) is called immediately by
#     useGameEngine after createGameState. It places the player at
#     state.houseEntranceInterior ({x: 9, y: 2}), sets state.currentZone
#     to Zone.HouseInterior, points state.map at state.houseMap, and
#     sets playerFacing = 'left' (Emily is across the room to the
#     steward's left, by the chair). Camera centers on the player.
#   * Emily character entity is created at {x: 5, y: 2} with
#     zone: Zone.HouseInterior (state.ts:541).
#   * Emily previously had four seasonal dialog registers
#     (EMILY_DIALOG_WINTER/SPRING/SUMMER/AUTUMN), all TODO placeholders.
#     The unified register below replaces them in this spec.
#
# What #34 ships (this spec):
#   1. A unified Emily dialog register (`EMILY_DIALOG`) of three
#      locked lines, replacing the four seasonal registers from #33.
#      Lines are authored by the user (not TODO placeholders) and
#      include the v6 R2 canonical refrain as the third line.
#   2. A one-shot first-wake dialog beat — Emily auto-initiates her
#      dialog when the steward wakes in the house at tenure start,
#      before the player has moved. Same `EMILY_DIALOG` register;
#      no dedicated first-wake register.
#   3. A conditional opening lineIndex: the firstWakeTrigger opens
#      at lineIndex 0 (greeting included) only when tenure opens in
#      spring; otherwise it opens at lineIndex 1. Manual [f]
#      engagements with Emily always open at lineIndex 1, regardless
#      of season — the greeting is reserved for the spring-equinox
#      tenure open.
#   4. A persistent flag (`state.tenureOpened`) that gates the auto-
#      trigger so it never re-fires after the first wake (Esc, walk-
#      away, save/reload all leave it true).
#
# Design decisions locked by the user 2026-05-23 / 2026-05-24:
#
#   1. Scope is the first-wake dialog beat plus a dialog-register
#      simplification. No new tutorial affordances; no extra visual /
#      shutter beats at handoff; no doctrine comment in genesis.ts
#      (deferred — out of scope here). Dialog and door remain the whole
#      onboarding.
#
#   2. Auto-trigger fires on wake. Emily opens her own dialog as soon
#      as the steward has agency (state.genesis === null and
#      state.bootTitleCard === null) and the steward is in the house
#      interior. The player has not pressed [f]; the dialog appears as
#      part of waking.
#
#   3. Dialog content is locked to three lines:
#
#        0. "Happy first day of spring, steward."   (greeting)
#        1. "I wonder what this year's knot will hold?"
#        2. "You will return before the winter solstice, to revery."
#
#      Lines 0 and 1 are doctrinal additions; line 2 is the v6 R2
#      canonical refrain locked in the thinktank. The four seasonal
#      registers from #33 (and the TODO placeholders within them) are
#      deleted; replaced by a single `EMILY_DIALOG` export.
#
#      The greeting (line 0) is conditional: it appears only when
#      the firstWakeTrigger fires AND the season is Spring. Every
#      other path — non-spring tenure-open, manual [f] in any season,
#      every subsequent visit — opens the dialog at lineIndex 1,
#      skipping the greeting. The greeting is reserved for the
#      spring-equinox tenure open and is otherwise unreachable for
#      that tenure.
#
#   4. The autumn-only awaitingConfirmation arm from #33 is preserved.
#      The third line is the same year-round, but the existing
#      tickDialogTyping / advanceDialog arm logic only flips
#      activeDialog.awaitingConfirmation = true when
#      state.weather.season === Autumn. The line index used by the
#      arm site changes from `EMILY_DIALOG_AUTUMN.length - 1` to
#      `EMILY_DIALOG.length - 1`; semantics otherwise unchanged.
#      In non-autumn seasons the same line plays as foreshadowing;
#      no confirm prompt.
#
#   5. The auto-trigger is one-shot. Once state.tenureOpened is true,
#      the tick that auto-opens the dialog short-circuits forever for
#      this tenure. Esc / walking away / save+reload do not re-arm
#      it. Re-engaging Emily with [f] after that opens the same
#      EMILY_DIALOG register via the existing interaction path.
#
#   6. The first-wake auto-open does NOT pre-arm awaitingConfirmation,
#      even if tenure-start happens to land in autumn. The arm logic
#      lives in tickDialogTyping / advanceDialog and is gated on the
#      typing-done last-line condition; the first frame after the
#      auto-open is on lineIndex 0 with typingIndex 0, so the arm
#      naturally doesn't fire. (Even if the player advances through
#      to the last line during the first-wake reading, the arm fires
#      as usual — autumn-gated, same as a manual [f] visit. The
#      first wake is the doctrine beat; the autumn arm is the
#      decision moment.)
#
#   7. Schema test (EXPECTED_FIELDS) is updated: ADD `tenureOpened`.
#
#   8. No multiplayer-protocol changes. The flag is per-tenure local
#      state; multiplayer spawn semantics still defer to #16.
#
# What this feature does NOT do:
#   - Does not change `enterHouseAtTenureStart`. #33's spawn semantics
#     are preserved.
#   - Does not add a wake animation, fade, eyes-opening beat, or any
#     new visual cue at handoff. The bootTitleCard cover already
#     provides the visual gate; the first frame after it clears shows
#     the interior with the dialog overlay.
#   - Does not change the genesis screen. No comment, no in-game text,
#     no new pixels.
#   - Does not add manual entries or unlock new manual content beyond
#     what #33 already did. (Emily's manual entry was added by #33.)
#   - Does not change the dormancy-pressure ramp from #32 or the
#     summons sequence from #33. The Emily confirm path still routes
#     through the existing dormancyPressure contribution.
#   - Does not introduce new audio cues for the first wake. (Music
#     handoff polish already shipped in commit b8dbe82.)
#   - Does not author seasonal-register variants. The unified register
#     is intentional — Emily's voice is the unchanged thing the prairie
#     produced (v6 R3 doctrine).

behaviors:
  - id: tenure-opened-flag-initial-state
    description: >
      createGameState initializes state.tenureOpened = false. The flag is
      false on every newly-created GameState — there is no per-character
      override and no genesis-time mutation. The flag exists so the
      first-wake auto-trigger can fire exactly once per tenure.
    inputs:
      - 'createGameState(stewardName, width, height) invocation'
    outputs:
      - 'state.tenureOpened === false on the returned GameState'
    state_changes:
      - field: tenureOpened
        effect: 'initialized to false'
    determinism: deterministic

  - id: emily-dialog-unified-register
    description: >
      Emily speaks a single year-round register exported as
      `EMILY_DIALOG` from src/engine/characters.ts. The register is a
      readonly three-entry string array containing the locked lines
      (see decision 3 in the header notes). The four prior seasonal
      registers (EMILY_DIALOG_WINTER/SPRING/SUMMER/AUTUMN) are
      deleted. `getEmilyDialog` is collapsed to a one-liner returning
      EMILY_DIALOG; `getCharacterDialog(state, 'emily')` dispatches to
      it unchanged from #33.
    inputs:
      - 'module load of src/engine/characters.ts'
      - 'getCharacterDialog(state, "emily") in any season'
    outputs:
      - 'EMILY_DIALOG is exported, length 3, content matches the locked lines'
      - 'getCharacterDialog returns EMILY_DIALOG regardless of state.weather.season'
      - 'EMILY_DIALOG_WINTER/SPRING/SUMMER/AUTUMN are no longer exported'
    state_changes: []
    determinism: deterministic

  - id: autumn-arm-uses-unified-register-length
    description: >
      The two arm sites in src/engine/interaction.ts that previously
      gated on `state.activeDialog.lineIndex ===
      EMILY_DIALOG_AUTUMN.length - 1` now gate on
      `state.activeDialog.lineIndex === EMILY_DIALOG.length - 1`.
      The autumn season gate
      (`state.weather.season === Season.Autumn`) and the no-active-
      Revery gate (`state.revery === null`) are preserved. Behavior:
      pressing [f] on the last line in autumn arms
      activeDialog.awaitingConfirmation and flips emilyInvitation to
      'offered'; the existing confirm path then commits to Revery on
      the next [f]. In non-autumn seasons the same line reads as
      foreshadowing and no arm occurs.
    inputs:
      - 'tickDialogTyping or advanceDialog reaches the last line with characterId === "emily"'
    outputs:
      - 'state.activeDialog.awaitingConfirmation === true when season is Autumn and revery is null'
      - 'state.emilyInvitation === "offered" (was "unoffered")'
      - 'in non-autumn seasons, awaitingConfirmation remains undefined and emilyInvitation remains "unoffered"'
    state_changes:
      - field: activeDialog.awaitingConfirmation
        effect: 'set to true on autumn last-line typing-done'
      - field: emilyInvitation
        effect: 'unoffered → offered on autumn last-line typing-done'
    determinism: deterministic

  - id: first-wake-auto-trigger
    description: >
      A new gameplay-phase TickSystem in `src/engine/gameLoop.ts`
      (id: `'firstWakeTrigger'`, intervalMs: 0, phase: 'gameplay',
      zone: 'always', priority: -18 — runs after bootTitleCardTick at
      -20 and deepTimeTransitionCleanup at -19, before any movement
      systems) auto-opens Emily's dialog on the first eligible frame
      and sets state.tenureOpened = true. Eligibility:
        * state.tenureOpened === false
        * state.bootTitleCard === null
        * state.currentZone === Zone.HouseInterior
        * state.activeDialog === null
        * state.revery === null
        * state.zoneTransition === null
      (Genesis gating is handled by `phase: 'gameplay'` and the
      gameloop's phase filter; no inline `state.genesis` check is
      written or permitted — see the meta-test "no genesis guards
      remain in game loop system bodies" in genesis.test.ts.)
      The opening lineIndex depends on the season:
        * state.weather.season === Season.Spring → lineIndex 0
          (greeting included)
        * any other season → lineIndex 1 (greeting skipped)
      When all eligibility holds, the system sets:
        state.activeDialog = {
          characterId: 'emily',
          lineIndex: <0 or 1 per the season rule above>,
          typingIndex: 0,
          typingDone: false,
          transitioning: false,
          transitionStartTime: 0,
        }
        state.tenureOpened = true
      and calls callbacks.onRefreshUI?.() so the UI picks up the new
      dialog overlay on the next render commit.
    inputs:
      - 'first eligible gameplay tick after tenure-start handoff'
    outputs:
      - 'state.activeDialog.characterId === "emily"'
      - 'state.activeDialog.lineIndex === 0 when season is Spring; === 1 otherwise'
      - 'state.tenureOpened === true'
      - 'callbacks.onRefreshUI was called'
    state_changes:
      - field: activeDialog
        effect: 'set to emily / season-derived lineIndex / not typing'
      - field: tenureOpened
        effect: 'set to true (one-shot latch)'
    determinism: deterministic

  - id: manual-f-skips-greeting
    description: >
      The [f]-press interaction path in `src/engine/interaction.ts`
      (`interactWithCharacter`) sets the opening lineIndex to 1 when
      the character is Emily, skipping the spring-equinox greeting.
      For every other character (Gron, Moab, angels, ghosts) the
      lineIndex stays at 0. This means manual engagements with Emily
      never play the greeting, even during spring — the greeting is
      reserved for the firstWakeTrigger's one-shot auto-open.
    inputs:
      - '[f] press when the player is adjacent to Emily and facing her'
    outputs:
      - 'state.activeDialog.characterId === "emily"'
      - 'state.activeDialog.lineIndex === 1 regardless of season'
    state_changes:
      - field: activeDialog
        effect: 'opened at lineIndex 1 for Emily; lineIndex 0 for all other characters'
    determinism: deterministic

  - id: first-wake-trigger-idempotent
    description: >
      Once state.tenureOpened === true, the firstWakeTrigger system
      short-circuits immediately. Even if the player later returns to
      the house interior, closes a dialog, exits a Revery, or otherwise
      satisfies the remaining eligibility checks, the dialog does NOT
      re-auto-open. This is the one-shot guarantee.
    inputs:
      - 'gameplay tick with state.tenureOpened === true'
    outputs:
      - 'state.activeDialog is unchanged by the firstWakeTrigger system'
    state_changes: []
    determinism: deterministic

  - id: schema-test-includes-tenure-opened
    description: >
      EXPECTED_FIELDS in
      src/harness/__tests__/serialization/schema.test.ts gains the entry
      `'tenureOpened'`. The list remains alphabetically sorted by the
      `.sort((a, b) => a.localeCompare(b))` step at the end of the
      array literal.
    inputs:
      - 'npm run test:harness'
    outputs:
      - 'schema.test.ts passes; EXPECTED_FIELDS contains "tenureOpened"'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: skip-genesis-url
    description: >
      The session is started with the skip-genesis URL parameter
      (useGameEngine.ts:100-105 layoutEffect calls completeGenesis with
      skipTitleCard: true). state.genesis is cleared and
      state.bootTitleCard remains null because finalizeGenesisHandoff
      is called synchronously before any title card is scheduled.
    expected: >
      On the first gameplay tick after the layoutEffect fires, all
      eligibility checks pass (bootTitleCard null, zone HouseInterior,
      no dialog, no Revery, no zoneTransition). The phase filter
      passes too because state.genesis is null. The firstWakeTrigger
      fires immediately; state.activeDialog opens to EMILY_DIALOG;
      state.tenureOpened becomes true.

  - id: dialog-already-open-at-handoff
    description: >
      A test or alternate code path opens an activeDialog before the
      firstWakeTrigger has had a chance to fire (e.g., a fixture that
      forces state.activeDialog into a non-null value pre-tick).
    expected: >
      The firstWakeTrigger sees state.activeDialog !== null and
      short-circuits without mutating state.activeDialog or
      state.tenureOpened. On a later tick where state.activeDialog has
      become null (e.g., dialog closed), the trigger re-evaluates the
      remaining conditions; if state.tenureOpened is still false and
      currentZone is HouseInterior, the trigger fires then. This means
      the one-shot landing is preserved but its timing can shift.

  - id: player-closes-first-wake-dialog
    description: >
      Player presses Esc (or any close path) on the auto-opened
      first-wake dialog. state.activeDialog returns to null.
      state.tenureOpened was already true from the open frame.
    expected: >
      No re-trigger. The firstWakeTrigger short-circuits on
      state.tenureOpened === true. Subsequent [f] interactions with
      Emily go through the existing interaction.ts path and open the
      same EMILY_DIALOG register.

  - id: save-and-reload-after-first-wake
    description: >
      Player closes the first-wake dialog, then a save snapshot is
      written and reloaded (tenureOpened was already true at save
      time).
    expected: >
      EXPECTED_FIELDS includes `tenureOpened`; the field round-trips
      correctly. On reload, state.tenureOpened === true and the
      firstWakeTrigger does not re-fire. Re-engaging Emily yields the
      same EMILY_DIALOG register.

  - id: save-and-reload-mid-first-wake-dialog
    description: >
      Player saves while the auto-opened first-wake dialog is on
      screen. activeDialog and tenureOpened are both truthy at save
      time.
    expected: >
      Per #33's serialization-roundtrip edge case ("the save format is
      not stable across backlog-item-level changes"), formal save/load
      semantics are out of scope. For the purposes of this spec: as
      long as state.tenureOpened survives a round-trip via the
      EXPECTED_FIELDS schema, the trigger will not re-fire even if
      activeDialog is dropped on load.

  - id: revery-active-at-tenure-start
    description: >
      A pathological test constructs a state where a Revery is already
      active immediately after createGameState +
      enterHouseAtTenureStart.
    expected: >
      The firstWakeTrigger short-circuits while state.revery !== null.
      On the frame after Revery closes (state.revery returns to null),
      the trigger re-evaluates and fires if the other conditions hold.
      In production this path is not reachable — there is no Revery at
      tenure-start by construction.

  - id: zone-transition-active-at-tenure-start
    description: >
      An ongoing zoneTransition is in progress when the firstWakeTrigger
      would otherwise fire (defensive — at tenure-start the player has
      not moved, so this should not happen in practice).
    expected: >
      The firstWakeTrigger short-circuits while state.zoneTransition
      !== null. On the next tick after the transition clears, the
      trigger fires. This prevents the dialog from opening over a
      mid-transition iris/dissolve render.

  - id: boot-title-card-still-up
    description: >
      The bootTitleCard fade-out is still in progress: state.genesis is
      null (cleared at hold midpoint by bootTitleCardTick) but
      state.bootTitleCard is still set (until fade-out completes).
    expected: >
      The firstWakeTrigger short-circuits while
      state.bootTitleCard !== null. The dialog opens on the first tick
      after bootTitleCard becomes null — that is, the first frame in
      which the player sees the interior unobscured.

  - id: autumn-tenure-open-and-walk-to-last-line
    description: >
      Tenure opens in autumn. firstWakeTrigger fires, opening
      EMILY_DIALOG at lineIndex 1 (greeting skipped because season is
      not Spring). Player advances the dialog to the last line and
      lets typing finish (or presses [f] to skip typing).
    expected: >
      The existing #33 autumn arm logic fires unchanged — the season
      is Autumn, revery is null, lineIndex === EMILY_DIALOG.length - 1,
      typing is done → awaitingConfirmation = true, emilyInvitation
      = 'offered'. The player can then confirm (committing to Revery)
      or cancel (reverting emilyInvitation). The first-wake auto-open
      does not bypass or pre-arm the autumn invitation surface.

  - id: spring-tenure-open-greeting-is-one-shot
    description: >
      Tenure opens in spring. firstWakeTrigger fires, opening
      EMILY_DIALOG at lineIndex 0 (greeting included). Player closes
      the dialog (any path — Esc, walking out, advance to end). Player
      later returns and presses [f] near Emily, still in spring.
    expected: >
      The second engagement opens at lineIndex 1 — the greeting is
      not replayed. The greeting is a tenure-open ceremony, not a
      spring-only convention; once consumed, it does not return for
      this tenure. (Re-tenure is needed to hear it again, and only
      if that tenure opens in spring.)

failure_conditions:
  - trigger: >
      The Emily character entity does not exist in state.characters
      when the firstWakeTrigger fires (e.g., a partial fixture state
      that bypassed createCharacterEntity).
    expected: >
      The auto-trigger still sets activeDialog and tenureOpened — there
      is no entity lookup at the trigger site (the dialog UI is what
      reads the character definition). The dialog UI's standard
      missing-definition path applies (per #33 failure_conditions:
      "no entity at facing tile" / empty render). No crash.

  - trigger: >
      `state.tenureOpened` is somehow already true on a freshly
      constructed state (e.g., a test fixture overrides it before
      createGameState returns).
    expected: >
      The firstWakeTrigger never fires for the lifetime of that state.
      No dialog is auto-opened. This is the expected behavior for
      "second tenure" or any pre-seeded scenario; the gating is honest.

  - trigger: >
      callbacks.onRefreshUI is null/undefined when the firstWakeTrigger
      fires.
    expected: >
      The optional-chained `callbacks.onRefreshUI?.()` is a no-op. The
      state mutation still lands. The next natural tick / RAF causes
      the UI to read the new state. No crash.

verification:
  test_file: src/engine/__tests__/RP-34-tenure-opens-in-little-house.test.ts
  test_pattern: '^RP-34 — the tenure opens in the little house$'
  command: 'npx vitest run src/engine/__tests__/RP-34-tenure-opens-in-little-house.test.ts'
