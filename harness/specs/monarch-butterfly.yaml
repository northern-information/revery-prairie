id: monarch-butterfly
name: 'Monarch butterfly'
status: partial
priority: medium
layer: engine
source_files:
  - src/engine/monarch.ts
  - src/engine/entities.ts
  - src/engine/gameLoop.ts
  - src/engine/renderer.ts
  - src/engine/constants.ts
  - src/engine/ecs/types.ts
  - src/engine/manual.ts
  - src/components/Sidebar.tsx
dependencies:
  - bee-starvation
  - clover-lifecycle
  - tile-water
  - weather

behaviors:
  - id: monarch-spawn-during-rain
    description: >
      When a bee entity would spawn from any source (bee+clover recipe,
      angel bee aura, bee item drop) and it is currently raining
      (state.weather.sky === Sky.Rain), there is a 10% chance the spawned
      entity becomes a monarch butterfly instead of a bee. The monarch
      uses EntityTag 'monarch' and is rendered as '*' in orange (#FF8C00).
    inputs:
      - 'Bee spawn event from any source (recipe, angel aura, item drop)'
      - 'state.weather.sky === Sky.Rain'
    outputs:
      - 'Monarch entity created with Position, EntityTag monarch, EntityZone, HungerTimer, MonarchState'
      - 'Rendered as orange * instead of gold *'
    state_changes:
      - field: world
        effect: 'monarch entity created with tag monarch instead of bee'
    determinism: probabilistic

  - id: monarch-zigzag-wandering
    description: >
      Monarchs move in a distinctive zig-zag flight pattern. Instead of
      single-tile moves like bees, monarchs pick a waypoint 5-10 tiles
      away in a random direction and move toward it tile-by-tile via
      pathfinding. When they reach the waypoint, they pick a new one.
      Monarchs are attracted to clover — when picking a waypoint, there
      is a 70% chance the direction is biased toward the nearest clover
      patch within 15 tiles.
    inputs:
      - 'Monarch entity exists in current zone with phase wandering'
      - 'Tick interval elapsed (MONARCH_TICK_MS = 200ms)'
    outputs:
      - 'Monarch moves along zig-zag path toward current waypoint'
      - 'New waypoint picked when previous one is reached'
    state_changes:
      - field: 'world.Position(monarch)'
        effect: 'updated one tile toward current waypoint per tick'
      - field: 'world.MonarchState.waypoint'
        effect: 'set to new random position when previous reached or null'
    determinism: probabilistic

  - id: monarch-proximity-flee
    description: >
      When the player gets within MONARCH_FLEE_RADIUS (4 tiles) of a
      wandering monarch, the monarch is "identified" and transitions to
      fleeing phase. A pickup bloom spawns at the player position and
      the manual discovery entity:monarch is recorded. The monarch
      searches for a fertile soil target (soil health >= 80, fallback
      >= 50) within a 30-tile radius, preferring tiles farther from the
      player. It then zig-zags toward that target.
    inputs:
      - 'Player position within MONARCH_FLEE_RADIUS of wandering monarch'
    outputs:
      - 'Monarch enters fleeing phase with target set'
      - 'Pickup bloom spawned at player position'
      - 'Manual discovery recorded'
    state_changes:
      - field: 'world.MonarchState(monarch)'
        effect: 'phase set to fleeing, target set to fertile soil position'
      - field: manualDiscoveries
        effect: 'entity:monarch added to set'
    determinism: deterministic

  - id: monarch-fleeing-movement
    description: >
      Fleeing monarchs zig-zag toward their target tile using the same
      waypoint system as wandering, but biased toward the flee target.
      When the monarch reaches its target, it transitions to settled
      phase. If no target was found, the monarch settles at its current
      position immediately.
    inputs:
      - 'Monarch in fleeing phase with target'
    outputs:
      - 'Monarch zig-zags toward target'
      - 'Transitions to settled on arrival'
    state_changes:
      - field: 'world.Position(monarch)'
        effect: 'moves toward target via zig-zag waypoints'
      - field: 'world.MonarchState(monarch)'
        effect: 'transitions to settled when target reached'
    determinism: probabilistic

  - id: monarch-settled-pollination
    description: >
      Settled monarchs wander in a small area (MONARCH_SETTLE_RADIUS = 3
      tiles) around their landing spot, preferring clover tiles. Every
      MONARCH_POLLINATE_MS (5000ms), the monarch pollinates: one dirt
      tile adjacent to existing clover within the settle radius is
      converted to clover with a healthy lifecycle entry. This creates
      natural, gradual clover spread rather than instant prairie planting.
    inputs:
      - 'Monarch in settled phase'
      - 'MONARCH_POLLINATE_MS elapsed since last pollination'
      - 'Dirt tile adjacent to clover exists within settle radius'
    outputs:
      - 'One dirt tile converted to clover'
      - 'Clover lifecycle entry initialized (healthy, has light if overworld)'
    state_changes:
      - field: map
        effect: 'one dirt tile set to TileType.Clover'
      - field: cloverLifecycle
        effect: 'new entry for pollinated tile (stage: Healthy)'
    determinism: probabilistic

  - id: monarch-cursor-info
    description: >
      The sidebar cursor info panel shows 'monarch butterfly' in the
      contents row when the mouse hovers over a tile occupied by a
      monarch entity. Follows the same pattern as bee cursor info.
    inputs:
      - 'Mouse hovers over tile with monarch entity'
    outputs:
      - 'Sidebar contents row shows monarch butterfly label'
    state_changes: []
    determinism: deterministic

  - id: monarch-manual-entry
    description: >
      Monarchs appear in the prairie manual. Discovery is tracked via
      manualDiscoveries with key entity:monarch. Recorded when the player
      first triggers a monarch flee (proximity detection).
    inputs:
      - 'Player gets within flee radius of a monarch for the first time'
    outputs:
      - 'Manual discovery recorded'
    state_changes:
      - field: manualDiscoveries
        effect: 'entity:monarch added to set'
    determinism: deterministic

edge_cases:
  - id: no-fertile-soil-in-range
    description: >
      Fleeing monarch cannot find a tile with soil health >= 50
      within the 30-tile search radius
    expected: >
      Monarch settles at its current position immediately and begins
      pollinating from there.
  - id: monarch-spawn-outside-rain
    description: >
      Bee spawns when it is not raining (sky is sun or cloudy)
    expected: >
      Normal bee entity created, never a monarch. Rain check is strict
      (Sky.Rain only, not cloudy).
  - id: monarch-starvation-while-fleeing
    description: >
      Monarch starves while zig-zagging toward its flee target
    expected: >
      Monarch dies like a bee would. Pollination does not happen. Hunger
      system applies equally to all monarch phases.
  - id: no-dirt-adjacent-to-clover
    description: >
      Settled monarch tries to pollinate but no dirt tiles are adjacent
      to existing clover within the settle radius
    expected: >
      Pollination attempt returns false, no tiles changed. Monarch
      continues wandering in its settle area.
  - id: multiple-monarchs
    description: >
      Multiple monarchs exist simultaneously
    expected: >
      Each monarch operates independently with its own phase, waypoints,
      and pollination timer.

failure_conditions:
  - trigger: 'Bee spawns during rain but random roll exceeds 10% threshold'
    expected: 'Normal bee created, no monarch'
  - trigger: 'Player is farther than MONARCH_FLEE_RADIUS from wandering monarch'
    expected: 'Monarch continues zig-zag wandering, no flee'
  - trigger: 'Settled monarch pollination timer has not elapsed'
    expected: 'No pollination, monarch just wanders in settle area'

verification:
  test_file: src/engine/__tests__/monarch.test.ts
  test_pattern: 'monarch'
  command: 'npx vitest run src/engine/__tests__/monarch.test.ts'
