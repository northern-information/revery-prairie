id: iso-shooting-star-trails
name: 'Shooting star trail glyphs orient to projected screen direction'
priority: medium
layer: engine
source_files:
  - src/engine/constants.ts
  - src/engine/renderer.ts
dependencies:
  - shooting-stars
  - isometric-projection

behaviors:
  - id: trail-glyph-matches-screen-direction
    description: >
      The trail glyph chosen for each shooting star must visually align
      with the on-screen fall direction, not the world-space velocity.
      Because world (vx, vy) projects to screen
      ((vx - vy) * charWidth, (vx + vy) * halfH), the renderer picks
      the trail glyph from a table whose keys map world velocity to
      glyphs that match the projected on-screen slope.
    inputs:
      - 'shooting star world velocity (dx, dy)'
    outputs:
      - 'trail glyph rendered at each trail tile'
    state_changes: []
    determinism: deterministic

  - id: trail-char-table
    description: >
      The constant SHOOTING_STAR_TRAIL_CHARS in src/engine/constants.ts
      maps each VelocityKey to the glyph that matches its projected
      screen direction. Mapping (world → screen → glyph):
      `1,1` and `-1,-1` (vertical on screen) → `|`;
      `1,-1` and `-1,1` (horizontal on screen) → `-`;
      `1,0` and `-1,0` (down-right / up-left on screen) → `\`;
      `0,1` and `0,-1` (down-left / up-right on screen) → `/`.
    inputs:
      - 'world velocity key (dx,dy)'
    outputs:
      - 'trail glyph string'
    state_changes: []
    determinism: deterministic

  - id: renderer-uses-trail-table
    description: >
      In renderer.ts the shooting-star trail-glyph lookup reads
      SHOOTING_STAR_TRAIL_CHARS for both targeted (landing) and ambient
      shooting stars. The satellite trail path is unaffected because it
      does not key glyphs on velocity.
    inputs: []
    outputs:
      - 'correct trail glyph for the projected direction'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: vertical-on-screen
    description: 'shooting star with world velocity (1,1) — projects to a straight vertical line on screen'
    expected: 'trail glyph is `|`'
  - id: horizontal-on-screen
    description: 'shooting star with world velocity (1,-1) — projects to a straight horizontal line on screen'
    expected: 'trail glyph is `-`'
  - id: diagonal-down-right-on-screen
    description: 'shooting star with world velocity (1,0) — projects to a down-right slope on screen'
    expected: 'trail glyph is `\\`'
  - id: diagonal-down-left-on-screen
    description: 'shooting star with world velocity (0,1) — projects to a down-left slope on screen'
    expected: 'trail glyph is `/`'
  - id: targeted-and-ambient-share-table
    description: 'targeted (landing) and ambient shooting stars'
    expected: 'both pick their trail glyph from SHOOTING_STAR_TRAIL_CHARS; the targetedStarMap vs shootingStarMap split only changes color, not glyph selection'

failure_conditions:
  - trigger: 'Velocity key not found in the table (unknown direction)'
    expected: 'fall back to `-`'
  - trigger: 'Renderer keys glyph selection on world velocity directly without going through the projection-aware table'
    expected: 'regression — trail glyphs would be rotated 45° relative to the on-screen fall direction'

verification:
  test_file: src/engine/__tests__/isoShootingStarTrails.test.ts
  test_pattern: 'shooting star trail'
  command: 'npx vitest run src/engine/__tests__/isoShootingStarTrails.test.ts'
