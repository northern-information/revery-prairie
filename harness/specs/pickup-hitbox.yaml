id: pickup-hitbox
name: Player Pickup Hitbox (3x3 Chebyshev)
priority: medium
layer: engine
source_files:
  - src/engine/entities.ts
  - src/engine/__tests__/entities.test.ts
  - src/engine/__tests__/meteoriteChainExplosion.test.ts
dependencies:
  - universal-pickup-bloom
  - meteorite-chain-explosion

behaviors:
  - id: ground-item-pickup-3x3
    description: >
      When the player ends a movement step, all groundItem-tagged entities
      within Chebyshev distance 1 of the player (the 3x3 footprint centered
      on the player, including the player's own tile) are eligible for
      pickup. Each candidate is placed in the backpack if a fit is found;
      placed items are destroyed from the world. This behavior is
      preserved from the prior implementation and now matches bees and
      meteorites.
    inputs:
      - 'groundItem entities exist within 3x3 of player'
      - 'pickUpGroundItems(state, time?) is called'
    outputs:
      - 'each groundItem with a backpack fit is placed and destroyed'
      - 'pickedUp[] contains each placed definitionId'
    state_changes:
      - field: backpack
        effect: 'each fitted item added at findFitPosition result'
      - field: world
        effect: 'placed groundItem entities destroyed'
    determinism: deterministic

  - id: live-bees-not-captured-by-walk-over
    description: >
      Live bee entities (EntityTag = 'bee') are never captured by
      pickUpGroundItems regardless of proximity to the player. Walking
      onto or adjacent to a bee tile has no effect on the bee or the
      backpack. Bee acquisition routes through the bee + clover recipe,
      the bee-role ruin vault (which spawns a groundItem-tagged bee, not
      a live bee entity), and any future explicit interactions; never
      through ambient walk-over. Monarchs (EntityTag = 'monarch') are
      unaffected by this rule since they were never captured by walk-
      over.
    inputs:
      - 'bee-tagged entities exist within 3x3 of player'
      - 'pickUpGroundItems(state, time?) is called'
    outputs:
      - 'no bee entity destroyed'
      - 'no bee item added to backpack from this branch'
      - 'pickedUp[] contains no "bee" entry from this branch'
    state_changes: []
    determinism: deterministic

  - id: meteorite-pickup-3x3
    description: >
      Meteorites within Chebyshev distance 1 of the player (the 3x3
      footprint centered on the player, including the player's own tile)
      are eligible for capture. This expands the prior single-tile check
      so the meteorite hitbox matches ground items and bees. Surviving
      meteorites with a backpack fit are placed and destroyed.
    inputs:
      - 'meteorite-tagged entities exist within 3x3 of player'
      - 'pickUpGroundItems(state, time?) is called'
    outputs:
      - 'each surviving meteorite with a backpack fit is placed and destroyed'
      - 'pickedUp[] contains "meteorite" for each captured meteorite'
    state_changes:
      - field: backpack
        effect: 'meteorite item placed at findFitPosition result'
      - field: world
        effect: 'captured meteorite entities destroyed'
    determinism: deterministic

  - id: chain-explosion-3x3
    description: >
      Meteorites within Chebyshev distance 1 of the player are eligible
      for the chain-explosion roll, matching the pickup hitbox. Each
      eligible meteorite (with fromChain !== true) rolls independently
      against CHAIN_EXPLOSION_CHANCE. When a roll succeeds, the meteorite
      is destroyed and spawnChainMeteorites is called with that
      meteorite's own tile position (not the player position) as the
      center; chainExplosions is incremented by the spawn count. Chain
      rolls only fire when the time parameter is provided.
    inputs:
      - 'meteorite-tagged entities exist within 3x3 of player'
      - 'time parameter is provided'
      - 'meteorite has no ChainSource.fromChain = true'
    outputs:
      - 'rolled meteorites either explode (destroyed, chain spawned at their tile) or proceed to pickup phase'
      - 'chainExplosions reflects total spawned chain meteorites'
    state_changes:
      - field: world
        effect: 'exploded meteorite entities destroyed; chain meteorite entities spawned at their tiles'
      - field: chainExplosions
        effect: 'incremented by sum of spawnChainMeteorites returns'
    determinism: probabilistic

verification:
  test_file: src/engine/__tests__/entities.test.ts
  test_pattern: pickUpGroundItems
  command: npx vitest run src/engine/__tests__/entities.test.ts src/engine/__tests__/meteoriteChainExplosion.test.ts

edge_cases:
  - id: chain-fromchain-skipped
    description: >
      Meteorites with ChainSource.fromChain = true are never rolled for
      chain explosion, regardless of position. This preserves the
      existing rule that chain-spawned meteorites cannot themselves
      trigger further chains.
    expected: 'fromChain meteorites never destroyed by chain roll'

  - id: chain-spawned-not-picked-up-same-tick
    description: >
      Meteorite pickup candidates are captured in a snapshot before the
      chain explosion phase runs. The pickup phase iterates that
      snapshot, so meteorites spawned by spawnChainMeteorites during this
      call are never captured on the same tick — even if they land
      within the player's 3x3 footprint. This matches the prior
      single-tile behavior where chain spawns landed outside the pickup
      tile and required a future tick to be acquired. Pre-existing
      fromChain meteorites (e.g. left over from a previous chain on an
      earlier tick) are still picked up normally; the skip is based on
      the snapshot, not on the ChainSource component.
    expected: 'chain-spawned meteorites from this call remain in the world after pickUpGroundItems returns'

  - id: no-time-no-chain
    description: >
      When pickUpGroundItems is called without a time argument (e.g. from
      test helpers), chain explosions do not roll. Pickup still proceeds
      on the 3x3 hitbox for ground items and surviving meteorites.
    expected: 'chainExplosions = 0; pickup phase still runs'

  - id: ground-item-bee-still-picked-up
    description: >
      A groundItem-tagged entity whose ItemDrop.definitionId is 'bee'
      (e.g. the ruin-bee vault payload spawned by spawnDormantGardenSeeds
      for a RuinRole.Bee ruin) is picked up by the groundItem branch of
      pickUpGroundItems exactly like any other ground item. This is the
      only walk-over route by which the player acquires a bee. The
      live-bees-not-captured-by-walk-over behavior governs entities
      tagged 'bee', not ground items whose payload happens to be a bee
      item.
    expected: 'groundItem with definitionId "bee" is placed in the backpack and the entity is destroyed; pickedUp[] contains "bee"'

  - id: backpack-full-leaves-on-ground
    description: >
      If the backpack has no fit for a candidate item, that entity remains
      in the world at its current position. Other items in the 3x3 with
      a fit are still picked up.
    expected: 'unfitted entities not destroyed; fitted entities destroyed'

  - id: zone-filter-not-changed
    description: >
      The 3x3 scan still uses state.world.spatial.at (not the zone-filtered
      helper). This matches the existing ground-item implementation. Cross-
      zone entity bleed prevention remains the responsibility of upstream
      systems and the cross-zone-entity-bleed spec.
    expected: 'no change to zone filtering — same behavior as before'

  - id: chain-roll-independence
    description: >
      Each eligible meteorite within the 3x3 rolls independently. Over a
      large number of trials with all meteorites having fromChain !== true,
      the expected fraction of pickups that produce at least one chain
      explosion approaches 1 - (1 - CHAIN_EXPLOSION_CHANCE)^N for N
      meteorites in range. Tests assert via Math.random mocks that
      forcing the roll above the threshold suppresses all explosions and
      forcing it below triggers all of them.
    expected: 'mocked Math.random < threshold => all N explode; >= threshold => none explode'

  - id: bloom-single-event
    description: >
      Picking up multiple items across the 3x3 footprint in a single call
      still spawns exactly one pickupBloom at the player position (per
      universal-pickup-bloom spec, single-bloom-per-event behavior).
    expected: 'one pickupBloom entity regardless of number of items picked up'

failure_conditions:
  - trigger: 'spatial index returns stale entries (entity destroyed mid-scan)'
    expected: 'getComponent returns undefined; iteration skips entity safely'
  - trigger: 'findFitPosition returns null for all candidates'
    expected: 'no entities destroyed; pickedUp is empty; no bloom spawned'
