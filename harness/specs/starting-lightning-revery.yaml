id: starting-lightning-revery
name: 'Player starts with all four reveries'
priority: high
layer: engine
source_files:
  - src/engine/state.ts
  - src/engine/__tests__/state.test.ts
  - src/engine/__tests__/actionBar.test.ts
  - src/engine/__tests__/gron-gift.test.ts
  - src/engine/__tests__/moab-colde.test.ts
dependencies: []

behaviors:
  - id: lightning-in-starting-reveries
    description: >
      createGameState adds 'earth', 'lightning', 'water', and 'deep-time'
      to state.reveries so the player begins with all four reveries available
      immediately. no character gifts are required to unlock any revery.
    inputs:
      - 'createGameState called with any valid arguments'
    outputs:
      - "state.reveries equals ['earth', 'lightning', 'water', 'deep-time']"
    state_changes:
      - field: reveries
        effect: "contains 'earth', 'lightning', 'water', and 'deep-time'"
    determinism: deterministic

  - id: lightning-in-action-bar-slot-2
    description: >
      createGameState auto-assigns all four starting reveries to action bar
      slots 0-3 via autoAssignRevery. earth fills slot 0, lightning fills
      slot 1, water fills slot 2, deep-time fills slot 3. all four slots
      are occupied at game start.
    inputs:
      - 'createGameState called with any valid arguments'
    outputs:
      - 'state.actionBar[0] is earth, [1] is lightning, [2] is water, [3] is deep-time'
    state_changes:
      - field: actionBar[0]
        effect: "set to { kind: 'revery', id: 'earth', cooldownEndTime: 0, cooldownDurationMs: 0 }"
      - field: actionBar[1]
        effect: "set to { kind: 'revery', id: 'lightning', cooldownEndTime: 0, cooldownDurationMs: 0 }"
      - field: actionBar[2]
        effect: "set to { kind: 'revery', id: 'water', cooldownEndTime: 0, cooldownDurationMs: 0 }"
      - field: actionBar[3]
        effect: "set to { kind: 'revery', id: 'deep-time', cooldownEndTime: 0, cooldownDurationMs: 0 }"
    determinism: deterministic

edge_cases:
  - id: moab-fire-no-empty-slot
    description: >
      moab's fire gift calls autoAssignRevery after game start. all four
      action bar slots are already occupied, so autoAssignRevery is a no-op
      for the action bar. the fire revery is still added to state.reveries
      but does not appear in the action bar.
    expected: 'state.reveries contains fire; state.actionBar unchanged (all four slots remain earth/lightning/water/deep-time)'

  - id: test-state-includes-all-four
    description: >
      createTestState (which wraps createGameState) includes all four
      starting reveries and a full action bar, so all tests using
      createTestState reflect the new starting state
    expected: "state.reveries contains all four reveries; actionBar[0-3] are earth/lightning/water/deep-time"

failure_conditions:
  - trigger: 'lightning revery definition missing from REVERIES'
    expected: 'autoAssignRevery still succeeds (it does not validate the id against definitions)'

verification:
  test_file: src/engine/__tests__/state.test.ts
  test_pattern: 'starts with all four reveries'
  command: npx vitest run src/engine/__tests__/state.test.ts
