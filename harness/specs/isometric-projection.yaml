id: isometric-projection
name: 'Isometric projection rendering'
priority: medium
layer: integration
source_files:
  - src/engine/projection.ts
  - src/engine/coordinates.ts
  - src/engine/renderer.ts
  - src/engine/cursor.ts
  - src/hooks/useMouse.ts
dependencies: []

behaviors:
  - id: tile-to-screen
    description: >
      viewportToScreen projects a logical viewport tile (vx, vy) into
      pixel space as a 2:1 diamond cell. Each tile occupies 2*charWidth
      wide and charHeight tall on screen. The transform is
      px = (vx - vy) * charWidth + originX + charWidth/2,
      py = (vx + vy) * (charHeight/2) + originY,
      where originX and originY are derived from viewportWidth and
      viewportHeight so the center viewport tile projects to canvas
      center. The glyph anchor sits at the diamond's top-center so that
      a charWidth-wide glyph renders horizontally centered within the
      diamond.
    inputs:
      - 'vx, vy (number, viewport tile coordinates; may be fractional)'
      - 'charWidth, charHeight'
      - 'viewportWidth, viewportHeight'
    outputs:
      - 'Pixel position { px, py } at the diamond glyph anchor'
    state_changes: []
    determinism: deterministic

  - id: screen-to-tile-roundtrip
    description: >
      screenToTile is the inverse of viewportToScreen for any tile that
      viewportToScreen places onscreen. For a tile at world (wx, wy)
      projected to (px, py), screenToTile of any pixel inside that
      tile's diamond returns (wx, wy). This property is what keeps
      click-to-move, hover, click-to-interact, and shift+click waypoints
      working.
    inputs:
      - 'canvasX, canvasY (CSS pixels from MouseEvent.offsetX/offsetY)'
      - 'camera, charWidth, charHeight, viewportWidth, viewportHeight'
    outputs:
      - 'Position { x, y } in world tile coordinates'
    state_changes: []
    determinism: deterministic

  - id: renderer-projects-all-layers
    description: >
      renderer.ts routes every tile-anchored draw call through
      viewportToScreen / worldToScreen. This includes the base tile loop,
      cursor highlight inversion, facing-entity highlight, pending-target
      highlight, selectedPositions, path dots, hover preview, drop
      targets, ground items, characters, bees, monarchs, ghosts, angels,
      meteorites, satellites, ECS tweened entities, rain overlays,
      lightning paths, explosion/wildfire/pickup-bloom/crumble effects,
      ruin layers, earth-scan aura background, glinting sparkles, and
      action-bar previews. Cell-background fills go through
      drawCellBackground, which paints a 2:1 diamond. Glyphs draw via
      fillText at the cell's projected anchor.
    inputs:
      - 'render(ctx, state, metrics, time) called from rAF loop'
    outputs:
      - 'Canvas frame with every entity painted at the projected position'
    state_changes: []
    determinism: deterministic

  - id: viewport-loop-expansion
    description: >
      The visible viewport is a rotated rectangle in tile space, so the
      naive viewport tile-loop bounds (vx, vy in [0..viewportWidth) x
      [0..viewportHeight)) under-paint the corners. The renderer expands
      the loop bounds by viewportHeight tiles in each axis. Off-canvas
      cells are cheaply skipped because viewportToScreen produces
      (px, py) outside the canvas and the canvas clips them.
    inputs:
      - 'state.viewportWidth, state.viewportHeight'
    outputs:
      - 'Tile-loop range expanded so all visible diamonds are painted'
    state_changes: []
    determinism: deterministic

  - id: cursor-highlight-diamond
    description: >
      drawCellBackground paints a filled diamond path. The diamond's
      four vertices are top, right, bottom, left of the
      (2*charWidth)x(charHeight) bounding box anchored at the glyph
      position. The pink cursor invert fills the cell with ACTION_COLOR
      (#ff69b4) and draws the glyph in BG_COLOR.
    inputs:
      - 'ctx (2D canvas context)'
      - 'px, py (cell glyph anchor in pixels)'
      - 'charWidth, charHeight'
      - 'fill color'
    outputs:
      - 'Canvas paint: beginPath/moveTo/lineTo x3/closePath/fill'
    state_changes: []
    determinism: deterministic

  - id: cursor-and-mouse-projection
    description: >
      cursor.ts recomputes state.cursorTile each frame from
      state.cursorScreenPos via screenToTile, and useMouse derives click
      and box-select tile coordinates the same way. Both call sites pass
      state.viewportWidth and state.viewportHeight so the inverse
      projection matches the renderer's forward projection.
    inputs:
      - 'state.cursorScreenPos (CSS pixels)'
      - 'MouseEvent.offsetX/offsetY (CSS pixels)'
    outputs:
      - 'state.cursorTile (Position) and click target Position match the tile under the cursor'
    state_changes:
      - field: cursorTile
        effect: 'set to the projected tile coordinate'
    determinism: deterministic

edge_cases:
  - id: fractional-world-coords
    description: 'ECS tweened entities pass fractional world coordinates (lerp.x, lerp.y) to viewportToScreen for smooth interpolation between tiles'
    expected: 'viewportToScreen handles fractional inputs without rounding; the resulting (px, py) is a smooth function of (vx, vy)'

  - id: zone-swap-overworld-to-cave
    description: 'Player walks onto a CaveEntrance tile and the map context swaps to the cave interior'
    expected: 'cave tiles render as diamonds; the projection helpers are unaware of zone'

  - id: diamond-cells-tile-the-plane
    description: 'Each diamond fits within a 2*charWidth by charHeight bounding rectangle; adjacent tiles share bounding-rectangle edges'
    expected: 'diamonds tile the plane; the cursor highlight diamond visually aligns with the four cardinal-adjacent tiles'

  - id: multiplayer-remote-players-project
    description: 'Remote players are drawn as @ glyphs at their tile coordinates'
    expected: 'remote players project through the same worldToScreen helper; no protocol change'

failure_conditions:
  - trigger: 'Renderer keeps an inline px = vx * charWidth, py = vy * charHeight calculation outside the projection helpers'
    expected: 'visual drift between layers (e.g. base tiles vs lightning paths); spec is violated; renderer must route every draw call through viewportToScreen / worldToScreen'

  - trigger: 'screenToTile and viewportToScreen are not exact inverses for tiles inside their diamond'
    expected: 'click-to-move sends the player to the wrong tile; hover highlight does not match the cell under the cursor; round-trip property test fails'

  - trigger: 'Cell-background fillRect is left in place while drawCellBackground is used elsewhere'
    expected: 'cursor highlight or facing-entity highlight paints a rectangle on a diamond grid, producing visual artifacts; spec is violated'

  - trigger: 'Viewport tile-loop bounds are not expanded'
    expected: 'corner tiles of the visible footprint are clipped; spec is violated'

verification:
  test_file: src/engine/__tests__/projection.test.ts
  test_pattern: 'projection'
  command: 'npx vitest run src/engine/__tests__/projection.test.ts src/engine/__tests__/coordinates.test.ts'
