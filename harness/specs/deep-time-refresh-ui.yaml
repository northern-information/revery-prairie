id: deep-time-refresh-ui
name: Deep time tick must trigger UI refresh during burning and simulating phases
priority: high
layer: engine
source_files:
  - src/engine/gameLoop.ts
  - src/engine/deepTime.ts
dependencies:
  - deep-time-endgame

behaviors:
  - id: throttled-refresh-during-burning
    description: >
      During the burning phase of deep time, the game loop's deep-time
      tick entry must call onRefreshUI at a throttled rate (~100ms) so
      that the React sidebar re-renders to show the burning phase label
      and any progress indication. Without this, the sidebar appears
      frozen because the canvas renderer runs independently via rAF
      while React only updates when refreshUI bumps the version counter.
    inputs:
      - deepTime.active is true and deepTime.phase is burning
      - game loop tick fires at 0ms interval (every frame)
    outputs:
      - onRefreshUI callback invoked approximately every 100ms
      - sidebar displays burning phase label without requiring mouse movement
    state_changes:
      - field: uiVersion
        effect: incremented every ~100ms during burning phase
    determinism: time-based

  - id: throttled-refresh-during-simulating
    description: >
      During the simulating phase of deep time, the game loop's
      deep-time tick entry must call onRefreshUI at a throttled rate
      (~100ms) so that the React sidebar re-renders to show the
      advancing year counter and progress bar. This matches the pattern
      used by the genesis tick entry which has the same year counter
      and progress bar UI.
    inputs:
      - deepTime.active is true and deepTime.phase is simulating
      - game loop tick fires at 0ms interval (every frame)
    outputs:
      - onRefreshUI callback invoked approximately every 100ms
      - sidebar year counter advances smoothly without requiring mouse movement
      - sidebar progress bar fills smoothly
    state_changes:
      - field: uiVersion
        effect: incremented every ~100ms during simulating phase
    determinism: time-based

  - id: no-refresh-during-wandering
    description: >
      During the wandering phase, the deep-time tick is a no-op and
      must not call onRefreshUI. Normal game systems handle refresh
      during wandering (movement, hover, etc).
    inputs:
      - deepTime.active is true and deepTime.phase is wandering
    outputs:
      - onRefreshUI not called by the deep-time tick entry
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: mouse-move-no-longer-required
    description: Previously the year counter only advanced visually when the mouse moved because hover events incidentally triggered React re-renders
    expected: Year counter and progress bar update smoothly at ~10fps regardless of mouse activity
  - id: refresh-rate-matches-genesis
    description: The deep-time tick uses the same ~100ms throttle interval as the genesis tick entry
    expected: Sidebar updates at approximately the same rate during deep time as during genesis

failure_conditions:
  - trigger: Deep time active in burning or simulating phase with no mouse or keyboard input
    expected: Sidebar still updates year counter and phase label at ~100ms intervals
  - trigger: onRefreshUI called every frame (0ms interval) instead of throttled
    expected: Must be throttled to ~100ms to avoid excessive React re-renders

verification:
  test_file: src/engine/__tests__/deepTime.test.ts
  test_pattern: refreshUI|onRefreshUI|refresh
  command: npx vitest run src/engine/__tests__/deepTime.test.ts
