id: shooting-stars
name: 'Shooting stars and cardinal meteor showers'
priority: medium
layer: engine
source_files:
  - src/engine/celestial.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/constants.ts
dependencies: []

behaviors:
  - id: ambient-star-spawning
    description: >
      spawnShootingStar creates ambient shooting stars at 15% chance
      per 2000ms tick. max 5 concurrent stars. suppressed during active
      meteor showers and during deep time (deepTime.active). every
      ambient star originates from the top edge of the map (y = 0) at a
      random x in [0, MAP_WIDTH) and moves with a fixed velocity of
      { dx: 1, dy: 1 } — the iso "straight down the screen from due
      north" axis. no random edge selection, no cardinal-only block,
      no velocity variation. stars are ECS entities with Position,
      Velocity, ShootingStarData, EntityTag (shootingStar), EntityZone
      (overworld). each star has random length (3-6 tiles). ambient
      stars never land — willLand is always false. the
      SHOOTING_STAR_LAND_CHANCE constant is removed; landing is now an
      exclusive property of targeted (shower) stars. ambient stars
      traverse the map and expire off-edge. the METEORITE_GROUND_MAX
      cap no longer gates ambient spawning because ambient stars cannot
      produce meteorites; the cap remains as a defensive ceiling that
      gates only spawnShootingStarAtTarget when the cardinal scheduler
      tries to spawn a non-steward shower star above the cap.
    inputs:
      - 'spawnShootingStar called on tick'
    outputs: []
    state_changes:
      - field: world
        effect: 'shooting star ECS entity created with Position, Velocity, ShootingStarData (willLand=false), EntityTag, EntityZone'
    determinism: probabilistic

  - id: star-tick-movement
    description: >
      tickShootingStars moves each star by its velocity every 80ms
      tick. increments age. stars are removed when off-map (beyond
      length + 1 buffer) or age exceeds SHOOTING_STAR_MAX_AGE (300
      ticks, ~24 seconds). only targeted (willLand=true) stars land.
      they convert to meteorite + explosion ECS entities on first
      walkable tile (Dirt or Clover) that is not a water tile (pond or
      river). on water tiles, only the explosion entity is created (no
      meteorite). targeted stars land unconditionally on their target
      tile (destroyed immediately on arrival regardless of occupancy).
      ambient stars (willLand=false) never produce meteorites or
      explosions — they only render and expire.
    inputs:
      - 'tickShootingStars called with time'
    outputs: []
    state_changes:
      - field: world
        effect: 'star positions updated, expired stars destroyed, meteorite + explosion entities created on targeted-star landing only'
    determinism: time-based

  - id: targeted-star-spawning
    description: >
      spawnShootingStarAtTarget creates a star guaranteed to land on
      a specific position. always uses a velocity of { dx: 1, dy: 1 }
      (the iso north axis) — callers do not pass an explicit direction.
      traces backward from target along that velocity to find a
      starting position outside map bounds. sets willLand true and
      landingTarget. used by cardinal meteor showers. an optional
      forPlayerSpawn flag marks the star as a player-emergence
      beacon — on landing it suppresses the meteorite ground-item drop
      and notifies the player-spawn system so the corresponding player
      becomes visible on impact. only the spring-equinox shower at
      game start carries a star with this flag (see
      cardinal-shower-scheduling and the player-spawn spec).
    inputs:
      - 'GameState, target Position, optional forPlayerSpawn flag, optional backtrackTiles'
    outputs: []
    state_changes:
      - field: world
        effect: 'targeted shooting star ECS entity created (with PlayerSpawnTarget tag when forPlayerSpawn is set)'
    determinism: deterministic

  - id: cardinal-shower-scheduling
    description: >
      tickMeteorShower manages the shower state machine. suppressed
      during deep time (deepTime.active). showers are no longer
      scheduled by elapsed wall-clock time — they fire when
      state.seasonalPhase crosses each cardinal anchor of the seasonal
      year (anchors: 0.0 spring equinox, 0.25 summer solstice, 0.5
      autumn equinox, 0.75 winter solstice). every year fires exactly
      four showers, one per anchor. no other showers exist between
      anchors. no interval-based intermittent scheduling, no 120-240s
      timer, no METEOR_SHOWER_MIN_INTERVAL_MS / METEOR_SHOWER_MAX_INTERVAL_MS.
      jitter contract — the summer, autumn, and winter anchors each
      fire at anchor + random(-METEOR_SHOWER_JITTER_PHASE, +METEOR_SHOWER_JITTER_PHASE),
      with the jitter rolled once per year per anchor when the anchor
      becomes the next pending one. spring is special: the spring
      anchor always fires at exactly phase 0.0 with no jitter. this
      reliability is required because the very first spring shower of
      a run is the player-spawn ceremony (see player-spawn spec) and
      must fire deterministically at game start. crossing detection —
      the scheduler tracks meteorShower.pendingAnchorPhase
      (next firing phase in [0, 1)) and meteorShower.lastFiredAnchorYear
      (count of completed year-wraps since game start, derived from
      seasonalPhase modulo-1 transitions). when seasonalPhase advances
      past pendingAnchorPhase within the current year, the shower
      starts. when a shower completes, the scheduler computes the next
      pending anchor for the current year, or rolls over to the spring
      anchor of the next year and increments lastFiredAnchorYear after
      winter completes. when a shower starts: active=true, calculate
      remainingStars (8-12), spread over a 4-second window. each
      interval tick spawns one targeted star with the fixed
      { dx: 1, dy: 1 } iso-north velocity. when remainingStars=0:
      active=false, advance pending anchor. records
      event:meteor-shower discovery on the first shower of the run.
      there is no radiant — all stars in every shower fall along the
      same axis. the first spring shower of the run (game-start) is
      also the player-spawn ceremony: one of its stars is pre-targeted
      at state.player with forPlayerSpawn=true (the steward star);
      subsequent spring showers carry no forPlayerSpawn star.
    inputs:
      - 'tickMeteorShower called with time'
    outputs: []
    state_changes:
      - field: meteorShower
        effect: 'state machine transitions between idle and active; pendingAnchorPhase and lastFiredAnchorYear advance as anchors are consumed'
      - field: world
        effect: 'targeted shooting star entities created during active shower; the first spring shower of the run carries one forPlayerSpawn star'
      - field: manualDiscoveries
        effect: 'event:meteor-shower recorded on first shower'
    determinism: time-based

  - id: shower-target-selection
    description: >
      findShowerTargets selects landing positions for shower stars.
      criteria: Dirt or Clover tile (not Sand, CaveFloor, or other
      walkable types), not a water tile (pond or river), within
      SPACE_BORDER, not occupied by player or entities (checked via
      isTileOccupied), minimum 5-tile manhattan distance between
      targets. max attempts = count * 50 to prevent infinite loops.
    inputs:
      - 'GameState, count'
    outputs:
      - 'Position[] of valid landing targets (may be fewer than count)'
    state_changes: []
    determinism: probabilistic

edge_cases:
  - id: max-active-stars
    description: '5 stars already active, spawnShootingStar called'
    expected: 'returns early, no new star created'
  - id: shower-suppresses-ambient
    description: 'meteor shower active, ambient spawn called'
    expected: 'spawnShootingStar returns early during active shower'
  - id: star-off-map
    description: 'star moves beyond map bounds by more than length + 1'
    expected: 'star entity destroyed'
  - id: targeted-star-lands-unconditionally
    description: 'targeted star reaches its landingTarget tile'
    expected: 'star is destroyed and meteorite + explosion created regardless of tile occupancy'
  - id: ambient-star-never-lands
    description: 'ambient star traverses the map'
    expected: 'star has willLand=false and produces no meteorite or explosion entity; it expires off-map or by max age'
  - id: sparse-map-shower
    description: 'very few valid landing tiles for shower targets'
    expected: 'findShowerTargets returns fewer targets, shower spawns fewer stars'
  - id: deep-time-suppression
    description: 'spawnShootingStar or tickMeteorShower called during deep time'
    expected: 'both return early without spawning or scheduling'
  - id: spring-anchor-no-jitter
    description: 'spring anchor (phase 0.0) becomes the pending anchor'
    expected: 'pendingAnchorPhase is set to exactly 0.0 — no jitter applied to the spring anchor under any circumstances'
  - id: non-spring-anchor-jitter
    description: 'summer, autumn, or winter anchor becomes the pending anchor'
    expected: 'pendingAnchorPhase is set to anchor + random offset in [-METEOR_SHOWER_JITTER_PHASE, +METEOR_SHOWER_JITTER_PHASE]; jitter is rolled once and reused if the shower is interrupted (e.g. by deep time) and resumes the same year'
  - id: cardinal-shower-fires-once-per-anchor-per-year
    description: 'seasonalPhase advances past pendingAnchorPhase'
    expected: 'exactly one shower starts; the same anchor does not re-fire until the seasonalPhase wraps through 1.0 and the next year rolls in'
  - id: no-intermittent-showers
    description: 'tickMeteorShower called repeatedly during the interior of a season (e.g. seasonalPhase = 0.12, far from any pending anchor)'
    expected: 'no shower is queued or started — only crossings of pendingAnchorPhase trigger showers'
  - id: spring-equinox-spawn-ceremony
    description: 'game start at seasonalPhase = 0.0 and playerSpawn.triggeredAt is 0'
    expected: 'the spring-equinox shower fires immediately with one star carrying forPlayerSpawn=true pre-targeted at state.player; player becomes visible on its landing'
  - id: subsequent-spring-no-steward-star
    description: 'spring equinox in any year after the first'
    expected: 'spring shower fires at phase 0.0 with no forPlayerSpawn star; player visibility is unaffected'
  - id: ambient-bypasses-ground-cap
    description: 'METEORITE_GROUND_MAX (20) meteorites already on ground, ambient spawn called'
    expected: 'ambient star spawns normally — the cap no longer gates ambient spawning because ambient stars cannot produce meteorites'
  - id: ambient-star-spawn-position
    description: 'spawnShootingStar called repeatedly under randomized RNG'
    expected: 'every spawned star has y === 0 and velocity { dx: 1, dy: 1 }; x varies across [0, MAP_WIDTH)'
  - id: shower-star-velocity-uniform
    description: 'a meteor shower spawns its full complement of stars'
    expected: 'every spawned shower star has velocity { dx: 1, dy: 1 } — no radiant variation between showers or within a shower'
  - id: deep-time-skips-pending-anchor
    description: 'deep time activates before a pending anchor fires; seasonalPhase advances past pendingAnchorPhase during deep time'
    expected: 'the missed anchor does not re-fire when deep time ends; the scheduler advances pendingAnchorPhase to the next anchor of the current year (or next year, if winter was skipped)'
  - id: year-wrap-advances-to-spring
    description: 'winter shower completes; seasonalPhase continues advancing past 1.0 and wraps to 0.0'
    expected: 'lastFiredAnchorYear increments; pendingAnchorPhase is set to 0.0 (spring) for the new year; the new spring shower is a normal shower (no forPlayerSpawn) because playerSpawn.triggeredAt is non-zero'

failure_conditions:
  - trigger: 'Cardinal shower fires but no valid targets found'
    expected: 'shower spawns 0 stars, transitions to idle, advances pendingAnchorPhase to the next anchor'

verification:
  test_file: src/engine/__tests__/shootingStars.test.ts
  test_pattern: 'shooting star'
  command: 'npx vitest run src/engine/__tests__/shootingStars.test.ts'
