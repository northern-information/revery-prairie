id: shooting-stars
name: 'Shooting stars and meteor showers'
priority: medium
layer: engine
source_files:
  - src/engine/celestial.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/constants.ts
dependencies: []

behaviors:
  - id: ambient-star-spawning
    description: >
      spawnShootingStar creates ambient shooting stars at 15% chance
      per 2000ms tick. max 5 concurrent stars. suppressed during active
      meteor showers, during deep time (deepTime.active), and when the
      overworld already contains METEORITE_GROUND_MAX (20) or more
      meteorite entities on the ground (shooting stars simply do not
      spawn while at cap — no fizzle, no FIFO removal). every ambient
      star originates from the top edge of the map (y = 0) at a random
      x in [0, MAP_WIDTH) and moves with a fixed velocity of
      { dx: 1, dy: 1 } — the iso "straight down the screen from due
      north" axis. no random edge selection, no cardinal-only block,
      no velocity variation. stars are ECS entities with Position,
      Velocity, ShootingStarData, EntityTag (shootingStar), EntityZone
      (overworld). each star has random length (3-6 tiles) and 8%
      chance to land.
    inputs:
      - 'spawnShootingStar called on tick'
    outputs: []
    state_changes:
      - field: world
        effect: 'shooting star ECS entity created with Position, Velocity, ShootingStarData, EntityTag, EntityZone'
    determinism: probabilistic

  - id: star-tick-movement
    description: >
      tickShootingStars moves each star by its velocity every 80ms
      tick. increments age. stars are removed when off-map (beyond
      length + 1 buffer) or age exceeds SHOOTING_STAR_MAX_AGE (300
      ticks, ~24 seconds). landing stars convert to meteorite +
      explosion ECS entities on first walkable tile (Dirt or Clover)
      that is not a water tile (pond or river). on water tiles, only
      the explosion entity is created (no meteorite). targeted stars
      land unconditionally on their target tile (destroyed immediately
      on arrival regardless of occupancy).
    inputs:
      - 'tickShootingStars called with time'
    outputs: []
    state_changes:
      - field: world
        effect: 'star positions updated, expired stars destroyed, meteorite + explosion entities created on landing'
    determinism: time-based

  - id: targeted-star-spawning
    description: >
      spawnShootingStarAtTarget creates a star guaranteed to land on
      a specific position. always uses a velocity of { dx: 1, dy: 1 }
      (the iso north axis) — callers no longer pass an explicit
      direction. traces backward from target along that velocity to
      find a starting position outside map bounds. sets willLand true
      and landingTarget. used by meteor showers. an optional
      forPlayerSpawn flag marks the star as a player-emergence
      beacon — on landing it suppresses the meteorite ground-item drop
      and notifies the player-spawn system so the corresponding player
      becomes visible on impact.
    inputs:
      - 'GameState, target Position, optional forPlayerSpawn flag, optional backtrackTiles'
    outputs: []
    state_changes:
      - field: world
        effect: 'targeted shooting star ECS entity created (with PlayerSpawnTarget tag when forPlayerSpawn is set)'
    determinism: deterministic

  - id: meteor-shower-scheduling
    description: >
      tickMeteorShower manages shower state machine. suppressed during
      deep time (deepTime.active). the very first shower is NOT
      scheduled by elapsed time — it is initiated by the player-spawn
      system via triggerPlayerSpawnShower (see player-spawn spec).
      once that first shower completes, subsequent showers schedule on
      the existing random interval [120s, 240s]. when time arrives:
      active=true, calculate remainingStars (8-12), spread over
      4-second window. each interval tick spawns one targeted star
      with the fixed { dx: 1, dy: 1 } iso-north velocity. when
      remainingStars=0: active=false, schedule next shower. records
      event:meteor-shower discovery on first shower regardless of
      trigger source. there is no radiant — all stars in every shower
      fall along the same axis.
    inputs:
      - 'tickMeteorShower called with time'
    outputs: []
    state_changes:
      - field: meteorShower
        effect: 'state machine transitions between idle and active'
      - field: world
        effect: 'targeted shooting star entities created during active shower'
      - field: manualDiscoveries
        effect: 'event:meteor-shower recorded on first shower'
    determinism: probabilistic

  - id: player-spawn-shower-trigger
    description: >
      triggerPlayerSpawnShower(state, playerPos, time) starts a meteor
      shower immediately and pre-targets one of its stars at playerPos
      so the star lands within ~2000ms of the trigger. the shower
      otherwise behaves like a normal shower (8-12 stars, 4s spawn
      window). every star — including the steward star aimed at the
      spawning player — uses the fixed { dx: 1, dy: 1 } iso-north
      velocity. the steward star is flagged forPlayerSpawn so it
      produces no meteorite item on landing. the remaining stars
      target tiles via findShowerTargets (drop meteorites). this is
      the only path that initiates the first shower of the game; it
      generalizes to multiplayer — every newly-spawned player triggers
      their own shower with a star aimed at their spawn tile.
    inputs:
      - 'GameState, player spawn Position, time'
    outputs: []
    state_changes:
      - field: meteorShower
        effect: 'active=true, remainingStars set, spawn window primed; nextShowerTime advanced past the active window'
      - field: world
        effect: 'one targeted player-spawn star created immediately at playerPos with forPlayerSpawn flag; further targeted stars spawn over the 4s window'
    determinism: probabilistic

  - id: shower-target-selection
    description: >
      findShowerTargets selects landing positions for shower stars.
      criteria: Dirt or Clover tile (not Sand, CaveFloor, or other
      walkable types), not a water tile (pond or river), within
      SPACE_BORDER, not occupied by player or entities (checked via
      isTileOccupied), minimum 5-tile manhattan distance between
      targets. max attempts = count * 50 to prevent infinite loops.
    inputs:
      - 'GameState, count'
    outputs:
      - 'Position[] of valid landing targets (may be fewer than count)'
    state_changes: []
    determinism: probabilistic

edge_cases:
  - id: max-active-stars
    description: '5 stars already active, spawnShootingStar called'
    expected: 'returns early, no new star created'
  - id: shower-suppresses-ambient
    description: 'meteor shower active, ambient spawn called'
    expected: 'spawnShootingStar returns early during active shower'
  - id: star-off-map
    description: 'star moves beyond map bounds by more than length + 1'
    expected: 'star entity destroyed'
  - id: targeted-star-lands-unconditionally
    description: 'targeted star reaches its landingTarget tile'
    expected: 'star is destroyed and meteorite + explosion created regardless of tile occupancy'
  - id: sparse-map-shower
    description: 'very few valid landing tiles for shower targets'
    expected: 'findShowerTargets returns fewer targets, shower spawns fewer stars'
  - id: deep-time-suppression
    description: 'spawnShootingStar or tickMeteorShower called during deep time'
    expected: 'both return early without spawning or scheduling'
  - id: meteorite-ground-cap-reached
    description: 'overworld already has METEORITE_GROUND_MAX (20) meteorite entities, spawnShootingStar called'
    expected: 'returns early, no new star created; player picking up a meteorite drops count below cap and future ticks may resume spawning'
  - id: meteorite-cap-excludes-backpack
    description: 'player holds meteorite items in backpack, zero meteorites on overworld ground'
    expected: 'cap does not apply — only ECS meteorite entities (ground-placed, overworld zone) count toward the 20-entity limit'
  - id: meteorite-cap-excludes-cave
    description: 'cave has meteorite entities (hypothetical), overworld ground is empty'
    expected: 'cap counts only overworld-zoned meteorite entities; cave meteorites are ignored'
  - id: meteor-shower-bypasses-cap
    description: 'meteor shower active and 20+ meteorites already on ground'
    expected: 'shower continues spawning targeted stars — the cap only gates ambient spawnShootingStar, not targeted spawns'
  - id: ambient-star-spawn-position
    description: 'spawnShootingStar called repeatedly under randomized RNG'
    expected: 'every spawned star has y === 0 and velocity { dx: 1, dy: 1 }; x varies across [0, MAP_WIDTH)'
  - id: shower-star-velocity-uniform
    description: 'a meteor shower spawns its full complement of stars'
    expected: 'every spawned shower star has velocity { dx: 1, dy: 1 } — no radiant variation between showers or within a shower'

failure_conditions:
  - trigger: 'Meteor shower scheduled but no valid targets found'
    expected: 'shower spawns 0 stars, transitions to idle, schedules next shower'

verification:
  test_file: src/engine/__tests__/shootingStars.test.ts
  test_pattern: 'shooting star'
  command: 'npx vitest run src/engine/__tests__/shootingStars.test.ts'
