id: coyote-follow-collect-bugs
name: 'Coyote Follow and Collect Bug Fixes'
priority: high
layer: engine
source_files:
  - src/engine/coyote.ts
  - src/engine/constants.ts
  - src/engine/__tests__/coyote.test.ts
  - src/engine/__tests__/helpers.ts
dependencies:
  - coyote-companion

behaviors:
  - id: follow-distance-threshold
    description: >
      when coyoteMode is 'follow', the coyote should begin moving toward
      the player when chebyshev distance is >= COYOTE_FOLLOW_MAX_DIST (3).
      the coyote idles only when distance is < COYOTE_FOLLOW_MAX_DIST
      and > 0. this means at exactly distance 3 the coyote steps toward
      the player, not idles. tickFollow uses >= comparison for the
      max-distance check.
    inputs:
      - "coyoteMode === 'follow'"
      - 'chebyshev distance from coyote to player >= COYOTE_FOLLOW_MAX_DIST'
    outputs:
      - 'coyote takes one step toward the player'
    state_changes:
      - field: 'world (coyote entity Position component)'
        effect: 'moved one tile along A* path toward player'
    determinism: deterministic

  - id: collect-all-ground-items
    description: >
      findNearestCollectible finds all ground items regardless of
      definitionId. it queries both ECS entity systems: ItemDrop +
      EntityTag('groundItem') for standard ground items (honey, coins,
      clover, etc.) and Pickupable + EntityTag('meteorite') for
      meteorites spawned by celestial.ts. no allowlist filtering is
      applied — COYOTE_COLLECTIBLE_DEFINITIONS is removed. the coyote
      picks up whichever item is closest by manhattan distance.
    inputs:
      - "coyoteMode === 'collect'"
      - 'any ground item entities exist on current map'
    outputs:
      - 'findNearestCollectible returns the nearest ground item entity'
      - 'coyote pathfinds to and picks up the item'
    state_changes:
      - field: coyoteCargo
        effect: 'set to definitionId of picked-up item'
      - field: world
        effect: 'ground item entity destroyed on pickup'
    determinism: deterministic

edge_cases:
  - id: follow-at-exact-max-distance
    description: 'coyote is exactly COYOTE_FOLLOW_MAX_DIST (3) tiles from player in follow mode'
    expected: 'coyote moves one step toward player'
  - id: mixed-item-types-on-map
    description: 'multiple item types exist on the map (meteorite, honey, coin, clover, etc.)'
    expected: 'coyote targets whichever is closest by manhattan distance, regardless of type'
  - id: single-item-type-on-map
    description: 'only one type of ground item exists (e.g. only coins)'
    expected: 'coyote finds and collects the item'

failure_conditions:
  - trigger: 'coyote is exactly 3 tiles from player in follow mode'
    expected: 'coyote moves toward player, not idles'
  - trigger: 'meteorite entity with Pickupable + EntityTag meteorite exists on map, coyote in collect mode'
    expected: 'coyote detects and pathfinds to meteorite, not idles'
  - trigger: 'test creates meteorite via createGroundItemEntity with wrong component scheme'
    expected: 'test uses createMeteoriteEntity helper which matches production entity shape'

verification:
  test_file: src/engine/__tests__/coyote.test.ts
  test_pattern: 'coyote'
  command: 'npx vitest run src/engine/__tests__/coyote.test.ts'
