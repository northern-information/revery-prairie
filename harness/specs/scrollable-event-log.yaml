id: scrollable-event-log
name: 'Scrollable Event Log'
status: planned
priority: medium
layer: component
source_files:
  - src/components/Sidebar.tsx
dependencies: []

behaviors:
  - id: log-scrollable-container
    description: >
      the event log section in the Sidebar replaces the fixed
      slice(0, 8) display with a scrollable container. the container
      has a max-height that shows approximately 8 entries, with
      overflow-y-auto to scroll through all log entries (up to the
      existing 50-entry cap in useEventLog). newest entries appear at
      the top. the scrollbar uses the existing scrollbar-custom class.
    inputs:
      - 'sidebar rendered with eventLog containing entries'
    outputs:
      - 'all log entries rendered inside scrollable container'
      - 'container scrollable when entries exceed visible area'
    state_changes: []
    determinism: deterministic

  - id: log-scroll-position-preserved
    description: >
      when the user has scrolled down in the log and a new event
      arrives, the scroll position is preserved (does not jump to
      top). if the user is already scrolled to the top, new events
      appear at the top and remain visible.
    inputs:
      - 'user has scrolled the log container'
      - 'new event added via addEvent'
    outputs:
      - 'scroll position unchanged if user scrolled away from top'
      - 'new entry visible if user was at top'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: log-empty
    description: 'event log has zero entries'
    expected: 'log section hidden (existing behavior preserved)'
  - id: log-fewer-than-visible
    description: 'event log has fewer entries than the visible area fits'
    expected: 'no scrollbar shown, all entries visible'
  - id: log-at-cap
    description: 'event log is at the 50-entry cap and new event arrives'
    expected: 'oldest entry removed, new entry at top, scrollbar adjusts'

failure_conditions:
  - trigger: 'rapid events flood the log (e.g. chain meteorite explosions)'
    expected: 'all events rendered, scroll position stable, no layout thrashing'
  - trigger: 'log container overflows sidebar height'
    expected: 'max-height constrains the log, sidebar layout not disrupted'

verification:
  test_file: src/components/__tests__/Sidebar.test.tsx
  test_pattern: 'log'
  command: 'npx vitest run src/components/__tests__/Sidebar.test.tsx'
