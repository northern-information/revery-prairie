id: player-movement
name: 'Player movement'
status: implemented
priority: critical
layer: engine
source_files:
  - src/engine/movement.ts
  - src/engine/interaction.ts
  - src/engine/position.ts
  - src/engine/camera.ts
  - src/engine/gameLoop.ts
dependencies: []

behaviors:
  - id: cardinal-movement
    description: >
      movePlayer shifts player position by exactly 1 tile in the
      specified cardinal direction and returns true
    inputs:
      - 'GameState with player at walkable position'
      - "Direction: 'up' | 'down' | 'left' | 'right'"
    outputs:
      - 'boolean: true when move succeeds'
    state_changes:
      - field: player.x
        effect: 'changes by DIRECTIONS[dir].x'
      - field: player.y
        effect: 'changes by DIRECTIONS[dir].y'
      - field: playerFacing
        effect: 'set to the direction argument'
      - field: camera.x
        effect: 'updated via updateCamera: player-centered with clamping, or map-centered when map is smaller than viewport'
      - field: camera.y
        effect: 'updated via updateCamera: player-centered with clamping, or map-centered when map is smaller than viewport'
      - field: trail
        effect: 'previous position pushed to trail array, oldest entry shifted off if trail exceeds TRAIL_MAX_LENGTH'
      - field: glintingCoins
        effect: 'if player steps onto a glint zone tile in the overworld, all non-glinting backpack coins are added to glintingCoins set'
      - field: manualDiscoveries
        effect: 'event:glint-zone recorded on first glint zone entry'
      - field: currentZone
        effect: 'may change via checkTransition if player steps on a CaveEntrance tile (zone swap between overworld and cave)'
    determinism: deterministic

  - id: movement-blocked-by-non-walkable
    description: >
      movePlayer returns false and does not mutate position when the
      target tile is non-walkable. isWalkableTile rejects Space,
      CaveWall, and CaveBreakableWall tile types.
    inputs:
      - 'GameState with player adjacent to a non-walkable tile'
      - 'Direction toward the non-walkable tile'
    outputs:
      - 'boolean: false'
    state_changes:
      - field: playerFacing
        effect: 'set to dir (see facing-entity-update)'
      - field: facingEntityPos
        effect: 'recalculated (see facing-entity-update)'
    determinism: deterministic

  - id: movement-blocked-by-ground-omnibox
    description: >
      movePlayer returns false and does not mutate position when the
      target tile contains a ground omnibox
    inputs:
      - 'GameState with a ground omnibox adjacent to player'
      - 'Direction toward the omnibox tile'
    outputs:
      - 'boolean: false'
    state_changes:
      - field: playerFacing
        effect: 'set to dir (see facing-entity-update)'
      - field: facingEntityPos
        effect: 'recalculated (see facing-entity-update)'
    determinism: deterministic

  - id: movement-blocked-by-character
    description: >
      movePlayer returns false and does not mutate position when the
      target tile is occupied by a character
    inputs:
      - 'GameState with a character adjacent to player'
      - 'Direction toward the character tile'
    outputs:
      - 'boolean: false'
    state_changes:
      - field: playerFacing
        effect: 'set to dir (see facing-entity-update)'
      - field: facingEntityPos
        effect: 'recalculated (see facing-entity-update)'
    determinism: deterministic

  - id: facing-entity-update
    description: >
      after any move attempt (successful or not), playerFacing is set
      to the direction argument and facingEntityPos is recalculated
      via updateFacingEntity to highlight the nearest interactable
      (ground omnibox, character, or cave breakable wall)
    inputs:
      - 'GameState'
      - 'Direction'
    outputs: []
    state_changes:
      - field: playerFacing
        effect: 'set to dir'
      - field: facingEntityPos
        effect: 'set to adjacent interactable position in facing direction, or null'
    determinism: deterministic

  - id: movement-suppressed-during-deep-time
    description: >
      when state.deepTime is active and the phase is not Wandering
      (i.e. Burning or Simulating), both the path tick system and the
      keyboard-move tick system return early without processing any
      movement. movement re-enables when the phase transitions to
      Wandering, allowing the player to explore freely as a ghost.
    inputs:
      - 'state.deepTime.active is true, phase is Burning or Simulating'
    outputs:
      - 'no movement processed'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: map-boundary
    description: 'Player at (0,0) attempting up or left is rejected'
    expected: 'movePlayer returns false, position unchanged'
  - id: out-of-bounds
    description: 'Player at max map boundary attempting to move further out is rejected by isInBounds check'
    expected: 'movePlayer returns false, position unchanged'
  - id: small-map-camera-centering
    description: 'When map dimensions are smaller than viewport (e.g. cave zone), camera centers the map in the viewport using negative offset'
    expected: 'camera.x = -floor((viewportWidth - mapWidth) / 2) when mapWidth < viewportWidth, same for y axis'
  - id: deep-time-wandering-allows-movement
    description: 'During deep time Wandering phase, movement is not suppressed'
    expected: 'path and keyboard-move tick systems process movement normally'

failure_conditions:
  - trigger: 'Target tile is non-walkable (Space, CaveWall, CaveBreakableWall)'
    expected: 'movePlayer returns false, no state mutation to player position'
  - trigger: 'Target position is out of map bounds'
    expected: 'movePlayer returns false, no state mutation to player position'
  - trigger: 'Target tile occupied by ground omnibox'
    expected: 'movePlayer returns false, no state mutation to player position'
  - trigger: 'Target tile occupied by character'
    expected: 'movePlayer returns false, no state mutation to player position'
  - trigger: 'WASD or click-to-move during deep time Burning or Simulating phase'
    expected: 'tick systems return early, no movement processed'

verification:
  test_file: src/engine/__tests__/movement.test.ts
  test_pattern: 'movePlayer'
  command: 'npx vitest run src/engine/__tests__/movement.test.ts -t movePlayer'
