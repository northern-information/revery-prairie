id: player-movement
name: 'Player movement'
priority: critical
layer: engine
source_files:
  - src/engine/movement.ts
  - src/engine/interaction.ts
  - src/engine/position.ts
  - src/engine/camera.ts
  - src/engine/gameLoop.ts
  - src/engine/entities.ts
  - src/engine/cave.ts
dependencies: []

behaviors:
  - id: cardinal-movement
    description: >
      movePlayer shifts player position by exactly 1 tile in the
      specified cardinal direction and returns true
    inputs:
      - 'GameState with player at walkable position'
      - "Direction: 'up' | 'down' | 'left' | 'right'"
    outputs:
      - 'boolean: true when move succeeds'
    state_changes:
      - field: player.x
        effect: 'changes by DIRECTIONS[dir].x'
      - field: player.y
        effect: 'changes by DIRECTIONS[dir].y'
      - field: playerFacing
        effect: 'set to the direction argument'
      - field: camera.x
        effect: 'updated via updateCamera: player-centered with clamping, or map-centered when map is smaller than viewport'
      - field: camera.y
        effect: 'updated via updateCamera: player-centered with clamping, or map-centered when map is smaller than viewport'
      - field: trail
        effect: 'previous position pushed to trail array, oldest entry shifted off if trail exceeds TRAIL_MAX_LENGTH'
      - field: glintingCoins
        effect: 'if player steps onto a glint zone tile in the overworld, all non-glinting backpack coins are added to glintingCoins set'
      - field: manualDiscoveries
        effect: 'event:glint-zone recorded on first glint zone entry'
      - field: currentZone
        effect: 'may change via checkTransition if a CaveEntrance or RuinEntrance tile is within Chebyshev distance 1 of the player (overworld entry), or if the player steps on a CaveExit or RuinExit tile (interior exit)'
      - field: onPlayerMoved
        effect: >
          if non-null, invoked once after every successful movePlayer
          (after camera/facing updates, glint zone processing, and
          zone transition checks). engine-level hook — useGameEngine
          wires this to NetworkClient.sendPosition in online mode so
          remote peers see the move. movePlayer fires it on the
          post-transition path as well.
    determinism: deterministic

  - id: movement-blocked-by-non-walkable
    description: >
      movePlayer returns false and does not mutate position when the
      target tile is non-walkable. isWalkableTile rejects Space,
      CaveWall, and CaveBreakableWall tile types. water tiles (ponds
      and rivers) are freely traversable — they are NOT added to
      getBlockedPositions.
    inputs:
      - 'GameState with player adjacent to a non-walkable tile'
      - 'Direction toward the non-walkable tile'
    outputs:
      - 'boolean: false'
    state_changes:
      - field: playerFacing
        effect: 'set to dir (see facing-entity-update)'
      - field: facingEntityPos
        effect: 'recalculated (see facing-entity-update)'
    determinism: deterministic

  - id: water-traversable
    description: >
      Water tiles (ponds and rivers) are fully traversable by the
      player. movePlayer succeeds when stepping onto a pond or river
      tile. getBlockedPositions does not add state.ponds or
      state.rivers entries in the overworld. Pathfinding treats water
      at equal cost to any other walkable tile — no weighting or
      avoidance. No visual effect, no movement cost penalty.
    inputs:
      - 'GameState with player adjacent to a pond or river tile'
      - 'Direction toward the water tile'
    outputs:
      - 'boolean: true'
    state_changes:
      - field: player.x
        effect: 'changes by DIRECTIONS[dir].x, landing on water tile'
      - field: player.y
        effect: 'changes by DIRECTIONS[dir].y, landing on water tile'
    determinism: deterministic

  - id: movement-blocked-by-character
    description: >
      movePlayer returns false and does not mutate position when the
      target tile is occupied by a character
    inputs:
      - 'GameState with a character adjacent to player'
      - 'Direction toward the character tile'
    outputs:
      - 'boolean: false'
    state_changes:
      - field: playerFacing
        effect: 'set to dir (see facing-entity-update)'
      - field: facingEntityPos
        effect: 'recalculated (see facing-entity-update)'
    determinism: deterministic

  - id: facing-entity-update
    description: >
      after any move attempt (successful or not), playerFacing is set
      to the direction argument and facingEntityPos is recalculated
      via updateFacingEntity to highlight the nearest interactable
      (character or cave breakable wall)
    inputs:
      - 'GameState'
      - 'Direction'
    outputs: []
    state_changes:
      - field: playerFacing
        effect: 'set to dir'
      - field: facingEntityPos
        effect: 'set to adjacent interactable position in facing direction, or null'
    determinism: deterministic

  - id: movement-suppressed-during-deep-time
    description: >
      when state.deepTime is active and the phase is not Wandering
      (i.e. Burning or Simulating), both the path tick system and the
      keyboard-move tick system return early without processing any
      movement. movement re-enables when the phase transitions to
      Wandering, allowing the player to explore freely as a ghost.
    inputs:
      - 'state.deepTime.active is true, phase is Burning or Simulating'
    outputs:
      - 'no movement processed'
    state_changes: []
    determinism: deterministic

  - id: proximity-ground-item-pickup
    description: >
      after each successful movePlayer, pickUpGroundItems scans all 9 tiles
      in the player's 3x3 footprint (Chebyshev distance ≤ 1) for ground
      item entities and picks them all up in one pass. bees are excluded
      from proximity pickup — capturing a bee still requires the player
      to stand on the exact tile.
    inputs:
      - 'player position is within Chebyshev distance 1 of one or more ground item entities'
    outputs:
      - 'all ground items within range added to backpack; pickupBloom fires once'
    state_changes:
      - field: world
        effect: 'ground item entities within Chebyshev distance 1 destroyed; corresponding items placed in backpack'
    determinism: deterministic

edge_cases:
  - id: map-boundary
    description: 'Player at (0,0) attempting up or left is rejected'
    expected: 'movePlayer returns false, position unchanged'
  - id: out-of-bounds
    description: 'Player at max map boundary attempting to move further out is rejected by isInBounds check'
    expected: 'movePlayer returns false, position unchanged'
  - id: small-map-camera-centering
    description: 'When map dimensions are smaller than viewport (e.g. cave zone), camera centers the map in the viewport using negative offset'
    expected: 'camera.x = -floor((visibleWidth - mapWidth) / 2) where visibleWidth = viewportWidth - rightInsetTiles. same logic for y axis using viewportHeight directly (no inset).'
  - id: deep-time-wandering-allows-movement
    description: 'During deep time Wandering phase, movement is not suppressed'
    expected: 'path and keyboard-move tick systems process movement normally'
  - id: player-can-walk-onto-water
    description: 'Player walks onto a pond or river tile'
    expected: 'movePlayer returns true, player position updates to the water tile'
  - id: pathfinding-routes-through-water
    description: 'Click-to-move target is on the far side of a pond with no dry path'
    expected: 'A* finds a path straight through the water tiles; pathfinding treats water as walkable'
  - id: exit-placement-prevents-re-entry
    description: 'player exits cave or ruin and is placed at Chebyshev distance >= 2 from the overworld entrance'
    expected: 'player position falls outside the 3x3 entry hitbox; checkTransition does not fire immediately on the next move'
  - id: multiple-items-in-proximity
    description: 'player moves to a position with ground items in several neighboring tiles simultaneously'
    expected: 'all items within Chebyshev distance 1 are picked up in the same move; exactly one pickupBloom fires'
  - id: bee-proximity-exception
    description: 'player is adjacent to a bee but not standing on its tile'
    expected: 'bee is not captured; player must step onto the exact tile to capture'

failure_conditions:
  - trigger: 'Target tile is non-walkable (Space, CaveWall, CaveBreakableWall)'
    expected: 'movePlayer returns false, no state mutation to player position'
  - trigger: 'Target position is out of map bounds'
    expected: 'movePlayer returns false, no state mutation to player position'
  - trigger: 'Target tile occupied by character'
    expected: 'movePlayer returns false, no state mutation to player position'
  - trigger: 'WASD or click-to-move during deep time Burning or Simulating phase'
    expected: 'tick systems return early, no movement processed'

verification:
  test_file: src/engine/__tests__/movement.test.ts
  test_pattern: 'movePlayer'
  command: 'npx vitest run src/engine/__tests__/movement.test.ts -t movePlayer'
