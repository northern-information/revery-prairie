id: overworld-music-init
name: 'Overworld ambient music starts on game init'
priority: high
layer: integration
source_files:
  - src/hooks/useMusic.ts
  - src/engine/audio.ts
dependencies: []

behaviors:
  - id: ambient-starts-on-mount
    description: >
      When GameScreen mounts, useMusic calls setAmbient with the
      overworld zone URL. The ambient audio element is created,
      play is called (or deferred via safePlay if autoplay is
      blocked), and the volume fades from 0 to 1. This must
      survive React StrictMode's double-mount cycle: the cleanup
      effect resets tracking refs so the remount re-establishes
      the ambient audio that was destroyed by stopAll().
    inputs:
      - "GameScreen mounts with state.currentZone = 'overworld'"
      - 'state.musicEnabled = true'
    outputs:
      - 'ambientAudio is a playing HTMLAudioElement with the overworld URL'
      - 'ambientUrl is set to the overworld music path'
    state_changes:
      - field: 'audio module ambientAudio'
        effect: 'set to a new HTMLAudioElement playing the overworld track'
      - field: 'audio module ambientUrl'
        effect: "set to ZONE_MUSIC['overworld']"
    determinism: deterministic

  - id: cleanup-resets-refs
    description: >
      The useMusic cleanup effect (called on unmount and
      StrictMode simulated unmount) calls stopAll() and then
      resets prevZoneRef and prevCharIdRef to null. This ensures
      the subsequent mount (whether StrictMode remount or new
      GameScreen after New Game) treats the zone as fresh and
      calls setAmbient again.
    inputs:
      - 'Component unmounts (real or StrictMode simulated)'
    outputs:
      - 'prevZoneRef.current is null'
      - 'prevCharIdRef.current is null'
      - 'All audio stopped via stopAll()'
    state_changes:
      - field: 'prevZoneRef.current'
        effect: 'reset to null'
      - field: 'prevCharIdRef.current'
        effect: 'reset to null'
    determinism: deterministic

  - id: stopall-clears-pending
    description: >
      stopAll() clears the pendingPlay reference and removes any
      document-level click/keydown listeners registered by
      safePlay. This prevents a destroyed audio element from
      being resumed after cleanup.
    inputs:
      - 'stopAll() is called'
    outputs:
      - 'pendingPlay is null'
      - 'No stale event listeners on document'
    state_changes:
      - field: 'audio module pendingPlay'
        effect: 'set to null'
    determinism: deterministic

  - id: genesis-aware-ambient
    description: >
      While state.genesis is non-null, useMusic picks the overworld
      ambient track (ZONE_MUSIC[Zone.Overworld]) regardless of
      state.currentZone. precis-33 places the steward inside the
      house at tenure start, so state.currentZone is HouseInterior
      from frame 1 — but the genesis cinematic plays the overworld
      ambient (the cinematic shows the prairie taking shape, not
      the house interior). The selection logic applies both to
      the audio-enabled-just-flipped path and the regular zone-
      change path. A new `prevGenesisRef` tracks whether genesis
      was active on the previous render; when `state.genesis !== null`
      changes value, setAmbient is called even if the zone did not
      change, so the ambient track crossfades at the handoff
      (genesis ends → zone-matching ambient takes over).
    inputs:
      - 'state.genesis non-null vs null'
      - 'state.currentZone'
      - 'state.audioEnabled'
    outputs:
      - 'while state.genesis is non-null: ambient = ZONE_MUSIC[Zone.Overworld]'
      - 'at the genesis → null transition: setAmbient fires with the current-zone track even when zone did not change'
    state_changes:
      - field: '(useMusic ref) prevGenesisRef.current'
        effect: 'updated to state.genesis !== null after each render that triggers setAmbient'
      - field: 'audio module ambientTrack'
        effect: 'crossfaded to the zone-matching track at genesis-to-gameplay handoff'
    determinism: deterministic

edge_cases:
  - id: strictmode-double-mount
    description: >
      React 18 StrictMode mounts effects, runs cleanups, then
      re-mounts. The first mount creates ambient audio, cleanup
      destroys it, and the remount must re-create it. Without
      ref reset, the remount sees prevZoneRef === currentZone
      and skips setAmbient.
    expected: 'Overworld ambient audio is playing after StrictMode double-mount completes'

  - id: new-game-remount
    description: >
      User clicks New Game in menu. stopAll() is called, old
      GameScreen unmounts, new GameScreen mounts with fresh
      key. StrictMode double-mounts the new instance. The
      ambient must start playing.
    expected: 'Overworld ambient audio is playing after New Game flow'

  - id: pending-play-cleanup
    description: >
      If autoplay was blocked and safePlay set pendingPlay,
      then stopAll() is called before the user interacts,
      the destroyed element must not be resumed later.
    expected: 'pendingPlay is null after stopAll, no stale resume listeners'

failure_conditions:
  - trigger: >
      GameScreen mounts under React StrictMode; first effect
      creates ambient audio; cleanup destroys it; remount
      skips setAmbient because prevZoneRef still equals
      currentZone
    expected: 'Ambient audio is re-created on remount because cleanup resets prevZoneRef to null'

  - trigger: >
      stopAll() is called while pendingPlay references an
      audio element; user later clicks triggering resumePending
      which calls play() on the destroyed element
    expected: 'pendingPlay is cleared by stopAll so resumePending is a no-op'

verification:
  test_file: src/engine/__tests__/audio.test.ts
  test_pattern: 'stopAll clears pendingPlay'
  command: 'npx vitest run src/engine/__tests__/audio.test.ts'
