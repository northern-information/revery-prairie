id: overworld-fog-of-war
name: 'Overworld fog of war (gaze, memory, unseen)'
priority: high
layer: integration
source_files:
  - src/engine/visibility.ts
  - src/engine/renderer.ts
  - src/engine/state.ts
  - src/engine/types.ts
  - src/engine/constants.ts
dependencies:
  - cave-fog-of-war
  - ruin-fog-of-war

behaviors:
  - id: has-fog-of-war-true-for-overworld
    description: >
      hasFogOfWar returns true for Zone.Overworld in addition to Cave
      and Ruin. the visibility system, fog-mask pass, and minimap all
      gate on hasFogOfWar — no further changes needed at those call
      sites for the prairie to participate in fog of war. player-facing
      vocabulary is gaze (visible), memory (remembered), and unseen
      (unexplored); engineering identifiers keep their existing names
      (hasFogOfWar, fog-mask, computeZoneVisibility, getTileVisibility).
    inputs:
      - 'state.currentZone is Overworld'
    outputs:
      - 'hasFogOfWar(Zone.Overworld) returns true'
      - 'computeZoneVisibility runs each frame on the prairie'
      - 'getTileVisibility returns one of unexplored, remembered, visible for overworld tiles'
    state_changes: []
    determinism: deterministic

  - id: three-state-visibility-on-prairie
    description: >
      prairie tiles exist in one of three visibility states, identical
      semantics to cave and ruin (RP-62 "fog returns to memory").
      unexplored (never seen — rendered as solid BG_COLOR, no entities).
      remembered (was once in player FOV but is not currently in
      line-of-sight — "dim memory": terrain, static landmarks
      (oaks, beehive structures, dropped ground items), and a frozen
      flora snapshot render at reduced brightness; live creatures
      (bees, ghosts, coyote, monarchs, angels) and live effects
      (glint beams/sparkles, angel aura) are hidden). visible
      (currently in line-of-sight at full brightness with all entities
      and effects). simulation underneath runs regardless of
      visibility: bees still pollinate, coyote still wanders, flora
      lifecycle still ticks. fog culls render only. the fog returns
      the moment the player looks away — there is no longer a
      permanently-bright "fully discovered" tier.
    inputs:
      - 'state.currentZone is Overworld'
      - 'state.overworldFogExplored: Set<string> tracking ever-seen tile keys (drives remembered)'
      - 'state.overworldFloraMemory: Map<string, { char: string; color: string }> of last-seen flora appearance'
      - 'per-frame visible set computed from player position'
    outputs:
      - 'unexplored tiles render as BG_COLOR diamonds via the fog-mask pass; no entities resolve at those tile keys'
      - 'remembered tiles render terrain, static landmarks, and the frozen flora snapshot at FOG_EXPLORED_BRIGHTNESS; live creatures and live effects hidden'
      - 'visible tiles render normally with all entities and effects'
    state_changes:
      - field: overworldFogExplored
        effect: 'union of previous set and current visible set — tiles never revert'
      - field: overworldFloraMemory
        effect: 'flora snapshot written on each visible→remembered transition for flora and egregore tiles'
    determinism: deterministic

  - id: prairie-vision-radius
    description: >
      player vision radius on the prairie is OVERWORLD_VISION_RADIUS
      (6 tiles), the same value as CAVE_VISION_RADIUS and
      RUIN_VISION_RADIUS. same eyes, indoors or out — the cosmological
      lock is preserved. tiles within this radius with unobstructed
      line-of-sight from the player position are visible. the prairie
      currently has no LOS-blocking tile types — blocksLOS returns
      false for all prairie tiles, so the visible set is a Chebyshev
      disc of radius 6 around the player (clipped to map bounds and
      shadowcasting's circular mask). shadowcasting is reused unchanged
      from cave and ruin. everything outside the gaze disc that was
      previously seen is remembered (dim); everything never seen is
      unexplored.
    inputs:
      - 'player position on the prairie'
      - 'overworld map tile data'
      - 'OVERWORLD_VISION_RADIUS constant (6)'
    outputs:
      - 'Set<string> of currently visible tile keys'
    state_changes: []
    determinism: deterministic

  - id: flora-snapshot-on-prairie
    description: >
      when a prairie flora or egregore tile transitions from visible
      to remembered, its current rendered glyph and color (species +
      lifecycle stage) are captured into overworldFloraMemory keyed by
      tile position. while remembered the tile renders the captured
      snapshot dimmed, not the live lifecycle stage — so a flower the
      steward last saw in bloom stays in bloom in memory even as it
      wilts off-screen. on re-entering gaze the live appearance shows
      and the snapshot refreshes the next time the tile leaves gaze.
      this is the "only see flora at last known state" property.
    inputs:
      - 'a prairie flora/egregore tile visible last frame, remembered this frame'
      - 'the tile current rendered glyph and color'
      - 'state.overworldFloraMemory'
    outputs:
      - 'overworldFloraMemory[posKey] set to the appearance at the moment of leaving gaze'
      - 'remembered flora renders the dimmed snapshot, not the live stage'
    state_changes:
      - field: overworldFloraMemory
        effect: 'snapshot written/overwritten on each visible→remembered transition'
    determinism: deterministic

  - id: no-entrance-always-visible
    description: >
      the prairie has no entrance tile equivalent to the cave entrance
      or ruin entrance. computeZoneVisibility does not force-add any
      tile to the visible set when state.currentZone is Overworld.
      orientation comes from the player's own movement and the
      minimap, not from a fixed always-lit anchor.
    inputs:
      - 'state.currentZone is Overworld'
    outputs:
      - 'no forced-visible tiles beyond the player FOV (plus angel-aura reveal — see angel-aura-reveal)'
    state_changes: []
    determinism: deterministic

  - id: angel-aura-reveal
    description: >
      standing inside an angel's aura reveals the entire aura circle as
      visible for the current frame (the angel's gaze lights the field
      around the steward). these tiles enter the visible set, render at
      full brightness, and are added to overworldFogExplored like any
      other visible tile. when the steward leaves the aura, those tiles
      revert to remembered (dim) like any other tile leaving gaze — they
      are not permanently bright.
    inputs:
      - 'player within ANGEL_AURA_RADIUS of an angel on the prairie'
    outputs:
      - 'aura-circle tiles added to the current visible set and to overworldFogExplored'
      - 'aura-circle tiles revert to remembered once the steward leaves the aura'
    state_changes:
      - field: overworldFogExplored
        effect: 'aura-revealed tiles added to set'
    determinism: deterministic

  - id: per-tenure-fog-fields
    description: >
      overworldFogExplored and overworldFloraMemory live on GameState.
      createGameState initializes both empty (Set and Map). a new
      tenure (a fresh createGameState call with a new steward name)
      starts with both empty — the prairie is fully unseen on the first
      frame. tiles outside the spawn FOV remain unexplored until the
      steward walks toward them.
    inputs:
      - 'createGameState called with a new steward name'
    outputs:
      - 'state.overworldFogExplored is an empty Set'
      - 'state.overworldFloraMemory is an empty Map'
      - 'the first frame of a new tenure paints only the player FOV; everything beyond is unseen'
    state_changes:
      - field: overworldFogExplored
        effect: 'initialized empty on createGameState'
      - field: overworldFloraMemory
        effect: 'initialized empty on createGameState'
    determinism: deterministic

  - id: fog-updates-on-movement
    description: >
      after each player movement on the prairie, the visible set is
      recomputed and newly visible tiles are added to
      overworldFogExplored. tiles that leave the gaze disc revert to
      remembered (dim); flora tiles leaving gaze are captured into
      overworldFloraMemory. this happens as part of the render frame
      following the movement — no separate tick needed.
    inputs:
      - 'player moves to a new prairie tile'
    outputs:
      - 'visible set shifts to new player position'
      - 'previously visible tiles now out of sight render as remembered (dim)'
      - 'flora tiles leaving gaze captured into overworldFloraMemory'
    state_changes:
      - field: overworldFogExplored
        effect: 'newly visible tiles added to set'
      - field: overworldFloraMemory
        effect: 'flora snapshots captured for tiles leaving gaze'
    determinism: deterministic

  - id: entity-visibility-culling-on-prairie
    description: >
      live creatures (characters, bees, ghosts, angels, coyote,
      monarchs) and live effects (angel gold aura, glinting beam,
      glinting zone sparkle) render ONLY when their tile is in the
      current visible set. they are hidden on remembered and unexplored
      tiles. static content remembered while out of gaze (terrain,
      frozen flora snapshot, dropped ground items, beehive tiles, oaks,
      egregore tiles) renders dimmed on remembered tiles. this is
      enforced by the central tile-loop in renderer.ts gating on
      getTileVisibility, plus the entity-tied world-overlay passes
      (angel gold aura, glinting beam, glinting zone sparkle) gating on
      the visible set ONLY (not on any memory set). simulation continues
      to tick for all culled entities; only render is affected. the
      "bees and ghosts render through fog" bug is fixed here: under the
      old model those creatures rendered on permanently-bright
      fullyDiscovered tiles; now they hide the instant their tile leaves
      gaze.
    inputs:
      - 'overworld entity position'
      - 'current visible tile set'
      - 'whether the entity is a live creature/effect or static content'
    outputs:
      - 'live creature/effect rendered only if its tile is visible'
      - 'static content rendered dimmed on remembered tiles'
      - 'entity-tied world overlays (angel aura, glinting beam/sparkle) hidden on remembered and unexplored tiles'
    state_changes: []
    determinism: deterministic

  - id: fog-mask-covers-prairie
    description: >
      the existing fog-mask render pass (see fog-bg-mask spec) is
      gated by hasFogOfWar and activates on the prairie. unexplored
      prairie tiles paint as BG_COLOR diamonds; remembered prairie
      tiles paint a black diamond at alpha (1 - FOG_EXPLORED_BRIGHTNESS)
      over the cached terrain bg, matching the dim treatment the central
      tile loop applies to the foreground glyph. the pass handles
      overworld-specific lift sources (river/pond water sinks, structure
      platform lift) so masks line up with the tileBgCache diamonds.
    inputs:
      - 'state.currentZone is Overworld'
      - 'visibility state for each viewport tile'
    outputs:
      - 'fog mask paints over unexplored and remembered tiles using the overworld lift math'
    state_changes: []
    determinism: deterministic

  - id: minimap-respects-prairie-fog
    description: >
      the Minimap component gates tile rendering and character-entity
      markers on hasFogOfWar. unexplored prairie tiles are skipped on
      the minimap (rendered as the canvas background); remembered
      prairie tiles render dimmed; visible tiles render at full color.
      the player position marker and viewport rectangle are not gated
      by fog and always render. because the bright "fully discovered"
      tier is gone, the minimap now shows only the gaze disc at full
      color and the rest of explored terrain dimmed — a deliberate
      consequence of RP-62.
    inputs:
      - 'state.currentZone is Overworld'
      - 'minimap render tick'
    outputs:
      - 'unexplored prairie tiles do not paint on the minimap'
      - 'unexplored civilization-ruin footprint tiles do not paint on the minimap'
      - 'remembered prairie tiles paint dimmed; only the gaze disc paints at full color'
      - 'player marker and viewport rectangle remain visible'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: spawn-frame-state
    description: 'on the first render frame after createGameState, only the FOV around the spawn position is visible. the rest of the 147x147 prairie is unexplored.'
    expected: 'overworldFogExplored contains only the tiles in the spawn FOV; all other tiles render as BG_COLOR via the fog mask.'
  - id: simulation-runs-while-hidden
    description: 'a bee, ghost, coyote, or any other creature outside the visible disc continues to tick. moving back into the visible disc shows the creature at its updated position, not at its position when it was last seen.'
    expected: 'state.bees / state.ghosts / character positions update each tick regardless of visibility; only the render pass culls them.'
  - id: flora-snapshot-frozen-while-hidden
    description: 'the steward sees a wildflower at sprout stage, walks away (snapshot captured), the flower blooms to full off-screen, the steward returns.'
    expected: 'while remembered the tile shows the dimmed sprout snapshot; on re-entering gaze it shows the live bloom and refreshes the snapshot when next leaving gaze.'
  - id: zone-transition-preserves-prairie-fog
    description: 'entering a cave or ruin and returning to the prairie preserves overworldFogExplored and overworldFloraMemory. the tiles and flora snapshots you saw before going underground are still in memory when you come back up.'
    expected: 'overworldFogExplored and overworldFloraMemory are not cleared by zone transitions.'
  - id: discovery-without-walls
    description: 'because the prairie has no LOS-blocking tile types, every tile within the player FOV disc is visible. there is no proximity-promotion step anymore — leaving the disc returns a tile to remembered immediately.'
    expected: 'the set of visible tiles after one frame is exactly the FOV disc around the player; nothing outside it stays bright.'
  - id: deep-time-overworld
    description: 'while the player is on the prairie during the deep-time wandering phase, fog of war remains active and uses overworldFogExplored / overworldFloraMemory. deep-time burning/simulating phases lock movement; fog logic still runs but the player does not generate new explored tiles during locked phases.'
    expected: 'fog continues to update during deep-time Wandering; during locked phases the visible set stays where the player last stood.'
  - id: dev-paint-on-unseen-tiles
    description: 'dev panel paint actions that mutate map tiles outside the visible radius still mutate the map. on re-entering the radius the new tile type renders correctly because the fog system keys on positions not tile types.'
    expected: 'changing a tile type at an unexplored or remembered prairie position works; rendering reflects the new type when the tile next enters the visible set (flora appearance refreshes via snapshot on next leave-gaze).'

failure_conditions:
  - trigger: 'createGameState produces a state missing overworldFogExplored or overworldFloraMemory'
    expected: 'EXPECTED_FIELDS test in src/harness/__tests__/serialization/schema.test.ts fails, surfacing the missing field'
  - trigger: 'hasFogOfWar returns false for Zone.Overworld'
    expected: 'spec is violated; prairie renders without fog of war and entities render everywhere regardless of player position'
  - trigger: 'a live creature (bee, ghost, coyote) or entity-tied effect renders on a remembered or unexplored prairie tile'
    expected: 'spec is violated; the "fog returns" property and the bee/ghost bug fix are not delivered. live content must gate on the visible set only.'
  - trigger: 'a remembered prairie flora tile renders its live lifecycle stage instead of the overworldFloraMemory snapshot'
    expected: 'spec is violated; the "last known state" property fails.'
  - trigger: 'computeZoneVisibility force-adds an entrance tile while currentZone is Overworld'
    expected: 'an unintended always-lit anchor appears on the prairie; spec is violated. force-add is only for Cave and Ruin entrances (angel aura is a separate, non-permanent reveal).'
  - trigger: 'OVERWORLD_VISION_RADIUS differs from CAVE_VISION_RADIUS or RUIN_VISION_RADIUS'
    expected: 'the cosmological lock ("same eyes, indoors or out") is violated. all three must hold the same value.'

verification:
  test_file: src/engine/__tests__/visibility.test.ts
  test_pattern: 'overworld fog'
  command: 'npx vitest run src/engine/__tests__/visibility.test.ts'
