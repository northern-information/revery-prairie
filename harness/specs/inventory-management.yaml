id: inventory-management
name: 'Flat inventory management'
priority: high
layer: engine
source_files:
  - src/engine/inventory.ts
  - src/engine/items.ts
  - src/engine/types.ts
dependencies: []

behaviors:
  - id: occupancy-grid
    description: >
      buildOccupancyGrid(container, excludeUid?) creates a 2D grid
      mapping each cell to the uid of the item occupying it (or null).
      optionally excludes one item by uid (used during drag to ignore
      the item being moved). all items are 1x1 so each item occupies
      exactly one cell at its gridX/gridY position.
    inputs:
      - 'Container, optional excludeUid'
    outputs:
      - '(string | null)[][] occupancy grid'
    state_changes: []
    determinism: deterministic

  - id: can-place
    description: >
      canPlace(container, definitionId, gridX, gridY, excludeUid?)
      checks if a 1x1 cell is within container bounds and not occupied
      by another item. uses buildOccupancyGrid internally.
    inputs:
      - 'container, item definition, position, optional exclude'
    outputs:
      - 'boolean: true if cell is free'
    state_changes: []
    determinism: deterministic

  - id: place-item
    description: >
      placeItem(container, definitionId, gridX, gridY) creates a new
      ItemInstance with crypto.randomUUID() uid and pushes it to
      container.items. returns null if canPlace fails.
    inputs:
      - 'container, item definition, position'
    outputs:
      - 'ItemInstance or null'
    state_changes:
      - field: container.items
        effect: 'new ItemInstance pushed'
    determinism: deterministic

  - id: remove-item
    description: >
      removeItem(container, uid) splices the item from
      container.items by uid. returns the removed ItemInstance
      or null if not found.
    inputs:
      - 'container, item uid'
    outputs:
      - 'ItemInstance or null'
    state_changes:
      - field: container.items
        effect: 'item spliced out'
    determinism: deterministic

  - id: move-item
    description: >
      moveItem(container, uid, newGridX, newGridY) repositions an
      existing item within the same container. uses canPlace with
      the item's own uid excluded. updates gridX and gridY in place.
    inputs:
      - 'container, uid, new position'
    outputs:
      - 'boolean: true if move succeeded'
    state_changes:
      - field: container.items
        effect: 'item position updated in place'
    determinism: deterministic

  - id: find-fit-position
    description: >
      findFitPosition(container, definitionId) scans all grid
      positions left-to-right, top-to-bottom to find the first
      empty cell. returns { gridX, gridY } or null if container
      is full. no rotation — all items are 1x1.
    inputs:
      - 'container, item definition id'
    outputs:
      - '{ gridX, gridY } or null'
    state_changes: []
    determinism: deterministic

  - id: auto-sort
    description: >
      autoSort(container) removes all items, sorts by definitionId
      for grouping, and re-places each via findFitPosition.
      preserves original uids. if any item cannot be re-placed,
      restores the original items array and returns false.
    inputs:
      - 'container with items'
    outputs:
      - 'boolean: true if sort succeeded'
    state_changes:
      - field: container.items
        effect: 'items repositioned with new gridX/gridY, same uids'
    determinism: deterministic

  - id: transfer-item
    description: >
      transferItem(source, target, uid, gridX, gridY) moves an item
      between containers. validates placement via canPlace before
      removing from source. on success, mutates the original
      ItemInstance in place (gridX, gridY) and pushes it into
      target.items — preserving the original uid. returns false
      without mutating if canPlace fails.
    inputs:
      - 'source container, target container, uid, target position'
    outputs:
      - 'boolean: true if transfer succeeded'
    state_changes:
      - field: source.items
        effect: 'item removed'
      - field: target.items
        effect: 'same ItemInstance (original uid preserved) pushed with updated position'
    determinism: deterministic

  - id: item-category-taxonomy
    description: >
      ItemCategory in src/engine/types.ts is the canonical taxonomy
      for ItemDefinition.category. members are Fauna ('fauna'),
      Flora ('flora'), Tool ('tool'), CelestialDebris ('celestial
      debris'), Gizmo ('gizmo'), Seed ('seed'), Artifact ('artifact'),
      and Zoogenic ('zoogenic'). Zoogenic covers animal-produced
      goods that are neither alive flora nor alive fauna —
      currently honey, which is bee-produced from clover nectar.
      ItemInfo renders item.category verbatim, so the surface label
      for honey is 'zoogenic'.
    inputs:
      - 'ItemDefinition.category referencing an ItemCategory member'
    outputs:
      - "ItemInfo panel renders the lowercase category string verbatim (e.g. 'zoogenic' for honey)"
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: full-container
    description: 'all grid cells occupied, placeItem called'
    expected: 'canPlace returns false; placeItem returns null'
  - id: auto-sort-rollback
    description: 'autoSort cannot fit all items after sorting'
    expected: 'original items array restored; returns false'
  - id: transfer-target-full
    description: 'transferItem target has no room for the item'
    expected: 'item stays in source; returns false'
  - id: uid-not-found
    description: 'removeItem or moveItem called with nonexistent uid'
    expected: 'returns null or false; no state change'

failure_conditions:
  - trigger: 'placeItem called at out-of-bounds position'
    expected: 'canPlace returns false; placeItem returns null'
  - trigger: 'unknown definitionId passed to getDefinition'
    expected: 'throws Error — callers must validate before calling'

verification:
  test_file: src/engine/__tests__/inventory.test.ts
  test_pattern: 'inventory'
  command: npx vitest run src/engine/__tests__/inventory.test.ts
