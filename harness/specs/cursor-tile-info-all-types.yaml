id: cursor-tile-info-all-types
name: 'Show cursor tile info for all tile types'
status: implemented
priority: medium
layer: integration
source_files:
  - src/engine/renderer.ts
  - src/components/Sidebar.tsx
behaviors:
  - id: water-tiles-cursorable
    description: >
      Water tiles (ponds and rivers) must be cursorable in the renderer so that
      hovering over them sets state.cursorTile and the sidebar displays tile
      information. Currently these tiles set cursorable = false, which prevents
      the cursor section from appearing.
    inputs:
      - 'mouse hovers over a pond tile'
      - 'mouse hovers over a river tile'
    outputs:
      - 'state.cursorTile is set to the hovered water tile position'
      - 'sidebar cursor section is visible with tile coordinates and contents'
    state_changes:
      - field: cursorTile
        effect: 'set to the hovered pond or river tile position instead of remaining null'
    determinism: deterministic
  - id: fresh-water-label
    description: >
      When the cursor is over a pond or river tile, the sidebar contents row
      displays "fresh water" instead of the raw underlying tile type name.
      Water features are overlaid on dirt tiles so the contents IIFE must
      check for water presence before falling through to the tile type.
    inputs:
      - 'state.cursorTile resolves to a tile with a pond or river'
    outputs:
      - 'sidebar contents row shows "fresh water"'
    state_changes: []
    determinism: deterministic
  - id: stone-label
    description: >
      When the cursor is over a CaveWall or CaveBreakableWall tile, the
      sidebar contents row displays "stone" instead of the raw tile type
      name (e.g. "caveWall").
    inputs:
      - 'state.cursorTile resolves to a CaveWall tile'
      - 'state.cursorTile resolves to a CaveBreakableWall tile'
    outputs:
      - 'sidebar contents row shows "stone"'
    state_changes: []
    determinism: deterministic
edge_cases:
  - id: hidden-chamber-wall-shows-stone
    description: >
      CaveBreakableWall tiles in the hidden chamber (masked before
      caveRevealed is true) should also show "stone" when cursorable,
      matching regular cave wall presentation.
    expected: 'sidebar contents shows "stone" for breakable walls regardless of reveal state'
  - id: breakable-wall-same-as-regular-wall
    description: >
      CaveBreakableWall displays "stone" identical to regular CaveWall from
      the player perspective, preserving the hidden nature of the breakable wall.
    expected: 'sidebar contents shows "stone" for both CaveWall and CaveBreakableWall'
failure_conditions:
  - trigger: 'mouse hovers over a water tile (pond or river)'
    expected: 'sidebar cursor section is visible with "fresh water" as contents, not hidden'
  - trigger: 'mouse hovers over a cave wall tile'
    expected: 'sidebar contents shows "stone", not the raw tile type name'
verification:
  test_file: src/engine/__tests__/cursorTileInfo.test.ts
  test_pattern: 'cursor tile info'
  command: 'npx vitest run src/engine/__tests__/cursorTileInfo.test.ts'
