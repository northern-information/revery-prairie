id: RP-3-genetics-v1
name: 'RP-3 — Genetics v1'
priority: medium
layer: integration
source_files:
  - docs/backlog-thinktank-v3.md
  - docs/backlog.yaml
  - CLAUDE.md
  - src/engine/angels.ts
  - src/engine/types.ts
  - src/engine/floraLifecycle.ts
  - src/engine/genesis.ts
  - src/engine/clover.ts
  - src/engine/monarch.ts
  - src/engine/lightning.ts
  - src/engine/recipes.ts
  - src/engine/state.ts
dependencies:
  - RP-1-multi-species-flora
  - RP-2-phenological-seasons

behaviors:
  - id: shared-crypto-module
    description: >
      A new module src/engine/crypto.ts is created. It exports
      sha256Sync(message: string): string (a synchronous 32-bit FNV-style
      hash-mixing routine producing a 64-char lowercase hex string) and
      sha256Async(message: string): Promise<string> (which uses
      crypto.subtle.digest('SHA-256') when available and falls back to
      sha256Sync). The implementation is byte-identical to the existing
      sha256Sync and sha256 functions in src/engine/angels.ts at lines
      36-68. After the move, angels.ts imports both functions from
      crypto.ts and the local copies are deleted. Angel hash outputs are
      preserved exactly for the same inputs (verified by a snapshot test
      using a fixed steward/coords/encounterCount input).
    inputs:
      - 'codebase after RP-3 lands'
    outputs:
      - 'src/engine/crypto.ts exists and exports sha256Sync + sha256Async'
      - 'src/engine/angels.ts imports both from crypto.ts'
      - 'angels.ts no longer defines its own sha256Sync or sha256'
    state_changes: []
    determinism: deterministic

  - id: trait-bag-shape
    description: >
      A TraitBag interface is defined in src/engine/genetics/index.ts.
      It contains four phenotype trait axes — bloomTiming, coldTolerance,
      droughtResponse, pollinatorPreference — each a number in [0, 1].
      It also contains a recessives field of type number[] with length
      0, 1, or 2; each entry is in [0, 1] and represents a carried
      recessive value that does not manifest in the plant's own
      phenotype but can pass to offspring. The recessive's axis identity
      is by array index (matching the four phenotype axes by order:
      index 0 = bloomTiming recessive, index 1 = coldTolerance, etc.);
      v1 carries at most one recessive per axis and the recessives
      array is permitted to be empty.
    inputs:
      - 'codebase after RP-3 lands'
    outputs:
      - 'TraitBag interface exported from src/engine/genetics/index.ts'
      - 'four required phenotype axes, all numbers in [0, 1]'
      - 'recessives: number[] with length <= 2'
    state_changes: []
    determinism: deterministic

  - id: flora-lifecycle-state-widened
    description: >
      FloraLifecycleState in src/engine/types.ts gains two required
      fields — identity (string, 64-char lowercase hex) and traits
      (TraitBag). Every FloraLifecycleState constructed across the
      codebase now includes both. The existing local createHealthyEntry
      helper in src/engine/floraLifecycle.ts is exported (renamed
      createFloraLifecycleEntry for clarity) and gains identity + traits
      parameters; the 6 other construction sites (genesis.ts,
      lightning.ts, recipes.ts, monarch.ts, clover.ts, angels.ts) are
      refactored to route through this helper.
    inputs:
      - 'codebase after RP-3 lands'
    outputs:
      - 'FloraLifecycleState has required identity: string and traits: TraitBag fields'
      - 'every construction site populates both fields via createFloraLifecycleEntry'
    state_changes:
      - field: floraLifecycle entry shape
        effect: 'every entry now carries identity + traits'
    determinism: deterministic

  - id: genesis-identity-generation
    description: >
      A pure function generateGenesisIdentity(binomial, genesisSeed,
      posKey) in src/engine/genetics/index.ts returns
      sha256Sync(`${binomial}:${String(genesisSeed)}:${posKey}`). The
      same inputs always produce the same 64-char hex string. Used for
      all flora tiles placed by the genesis simulation. Called from
      genesis.ts when seeding flora during the geological epoch chain.
      Determinism is preserved across the existing 'same steward name
      produces the same world' contract — the binomial is read from
      FLORA_SPECIES, the genesisSeed is the existing
      nameToSeed(stewardName) output, and posKey is the existing tile
      key.
    inputs:
      - 'binomial: string (e.g. Trifolium repens)'
      - 'genesisSeed: number'
      - 'posKey: string'
    outputs:
      - 'a 64-char lowercase hex SHA256 string'
    state_changes: []
    determinism: deterministic

  - id: trait-bag-generation
    description: >
      A pure function generateTraitBag(identity: string): TraitBag in
      src/engine/genetics/index.ts seeds a mulberry32 PRNG from the
      first 8 hex chars of the identity (parsed as a 32-bit unsigned
      integer) and draws each of the four phenotype axes as
      rng.next() values in [0, 1). Recessives are also drawn from the
      same PRNG — a single d100 roll decides recessive count
      (0: 70% chance, 1: 25% chance, 2: 5% chance), then that many
      recessive values are drawn in [0, 1). Same identity always
      produces the same trait bag.
    inputs:
      - 'identity: string (64-char hex)'
    outputs:
      - 'a TraitBag with 4 phenotype axes + 0-2 recessives, deterministic per identity'
    state_changes: []
    determinism: deterministic

  - id: cross-trait-bags-pure-function
    description: >
      A pure function crossTraitBags(parentA: TraitBag, parentB: TraitBag,
      rng: () => number): TraitBag in src/engine/genetics/index.ts
      produces a child trait bag from two parents. The rng argument is a
      provided PRNG (the caller seeds it from the cross context — e.g.
      the child's identity hash). For each of the four phenotype axes
      the child value is (parentA[axis] + parentB[axis]) / 2 plus
      Gaussian noise (mean 0, sigma 0.05) clamped to [0, 1]. Then a
      single novelty roll — 2% probability — picks one of the four
      axes uniformly at random and replaces the child's value on that
      axis with a fresh uniform draw in [0, 1). Recessives are inherited
      by sampling: for each parent's recessive slot, the child has a 50%
      chance of inheriting that recessive (clamped to a max of 2 total).
      No caller wires this function in RP-3 — it ships pure and tested,
      ready for #12 to call.
    inputs:
      - 'parentA: TraitBag'
      - 'parentB: TraitBag'
      - 'rng: () => number (a seeded PRNG)'
    outputs:
      - 'a child TraitBag with mixed phenotype + 0-2 inherited recessives'
    state_changes: []
    determinism: deterministic

  - id: hash-to-hex-grid-derivation
    description: >
      A pure function hashToHexGrid(identity: string): HexGrid in
      src/engine/genetics/index.ts converts a 64-char hex identity to
      an 8x8 grid of nibble values. The HexGrid type is number[][] with
      shape [8][8]; each cell is parseInt(identity[row * 8 + col], 16)
      and is therefore in [0, 15]. The mapping rule is locked — cell
      [row][col] = nibble at position row * 8 + col in the hash string.
      No transformation, no remapping. This mapping is stable for the
      lifetime of the game because every plant's visible grid in RP-6 will
      derive from this exact rule. No renderer in RP-3 — only the data
      derivation.
    inputs:
      - 'identity: string (64-char hex)'
    outputs:
      - 'a HexGrid (number[][]) with shape [8][8] of nibble values in [0, 15]'
    state_changes: []
    determinism: deterministic

  - id: genesis-wires-identity-and-traits
    description: >
      The two flora-seeding sites in src/engine/genesis.ts
      (lines 3383 and 3463, both currently calling
      state.floraLifecycle.set with stage: Healthy) are refactored to
      route through createFloraLifecycleEntry and supply generated
      identity + traits. The genesis result type or the genesis runner
      threads the genesisSeed (already used internally for mulberry32)
      so identity generation has access to it. Worlds remain
      deterministic per steward name — the same name produces the same
      tile placements, the same identities, the same trait bags.
    inputs:
      - 'genesis runs (either incremental epoch chain or runAllMutations)'
    outputs:
      - 'every genesis-placed flora tile has identity + traits populated'
    state_changes:
      - field: floraLifecycle entries created in genesis
        effect: 'each entry carries deterministic identity + trait bag'
    determinism: deterministic

  - id: post-genesis-flora-sites-also-wired
    description: >
      The 5 other flora-construction sites — src/engine/clover.ts
      (bee-spawned and angel-spawned clover growth), src/engine/lightning.ts
      (lightning-strike survivor flora), src/engine/recipes.ts (item-from-recipe
      flora placement), src/engine/monarch.ts (monarch-spawned wildflower),
      src/engine/angels.ts (angel-grown clover halo) — are all refactored to
      call createFloraLifecycleEntry with a generated identity. For these
      non-genesis sites, the identity is sha256Sync(`runtime:${binomial}:${posKey}:${String(state.time)}`)
      — runtime tag distinguishes from genesis hashes, time provides
      uniqueness across re-growths on the same tile. Trait bags are
      generated via generateTraitBag from each identity. None of these
      sites need to read from a parent; they all spawn fresh plants.
      The 'crossed offspring with parent chain hash' path (#12) is not
      exercised in this PR.
    inputs:
      - 'any post-genesis flora is created (clover by bee, monarch wildflower, recipe flora, etc.)'
    outputs:
      - 'the new FloraLifecycleState entry has identity (runtime-tagged) + traits'
    state_changes:
      - field: floraLifecycle entries created post-genesis
        effect: 'each entry carries runtime-tagged identity + deterministic trait bag'
    determinism: deterministic

  - id: lifecycle-recycling-grants-fresh-identity
    description: >
      When a plant dies through the dying chain (Brown → BlinkingRed →
      Black → Decomposing → tile reverts to Dirt and the floraLifecycle
      entry is deleted), and a new plant later grows on the same tile,
      the new plant receives a fresh identity (the runtime path is
      hit, not the genesis path — the new plant's identity includes
      state.time so it differs from the previous occupant). Death ends
      that lineage. No genome is preserved across an empty period.
      BurntRecovering does not delete the entry — burnt flora retains
      its identity through the burn and resumes with the same hash on
      recovery.
    inputs:
      - 'a flora tile completes the dying chain'
      - 'a new flora grows on the same tile later'
    outputs:
      - 'the new entry has a different identity than the previous one'
      - 'BurntRecovering tiles retain their pre-burn identity'
    state_changes: []
    determinism: deterministic

  - id: doctrine-and-status-aligned
    description: >
      docs/backlog.yaml is updated to mark feature 3 as
      in-progress with the spec/plan paths populated. The hex-grid
      timing override is recorded in docs/backlog-thinktank-v3.md
      lines 62-63 — the previous text 'The hex grid stays buried —
      not surface mechanic. Only ever visible in the late-game ritual
      / microscope as the underlying architecture the player suspects
      but never reads.' is replaced with text reflecting that the hex
      grid surfaces in RP-6 as part of the naturalist's manual,
      player-facing. CLAUDE.md gets a short paragraph under a new
      '## genetics' section pointing to src/engine/genetics/ and
      summarizing the identity + trait bag invariants.
    inputs:
      - 'codebase after RP-3 lands'
    outputs:
      - 'docs/backlog.yaml has feature 3 marked in-progress with spec+plan'
      - 'docs/backlog-thinktank-v3.md lines 62-63 reflect the hex-grid override'
      - 'CLAUDE.md has a ## genetics section'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: empty-recessive-slot
    description: >
      A plant generated with zero recessives (70% likely per the d100
      roll) has recessives: []. crossTraitBags called with such a parent
      contributes no recessives from that side. The child can still
      receive up to 2 recessives if the other parent has them and the
      coin flips favor inheritance.
    expected: >
      crossTraitBags handles empty recessive arrays without throwing.
      Output child.recessives.length is capped at 2.

  - id: identical-parents
    description: >
      crossTraitBags called with parentA === parentB (the same object
      reference) produces a child whose phenotype axes are within
      noise distance of the parent's values, plus the same novelty-roll
      probability. The recessive inheritance still happens per slot via
      coin flips.
    expected: >
      No special-case handling; the math just runs. Child phenotype
      is parent ± Gaussian noise per axis. Novelty roll may still fire.

  - id: collision-resistant-identities
    description: >
      Two flora tiles at different positions in the same world produce
      different identities because posKey differs. Two flora tiles at
      the same position in different worlds produce different identities
      because genesisSeed differs. Two flora tiles at the same position
      in the same world but with different binomials (impossible by
      construction — one tile is one species — but tested as a unit
      property) also produce different identities.
    expected: >
      generateGenesisIdentity output is unique across (binomial,
      genesisSeed, posKey) triples. Property test confirms no
      collisions for representative inputs.

  - id: hash-to-grid-stability
    description: >
      A snapshot test pins the hashToHexGrid output for a known input
      hash so that any future refactor of the mapping rule is caught.
      The mapping must remain stable across the lifetime of the game
      because every plant's visible grid in RP-6 derives from this rule.
    expected: >
      A snapshot test in genetics.test.ts uses a fixed 64-char hex
      input and asserts the resulting [8][8] number grid matches an
      inline literal. Any change to the mapping fails the test.

  - id: burnt-flora-keeps-identity
    description: >
      A flora tile that enters BurntRecovering does not have its
      floraLifecycle entry deleted (per existing RP-1 doctrine).
      Its identity and traits are preserved through the burn and the
      tile resumes with the same identity on recovery.
    expected: >
      No identity change across the BurntRecovering → Healthy
      transition. A test confirms entry.identity is stable.

failure_conditions:
  - trigger: 'angel hash output differs from pre-lift output for the same inputs'
    expected: >
      A snapshot test in src/engine/__tests__/angels.test.ts pins
      generateAngelHash output for a fixed (stewardName, x, y,
      encounterCount) input. After lifting sha256Sync to crypto.ts,
      the test must continue to pass byte-for-byte. If it fails, the
      lift introduced a regression and must be fixed before RP-3 can land.

  - trigger: 'a FloraLifecycleState is constructed without going through createFloraLifecycleEntry'
    expected: >
      TypeScript compile fails because identity and traits are
      required fields. There is no runtime fallback — the constructor
      helper is the only ergonomic path, and direct object literals
      lacking the fields are caught at compile time.

  - trigger: 'genesis trait bag generation is non-deterministic across runs with the same steward name'
    expected: >
      A test seeds two GameStates with the same name, runs genesis to
      completion on each, and asserts that every flora tile's identity
      and traits match between the two runs. If they diverge, the
      determinism contract is broken and the PR cannot ship.

  - trigger: 'crossTraitBags introduces NaN or out-of-range values'
    expected: >
      A property test (fast-check or hand-rolled with many seeded
      runs) verifies that for any pair of valid parents, the child's
      four phenotype axes are all finite numbers in [0, 1] and
      recessives.length is in [0, 2]. Any output outside these
      bounds fails the test.

verification:
  test_file: src/engine/__tests__/angels.test.ts
  test_pattern: 'generateAngelHash'
  command: npx vitest run src/engine/__tests__/angels.test.ts
