id: ruin-accessibility-bugs
name: 'Ruin accessibility, unstable floor collapse, seed placement, and sidebar ruin info'
priority: high
layer: integration
source_files:
  - src/engine/ruins.ts
  - src/engine/genesis.ts
  - src/engine/state.ts
  - src/engine/renderer.ts
  - src/engine/constants.ts
  - src/engine/position.ts
  - src/components/Sidebar.tsx
dependencies:
  - ruin-rendering-bugs

behaviors:
  - id: ruin-entrance-walkable-perimeter
    description: >
      All 8 tiles adjacent to a ruin entrance on the overworld are
      converted to RuinApron tiles by placeRuinEntrances. RuinApron is
      walkable (treated like dirt for movement and pathfinding) so the
      player can always reach and leave the entrance. The conversion
      overwrites any prior tile type (dirt, sand, space) at adjacent
      positions, except CaveEntrance which is preserved (cave entrances
      are indestructible per CLAUDE.md).
    inputs:
      - 'placeRuinEntrances is called during state initialization'
    outputs:
      - 'All 8 neighbors of each RuinEntrance tile are RuinApron (unless CaveEntrance)'
      - 'Player can pathfind to every ruin entrance from the starting position'
    state_changes:
      - field: 'state.overworldMap'
        effect: 'Tiles adjacent to ruin entrances converted to RuinApron'
    determinism: deterministic

  - id: safe-exit-placement
    description: >
      exitRuin and exitCave place the player on the nearest walkable
      tile at Chebyshev distance >= 2 from the overworld entrance,
      rather than directly adjacent. The 3x3 ring around the entrance
      is skipped so the player cannot instantly re-enter the ruin/cave
      after exiting. findSafeExitPosition expands outward from the
      entrance until a walkable, unblocked tile is found. If no
      walkable tile exists in the searchable range, fall back to the
      entrance position itself.
    inputs:
      - 'Player steps on cave exit entrance tile inside a ruin or cave'
    outputs:
      - 'Player placed on a walkable tile at Chebyshev distance >= 2 from the overworld entrance'
      - 'Player is never placed on sand, space, or other non-walkable tile'
      - 'Player is never placed inside the 3x3 ring around the entrance (prevents instant re-entry)'
    state_changes:
      - field: 'state.player'
        effect: 'Set to nearest walkable tile at Chebyshev distance >= 2 from entrance'
    determinism: deterministic

  - id: seed-position-revalidation
    description: 'After all terrain modifications (debris, aqueduct channels), seed positions inside the dormant garden are re-validated. Seeds on non-walkable tiles are removed from the seed list.'
    inputs:
      - 'generateRuinInterior completes all terrain passes inside the dormant garden'
    outputs:
      - 'All seed positions are on walkable RuinFloor or RuinAqueduct tiles'
      - 'No seeds spawn inside walls, debris, or doors'
    state_changes:
      - field: 'dormantGardenData.seedDecayTimers'
        effect: 'Entries on non-walkable tiles removed'
    determinism: deterministic

  - id: sidebar-ruin-name-and-glyph
    description: >
      When inside a ruin, the sidebar stats section shows the ruin
      name on the location row (sentence case, e.g. "Ashhold ruins"),
      the Greek entrance glyph on its own line, and an archetype
      "Type" row beneath (e.g. "Dormant garden").
    inputs:
      - 'Player is inside a ruin (state.currentRuinIndex !== null)'
    outputs:
      - 'Location row shows "{name} ruins" in sentence case'
      - 'Separate row shows the Greek entrance glyph'
      - 'Type row shows the archetype label'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: ruin-at-map-edge
    description: 'Ruin entrance near the map edge where some adjacent tiles are out of bounds'
    expected: 'Only in-bounds neighbors are converted to RuinApron; out-of-bounds skipped gracefully'
  - id: ruin-apron-overlaps-cave-entrance
    description: 'Ruin entrance placed such that one of its 8 neighbors is a CaveEntrance'
    expected: 'CaveEntrance is preserved (not overwritten by RuinApron) per cave indestructibility rule'
  - id: all-neighbors-blocked
    description: 'Exit placement when all neighbors are somehow non-walkable'
    expected: 'Fallback to entrance position itself rather than placing player on non-walkable tile'
  - id: seeds-all-removed
    description: 'All seed positions invalid after debris and aqueduct passes'
    expected: 'Ruin has zero seeds — no crash, just an empty seed list'

failure_conditions:
  - trigger: 'Ruin entrance placed on sandbar surrounded by space'
    expected: 'Adjacent tiles converted to RuinApron; player can walk to entrance'
  - trigger: 'exitRuin when tiles at Chebyshev distance 2 from the overworld entrance include sand or space'
    expected: 'Player placed on the nearest walkable tile at Chebyshev distance >= 2 instead (sand/space skipped, but the 3x3 ring around the entrance is always skipped to prevent instant re-entry)'
  - trigger: 'Seed spawned at position later overwritten by RuinDebris'
    expected: 'Seed position removed during revalidation; no unreachable ground item'

verification:
  test_file: src/engine/__tests__/ruins.test.ts
  test_pattern: 'ruin accessibility'
  command: npx vitest run src/engine/__tests__/ruins.test.ts
