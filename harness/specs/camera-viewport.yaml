id: camera-viewport
name: 'Camera and viewport'
priority: medium
layer: engine
source_files:
  - src/engine/camera.ts
  - src/engine/types.ts
dependencies:
  - player-movement

behaviors:
  - id: camera-centering
    description: >
      updateCamera(state) centers the camera on the player every call.
      centering is uniform across all zones — the renderer projects iso,
      so the orthogonal viewport center maps to the iso canvas center;
      placing the player at orthogonal center keeps them at canvas
      center on screen (see camera-iso-follow spec). visible width is
      the full viewportWidth — no right-side panel inset is applied.
      no map-edge clamping is applied: the map is surrounded by space
      tiles, so overscroll past the map edges simply renders more space
      without trapping the player off-canvas at iso corners. when the
      map is smaller than the viewport on either axis, that axis
      centers the map with a negative camera offset. there is no
      free-pan mode — the camera always follows the player.
    inputs:
      - 'state with player position, viewport dimensions, map dimensions, currentZone'
    outputs:
      - 'state.camera.x and state.camera.y updated'
    state_changes:
      - field: camera.x
        effect: 'player.x - floor(viewportWidth / 2), or negative-centered if mapWidth < viewportWidth'
      - field: camera.y
        effect: 'player.y - floor(viewportHeight / 2), or negative-centered if mapHeight < viewportHeight'
    determinism: deterministic

edge_cases:
  - id: map-smaller-than-viewport
    description: 'cave map (40x25) displayed in a large viewport'
    expected: 'camera uses negative offset to center the small map; no scrolling needed'
  - id: player-at-map-edge
    description: 'player walks to the far edge of the overworld'
    expected: 'camera keeps centering on the player; canvas shows space tiles past the map without trapping the player off-center'

failure_conditions:
  - trigger: 'viewportWidth is 0 (before canvas initialization)'
    expected: 'camera calculations produce 0 offsets; no crash'

verification:
  test_file: src/engine/__tests__/camera.test.ts
  test_pattern: 'camera'
  command: npx vitest run src/engine/__tests__/camera.test.ts
