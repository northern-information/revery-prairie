id: deep-time-transition
name: 'Seamless deep time-to-wandering transition'
status: implemented
priority: medium
layer: integration
source_files:
  - src/engine/deepTime.ts
  - src/engine/renderer.ts
  - src/engine/types.ts
  - src/engine/constants.ts
  - src/components/Sidebar.tsx
dependencies:
  - genesis-transition
  - deep-time-endgame

behaviors:
  - id: sidebar-crossfade
    description: >
      when deep time transitions from Simulating to Wandering, the
      sidebar content transitions smoothly from the deep time HUD
      (year counter, phase label, progress bar) to the gameplay
      sidebar (weather, coordinates, tile counts). uses a CSS opacity
      fade-out on deep time content and fade-in on gameplay content
      over ~1000ms, reusing the same fade-in keyframe from the
      genesis transition.
    inputs:
      - 'state.deepTime.phase changes from Simulating to Wandering'
    outputs:
      - 'deep time sidebar fades out, gameplay sidebar fades in over ~1000ms'
    state_changes:
      - field: deepTimeTransition
        effect: 'set to { startTime, duration } when Wandering phase begins, cleared after duration'
    determinism: time-based

  - id: player-glyph-crossfade
    description: >
      during the transition window, the player character crossfades
      from the deep time glyph (ö, white) to the normal player glyph
      (@, white). the renderer interpolates opacity so the old glyph
      fades out while the new one fades in over ~800ms. since both
      are white, this appears as a smooth character morph.
    inputs:
      - 'deepTimeTransition active with startTime and duration'
      - 'state.deepTime.playerGlyph and PLAYER_CHAR'
    outputs:
      - 'player tile renders a crossfade from ö to @ over ~800ms'
    state_changes: []
    determinism: time-based

  - id: post-deep-time-landscape
    description: >
      the wandering phase begins on a radically altered landscape —
      burnt clover, regrown patches, new water patterns. no entities
      pop in because characters were destroyed during Burning phase
      and no new characters spawn. bees and ground items that survived
      the simulation are already on the map. the transition is purely
      visual (sidebar, player glyph) rather than entity-based.
    inputs:
      - 'deep time simulation completed'
    outputs:
      - 'landscape reflects accumulated simulation changes with no visual pops'
    state_changes: []
    determinism: deterministic

  - id: deep-time-not-active-skips-transition
    description: >
      when deepTime is null or inactive, no transition logic runs.
      deepTimeTransition remains null. rendering proceeds normally.
    inputs:
      - 'state.deepTime is null or state.deepTime.active is false'
    outputs:
      - 'no transition effects applied'
    state_changes:
      - field: deepTimeTransition
        effect: 'remains null'
    determinism: deterministic

edge_cases:
  - id: movement-during-transition
    description: >
      player begins moving immediately when Wandering starts. the
      sidebar and glyph crossfades continue visually. movement and
      pathfinding operate normally — the transition is purely visual.
    expected: 'movement processes identically to post-transition gameplay'

  - id: deep-time-already-wandering
    description: >
      if the game state is loaded or restored with deepTime already
      in Wandering phase, no transition fires. the sidebar and
      player glyph render in their final states immediately.
    expected: 'no transition animation, immediate normal rendering'

  - id: resize-during-transition
    description: >
      browser window resizes while the sidebar crossfade is active.
      the sidebar re-renders at the new dimensions. the fade
      animation continues uninterrupted.
    expected: 'sidebar adapts to new viewport size, fade continues'

failure_conditions:
  - trigger: 'deepTimeTransition.startTime is in the future (clock skew)'
    expected: 'clamp progress to 0, transition starts immediately on next frame'

  - trigger: 'deepTimeTransition is still active after 2x duration'
    expected: 'force-clear deepTimeTransition to null, render at full opacity'

verification:
  test_file: src/engine/__tests__/deepTimeTransition.test.ts
  test_pattern: 'deep time transition'
  command: npx vitest run src/engine/__tests__/deepTimeTransition.test.ts
