id: rts-camera-pan
name: 'RTS-style camera pan with edge-scroll'
priority: medium
layer: integration
source_files:
  - src/engine/camera.ts
  - src/engine/edgeScroll.ts
  - src/engine/gameLoop.ts
  - src/engine/movement.ts
  - src/engine/render/passes/edgeScrollIndicator.ts
  - src/engine/renderer.ts
  - src/engine/state.ts
  - src/engine/types.ts
  - src/harness/__tests__/serialization/schema.test.ts
dependencies:
  - isometric-projection

behaviors:
  - id: camera-mode-default-follow
    description: >
      createGameState initializes state.cameraMode to 'follow'. In follow
      mode the camera continues to track the player as it does today —
      updateCamera() centers the player (with overworld deadzone). The
      field is session-only (no localStorage); reload resets to 'follow'.
    inputs:
      - 'createGameState called with default options'
    outputs:
      - "GameState with cameraMode === 'follow'"
    state_changes:
      - field: cameraMode
        effect: "set to 'follow' on initialization"
    determinism: deterministic

  - id: edge-scroll-activates-free-mode
    description: >
      An edge-scroll tick runs every frame. It reads state.cursorScreenPos
      against the canvas edges. When the cursor is within EDGE_SCROLL_ZONE_PX
      pixels of any of the four canvas edges, the tick (a) sets
      state.cameraMode to 'free' if it was 'follow', (b) advances
      state.camera.x and state.camera.y by EDGE_SCROLL_SPEED_TILES_PER_SEC
      times the frame delta in the corresponding axis. Diagonal scroll is
      supported (cursor in a corner moves the camera in both axes).
      Camera position is clamped to map bounds plus a full viewport of
      overscroll on each side (overscrollX = viewportWidth,
      overscrollY = viewportHeight) so the iso footprint can be panned
      fully into view at the map corners. The hard outer clamp prevents
      runaway panning into infinity but allows generous overscroll past
      the rectangular tile bounds.
    inputs:
      - 'state.cursorScreenPos at canvas edge'
      - 'time delta from last frame'
    outputs:
      - 'state.camera.x/y advance toward the edge'
    state_changes:
      - field: cameraMode
        effect: "transitions from 'follow' to 'free' on first edge-scroll input"
      - field: camera.x
        effect: 'shifts in proportion to dt; clamped to [-viewportWidth, mapWidth - viewportWidth + viewportWidth]'
      - field: camera.y
        effect: 'shifts in proportion to dt; clamped to [-viewportHeight, mapHeight - viewportHeight + viewportHeight]'
    determinism: time-based

  - id: wasd-recenters-camera
    description: >
      A successful WASD-driven player move (via the keyboard-move tick)
      flips state.cameraMode back to 'follow' and re-runs updateCamera()
      so the camera snaps to the player. Click-to-move (tickPath) does
      NOT recenter — the user can issue commands to off-screen tiles
      while the camera stays panned. This matches RTS conventions where
      panning is independent of unit commands.
    inputs:
      - 'state.heldDirection set to a valid Direction'
      - 'movePlayer returns true'
    outputs:
      - 'camera snaps to player tile'
    state_changes:
      - field: cameraMode
        effect: "set to 'follow' after successful WASD move"
      - field: camera.x
        effect: 'recomputed via updateCamera; player tile centered'
      - field: camera.y
        effect: 'recomputed via updateCamera; player tile centered'
    determinism: deterministic

  - id: update-camera-respects-free-mode
    description: >
      updateCamera(state) early-returns when cameraMode is 'free' and
      forceCenter is false. This means tickPath, follow-collect coyote
      moves, and any other movement paths that flow through movePlayer
      no longer fight the user's pan. forceCenter=true (used by
      GameCanvas mount and zone transitions) bypasses the gate so the
      camera always re-anchors at game start and zone swaps.
    inputs:
      - "GameState with cameraMode === 'free'"
      - 'updateCamera(state, false)'
    outputs:
      - 'no camera mutation'
    state_changes: []
    determinism: deterministic

  - id: off-screen-player-indicator
    description: >
      The renderer draws a hot-pink arrow at the canvas edge pointing
      toward the player when the player tile is outside the visible
      viewport. The arrow is anchored to the canvas edge nearest the
      player, sits on the line connecting the canvas center to the
      player's projected position, and uses ACTION_COLOR (#ff69b4)
      consistent with other RTS-style UI.
    inputs:
      - "state.cameraMode === 'free' and player tile outside viewport"
    outputs:
      - 'arrow glyph drawn at the appropriate canvas edge'
    state_changes: []
    determinism: deterministic

  - id: edge-scroll-indicator-fade
    description: >
      The hot-pink edge indicator overlay (drawn by edgeScrollIndicator
      render pass) fades in and out instead of popping on/off. tickEdgeScroll
      maintains state.edgeScrollIndicatorAlpha (0–1) and advances it each
      frame using the dt between calls (clamped to (0, 200] to ignore the
      first frame and background-tab pauses). When the cursor sits in an
      edge zone (dx !== 0 || dy !== 0) alpha rises by dt / FADE_IN_MS
      (120ms full ramp). When the cursor leaves the zone, when
      edgeScrollPos is null, or when no axis is active, alpha falls by
      dt / FADE_OUT_MS (280ms full ramp). Alpha is clamped to [0, 1] each tick.
      state.edgeScrollIndicatorDirection latches the last non-zero
      {dx, dy} so the correct edges stay illuminated during fade-out
      after the cursor leaves the zone. The render pass's isActive checks
      alpha > 0 (not edgeScrollDirection) so it keeps drawing during
      fade-out, applies state.edgeScrollIndicatorAlpha via ctx.save +
      ctx.globalAlpha + ctx.restore, and reads
      edgeScrollIndicatorDirection (not edgeScrollDirection) for which
      edges to draw.
    inputs:
      - 'state.edgeScrollPos in or out of an edge zone'
      - 'frame dt (ms since last tickEdgeScroll call)'
    outputs:
      - 'state.edgeScrollIndicatorAlpha advances toward 1 (in zone) or 0 (out of zone)'
      - 'state.edgeScrollIndicatorDirection latches last non-zero direction'
      - 'render pass draws indicator at globalAlpha = edgeScrollIndicatorAlpha'
    state_changes:
      - field: edgeScrollIndicatorAlpha
        effect: 'rises by dt / 120 in zone, falls by dt / 280 out of zone, clamped to [0, 1]'
      - field: edgeScrollIndicatorDirection
        effect: 'latched to {dx, dy} on every tick where the active direction is non-zero'
      - field: lastEdgeScrollTime
        effect: 'set to time on every call (including the early-return path when edgeScrollPos is null)'
    determinism: time-based

edge_cases:
  - id: cursor-leaves-canvas
    description: 'Mouse leaves the canvas (state.cursorScreenPos becomes null)'
    expected: 'edge-scroll tick produces zero velocity; cameraMode stays whatever it was; no spurious panning'
  - id: small-map-no-pan
    description: 'Map smaller than viewport (cave zone): visible footprint already smaller than the viewport'
    expected: 'updateCamera continues to center the (small) map regardless of cameraMode; pan is a no-op because there is nowhere to pan to'
  - id: pan-then-zone-swap
    description: 'User pans freely in overworld, then steps onto a CaveEntrance tile and zone swaps to cave'
    expected: 'updateCamera(state, true) is called by the zone-swap path and bypasses the free-mode gate; cave camera initializes correctly; cameraMode resets to follow on zone swap'
  - id: pan-clamping-at-iso-edges
    description: 'The visible iso footprint extends diagonally past the rectangular tile space; user pans toward the corner'
    expected: 'camera position clamps to [-viewportWidth, mapWidth] x [-viewportHeight, mapHeight] — a full viewport of overscroll on each side so the iso footprint can be fully framed at map corners. Outer clamp prevents runaway scroll into infinity.'
  - id: simultaneous-edge-and-wasd
    description: 'User holds WASD while cursor is at a canvas edge'
    expected: 'WASD-recenter wins each frame: keyboard-move tick runs, recenters, edge-scroll tick may flip back to free on the same frame; visually the camera tracks the player'
  - id: cursor-over-log-overlay
    description: 'User moves the cursor over the EventLog overlay in the lower-left corner — the overlay sits inside the bottom-left edge-scroll zone'
    expected: 'Log overlay nulls state.edgeScrollPos on hover (same pattern as the right-hand Sidebar); edge-scroll tick produces zero velocity while hovered; cameraMode does not flip to free from the hover alone; edge-scroll resumes when the cursor leaves the overlay and the next canvas mousemove restores edgeScrollPos'
  - id: indicator-fade-out-after-cursor-leaves-zone
    description: 'Cursor moves from an edge zone back into the centre of the canvas'
    expected: 'edgeScrollDirection becomes {0,0} immediately; edgeScrollIndicatorAlpha decays linearly toward 0 over ~280ms; edgeScrollIndicatorDirection retains the last active {dx, dy} so the same edges stay illuminated during the fade'
  - id: indicator-fade-out-after-cursor-leaves-canvas
    description: 'Mouse leaves the canvas entirely (state.edgeScrollPos becomes null) while the indicator is at full alpha'
    expected: 'tickEdgeScroll early-returns but still advances dt and decays edgeScrollIndicatorAlpha toward 0 over ~280ms; edgeScrollDirection becomes {0,0}; edgeScrollIndicatorDirection retains the latched direction; isActive returns true until alpha reaches 0'
  - id: indicator-fade-in-clamps-at-1
    description: 'Cursor remains in an edge zone for longer than FADE_IN_MS'
    expected: 'edgeScrollIndicatorAlpha clamps at 1.0; no overshoot; further frames in zone are no-ops for alpha'
  - id: indicator-first-frame-and-background-tab
    description: 'First tick after game start (lastEdgeScrollTime === 0) or after a long background-tab pause (dt > 200)'
    expected: 'dt-validity guard (dt > 0 && dt <= 200) suppresses the alpha update for that frame; lastEdgeScrollTime advances; the next valid frame resumes fade-in/out from current alpha without a phase jump'
  - id: indicator-direction-change-mid-fade
    description: 'Cursor moves from one edge zone (e.g. right) directly into another (e.g. bottom-right corner) without leaving an edge zone'
    expected: 'edgeScrollIndicatorDirection updates to the new {dx, dy}; alpha continues rising; the previous edge stops drawing on the same frame and the new edges illuminate at the current alpha'

failure_conditions:
  - trigger: 'Edge-scroll tick keeps mutating camera in follow mode without flipping to free'
    expected: "cameraMode stuck at 'follow'; auto-center every move undoes the pan; pan feels broken"
  - trigger: 'Click-to-move recenters the camera'
    expected: 'sending units to off-screen tiles snaps the camera away from the user pan; spec violated'
  - trigger: 'Camera position not clamped during free-pan'
    expected: 'user can scroll past the overscroll envelope into infinity; spec violated — the outer clamp must keep the camera within the documented overscrolled range'
  - trigger: 'Indicator render pass reads edgeScrollDirection instead of edgeScrollIndicatorDirection'
    expected: 'fade-out renders with no edges illuminated (dx/dy already zeroed) — the overlay collapses to a dim rectangle; spec violated'
  - trigger: 'tickEdgeScroll skips alpha decay when edgeScrollPos is null'
    expected: 'indicator stays at full alpha forever after cursor leaves the canvas; visible until next mousemove returns to a non-edge zone; spec violated'

verification:
  test_file: src/engine/__tests__/edgeScroll.test.ts
  test_pattern: 'edge'
  command: 'npx vitest run src/engine/__tests__/edgeScroll.test.ts src/engine/__tests__/camera.test.ts'
