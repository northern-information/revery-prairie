id: weather
name: 'Weather system'
priority: medium
layer: engine
source_files:
  - src/engine/weather/index.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/constants.ts
dependencies: []

behaviors:
  - id: weather-generation
    description: >
      generateWeather creates a Weather object with random spring
      conditions: temperatureF in [35, 72], windSpeed in [3, 25],
      humidity in [45, 85], random windDirection from 8 directions,
      sky determined by humidity via pickSky, season hardcoded to
      spring. called once during createGameState.
    inputs:
      - 'createGameState call'
    outputs:
      - 'Weather object with all fields initialized'
    state_changes:
      - field: weather
        effect: 'initialized with random spring conditions'
    determinism: probabilistic

  - id: weather-tick-drift
    description: >
      tickWeather mutates a Weather object in place. each tick:
      temperature drifts ±2°F clamped to [35, 72], humidity drifts
      ±3% clamped to [45, 85], windSpeed drifts ±2 mph clamped to
      [3, 25]. windDirection has 15% chance to change to a random
      direction from all 8 wind directions (N, NE, E, SE, S, SW, W,
      NW). sky has 30% chance to update via pickSky based on current
      humidity. season is never mutated.
    inputs:
      - 'Weather object'
    outputs: []
    state_changes:
      - field: weather.temperatureF
        effect: 'drifts ±2, clamped to [35, 72]'
      - field: weather.humidity
        effect: 'drifts ±3, clamped to [45, 85]'
      - field: weather.windSpeed
        effect: 'drifts ±2, clamped to [3, 25]'
      - field: weather.windDirection
        effect: '15% chance to change to random direction from all 8 WIND_DIRECTIONS'
      - field: weather.sky
        effect: '30% chance to recalculate from humidity'
    determinism: probabilistic

  - id: sky-from-humidity
    description: >
      pickSky determines sky condition from humidity. humidity >= 75:
      60% rain, 40% cloudy. humidity 55-74: 50% cloudy, 50% sun.
      humidity < 55: 80% sun, 20% cloudy.
    inputs:
      - 'humidity: number'
    outputs:
      - "Sky: 'sun' | 'cloudy' | 'rain'"
    state_changes: []
    determinism: probabilistic

  - id: rain-intensity-ramp
    description: >
      state.rainIntensity is a number in [0.0, 1.0] that ramps up
      when weather.sky is rain and ramps down when it is not rain.
      tickRainIntensity is called every frame (rAF) with the elapsed
      time delta. when sky is rain, intensity increases by
      dt / RAIN_FADE_DURATION_MS, clamped to 1.0. when sky is not
      rain, intensity decreases by dt / RAIN_FADE_DURATION_MS, clamped
      to 0.0. RAIN_FADE_DURATION_MS is 3000 (3 seconds for a full
      fade in or out). the renderer and tileWater both read
      rainIntensity — renderer for visual alpha, tileWater for whether
      to hydrate (hydrates when rainIntensity > 0 and tile is in
      front).
    inputs:
      - 'rAF tick with dt in milliseconds'
      - 'state.weather.sky'
    outputs: []
    state_changes:
      - field: rainIntensity
        effect: 'ramps toward 1.0 when raining, toward 0.0 when not raining, by dt/RAIN_FADE_DURATION_MS per frame'
    determinism: time-based

  - id: unit-conversions
    description: >
      fToC converts Fahrenheit to Celsius via (f - 32) * 5 / 9,
      rounded. mphToKph converts mph to kph via mph * 1.609,
      rounded. used by the sidebar when state.metric is true.
    inputs:
      - 'temperature in Fahrenheit or speed in mph'
    outputs:
      - 'temperature in Celsius or speed in kph'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: temperature-at-bounds
    description: 'temperature at 35°F or 72°F — drift must not escape range'
    expected: 'clamped to [35, 72] after drift'
  - id: humidity-at-bounds
    description: 'humidity at 45% or 85% — drift must not escape range'
    expected: 'clamped to [45, 85] after drift'
  - id: wind-at-bounds
    description: 'wind at 3 or 25 mph — drift must not escape range'
    expected: 'clamped to [3, 25] after drift'
  - id: season-never-changes
    description: 'season is hardcoded to spring, tickWeather never mutates it'
    expected: 'weather.season remains spring after any number of ticks'
  - id: rain-intensity-ramps-not-jumps
    description: 'when sky changes from rain to sun or vice versa, rainIntensity transitions smoothly over RAIN_FADE_DURATION_MS rather than jumping to 0 or 1'
    expected: 'intermediate values visible over multiple frames during transition'
  - id: rain-intensity-starts-at-zero
    description: 'rainIntensity initializes to 0.0 in createGameState even if initial sky is rain — rain fades in at game start'
    expected: 'state.rainIntensity is 0.0 at init, ramps up on first frames if raining'

failure_conditions:
  - trigger: 'Temperature exceeds [35, 72] range after many ticks'
    expected: 'Clamping prevents out-of-range values'
  - trigger: 'Humidity exceeds [45, 85] range after many ticks'
    expected: 'Clamping prevents out-of-range values'

verification:
  test_file: src/engine/__tests__/weather.test.ts
  test_pattern: 'weather'
  command: 'npx vitest run src/engine/__tests__/weather.test.ts'
