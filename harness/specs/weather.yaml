id: weather
name: 'Weather system'
priority: medium
layer: engine
source_files:
  - src/engine/weather/index.ts
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/constants.ts
dependencies: []

behaviors:
  - id: weather-generation
    description: >
      generateWeather creates a Weather object seeded at the spring-
      equinox anchor (state.seasonalPhase = 0). Temperature is
      Math.round(seasonalMeanTemperature(0) + randBetween(-5, 5)),
      which lands near the 47.5°F midpoint of the winter/summer
      means; humidity in [30, 95]; windSpeed in [1, 30]; random
      windDirection from 8 directions; sky determined by humidity +
      season via pickSky; season is derived via
      deriveSeason(temperatureF, 0) and therefore reads as Spring on
      a fresh game (mid-range temp + phase-quadrant [0, 0.25)).
      Called once during createGameState.
    inputs:
      - 'createGameState call'
    outputs:
      - 'Weather object with all fields initialized; season = Spring on a fresh game'
    state_changes:
      - field: weather
        effect: 'initialized with random spring-equinox conditions; season derived to Spring'
    determinism: probabilistic

  - id: weather-tick-drift
    description: >
      tickWeather (precis #2 signature: tickWeather(state, dt))
      mutates state in place. Phenology drives the calendar — when
      state.currentZone is Overworld, state.seasonalPhase advances
      by dt / SEASONAL_PHASE_PERIOD_MS (mod 1); cave/ruin zones
      freeze the phase. state.currentDate is always rewritten via
      phaseToDate(state.seasonalPhase) so reads from any zone are
      consistent. Per-tick atmospheric drift: temperature, humidity,
      and windSpeed each take a random walk (±2°F, ±3%, ±2 mph)
      plus a soft pull toward the seasonal mean
      (seasonalMeanTemperature / Humidity / Wind, weighted by
      SEASONAL_BIAS_STRENGTH = 0.05) so the year actually arrives
      over the 20-minute cycle; values clamp to [TEMP_MIN_F,
      TEMP_MAX_F] = [-5, 95], [HUMIDITY_MIN, HUMIDITY_MAX] =
      [30, 95], [WIND_MIN, WIND_MAX] = [1, 30]. windDirection has a
      15% chance (Math.random() > 0.85) to flip to a random one of
      the 8 WIND_DIRECTIONS. weather.season is reclassified every
      tick via deriveSeason(weather.temperatureF, state.seasonalPhase)
      before sky is picked, so winter actually arrives. sky has a
      30% chance (Math.random() > 0.7) to recalculate via
      pickSky(weather.humidity, weather.season) — passing the
      derived season is what lets pickSky choose Snow vs Rain.
    inputs:
      - 'state: GameState'
      - 'dt: milliseconds since the last tick (typically WEATHER_TICK_MS = 5000)'
    outputs: []
    state_changes:
      - field: state.seasonalPhase
        effect: 'advances by dt / SEASONAL_PHASE_PERIOD_MS (mod 1) when state.currentZone === Overworld; frozen otherwise'
      - field: state.currentDate
        effect: 'recomputed every tick via phaseToDate(state.seasonalPhase), in every zone'
      - field: weather.temperatureF
        effect: 'random walk ±2 plus SEASONAL_BIAS_STRENGTH pull toward seasonalMeanTemperature(phase); clamped to [TEMP_MIN_F, TEMP_MAX_F]'
      - field: weather.humidity
        effect: 'random walk ±3 plus seasonal-mean pull; clamped to [HUMIDITY_MIN, HUMIDITY_MAX]'
      - field: weather.windSpeed
        effect: 'random walk ±2 plus seasonal-mean pull; clamped to [WIND_MIN, WIND_MAX]'
      - field: weather.windDirection
        effect: '15% chance per tick to flip to a random one of WIND_DIRECTIONS'
      - field: weather.season
        effect: 'always reclassified via deriveSeason(weather.temperatureF, state.seasonalPhase) before sky is picked'
      - field: weather.sky
        effect: '30% chance per tick to recalculate via pickSky(humidity, season)'
    determinism: probabilistic

  - id: sky-from-humidity
    description: >
      pickSky(humidity, season) determines sky condition from
      humidity, biased by season. humidity >= 75 picks a
      precipitation outcome (60%) or cloudy (40%); humidity 55-74
      splits 50% cloudy / 50% sun; humidity < 55 splits 80% sun /
      20% cloudy. Season selects the precipitation form — when
      season is Winter, the precipitation outcome is Sky.Snow;
      otherwise it is Sky.Rain. Sky.Snow is what later lets the
      weatherSnowOverlay render pass run and drives
      tickPrecipitationIntensity the same as Sky.Rain.
    inputs:
      - 'humidity: number'
      - 'season: Season'
    outputs:
      - "Sky: 'sun' | 'cloudy' | 'rain' | 'snow'"
    state_changes: []
    determinism: probabilistic

  - id: precipitation-intensity-ramp
    description: >
      state.precipitationIntensity is a number in [0.0, 1.0] that
      ramps up when weather.sky is precipitating (Sky.Rain OR
      Sky.Snow) and ramps down when it is not. tickPrecipitationIntensity
      (renamed from tickRainIntensity in precis #2) is called every
      frame with the elapsed time delta. when the target sky is
      precipitating, intensity moves toward 1 by dt /
      RAIN_FADE_DURATION_MS; otherwise it moves toward 0 by the
      same step. RAIN_FADE_DURATION_MS is 3000 (3 seconds for a
      full fade in or out). Both the rain and snow render passes
      and tileWater hydration read this single normalized signal
      — renderer for visual alpha, tileWater for whether to
      hydrate (hydrates when precipitationIntensity > 0 and tile
      is in the active precipitation front).
    inputs:
      - 'rAF tick with dt in milliseconds'
      - 'state.weather.sky'
    outputs: []
    state_changes:
      - field: state.precipitationIntensity
        effect: 'ramps toward 1.0 when sky is Rain or Snow, toward 0.0 otherwise, by dt/RAIN_FADE_DURATION_MS per frame'
    determinism: time-based

  - id: unit-conversions
    description: >
      fToC converts Fahrenheit to Celsius via (f - 32) * 5 / 9,
      rounded. mphToKph converts mph to kph via mph * 1.609,
      rounded. used by UI surfaces that read weather state when state.metric is true.
    inputs:
      - 'temperature in Fahrenheit or speed in mph'
    outputs:
      - 'temperature in Celsius or speed in kph'
    state_changes: []
    determinism: deterministic

edge_cases:
  - id: temperature-at-bounds
    description: 'temperature at TEMP_MIN_F (-5°F) or TEMP_MAX_F (95°F) — drift plus seasonal bias must not escape range'
    expected: 'clamped to [-5, 95] after drift'
  - id: humidity-at-bounds
    description: 'humidity at HUMIDITY_MIN (30%) or HUMIDITY_MAX (95%) — drift plus seasonal bias must not escape range'
    expected: 'clamped to [30, 95] after drift'
  - id: wind-at-bounds
    description: 'wind at WIND_MIN (1 mph) or WIND_MAX (30 mph) — drift plus seasonal bias must not escape range'
    expected: 'clamped to [1, 30] after drift'
  - id: season-changes-with-phase-and-temperature
    description: 'weather.season is reclassified every tick via deriveSeason(weather.temperatureF, state.seasonalPhase); over the 20-minute SEASONAL_PHASE_PERIOD_MS cycle the seasonal bias drags temperature toward the seasonal mean and the season label advances Spring → Summer → Autumn → Winter and back'
    expected: 'weather.season changes value at least once over a full phase cycle in the overworld'
  - id: seasonal-phase-frozen-in-cave
    description: 'state.seasonalPhase only advances when state.currentZone is Overworld; in cave/ruin zones the phase is frozen but currentDate is still rewritten from the current phase'
    expected: 'state.seasonalPhase is unchanged after any number of ticks in a non-overworld zone; state.currentDate is still set'
  - id: precipitation-intensity-ramps-not-jumps
    description: 'when sky transitions between precipitating (Rain/Snow) and non-precipitating (Sun/Cloudy), precipitationIntensity transitions smoothly over RAIN_FADE_DURATION_MS rather than jumping to 0 or 1'
    expected: 'intermediate values visible over multiple frames during transition'
  - id: precipitation-intensity-starts-at-zero
    description: 'state.precipitationIntensity initializes to 0.0 in createGameState even if initial sky is Rain or Snow — precipitation fades in at game start'
    expected: 'state.precipitationIntensity is 0.0 at init, ramps up on first frames if precipitating'

failure_conditions:
  - trigger: 'Temperature exceeds [-5, 95] range after many ticks'
    expected: 'Clamping prevents out-of-range values'
  - trigger: 'Humidity exceeds [30, 95] range after many ticks'
    expected: 'Clamping prevents out-of-range values'
  - trigger: 'state.seasonalPhase advances while state.currentZone is Cave or Ruin'
    expected: 'The phenology gate is broken — phase must only tick in the overworld'

verification:
  test_file: src/engine/__tests__/weather.test.ts
  test_pattern: 'weather'
  command: 'npx vitest run src/engine/__tests__/weather.test.ts'
