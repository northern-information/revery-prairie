id: universal-pickup-bloom
name: Universal Pickup Bloom Effect
priority: medium
layer: engine
source_files:
  - src/engine/entities.ts
  - src/engine/effects.ts
  - src/engine/coyote.ts
  - src/engine/floraLifecycle.ts
  - src/engine/drag.ts
  - src/engine/interaction.ts
  - src/engine/gameLoop.ts
  - src/engine/__tests__/pickupBloom.test.ts
dependencies:
  - shooting-stars
  - coyote-companion

behaviors:
  - id: spawn-bloom-helper
    description: >
      A reusable spawnPickupBloom(state, x, y, time) function in effects.ts
      creates a pickupBloom ECS entity at the given position with the given
      start time and zone. All acquisition paths call this instead of
      inlining the ECS component setup.
    inputs:
      - 'GameState, x, y, time'
    outputs:
      - 'pickupBloom ECS entity created at (x, y) with startTime and current zone'
    state_changes:
      - field: world
        effect: 'new entity with Position, TimedEffect(pickupBloom), EntityTag(pickupBloom), EntityZone'
    determinism: deterministic

  - id: ground-item-bloom
    description: >
      When the player moves within Chebyshev distance 1 of a ground item
      and it is picked up, a pickupBloom spawns at the player position.
      All ground item types (coins, honey, etc.) trigger the bloom.
      Multiple items picked up in one move still produce exactly one bloom.
    inputs:
      - 'player moves to within Chebyshev distance 1 of ground item entity'
      - 'time parameter is provided'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

  - id: meteorite-pickup-bloom
    description: >
      When the player moves within Chebyshev distance 1 of a meteorite
      entity (3x3 footprint around the player, matching the pickup-hitbox
      spec) and the meteorite is captured, a pickupBloom spawns at the
      player position via the shared helper.
    inputs:
      - 'player moves to within Chebyshev distance 1 of a meteorite entity'
      - 'time parameter is provided'
      - 'meteorite is captured into the backpack'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

  - id: harvest-bloom
    description: >
      When the player harvests clover with [f], a pickupBloom spawns at the
      player position. harvestClover receives time and calls spawnPickupBloom
      on success.
    inputs:
      - 'player presses [f] facing clover tile'
      - 'harvest succeeds (clover is healthy, backpack has room)'
      - 'time parameter is provided'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

  - id: coyote-delivery-bloom
    description: >
      When the coyote delivers an item to the player's backpack, a
      pickupBloom spawns at the player position.
    inputs:
      - 'coyote is adjacent to player with cargo'
      - 'item fits in backpack'
      - 'time parameter is provided'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

  - id: craft-bloom
    description: >
      When a recipe is successfully executed via drag-and-drop combine,
      a pickupBloom spawns at the player position.
    inputs:
      - 'executeCombine returns success'
      - 'time parameter is provided'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

  - id: revery-gift-bloom
    description: >
      When a character gives the player a revery (initial gift or post-gift),
      a pickupBloom spawns at the player position.
    inputs:
      - 'dialog completes with a character that has an unclaimed gift'
      - 'gift is a revery'
      - 'time parameter is provided'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

  - id: progression-event-bloom
    description: >
      Progression events that mark a meaningful gameplay advance also
      spawn a pickupBloom at the player position, even when no item
      is acquired. Currently: clearing the coyote-role collapseBarrier
      via clearRuinDebris, and rescueCoyote firing on adjacency. The
      bloom marks the narrative beat; the player has not picked up
      anything but progression has occurred.
    inputs:
      - 'collapseBarrier cleared in the coyote-role ruin'
      - 'tryCoyoteRescueOnApproach fires rescueCoyote'
      - 'time parameter is provided'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

  - id: single-bloom-per-event
    description: >
      Each acquisition event spawns exactly one pickupBloom regardless of
      how many items are picked up. Walking over 3 ground items in one
      move spawns 1 bloom, not 3.
    inputs:
      - 'multiple items at the same tile picked up in one move'
    outputs:
      - 'exactly one pickupBloom entity'
    state_changes:
      - field: world
        effect: 'one pickupBloom entity, not N'
    determinism: deterministic

  - id: convention-all-acquisitions
    description: >
      All current and future item acquisition paths must call
      spawnPickupBloom. This is a project convention documented in
      CLAUDE.md. Any new code that adds items to the backpack, opens
      a zone, or otherwise gives the player something must spawn a
      bloom at the player position.
    inputs:
      - 'any new acquisition path added in the future'
    outputs:
      - 'pickupBloom at player position'
    state_changes:
      - field: world
        effect: 'pickupBloom entity created at player position'
    determinism: deterministic

edge_cases:
  - id: no-bloom-without-time
    description: >
      If time parameter is not provided (e.g. pickUpGroundItems called
      without time), no bloom is spawned. This preserves backward
      compatibility with test helpers that omit time.
    expected: 'no pickupBloom entity created'

  - id: no-bloom-on-failed-harvest
    description: >
      If harvestClover fails (no clover, backpack full, dying clover),
      no bloom is spawned.
    expected: 'no pickupBloom entity created'

  - id: no-bloom-on-failed-combine
    description: >
      If executeCombine returns outcome:failed, no bloom is spawned.
    expected: 'no pickupBloom entity created'

  - id: coyote-gron-delivery-no-bloom
    description: >
      When the coyote delivers an item to Gron (backpack full fallback),
      no bloom spawns at the player position since the player did not
      receive the item.
    expected: 'no pickupBloom entity at player position'

  - id: bloom-zone-correct
    description: >
      Bloom entity uses state.currentZone so it only renders in the zone
      where the pickup occurred.
    expected: 'pickupBloom EntityZone matches state.currentZone'

failure_conditions:
  - trigger: 'spawnPickupBloom called with invalid position'
    expected: 'entity still created — renderer handles out-of-bounds gracefully'
  - trigger: 'ECS world full (theoretical)'
    expected: 'createEntity throws — no silent failure'

verification:
  test_file: src/engine/__tests__/pickupBloom.test.ts
  test_pattern: pickupBloom
  command: npx vitest run src/engine/__tests__/pickupBloom.test.ts
