id: coyote-companion
name: 'Coyote Companion'
priority: high
layer: integration
source_files:
  - src/engine/types.ts
  - src/engine/state.ts
  - src/engine/entities.ts
  - src/engine/characters.ts
  - src/engine/movement.ts
  - src/engine/interaction.ts
  - src/engine/pathfinding.ts
  - src/engine/renderer.ts
  - src/engine/constants.ts
  - src/engine/position.ts
  - src/engine/coyote.ts
  - src/engine/manual.ts
  - src/components/PermacomputerShell.tsx
  - src/components/CoyoteScreen.tsx
  - src/components/Sidebar.tsx
  - src/hooks/useKeyboard.ts
  - src/hooks/useGameEngine.ts
dependencies:
  - player-movement
  - ghosts

behaviors:
  - id: coyote-spawning
    description: >
      createGameState creates one coyote ECS entity via
      createCharacterEntity with definitionId 'coyote' at a position
      adjacent to the player start. the coyote has ECS components:
      CharacterIdentity, Position, Blocking, Behavior (type: 'follow'),
      EntityTag ('character'), and EntityZone (overworld). a
      CharacterDefinition is registered with id 'coyote', name 'Coyote',
      glyph 'C', glyphColor '#D4A054' (warm amber-tan). the coyote has
      no dialog array — pressing [e] opens a mode-toggle menu instead
      of the standard dialog system.
    inputs:
      - 'createGameState call'
    outputs:
      - 'GameState with 1 coyote ECS entity in state.world'
    state_changes:
      - field: world
        effect: "1 coyote ECS entity created with CharacterIdentity({ definitionId: 'coyote' }), Position, Blocking, Behavior({ type: 'follow' }), EntityTag('character'), EntityZone({ zone: 'overworld' })"
      - field: CHARACTER_DEFINITIONS
        effect: "CharacterDefinition entry registered for 'coyote' with glyph 'C', glyphColor '#D4A054', name 'Coyote'"
      - field: coyoteMode
        effect: "new GameState field initialized to 'follow'"
    determinism: deterministic

  - id: coyote-follow-behavior
    description: >
      when coyoteMode is 'follow', the coyote trails the player by
      maintaining a target distance of 2-3 tiles measured by A* path
      length. each tick, the coyote computes the A* path to the player.
      if the path length is greater than COYOTE_FOLLOW_MAX_DIST (3),
      it takes one step along the path. if the path length is less than
      or equal to COYOTE_FOLLOW_MIN_DIST (2), it idles. this uses path
      distance (not chebyshev) so the coyote correctly follows through
      narrow corridors and around corners in all zones (overworld, cave,
      and any future zones). movement uses the same A* pathfinding as
      click-to-move, respecting blocked positions and unwalkable tiles.
      the coyote moves at a rate slightly slower than the player (one
      step per ~150ms vs player's 100ms). the coyote removes itself
      from the blocked set before pathfinding (same pattern as ghost
      drift).
    inputs:
      - "coyoteMode === 'follow'"
      - 'player position changes'
    outputs:
      - 'coyote position moves toward player'
    state_changes:
      - field: 'world (coyote entity Position component)'
        effect: 'moved one tile along A* path toward player, or unchanged if within 2 tiles'
    determinism: probabilistic

  - id: coyote-collect-behavior
    description: >
      when coyoteMode is 'collect', the coyote autonomously gathers
      all ground items regardless of definitionId. on each tick, if the
      coyote is not carrying an item (coyoteCargo is null), it scans
      all ground items on the current map (both ItemDrop+'groundItem'
      entities and Pickupable+'meteorite' entities), computes the
      nearest one by manhattan distance, pathfinds to it, and takes one
      step. upon arriving at the item's tile, the coyote picks it up:
      removes the ground item ECS entity and sets coyoteCargo to the
      item definition id. once carrying, the coyote pathfinds toward
      the player. upon arriving adjacent to the player, it attempts to
      place the item in the player's backpack via placeItem. if
      backpack has room, the item is placed and coyoteCargo is cleared.
      if backpack is full, the coyote pathfinds to Gron's position and
      drops the item as a ground item entity near Gron (using the same
      DROP_DELTAS pattern as existing drop logic). after each delivery,
      the coyote resumes scanning for the next item. when no ground
      items remain on the map and the coyote is not carrying cargo, the
      coyote falls back to follow behavior (same logic as tickFollow —
      trails the player at 2-3 tile path distance) until new items
      appear. when a ground item spawns while the coyote is mid-follow-
      step, the coyote finishes its current step before switching to
      collect on the next tick. when state.currentZone is Zone.Ruin,
      collect mode is suppressed and the coyote follows the player
      regardless of coyoteMode (ruin layouts are too cramped for
      autonomous collection). each pickup and each delivery fires
      addEvent with kind 'pickup', the item icon, and descriptive text.
      COYOTE_COLLECTIBLE_DEFINITIONS is removed — no allowlist filtering.
    inputs:
      - "coyoteMode === 'collect'"
      - 'any ground items exist on current map'
    outputs:
      - 'items collected and placed in player backpack or dropped near Gron'
      - 'addEvent called for each pickup and delivery'
    state_changes:
      - field: coyoteCargo
        effect: "set to item definitionId when picking up, cleared to null on delivery"
      - field: 'world (ground item entities)'
        effect: 'ground item entity destroyed when coyote picks it up'
      - field: 'backpack containers'
        effect: 'item placed in backpack when coyote delivers to player'
      - field: 'world (coyote entity Position component)'
        effect: 'moved one tile along A* path toward target item or player'
    determinism: deterministic

  - id: coyote-interaction
    description: >
      pressing [e] while adjacent to the coyote toggles coyoteMode
      between 'follow' and 'collect'. unlike other characters, the
      coyote does not open the dialog system. instead, getAdjacentCharacter
      still detects the coyote, but interactWithCharacter checks for
      the 'coyote' definitionId and delegates to a coyote-specific
      handler that toggles the mode and fires an addEvent with the
      new mode. the coyote is detected by isInteractableAt at its
      position.
    inputs:
      - 'player adjacent to coyote, [e] pressed'
    outputs:
      - 'coyoteMode toggled'
      - 'addEvent called with new mode description'
    state_changes:
      - field: coyoteMode
        effect: "toggled between 'follow' and 'collect'"
    determinism: deterministic

  - id: coyote-non-blocking-for-player
    description: >
      the coyote has a Blocking component but is excluded from
      getBlockedPositions when the ignoreCoyote option is set.
      movePlayer and getPathfindingBlockers use ignoreCoyote: true,
      so the player can walk onto the coyote tile and A* routes
      through it. other entities (ghosts, etc.) still see the coyote
      as blocking via the default getBlockedPositions call. when the
      player and coyote overlap, the coyote nudges to an adjacent
      walkable tile on its next follow tick.
    inputs:
      - 'GameState with coyote adjacent to player'
      - 'direction toward coyote tile'
    outputs:
      - 'boolean: true from movePlayer (player walks onto coyote tile)'
      - 'coyote nudges off player tile on next tick'
    state_changes:
      - field: 'world (coyote entity Position component)'
        effect: 'moved to adjacent walkable tile when overlapping player'
    determinism: deterministic

  - id: coyote-zone-transition
    description: >
      when the player changes zones (cave entrance/exit, ruin
      entrance/exit, or any future zone), transitionCoyoteToZone
      teleports the coyote to a walkable tile adjacent to the
      player's new position and updates the coyote's EntityZone
      component to match. the function is zone-agnostic — callers
      pass the destination Zone after setting state.currentZone /
      currentRuinIndex. if coyoteMode is 'collect', the coyote
      continues collecting in the new zone where allowed (collect
      mode is suppressed in Ruin zones; see coyote-collect-behavior).
    inputs:
      - 'player triggers a zone change (cave or ruin entrance/exit)'
    outputs:
      - 'coyote teleported to adjacent walkable tile in new zone'
    state_changes:
      - field: 'world (coyote entity Position and EntityZone components)'
        effect: 'position set adjacent to player in new zone, EntityZone updated'
    determinism: deterministic

  - id: coyote-rts-command-suppression
    description: >
      when state.unitCommands has an entry for the coyote entity
      (set by RTS-style player commands — see rts-unit-selection),
      tickCoyote returns early without running follow or collect
      behavior. autonomous behavior resumes once the command is
      cleared. this lets player-issued move orders override the
      coyote's default tick behavior without race conditions.
    inputs:
      - 'state.unitCommands.has(coyoteEid) === true'
    outputs:
      - 'no autonomous coyote movement this tick'
    state_changes: []
    determinism: deterministic

  - id: coyote-rendering
    description: >
      the coyote renders as 'C' in warm amber-tan (#D4A054) at its
      world position. rendered at the same z-level as characters in
      the renderer (same path as ghosts and other characters via
      CharacterIdentity resolution).
    inputs:
      - 'GameState with coyote in viewport'
    outputs:
      - "C character drawn in #D4A054 at coyote position"
    state_changes: []
    determinism: deterministic

  - id: coyote-cursor-info
    description: >
      hovering the mouse over the coyote tile shows 'Coyote' in the
      sidebar contents row and the current mode (follow/collect) in
      the effects row. the coyote is detected via the standard
      character entity lookup in the sidebar contents IIFE.
    inputs:
      - 'mouse cursor over coyote tile'
    outputs:
      - "sidebar contents: 'Coyote'"
      - "sidebar shows current coyote mode"
    state_changes: []
    determinism: deterministic

  - id: coyote-manual-entry
    description: >
      the coyote appears in the prairie manual as a character entry
      derived from CHARACTER_DEFINITIONS. discovery tracked as
      'character:coyote'. MANUAL_LORE entry added with TODO placeholder.
    inputs:
      - 'character:coyote discovery recorded'
    outputs:
      - 'manual entry visible for Coyote'
    state_changes:
      - field: manualDiscoveries
        effect: "'character:coyote' added to set"
    determinism: deterministic

  - id: coyote-permacomputer-tab
    description: >
      a 'COYOTE' tab is rendered in the permacomputer shell between
      CANTOS and SYS, but only after the coyote has been rescued —
      specifically when state.manualDiscoveries contains
      'event:rescue-coyote'. before rescue the tab is hidden and there
      is no way for the player to reach the CoyoteScreen. the
      PermacomputerScreen type still includes 'coyote' as a valid
      activeScreen value; visibility is enforced at the tab-bar render
      layer (see permacomputer-tab-visibility spec). once visible, the
      CoyoteScreen component displays the current coyote mode and a
      'summon' action. activating summon teleports the coyote to an
      adjacent walkable tile next to the player (using the same
      adjacency-finding logic as cave transition). the tab shows the
      coyote's current cargo status (empty or carrying an item name).
    inputs:
      - 'permacomputer open, COYOTE tab selected (only available post-rescue)'
      - 'summon action activated'
    outputs:
      - 'COYOTE tab rendered only when event:rescue-coyote has been recorded'
      - 'coyote teleported to tile adjacent to player'
    state_changes:
      - field: 'world (coyote entity Position component)'
        effect: 'position set to walkable tile adjacent to player'
    determinism: deterministic

  - id: coyote-mouth-capacity
    description: >
      the coyote carries at most 1 item at a time in its mouth. this
      is tracked by coyoteCargo on GameState (string | null). when
      coyoteCargo is non-null, the coyote must deliver before picking
      up another item.
    inputs:
      - 'coyote picks up a ground item'
    outputs:
      - 'coyoteCargo set to definitionId'
    state_changes:
      - field: coyoteCargo
        effect: 'set to definitionId of picked-up item, null after delivery'
    determinism: deterministic

edge_cases:
  - id: coyote-no-collectibles
    description: 'coyote is in collect mode but no ground items exist on the map and not carrying cargo'
    expected: 'coyote falls back to follow behavior (trails player at 2-3 tile distance), resumes collecting when new items spawn'
  - id: coyote-backpack-full-gron-area-full
    description: 'backpack is full and all drop positions near Gron are occupied by ground items or blocked'
    expected: 'coyote idles near Gron holding cargo until a drop position opens'
  - id: coyote-path-blocked
    description: 'coyote pathfinding returns no valid path to target item (surrounded by blockers or unwalkable tiles)'
    expected: 'coyote skips that item and targets the next nearest collectible, or idles if none reachable'
  - id: coyote-player-moves-during-delivery
    description: 'coyote is pathfinding to player for delivery but player moves away'
    expected: 'coyote recalculates path to new player position on next tick'
  - id: coyote-collect-in-cave
    description: 'coyote in collect mode enters cave with player — cave has no ground items'
    expected: 'coyote follows player in cave until items appear or player exits'
  - id: coyote-collect-in-ruin
    description: 'coyote in collect mode enters a ruin with player'
    expected: 'collect mode is suppressed; coyote always follows in Ruin zones regardless of coyoteMode'
  - id: coyote-summon-all-adjacent-blocked
    description: 'summon action but all tiles adjacent to player are blocked or unwalkable'
    expected: 'summon fails silently, coyote stays at current position'
  - id: coyote-spawn-position-blocked
    description: 'at game start, the tile adjacent to player for coyote spawn is blocked'
    expected: 'try all cardinal neighbors of player, place on first walkable unblocked tile'
  - id: coyote-follow-around-corners
    description: 'player walks around an L-shaped corridor — chebyshev distance is small but path distance is large'
    expected: 'coyote follows using path distance, not chebyshev, so it does not stall at corners'
  - id: coyote-follow-no-path
    description: 'coyote cannot pathfind to player (completely walled off)'
    expected: 'coyote idles — no movement, no crash'

  - id: coyote-follow-frequency-deterministic
    description: 'Coyote movement rate is deterministic at 1 step per tick when distance > 3 tiles'
    expected: 'No random jitter; movement frequency is purely a function of distance'

  - id: coyote-overlap-nudge
    description: 'Player walks onto coyote tile, coyote and player overlap temporarily'
    expected: 'Coyote nudges to an adjacent walkable unblocked tile on next follow tick'

  - id: coyote-overlap-nudge-all-blocked
    description: 'Player overlaps coyote but all adjacent tiles are blocked or unwalkable'
    expected: 'Coyote stays overlapping — no crash, nudge retried on subsequent ticks'

failure_conditions:
  - trigger: 'coyote walks onto a Space tile'
    expected: 'coyote position unchanged, Space never entered'
  - trigger: 'player walks onto coyote tile'
    expected: 'movePlayer returns true, player overlaps coyote temporarily, coyote nudges away on next tick'
  - trigger: 'any ground item exists on the map while coyote is in collect mode'
    expected: 'coyote pathfinds to and picks up the item regardless of definitionId'
  - trigger: 'coyote and ghost collide during movement'
    expected: 'blocked position set prevents overlap — both entities respect getBlockedPositions'
  - trigger: 'coyote mode toggled during mid-path movement'
    expected: 'coyote abandons current path and begins new behavior on next tick'

verification:
  test_file: src/engine/__tests__/coyote.test.ts
  test_pattern: 'coyote'
  command: 'npx vitest run src/engine/__tests__/coyote.test.ts'
