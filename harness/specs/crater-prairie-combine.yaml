id: crater-prairie-combine
name: 'Bee+clover combine works on cratered dirt tiles'
status: implemented
priority: high
layer: engine
source_files:
  - src/engine/recipes.ts
  - src/engine/combine.ts
  - src/engine/__tests__/combine.test.ts
dependencies:
  - satellite-impacts
  - satellite-crater-as-effect

behaviors:
  - id: prairie-on-cratered-dirt
    description: >
      When the player combines a bee and clover while standing on a
      cratered dirt tile (posKey in state.craters), the recipe executes
      normally — the 3x3 area around the player is converted to Clover,
      a bee entity spawns, and the ingredients are consumed. Because
      craters are a Set effect on top of Dirt, no special tile-type
      allowlist is needed.
    inputs:
      - 'Player standing on dirt (posKey may be in state.craters)'
      - 'Backpack contains at least one bee and one clover item'
      - 'Combine action triggered (drag-and-drop or combineBeeAndClover)'
    outputs:
      - '3x3 area around player converted to TileType.Clover'
      - 'Bee entity spawned at player position'
      - 'One bee and one clover removed from backpack'
    state_changes:
      - field: map
        effect: 'up to 9 tiles in 3x3 area set to TileType.Clover'
      - field: backpack
        effect: 'one bee and one clover item removed'
      - field: world
        effect: 'new bee entity created at player position'
    determinism: deterministic

  - id: crater-entries-persist-beneath-clover
    description: >
      Cratered dirt tiles in the 3x3 prairie area become Clover just
      like any other dirt tile. The state.craters entries for those
      posKeys persist beneath the new clover — pollution is retained
      even as the surface is replanted.
    inputs:
      - 'Combine executes with cratered dirt tiles in the 3x3 neighborhood'
    outputs:
      - 'Cratered dirt tiles in range become TileType.Clover'
      - 'state.craters entries for those posKeys remain present'
    state_changes:
      - field: map
        effect: 'cratered dirt tiles within 3x3 area set to TileType.Clover'
      - field: craters
        effect: 'unchanged — entries persist'
    determinism: deterministic

edge_cases:
  - id: mixed-cratered-and-uncratered-dirt
    description: '3x3 area contains a mix of cratered dirt, uncratered dirt, and sand tiles'
    expected: 'All dirt tiles (cratered or not) convert to Clover; Sand tiles remain unchanged; crater entries persist'
  - id: all-cratered-3x3
    description: 'All 9 dirt tiles in the 3x3 area are cratered'
    expected: 'All 9 tiles convert to Clover; all crater entries persist'
  - id: standing-on-crater-with-water-neighbor
    description: 'Player on cratered dirt, some neighbors are pond/river tiles'
    expected: 'Water tiles skipped, non-water convertible tiles become Clover, crater entries persist on the replanted tiles'

failure_conditions:
  - trigger: 'Player combines bee+clover while standing on a cratered dirt tile'
    expected: 'Recipe executes successfully'
  - trigger: 'Cratered dirt tile in 3x3 range during prairie combine'
    expected: 'Cratered tile converts to Clover and its crater entry persists in state.craters'

verification:
  test_file: src/engine/__tests__/combine.test.ts
  test_pattern: 'crater'
  command: 'npx vitest run src/engine/__tests__/combine.test.ts'
