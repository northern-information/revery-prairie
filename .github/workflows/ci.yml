name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: |
            node_modules
            worker/node_modules
            shared/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.cache-modules.outputs.cache-hit != 'true'

      - run: npm run typecheck

      - run: npm run lint

      - run: npx vite build

      - run: npm run spec:validate

      - name: harness check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          npm run harness:check
        env:
          HARNESS_BASE: origin/${{ github.base_ref }}

  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: |
            node_modules
            worker/node_modules
            shared/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.cache-modules.outputs.cache-hit != 'true'

      - run: npx vitest run --project engine

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: |
            node_modules
            worker/node_modules
            shared/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.cache-modules.outputs.cache-hit != 'true'

      - run: npx vitest run --project ui
